<style>
:root{--bg:#ECE9E1;--surface:#FAF8F3;--ink:#1C2330;--ink-2:#59606B;--line:#D3CEC2;--teal:#22406A;
  --serif:"Barlow Condensed","Arial Narrow",sans-serif;--sans:"Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#12161C;--surface:#1A1F27;--ink:#E7E4DB;--ink-2:#A0A5AE;--line:#343C48;--teal:#93B4E4}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased}
main{max-width:42rem;margin:0 auto;padding:clamp(1.5rem,6vw,4rem) 16px calc(3rem + env(safe-area-inset-bottom))}
a{color:var(--teal)}
.home{font-family:var(--serif);font-weight:700;font-size:1.1rem;letter-spacing:.04em;text-transform:uppercase;background:var(--ink);color:var(--bg);padding:.28em .55em .22em;border-radius:2px;text-decoration:none}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(2rem,6vw,2.8rem);line-height:1.1;letter-spacing:0;margin:2rem 0 .4rem}
h2{font-size:1.1rem;margin:2.2rem 0 .4rem}
p,li{color:var(--ink-2)}
b{color:var(--ink)}
.lead{font-family:var(--serif);font-size:1.15rem;color:var(--ink)}
ul{padding-left:1.2rem}
table{width:100%;border-collapse:collapse;margin:.6rem 0;font-size:.95rem}
th,td{text-align:left;vertical-align:top;padding:.55rem .6rem .55rem 0;border-bottom:1px solid var(--line)}
th{color:var(--ink);font-weight:600;white-space:nowrap}
td{color:var(--ink-2)}
@media (max-width:520px){table,tbody,tr,th,td{display:block}th{padding-bottom:0;border:0}}
.date{font-size:.9rem}
.box{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1rem 1.2rem;margin:1.4rem 0}
.box ul{margin:.2rem 0;padding-left:1.1rem}.box li{margin:.35rem 0}
</style>
</head>
<body>

  <div class="box"><b>The short version</b>
<!--SUMMARY-->

</main>
