<style>
:root{--bg:#E6EDF0;--surface:#FBFCFC;--surface-2:#EDF2F4;--ink:#152238;--ink-2:#4D5A6F;--line:#CAD5DB;--teal:#2449A8;--teal-ink:#fff;--red:#B3342B;--red-bg:#F8E1DE;--good:#2B7249;--good-bg:#E0F0E6;--amber:#A96C0E;--amber-bg:#FBEFD6;
  --serif:"Barlow Condensed","Arial Narrow",sans-serif;--sans:"Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161C;--surface:#1A1F27;--surface-2:#212833;--ink:#E7E4DB;--ink-2:#A0A5AE;--line:#343C48;--teal:#93B4E4;--teal-ink:#0F1B2C;--red:#F0766B;--red-bg:#3b1d1b;--good:#72c692;--good-bg:#16301f;--amber:#E9AE4E;--amber-bg:#35291a}}
:root[data-theme="dark"]{--bg:#12161C;--surface:#1A1F27;--surface-2:#212833;--ink:#E7E4DB;--ink-2:#A0A5AE;--line:#343C48;--teal:#93B4E4;--teal-ink:#0F1B2C;--red:#F0766B;--red-bg:#3b1d1b;--good:#72c692;--good-bg:#16301f;--amber:#E9AE4E;--amber-bg:#35291a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
main{max-width:52rem;margin:0 auto;padding:clamp(1.2rem,5vw,3rem) 16px calc(5rem + env(safe-area-inset-bottom))}
a{color:var(--teal)}
.home{font-family:var(--serif);font-weight:700;font-size:1.1rem;letter-spacing:.04em;text-transform:uppercase;background:var(--ink);color:var(--bg);padding:.28em .55em .22em;border-radius:2px;text-decoration:none}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.9rem,6vw,2.6rem);line-height:1.1;letter-spacing:0;margin:1.6rem 0 .3rem}
h2{font-size:1.15rem;margin:2.4rem 0 .6rem}
h3{font-size:1rem;margin:0}
p{margin:.5rem 0}
.muted{color:var(--ink-2)}
.meta{display:flex;flex-wrap:wrap;gap:.4rem .6rem;margin-top:.6rem}
.chip{display:inline-flex;align-items:center;padding:.15em .6em;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--surface-2);border:1px solid var(--line)}
.chip.awaiting{background:var(--amber-bg);border-color:transparent;color:var(--amber)}
.chip.reviewed{background:var(--good-bg);border-color:transparent;color:var(--good)}
.chip.changed{background:var(--red-bg);border-color:transparent;color:var(--red)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem 1.1rem;margin:.8rem 0}
.how ol{margin:.4rem 0 0;padding-left:1.2rem}.how li{margin:.2rem 0}
label{display:block;font-weight:600;font-size:.9rem;margin:.7rem 0 .25rem}
input[type=text],input[type=email],textarea,select{width:100%;min-height:44px;padding:.5em .7em;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:5rem;resize:vertical}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:0 1rem}
details.pt{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:.6rem 0}
details.pt>summary{cursor:pointer;padding:.85rem 1rem;font-weight:600;list-style-position:inside}
details.pt>div{padding:0 1rem 1rem}
table{width:100%;border-collapse:collapse;font-size:.88rem;margin:.4rem 0}
th,td{text-align:left;vertical-align:top;padding:.35rem .5rem .35rem 0;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--ink-2);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
.scroll{overflow-x:auto}
ul.plain{margin:.3rem 0;padding-left:1.1rem}
.dec{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:.85rem 1rem;margin:.6rem 0}
.dec.pos{border-left-color:var(--good)}.dec.neg{border-left-color:var(--red)}
.dec .top{display:flex;flex-wrap:wrap;gap:.3rem .5rem;align-items:center;font-size:.78rem;color:var(--ink-2);font-weight:600}
.pts{font-weight:700;padding:.05em .45em;border-radius:4px;background:var(--surface-2)}
.pos .pts{color:var(--good);background:var(--good-bg)}.neg .pts{color:var(--red);background:var(--red-bg)}
.dec b{display:block;margin:.35rem 0 .15rem;font-size:1rem}
.dec .why{font-family:var(--sans);color:var(--ink-2);margin:0}
.dec .src{font-size:.75rem;color:var(--ink-2);margin-top:.35rem}
.verdict{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.7rem}
.verdict button{min-height:40px;padding:.35em .9em;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer}
.verdict button[aria-pressed="true"][data-v="ok"]{background:var(--good);border-color:var(--good);color:var(--teal-ink)}
.verdict button[aria-pressed="true"][data-v="fix"]{background:var(--red);border-color:var(--red);color:var(--teal-ink)}
.verdict button[aria-pressed="true"][data-v="unsure"]{background:var(--amber);border-color:var(--amber);color:var(--teal-ink)}
.dec textarea{margin-top:.5rem;min-height:3.6rem}
.opt{padding:.4rem 0;border-bottom:1px solid var(--line);font-size:.92rem}.opt:last-child{border:0}
.opt i{font-style:normal;font-weight:700;font-size:.75rem;padding:.05em .4em;border-radius:4px;margin-right:.4rem;background:var(--surface-2)}
.bar{position:sticky;top:0;z-index:5;margin:0 -16px;padding:.6rem 16px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:.6rem;font-size:.9rem}
.bar .prog{display:block;flex:1;min-width:4rem;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;max-width:12rem}.bar .prog i{display:block;height:100%;background:var(--teal)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:.55em 1.2em;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn-primary{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.row{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1rem}
.check{display:flex;gap:.6rem;align-items:flex-start;font-weight:500;margin-top:1rem}
.check input{width:1.2rem;height:1.2rem;margin-top:.2rem;flex:none}
.msg{margin-top:.8rem;font-weight:600}.msg.err{color:var(--red)}.msg.ok{color:var(--good)}
pre{white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:.8rem;font-size:.8rem;max-height:18rem;overflow:auto}
.shifts a{display:block;text-decoration:none;color:inherit}
.shifts .card:hover{border-color:var(--ink-2)}
</style>
<style>.item .body p{margin:.15rem 0}.item .body .why{color:var(--ink-2);font-size:.92rem;margin:0 0 .35rem 1.1rem}.item .body .ok b{display:inline;margin:0;color:var(--good)}.item .body .no{color:var(--ink)}.item .body .sp{height:.5rem}.item>b{margin-bottom:.5rem}</style></head>

seize if it keeps falling.", "Pearl: Sweaty and confused on insulin: check a glucose now, and treat a low before anything else. If he can't swallow, IV dextrose or glucagon."], "st": "awaiting"}, {"id": "drill:wf-compartment", "hash": "9113a09a1d", "title": "Ortho, 02:00", "body": ["Who first?", "", "✓ FIRST Mr. Sato, 27: Tibia fracture in a cast. Pain 10 despite opioids, worse when you move his toes. Toes pale.", "- Mrs. Fair, 74: Hip replacement day 2. Pain 7 when she turns, leg looks normal.", "  Not first: Expected pain with movement; treat it soon.", "- Mr. Lowe, 55: Spine fusion. Pain 6, wants to try walking.", "  Not first: Stable; get help to walk him soon.", "- Ms. Hart, 49: Knee replacement. Drain output 40 mL in 4 hours.", "  Not first: Expected drainage.", "", "Why: Pain out of proportion to the injury, worse on passive stretch, with pale toes, is compartment syndrome. Muscle and nerve can die within hours.", "Pearl: Compartment syndrome: pain out of proportion and pain on passive stretch come first. Pulselessness is late. Don't elevate above the heart; call the surgeon now."], "st": "awaiting"}, {"id": "drill:wf-burn-airway", "hash": "9479de859a", "title": "ED, 19:00", "body": ["Burns from a house fire. Who first?", "", "✓ FIRST Mr. Clay, 45: Singed nose hair, soot in his mouth, voice getting hoarse.", "- Ms. Clay, 42: Blistered burns over 15% of her body. Pain 9.", "  Not first: Needs fluids and pain control soon, but a burned airway can close first.", "- Teddy Clay, 12: Coughing after the fire. SpO₂ 97% on room air. Carbon monoxide level pending.", "  Not first: Give high-flow oxygen while the level comes back; he's protecting his airway.", "- Mr. Pike, 70: Neighbor. Mild cough, no burns, SpO₂ 98%.", "  Not first: Stable; keep an eye on him.", "", "Why: Hoarseness and soot after a fire mean the airway is burned and swelling. It can close within hours, and intubating gets harder every minute.", "Pearl: Burns: airway first. Singed facial hair, soot, hoarseness or stridor means early intubation. Painful burns look worse, but airways kill."], "st": "awaiting"}, {"id": "drill:wf-dysreflexia", "hash": "c0a7162fd7", "title": "Rehab, 16:00", "body": ["Who first?", "", "✓ FIRST Mr. Owusu, 31: Spinal cord injury at T4. Pounding headache, flushed face, BP 212/112.", "- Mrs. Kline, 68: Stroke rehab. Coughing during lunch, voice sounds wet.", "  Not first: Possible aspiration: stop the meal and assess soon. But 212/112 can cause a stroke now.", "- Mr. Vega, 50: Amputation. Small spot of drainage on the stump dressing.", "  Not first: Mark and monitor.", "- Ms. Ito, 40: Brain injury rehab. Restless this afternoon, pulling at her helmet strap, easily redirected.", "  Not first: Redirect her soon; she's safe.", "", "Why: A spinal cord injury at T6 or above, a pounding headache and a very high blood pressure is autonomic dysreflexia. It can cause a stroke.", "Pearl: Autonomic dysreflexia: sit them up, loosen anything tight, find the trigger (usually a full bladder or bowel), and call. The cause below the injury is the treatment."], "st": "awaiting"}, {"id": "drill:wf-icp", "hash": "093cdeecbb", "title": "Neuro, 05:00", "body": ["Who first?", "", "✓ FIRST Mr. Reed, 23: Head injury yesterday. Right pupil now larger than the left and slow. Harder to wake.", "- Mrs. Gold, 66: Old stroke. Left-sided weakness, unchanged. BP 168/92.", "  Not first: Unchanged deficits; report the pressure.", "- Mr. Doe, 45: Seizure yesterday. Phenytoin level low this morning.", "  Not first: Needs a dose change today; no seizure now.", "- Ms. Ng, 30: Migraine. Pain 8 of 10, asking for her dose early.", "  Not first: A familiar pattern; treat after the new neuro change.", "", "Why: A new unequal, sluggish pupil and falling level of consciousness after a head injury means pressure in the skull is rising. It can lead to herniation.", "Pearl: In neuro patients, change is what matters. A new dilated pupil or a drop in level of consciousness: call now, head of bed up 30 degrees, keep the neck straight."], "st": "awaiting"}, {"id": "drill:wf-tension", "hash": "8e61bfc49a", "title": "Surgical, 15:00", "body": ["Who first?", "", "✓ FIRST Mr. Banks, 52: Chest tube clamped for transport. Now struggling to breathe, trachea shifted, BP 84/50.", "- Mrs. Holt, 63: Chest tube with continuous bubbling in the water seal chamber.", "  Not first: Look for an air leak in the system soon; she's breathing comfortably.", "- Mr. Kerr, 40: Lobectomy yesterday. Pain 7 when he coughs, SpO₂ 93%.", "  Not first: Treat the pain so he can cough; stable.", "- Ms. Diaz, 58: Chest tube. Water in the seal chamber rises and falls as she breathes.", "  Not first: Tidaling is normal.", "", "Why: A clamped chest tube, severe breathlessness, a shifted trachea and low blood pressure is a tension pneumothorax. Air is crushing the heart and the other lung.", "Pearl: Never leave a chest tube clamped. Sudden distress, tracheal shift and hypotension: unclamp, call a rapid response, and prepare for needle decompression."], "st": "awaiting"}, {"id": "drill:wf-transfusion", "hash": "797587b195", "title": "Oncology, 09:20", "body": ["Who first?", "", "✓ FIRST Mrs. Moss, 61: 15 minutes into a blood transfusion. Chills, back pain, temp 38.6.", "- Mr. Lin, 55: Platelets 22,000. A few new bruises.", "  Not first: Bleeding precautions and report; no active bleeding.", "- Ms. Ray, 47: Nausea 6, vomited once. Antiemetic due.", "  Not first: Treat soon; stable.", "- Mr. Day, 73: Port site red and tender since this morning. Temp 37.9, feels well otherwise.", "  Not first: Possible line infection to report and culture. A hemolytic reaction worsens every minute.", "", "Why: Chills, fever and back pain early in a transfusion suggest a hemolytic reaction. Every extra milliliter makes it worse.", "Pearl: Transfusion reaction: stop the blood, keep the line open with saline through new tubing, check vitals, call, and send the bag back to the blood bank."], "st": "awaiting"}, {"id": "drill:wf-acs-sickle", "hash": "061cb39d89", "title": "Pediatrics, 12:00", "body": ["Who first?", "", "✓ FIRST Marcus, 15: Sickle cell crisis. New chest pain, temp 38.4, SpO₂ 90%.", "- Sara, 7: Appendectomy yesterday. Temp 38.2, pain 5.", "  Not first: Low-grade fever after surgery: deep breathing and monitoring.", "- Ben, 3: Croup, improving. Barky cough, no stridor at rest.", "  Not first: Improving; keep watching.", "- Ava, 11: Type 1 diabetes. Glucose 285, small ketones, alert and drinking.", "  Not first: Needs insulin per orders and fluids; she's alert and talking.", "", "Why: Chest pain, fever and low oxygen in sickle cell disease is acute chest syndrome, a leading cause of death in sickle cell.", "Pearl: Sickle cell: new chest pain, fever, cough or low SpO₂ is acute chest syndrome until proven otherwise. Oxygen, pain control, incentive spirometry, and call."], "st": "awaiting"}, {"id": "drill:wf-h-surg", "hash": "b12d15919d", "title": "Surgical, 08:00 · NCLEX level", "body": ["Every one of them has something. Who first?", "", "✓ FIRST Mr. Pace, 61: Day 2 after bowel resection. Abdomen rigid, HR 118, temp 38.6.", "- Mrs. Cho, 77: Day 1 after hip replacement. Pain 9 of 10, last dose 3 hours ago.", "  Not first: Severe pain needs treatment soon, but it's expected and her vitals are stable. A rigid abdomen with fever and tachycardia is a leak until proven otherwise.", "- Mr. Neal, 68: COPD. SpO₂ 87% on 2 L, baseline 88 to 92. Pursed-lip breathing, comfortable.", "  Not first: Just under his range, comfortable. Recheck and adjust oxygen per orders; not first.", "- Mrs. Ruiz, 72: Heart failure. Weight up 1.5 kg overnight. Lungs clear, SpO₂ 96%.", "  Not first: Report the gain today. With clear lungs and normal oxygen she isn't in distress.", "", "Why: A rigid abdomen, fever and tachycardia after bowel surgery suggest an anastomotic leak and peritonitis. It can turn into septic shock fast.", "Pearl: After abdominal surgery: a rigid abdomen with fever and rising heart rate is a surgical emergency. Pain, expected findings and stable chronic conditions wait."], "st": "awaiting"}, {"id": "drill:wf-h-psych", "hash": "5b327926bd", "title": "Adult psych, 13:00 · NCLEX level", "body": ["Who first?", "", "✓ FIRST Nina, 44: On lithium. Vomited twice since lunch, coarse tremor, mixing up words.", "- Carl, 35: Paranoid, refusing his meds, shouting in his room. Not approaching anyone.", "  Not first: Give him space and a calm check-in soon. He's contained and not a danger to others right now.", "- Pia, 22: Admitted 3 days ago after an overdose. Asking for a razor to shave her legs.", "  Not first: Safety matters: she can shave with supervision per policy. A medical emergency comes first.", "- Ray, 51: Alcohol use disorder, day 4. CIWA 7, asking for coffee.", "  Not first: A low score on day 4: withdrawal is easing. Keep scoring.", "", "Why: Vomiting, a coarse tremor and new confusion on lithium are toxicity. It can progress to seizures and kidney damage.", "Pearl: On a psych unit, medical emergencies come first: toxicity, NMS, withdrawal, overdose. Safety requests and refusals follow."], "st": "awaiting"}, {"id": "drill:wf-h-ld", "hash": "c6118992bf", "title": "Labor and delivery, 22:00 · NCLEX level", "body": ["Who first?", "", "✓ FIRST Ms. Ward, 30: 34 weeks, placenta previa. Sudden painless bright red bleeding.", "- Mrs. Ali, 27: Preterm labor on magnesium. RR 14, knee reflexes 2+, warm and flushed.", "  Not first: Flushing and warmth are expected with magnesium. Breathing and reflexes are fine.", "- Ms. Pope, 33: 39 weeks, 6 cm, epidural just placed. BP 98/58. Fetal heart rate 140s.", "  Not first: Common after an epidural: tilt her, fluids per orders. The baby is tolerating it.", "- Mrs. Dunn, 36: Postpartum day 1. Fundus firm 1 cm below the umbilicus. Moderate lochia rubra.", "  Not first: Normal findings for day 1.", "", "Why: Painless bright red bleeding with a previa can become a hemorrhage quickly for both mother and baby.", "Pearl: Placenta previa: painless bright red bleeding. Never do a vaginal exam. Abruption: painful, a rigid uterus, sometimes concealed bleeding."], "st": "awaiting"}, {"id": "drill:wf-h-cardiac", "hash": "8f48c44e2c", "title": "Cardiac step-down, 04:00 · NCLEX level", "body": ["Who first?", "", "✓ FIRST Mr. Byrne, 66: Two days after an MI. New loud murmur, short of breath, crackles to mid-lung.", "- Mrs. Fry, 74: Atrial fibrillation on a diltiazem drip. Rate 112, BP 116/70.", "  Not first: Rate a bit high but blood pressure fine; titrate per protocol soon.", "- Mr. Okon, 59: Heart failure. K 3.3 on furosemide. Rhythm sinus.", "  Not first: Replace per protocol and report soon; no rhythm change.", "- Ms. Ito, 52: Admitted for chest pain. Now 2 of 10, same as on arrival. Troponin negative twice.", "  Not first: Unchanged and ruled out so far; reassess, not first.", "", "Why: A new murmur and sudden pulmonary edema days after an MI suggests papillary muscle rupture or a ventricular septal rupture. Both need surgery urgently.", "Pearl: After an MI, a new murmur with sudden heart failure is a mechanical complication. Call immediately."], "st": "awaiting"}, {"id": "drill:wf-h-peds", "hash": "640a899467", "title": "Pediatrics, 20:00 · NCLEX level", "body": ["Who first?", "", "✓ FIRST Baby Rose, 6 wks: 6 weeks old. Temp 38.3. Feeding poorly, sleepier than usual.", "- Kai, 4: Asthma. SpO₂ 93%, mild wheeze 20 minutes after his nebulizer.", "  Not first: Mild and improving; reassess after the neb finishes working.", "- Luca, 10: Femur fracture in traction. Pain 6. Toes pink and warm.", "  Not first: Treat his pain soon; circulation is good.", "- Amara, 15: Appendectomy yesterday. Temp 38.1, eating crackers.", "  Not first: A low-grade temperature after surgery; encourage deep breaths and recheck.", "", "Why: Any fever in an infant under about 2 to 3 months, with poor feeding or sleepiness, can be sepsis or meningitis. Infants show few other signs.", "Pearl: Young infants with fever get a full workup fast. Lethargy and poor feeding are danger signs at any age."], "st": "awaiting"}, {"id": "drill:wf-h-neuro", "hash": "7fb9348988", "title": "Neuro, 15:00 · NCLEX level", "body": ["Who first?", "", "✓ FIRST Mr. Shaw, 42: Guillain-Barré. Vital capacity down from 2.2 L to 1.4 L since this morning.", "- Ms. Rios, 38: Myasthenia gravis. Drooping eyelids, worse at the end of the day.", "  Not first: Fatigue worse late in the day is typical. Watch her breathing and swallowing, but this is her pattern.", "- Mr. Gray, 76: Parkinson's. Freezing when he walks; fell yesterday without injury.", "  Not first: Fall precautions and PT soon; stable now.", "- Mrs. Lee, 34: Multiple sclerosis. Blurry vision in one eye since yesterday.", "  Not first: Possibly a relapse to report today. Not an airway threat.", "", "Why: A falling vital capacity in Guillain-Barré means the breathing muscles are weakening. Many need intubation before oxygen levels fall.", "Pearl: Guillain-Barré and myasthenic crisis: follow vital capacity and negative inspiratory force, not just SpO₂. A falling trend means call now."], "st": "awaiting"}, {"id": "drill:wf-h-endo", "hash": "acc548e41c", "title": "Med-surg, 18:00 · NCLEX level", "body": ["Who first?", "", "✓ FIRST Ms. Grant, 46: Thyroidectomy this morning. Muscle cramps. Her cheek twitches when you tap it.", "- Mr. Vos, 63: SIADH. Sodium 131, alert, on a fluid restriction.", "  Not first: Mildly low and improving on treatment. Keep the restriction.", "- Mrs. Kahn, 55: On high-dose steroids. Glucose 260 before dinner.", "  Not first: Expected with steroids. Correction insulin per orders.", "- Mr. Bose, 48: Addison's disease. Evening hydrocortisone due. BP 116/72, feels fine.", "  Not first: Give it on time; he's stable now.", "", "Why: Muscle cramps and a positive Chvostek sign after thyroid surgery suggest low calcium from parathyroid injury. It can progress to laryngospasm and seizures.", "Pearl: After thyroid or parathyroid surgery: tingling, cramps, Chvostek or Trousseau sign mean check calcium and have IV calcium ready."], "st": "awaiting"}, {"id": "drill:wf-h-renal", "hash": "4bd7c850dc", "title": "Renal, 06:00 · NCLEX level", "body": ["Who first?", "", "✓ FIRST Mr. Akins, 58: On dialysis, missed yesterday's session. Weak. K 6.4, HR 52.", "- Mrs. Reed, 49: Peritoneal dialysis. Cloudy drainage this morning, temp 37.6.", "  Not first: Possible peritonitis: cultures and antibiotics today. Hyperkalemia with a slowing heart can stop it now.", "- Mr. Tan, 66: Kidney biopsy yesterday. Mild flank pain, urine light pink.", "  Not first: A little blood is expected after a biopsy. Watch the vitals and the color.", "- Ms. Ford, 71: Acute kidney injury on IV fluids. Urine output 40 mL/hr, up from 20.", "  Not first: Improving. Keep going.", "", "Why: A potassium of 6.4 with a slow heart rate means the potassium is affecting the heart. It can cause a fatal rhythm.", "Pearl: Dialysis patients who miss treatment: think potassium and fluid. Hyperkalemia with bradycardia or ECG changes is an emergency."], "st": "awaiting"}, {"id": "drill:wf-h-geri", "hash": "dfe88f5c70", "title": "Geriatrics, 11:00 · NCLEX level", "body": ["Who first?", "", "✓ FIRST Mrs. Hale, 84: On warfarin. Fell an hour ago, hit her head. Now asking the same question over and over.", "- Mr. Brook, 88: Dementia. Trying to leave the unit to \"go to work.\"", "  Not first: A safety risk: redirect him soon. He's calm and walking.", "- Mrs. Toll, 79: Hip fracture, waiting for surgery. Pain 7, last dose 2 hours ago.", "  Not first: Pain to treat soon; expected and stable.", "- Mr. Webb, 90: Stage 2 pressure injury on his sacrum. Dressing soiled.", "  Not first: Change it soon; not urgent.", "", "Why: A head strike on an anticoagulant, with new repetitive questioning, can be a bleed in the skull. Older adults can bleed slowly and look fine at first.", "Pearl: Anticoagulant plus a fall with head strike: neuro checks and a CT, even if they look okay. New confusion is a red flag."], "st": "awaiting"}, {"id": "drill:wf-h-resp", "hash": "ff2c3011f7", "title": "Pulmonary, 09:00 · NCLEX level", "body": ["Who first?", "", "✓ FIRST Mrs. Vance, 67: Pneumonia. RR 30, SpO₂ 91% on 4 L, using her neck muscles. Says she's tired.", "- Mr. Oyelaran, 70: COPD. SpO₂ 88% on 2 L, his baseline. Thick yellow sputum.", "  Not first: At his baseline. Sputum culture and treatment per orders.", "- Ms. Hart, 24: Asthma. Peak flow 70% of her best after a nebulizer.", "  Not first: Moderate and responding. Reassess.", "- Mr. Lane, 58: Pleural effusion. Chest tube drained 300 mL of yellow fluid since morning.", "  Not first: Expected after placement; monitor the amount.", "", "Why: Fast breathing, accessory muscle use and fatigue mean she's tiring. Respiratory failure can follow even while her saturation looks acceptable.", "Pearl: Work of breathing and fatigue predict respiratory failure before SpO₂ falls. \"I'm tired\" from a patient breathing 30 times a minute is an emergency."], "st": "awaiting"}]}, "packs": [{"id": "drill-med-1", "title": "Drills: Med Pass, part 1 of 2", "sub": "What to check before a medication, then give, hold or call. A pharmacist is especially welcome.", "n": 25, "reviewed": 0, "changed": 0}, {"id": "drill-med-2", "title": "Drills: Med Pass, part 2 of 2", "sub": "What to check before a medication, then give, hold or call. A pharmacist is especially welcome.", "n": 25, "reviewed": 0, "changed": 0}, {"id": "drill-first-1", "title": "Drills: Who's First, part 1 of 2", "sub": "Four patients, one nurse: who do you see first, and why not the others.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "drill-first-2", "title": "Drills: Who's First, part 2 of 2", "sub": "Four patients, one nurse: who do you see first, and why not the others.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "drill-sbar", "title": "Drills: SBAR", "sub": "Building a call to the provider line by line, and the order that comes back.", "n": 20, "reviewed": 0, "changed": 0}, {"id": "drill-calm", "title": "Drills: De-escalation", "sub": "What to say to an agitated patient, turn by turn. Psych or ED experience fits best.", "n": 22, "reviewed": 0, "changed": 0}, {"id": "ngn-shift-1", "title": "NCLEX questions after each shift, part 1 of 3", "sub": "Five per shift, including the two harder NCLEX challenge items.", "n": 19, "reviewed": 0, "changed": 0}, {"id": "ngn-shift-2", "title": "NCLEX questions after each shift, part 2 of 3", "sub": "Five per shift, including the two harder NCLEX challenge items.", "n": 19, "reviewed": 0, "changed": 0}, {"id": "ngn-shift-3", "title": "NCLEX questions after each shift, part 3 of 3", "sub": "Five per shift, including the two harder NCLEX challenge items.", "n": 17, "reviewed": 0, "changed": 0}, {"id": "bank-ms-1", "title": "NCLEX question bank: Medical-surgical, part 1 of 3", "sub": "68 standalone practice questions.", "n": 23, "reviewed": 0, "changed": 0}, {"id": "bank-ms-2", "title": "NCLEX question bank: Medical-surgical, part 2 of 3", "sub": "68 standalone practice questions.", "n": 23, "reviewed": 0, "changed": 0}, {"id": "bank-ms-3", "title": "NCLEX question bank: Medical-surgical, part 3 of 3", "sub": "68 standalone practice questions.", "n": 22, "reviewed": 0, "changed": 0}, {"id": "bank-ed", "title": "NCLEX question bank: Emergency", "sub": "23 standalone practice questions.", "n": 23, "reviewed": 0, "changed": 0}, {"id": "bank-comm", "title": "NCLEX question bank: Community and fundamentals", "sub": "21 standalone practice questions.", "n": 21, "reviewed": 0, "changed": 0}, {"id": "bank-icu", "title": "NCLEX question bank: Critical care", "sub": "21 standalone practice questions.", "n": 21, "reviewed": 0, "changed": 0}, {"id": "bank-sd", "title": "NCLEX question bank: Cardiac and step-down", "sub": "19 standalone practice questions.", "n": 19, "reviewed": 0, "changed": 0}, {"id": "bank-peds", "title": "NCLEX question bank: Pediatrics", "sub": "17 standalone practice questions.", "n": 17, "reviewed": 0, "changed": 0}, {"id": "bank-ob", "title": "NCLEX question bank: Obstetrics and newborn", "sub": "15 standalone practice questions.", "n": 15, "reviewed": 0, "changed": 0}, {"id": "bank-psy", "title": "NCLEX question bank: Psychiatric", "sub": "11 standalone practice questions.", "n": 11, "reviewed": 0, "changed": 0}, {"id": "bank-periop", "title": "NCLEX question bank: Perioperative", "sub": "7 standalone practice questions.", "n": 7, "reviewed": 0, "changed": 0}, {"id": "cases-1", "title": "Case studies: Pneumonia that turns septic; Heart failure that tips over; New diabetes in DKA", "sub": "Unfolding case studies: one client, six questions in clinical judgment order.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "cases-2", "title": "Case studies: Hip replacement with a clot that travels; Variceal bleed in cirrhosis; Stroke alert in the ED", "sub": "Unfolding case studies: one client, six questions in clinical judgment order.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "cases-3", "title": "Case studies: Preeclampsia that turns severe; Infant with gastroenteritis and dehydration; House fire with inhalation injury", "sub": "Unfolding case studies: one client, six questions in clinical judgment order.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "cases-4", "title": "Case studies: Ankle fracture that turns into alcohol withdrawal; Stomach bug that ends in hyperkalemia; New antibiotic that triggers serotonin syndrome", "sub": "Unfolding case studies: one client, six questions in clinical judgment order.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "cases-5", "title": "Case studies: COPD flare with pneumonia; Bleeding after a hysterectomy; Head injury after a motorcycle crash", "sub": "Unfolding case studies: one client, six questions in clinical judgment order.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "cases-6", "title": "Case studies: Placental abruption at 34 weeks; Preterm labor at 31 weeks; Bacterial meningitis in a preschooler", "sub": "Unfolding case studies: one client, six questions in clinical judgment order.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "cases-7", "title": "Case studies: Fever and rigidity on haloperidol", "sub": "Unfolding case studies: one client, six questions in clinical judgment order.", "n": 6, "reviewed": 0, "changed": 0}]};</script><script>(()=>{const v=window.Shift||{},d=v.tel,h=window.RI||{packs:[]},p=document.getElementById("app"),i=e=>String(e??"").replace(/[&<>"']/g,a=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[a]),k={awaiting:"Awaiting clinical review",reviewed:"Clinically reviewed",changed:"Changed since its review"},f=e=>(e.reviewed===e.n?'<span class="chip reviewed">Clinically reviewed</span>':`<span class="chip awaiting">${e.reviewed} of ${e.n} reviewed</span>`)+(e.changed?` <span class="chip changed">${e.changed} changed since review</span>`:"");if(!h.pack){const e=[["Drills",a=>a.id.startsWith("drill-")],["NCLEX questions after each shift",a=>a.id.startsWith("ngn-shift")],["NCLEX question bank",a=>a.id.startsWith("bank-")],["Unfolding case studies",a=>a.id.startsWith("cases-")]];p.innerHTML=`<a class="home" href="/">The Shift</a><h1>Clinical review: practice content</h1>
      <p class="muted">The drills and NCLEX practice questions, split into packs a clinician can check in one sitting (about 30 to 45 minutes each). Each item shows the right answer and why every other option is wrong. Pick a pack that matches your experience.</p>
      <p><a href="/review/">Reviewing a whole shift instead? Shift reviews are here.</a></p>
      ${e.map(([a,s])=>{const o=h.packs.filter(s);return o.length?`<h2>${i(a)}</h2><div class="shifts">${o.map(c=>`<a href="/review/practice/${i(c.id)}/"><div class="card"><div style="display:flex;justify-content:space-between;gap:.6rem;flex-wrap:wrap"><h3>${i(c.title)}</h3><span>${f(c)}</span></div><p class="muted" style="margin:.3rem 0 0">${c.n} items. ${i(c.sub)}</p></div></a>`).join("")}</div>`:""}).join("")}`;return}const n=h.pack,g="theshift.review.items."+n.id;let t={};try{t=JSON.parse(localStorage.getItem(g)||"{}")||{}}catch{t={}}t.marks=t.marks||{},t.notes=t.notes||{};const m=()=>{try{localStorage.setItem(g,JSON.stringify(t))}catch{}},E=e=>e?/^  /.test(e)?`<p class="why">${i(e.trim())}</p>`:/^✓/.test(e)?`<p class="ok"><b>${i(e)}</b></p>`:/^(- ✗|- |✗)/.test(e)?`<p class="no">${i(e.replace(/^- /,""))}</p>`:`<p>${i(e)}</p>`:'<div class="sp"></div>',x=e=>`<div class="verdict" role="group" aria-label="Your verdict">${[["ok","Accurate"],["fix","Needs change"],["unsure","Not sure"]].map(([a,s])=>`<button type="button" data-rid="${i(e)}" data-v="${a}" aria-pressed="${t.marks[e]===a}">${s}</button>`).join("")}</div>
    <textarea data-note="${i(e)}" placeholder="What should it say instead? A source helps." ${t.marks[e]==="fix"||t.notes[e]?"":"hidden"} aria-label="Your comment">${i(t.notes[e]||"")}</textarea>`,S=(e,a)=>`<div class="dec item" id="i-${a+1}"><div class="top"><span class="pts">${a+1}</span><span class="chip ${e.st}">${i(k[e.st])}${e.by?`: ${i(e.by)}`:""}</span><span>${i(e.id)} · version ${i(e.hash)}</span></div>
      <b>${i(e.title)}</b><div class="body">${e.body.map(E).join("")}</div>${x(e.id)}</div>`,r=n.items.map(e=>e.id);p.innerHTML=`<a class="home" href="/review/practice/">The Shift · Practice review</a>
    <h1>${i(n.title)}</h1>
    <p class="muted" style="margin:0">${i(n.sub)}</p>
    <div class="meta">${f(h.packs.find(e=>e.id===n.id)||{n:r.length,reviewed:0,changed:0})}<span class="chip">${r.length} items</span></div>
    <div class="card how"><h3>How to review</h3><ol>
      <li>For each item, check that the marked answer is right, that every other option is clearly wrong (not just slightly less good), that the numbers are current, and that any tip is safe to remember as a rule.</li>
      <li>Mark <b>Accurate</b>, <b>Needs change</b> or <b>Not sure</b>. Say what's wrong when something needs changing.</li>
      <li>Add your details and any references, then send. Your answers save in this browser as you go, so you can stop and come back.</li></ol>
      <p class="muted" style="margin-bottom:0">These are practice items for nursing students, written to common US teaching. Judge them against what a safe, current standard of care would teach a new nurse, not your facility's policy.</p></div>
    <div class="bar"><span id="count"></span><span class="prog" aria-hidden="true"><i id="progbar"></i></span><a class="btn" href="#send" style="min-height:38px">Send</a></div>
    <h2>About you</h2>
    <div class="grid2"><div><label for="rv-name">Name</label><input id="rv-name" type="text" autocomplete="name" data-f="name" value="${i(t.name||"")}"></div>
      <div><label for="rv-cred">Credentials</label><input id="rv-cred" type="text" placeholder="RN, MSN, PharmD…" data-f="cred" value="${i(t.cred||"")}"></div>
      <div><label for="rv-role">Current role and specialty</label><input id="rv-role" type="text" placeholder="Med-surg RN, 6 years; nurse educator…" data-f="role" value="${i(t.role||"")}"></div>
      <div><label for="rv-email">Email</label><input id="rv-email" type="email" autocomplete="email" data-f="email" value="${i(t.email||"")}"></div></div>
    <h2>Items</h2>${n.items.map(S).join("")}
    <h2 id="send">Send your review</h2>
    <label for="rv-refs">References you'd cite</label><textarea id="rv-refs" data-f="refs" placeholder="Guidelines, drug references or textbooks that support or contradict the content">${i(t.refs||"")}</textarea>
    <label for="rv-overall">Anything else</label><textarea id="rv-overall" data-f="overall" placeholder="Patterns you noticed, items a new grad would find unfair, anything missing">${i(t.overall||"")}</textarea>
