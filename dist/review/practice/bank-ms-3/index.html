<style>
:root{--bg:#ECE9E1;--surface:#FAF8F3;--surface-2:#F1EEE6;--ink:#1C2330;--ink-2:#59606B;--line:#D3CEC2;--teal:#22406A;--teal-ink:#fff;--red:#B3342B;--red-bg:#F8E1DE;--good:#2B7249;--good-bg:#E0F0E6;--amber:#A96C0E;--amber-bg:#FBEFD6;
  --serif:"Barlow Condensed","Arial Narrow",sans-serif;--sans:"Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161C;--surface:#1A1F27;--surface-2:#212833;--ink:#E7E4DB;--ink-2:#A0A5AE;--line:#343C48;--teal:#93B4E4;--teal-ink:#0F1B2C;--red:#F0766B;--red-bg:#3b1d1b;--good:#72c692;--good-bg:#16301f;--amber:#E9AE4E;--amber-bg:#35291a}}
:root[data-theme="dark"]{--bg:#12161C;--surface:#1A1F27;--surface-2:#212833;--ink:#E7E4DB;--ink-2:#A0A5AE;--line:#343C48;--teal:#93B4E4;--teal-ink:#0F1B2C;--red:#F0766B;--red-bg:#3b1d1b;--good:#72c692;--good-bg:#16301f;--amber:#E9AE4E;--amber-bg:#35291a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
main{max-width:52rem;margin:0 auto;padding:clamp(1.2rem,5vw,3rem) 16px calc(5rem + env(safe-area-inset-bottom))}
a{color:var(--teal)}
.home{font-family:var(--serif);font-weight:700;font-size:1.1rem;letter-spacing:.04em;text-transform:uppercase;background:var(--ink);color:var(--bg);padding:.28em .55em .22em;border-radius:2px;text-decoration:none}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.9rem,6vw,2.6rem);line-height:1.1;letter-spacing:0;margin:1.6rem 0 .3rem}
h2{font-size:1.15rem;margin:2.4rem 0 .6rem}
h3{font-size:1rem;margin:0}
p{margin:.5rem 0}
.muted{color:var(--ink-2)}
.meta{display:flex;flex-wrap:wrap;gap:.4rem .6rem;margin-top:.6rem}
.chip{display:inline-flex;align-items:center;padding:.15em .6em;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--surface-2);border:1px solid var(--line)}
.chip.awaiting{background:var(--amber-bg);border-color:transparent;color:var(--amber)}
.chip.reviewed{background:var(--good-bg);border-color:transparent;color:var(--good)}
.chip.changed{background:var(--red-bg);border-color:transparent;color:var(--red)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem 1.1rem;margin:.8rem 0}
.how ol{margin:.4rem 0 0;padding-left:1.2rem}.how li{margin:.2rem 0}
label{display:block;font-weight:600;font-size:.9rem;margin:.7rem 0 .25rem}
input[type=text],input[type=email],textarea,select{width:100%;min-height:44px;padding:.5em .7em;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:5rem;resize:vertical}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:0 1rem}
details.pt{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:.6rem 0}
details.pt>summary{cursor:pointer;padding:.85rem 1rem;font-weight:600;list-style-position:inside}
details.pt>div{padding:0 1rem 1rem}
table{width:100%;border-collapse:collapse;font-size:.88rem;margin:.4rem 0}
th,td{text-align:left;vertical-align:top;padding:.35rem .5rem .35rem 0;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--ink-2);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
.scroll{overflow-x:auto}
ul.plain{margin:.3rem 0;padding-left:1.1rem}
.dec{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:.85rem 1rem;margin:.6rem 0}
.dec.pos{border-left-color:var(--good)}.dec.neg{border-left-color:var(--red)}
.dec .top{display:flex;flex-wrap:wrap;gap:.3rem .5rem;align-items:center;font-size:.78rem;color:var(--ink-2);font-weight:600}
.pts{font-weight:700;padding:.05em .45em;border-radius:4px;background:var(--surface-2)}
.pos .pts{color:var(--good);background:var(--good-bg)}.neg .pts{color:var(--red);background:var(--red-bg)}
.dec b{display:block;margin:.35rem 0 .15rem;font-size:1rem}
.dec .why{font-family:var(--sans);color:var(--ink-2);margin:0}
.dec .src{font-size:.75rem;color:var(--ink-2);margin-top:.35rem}
.verdict{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.7rem}
.verdict button{min-height:40px;padding:.35em .9em;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer}
.verdict button[aria-pressed="true"][data-v="ok"]{background:var(--good);border-color:var(--good);color:var(--teal-ink)}
.verdict button[aria-pressed="true"][data-v="fix"]{background:var(--red);border-color:var(--red);color:var(--teal-ink)}
.verdict button[aria-pressed="true"][data-v="unsure"]{background:var(--amber);border-color:var(--amber);color:var(--teal-ink)}
.dec textarea{margin-top:.5rem;min-height:3.6rem}
.opt{padding:.4rem 0;border-bottom:1px solid var(--line);font-size:.92rem}.opt:last-child{border:0}
.opt i{font-style:normal;font-weight:700;font-size:.75rem;padding:.05em .4em;border-radius:4px;margin-right:.4rem;background:var(--surface-2)}
.bar{position:sticky;top:0;z-index:5;margin:0 -16px;padding:.6rem 16px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:.6rem;font-size:.9rem}
.bar .prog{display:block;flex:1;min-width:4rem;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;max-width:12rem}.bar .prog i{display:block;height:100%;background:var(--teal)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:.55em 1.2em;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn-primary{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.row{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1rem}
.check{display:flex;gap:.6rem;align-items:flex-start;font-weight:500;margin-top:1rem}
.check input{width:1.2rem;height:1.2rem;margin-top:.2rem;flex:none}
.msg{margin-top:.8rem;font-weight:600}.msg.err{color:var(--red)}.msg.ok{color:var(--good)}
pre{white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:.8rem;font-size:.8rem;max-height:18rem;overflow:auto}
.shifts a{display:block;text-decoration:none;color:inherit}
.shifts .card:hover{border-color:var(--ink-2)}
</style>
<style>.item .body p{margin:.15rem 0}.item .body .why{color:var(--ink-2);font-size:.92rem;margin:0 0 .35rem 1.1rem}.item .body .ok b{display:inline;margin:0;color:var(--good)}.item .body .no{color:var(--ink)}.item .body .sp{height:.5rem}.item>b{margin-bottom:.5rem}</style></head>

h immobility, followed by liquid seepage, is classic impaction. Liquid stool leaks around the hard mass.", "- Clostridioides difficile infection", "  No: C. difficile causes frequent watery stools, often with fever and a high WBC. This client has a long stool-free stretch, normal temperature and a normal WBC.", "- Paralytic ileus", "  No: ileus causes absent bowel sounds and no stool at all. This client still has bowel sounds and is passing liquid stool.", "- Lower gastrointestinal bleeding", "  No: GI bleeding produces black or bloody stool and may drop the blood pressure. The stool here is brown.", "Actions to take:", "✓ Withhold the loperamide and report the stool pattern to the provider", "  Yes: an antidiarrheal would worsen the impaction. Reporting the pattern gets the right treatment ordered.", "✓ Give an oil-retention enema as prescribed", "  Yes: an oil-retention enema softens the hardened stool so it can pass or be removed.", "- Give loperamide after each liquid stool", "  No: loperamide slows the bowel further. Treating the leakage as diarrhea is the trap.", "- Increase the oxycodone dose for the cramping", "  No: opioids caused the slowed bowel. More opioid worsens constipation; a bowel regimen is needed.", "- Limit fluids to reduce the stool leakage", "  No: fluid restriction hardens stool. Adequate fluids are part of preventing and treating impaction.", "Parameters to monitor:", "✓ Passage and character of stool", "  Yes: passage of formed stool shows the impaction is clearing. Continued seepage means it is not.", "✓ Abdominal distension and girth", "  Yes: distension and girth show whether stool and gas are building up or relieved.", "- Hemoglobin A1c", "  No: A1c reflects glucose control over 3 months. It has no role here.", "- Serum calcium", "  No: calcium imbalances can affect the bowel, but nothing here points to them.", "- Urine specific gravity", "  No: specific gravity reflects hydration and kidney concentrating ability, not bowel function.", "", "Why: Immobility, opioids and older age slow the colon until stool hardens into an impaction. Liquid stool then leaks around the mass and is easily mistaken for diarrhea. The nurse holds the antidiarrheal, treats the impaction as prescribed, and starts a bowel regimen to prevent recurrence.", "Tip: When liquid stool follows days of no stool, think impaction before diarrhea."], "st": "awaiting"}, {"id": "ngn:sa-basic-5", "hash": "b74a6151d0", "title": "Colostomy pouch change · Take action", "body": ["A 62-year-old is on post-op day 5 after a descending colostomy for colon cancer. The stoma is moist and red. The nurse is changing the pouching system and teaching the client at the same time.", "", "Which actions should the nurse take? Select all that apply.", "", "✓ Teach the client to empty the pouch when it is one-third to one-half full.", "  Yes: a heavy pouch pulls the seal loose and leaks. Emptying early protects the skin and the seal.", "✓ Clean the skin around the stoma with warm water and pat it dry.", "  Yes: plain water cleans without leaving residue, and dry skin lets the barrier seal.", "- Cut the barrier opening about 1/2 inch (13 mm) larger than the stoma to avoid pressure.", "  No: a wide gap exposes skin to stool, which causes irritation and breakdown. The trap is overcorrecting for stoma pressure.", "✓ Measure the stoma at each change during the first several weeks.", "  Yes: a new stoma shrinks as swelling goes down over about 6 to 8 weeks, so the opening size changes.", "- Clean the skin with an alcohol wipe to remove oils before applying the barrier.", "  No: alcohol dries and irritates peristomal skin and stings any broken areas. Water is preferred.", "✓ Cut the skin barrier opening about 1/16 to 1/8 inch (2 to 3 mm) larger than the stoma.", "  Yes: a close fit keeps stool off the peristomal skin while leaving room so the barrier does not cut into the stoma.", "- Apply a moisturizing lotion around the stoma before placing the barrier.", "  No: lotion leaves a film that keeps the barrier from adhering, causing leaks and skin breakdown.", "", "Why: A good pouch change protects the peristomal skin. The opening fits closely, the skin is clean and dry with no residue, and the pouch is emptied before it gets heavy. A new stoma shrinks for several weeks, so it is measured each time.", "Tip: For ostomy care, choose options that protect the skin and the seal; anything that leaves residue or exposed skin is wrong."], "st": "awaiting"}, {"id": "ngn:sa-basic-6", "hash": "5ce45d8664", "title": "PAINAD reassessment · Evaluate outcomes", "body": ["An 88-year-old with advanced dementia is on post-op day 1 after hip repair and cannot rate her pain. At 0200 the nurse scored the Pain Assessment in Advanced Dementia (PAINAD) scale at 8 and gave the prescribed oxycodone, then repositioned her with pillows supporting the operative leg. The nurse reassesses at 0300.", "", "For each finding, indicate whether it has improved, is unchanged, or has worsened since 0200.", "", "- Breathing: 0200 labored, RR 26; 0300 unlabored, RR 18. → Improved", "  Labored, rapid breathing is a pain behavior on the PAINAD. Easy breathing at 18 is improvement, and the rate is not low enough to suggest oversedation.", "- Vocalization: 0200 repeatedly calling out; 0300 occasional soft moan. → Improved", "  Repeated calling out scores higher than an occasional moan. This is improvement, though not complete relief.", "- Facial expression: 0200 grimacing; 0300 grimacing. → Unchanged", "  Persistent grimacing is unchanged and suggests pain is not fully controlled. It needs further assessment.", "- Body language: 0200 rigid with fists clenched; 0300 relaxed hands and limbs. → Improved", "  Rigid posture and clenched fists are high-scoring pain behaviors. A relaxed body is improvement.", "- Consolability: 0200 could not be consoled; 0300 calms with touch and voice. → Improved", "  Being consolable with touch and voice shows distress has eased. This is improvement.", "- Sacral skin: 0200 blanchable redness; 0300 redness that does not blanch. → Worsened", "  Redness that no longer blanches is a stage 1 pressure injury. Skin has worsened and needs pressure relief now.", "", "Why: Behavioral pain scales are the right tool when a client cannot self-report. Most behaviors improved after the opioid and repositioning, but persistent grimacing means pain is not fully relieved. The new nonblanchable redness is a separate problem that needs offloading right away.", "Tip: In trend items, compare each finding to its own baseline before deciding what the overall picture means."], "st": "awaiting"}, {"id": "ngn:sa-pharm-4", "hash": "e882966e1e", "title": "Managing vancomycin infusion reaction · Take action", "body": ["A 54-year-old with cellulitis is receiving the first dose of vancomycin 1.5 g IV. Twenty minutes into the infusion, his face, neck and upper chest are flushed red and itchy. BP 104/68, down from 128/76. HR 98. No wheezing, no lip or tongue swelling, and SpO₂ is 97% on room air.", "", "Which actions should the nurse take? Select all that apply.", "", "✓ Stop the vancomycin infusion.", "  Yes: this is vancomycin infusion reaction, caused by histamine release when the drug runs in too fast. Stopping the infusion removes the trigger.", "- Increase the rate to finish the dose before the reaction gets worse.", "  No: the reaction is caused by a fast infusion rate. Speeding up makes it worse.", "- Document a permanent vancomycin allergy on the chart.", "  No: this is a rate-related reaction, not a true allergy. Labeling it as an allergy can remove a needed antibiotic from future use.", "✓ Give diphenhydramine as prescribed.", "  Yes: an antihistamine relieves the flushing and itching caused by histamine release.", "✓ Notify the provider.", "  Yes: the provider needs to know about the reaction to order an antihistamine and a new infusion rate.", "- Give epinephrine 0.3 mg IM now.", "  No: there is no airway swelling, wheezing or severe hypotension. Epinephrine is for anaphylaxis; mistaking this rate-related reaction for anaphylaxis is the trap.", "✓ Expect to restart the infusion at a slower rate if the prescriber orders it.", "  Yes: once symptoms settle, vancomycin is usually continued over a longer time, at least 60 minutes and often 2 hours.", "✓ Recheck the blood pressure and monitor breathing every few minutes until stable.", "  Yes: the reaction can lower the blood pressure. Close monitoring also catches any sign that this is actually anaphylaxis.", "", "Why: Flushing and itching of the upper body during a vancomycin infusion point to an infusion reaction from histamine release, not an allergy. Stop the infusion, give an antihistamine, and monitor the blood pressure. The drug is usually continued at a slower rate.", "Tip: Look for airway findings before choosing epinephrine; without them, think infusion rate."], "st": "awaiting"}, {"id": "ngn:sa-risk-1", "hash": "15267dbb62", "title": "Post-paracentesis hypotension · Evaluate outcomes", "body": ["A 57-year-old with cirrhosis and tense ascites had a paracentesis that removed 5.5 L of fluid. Before the procedure: HR 86, BP 124/72, RR 26, SpO₂ 92% on room air, abdominal girth 112 cm. One hour after: HR 116, BP 92/54, RR 18, SpO₂ 96% on room air, abdominal girth 101 cm. She says she feels dizzy when she sits up.", "", "For each finding, indicate whether it is an expected response or requires follow-up.", "", "- Respiratory rate from 26 to 18. → Expected response", "  Removing ascites lets the diaphragm move down, so breathing slows and eases. This is the goal of the procedure.", "- SpO₂ from 92% to 96%. → Expected response", "  Better lung expansion improves oxygenation. This is expected.", "- Abdominal girth from 112 cm to 101 cm. → Expected response", "  A smaller girth reflects the fluid removed. This is expected.", "- Heart rate from 86 to 116. → Requires follow-up", "  Tachycardia after large-volume removal suggests fluid shifting back into the abdomen and low circulating volume.", "- Blood pressure from 124/72 to 92/54. → Requires follow-up", "  Hypotension after removing more than 5 L signals circulatory dysfunction. The nurse reports it and anticipates IV albumin.", "- Dizziness when she sits up. → Requires follow-up", "  Orthostatic dizziness is another sign of low volume and a fall risk. Keep her in bed and report it.", "", "Why: Paracentesis should make breathing easier, and here it did. But removing a large volume can drop the circulating volume as fluid shifts back into the abdomen. Rising heart rate, falling blood pressure and dizziness need prompt reporting, and albumin is commonly given after large-volume taps.", "Tip: In post-procedure trend items, split the changes into what the procedure was meant to do and what it was not supposed to do."], "st": "awaiting"}, {"id": "ngn:sa-risk-5", "hash": "b811d56eca", "title": "Metabolic alkalosis from NG suction · Analyze cues", "body": ["A 72-year-old has had a nasogastric tube to low intermittent suction for 3 days for a postoperative ileus. NG output averages 1,200 mL per day. IV fluid is D5 0.45% sodium chloride without potassium. Day 1 labs: K 4.1 mEq/L, Cl 102 mEq/L, HCO₃ 24 mEq/L, pH 7.40, PaCO₂ 40 mm Hg. Day 3 labs: K 3 mEq/L, Cl 92 mEq/L, HCO₃ 33 mEq/L, pH 7.51, PaCO₂ 45 mm Hg.", "", "Complete the sentences.", "", "Blank 1:", "- metabolic acidosis", "  No: acidosis would show a pH below 7.35. This pH is 7.51.", "- respiratory alkalosis", "  No: respiratory alkalosis would show a low PaCO₂. Here PaCO₂ is rising, not falling.", "✓ metabolic alkalosis", "  Yes: pH above 7.45 with a high bicarbonate is metabolic alkalosis. The slightly higher PaCO₂ is the lungs partly compensating.", "Blank 2:", "- hyperventilation from incisional pain", "  No: hyperventilation would lower PaCO₂ and cause respiratory alkalosis. The PaCO₂ is up, not down.", "- loss of bicarbonate through the bowel", "  No: losing bicarbonate through diarrhea or fistulas causes metabolic acidosis, the opposite of this picture.", "✓ loss of hydrochloric acid through gastric suction", "  Yes: gastric fluid is rich in hydrochloric acid. Removing it lowers chloride and hydrogen ions, leaving excess bicarbonate.", "Blank 3:", "✓ the potassium of 3 mEq/L, which raises the risk of dysrhythmias", "  Yes: hypokalemia from gastric losses, alkalosis and potassium-free fluids can cause dangerous dysrhythmias. The nurse reports it and anticipates replacement.", "- the chloride of 92 mEq/L, which causes seizures", "  No: low chloride drives the alkalosis but does not cause seizures. Potassium is the immediate cardiac danger.", "- the PaCO₂ of 45 mm Hg, which signals respiratory failure", "  No: a PaCO₂ of 45 is compensation for the alkalosis, not respiratory failure. The trap is reading compensation as a new problem.", "", "Why: Prolonged gastric suction removes acid, chloride and potassium. Over 3 days the bicarbonate climbed and the pH followed, while potassium fell with no replacement in the IV fluid. Hypokalemia is the immediate threat because of its effect on the heart.", "Tip: Match the fluid lost to the acid-base result: gastric losses cause alkalosis, lower GI losses cause acidosis."], "st": "awaiting"}, {"id": "ngn:sa-phys-2", "hash": "8da4a8789c", "title": "SIADH response to treatment · Evaluate outcomes", "body": ["A 70-year-old with small cell lung cancer has syndrome of inappropriate antidiuretic hormone (SIADH) and is on a 1,000 mL daily fluid restriction. Day 1: Na 121 mEq/L, weight 72.4 kg (159.6 lb), urine output 600 mL per 24 hours, urine specific gravity 1.032, confused to time and place, headache 6/10. Day 3: Na 129 mEq/L, weight 71 kg (156.5 lb), urine output 1,300 mL per 24 hours, urine specific gravity 1.018, oriented to person, place and time, headache 6/10.", "", "For each finding, indicate whether it has improved, is unchanged, or has worsened.", "", "- Serum sodium → Improved", "  Sodium rose from 121 to 129 at a gradual rate. As excess water is lost, the sodium concentration rises.", "- Weight → Improved", "  In SIADH, weight gain reflects retained water. A 1.4 kg loss shows the extra water is leaving.", "- Urine output → Improved", "  More urine means the kidneys are excreting the retained water. This is the expected response to fluid restriction.", "- Urine specific gravity → Improved", "  Very concentrated urine is a hallmark of SIADH. A lower specific gravity shows the urine is becoming less concentrated.", "- Mental status → Improved", "  Confusion from hyponatremia improves as sodium rises. Full orientation is improvement.", "- Headache → Unchanged", "  The headache rating is unchanged. It still needs assessment, since hyponatremia and brain metastases can both cause headache.", "", "Why: SIADH causes the body to hold water, diluting the sodium. Fluid restriction lets the extra water leave. Rising sodium, falling weight, more dilute urine and clearer thinking show the treatment is working. The persistent headache needs its own follow-up.", "Tip: In SIADH, think water, not salt: the client is holding too much water, so improvement looks like weight loss and rising sodium."], "st": "awaiting"}, {"id": "ngn:sa-phys-4", "hash": "ee1413a7af", "title": "Metabolic acidosis from diarrhea · Analyze cues", "body": ["A 48-year-old is admitted after 4 days of profuse watery diarrhea. Breathing is deep and rapid at 28 per minute. Arterial blood gas: pH 7.29, PaCO₂ 30 mm Hg, HCO₃ 14 mEq/L.", "", "Complete the sentences.", "", "Blank 1:", "- respiratory acidosis", "  No: respiratory acidosis has a high PaCO₂. Here PaCO₂ is low.", "- metabolic alkalosis", "  No: alkalosis has a pH above 7.45. This pH is 7.29.", "✓ metabolic acidosis", "  Yes: pH under 7.35 with a low bicarbonate points to a metabolic cause of acidosis.", "Blank 2:", "✓ partially compensated", "  Yes: the low PaCO₂ shows the lungs are blowing off CO₂ to compensate, but the pH is still abnormal.", "- fully compensated", "  No: full compensation brings the pH back into the normal range. The pH is still 7.29.", "- uncompensated", "  No: uncompensated would show a normal PaCO₂. The PaCO₂ is already low.", "Blank 3:", "- loss of acid in the stool", "  No: losing acid would cause alkalosis. Acid loss happens with vomiting or gastric suction.", "✓ loss of bicarbonate in the stool", "  Yes: intestinal fluid is rich in bicarbonate. Profuse diarrhea removes base and leaves acid behind.", "- retention of carbon dioxide", "  No: CO₂ is being blown off, not retained. CO₂ retention causes respiratory acidosis.", "", "Why: Profuse diarrhea removes bicarbonate, causing metabolic acidosis. The lungs respond with deep, rapid breathing to blow off CO₂, which partly corrects the pH. Treatment is replacing fluid and electrolytes and addressing the cause.", "Tip: Read the pH first, then match the abnormal value moving in the same direction to name the cause, then check the other value for compensation."], "st": "awaiting"}, {"id": "ngn:calc-1", "hash": "f47aeda3b2", "title": "Gabapentin capsules per dose · Take action", "body": ["A 64-year-old client with postherpetic neuralgia has an order for gabapentin 600 mg PO three times daily. The pharmacy supplies gabapentin 300 mg capsules.", "", "How many capsules should the nurse give for each dose?", "", "Answer: 2 capsules. Round to the nearest whole number.", "  Formula: desired / have x quantity.", "  600 mg / 300 mg x 1 capsule", "  = 2", "  Answer: 2 capsules", "", "Why: Capsules cannot be split, so the answer must be a whole number; a fractional result means a math error or a dose that needs clarification. Gabapentin causes dizziness and sedation, so assess fall risk in an older client.", "Tip: If a capsule calculation gives a fraction, stop and recheck before you look for a way to divide it."], "st": "awaiting"}, {"id": "ngn:calc-2", "hash": "768ced81c7", "title": "Levothyroxine mg to mcg tablets · Take action", "body": ["A 58-year-old client with hypothyroidism has an order for levothyroxine 0.15 mg PO daily before breakfast. On hand: levothyroxine 75 mcg tablets.", "", "How many tablets should the nurse give?", "", "Answer: 2 tablets. Round to the nearest whole number.", "  Convert: 0.15 mg x 1,000 mcg/mg = 150 mcg.", "  Desired / have: 150 mcg / 75 mcg x 1 tablet", "  = 2", "  Answer: 2 tablets", "", "Why: The order and the label use different units, so convert before you divide. Levothyroxine is given on an empty stomach, 30 to 60 minutes before breakfast, and separate from calcium or iron, which block absorption.", "Tip: Convert to the unit on the label first; mg to mcg means move the decimal three places to the right."], "st": "awaiting"}, {"id": "ngn:calc-3", "hash": "99c44b27e4", "title": "Digoxin half tablet · Take action", "body": ["A 79-year-old client with heart failure and atrial fibrillation has an order for digoxin 0.125 mg PO daily. On hand: digoxin 250 mcg scored tablets. Apical pulse is 74, counted for 1 full minute.", "", "How many tablets should the nurse give?", "", "Answer: 0.5 tablets. Round to the nearest tenth.", "  Convert: 0.125 mg x 1,000 = 125 mcg.", "  Desired / have: 125 mcg / 250 mcg x 1 tablet", "  = 0.5", "  Answer: 0.5 tablet", "", "Why: Only a scored tablet may be split, and half a tablet is the most a nurse should split. Before any digoxin dose, count an apical pulse for 1 full minute and hold for a rate under 60 in an adult; check the potassium, since low potassium raises the risk of toxicity.", "Tip: Sanity check: if the dose is smaller than the tablet strength, the answer must be less than 1."], "st": "awaiting"}, {"id": "ngn:calc-4", "hash": "2e0d94e08c", "title": "Amoxicillin oral suspension volume · Take action", "body": ["A 72-year-old client with dysphagia after a stroke has an order for amoxicillin 500 mg PO every 12 hours. The pharmacy sends amoxicillin oral suspension 400 mg/5 mL.", "", "How many mL should the nurse give?", "", "Answer: 6.3 mL. Round to the nearest tenth.", "  Formula: desired / have x volume.", "  500 mg / 400 mg x 5 mL", "  = 6.25 mL", "  Answer: 6.3 mL", "", "Why: Oral liquids are measured in an oral syringe, never a household spoon, so the volume must be exact. A client with dysphagia also needs the consistency the speech therapist ordered and an upright position to prevent aspiration.", "Tip: Write the concentration as a fraction (400 mg per 5 mL) and let the mg cancel; only mL should remain."], "st": "awaiting"}, {"id": "ngn:calc-5", "hash": "356162d3a4", "title": "Subcutaneous heparin volume · Take action", "body": ["A 46-year-old client with a BMI of 44 is on post-op day 1 after a hernia repair. The order reads heparin 7,500 units subcutaneous every 8 hours. On hand: heparin 10,000 units/mL vial.", "", "How many mL should the nurse draw up?", "", "Answer: 0.75 mL. Round to the nearest hundredth.", "  Formula: desired / have x volume.", "  7,500 units / 10,000 units x 1 mL", "  = 0.75 mL", "  Answer: 0.75 mL", "", "Why: Heparin is a high-alert medication, and heparin vials come in several concentrations that look alike. Read the concentration on the label against the order, use a 1 mL syringe for a volume under 1 mL, and follow the facility policy for an independent double check.", "Tip: Volumes under 1 mL go to the hundredth and into a 1 mL syringe; always keep the leading zero (0.75 mL)."], "st": "awaiting"}, {"id": "ngn:calc-6", "hash": "061cde2870", "title": "Enoxaparin weight-based dose · Take action", "body": ["A 61-year-old client with a new deep vein thrombosis weighs 176 lb. The order reads enoxaparin 1 mg/kg subcutaneous every 12 hours. On hand: enoxaparin 100 mg/mL prefilled syringe (1 mL). Creatinine clearance is 78 mL/min.", "", "How many mL should the nurse give?", "", "Answer: 0.8 mL. Round to the nearest hundredth.", "  Weight: 176 lb / 2.2 = 80 kg.", "  Dose: 1 mg/kg x 80 kg = 80 mg.", "  Volume: 80 mg / 100 mg x 1 mL = 0.8 mL.", "  Answer: 0.8 mL (expel the extra 0.2 mL before injecting)", "", "Why: Weight-based enoxaparin needs an accurate current weight, and the dose is reduced when creatinine clearance falls under 30 mL/min, so check renal function first. Expel the excess from the prefilled syringe, leave the air bubble in, and inject into the abdomen without rubbing.", "Tip: For weight-based doses, find the kg first, then the mg, then the mL: three short steps beat one long one."], "st": "awaiting"}, {"id": "ngn:calc-8", "hash": "55248c8310", "title": "Pump rate over 8 hours · Take action", "body": ["A 70-year-old client with dehydration has an order for 0.9% sodium chloride 1,000 mL IV over 8 hours by infusion pump.", "", "At what rate should the nurse set the pump?", "", "Answer: 125 mL/h. Round to the nearest whole number.", "  Formula: total volume / time in hours.", "  1,000 mL / 8 h", "  = 125 mL/h", "  Answer: 125 mL/h", "", "Why: Infusion pumps are programmed in mL/h, so the time must be in hours. In an older client, watch for fluid overload during rehydration: crackles, rising respiratory rate, distended neck veins, and a drop in oxygen saturation.", "Tip: Pump rate is simply mL divided by hours; convert minutes to hours before you divide."], "st": "awaiting"}, {"id": "ngn:calc-9", "hash": "585d07d223", "title": "Pump rate over 12 hours · Take action", "body": ["A 35-year-old client with acute pancreatitis has an order for lactated Ringer's 1,000 mL IV over 12 hours by infusion pump.", "", "At what rate should the nurse set the pump?", "", "Answer: 83.3 mL/h. Round to the nearest tenth.", "  Formula: total volume / time in hours.", "  1,000 mL / 12 h", "  = 83.33 mL/h", "  Answer: 83.3 mL/h", "", "Why: Many pumps accept tenths, and the question tells you to round to the tenth, so 83 is marked wrong. Fluid resuscitation is a core treatment in pancreatitis; track urine output and vital signs to judge whether the volume is enough.", "Tip: Read the rounding instruction last, after the math, and round only once at the very end."], "st": "awaiting"}, {"id": "ngn:calc-11", "hash": "a3ac2a7be0", "title": "Drip rate with a 10 gtt/mL set · Take action", "body": ["A 47-year-old client has an order for 5% dextrose in 0.45% sodium chloride 500 mL IV over 4 hours by gravity. The macrodrip tubing delivers 10 gtt/mL.", "", "At how many drops per minute should the nurse set the infusion?", "", "Answer: 21 gtt/min. Round to the nearest whole number.", "  Formula: (volume x drop factor) / time in minutes.", "  Time: 4 h x 60 = 240 min.", "  (500 mL x 10 gtt/mL) / 240 min = 20.83", "  Answer: 21 gtt/min", "", "Why: The drop factor is printed on the tubing package and changes the answer, so confirm it before calculating. With 10 gtt/mL tubing, a shortcut is mL/h divided by 6, which is a good way to check your work.", "Tip: Shortcut check: mL/h divided by (60 / drop factor) gives gtt/min; for 10 gtt/mL, divide mL/h by 6."], "st": "awaiting"}, {"id": "ngn:calc-12", "hash": "3b2b56c010", "title": "IV piggyback drip rate · Take action", "body": ["A 66-year-old client has an order for cefazolin 2 g in 100 mL 0.9% sodium chloride IV piggyback to infuse over 30 minutes. The secondary gravity tubing has a drop factor of 20 gtt/mL.", "", "At how many drops per minute should the nurse set the infusion?", "", "Answer: 67 gtt/min. Round to the nearest whole number.", "  Formula: (volume x drop factor) / time in minutes.", "  (100 mL x 20 gtt/mL) / 30 min", "  = 66.67", "  Answer: 67 gtt/min", "", "Why: When the time is already in minutes, there is no conversion step, which is where many test takers make an extra error. Before hanging a cephalosporin, confirm allergies, including the type of any penicillin reaction, and stay alert for signs of anaphylaxis during the first minutes of the infusion.", "Tip: Check the time unit first: minutes go straight into the formula, hours get multiplied by 60."], "st": "awaiting"}, {"id": "ngn:calc-14", "hash": "d3bfe69b23", "title": "Infusion time remaining · Take action", "body": ["At 1430, the nurse finds 750 mL remaining in a client's IV bag of 0.9% sodium chloride infusing at 100 mL/h by pump.", "", "How many hours will the remaining fluid take to infuse?", "", "Answer: 7.5 hours. Round to the nearest tenth.", "  Formula: volume remaining / rate.", "  750 mL / 100 mL/h", "  = 7.5 h (7 hours 30 minutes)", "  Answer: 7.5 hours; the bag will finish at 2200", "", "Why: Knowing when a bag will run dry lets the nurse hang the next bag on time and avoid an occluded line or a gap in therapy. To get a clock time, convert the decimal: 0.5 h is 30 minutes, not 50.", "Tip: Convert decimal hours to minutes by multiplying the decimal by 60 before adding to the clock."], "st": "awaiting"}, {"id": "ngn:calc-15", "hash": "d6d8560297", "title": "Gentamicin mg/kg dose · Take action", "body": ["A 69-year-old client with gram-negative sepsis weighs 172 lb. The order reads gentamicin 5 mg/kg IV once daily.", "", "How many mg should the client receive?", "", "Answer: 391 mg. Round to the nearest whole number.", "  Weight: 172 lb / 2.2 = 78.18 kg (keep the full value until the last step).", "  Dose: 5 mg/kg x 78.18 kg = 390.9 mg, rounded to 391 mg", "  = 391 mg", "  Answer: 391 mg", "", "Why: Aminoglycosides are dosed by weight and are toxic to the kidneys and the eighth cranial nerve. Before giving the dose, check creatinine and the ordered drug level, and ask about ringing in the ears or hearing loss.", "Tip: When the question tells you to round the weight, round it first, then calculate with that rounded weight."], "st": "awaiting"}, {"id": "ngn:calc-23", "hash": "40d6f3a0bd", "title": "Heparin bolus volume · Take action", "body": ["A 54-year-old client with a pulmonary embolism weighs 187 lb. The weight-based heparin protocol orders a bolus of 80 units/kg IV. On hand: heparin 1,000 units/mL vial.", "", "How many mL should the nurse give for the bolus?", "", "Answer: 6.8 mL. Round to the nearest tenth.", "  Weight: 187 lb / 2.2 = 85 kg.", "  Bolus: 80 units/kg x 85 kg = 6,800 units.", "  Volume: 6,800 units / 1,000 units/mL = 6.8 mL.", "  Answer: 6.8 mL", "", "Why: Heparin is a high-alert medication, and most facilities require an independent double check by a second nurse of the weight, dose, concentration, and pump settings because errors cause serious bleeding or clotting. Use the weight in kg recorded at admission, not a stated or estimated weight.", "Tip: Write units as a word, never \"U\"; a \"U\" can be misread as a zero and turn 6,800 into 68,000."], "st": "awaiting"}, {"id": "ngn:calc-30", "hash": "d0b062bb12", "title": "Shift intake total · Take action", "body": ["During a 0700 to 1500 shift, a client drank 6 oz of orange juice and 8 oz of coffee and ate 1 cup (240 mL) of ice chips. An IV infused at 75 mL/h for the full 8 hours, and a 100 mL IV antibiotic piggyback was given. Use 1 oz = 30 mL and count ice chips as half their volume.", "", "What is the client's total intake for the shift in mL?", "", "Answer: 1240 mL. Round to the nearest whole number.", "  Oral: 6 oz x 30 = 180 mL; 8 oz x 30 = 240 mL; ice chips 240 / 2 = 120 mL.", "  IV: 75 mL/h x 8 h = 600 mL; piggyback 100 mL.", "  Total: 180 + 240 + 120 + 600 + 100 = 1,240 mL", "  Answer: 1,240 mL", "", "Why: Accurate intake and output reveal fluid imbalance before vital signs change, especially in clients with heart failure or kidney disease. Intake includes every fluid route: oral, IV, piggybacks, tube feedings, and flushes.", "Tip: List every source on scratch paper by route, convert each to mL, then add once."], "st": "awaiting"}]}, "packs": [{"id": "drill-med-1", "title": "Drills: Med Pass, part 1 of 2", "sub": "What to check before a medication, then give, hold or call. A pharmacist is especially welcome.", "n": 25, "reviewed": 0, "changed": 0}, {"id": "drill-med-2", "title": "Drills: Med Pass, part 2 of 2", "sub": "What to check before a medication, then give, hold or call. A pharmacist is especially welcome.", "n": 25, "reviewed": 0, "changed": 0}, {"id": "d
