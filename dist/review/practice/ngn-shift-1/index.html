<style>
:root{--bg:#E6EDF0;--surface:#FBFCFC;--surface-2:#EDF2F4;--ink:#152238;--ink-2:#4D5A6F;--line:#CAD5DB;--teal:#2449A8;--teal-ink:#fff;--red:#B3342B;--red-bg:#F8E1DE;--good:#2B7249;--good-bg:#E0F0E6;--amber:#A96C0E;--amber-bg:#FBEFD6;
  --serif:"Barlow Condensed","Arial Narrow",sans-serif;--sans:"Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161C;--surface:#1A1F27;--surface-2:#212833;--ink:#E7E4DB;--ink-2:#A0A5AE;--line:#343C48;--teal:#93B4E4;--teal-ink:#0F1B2C;--red:#F0766B;--red-bg:#3b1d1b;--good:#72c692;--good-bg:#16301f;--amber:#E9AE4E;--amber-bg:#35291a}}
:root[data-theme="dark"]{--bg:#12161C;--surface:#1A1F27;--surface-2:#212833;--ink:#E7E4DB;--ink-2:#A0A5AE;--line:#343C48;--teal:#93B4E4;--teal-ink:#0F1B2C;--red:#F0766B;--red-bg:#3b1d1b;--good:#72c692;--good-bg:#16301f;--amber:#E9AE4E;--amber-bg:#35291a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
main{max-width:52rem;margin:0 auto;padding:clamp(1.2rem,5vw,3rem) 16px calc(5rem + env(safe-area-inset-bottom))}
a{color:var(--teal)}
.home{font-family:var(--serif);font-weight:700;font-size:1.1rem;letter-spacing:.04em;text-transform:uppercase;background:var(--ink);color:var(--bg);padding:.28em .55em .22em;border-radius:2px;text-decoration:none}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.9rem,6vw,2.6rem);line-height:1.1;letter-spacing:0;margin:1.6rem 0 .3rem}
h2{font-size:1.15rem;margin:2.4rem 0 .6rem}
h3{font-size:1rem;margin:0}
p{margin:.5rem 0}
.muted{color:var(--ink-2)}
.meta{display:flex;flex-wrap:wrap;gap:.4rem .6rem;margin-top:.6rem}
.chip{display:inline-flex;align-items:center;padding:.15em .6em;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--surface-2);border:1px solid var(--line)}
.chip.awaiting{background:var(--amber-bg);border-color:transparent;color:var(--amber)}
.chip.reviewed{background:var(--good-bg);border-color:transparent;color:var(--good)}
.chip.changed{background:var(--red-bg);border-color:transparent;color:var(--red)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem 1.1rem;margin:.8rem 0}
.how ol{margin:.4rem 0 0;padding-left:1.2rem}.how li{margin:.2rem 0}
label{display:block;font-weight:600;font-size:.9rem;margin:.7rem 0 .25rem}
input[type=text],input[type=email],textarea,select{width:100%;min-height:44px;padding:.5em .7em;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:5rem;resize:vertical}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:0 1rem}
details.pt{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:.6rem 0}
details.pt>summary{cursor:pointer;padding:.85rem 1rem;font-weight:600;list-style-position:inside}
details.pt>div{padding:0 1rem 1rem}
table{width:100%;border-collapse:collapse;font-size:.88rem;margin:.4rem 0}
th,td{text-align:left;vertical-align:top;padding:.35rem .5rem .35rem 0;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--ink-2);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
.scroll{overflow-x:auto}
ul.plain{margin:.3rem 0;padding-left:1.1rem}
.dec{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:.85rem 1rem;margin:.6rem 0}
.dec.pos{border-left-color:var(--good)}.dec.neg{border-left-color:var(--red)}
.dec .top{display:flex;flex-wrap:wrap;gap:.3rem .5rem;align-items:center;font-size:.78rem;color:var(--ink-2);font-weight:600}
.pts{font-weight:700;padding:.05em .45em;border-radius:4px;background:var(--surface-2)}
.pos .pts{color:var(--good);background:var(--good-bg)}.neg .pts{color:var(--red);background:var(--red-bg)}
.dec b{display:block;margin:.35rem 0 .15rem;font-size:1rem}
.dec .why{font-family:var(--sans);color:var(--ink-2);margin:0}
.dec .src{font-size:.75rem;color:var(--ink-2);margin-top:.35rem}
.verdict{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.7rem}
.verdict button{min-height:40px;padding:.35em .9em;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer}
.verdict button[aria-pressed="true"][data-v="ok"]{background:var(--good);border-color:var(--good);color:var(--teal-ink)}
.verdict button[aria-pressed="true"][data-v="fix"]{background:var(--red);border-color:var(--red);color:var(--teal-ink)}
.verdict button[aria-pressed="true"][data-v="unsure"]{background:var(--amber);border-color:var(--amber);color:var(--teal-ink)}
.dec textarea{margin-top:.5rem;min-height:3.6rem}
.opt{padding:.4rem 0;border-bottom:1px solid var(--line);font-size:.92rem}.opt:last-child{border:0}
.opt i{font-style:normal;font-weight:700;font-size:.75rem;padding:.05em .4em;border-radius:4px;margin-right:.4rem;background:var(--surface-2)}
.bar{position:sticky;top:0;z-index:5;margin:0 -16px;padding:.6rem 16px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:.6rem;font-size:.9rem}
.bar .prog{display:block;flex:1;min-width:4rem;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;max-width:12rem}.bar .prog i{display:block;height:100%;background:var(--teal)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:.55em 1.2em;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn-primary{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.row{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1rem}
.check{display:flex;gap:.6rem;align-items:flex-start;font-weight:500;margin-top:1rem}
.check input{width:1.2rem;height:1.2rem;margin-top:.2rem;flex:none}
.msg{margin-top:.8rem;font-weight:600}.msg.err{color:var(--red)}.msg.ok{color:var(--good)}
pre{white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:.8rem;font-size:.8rem;max-height:18rem;overflow:auto}
.shifts a{display:block;text-decoration:none;color:inherit}
.shifts .card:hover{border-color:var(--ink-2)}
</style>

, "  No: Dehydration can explain low urine output and a fast heart rate, but not the fever with a known infection; calling it dehydration alone delays cultures and antibiotics.", "✓ Sepsis", "  Yes: A known infection plus new confusion, fever, tachycardia, tachypnea, soft BP and low urine output shows infection driving organ hypoperfusion; that is sepsis until proven otherwise.", "- Stroke", "  No: Stroke causes sudden neuro changes, but global confusion with fever and no focal deficits points to a systemic infection, not a focal brain lesion.", "Actions to take:", "- Encourage oral fluids and recheck in 4 hours", "  No: Oral fluids sound safe, but a confused, hypotensive client cannot drink enough fast enough, and waiting 4 hours lets sepsis progress toward septic shock.", "✓ Give the ordered IV fluid bolus", "  Yes: Soft BP and low urine output mean poor perfusion; IV crystalloid restores circulating volume and organ perfusion while the antibiotic takes effect.", "- Give haloperidol for the confusion", "  No: Haloperidol sedates confusion that is actually a perfusion warning sign; it masks the cause and can worsen hypotension and fall risk in an older adult.", "✓ Obtain blood cultures, then start the antibiotic", "  Yes: Cultures drawn before the first dose identify the organism without antibiotic interference, and every hour of antibiotic delay raises sepsis mortality, so draw and then give promptly.", "- Apply soft wrist restraints", "  No: Restraints treat the behavior, not the sepsis, and raise the risk of injury and worsening delirium; they are a last resort, never a first response to new confusion.", "Parameters to monitor:", "- Hemoglobin A1c", "  No: A1c reflects average glucose over about 3 months; it is useful for diabetes care but tells you nothing about sepsis or the response to treatment today.", "✓ Blood pressure and mean arterial pressure", "  Yes: MAP shows whether organs are being perfused; the usual sepsis target is 65 mm Hg or higher, and a falling MAP despite fluids means vasopressors may be needed.", "✓ Serum lactate", "  Yes: Lactate reflects tissue hypoperfusion; a level that falls on repeat shows resuscitation is working, and one that stays high signals worsening shock.", "- Serum albumin", "  No: Albumin changes slowly and reflects nutrition and chronic illness; it does not guide acute sepsis resuscitation.", "- TSH", "  No: Thyroid disease can cause confusion, which makes this tempting, but TSH does not track sepsis or the response to fluids and antibiotics.", "", "Why: New confusion, fever, tachycardia, soft pressure and low urine output with a known infection is sepsis until proven otherwise. Cultures, then antibiotics and fluids, fast; then watch whether the lactate clears and the pressure holds. Sedating or restraining treats the symptom and hides the cause.", "Tip: When an older adult with a known infection has new confusion plus abnormal vital signs, think sepsis first; options that sedate, restrain or wait treat the symptom and are the traps."], "st": "awaiting"}, {"id": "ngn:ms1-mat", "hash": "44fa83f69f", "title": "medsurg-4w-1 · Matrix · Generate solutions", "body": ["A 71-year-old with heart failure (EF 30%) and atrial fibrillation, on daily furosemide, has 09:00 medications due. Apical pulse 52, irregular, counted for a full minute. BP 112/70. Potassium 3.3. Hemoglobin stable, no bleeding.", "", "For each medication, indicate whether the nurse should give it or hold it and notify the provider.", "", "- Metoprolol succinate 50 mg PO (hold for HR under 55) → Hold and notify", "  Apical 52 is under the parameter.", "- Losartan 25 mg PO (hold for SBP under 100) → Give", "  SBP 112 is above the parameter.", "- Apixaban 5 mg PO → Give", "  No bleeding, stable hemoglobin; in AF, missed doses raise stroke risk.", "- Potassium chloride 20 mEq PO → Give", "  K 3.3 on a loop diuretic: this is the dose that protects him.", "", "Why: Hold parameters only work if someone checks the number first, against the exact threshold in the order.", "Tip: For give-or-hold matrices, compare each vital sign or lab against the exact hold parameter written in the order; replacing a low electrolyte or continuing an anticoagulant without bleeding is usually the safe choice."], "st": "awaiting"}, {"id": "ngn:ms1-sata", "hash": "dcdb56154e", "title": "medsurg-4w-1 · Select all · Take action", "body": ["A 58-year-old is on post-op day 1 after an open sigmoid colectomy. He splints when he breathes and has refused the incentive spirometer twice. Pain 7/10.", "", "Which actions help prevent atelectasis? Select all that apply.", "", "✓ Give his pain medication before walking and coughing", "  Yes: Pain of 7/10 and splinting mean he is breathing shallowly to avoid pain; premedicating makes deep breathing, coughing and walking possible.", "✓ Walk him in the hall today", "  Yes: Early ambulation increases tidal volume and mobilizes secretions; it also lowers the risk of VTE and ileus after abdominal surgery.", "- Keep him on bed rest until the fever resolves", "  No: Early post-op fever is often linked to atelectasis, so bed rest worsens the very problem causing concern; immobility promotes shallow breathing and pooled secretions.", "- Hold opioids so he breathes more deeply", "  No: Withholding opioids may seem to protect breathing, but uncontrolled incisional pain causes splinting and shallow breaths; the goal is safe pain control with sedation monitoring.", "✓ Teach him to hug a pillow over the incision to cough", "  Yes: Splinting the incision with a pillow reduces pain during coughing, so he can cough effectively and clear secretions that would otherwise plug small airways.", "✓ Coach the incentive spirometer 10 times an hour while awake", "  Yes: Incentive spirometry promotes sustained deep breaths that re-expand collapsed alveoli; 10 times an hour while awake is the standard post-op teaching.", "", "Why: Deep breaths, coughing and walking re-open alveoli; good pain control is what makes them possible. Bed rest and untreated pain both cause shallow breathing.", "Tip: For prevention questions, pick actions that directly expand the lungs or make expansion possible; distractors usually restrict activity or undertreat pain, and both cause shallow breathing."], "st": "awaiting"}, {"id": "ngn:ms1-ch1", "hash": "303e316f3c", "title": "medsurg-4w-1 · Electrolytes and cardiac drugs · NCLEX challenge · Generate solutions", "body": ["A 71-year-old with heart failure (EF 30%) and atrial fibrillation. Morning results: K 3.1, Mg 1.5, creatinine 1.0. Apical pulse 58, regular for a full minute. BP 108/64. No dizziness.", "", "For each 09:00 medication, indicate whether the nurse should give it or hold it and notify the provider.", "", "- Digoxin 0.125 mg PO → Hold and notify", "  Low potassium and magnesium make digoxin toxic to the heart even at a normal level. Replace them first.", "- Carvedilol 6.25 mg PO (hold for HR under 55 or SBP under 90) → Give", "  HR 58 and SBP 108 are above both parameters.", "- Spironolactone 25 mg PO → Give", "  It spares potassium; with a K of 3.1 it helps, not hurts.", "- Furosemide 40 mg PO → Hold and notify", "  It wastes potassium and magnesium. With both low, the provider needs to replace them or adjust the dose first.", "- Potassium chloride 20 mEq PO → Give", "  Kidneys are working and potassium is low: give it.", "- Magnesium oxide 400 mg PO → Give", "  Low magnesium makes low potassium hard to correct and raises arrhythmia risk: give it.", "", "Why: Three of these are given and two are held. Hold the drugs made dangerous by low potassium and magnesium (digoxin) or that will push them lower (furosemide); give the replacements and the drugs whose parameters are met.", "Tip: In a matrix, decide each row on its own. Don't assume a pattern; \"low potassium\" doesn't mean hold everything."], "st": "awaiting"}, {"id": "ngn:ms1-ch2", "hash": "d3af0a0bd9", "title": "medsurg-4w-1 · Necrotizing soft tissue infection · NCLEX challenge · Analyze cues", "body": ["A 46-year-old with type 2 diabetes has had IV cefazolin for left lower leg cellulitis for 24 hours. The nurse reviews this morning's assessment.", "", "Which findings suggest a necrotizing soft tissue infection rather than worsening cellulitis? Select all that apply.", "", "✓ Redness spreading past the line marked yesterday despite IV antibiotics", "  Yes: Rapid spread despite antibiotics suggests a deep infection that needs surgery.", "✓ Crackling felt under the skin when pressed", "  Yes: Crepitus means gas in the tissue from gas-forming bacteria.", "- Tenderness that matches the area of redness", "  No: Pain in proportion to the skin findings fits cellulitis.", "- Warm, red skin with a clear border", "  No: A well-defined, warm, red area is typical of cellulitis.", "✓ Dusky, purplish skin with blisters", "  Yes: Bullae and dusky skin mean the tissue is dying.", "✓ Pain far worse than the skin looks", "  Yes: Pain out of proportion is often the earliest sign; the infection is deeper than the skin shows.", "- Temperature 38.0", "  No: Fever happens in both; it doesn't tell them apart.", "", "Why: Necrotizing infections spread along deep tissue planes. Pain out of proportion, crepitus, bullae, dusky skin and spread despite antibiotics are surgical emergencies.", "Tip: When a question asks what tells two conditions apart, rule out findings that occur in both, like fever."], "st": "awaiting"}, {"id": "ngn:ms2-bow", "hash": "cbce24f5c4", "title": "medsurg-4w-2 · Bowtie · Prioritize hypotheses", "body": ["A 52-year-old with stage 4 chronic kidney disease has a potassium of 6.6. The monitor shows tall, peaked T waves. HR 58.", "", "Complete the diagram.", "", "Condition:", "- Digoxin toxicity", "  No: Digoxin toxicity can cause bradycardia and arrhythmias, but nothing suggests she takes it, and the measured potassium of 6.6 explains the ECG.", "✓ Hyperkalemia with cardiac effects", "  Yes: Potassium of 6.6 with peaked T waves and a slowing heart rate in advanced CKD means potassium is now affecting cardiac conduction, which can progress to fatal arrhythmias.", "- Dehydration", "  No: Dehydration can concentrate potassium, but it is not the condition endangering her; the priority problem is the potassium's effect on the heart.", "- Hypocalcemia", "  No: CKD does cause hypocalcemia, a tempting link, but low calcium shows a prolonged QT interval and signs of tetany, not peaked T waves.", "Actions to take:", "✓ Give IV calcium gluconate as ordered", "  Yes: IV calcium stabilizes the cardiac cell membrane within minutes and protects against arrhythmias; it does not lower potassium, so other therapy is given alongside it.", "- Pause telemetry until the potassium is normal", "  No: Telemetry is exactly what catches the arrhythmias hyperkalemia causes; pausing it removes the key safety monitor during the highest-risk period.", "✓ Give IV regular insulin with dextrose as ordered", "  Yes: Insulin shifts potassium into cells quickly; dextrose is given with it to prevent hypoglycemia, which is more likely in CKD because insulin clears slowly.", "- Give spironolactone", "  No: Spironolactone is a potassium-sparing diuretic that raises potassium; a student may pick it because diuretics can remove potassium, but this one would worsen the problem.", "- Encourage orange juice and bananas", "  No: Orange juice and bananas are high in potassium; they are taught for hypokalemia and would add to an already dangerous level.", "Parameters to monitor:", "- Platelet count", "  No: Platelets are unrelated to hyperkalemia or its treatment; nothing in the scenario points to bleeding or clotting risk.", "- Serum sodium", "  No: Sodium matters in kidney disease, but it is not the problem being treated and does not show whether the potassium emergency is resolving.", "- Urine specific gravity", "  No: Specific gravity reflects urine concentration and hydration; in stage 4 CKD it is unreliable and does not track potassium or cardiac risk.", "✓ Blood glucose", "  Yes: Insulin can cause hypoglycemia for hours after the dose, and reduced kidney clearance in CKD prolongs that risk, so recheck glucose on schedule.", "✓ Cardiac rhythm on telemetry", "  Yes: Continuous rhythm monitoring shows whether the peaked T waves resolve and catches a widening QRS, worsening bradycardia or ventricular arrhythmias early.", "", "Why: Peaked T waves mean the potassium is affecting the heart. Calcium stabilizes the heart muscle within minutes; insulin with dextrose shifts potassium into cells. Watch the rhythm, and the glucose after insulin.", "Tip: In electrolyte emergencies, rank actions as protect the heart first, then shift or remove the electrolyte; distractors often include foods or drugs that worsen the imbalance."], "st": "awaiting"}, {"id": "ngn:ms2-hl", "hash": "9edaf2c1d6", "title": "medsurg-4w-2 · Highlight · Recognize cues", "body": ["Nurse's note, 15:30, for a 68-year-old with a COPD exacerbation who usually runs SpO₂ 88 to 92%.", "", "Highlight the findings that require follow-up.", "", "✓ highlight Respiratory therapist increased oxygen from 2 L to 6 L at 14:00 for an SpO₂ of 87%.", "  Yes: Tripling the oxygen in a known CO2 retainer is a red flag; high oxygen can raise CO2 by blunting respiratory drive and worsening ventilation-perfusion mismatch.", "✓ highlight SpO₂ now 97%.", "  Yes: 97% is above her target of 88 to 92%; in COPD a high saturation can mean too much oxygen, so titrate down and assess her CO2.", "✓ highlight Difficult to rouse; falls asleep mid-sentence.", "  Yes: New difficulty rousing is a change in level of consciousness consistent with rising CO2; it needs immediate assessment and likely a blood gas.", "- Pursed-lip breathing.", "  No: Pursed-lip breathing is a compensatory technique COPD clients use to keep airways open longer; it is expected baseline behavior.", "- Barrel chest.", "  No: A barrel chest reflects chronic air trapping and hyperinflation; it is a long-standing finding, not an acute change.", "- Ate about half of lunch.", "  No: Eating half a meal is common during an exacerbation because of dyspnea and fatigue; it is worth noting but not urgent.", "", "Why: In a CO₂ retainer, too much oxygen blunts the drive to breathe and CO₂ climbs. A saturation above her target, new sleepiness and a big oxygen increase add up to CO₂ narcosis. Pursed lips and a barrel chest are her baseline.", "Tip: Separate chronic baseline findings from new changes; in COPD, a saturation above target paired with new sleepiness is a warning, not reassurance."], "st": "awaiting"}, {"id": "ngn:ms2-mat", "hash": "6eea8b47a9", "title": "medsurg-4w-2 · Matrix · Generate solutions", "body": ["A 24-year-old with suspected appendicitis is going to the OR tonight. Allergy band: penicillin (anaphylaxis). Pain 8/10, RR 16. Urine hCG sent, not yet resulted.", "", "For each order or task, indicate whether the nurse should carry it out or clarify first.", "", "- Ampicillin-sulbactam 3 g IV on call to the OR → Clarify first", "  A penicillin, in a patient with penicillin anaphylaxis.", "- Morphine 4 mg IV for pain 8/10 → Carry out", "  Ordered, indicated, and her breathing is fine.", "- Ondansetron 4 mg IV for nausea → Carry out", "  Ordered and indicated.", "- Send her to the OR before the hCG results → Clarify first", "  Pregnancy status has to be known before anesthesia and surgery.", "- Confirm her allergy band matches the chart → Carry out", "  Always.", "", "Why: Read every order against the allergy list and the pre-op checklist. \"On call to the OR\" is when errors slip through.", "Tip: Before any on-call-to-the-OR order, check every drug against the allergy band, including drugs whose names hide their class, and confirm pre-op requirements such as pregnancy status."], "st": "awaiting"}, {"id": "ngn:ms2-ch1", "hash": "633057a2b8", "title": "medsurg-4w-2 · Delirium tremens · NCLEX challenge · Prioritize hypotheses", "body": ["A 52-year-old admitted 60 hours ago for pancreatitis drinks a fifth of vodka a day. Now: T 38.4, HR 128, BP 172/104, RR 24. Drenched in sweat, disoriented to time and place, picking at the air, says there are snakes on the floor.", "", "Complete the diagram: the condition the client is most likely experiencing, two actions the nurse should take, and two parameters to monitor.", "", "Condition:", "✓ Delirium tremens", "  Yes: Hallucinations, disorientation, fever and autonomic hyperactivity 48 to 96 hours after the last drink are delirium tremens.", "- Wernicke encephalopathy", "  No: Wernicke causes confusion, ataxia and eye movement problems, not fever, hypertension and hallucinations.", "- Hepatic encephalopathy", "  No: Hepatic encephalopathy causes confusion and asterixis, not a hyperadrenergic state.", "- Sepsis from pancreatitis", "  No: Sepsis can cause fever and confusion, but the timing and the vivid hallucinations point to withdrawal. Keep it in mind if he doesn't respond.", "Actions to take:", "✓ Give IV benzodiazepine per the withdrawal protocol", "  Yes: Benzodiazepines are the treatment; delirium tremens often needs large, escalating doses.", "✓ Seizure precautions with continuous monitoring", "  Yes: Withdrawal seizures and arrhythmias can happen; he needs close monitoring.", "- Give haloperidol as the first-line drug", "  No: Haloperidol doesn't treat withdrawal and lowers the seizure threshold. It may be added only after benzodiazepines.", "- Give IV dextrose before thiamine", "  No: Glucose before thiamine can precipitate Wernicke encephalopathy. Thiamine goes first.", "- Restrict fluids to prevent cerebral edema", "  No: He's febrile, sweating and losing fluid; he needs fluids, not a restriction.", "Parameters to monitor:", "✓ Withdrawal score (CIWA-Ar) and level of sedation", "  Yes: The score guides dosing, and sedation tells you if you've given too much.", "✓ Heart rate and blood pressure", "  Yes: Autonomic hyperactivity is part of the danger, and it should settle as treatment works.", "- Serum ammonia", "  No: Ammonia is for hepatic encephalopathy.", "- Blood alcohol level", "  No: The level doesn't guide withdrawal treatment; withdrawal happens as it falls.", "- Hemoglobin A1c", "  No: A1c doesn't help here.", "", "Why: This is delirium tremens, a medical emergency with real mortality. Treat with benzodiazepines titrated to symptoms, protect against seizures, give thiamine before glucose, and watch for oversedation.", "Tip: Bowtie: pick the condition first, then choose actions and parameters that match it, not ones that would fit a lookalike."], "st": "awaiting"}, {"id": "ngn:ms2-ch2", "hash": "f42e7b416c", "title": "medsurg-4w-2 · Acute hemolytic transfusion reaction · NCLEX challenge · Take action", "body": ["Ten minutes into a unit of packed red cells, the client reports back pain and chills. T 38.7, HR 124, BP 92/56.", "", "Complete the sentences.", "", "Blank 1:", "✓ stop the transfusion", "  Yes: Every milliliter makes a hemolytic reaction worse; stopping it is the first action.", "- slow the transfusion", "  No: Slowing still gives incompatible blood.", "- give acetaminophen", "  No: It treats the fever but not the reaction, and can hide it.", "Blank 2:", "- D5W through new tubing", "  No: Dextrose solutions hemolyze red cells and aren't used with blood.", "- normal saline through the blood tubing", "  No: The old tubing still holds incompatible blood.", "✓ normal saline through new tubing", "  Yes: New tubing avoids flushing the blood left in the old line into the client.", "Blank 3:", "- kept at the bedside for the provider", "  No: They need to go to the blood bank promptly.", "✓ sent to the blood bank with blood and urine samples", "  Yes: The blood bank tests them to find the cause.", "- discarded in a biohazard bin", "  No: Discarding them destroys the evidence.", "", "Why: Suspected hemolytic reaction: stop, keep the vein open with saline through new tubing, check vitals, notify the provider and the blood bank, and send the bag, tubing and samples for testing. Watch urine output and color.", "Tip: \"First\" questions: the action that stops the harm comes before treating the symptoms."], "st": "awaiting"}, {"id": "ngn:ms3-bow", "hash": "4053199484", "title": "medsurg-4w-3 · Bowtie · Prioritize hypotheses", "body": ["At 01:09, a 71-year-old with pneumonia has a new right facial droop, right arm drift and slurred speech. His last normal neuro check was at 21:00. BP 188/96. Glucose 142.", "", "Complete the diagram.", "", "Condition:", "- Delirium from the infection", "  No: Delirium from infection causes global, fluctuating confusion, not new one-sided weakness; blaming the pneumonia would waste the treatment window.", "- Hypoglycemia", "  No: Hypoglycemia can mimic stroke, which is why glucose is checked first, but a glucose of 142 rules it out here.", "- Bell's palsy", "  No: Bell's palsy affects only the face, including the forehead; it does not cause arm drift or slurred speech.", "✓ Acute ischemic stroke", "  Yes: Sudden one-sided facial droop, arm drift and slurred speech are focal deficits; with a normal glucose, ischemic stroke is the working diagnosis until imaging rules out bleeding.", "Actions to take:", "- Give his oral aspirin now", "  No: Aspirin is tempting because it treats clots, but it cannot be given before imaging rules out hemorrhage, and nothing goes by mouth before a swallow screen.", "- Lower his BP to 120 systolic right away", "  No: Rapid BP lowering reduces blood flow to at-risk brain tissue; BP is lowered only to under 185/110 if a thrombolytic is planned, not to normal.", "✓ Call a stroke alert", "  Yes: Last known well was 21:00, so he may still be within the thrombolytic window; a stroke alert brings rapid imaging and the stroke team now.", "- Wait an hour to see if it resolves", "  No: Waiting to see if symptoms resolve uses up the treatment window; even symptoms that improve need emergency evaluation.", "✓ Keep him NPO until a swallow screen", "  Yes: Dysphagia is common after stroke and raises aspiration risk, already a concern with pneumonia; nothing by mouth, including medicines, until he passes a swallow screen.", "Parameters to monitor:", "✓ Neuro checks (NIH Stroke Scale)", "  Yes: Serial NIH Stroke Scale scores detect worsening or improvement objectively and are required before and after any thrombolytic.", "- Serum lipase", "  No: Lipase is a marker for pancreatitis and has no role in stroke monitoring.", "- Hemoglobin A1c", "  No: A1c is a long-term diabetes marker; it may matter for secondary prevention later but does not guide acute stroke care.", "- Daily weight", "  No: Daily weight tracks fluid balance in heart failure or kidney disease; it does not reflect acute stroke changes.", "✓ Blood pressure", "  Yes: BP must stay under 185/110 before a thrombolytic and under 180/105 afterward to limit bleeding risk, while too low a pressure worsens ischemia.", "", "Why: Last known well sets the treatment window, so call now. Nothing by mouth until he passes a swallow screen. BP is kept under 185/110 if he may get a clot-buster, not dropped to normal.", "Tip: With sudden focal deficits, time is the priority cue: find the last known well time, and reject any option that waits, gives oral medication first, or drops the BP to normal."], "st": "awaiting"}, {"id": "ngn:ms3-sata", "hash": "25f81eaddc", "title": "medsurg-4w-3 · Select all · Recognize cues", "body": ["A 45-year-old is on post-op day 0 after an open hysterectomy, with a hydromorphone PCA. Her husband has been pressing the button \"so she stays comfortable\" while she sleeps.", "", "Which findings indicate opioid-induced respiratory depression? Select all that apply.", "", "✓ Pinpoint pupils", "  Yes: Pinpoint pupils show strong opioid effect on the brainstem; together with sedation and slow breathing, they point to opioid excess rather than another cause.", "- Pain 6/10 when awake", "  No: Moderate pain when awake shows the opioid is not over-treating her; it is not a sign of respiratory depression.", "✓ Snoring with pauses in her breathing", "  Yes: Snoring with pauses signals airway obstruction and apnea during opioid-induced sleep, a dangerous sign even when pulse oximetry still looks acceptable.", "✓ Respiratory rate 9", "  Yes: A respiratory rate under 10 is a classic sign of opioid-induced respiratory depression; stimulate her, stop the PCA and anticipate naloxone.", "- Nausea", "  No: Nausea is a common opioid side effect, so students link it to overdose, but it does not indicate depressed breathing.", "✓ Drifts off to sleep mid-sentence (POSS 3)", "  Yes: POSS 3 means frequently drowsy and drifting off mid-conversation; sedation comes before respiratory depression, so this is the early warning to stop the opioid and monitor closely.", "", "Why: Sedation comes before respiratory depression, so it's the early sign to watch. Pulse oximetry falls late, especially on oxygen. Only the patient presses a PCA.", "Tip: Remember the sequence: sedation comes before respiratory depression; choose findings that reflect central nervous system and breathing changes, and skip common side effects like nausea."], "st": "awaiting"}, {"id": "ngn:ms3-cloze", "hash": "be483027bd", "title": "medsurg-4w-3 · Drop-down · Evaluate outcomes", "body": ["A 26-year-old with diabetic ketoacidosis is on an insulin infusion.", "", "Complete the sentences.", "", "Blank 1:", "- potassium is over 5", "  No: Potassium guides replacement and the safety of starting insulin, but a potassium over 5 is not the endpoint of DKA treatment.", "- glucose is under 200", "  No: Glucose usually falls well before the acidosis resolves; stopping insulin at a glucose target leaves ketoacidosis untreated, so dextrose is added instead of stopping insulin.", "✓ ketoacidosis has resolved (gap closed, ketones down)", "  Yes: DKA is resolved when the ketoacidosis clears (anion gap closed, ketones down), not when the glucose normalizes, so the drip continues until then.", "Blank 2:", "- 10 minutes", "  No: Ten minutes is too little time for subcutaneous insulin to be absorbed, so the client would be left briefly with no effective insulin.", "- 24 hours", "  No: A full day of both insulins is unnecessary and raises hypoglycemia risk; the standard overlap is a couple of hours, not 24.", "✓ 2 hours", "  Yes: Subcutaneous basal insulin needs time to absorb; overlapping it about 2 hours with the drip prevents a gap in insulin that lets ketoacidosis return.", "Blank 3:", "- between 4 and 5", "  No: Between 4 and 5 is a safe range to continue insulin with potassium added to the fluids; nothing needs to be held.", "- over 5.0", "  No: Over 5.0 is when potassium replacement is held, not insulin; insulin is still needed and will lower the potassium.", "✓ under 3.5", "  Yes: Insulin drives potassium into cells; starting or continuing it with potassium under 3.5 can drop the level enough to cause dangerous arrhythmias, so replace potassium first.", "", "Why: The acidosis (anion gap and ketones), not the glucose, tells you DKA has resolved. Without overlap, ketones come back within hours. Insulin drives potassium into cells, so a low potassium has to be fixed first (the 2024 ADA consensus holds insulin for K under 3.5).", "Tip: In DKA, follow the acidosis rather than the glucose, and remember insulin drives potassium into cells; any question about holding insulin is really about a low potassium."], "st": "awaiting"}, {"id": "ngn:ms3-ch1", "hash": "7a97c79fc2", "title": "medsurg-4w-3 · Delirium from urinary retention · NCLEX challenge · Recognize cues", "body": ["Night nurse's note, 02:00, for an 84-year-old admitted for a fall. Oriented and pleasant at 20:00.", "", "Highlight the findings that need follow-up.", "", "✓ highlight Now restless, pulling at her IV, calling for her late husband.", "  Yes: An acute change in attention and thinking is delirium, and it has a cause to find.", "✓ highlight Last voided at 17:00.", "  Yes: Nine hours without voiding in an older adult points to retention.", "✓ highlight Bladder scan 820 mL.", "  Yes: Urinary retention is a common, reversible cause of delirium.", "✓ highlight Diphenhydramine 50 mg given at 22:00 for sleep.", "  Yes: Anticholinergic drugs cause both retention and delirium in older adults.", "- Hearing aid in place.", "  No: That's good practice for preventing delirium.", "- Ate 75% of dinner.", "  No: Normal intake.", "- SpO₂ 96% on room air.", "  No: Normal; low oxygen is ruled out as a cause.", "", "Why: New delirium has a cause. Here: an anticholinergic sleep aid and a full bladder. Straight-cath per orders, report the diphenhydramine, and avoid it in older adults.", "Tip: With new confusion in an older adult, look for causes in the note: drugs, retention, infection, low oxygen, pain."], "st": "awaiting"}, {"id": "ngn:ms3-ch2", "hash": "d229133f39", "title": "medsurg-4w-3 · DKA treatment response · NCLEX challenge · Evaluate outcomes", "body": ["A 24-year-old with DKA has been on an insulin infusion and IV fluids for 6 hours. New results: glucose 194 (was 520), anion gap 14 (was 26), K 3.2 (was 5.1), bicarbonate 16 (was 8), HR 96 (was 128). She now has a new headache.", "", "For each finding, indicate whether it shows expected progress or needs follow-up now.", "", "- Glucose 194 → Needs follow-up", "  Falling is good, but under about 200 to 250 she needs dextrose added to her fluids so the insulin can keep clearing ketones without dropping her too low.", "- Anion gap 14 → Expected progress", "  Closing toward normal: the ketoacidosis is resolving.", "- Potassium 3.2 → Needs follow-up", "  Insulin is moving potassium into cells. It needs replacing now, and the drip may need adjusting per protocol.", "- Bicarbonate 16 → Expected progress", "  Rising toward normal: the acidosis is correcting.", "- Heart rate 96 → Expected progress", "  Falling with fluids: volume is coming back.", "- New headache → Needs follow-up", "  During DKA treatment, a new headache can be an early sign of cerebral edema. Report it and check neuro status.", "", "Why: Progress isn't just a falling glucose. Watch for the three follow-ups during DKA treatment: add dextrose when glucose falls, replace potassium, and take new neuro symptoms seriously.", "Tip: \"Expected progress\" can still need an action. Ask whether a normal-looking trend changes what you need to do next."], "st": "awaiting"}, {"id": "ngn:sd-bow", "hash": "35e4623556", "title": "stepdown-6e-1 · Bowtie · Prioritize hypotheses", "body": ["A 59-year-old had a stent placed through the right femoral artery at 04:30. At 08:30 he has new right low back pain, 6/10. HR 102 (78 at 07:00), BP 108/70 (134/80 at 07:00). The groin site is soft with no hematoma; distal pulses are 2+.", "", "Complete the diagram.", "", "Condition:", "- Pulmonary embolism", "  No: PE causes sudden dyspnea, pleuritic chest pain and hypoxia; this client has back pain and hemodynamic changes that point to bleeding.", "- Stent thrombosis", "  No: Stent thrombosis causes chest pain and ST changes from coronary occlusion, not back pain with signs of blood loss.", "✓ Retroperitoneal bleeding", "  Yes: New back pain with a rising heart rate and falling BP hours after femoral access is the classic picture of a retroperitoneal bleed, which can occur with a clean groin site.", "- Back strain from lying flat", "  No: Back discomfort from lying flat is common after a cath, which makes this tempting, but it does not cause tachycardia and a falling BP.", "Actions to take:", "- Hold the aspirin and ticagrelor on your own", "  No: Stopping antiplatelets after a fresh stent risks stent thrombosis, so that decision belongs to the cardiologist; the nurse reports and advocates rather than acting alone.", "- Give morphine and reassess in 2 hours", "  No: Morphine treats the pain but can lower the BP further and mask worsening; waiting 2 hours delays treatment of a possible hemorrhage.", "✓ Keep him flat and place a second large-bore IV", "  Yes: Lying flat limits stress on the arterial puncture, and a second large-bore IV prepares for rapid fluids or blood if he becomes unstable.", "- Sit him up to relieve the back pain", "  No: Sitting up flexes the hip and stresses the femoral puncture, which can worsen bleeding; it treats the symptom, not the cause.", "✓ Notify the provider and anticipate a CT of the abdomen and pelvis", "  Yes: A suspected retroperitoneal bleed needs prompt provider evaluation; CT of the abdomen and pelvis confirms the bleed and its size.", "Parameters to monitor:", "✓ Heart rate and blood pressure", "  Yes: Trending HR and BP shows whether bleeding continues; a rising heart rate with a falling pressure signals worsening hypovolemia and possible shock.", "- Blood glucose", "  No: Glucose is not affected by bleeding and does not reflect this complication.", "- Size of the groin hematoma", "  No: The groin is tempting to watch, but a retroperitoneal bleed tracks into the back of the abdomen without a visible hematoma, so a clean site is falsely reassuring.", "✓ Hemoglobin", "  Yes: Serial hemoglobin shows ongoing blood loss and guides transfusion, though the drop can lag behind acute bleeding.", "- Troponin", "  No: Troponin tracks myocardial injury; nothing suggests a new coronary event, and it would not show the course of a bleed.", "", "Why: A retroperitoneal bleed hides behind a clean groin. Back or flank pain with a rising heart rate and falling pressure after femoral access is the pattern. Stopping a fresh stent's antiplatelets is the cardiologist's call.", "Tip: After femoral access, back or flank pain plus a rising heart rate is a bleed until proven otherwise; options that watch only the visible site or treat only the pain are the traps."], "st": "awaiting"}, {"id": "ngn:sd-mat", "hash": "8a1bf0ffc1", "title": "stepdown-6e-1 · Matrix · Generate solutions", "body": ["A 74-year-old on day 5 of a heparin infusion for pulmonary emboli has platelets of 98, down from 230 on admission. No other cause is found.", "", "For each action, indicate whether it is indicated or contraindicated.", "", "- Stop the heparin infusion → Indicated", "  Suspected HIT: all heparin stops.", "- Flush her saline lock with heparin 10 units/mL → Contraindicated", "  Flushes are heparin too.", "- Transfuse platelets for a count of 98 → Contraindicated", "  Platelets can fuel clotting in HIT.", "- Start argatroban as ordered → Indicated", "  She still has a PE and now a clotting disorder.", "- Start warfarin today → Contraindicated", "  Warfarin waits until platelets recover; early warfarin in HIT can cause limb gangrene.", "- Send a PF4/heparin antibody test → Indicated", "  Confirms the diagnosis.", "", "Why: A drop of more than half, 5 to 10 days after starting heparin, is the classic picture of HIT. It causes clots, not bleeding, so the treatment is a different anticoagulant.", "Tip: In HIT, think clotting, not bleeding: stop every source of heparin, start a non-heparin anticoagulant, and avoid anything that adds clot risk, such as platelets or early warfarin."], "st": "awaiting"}, {"id": "ngn:sd-sata", "hash": "e1304c1519", "title": "stepdown-6e-1 · Select all · Take action", "body": ["An 81-year-old admitted for syncope has a QTc of 516 ms. K 3.2, Mg 1.4. He takes citalopram 40 mg daily. The unit has a nurse-initiated electrolyte replacement protocol.", "", "Which actions reduce his risk of torsades de pointes? Select all that apply.", "", "✓ Hold the citalopram and notify the provider", "  Yes: Citalopram prolongs the QT in a dose-dependent way, and the FDA advises no more than 20 mg daily over age 60; changing therapy needs the provider, so notify.", "- Silence the frequent alarms as artifact", "  No: Frequent alarms in a client with a long QT may be ectopy or runs of torsades; calling them artifact without assessing the client is a classic alarm-fatigue error.", "- Give his furosemide as scheduled", "  No: Furosemide wastes potassium and magnesium,
