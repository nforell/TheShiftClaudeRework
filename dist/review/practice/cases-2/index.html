<style>
:root{--bg:#E6EDF0;--surface:#FBFCFC;--surface-2:#EDF2F4;--ink:#152238;--ink-2:#4D5A6F;--line:#CAD5DB;--teal:#2449A8;--teal-ink:#fff;--red:#B3342B;--red-bg:#F8E1DE;--good:#2B7249;--good-bg:#E0F0E6;--amber:#A96C0E;--amber-bg:#FBEFD6;
  --serif:"Barlow Condensed","Arial Narrow",sans-serif;--sans:"Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161C;--surface:#1A1F27;--surface-2:#212833;--ink:#E7E4DB;--ink-2:#A0A5AE;--line:#343C48;--teal:#93B4E4;--teal-ink:#0F1B2C;--red:#F0766B;--red-bg:#3b1d1b;--good:#72c692;--good-bg:#16301f;--amber:#E9AE4E;--amber-bg:#35291a}}
:root[data-theme="dark"]{--bg:#12161C;--surface:#1A1F27;--surface-2:#212833;--ink:#E7E4DB;--ink-2:#A0A5AE;--line:#343C48;--teal:#93B4E4;--teal-ink:#0F1B2C;--red:#F0766B;--red-bg:#3b1d1b;--good:#72c692;--good-bg:#16301f;--amber:#E9AE4E;--amber-bg:#35291a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
main{max-width:52rem;margin:0 auto;padding:clamp(1.2rem,5vw,3rem) 16px calc(5rem + env(safe-area-inset-bottom))}
a{color:var(--teal)}
.home{font-family:var(--serif);font-weight:700;font-size:1.1rem;letter-spacing:.04em;text-transform:uppercase;background:var(--ink);color:var(--bg);padding:.28em .55em .22em;border-radius:2px;text-decoration:none}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.9rem,6vw,2.6rem);line-height:1.1;letter-spacing:0;margin:1.6rem 0 .3rem}
h2{font-size:1.15rem;margin:2.4rem 0 .6rem}
h3{font-size:1rem;margin:0}
p{margin:.5rem 0}
.muted{color:var(--ink-2)}
.meta{display:flex;flex-wrap:wrap;gap:.4rem .6rem;margin-top:.6rem}
.chip{display:inline-flex;align-items:center;padding:.15em .6em;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--surface-2);border:1px solid var(--line)}
.chip.awaiting{background:var(--amber-bg);border-color:transparent;color:var(--amber)}
.chip.reviewed{background:var(--good-bg);border-color:transparent;color:var(--good)}
.chip.changed{background:var(--red-bg);border-color:transparent;color:var(--red)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem 1.1rem;margin:.8rem 0}
.how ol{margin:.4rem 0 0;padding-left:1.2rem}.how li{margin:.2rem 0}
label{display:block;font-weight:600;font-size:.9rem;margin:.7rem 0 .25rem}
input[type=text],input[type=email],textarea,select{width:100%;min-height:44px;padding:.5em .7em;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:5rem;resize:vertical}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:0 1rem}
details.pt{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:.6rem 0}
details.pt>summary{cursor:pointer;padding:.85rem 1rem;font-weight:600;list-style-position:inside}
details.pt>div{padding:0 1rem 1rem}
table{width:100%;border-collapse:collapse;font-size:.88rem;margin:.4rem 0}
th,td{text-align:left;vertical-align:top;padding:.35rem .5rem .35rem 0;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--ink-2);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
.scroll{overflow-x:auto}
ul.plain{margin:.3rem 0;padding-left:1.1rem}
.dec{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:.85rem 1rem;margin:.6rem 0}
.dec.pos{border-left-color:var(--good)}.dec.neg{border-left-color:var(--red)}
.dec .top{display:flex;flex-wrap:wrap;gap:.3rem .5rem;align-items:center;font-size:.78rem;color:var(--ink-2);font-weight:600}
.pts{font-weight:700;padding:.05em .45em;border-radius:4px;background:var(--surface-2)}
.pos .pts{color:var(--good);background:var(--good-bg)}.neg .pts{color:var(--red);background:var(--red-bg)}
.dec b{display:block;margin:.35rem 0 .15rem;font-size:1rem}
.dec .why{font-family:var(--sans);color:var(--ink-2);margin:0}
.dec .src{font-size:.75rem;color:var(--ink-2);margin-top:.35rem}
.verdict{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.7rem}
.verdict button{min-height:40px;padding:.35em .9em;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer}
.verdict button[aria-pressed="true"][data-v="ok"]{background:var(--good);border-color:var(--good);color:var(--teal-ink)}
.verdict button[aria-pressed="true"][data-v="fix"]{background:var(--red);border-color:var(--red);color:var(--teal-ink)}
.verdict button[aria-pressed="true"][data-v="unsure"]{background:var(--amber);border-color:var(--amber);color:var(--teal-ink)}
.dec textarea{margin-top:.5rem;min-height:3.6rem}
.opt{padding:.4rem 0;border-bottom:1px solid var(--line);font-size:.92rem}.opt:last-child{border:0}
.opt i{font-style:normal;font-weight:700;font-size:.75rem;padding:.05em .4em;border-radius:4px;margin-right:.4rem;background:var(--surface-2)}
.bar{position:sticky;top:0;z-index:5;margin:0 -16px;padding:.6rem 16px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:.6rem;font-size:.9rem}
.bar .prog{display:block;flex:1;min-width:4rem;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;max-width:12rem}.bar .prog i{display:block;height:100%;background:var(--teal)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:.55em 1.2em;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn-primary{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.row{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1rem}
.check{display:flex;gap:.6rem;align-items:flex-start;font-weight:500;margin-top:1rem}
.check input{width:1.2rem;height:1.2rem;margin-top:.2rem;flex:none}
.msg{margin-top:.8rem;font-weight:600}.msg.err{color:var(--red)}.msg.ok{color:var(--good)}
pre{white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:.8rem;font-size:.8rem;max-height:18rem;overflow:auto}
.shifts a{display:block;text-decoration:none;color:inherit}
.shifts .card:hover{border-color:var(--ink-2)}
</style>
<style>.item .body p{margin:.15rem 0}.item .body .why{color:var(--ink-2);font-size:.92rem;margin:0 0 .35rem 1.1rem}.item .body .ok b{display:inline;margin:0;color:var(--good)}.item .body .no{color:var(--ink)}.item .body .sp{height:.5rem}.item>b{margin-bottom:.5rem}</style></head>

nd sequential compression devices.", "Medication Administration Record 07:30: Enoxaparin 40 mg subcutaneous daily at 21:00; last given yesterday at 21:00. Oxycodone 5 mg PO every 4 hours PRN pain; last given 06:30. Lisinopril 10 mg PO daily at 09:00.", "Nurses' Notes 08:00: Reports hip pain 3/10 after oxycodone at 06:30. Incision dry with edges approximated. Mild swelling and bruising of the right thigh around the incision. Reports aching and tightness in the right calf since early morning. Right calf is 3 cm larger than the left and is warm and slightly red. Pedal pulses 2+ and equal; toes warm with brisk capillary refill. Declined sequential compression devices overnight because of the noise. Has been out of bed once since surgery.", "Vital Signs 08:00: Temperature 37.6 °C (99.7 °F); Heart rate 92; Blood pressure 138/82; Respiratory rate 18; SpO₂ 95% on room air", "Orders 08:30 (shown from item 2): Venous duplex ultrasound of the right lower extremity today. Notify provider of result.", "Nurses' Notes 10:40 (shown from item 3): After getting up to the bedside commode with assistance, the client suddenly says, \"I can't catch my breath,\" and reports sharp right-sided chest pain that is worse when she breathes in. Anxious and restless. Lungs clear bilaterally. No petechiae. Alert and oriented x4. Duplex ultrasound not yet done.", "Vital Signs 10:42 (shown from item 3): Temperature 37.7 °C (99.9 °F); Heart rate 124; Blood pressure 108/68; Respiratory rate 30; SpO₂ 86% on room air", "Laboratory Results 11:30 (shown from item 5): Hemoglobin 10.8 g/dL (low); Platelets 210,000/mm³; aPTT 30 seconds; Creatinine 0.9 mg/dL", "Imaging 11:40 (shown from item 5): CT pulmonary angiography: filling defects in the right lower lobe segmental arteries consistent with acute pulmonary embolism. No right heart strain. Venous duplex: occlusive thrombus in the right popliteal and posterior tibial veins.", "Vital Signs 11:40 (shown from item 5): Heart rate 108; Blood pressure 116/72; Respiratory rate 24; SpO₂ 94% on 4 L nasal cannula", "Orders 11:45 (shown from item 5): Discontinue enoxaparin. Heparin weight-based protocol: 80 units/kg IV bolus (6,240 units), then 18 units/kg/h continuous infusion (1,404 units/h). aPTT 6 hours after start and 6 hours after each rate change; goal 60 to 100 seconds; adjust rate per protocol nomogram. CBC with platelets daily. Oxygen by nasal cannula titrated to SpO₂ 94% or higher. Bleeding precautions.", "Laboratory Results 05:45 (shown from item 6): aPTT 74 seconds; Hemoglobin 10.5 g/dL (low); Platelets 198,000/mm³", "Vital Signs 06:00 (shown from item 6): Temperature 37.2 °C (99.0 °F); Heart rate 90; Blood pressure 126/76; Respiratory rate 18; SpO₂ 95% on 2 L nasal cannula", "Nurses' Notes 06:00 (shown from item 6): Breathing easier; speaks in full sentences. Pleuritic chest pain 2/10. Right calf remains swollen, 2 cm larger than the left. Pink-tinged urine noted in the bedside commode at 05:30. Incision dry. Heparin infusing at 1,400 units/h per protocol.", "", "Refer to the chart. Nurses' note at 08:00 on post-op day 2.", "", "Highlight the findings that require follow-up.", "", "- Reports hip pain 3/10 after oxycodone at 06:30.", "  No: mild incisional pain controlled with an oral opioid is expected on post-op day 2.", "- Incision dry with edges approximated.", "  No: a dry, closed incision is a normal healing finding and needs no action.", "- Mild swelling and bruising of the right thigh around the incision.", "  No: some thigh swelling and bruising near the surgical site are expected after hip arthroplasty.", "✓ highlight Reports aching and tightness in the right calf since early morning.", "  Yes: new calf pain in one leg after hip surgery is a classic early symptom of deep vein thrombosis.", "✓ highlight Right calf is 3 cm larger than the left and is warm and slightly red.", "  Yes: unilateral calf swelling, warmth and redness away from the incision point to a DVT and need to be reported.", "- Pedal pulses 2+ and equal; toes warm with brisk capillary refill.", "  No: these show normal arterial flow. The trap is thinking good pulses rule out a venous clot; they do not.", "✓ highlight Declined sequential compression devices overnight because of the noise.", "  Yes: missing mechanical prophylaxis raises clot risk and calls for teaching and a plan the client will accept.", "✓ highlight Has been out of bed once since surgery.", "  Yes: immobility causes venous stasis, a major part of Virchow's triad, so early mobility needs follow-up.", "", "Why: Hip arthroplasty is one of the highest-risk surgeries for venous thromboembolism. One-sided calf pain, swelling, warmth and redness are the early cues, and immobility plus refused compression devices add risk. Incisional pain, thigh bruising and good pulses are expected findings.", "Tip: Separate findings at the surgical site, which are usually expected, from new findings in a different part of the limb."], "st": "awaiting"}, {"id": "ngn:cs-hip-pe-2", "hash": "1f3953821a", "title": "68-year-old on day 2 after hip arthroplasty · item 2 · Matrix · Analyze cues", "body": ["Refer to the chart.", "", "For each finding, indicate whether it is more consistent with a deep vein thrombosis or is expected after hip arthroplasty.", "", "- Aching and tightness in the right calf → Consistent with DVT", "  a clot in the deep calf veins blocks venous return and inflames the vein wall, causing pain well below the surgical site.", "- Right calf 3 cm larger than the left, warm and red → Consistent with DVT", "  blocked outflow and inflammation cause one-sided swelling and warmth; a difference of 3 cm or more is significant.", "- Mild swelling and bruising of the right thigh around the incision → Expected after hip arthroplasty", "  tissue trauma from surgery causes local swelling and bruising near the hip that fades over days.", "- Hip pain 3/10 after oral oxycodone → Expected after hip arthroplasty", "  controlled incisional pain is the normal course on day 2. The trap is linking all leg pain to a clot.", "- Pedal pulses 2+ and equal with warm toes → Expected after hip arthroplasty", "  arterial flow is intact as expected; a DVT affects veins, so normal pulses do not rule it out.", "", "Why: The location of the finding matters. Swelling and pain at the hip incision are part of normal healing, while one-sided calf pain, swelling and warmth point to a DVT. Normal pulses reflect arterial flow and do not exclude a venous clot. Duplex ultrasound confirms the diagnosis.", "Tip: Ask whether each finding is at the surgical site or downstream of it, and whether it is arterial or venous."], "st": "awaiting"}, {"id": "ngn:cs-hip-pe-3", "hash": "083d9143ce", "title": "68-year-old on day 2 after hip arthroplasty · item 3 · Drop-down · Prioritize hypotheses", "body": ["Refer to the chart.", "", "Complete the sentences.", "", "Blank 1:", "✓ pulmonary embolism", "  Yes: a suspected calf DVT followed by sudden dyspnea, tachycardia, pleuritic pain and hypoxemia after getting up fits a clot traveling to the lungs.", "- fat embolism syndrome", "  No: fat embolism usually follows long bone fractures and brings confusion and petechiae; this client is oriented with no petechiae.", "- postoperative atelectasis", "  No: atelectasis develops gradually with diminished breath sounds and low-grade fever, not a sudden drop to SpO₂ 86% with clear lungs.", "Blank 2:", "✓ sudden dyspnea and pleuritic pain after signs of a calf DVT", "  Yes: the earlier calf findings give a clot source, and the abrupt respiratory change with movement shows it likely embolized.", "- new confusion with a petechial rash across the chest and axillae", "  No: this pattern suggests fat embolism, and neither finding is in this client's record.", "- a temperature of 37.7 °C (99.9 °F)", "  No: a low-grade temperature is nonspecific after surgery and does not explain sudden hypoxemia.", "Blank 3:", "- acute pain", "  No: the pleuritic pain is real, but airway and breathing problems come before comfort.", "- risk for bleeding", "  No: bleeding becomes a concern once anticoagulation starts; it is not the current threat.", "✓ impaired gas exchange", "  Yes: a clot blocking pulmonary blood flow causes a ventilation and perfusion mismatch, shown by SpO₂ 86%, which threatens oxygen delivery.", "", "Why: A post-op client with signs of a calf DVT who suddenly becomes short of breath, tachycardic and hypoxemic has a pulmonary embolism until proven otherwise. Fat embolism and atelectasis are distractors that do not fit the clear lungs, normal orientation and sudden onset. Oxygenation is the immediate priority.", "Tip: Link the earlier cues to the new ones: a clot source plus sudden respiratory distress points to an embolism."], "st": "awaiting"}, {"id": "ngn:cs-hip-pe-4", "hash": "45bb78ddfd", "title": "68-year-old on day 2 after hip arthroplasty · item 4 · Select all · Generate solutions", "body": ["Refer to the chart.", "", "Which actions should the nurse plan now? Select all that apply.", "", "✓ Apply oxygen and titrate to keep SpO₂ at 94% or higher.", "  Yes: supplemental oxygen treats the hypoxemia caused by blocked pulmonary blood flow.", "✓ Stay with the client and call the rapid response team.", "  Yes: sudden hypoxemia and tachycardia need immediate team support; the nurse should not leave an unstable client alone.", "- Give the 21:00 enoxaparin dose now.", "  No: a prophylactic dose is not treatment, and giving it early without an order complicates starting a heparin infusion.", "- Lay the client flat with both legs elevated.", "  No: lying flat makes breathing harder in respiratory distress. Leg elevation does not treat an embolism.", "- Walk the client in the hall to improve lung expansion.", "  No: activity increases oxygen demand in a hypoxemic client and could dislodge more clot from the leg.", "✓ Raise the head of the bed to Fowler position while keeping the right hip flexed no more than 90 degrees.", "  Yes: upright positioning eases breathing, and limiting hip flexion respects posterior hip precautions to prevent dislocation.", "✓ Prepare for CT pulmonary angiography and anticipate a heparin infusion.", "  Yes: CT angiography confirms the embolism, and therapeutic anticoagulation stops the clot from growing.", "- Massage the right calf to relieve the aching.", "  No: massaging a leg with a suspected DVT can dislodge more clot and send it to the lungs.", "", "Why: Suspected pulmonary embolism is an emergency. The nurse stays with the client, calls for help, positions upright within hip precautions and gives oxygen, then prepares for diagnosis and anticoagulation. The leg is never massaged, and the client is not made to exert herself.", "Tip: For sudden respiratory distress, choose actions that support breathing and bring help first, then ones that prepare for definitive treatment."], "st": "awaiting"}, {"id": "ngn:cs-hip-pe-5", "hash": "5aced0457b", "title": "68-year-old on day 2 after hip arthroplasty · item 5 · Ordered response · Take action", "body": ["Refer to the chart.", "", "Place the nurse's actions for starting the heparin protocol in the correct order.", "", "Correct order:", "1. Verify the weight-based order against the client's current weight of 78 kg.", "  Yes: weight-based doses are only safe if the weight is accurate and in kilograms, so verification comes first.", "2. Have a second nurse independently double-check the doses and pump programming.", "  Yes: heparin is a high-alert medication, so an independent double-check catches errors before any drug reaches the client.", "3. Give the 6,240-unit heparin bolus IV as ordered.", "  Yes: the bolus quickly brings heparin to a therapeutic level and is given before the infusion starts.", "4. Start the continuous infusion at 1,404 units/h on an infusion pump.", "  Yes: the continuous infusion maintains the level; a pump is required for an accurate, steady rate.", "5. Draw an aPTT 6 hours after the infusion starts.", "  Yes: heparin reaches a steady state in about 6 hours, so the first aPTT is drawn then to guide dosing.", "6. Adjust the infusion rate per the protocol nomogram based on the aPTT result.", "  Yes: the rate is changed only after a result is available, following the protocol rather than guesswork.", "", "Why: Heparin is a high-alert drug, so the sequence moves from verifying weight and dose, to an independent double-check, to bolus, then infusion. Monitoring follows at 6 hours, using aPTT here or anti-Xa where that is the protocol. Baseline aPTT and platelets were already drawn before the first dose.", "Tip: For high-alert infusions, think verify, double-check, give, then monitor and adjust."], "st": "awaiting"}, {"id": "ngn:cs-hip-pe-6", "hash": "d56f426e5c", "title": "68-year-old on day 2 after hip arthroplasty · item 6 · Matrix · Evaluate outcomes", "body": ["Refer to the chart.", "", "For each finding, indicate whether it is expected or shows improvement, or requires follow-up.", "", "- SpO₂ 95% on 2 L, down from 4 L → Expected or improving", "  oxygenation is meeting the goal on less oxygen, showing gas exchange is improving.", "- Respiratory rate 18 and speaking in full sentences → Expected or improving", "  work of breathing has returned to normal from a rate of 30 with distress.", "- aPTT 74 seconds → Expected or improving", "  this falls within the ordered goal of 60 to 100 seconds, so anticoagulation is therapeutic.", "- Platelets 198,000/mm³ → Expected or improving", "  a stable platelet count shows no sign of heparin-induced thrombocytopenia so far.", "- Right calf still 2 cm larger than the left → Expected or improving", "  heparin stops clot growth but does not dissolve the clot, so swelling settles slowly over days.", "- Pink-tinged urine → Requires follow-up", "  blood in the urine is a bleeding sign during anticoagulation and must be reported, with the aPTT and hemoglobin reviewed.", "", "Why: The client's oxygenation and breathing have improved, and the aPTT is in range with stable platelets. Persistent calf swelling is expected because heparin prevents extension rather than dissolving clot. New hematuria is a bleeding sign that needs prompt reporting even when lab values look therapeutic.", "Tip: When evaluating an anticoagulant, check both whether it is working and whether it is causing bleeding."], "st": "awaiting"}, {"id": "ngn:cs-gi-bleed-1", "hash": "4bbc404439", "title": "56-year-old with cirrhosis and hematemesis · item 1 · Highlight · Recognize cues", "body": ["Client: 58-year-old male with alcohol-related cirrhosis admitted to the medical unit with hematemesis and melena", "History and Physical 13:30: 58-year-old male with alcohol-related cirrhosis diagnosed 3 years ago. Endoscopy 1 year ago showed large esophageal varices; prescribed propranolol but stopped taking it. States last alcohol use was 1 month ago. Also takes spironolactone. Weight 74 kg (163 lb). Brought in after vomiting blood at home.", "Laboratory Results 13:45: Hemoglobin 6.8 g/dL (low); Hematocrit 20% (low); Platelets 72,000/mm³ (low); INR 1.8 (high); BUN 38 mg/dL (high); Creatinine 1.0 mg/dL; Sodium 134 mEq/L (low); Potassium 3.8 mEq/L", "Nurses' Notes 14:00: Vomited about 300 mL of bright red blood with clots in the ED. Two black, tarry, sticky stools since yesterday. Skin pale, cool and clammy; capillary refill 4 seconds. Spider angiomas on chest; abdomen distended with shifting dullness. Yellow sclera, unchanged from last month per his wife. Alert and oriented x4. One 20-gauge IV in the left hand. Urine output 20 mL in the past hour.", "Vital Signs 14:00: Temperature 36.4 °C (97.5 °F); Heart rate 122; Blood pressure 88/54; Respiratory rate 24; SpO₂ 95% on room air", "Nurses' Notes 14:15 (shown from item 3): Vomited another 200 mL of bright red blood. More restless. Remains oriented x4.", "Vital Signs 14:15 (shown from item 3): Heart rate 128; Blood pressure 84/50; Respiratory rate 26; SpO₂ 94% on room air", "Nurses' Notes Day 2 07:30 (shown from item 5): Upper endoscopy yesterday at 16:30: band ligation of 3 bleeding esophageal varices. Received 2 units packed red blood cells without reaction. No hematemesis since. Overnight became confused, asked repeatedly where he was and pulled at his IV. Now oriented to person only. Flapping tremor of both hands when arms are held out. No stool in 30 hours. Gag reflex intact; follows simple commands.", "Laboratory Results Day 2 06:00 (shown from item 5): Hemoglobin 8.1 g/dL (low); Ammonia 92 µmol/L (high); Potassium 3.6 mEq/L; Sodium 135 mEq/L", "Vital Signs Day 2 07:30 (shown from item 5): Temperature 36.8 °C (98.2 °F); Heart rate 94; Blood pressure 112/68; Respiratory rate 18; SpO₂ 96% on room air", "Orders Day 2 08:00 (shown from item 5): Lactulose 30 mL PO every 2 hours until a bowel movement, then 30 mL three times daily, titrated to 2 to 3 soft stools per day. Continue octreotide infusion, pantoprazole IV and ceftriaxone IV. Clear liquid diet when alert enough to swallow safely. Fall precautions. Basic metabolic panel daily.", "Laboratory Results Day 3 06:00 (shown from item 6): Hemoglobin 8.2 g/dL (low); Potassium 3.5 mEq/L", "Nurses' Notes Day 3 08:00 (shown from item 6): Three soft, brown stools since 14:00 yesterday. Oriented to person, place, time and situation. No flapping tremor when arms are held out. Answers questions clearly and follows two-step commands. Hemoglobin 8.2 g/dL, stable. No hematemesis since banding. Abdomen remains distended with ascites.", "", "Refer to the chart. Nurses' note at 14:00 on admission.", "", "Highlight the findings that require immediate follow-up.", "", "✓ highlight Vomited about 300 mL of bright red blood with clots in the ED.", "  Yes: bright red hematemesis with clots means active, brisk upper GI bleeding.", "✓ highlight Two black, tarry, sticky stools since yesterday.", "  Yes: melena shows blood has been passing through the gut for some time, so total loss is larger than what was vomited.", "✓ highlight Skin pale, cool and clammy; capillary refill 4 seconds.", "  Yes: these show peripheral vasoconstriction from blood loss, an early sign of hypovolemic shock.", "- Spider angiomas on chest; abdomen distended with shifting dullness.", "  No: spider angiomas and ascites are chronic signs of cirrhosis and portal hypertension, not new changes needing urgent action.", "- Yellow sclera, unchanged from last month per his wife.", "  No: stable jaundice reflects his known liver disease. The trap is treating a chronic finding as the emergency.", "- Alert and oriented x4.", "  No: intact mental status is reassuring for now and does not require action.", "✓ highlight One 20-gauge IV in the left hand.", "  Yes: one small IV is not enough for rapid fluid and blood replacement; two large-bore lines are needed.", "✓ highlight Urine output 20 mL in the past hour.", "  Yes: output under 30 mL/h shows poor kidney perfusion from low circulating volume.", "", "Why: This client is actively bleeding and shows early shock: cool clammy skin, slow capillary refill and low urine output. His single small IV cannot support resuscitation. Jaundice, ascites and spider angiomas are part of his chronic cirrhosis and are not the immediate threat.", "Tip: In a client with chronic disease, separate long-standing findings from new ones that signal acute deterioration."], "st": "awaiting"}, {"id": "ngn:cs-gi-bleed-2", "hash": "1042289e82", "title": "56-year-old with cirrhosis and hematemesis · item 2 · Matrix · Analyze cues", "body": ["Refer to the chart.", "", "For each finding, indicate whether it points to an upper GI source of bleeding, reflects chronic liver disease, or reflects volume loss.", "", "- Bright red blood with clots in the emesis → Points to upper GI bleeding", "  blood vomited from the stomach or esophagus places the source above the ligament of Treitz.", "- Black, tarry, sticky stools → Points to upper GI bleeding", "  melena forms when blood is digested on its way through the gut, which usually means an upper GI source.", "- BUN 38 mg/dL with creatinine 1.0 mg/dL → Points to upper GI bleeding", "  digested blood protein raises the BUN while creatinine stays normal; a high ratio supports an upper GI bleed.", "- Platelets 72,000/mm³ and INR 1.8 → Reflects chronic liver disease", "  the scarred liver makes fewer clotting factors, and an enlarged spleen traps platelets, which worsens any bleeding.", "- Spider angiomas and ascites → Reflects chronic liver disease", "  these come from portal hypertension and altered hormone metabolism in long-standing cirrhosis.", "- Heart rate 122, cool clammy skin, urine output 20 mL/h → Reflects volume loss", "  the body compensates for lost blood volume by raising heart rate, constricting vessels and conserving water.", "", "Why: The record tells three stories at once. Hematemesis, melena and a high BUN with normal creatinine point to an upper GI source. Low platelets and a high INR are from cirrhosis and make bleeding harder to stop. Tachycardia, clammy skin and low urine output show the volume he has lost.", "Tip: For each finding, ask what process causes it: the bleeding source, the underlying disease or the body's response."], "st": "awaiting"}, {"id": "ngn:cs-gi-bleed-3", "hash": "0410e39f29", "title": "56-year-old with cirrhosis and hematemesis · item 3 · Drop-down · Prioritize hypotheses", "body": ["Refer to the chart.", "", "Complete the sentences.", "", "Blank 1:", "✓ ruptured esophageal varices", "  Yes: he has known large varices from portal hypertension and stopped his propranolol, which makes variceal rupture the most likely cause.", "- a Mallory-Weiss tear from forceful retching", "  No: a Mallory-Weiss tear follows repeated retching, which is not reported, and his varices are a far more likely source.", "- a lower GI source such as diverticula", "  No: hematemesis and a high BUN point above the ligament of Treitz; lower GI bleeding causes bright red blood from the rectum.", "Blank 2:", "✓ hypovolemic shock from ongoing blood loss", "  Yes: continued bleeding with falling blood pressure threatens circulation and is immediately life threatening.", "- fluid excess from ascites", "  No: ascites is chronic, and the problem now is too little circulating volume, not too much.", "- hepatic encephalopathy from a rising ammonia level", "  No: he is still oriented. Encephalopathy is a later risk once blood is digested, not the current priority.", "Blank 3:", "- spider angiomas on the chest", "  No: spider angiomas are a stable sign of cirrhosis, not a sign of acute blood loss.", "- a tense, distended abdomen with shifting dullness and a fluid wave", "  No: shifting dullness confirms ascites, a chronic finding that does not show shock.", "✓ blood pressure falling to 84/50 as heart rate rises to 128", "  Yes: a heart rate that keeps rising while the blood pressure keeps falling shows his compensation is failing.", "", "Why: In a client with cirrhosis and known varices who stopped his beta blocker, massive hematemesis is variceal bleeding until proven otherwise. The ongoing loss and worsening vital signs make hypovolemic shock the priority. Chronic liver findings matter, but circulation comes first.", "Tip: Use the history to name the likely source, then use the trend in vital signs to name the priority."], "st": "awaiting"}, {"id": "ngn:cs-gi-bleed-4", "hash": "f8782d7010", "title": "56-year-old with cirrhosis and hematemesis · item 4 · Select all · Generate solutions", "body": ["Refer to the chart.", "", "Which interventions should the nurse anticipate? Select all that apply.", "", "✓ Send a type and crossmatch and prepare to transfuse packed red blood cells.", "  Yes: his hemoglobin is 6.8 g/dL, below the restrictive transfusion threshold of 7 g/dL, and he is still bleeding.", "✓ Give an IV antibiotic such as ceftriaxone.", "  Yes: clients with cirrhosis and GI bleeding have a high risk of bacterial infection, and prophylaxis improves survival.", "✓ Start an octreotide infusion.", "  Yes: octreotide reduces blood flow to the splanchnic and portal system, lowering pressure in the varices.", "- Give propranolol now to lower portal pressure.", "  No: a beta blocker during active bleeding with BP 84/50 would worsen hypotension and block compensatory tachycardia.", "- Transfuse until the hemoglobin is above 10 g/dL.", "  No: overtransfusion raises portal pressure and rebleeding risk. In variceal bleeding, transfuse at a hemoglobin of about 7 g/dL and target 7 to 8 g/dL.", "✓ Insert a second large-bore IV, 18-gauge or larger.", "  Yes: two large-bore lines allow rapid infusion of fluids and blood products at the same time.", "✓ Keep NPO, raise the head of the bed, keep suction at the bedside and prepare for upper endoscopy.", "  Yes: these protect the airway from aspiration of blood and prepare for endoscopic banding to stop the bleeding.", "✓ Give an IV proton pump inhibitor.", "  Yes: an IV acid suppressant is commonly ordered until endoscopy confirms the source, since ulcers can coexist.", "", "Why: Care for an acute variceal bleed restores volume through good access and restrictive transfusion, lowers portal pressure with octreotide, prevents infection with antibiotics and protects the airway while preparing for endoscopy. Beta blockers are held during shock, and liberal transfusion can restart bleeding.", "Tip: Group the interventions by goal: access and volume, stopping the bleed, preventing complications, and airway protection."], "st": "awaiting"}, {"id": "ngn:cs-gi-bleed-5", "hash": "99e81c97aa", "title": "56-year-old with cirrhosis and hematemesis · item 5 · Matrix · Take action", "body": ["Refer to the chart.", "", "For each action, indicate whether it is indicated or not indicated for this client now.", "", "- Give lactulose with the head of the bed elevated after confirming the client can swallow safely → Indicated", "  lactulose treats hepatic encephalopathy by trapping ammonia in the gut; checking swallowing first protects a confused client from aspiration.", "- Give PRN lorazepam for confusion and pulling at the IV → Not indicated", "  sedatives can deepen hepatic encephalopathy and hide changes in mental status. The trap is treating the behavior instead of the cause.", "- Keep the bed low with a bed alarm and round frequently → Indicated", "  a confused client is at high risk for falls and for pulling out lines, so close observation is needed.", "- Track the number and consistency of stools → Indicated", "  the dose is titrated to 2 to 3 soft stools a day, so stool output guides therapy.", "- Hold lactulose after the first soft stool → Not indicated", "  lactulose continues on a schedule; stopping it at the first stool lets ammonia rise again.", "- Monitor potassium on the daily metabolic panel → Indicated", "  lactulose diarrhea can cause hypokalemia, and low potassium increases ammonia production in the kidneys.", "", "Why: New confusion, asterixis and a high ammonia level after a GI bleed point to hepatic encephalopathy; digested blood is a large protein load for a failing liver. Lactulose is titrated to soft stools, with attention to aspiration, falls and potassium. Sedatives worsen encephalopathy.", "Tip: When mental status changes, treat the cause and keep the client safe; avoid drugs that cloud the picture."], "st": "awaiting"}, {"id": "ngn:cs-gi-bleed-6", "hash": "61ac5bb607", "title": "56-year-old with cirrhosis and hematemesis · item 6 · Highlight · Evaluate outcomes", "body": ["Refer to the chart. Nurses' note, day 3.", "", "Highlight the findings that show the lactulose is effective.", "", "✓ highlight Three soft, brown stools since 14:00 yesterday.", "  Yes: 2 to 3 soft stools a day is the dosing goal and shows ammonia is being cleared through the gut.", "✓ highlight Oriented to person, place, time and situation.", "  Yes: return of full orientation from person only shows the encephalopathy is resolving.", "✓ highlight No flapping tremor when arms are held out.", "  Yes: loss of asterixis shows less ammonia is affecting the brain.", "✓ highlight Answers questions clearly and follows two-step commands.", "  Yes: clearer thinking and attention show improved brain function as ammonia falls.", "- Hemoglobin 8.2 g/dL, stable.", "  No: a stable hemoglobin shows the bleeding is controlled; it is not an effect of lactulose.", "- No hematemesis since banding.", "  No: this reflects successful endoscopic banding and octreotide, not lactulose.", "- Abdomen remains distended with ascites.", "  No: ascites comes from portal hypertension and low albumin; lactulose is not meant to treat it.", "", "Why: Lactulose works by drawing ammonia into the colon and clearing it in the stool. Success shows up as the target number of soft stools and a return of normal mental status without asterixis. Stable hemoglobin and no further vomiting reflect bleeding control, a separate goal.", "Tip: Match each finding to the treatment that produced it; highlight only those tied to the drug in the question."], "st": "awaiting"}, {"id": "ngn:cs-stroke-1", "hash": "c79ab00aa0", "title": "71-year-old brought to the ED with right-sided weakness · item 1 · Select all · Recognize cues", "body": ["Client: 67-year-old male brought to the emergency department with sudden right-sided weakness and trouble speaking", "Nurses' Notes 10:15: Brought in by his wife. She left for the store at 08:30, when he was talking normally while reading the paper. She returned at 09:50 and found him in his chair unable to get words out, with his right arm hanging limp. Right facial droop. Right arm and leg drift to the bed within seconds. Understands questions and tries to answer, but speech is halting and he cannot find words. Pupils equal and reactive at 3 mm. History: type 2 diabetes treated with glipizide; did not eat breakfast today. Atrial fibrillation; stopped his anticoagulant 6 months ago because of cost. Hypertension. Seasonal allergies. Weight 82 kg (181 lb).", "Vital Signs 10:15: Temperature 36.8 °C (98.2 °F); Heart rate 96, irregularly irregular; Blood pressure 192/104; Respiratory rate 18; SpO₂ 96% on room air", "Orders 10:20 (shown from item 2): Stroke alert. Point-of-care glucose now. NIHSS. Non-contrast CT head stat. CBC with platelets, PT/INR, aPTT, basic metabolic panel, troponin. 12-lead ECG. Cardiac monitor. NPO.", "Laboratory Results 10:22 (shown from item 3): Point-of-care glucose 148 mg/dL", "Nurses' Notes 10:25 (shown from item 3): NIHSS 12: right facial droop, right arm and leg weakness, expressive aphasia.", "Imaging 10:38 (shown from item 3): Non-contrast CT head: no intracranial hemorrhage. No large area of established infarct.", "Laboratory Results 10:40 (shown from item 3): Platelets 230,000/mm³; INR 1.0; aPTT 29 seconds; Creatinine 1.0 mg/dL", "Vital Signs 10:40 (shown from item 3): Heart rate 98, irregularly irregular; Blood pressure 194/106; Respiratory rate 18; SpO₂ 96% on room air", "Orders 10:50 (shown from item 4): Labetalol 10 mg IV over 2 minutes; may repeat once in 10 minutes. Goal BP under 185/110 before alteplase. Alteplase 0.9 mg/kg for 82 kg: total 73.8 mg; give 7.4 mg IV bolus over 1 minute, then 66.4 mg IV over 60 minutes. Admit to the stroke unit after the infusion.", "Medication Administration Record 10:52 (shown from item 5): Labetalol 10 mg IV given at 10:52. Alteplase prepared; dose independently double-checked by two RNs.", "Vital Signs 11:02 (shown from item 5): Heart rate 92, irregularly irregular; Blood pressure 176/98; Respiratory rate 18; SpO₂ 96% on room air", "Orders 11:03 (shown from item 5): Post-thrombolytic care: neuro checks and vital signs every 15 minutes for 2 hours, every 30 minutes for 6 hours, then hourly for 16 hours. Keep BP under 180/105. NPO until bedside swallow screen is passed. No anticoagulants or antiplatelet drugs for 24 hours.", "Nurses' Notes 12:15 (shown from item 6): Alteplase bolus given 11:05; infusion completed 12:06. NIHSS 9. Speaking in short phrases; right arm lifts against gravity. BP 164/92.", "Nurses' Notes 13:35 (shown from item 6): Says suddenly, \"My head is pounding, worst headache I've ever had.\" Vomited once. Opens eyes only to voice and is no longer speaking; right arm now flaccid. BP 198/112, up from 164/92 at 12:15. Heart rate 88, irregularly irregular as on arrival. Small bruise at the left antecubital IV site, not enlarging. SpO₂ 96% on room air.", "", "Refer to the chart. Triage note and vital signs at 10:15.", "", "Which findings require immediate follow-up? Select all that apply.", "", "- History of seasonal allergies", "  No: this has no bearing on stroke assessment or thrombolytic eligibility.", "✓ Blood pressure 192/104", "  Yes: this is above the 185/110 limit for thrombolysis and must be lowered before alteplase can be given.", "✓ Understands questions but cannot find words", "  Yes: expressive aphasia with right-sided weakness points to the left hemisphere, where language centers are in most people.", "✓ Irregularly irregular pulse after stopping his anticoagulant", "  Yes: untreated atrial fibrillation is a major source of embolic stroke and shapes later treatment decisions.", "✓ Right facial droop with right arm and leg drift", "  Yes: sudden one-sided face, arm and leg weakness is a hallmark sign of acute stroke and triggers a stroke alert.", "✓ Takes glipizide and did not eat breakfast", "  Yes: a sulfonylurea without food can cause hypoglycemia, a common stroke mimic that must be ruled out right away.", "- Pupils equal and reactive at 3 mm", "  No: this is a normal finding and does not need action now, though it is a useful baseline.", "- Temperature 36.8 °C (98.2 °F)", "  No: the temperature is normal; fever would worsen brain injury, but none is present.", "", "Why: Sudden right-sided weakness with aphasia is a stroke until proven otherwise. The high blood pressure, possible hypoglycemia from glipizide and untreated atrial fibrillation each change what happens in the next few minutes. Normal pupils, temperature and allergy history do not.", "Tip: In a time-critical emergency, pick findings that change the next decision, not every detail in the history."], "st": "awaiting"}, {"id": "ngn:cs-stroke-2", "hash": "56e1536481", "title": "71-year-old brought to the ED with right-sided weakness · item 2 · Drop-down · Analyze cues", "body": ["Refer to the chart.", "", "Complete the sentences.", "", "Blank 1:", "- 10:15", "  No: arrival time has no link to when the stroke began.", "- 09:50", "  No: 09:50 is when symptoms were found. The trap is using time found; the stroke could have started any time after 08:30.", "✓ 08:30", "  Yes: onset is the last time he was known to be at baseline, which was 08:30 when his wife left.", "Blank 2:", "✓ about 1 hour 50 minutes into the 4.5-hour window", "  Yes: 08:30 to 10:20 is 1 hour 50 minutes, well within 4.5 hours, but every minute of delay loses brain tissue.", "- already outside the 4.5-hour window", "  No: 4.5 hours from 08:30 is 13:00, so there is still time if the workup moves quickly.", "- too early for thrombolysis until 3 hours have passed", "  No: there is no minimum wait. Earlier treatment gives better outcomes.", "Blank 3:", "- dehydration from poor oral intake", "  No: dehydration can cause dizziness or confusion but does not produce focal deficits like these.", "✓ hypoglycemia from glipizide", "  Yes: he takes a sulfonylurea and skipped breakfast, and low glucose can cause focal weakness and speech changes that resolve with treatment.", "- hyperkalemia", "  No: high potassium causes muscle weakness and dysrhythmias, but not one-sided weakness with aphasia.", "", "Why: Eligibility for thrombolysis is measured from the last known well time, not the time symptoms were discovered. This client is within the window, so speed matters. A point-of-care glucose is checked before CT because hypoglycemia, especially with a sulfonylurea, can look exactly like a stroke.", "Tip: When onset was not witnessed, use the last time the client was seen normal."], "st": "awaiting"}, {"id": "ngn:cs-stroke-3", "hash": "40c73bd553", "title": "71-year-old brought to the ED with right-sided weakness · item 3 · Matrix · Prioritize hypotheses", "body": ["Refer to the chart.", "", "For each finding, indicate whether it supports giving alteplase or must be corrected before alteplase can be given.", "", "- Last known well 08:30, now 10:45 → Supports giving alteplase", "  2 hours 15 minutes since last known well is within the 4.5-hour window for alteplase.", "- Non-contrast CT shows no hemorrhage → Supports giving alteplase", "  non-contrast CT is done first to exclude bleeding; a hemorrhagic stroke would be an absolute contraindication.", "- Point-of-care glucose 148 mg/dL → Supports giving alteplase", "  glucose is the one lab required before alteplase; 148 mg/dL rules out hypoglycemia as the cause of the deficits and is within the acceptable range for thrombolysis.", "- Platelets 230,000/mm³ and INR 1.0 → Supports giving alteplase", "  normal clotting values mean no added bleeding risk; he stopped his anticoagulant months ago.", "- NIHSS 12 with aphasia and right-sided weakness → Supports giving alteplase", "  these are disabling deficits, which is the reason to accept the bleeding risk of thrombolysis.", "- Blood pressure 194/106 → Must be corrected first", "  BP must be under 185/110 before alteplase because higher pressure raises the risk of bleeding into the brain.", "", "Why: The most likely problem is an acute ischemic stroke, and nearly every finding supports thrombolysis: he is within the window, CT shows no bleeding, glucose and clotting are normal and the deficits are disabling. Blood pressure is the one barrier and must be lowered first.", "Tip: Run through the eligibility checklist: time, CT, glucose, clotting and blood pressure, then find the item that is out of range."], "st": "awaiting"}, {"id": "ngn:cs-stroke-4", "hash": "3f65d32f6c", "title": "71-year-old brought to the ED with right-sided weakness · item 4 · Select all · Generate solutions", "body": ["Refer to the chart.", "", "Which interventions should the nurse include in the plan of care? Select all that apply.", "", "- Hold all antihypertensives to protect brain perfusion.", "  No: permissive hypertension applies to clients who do not receive a thrombolytic. After alteplase, BP must stay under 180/105.", "- Give aspirin 325 mg PO as soon as the infusion ends.", "  No: antiplatelet and anticoagulant drugs are held for 24 hours after alteplase because they add to bleeding risk.", "✓ Avoid IM injections, arterial punctures and new tubes such as urinary catheters unless essential.", "  Yes: invasive procedures create bleeding sites while alteplase is active; essential lines are placed before the infusion when possible.", "✓ Neuro checks and vital signs every 15 minutes for 2 hours, every 30 minutes for 6 hours, then hourly for 16 hours.", "  Yes: this standard schedule catches bleeding or worsening deficits during the highest-risk first 24 hours.", "✓ Keep blood pressure under 180/105 after alteplase is started.", "  Yes: after thrombolysis the BP goal is lower than before, to reduce the risk of intracranial hemorrhage.", "- Test swallowing by giving a full glass of water first.", "  No: a swallow screen uses a structured protocol with small amounts; a large volume risks aspiration.", "✓ Keep NPO, including oral medications, until a bedside swallow screen is passed.", "  Yes: aphasia and facial weakness suggest dysphagia, and aspiration pneumonia is a leading complication of stroke.", "", "Why: After alteplase, care centers on finding bleeding early and preventing it. That means a strict neuro and vital sign schedule, a tighter BP goal, no antithrombotics for 24 hours and avoiding invasive procedures. Aspiration is prevented by keeping the client NPO until a swallow screen is passed.", "Tip: For thrombolytics, every planned intervention should either detect bleeding or reduce its risk."], "st": "awaiting"}, {"id": "ngn:cs-stroke-5", "hash": "a58676ba3c", "title": "71-year-old brought to the ED with right-sided weakness · item 5 · Ordered response · Take action", "body": ["Refer to the chart.", "", "Place the nurse's actions in the correct order.", "", "Correct order:", "1. Recheck the blood pressure and confirm it is below 185/110.", "  Yes: alteplase cannot start until BP is below 185/110; the 176/98 reading after labetalol meets that goal.", "2. Give alteplase 7.4 mg as an IV bolus over 1 minute.", "  Yes: 10% of the total dose is given as a bolus first to begin breaking down the clot.", "3. Start the remaining 66.4 mg as an infusion over 60 minutes on a pump.", "  Yes: the remaining 90% follows immediately as a 60-minute infusion on a pump for an accurate rate.", "4. Perform neuro checks and vital signs every 15 minutes during and after the infusion for 2 hours.", "  Yes: the first 2 hours carry the highest risk of hemorrhage, so checks are most frequent then.", "5. Continue neuro checks and vital signs every 30 minutes for the next 6 hours.", "  Yes: after the first 2 hours, checks space out to every 30 minutes for 6 hours, then hourly to complete 24 hours.", "", "Why: Alteplase is given only after BP is confirmed under 185/110. The dose is split into a 10% bolus over 1 minute and the remaining 90% over 60 minutes. Monitoring then follows a fixed schedule that is most intense in the first 2 hours.", "Tip: For time-critical drugs, put the safety gate first, then the drug as ordered, then monitoring from most to least frequent."], "st": "awaiting"}, {"id": "ngn:cs-stroke-6", "hash": "ed0144e66d", "title": "71-year-old brought to the ED with right-sided weakness · item 6 · Highlight · Evaluate outcomes", "body": ["Refer to the chart. Nurses' note at 13:35.", "", "Highlight the findings that show the client's condition is worsening and require immediate action.", "", "✓ highlight Says suddenly, \"My head is pounding, worst headache I've ever had.\"", "  Yes: a sudden severe headache after thrombolysis is a classic sign of intracranial hemorrhage.", "✓ highlight Vomited once.", "  Yes: new vomiting with headache suggests rising intracranial pressure from bleeding.", "✓ highlight Opens eyes only to voice and is no longer speaking; right arm now flaccid.", "  Yes: a falling level of consciousness and loss of earlier gains show the neuro exam is getting worse, not better.", "✓ highlight BP 198/112, up from 164/92 at 12:15.", "  Yes: a sharp BP rise above the 180/105 limit can signal rising intracranial pressure and worsens bleeding.", "- Heart rate 88, irregularly irregular as on arrival.", "  No: this is his baseline atrial fibrillation and has not changed.", "- Small bruise at the left antecubital IV site, not enlarging.", "  No: minor stable bruising is expected after thrombolysis. The trap is focusing on a small surface bleed over a brain bleed.", "- SpO₂ 96% on room air.", "  No: oxygenation is normal and unchanged, though the airway needs watching as consciousness falls.", "", "Why: Intracranial hemorrhage is the most feared complication of alteplase. Sudden severe headache, vomiting, a worsening neuro exam and a sharp rise in BP after initial improvement point to it. The nurse notifies the provider and stroke team at once and prepares for a stat non-contrast CT; if alteplase were still running, it would be stopped.", "Tip: After thrombolysis, any neurologic decline paired with headache, vomiting or rising BP means bleeding until proven otherwise."], "st": "awaiting"}]}, "packs": [{"id": "drill-med-1", "title": "Drills: Med Pass, part 1 of 3", "sub": "What to check before a medication, then give, hold or call. A pharmacist is especially welcome.", "n": 21, "reviewed": 0, "changed": 0}, {"id": "drill-med-2", "title": "Drills: Med Pass, part 2 of 3", "sub": "What to check before a medication, then give, hold or call. A pharmacist is especially welcome.", "n": 21, "reviewed": 0, "changed": 0}, {"id": "drill-med-3", "title": "
