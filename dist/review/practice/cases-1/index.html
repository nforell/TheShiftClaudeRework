<style>
:root{--bg:#E6EDF0;--surface:#FBFCFC;--surface-2:#EDF2F4;--ink:#152238;--ink-2:#4D5A6F;--line:#CAD5DB;--teal:#2449A8;--teal-ink:#fff;--red:#B3342B;--red-bg:#F8E1DE;--good:#2B7249;--good-bg:#E0F0E6;--amber:#A96C0E;--amber-bg:#FBEFD6;
  --serif:"Barlow Condensed","Arial Narrow",sans-serif;--sans:"Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161C;--surface:#1A1F27;--surface-2:#212833;--ink:#E7E4DB;--ink-2:#A0A5AE;--line:#343C48;--teal:#93B4E4;--teal-ink:#0F1B2C;--red:#F0766B;--red-bg:#3b1d1b;--good:#72c692;--good-bg:#16301f;--amber:#E9AE4E;--amber-bg:#35291a}}
:root[data-theme="dark"]{--bg:#12161C;--surface:#1A1F27;--surface-2:#212833;--ink:#E7E4DB;--ink-2:#A0A5AE;--line:#343C48;--teal:#93B4E4;--teal-ink:#0F1B2C;--red:#F0766B;--red-bg:#3b1d1b;--good:#72c692;--good-bg:#16301f;--amber:#E9AE4E;--amber-bg:#35291a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
main{max-width:52rem;margin:0 auto;padding:clamp(1.2rem,5vw,3rem) 16px calc(5rem + env(safe-area-inset-bottom))}
a{color:var(--teal)}
.home{font-family:var(--serif);font-weight:700;font-size:1.1rem;letter-spacing:.04em;text-transform:uppercase;background:var(--ink);color:var(--bg);padding:.28em .55em .22em;border-radius:2px;text-decoration:none}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.9rem,6vw,2.6rem);line-height:1.1;letter-spacing:0;margin:1.6rem 0 .3rem}
h2{font-size:1.15rem;margin:2.4rem 0 .6rem}
h3{font-size:1rem;margin:0}
p{margin:.5rem 0}
.muted{color:var(--ink-2)}
.meta{display:flex;flex-wrap:wrap;gap:.4rem .6rem;margin-top:.6rem}
.chip{display:inline-flex;align-items:center;padding:.15em .6em;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--surface-2);border:1px solid var(--line)}
.chip.awaiting{background:var(--amber-bg);border-color:transparent;color:var(--amber)}
.chip.reviewed{background:var(--good-bg);border-color:transparent;color:var(--good)}
.chip.changed{background:var(--red-bg);border-color:transparent;color:var(--red)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem 1.1rem;margin:.8rem 0}
.how ol{margin:.4rem 0 0;padding-left:1.2rem}.how li{margin:.2rem 0}
label{display:block;font-weight:600;font-size:.9rem;margin:.7rem 0 .25rem}
input[type=text],input[type=email],textarea,select{width:100%;min-height:44px;padding:.5em .7em;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:5rem;resize:vertical}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:0 1rem}
details.pt{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:.6rem 0}
details.pt>summary{cursor:pointer;padding:.85rem 1rem;font-weight:600;list-style-position:inside}
details.pt>div{padding:0 1rem 1rem}
table{width:100%;border-collapse:collapse;font-size:.88rem;margin:.4rem 0}
th,td{text-align:left;vertical-align:top;padding:.35rem .5rem .35rem 0;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--ink-2);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
.scroll{overflow-x:auto}
ul.plain{margin:.3rem 0;padding-left:1.1rem}
.dec{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:.85rem 1rem;margin:.6rem 0}
.dec.pos{border-left-color:var(--good)}.dec.neg{border-left-color:var(--red)}
.dec .top{display:flex;flex-wrap:wrap;gap:.3rem .5rem;align-items:center;font-size:.78rem;color:var(--ink-2);font-weight:600}
.pts{font-weight:700;padding:.05em .45em;border-radius:4px;background:var(--surface-2)}
.pos .pts{color:var(--good);background:var(--good-bg)}.neg .pts{color:var(--red);background:var(--red-bg)}
.dec b{display:block;margin:.35rem 0 .15rem;font-size:1rem}
.dec .why{font-family:var(--sans);color:var(--ink-2);margin:0}
.dec .src{font-size:.75rem;color:var(--ink-2);margin-top:.35rem}
.verdict{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.7rem}
.verdict button{min-height:40px;padding:.35em .9em;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer}
.verdict button[aria-pressed="true"][data-v="ok"]{background:var(--good);border-color:var(--good);color:var(--teal-ink)}
.verdict button[aria-pressed="true"][data-v="fix"]{background:var(--red);border-color:var(--red);color:var(--teal-ink)}
.verdict button[aria-pressed="true"][data-v="unsure"]{background:var(--amber);border-color:var(--amber);color:var(--teal-ink)}
.dec textarea{margin-top:.5rem;min-height:3.6rem}
.opt{padding:.4rem 0;border-bottom:1px solid var(--line);font-size:.92rem}.opt:last-child{border:0}
.opt i{font-style:normal;font-weight:700;font-size:.75rem;padding:.05em .4em;border-radius:4px;margin-right:.4rem;background:var(--surface-2)}
.bar{position:sticky;top:0;z-index:5;margin:0 -16px;padding:.6rem 16px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:.6rem;font-size:.9rem}
.bar .prog{display:block;flex:1;min-width:4rem;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;max-width:12rem}.bar .prog i{display:block;height:100%;background:var(--teal)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:.55em 1.2em;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn-primary{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.row{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1rem}
.check{display:flex;gap:.6rem;align-items:flex-start;font-weight:500;margin-top:1rem}
.check input{width:1.2rem;height:1.2rem;margin-top:.2rem;flex:none}
.msg{margin-top:.8rem;font-weight:600}.msg.err{color:var(--red)}.msg.ok{color:var(--good)}
pre{white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:.8rem;font-size:.8rem;max-height:18rem;overflow:auto}
.shifts a{display:block;text-decoration:none;color:inherit}
.shifts .card:hover{border-color:var(--ink-2)}
</style>
<style>.item .body p{margin:.15rem 0}.item .body .why{color:var(--ink-2);font-size:.92rem;margin:0 0 .35rem 1.1rem}.item .body .ok b{display:inline;margin:0;color:var(--good)}.item .body .no{color:var(--ink)}.item .body .sp{height:.5rem}.item>b{margin-bottom:.5rem}</style></head>

ent at home. Alert and oriented to person, place, time and situation on arrival.", "Orders 14:00: Vital signs every 4 hours. Oxygen by nasal cannula to keep SpO₂ 92% or higher. Blood cultures x2 and sputum culture. Ceftriaxone 1 g IV daily and azithromycin 500 mg IV daily, first doses when available from pharmacy. 0.9% sodium chloride at 75 mL/h. CBC, basic metabolic panel. Metformin 1,000 mg PO at 08:00 and 17:00. Lisinopril 20 mg PO daily.", "Vital Signs 14:00: Temperature 38.3 °C (100.9 °F) (high); Heart rate 98; Blood pressure 128/74; Respiratory rate 22 (high); SpO₂ 93% on 2 L nasal cannula", "Vital Signs 15:30: Temperature 38.9 °C (102 °F) (high); Heart rate 118 (high); Blood pressure 98/56 (MAP 70) (low); Respiratory rate 26 (high); SpO₂ 91% on 2 L nasal cannula (low)", "Nurses' Notes 15:30: Wife states he asked her three times what day it is. Oriented to person only. Coarse crackles over the right lower lobe. Coughing up rust-colored sputum. Respirations 26 and shallow. BP 98/56, was 128/74 at 14:00. No urine output since 09:00 per wife. States he feels tired and achy. Skin warm and flushed. Labs drawn; cultures not yet collected, antibiotics not yet received from pharmacy.", "Laboratory Results 15:50 (shown from item 2): WBC 18,600/mm³ (high); Bands 14% (high); Lactate 3.4 mmol/L (high); Creatinine 1.6 mg/dL (baseline 0.9 mg/dL) (high); BUN 32 mg/dL (high); Glucose 214 mg/dL (high); Platelets 148,000/mm³", "Orders 16:05 (shown from item 5): Sepsis orders. Blood cultures x2 from two separate sites and sputum culture, collect before antibiotics without delaying them. Give ceftriaxone 1 g IV and azithromycin 500 mg IV now, within 1 hour. 0.9% sodium chloride 2,100 mL (30 mL/kg) IV over 90 minutes; reassess BP, lung sounds and SpO₂ after each 500 mL. Repeat lactate at 18:00. Insert indwelling urinary catheter; hourly urine output. Titrate oxygen to SpO₂ 92% or higher. Hold metformin and lisinopril. Notify provider and ICU if MAP stays below 65 after fluids.", "Vital Signs 16:05 (shown from item 5): Temperature 39.0 °C (102.2 °F) (high); Heart rate 124 (high); Blood pressure 84/48 (MAP 60) (low); Respiratory rate 28 (high); SpO₂ 90% on 2 L nasal cannula (low)", "Intake and Output 18:00 (shown from item 6): Urinary catheter inserted 16:20, 30 mL residual; Urine 16:20 to 17:00 40 mL; Urine 17:00 to 18:00 45 mL; IV bolus 2,100 mL completed 17:40", "Vital Signs 18:00 (shown from item 6): Temperature 38.1 °C (100.6 °F) (high); Heart rate 102 (high); Blood pressure 104/62 (MAP 76); Respiratory rate 28 (high); SpO₂ 89% on 4 L nasal cannula (low)", "Laboratory Results 18:00 (shown from item 6): Lactate 1.9 mmol/L (was 3.4); Glucose 188 mg/dL (high)", "Nurses' Notes 18:10 (shown from item 6): Oriented to person and place, not time. Fine crackles now heard in both lung bases, new since 16:00. Coarse crackles remain in the right lower lobe. Says he feels a little more short of breath. No peripheral edema.", "", "Refer to the chart. The nurse reviews the 15:30 nurses' note.", "", "Highlight the findings that require immediate follow-up.", "", "✓ highlight Wife states he asked her three times what day it is.", "  Yes: he was fully oriented at 14:00, so new confusion in an older adult with an infection is altered mentation, a qSOFA criterion and an early sign of sepsis.", "✓ highlight Oriented to person only.", "  Yes: a drop from full orientation to person only within 90 minutes reflects reduced brain perfusion or a septic encephalopathy and needs urgent action.", "- Coarse crackles over the right lower lobe.", "  No: crackles over the known infiltrate are expected with his diagnosis. The trap is treating an expected local finding as the new problem.", "- Coughing up rust-colored sputum.", "  No: rust-colored sputum is a classic finding of bacterial pneumonia and matches the admitting diagnosis; it does not signal a change.", "✓ highlight Respirations 26 and shallow.", "  Yes: a respiratory rate of 22 or higher is a qSOFA criterion, and rapid shallow breathing can be compensation for a rising lactate.", "✓ highlight BP 98/56, was 128/74 at 14:00.", "  Yes: a systolic pressure of 100 or lower is a qSOFA criterion, and a 30-point drop in 90 minutes suggests vasodilation from sepsis.", "✓ highlight No urine output since 09:00 per wife.", "  Yes: more than 6 hours without urine suggests the kidneys are underperfused, an early sign of organ dysfunction.", "- States he feels tired and achy.", "  No: fatigue and aches are common with any febrile illness and do not by themselves point to deterioration.", "", "Why: He meets all three qSOFA criteria: new altered mentation, respiratory rate 22 or higher, and systolic BP 100 or lower. Together with no urine for hours, these point to sepsis with early organ dysfunction. The crackles and rusty sputum belong to the pneumonia he was admitted with.", "Tip: Compare each finding with the admission baseline; what is new or worse needs follow-up, and what matches the diagnosis is expected."], "st": "awaiting"}, {"id": "ngn:cs-pneumonia-sepsis-2", "hash": "e7d685d4dd", "title": "Pneumonia that turns septic · item 2 · Matrix · Analyze cues", "body": ["Refer to the chart.", "", "For each finding, indicate whether it is more consistent with the local lung infection or with sepsis (a systemic response with organ dysfunction).", "", "- Coarse crackles and rust-colored sputum → Local lung infection (pneumonia)", "  these come from exudate filling the alveoli of the infected lobe and are expected with pneumonia alone.", "- Right-sided chest pain that worsens with deep breaths → Local lung infection (pneumonia)", "  pleuritic pain comes from inflammation of the pleura next to the infected lobe, a local finding.", "- New confusion, oriented to person only → Sepsis", "  altered mentation shows the infection is now affecting the brain through poor perfusion and inflammation, a sign of organ dysfunction.", "- BP 98/56 with heart rate 118 → Sepsis", "  widespread vasodilation lowers the pressure, and the heart speeds up to compensate; this is a systemic circulatory response.", "- Lactate 3.4 mmol/L → Sepsis", "  a lactate above 2 means tissues are not getting enough oxygen and are switching to anaerobic metabolism.", "- Creatinine 1.6 mg/dL, baseline 0.9, with no urine since 09:00 → Sepsis", "  a rising creatinine with low output signals acute kidney injury from poor renal perfusion, another failing organ.", "", "Why: Pneumonia explains the findings in the chest. Sepsis is the body's dysregulated response to that infection, and it shows up in distant organs: the brain, the circulation, the kidneys and tissue oxygenation. Findings outside the lungs tell the nurse the infection has become a systemic emergency.", "Tip: Ask whether a finding is limited to the infected organ or shows another organ system failing; distant organ effects point to sepsis."], "st": "awaiting"}, {"id": "ngn:cs-pneumonia-sepsis-3", "hash": "17cb4ea929", "title": "Pneumonia that turns septic · item 3 · Drop-down · Prioritize hypotheses", "body": ["Refer to the chart.", "", "Complete the sentences.", "", "Blank 1:", "- 1", "  No: this counts only one criterion. He has new confusion, a respiratory rate of 22 or higher, and a systolic BP of 100 or lower.", "✓ 3", "  Yes: he has all three criteria: altered mentation, respiratory rate 26, and systolic BP 98, which is 100 or lower.", "- 2", "  No: this misses one criterion; the systolic BP of 98 counts because the cutoff is 100 or lower, not below 90.", "Blank 2:", "✓ tissue hypoperfusion", "  Yes: with hypotension, confusion and low urine output, an elevated lactate means tissues are underperfused and using anaerobic metabolism.", "- normal muscle activity from coughing", "  No: coughing does not raise lactate to this level, and the trap is explaining away a lactate that matches other perfusion signs.", "- the effect of metformin alone", "  No: metformin can raise lactate, but it does not explain fever, falling BP and new confusion. Assume sepsis until proven otherwise.", "Blank 3:", "✓ progression to septic shock", "  Yes: an infection with organ dysfunction and a falling BP can progress to shock within hours, and every hour of delayed treatment raises mortality.", "- hyperglycemia from diabetes", "  No: a glucose of 214 mg/dL is expected with infection and stress. It needs management but is not the life-threatening problem.", "- dehydration from poor oral intake", "  No: poor intake may contribute, but fever, new confusion, high WBC with bands and rising lactate point to a systemic infection, not simple dehydration.", "", "Why: A qSOFA of 2 or more in a client with infection flags a high risk of poor outcomes. His lactate, kidney injury and new confusion show organ dysfunction, so this is sepsis. The danger now is septic shock, so it outranks his other problems.", "Tip: When several problems are present, pick the one that will kill the client fastest if it is not treated."], "st": "awaiting"}, {"id": "ngn:cs-pneumonia-sepsis-4", "hash": "034f97cea0", "title": "Pneumonia that turns septic · item 4 · Matrix · Generate solutions", "body": ["Refer to the chart. The nurse plans for the first hour of sepsis care. The hospital sepsis protocol, based on the CMS SEP-1 measure, triggers a 30 mL/kg crystalloid bolus for hypotension (systolic BP below 90 or MAP below 65) or a lactate of 4 mmol/L or more.", "", "For each intervention, indicate whether the nurse should anticipate it now, anticipate it only if protocol-defined hypotension or a lactate of 4 mmol/L or more develops, or not anticipate it.", "", "- Blood cultures x2 from two sites before the first antibiotic dose → Anticipate now", "  cultures drawn before antibiotics identify the organism; once antibiotics are in, cultures may grow nothing.", "- IV antibiotics within 1 hour of recognizing sepsis → Anticipate now", "  each hour of delay in antibiotics for sepsis raises the risk of death, so they are given as soon as cultures are drawn.", "- Repeat lactate within 2 to 4 hours → Anticipate now", "  his first lactate is above 2 mmol/L, so it is remeasured to see whether perfusion is improving.", "- 0.9% sodium chloride 30 mL/kg IV bolus → Anticipate only if hypotension or lactate 4 or more", "  under this protocol the bolus is triggered by hypotension or a lactate of 4 or more; his systolic BP is 98, MAP 70 and lactate 3.4, so the nurse reassesses perfusion closely.", "- Hold antibiotics until culture results identify the organism → Not anticipated", "  culture results take 24 to 72 hours. Waiting that long to treat sepsis is the trap; start broad coverage now.", "- Give the scheduled 17:00 metformin → Not anticipated", "  metformin is held with acute kidney injury, a high lactate and an unstable client because it raises the risk of lactic acidosis.", "", "Why: The hour-1 sepsis bundle is: measure lactate, draw blood cultures before antibiotics, give broad-spectrum antibiotics, and give 30 mL/kg crystalloid for hypotension or lactate of 4 or more. Remeasure lactate if the first value is above 2. Surviving Sepsis 2021 suggests at least 30 mL/kg within 3 hours for sepsis-induced hypoperfusion or septic shock, so practice varies by facility; this protocol uses the SEP-1 triggers. Vasopressors follow if the MAP stays below 65 after fluids.", "Tip: Remember the bundle in its order: cultures, then antibiotics, with lactate and fluids triggered by the numbers."], "st": "awaiting"}, {"id": "ngn:cs-pneumonia-sepsis-5", "hash": "1171f15d2b", "title": "Pneumonia that turns septic · item 5 · Select all · Take action", "body": ["Refer to the chart.", "", "Which actions should the nurse take now? Select all that apply.", "", "- Place him flat with his legs raised higher than his head.", "  No: the Trendelenburg position does not reliably raise BP and makes breathing harder for a client with pneumonia.", "- Wait to give antibiotics until he can cough up a sputum specimen.", "  No: a sputum specimen can take a long time to obtain. Antibiotics are not delayed for it, which is the trap in this option.", "✓ Draw two sets of blood cultures from two different sites before the first antibiotic dose.", "  Yes: cultures come before antibiotics so the organism can be identified, and drawing them takes only minutes.", "- Give acetaminophen for the fever and recheck the BP in 1 hour.", "  No: treating the fever does not treat shock, and waiting an hour with a MAP of 60 delays lifesaving care.", "✓ Start the 2,100 mL 0.9% sodium chloride bolus as ordered.", "  Yes: his MAP is now below 65, so the 30 mL/kg crystalloid bolus is indicated to restore circulating volume and perfusion.", "✓ Give the rapid response team an SBAR report: suspected sepsis from pneumonia, new confusion, BP 84/48, lactate 3.4, no urine since 09:00.", "  Yes: a concise SBAR with the key trends lets the team act quickly and states clearly that the nurse suspects sepsis.", "✓ Increase the oxygen to keep SpO₂ at 92% or higher.", "  Yes: his SpO₂ is 90% and the order allows titration; better oxygen delivery supports tissues that are already underperfused.", "✓ Give ceftriaxone and azithromycin as soon as the blood cultures are drawn.", "  Yes: antibiotics must start within the first hour; blood cultures should not delay them more than a few minutes.", "", "Why: His MAP has fallen below 65, so he now needs the full bundle at once. The nurse reports with SBAR, starts the fluid bolus, draws cultures and then gives antibiotics within the hour, and supports oxygenation. Nothing should delay the antibiotics.", "Tip: In sepsis, choose actions that restore perfusion and start antibiotics quickly; reject any option that waits."], "st": "awaiting"}, {"id": "ngn:cs-pneumonia-sepsis-6", "hash": "d972384208", "title": "Pneumonia that turns septic · item 6 · Matrix · Evaluate outcomes", "body": ["Refer to the chart. The client weighs 70 kg.", "", "For each finding, indicate whether it shows improvement or requires follow-up.", "", "- BP 104/62 (MAP 76) → Improving or goal met", "  the goal is a MAP of 65 or higher, so fluids have restored perfusion pressure without a vasopressor so far.", "- Lactate 1.9 mmol/L, down from 3.4 → Improving or goal met", "  the lactate fell by more than 40% and is now below 2, showing tissues are getting enough oxygen again.", "- Urine output 40 mL in 40 minutes, then 45 mL in the next hour → Improving or goal met", "  the goal is at least 0.5 mL/kg/h, which is 35 mL/h for 70 kg; both periods meet it, so the kidneys are being perfused.", "- Oriented to person and place, was oriented to person only → Improving or goal met", "  his mental status is better than at 15:30, which reflects improved brain perfusion, though not yet back to baseline.", "- Heart rate 102, down from 124 → Improving or goal met", "  a falling heart rate shows less need to compensate for low volume and vasodilation.", "- RR 28, SpO₂ 89% on 4 L, new fine crackles in both bases → Requires follow-up", "  worse oxygenation with new bilateral crackles after 2.1 L of fluid may be fluid overload or acute lung injury and must be reported now.", "", "Why: Most sepsis targets are met: MAP 65 or higher, lactate clearing, urine 0.5 mL/kg/h or more, and better mentation. His breathing is worse, though, and new crackles in both bases after a large bolus in an older adult need prompt reporting and reassessment of fluids and oxygen.", "Tip: Check each finding against its specific goal, and remember that one worsening system needs action even when others improve."], "st": "awaiting"}, {"id": "ngn:cs-heart-failure-1", "hash": "91ec5d9dc6", "title": "Heart failure that tips over · item 1 · Select all · Recognize cues", "body": ["Client: 66-year-old woman with HFrEF (EF 30%) admitted to the cardiac step-down unit with acute decompensated heart failure", "History and Physical 08:30: Admitted from the emergency department with 5 days of worsening shortness of breath. Heart failure with reduced ejection fraction, EF 30% on echocardiogram 3 months ago. Hypertension. Ran out of furosemide 6 days ago and ate restaurant meals at a family reunion over the weekend. Home medications: furosemide 40 mg PO daily, carvedilol 12.5 mg PO twice daily, lisinopril 10 mg PO daily. Weight 82.5 kg (181.9 lb); usual dry weight 78 kg (172 lb).", "Nurses' Notes 08:45: Sitting upright in bed; speaks in short phrases. States: 'I've been sleeping in my recliner for three nights. If I lie down I feel like I'm drowning.' Crackles bilaterally to the mid-lung fields. Jugular veins distended at 45 degrees. 3+ pitting edema of both ankles and shins. S3 heard at the apex. Skin warm and dry. Alert and oriented x4. Bowel sounds active in all four quadrants.", "Vital Signs 08:45: Temperature 36.8 °C (98.2 °F); Heart rate 108, sinus tachycardia (high); Blood pressure 152/90 (high); Respiratory rate 28 (high); SpO₂ 89% on room air; 93% on 2 L nasal cannula", "Laboratory Results 09:30 (shown from item 2): BNP 1,450 pg/mL (high); Sodium 132 mEq/L (low); Potassium 3.9 mEq/L; Magnesium 1.9 mg/dL; BUN 26 mg/dL (high); Creatinine 1.1 mg/dL", "Imaging 09:30 (shown from item 2): Chest x-ray: enlarged heart, pulmonary vascular congestion, small bilateral pleural effusions. No consolidation.", "Orders 09:45 (shown from item 5): Furosemide 40 mg IV twice daily at 10:00 and 18:00, first dose now. Continue carvedilol and lisinopril. 2 g sodium diet. Fluid restriction 1.5 L/day. Daily weight before breakfast. Strict intake and output. Telemetry. Basic metabolic panel and magnesium at 17:00 and every morning. Notify provider for potassium below 3.5 mEq/L or magnesium below 1.8 mg/dL.", "Intake and Output 17:00 (shown from item 5): Intake 10:00 to 17:00 700 mL; Urine output 10:00 to 17:00 2,600 mL", "Laboratory Results 17:00 (shown from item 5): Potassium 3.2 mEq/L (low); Magnesium 1.6 mg/dL (low); Sodium 134 mEq/L (low); Creatinine 1.2 mg/dL", "Nurses' Notes 17:15 (shown from item 5): Breathing easier; speaking in full sentences. SpO₂ 94% on 2 L. Reports cramping in both calves. On telemetry.", "Vital Signs 08:00 (day 3) (shown from item 6): Heart rate 78; Blood pressure 118/72; Respiratory rate 16; SpO₂ 95% on room air; Weight 78.6 kg (173.3 lb)", "Laboratory Results 06:00 (day 3) (shown from item 6): Potassium 4.1 mEq/L; Magnesium 2.0 mg/dL; Sodium 137 mEq/L; Creatinine 1.1 mg/dL", "", "Refer to the chart.", "", "Which findings indicate fluid volume excess? Select all that apply.", "", "✓ Crackles bilaterally to the mid-lung fields", "  Yes: the failing left ventricle backs pressure into the pulmonary veins, pushing fluid into the alveoli.", "- Alert and oriented x4", "  No: normal mentation is reassuring about brain perfusion, but it is not a sign of fluid overload.", "✓ Jugular veins distended at 45 degrees", "  Yes: distended neck veins at 45 degrees show high right-sided filling pressure from excess circulating volume.", "✓ Weight 82.5 kg, 4.5 kg above her dry weight", "  Yes: rapid weight gain is the most reliable sign of fluid retention; 1 kg of weight is about 1 L of fluid.", "✓ 3+ pitting edema of both ankles and shins", "  Yes: systemic venous congestion pushes fluid into dependent tissues, a sign of right-sided backup.", "✓ Sleeping in a recliner because lying down feels like drowning", "  Yes: orthopnea occurs because lying flat returns more blood to a heart that cannot pump it forward, worsening lung congestion.", "- Bowel sounds active in all four quadrants", "  No: normal bowel sounds are an expected finding and do not reflect volume status.", "- Temperature 36.8 °C (98.2 °F)", "  No: a normal temperature makes infection less likely but says nothing about fluid status.", "", "Why: Her weight gain, crackles, orthopnea, distended neck veins and leg edema all show fluid retention from a weak left ventricle that has backed up into both the lungs and the body. Stopping her diuretic and eating salty meals tipped her into decompensation. The other findings are normal.", "Tip: For fluid status, look at weight, lungs, neck veins and edema; normal findings in other systems are distractors."], "st": "awaiting"}, {"id": "ngn:cs-heart-failure-2", "hash": "5dccc923ab", "title": "Heart failure that tips over · item 2 · Drop-down · Analyze cues", "body": ["Refer to the chart.", "", "Complete the sentences.", "", "Blank 1:", "- death of heart muscle from a heart attack", "  No: troponin, not BNP, is the marker of heart muscle injury. The trap is confusing the two cardiac labs.", "✓ ventricular stretch from volume overload", "  Yes: the ventricles release BNP when they are stretched by excess volume and pressure, which supports heart failure as the cause of her dyspnea.", "- a normal result for her age", "  No: a BNP below 100 pg/mL is the usual cutoff; 1,450 is markedly high and consistent with decompensation.", "Blank 2:", "- a collapsed lung", "  No: a pneumothorax would show air in the pleural space; her report describes fluid and congestion instead.", "- a bilateral lower-lobe pneumonia with consolidation", "  No: the report states no consolidation and she has no fever, so pneumonia is not supported.", "✓ pulmonary congestion from left-sided failure", "  Yes: vascular congestion and bilateral effusions with an enlarged heart are the x-ray picture of fluid backing up into the lungs.", "Blank 3:", "- from too little salt in her diet", "  No: she recently ate salty restaurant meals; low serum sodium here reflects excess water, not low intake.", "- from dehydration", "  No: she is clearly volume overloaded. The trap is assuming low sodium always means a fluid deficit.", "✓ dilutional, from water retention", "  Yes: in heart failure the kidneys hold on to water more than sodium, diluting the serum sodium; it improves as excess water is removed.", "", "Why: The BNP and chest x-ray confirm that her dyspnea is from heart failure with pulmonary congestion, not a lung infection. Her low sodium is dilutional: total body water is high. Treatment removes water with diuretics and limits sodium and fluid intake.", "Tip: Link each lab or image to the physiology it measures before deciding what it means for this client."], "st": "awaiting"}, {"id": "ngn:cs-heart-failure-3", "hash": "4e7357f108", "title": "Heart failure that tips over · item 3 · Matrix · Prioritize hypotheses", "body": ["Refer to the chart.", "", "For each client problem, indicate whether it is a priority now, a risk to anticipate during treatment, or not supported by the data.", "", "- Impaired gas exchange from pulmonary congestion → Priority now", "  her SpO₂ was 89% on room air with crackles to mid-lung, so oxygenation is the most immediate threat.", "- Fluid volume excess → Priority now", "  excess volume is the cause of her congestion, and removing it is the main goal of treatment.", "- Hypokalemia and hypomagnesemia → Risk to anticipate during treatment", "  her levels are normal now, but IV loop diuretics waste potassium and magnesium, so they are expected to fall.", "- Falls from urgency and frequent toileting → Risk to anticipate during treatment", "  brisk diuresis causes urgency and may cause orthostatic changes, so fall precautions belong in the plan.", "- Cardiogenic shock → Not supported by the data", "  her BP is 152/90, her skin is warm and she is alert, so perfusion is adequate; she is warm and wet, not cold.", "- Pneumonia → Not supported by the data", "  she is afebrile and the x-ray shows no consolidation, so her crackles are from congestion, not infection.", "", "Why: Her immediate problems are poor gas exchange and the fluid excess causing it. Diuresis brings predictable risks: electrolyte loss and falls. Cardiogenic shock and pneumonia are not supported because her perfusion is adequate and there are no signs of infection.", "Tip: Rank problems by what threatens airway and breathing now, then list the predictable side effects of the treatment."], "st": "awaiting"}, {"id": "ngn:cs-heart-failure-4", "hash": "3ba7a7083a", "title": "Heart failure that tips over · item 4 · Select all · Generate solutions", "body": ["Refer to the chart. The nurse is helping plan care for the first 24 hours.", "", "Which interventions should the nurse anticipate? Select all that apply.", "", "✓ Strict intake and output", "  Yes: measuring intake and output shows whether the diuretic is producing a net fluid loss.", "- A 500 mL 0.9% sodium chloride bolus for the low sodium", "  No: her sodium is low from excess water. A saline bolus adds volume to a client already in pulmonary congestion.", "✓ Potassium and magnesium levels at least daily", "  Yes: loop diuretics waste both electrolytes, and low levels can trigger dangerous dysrhythmias in a weakened heart.", "- Encourage 3 L of fluid a day to help the diuretic work", "  No: extra fluid offsets the diuretic and worsens overload. This is the opposite of the plan for decompensated failure.", "✓ Daily weight on the same scale, at the same time, before breakfast", "  Yes: daily weight is the best measure of fluid loss, and consistent technique makes the trend accurate.", "✓ Furosemide by IV push", "  Yes: IV loop diuretics act fast and avoid poor gut absorption from an edematous bowel; the IV dose is usually at least her home oral dose.", "✓ Sodium restriction with a fluid restriction of about 1.5 L/day", "  Yes: limiting sodium and fluid reduces water retention and supports diuresis in a client who is hyponatremic and overloaded.", "- Keep the bed flat to promote kidney blood flow", "  No: lying flat worsens orthopnea and lung congestion; she should sit upright in high Fowler position.", "", "Why: Care for acute decompensated heart failure centers on removing excess fluid with IV loop diuretics, measuring the result with daily weights and intake and output, protecting against electrolyte loss, and limiting new sodium and fluid. Anything that adds volume or worsens orthopnea is harmful.", "Tip: For a client with fluid overload, reject any option that adds fluid or makes breathing harder."], "st": "awaiting"}, {"id": "ngn:cs-heart-failure-5", "hash": "01d239b77e", "title": "Heart failure that tips over · item 5 · Ordered response · Take action", "body": ["Refer to the chart.", "", "Place the nurse's actions in the order they should be performed.", "", "Correct order:", "1. Check the telemetry rhythm and assess for weakness and muscle cramps.", "  Yes: low potassium and magnesium can cause dysrhythmias, so the nurse first assesses for their effects on the heart and muscles.", "2. Report the potassium of 3.2 mEq/L, magnesium of 1.6 mg/dL and her symptoms to the provider using SBAR.", "  Yes: both values are below the notify parameters in the orders, and an SBAR with the assessment findings lets the provider decide on replacement.", "3. Give the potassium and magnesium replacement as ordered.", "  Yes: replacing potassium and magnesium reduces dysrhythmia risk; magnesium also helps the body hold on to potassium.", "4. After replacement has started, give the 18:00 furosemide dose only as the provider directs.", "  Yes: another loop diuretic dose will lower potassium further, so it is given only after the provider knows the levels and replacement is underway.", "5. Recheck potassium and magnesium at the time ordered after replacement.", "  Yes: rechecking levels evaluates whether replacement worked and guides further doses.", "", "Why: The 17:00 labs show potassium and magnesium below the notify parameters, and she has calf cramps. The nurse assesses for cardiac effects, reports with SBAR, gives the ordered replacement, gives the next diuretic only as directed, and then rechecks levels. Giving furosemide without addressing the low potassium is the trap.", "Tip: In an ordering item, assess before you report, report before you act on new orders, and evaluate last."], "st": "awaiting"}, {"id": "ngn:cs-heart-failure-6", "hash": "621e49dd72", "title": "Heart failure that tips over · item 6 · Highlight · Evaluate outcomes", "body": ["Refer to the chart. Discharge note:", "", "Highlight the findings and statements that show the expected outcomes of treatment and teaching have been met.", "", "✓ highlight Weight 78.6 kg (173.3 lb), down 3.9 kg since admission.", "  Yes: she is close to her dry weight of 78 kg, showing the diuresis removed most of the excess fluid.", "✓ highlight Breathing easily on room air, SpO₂ 95%, lungs clear, slept on one pillow.", "  Yes: clear lungs, normal oxygenation and no orthopnea show the pulmonary congestion has resolved.", "✓ highlight Potassium 4.1 mEq/L and magnesium 2.0 mg/dL.", "  Yes: both electrolytes are back in the normal range after replacement, which lowers dysrhythmia risk.", "✓ highlight Client states: 'I will weigh myself every morning after I urinate and before breakfast.'", "  Yes: daily weight at the same time and in the same way is the key self-monitoring skill for heart failure.", "✓ highlight 'I will call the clinic if I gain 2 to 3 pounds in a day or 5 pounds in a week.'", "  Yes: these are the standard thresholds for early reporting, so problems are caught before she needs admission.", "- 'I can stop the water pill once my ankles go back to normal.'", "  No: stopping her diuretic caused this admission. She needs teaching that it is a daily medication even when she feels well.", "- 'If I get short of breath at night, I will just sleep in my recliner again.'", "  No: new orthopnea is a warning sign to report, not to manage at home. This statement needs more teaching.", "", "Why: Her weight, lungs, oxygenation and electrolytes show that treatment worked. Two teach-back statements show she understands daily weights and when to call. Two statements show she still needs teaching on staying on her diuretic and reporting new orthopnea before discharge.", "Tip: For evaluation of teaching, select statements that match the teaching exactly; any plan to stop a medication or self-manage new symptoms needs more teaching."], "st": "awaiting"}, {"id": "ngn:cs-dka-1", "hash": "7eb6f8a141", "title": "New diabetes in DKA · item 1 · Highlight · Recognize cues", "body": ["Client: 15-year-old girl directly admitted to the pediatric unit with new-onset type 1 diabetes and diabetic ketoacidosis", "History and Physical 15:30: Direct admission from her pediatrician's office after a point-of-care glucose read above the meter range. Three weeks of thirst, frequent urination and getting up 4 times a night to urinate. Lost 4 kg (8.8 lb) in 3 weeks. Vomited twice today; abdominal pain since this morning. No past medical history. No medications. Weight 50 kg (110 lb). Lives with her mother and younger brother.", "Nurses' Notes 15:40: Respirations deep and rapid at 32. Fruity odor on breath. Lips cracked, mucous membranes dry, capillary refill 3 seconds. Drowsy but answers questions correctly; GCS 15. Reports abdominal pain and vomited twice today. SpO₂ 99% on room air. Temperature 37.2 °C (99 °F). Peripheral IV placed and labs drawn.", "Vital Signs 15:40: Temperature 37.2 °C (99 °F); Heart rate 124 (high); Blood pressure 108/64; Respiratory rate 32, deep (high); SpO₂ 99% on room air", "Laboratory Results 16:00 (shown from item 2): Glucose 512 mg/dL (high); Venous pH 7.14 (low); Bicarbonate 9 mEq/L (low); Sodium 132 mEq/L (low); Chloride 98 mEq/L; Potassium 5.6 mEq/L (high); BUN 24 mg/dL (high); Creatinine 1.0 mg/dL; Beta-hydroxybutyrate 6.2 mmol/L (high); Urine ketones Large (high)", "Orders 16:10 (shown from item 5): Pediatric DKA protocol. 0.9% sodium chloride 500 mL (10 mL/kg) IV over 1 hour, then 0.9% sodium chloride at 160 mL/h. Regular insulin infusion 0.1 units/kg/h (5 units/h) to start at 17:10, 1 hour after fluids begin; no insulin bolus. Add potassium 40 mEq/L to IV fluids once potassium is below 5.5 mEq/L and the client has voided. Add dextrose 5% to IV fluids when glucose is below 300 mg/dL. Bedside glucose every hour. Electrolytes and venous gas every 2 hours. Neurologic checks every hour. Strict intake and output. Mannitol 0.5 to 1 g/kg IV available at the bedside; notify provider immediately for any change in neurologic status.", "Medication Administration Record 17:10 (shown from item 5): 17:10 Regular insulin infusion started at 5 units/h, independent double check by two RNs. 18:05 Potassium chloride 40 mEq/L added to IV fluids (potassium 5.0, voided 400 mL). 20:00 Dextrose 5% added to IV fluids (glucose 290 mg/dL).", "Vital Signs 19:30 (shown from item 5): Heart rate 104 (high); Blood pressure 112/70; Respiratory rate 24; GCS 15", "Laboratory Results 21:00 (shown from item 5): Bedside glucose 262 mg/dL (high); Venous pH 7.22 (low); Bicarbonate 12 mEq/L (low); Sodium 136 mEq/L; Potassium 4.2 mEq/L", "Nurses' Notes 21:30 (shown from item 5): Client says, 'My head is pounding, it's the worst headache I've ever had.' Opens eyes to voice, confused about where she is; GCS 13. Pupils equal and reactive. HR 62, was 104 at 19:30. BP 136/88, was 112/70. Respirations 20, regular.", "Nurses' Notes 08:00 (day 2) (shown from item 6): Mannitol 25 g (0.5 g/kg) IV given at 21:45 per provider; IV fluid rate reduced by one third; transferred to the pediatric ICU. Headache gone by 23:30; neurologic checks normal overnight. Now alert and oriented, GCS 15. Drinking water and asking for breakfast; no vomiting since admission.", "Laboratory Results 07:00 (day 2) (shown from item 6): Glucose 182 mg/dL (high); Venous pH 7.34; Bicarbonate 18 mEq/L (low); Sodium 138 mEq/L; Chloride 108 mEq/L (high); Potassium 4.0 mEq/L; Beta-hydroxybutyrate 0.4 mmol/L", "Vital Signs 08:00 (day 2) (shown from item 6): Heart rate 88; Blood pressure 112/68; Respiratory rate 18; GCS 15", "", "Refer to the chart. The nurse reviews the 15:40 nurses' note.", "", "Highlight the findings that require follow-up.", "", "✓ highlight Respirations deep and rapid at 32.", "  Yes: Kussmaul breathing is the body blowing off carbon dioxide to compensate for a severe metabolic acidosis.", "✓ highlight Fruity odor on breath.", "  Yes: acetone, a ketone, is exhaled through the lungs and signals ketoacidosis.", "✓ highlight Lips cracked, mucous membranes dry, capillary refill 3 seconds.", "  Yes: these show significant dehydration from osmotic diuresis and vomiting, which needs careful fluid replacement.", "✓ highlight Drowsy but answers questions correctly; GCS 15.", "  Yes: drowsiness reflects acidosis and dehydration, and it sets the neurologic baseline the nurse will compare against during treatment.", "✓ highlight Reports abdominal pain and vomited twice today.", "  Yes: abdominal pain and vomiting are common in DKA and worsen fluid and electrolyte losses.", "- SpO₂ 99% on room air.", "  No: her oxygenation is normal. The trap is treating rapid breathing in DKA as a lung or oxygen problem.", "- Temperature 37.2 °C (99 °F).", "  No: her temperature is normal, so there is no sign of an infection triggering this episode.", "", "Why: Deep rapid respirations, fruity breath, dehydration, drowsiness, vomiting and abdominal pain together with weeks of thirst, frequent urination and weight loss form the classic picture of new type 1 diabetes in ketoacidosis. Her normal oxygen saturation and temperature help rule out a lung or infectious cause.", "Tip: Group the findings into one pattern; cues that fit the suspected condition need follow-up, and normal values are distractors."], "st": "awaiting"}, {"id": "ngn:cs-dka-2", "hash": "f6e2ca5749", "title": "New diabetes in DKA · item 2 · Drop-down · Analyze cues", "body": ["Refer to the chart.", "", "Complete the sentences.", "", "Blank 1:", "✓ 25 mEq/L", "  Yes: anion gap is sodium minus the sum of chloride and bicarbonate: 132 minus 107 equals 25, well above the normal of about 12.", "- 12 mEq/L", "  No: 12 is roughly the upper end of normal. Her sodium of 132 minus chloride 98 and bicarbonate 9 gives 25.", "- 34 mEq/L", "  No: this subtracts only the chloride. Subtract both chloride and bicarbonate from the sodium: 132 minus 107 equals 25.", "Blank 2:", "- a laboratory error", "  No: the gap matches her low pH, low bicarbonate and high ketones. The trap is dismissing a consistent result.", "- chloride and acid lost through repeated vomiting", "  No: vomiting loses acid and causes alkalosis; it does not create a high anion gap acidosis.", "✓ ketoacids building up in the blood", "  Yes: an elevated gap means unmeasured acids are present; with a beta-hydroxybutyrate of 6.2 mmol/L, they are ketoacids.", "Blank 3:", "- kidney failure", "  No: her creatinine is 1.0 mg/dL, so the kidneys are working. The high level is from a shift, not poor excretion.", "- too much potassium in her diet and supplements over the past several weeks", "  No: diet does not raise serum potassium this way in a child with normal kidneys, and she has been vomiting.", "✓ potassium shifting out of cells, with a low total body potassium", "  Yes: acidosis and lack of insulin move potassium out of cells while urine losses deplete total stores; the level will drop once insulin starts.", "", "Why: Her pH of 7.14, bicarbonate of 9, high ketones and an anion gap of 25 confirm diabetic ketoacidosis. Her serum potassium looks high, but she has lost potassium in her urine for weeks. Insulin will drive potassium back into cells, so it can fall quickly.", "Tip: Calculate the anion gap as sodium minus chloride and bicarbonate, and remember that potassium in DKA reflects a shift, not true body stores."], "st": "awaiting"}, {"id": "ngn:cs-dka-3", "hash": "cfa3bed697", "title": "New diabetes in DKA · item 3 · Matrix · Prioritize hypotheses", "body": ["Refer to the chart.", "", "For each client problem, indicate whether it is a priority now, a risk to anticipate during treatment, or not supported by the data.", "", "- Metabolic acidosis from ketoacidosis → Priority now", "  her pH of 7.14 and bicarbonate of 9 show a significant acidosis that insulin must reverse.", "- Fluid volume deficit from osmotic diuresis → Priority now", "  dry membranes, delayed capillary refill, tachycardia and a 4 kg weight loss show she is dehydrated.", "- Hypokalemia once insulin starts → Risk to anticipate during treatment", "  insulin moves potassium into cells, unmasking her total body deficit, so the level is expected to fall.", "- Cerebral edema → Risk to anticipate during treatment", "  children and teens with new-onset DKA are at highest risk, usually 4 to 12 hours into treatment.", "- Hypoglycemia as glucose falls on insulin → Risk to anticipate during treatment", "  the insulin infusion continues until ketones clear, so dextrose is added as glucose falls to prevent lows.", "- Hyperosmolar hyperglycemic state → Not supported by the data", "  that condition has little or no ketosis and a pH above 7.3; her large ketones and pH of 7.14 point to DKA.", "", "Why: Acidosis and dehydration are the problems to treat now. Treatment itself brings predictable risks: falling potassium, falling glucose and, in children, cerebral edema. Planning for these from the start makes treatment safe.", "Tip: Separate what is harming the client now from what the treatment is likely to cause; both belong in the plan, but now comes first."], "st": "awaiting"}, {"id": "ngn:cs-dka-4", "hash": "60ea941622", "title": "New diabetes in DKA · item 4 · Matrix · Generate solutions", "body": ["Refer to the chart. The client weighs 50 kg.", "", "For each intervention, indicate whether the nurse should anticipate it or not anticipate it in the pediatric DKA protocol.", "", "- 0.9% sodium chloride 10 mL/kg IV over 1 hour, then deficit replaced evenly over 24 to 48 hours → Anticipated", "  an initial bolus restores circulation, and the remaining deficit is replaced evenly over 24 to 48 hours rather than all at once, as ISPAD 2022 recommends.", "- Regular insulin infusion at 0.05 to 0.1 units/kg/h, started 1 hour after fluids, now that potassium is known → Anticipated", "  insulin stops ketone production; it starts only after the potassium level is known and fluids are running.", "- Potassium added to IV fluids once potassium is below 5.5 mEq/L and she is voiding → Anticipated", "  insulin will lower her potassium, so replacement begins as soon as the level falls and kidney function is confirmed.", "- IV insulin bolus of 0.1 units/kg before the infusion → Not anticipated", "  a bolus is not recommended in children because it drops glucose and osmolality too fast and may raise cerebral edema risk.", "- IV sodium bicarbonate to correct the pH → Not anticipated", "  bicarbonate is not routine in pediatric DKA; it is linked to cerebral edema and worsens hypokalemia. Insulin corrects the acidosis.", "- Repeated rapid 20 mL/kg boluses until the heart rate is normal → Not anticipated", "  she is not in shock and needs a measured bolus followed by steady deficit replacement; her heart rate falls as the deficit is corrected over 24 to 48 hours. Repeat boluses are for circulatory compromise.", "", "Why: Pediatric DKA is treated with a measured fluid bolus, deficit replacement over 24 to 48 hours, a low-dose insulin infusion without a bolus started at least 1 hour after fluids, and early potassium replacement. An insulin bolus and bicarbonate are avoided; bicarbonate is linked to cerebral edema. ISPAD 2022 notes that the PECARN FLUID trial did not link fluid rate to cerebral injury, so fluids should not be withheld when needed.", "Tip: In pediatric DKA, choose the options that correct things slowly and safely; anything that corrects too fast is usually the trap."], "st": "awaiting"}, {"id": "ngn:cs-dka-5", "hash": "f4b3ce13a3", "title": "New diabetes in DKA · item 5 · Select all · Take action", "body": ["Refer to the chart.", "", "Which actions should the nurse take now? Select all that apply.", "", "- Give acetaminophen for the headache and recheck in 1 hour.", "  No: treating the headache as minor and waiting an hour misses a life-threatening complication that needs action in minutes.", "- Lay her flat with her legs raised.", "  No: lowering the head raises intracranial pressure, which is the opposite of what she needs.", "✓ Anticipate an order to reduce the IV fluid rate.", "  Yes: fluids are reduced, often by one third, to avoid adding to brain swelling while still treating dehydration.", "- Give a 20 mL/kg fluid bolus for the slower heart rate.", "  No: the slow heart rate with rising BP is a sign of rising intracranial pressure, not low volume; extra fluid can worsen swelling.", "✓ Raise the head of the bed to 30 degrees with the head midline.", "  Yes: elevating the head and keeping it midline helps venous drainage from the brain and can lower intracranial pressure.", "✓ Notify the provider immediately and call the rapid response team.", "  Yes: severe headache, a falling heart rate, rising BP and a GCS drop from 15 to 13 are warning signs of cerebral edema, an emergency.", "✓ Check a bedside glucose.", "  Yes: any change in mental status during an insulin infusion calls for a glucose check to rule out hypoglycemia quickly.", "✓ Bring the ordered mannitol to the bedside and prepare to give 0.5 to 1 g/kg IV.", "  Yes: mannitol draws fluid out of the brain and should be given without delay once cerebral edema is suspected.", "", "Why: New severe headache, bradycardia, rising BP and decreasing level of consciousness during DKA treatment signal cerebral edema. The nurse calls for help immediately, positions the head up and midline, prepares mannitol, anticipates a lower fluid rate and rules out hypoglycemia. Delay or extra fluid can be fatal.", "Tip: A falling heart rate with a rising BP and changing mental status means rising intracranial pressure; act and call at once."], "st": "awaiting"}, {"id": "ngn:cs-dka-6", "hash": "3b0e986abc", "title": "New diabetes in DKA · item 6 · Matrix · Evaluate outcomes", "body": ["Refer to the chart.", "", "For each finding or plan, indicate whether it supports a safe transition to subcutaneous insulin or needs follow-up first.", "", "- Venous pH 7.34 and bicarbonate 18 mEq/L → Supports transition", "  DKA is resolved when venous pH is 7.30 or higher and bicarbonate is 18 mEq/L or higher (ISPAD 2022); both targets are met.", "- Sodium 138, chloride 108, bicarbonate 18 → Supports transition", "  the anion gap is now 12, down from 25, showing the ketoacids have cleared.", "- Beta-hydroxybutyrate 0.4 mmol/L, down from 6.2 → Supports transition", "  a blood ketone level below 0.6 mmol/L is near normal and shows ketone production has stopped.", "- Alert, GCS 15, no headache, drinking and asking for breakfast → Supports transition", "  a normal neurologic exam and the ability to eat are needed before starting a subcutaneous meal-based insulin plan.", "- Heart rate 88, BP 112/68 → Supports transition", "  her vital signs are normal, and the bradycardia and high BP from last night have resolved.", "- Plan: stop the insulin infusion at 08:00 and give the first subcutaneous insulin with lunch at 12:00 → Needs follow-up first", "  stopping the drip before subcutaneous insulin takes effect can cause ketoacidosis to return; give it first and overlap before stopping the infusion.", "", "Why: Her acidosis, anion gap and ketones have all resolved, her neurologic status is back to normal and she can eat, so she is ready for subcutaneous insulin. IV insulin lasts only minutes after it stops, so the first subcutaneous dose must be given before the infusion is turned off.", "Tip: Judge DKA resolution by pH, bicarbonate, anion gap and ketones, not glucose, and never leave a gap in insulin coverage."], "st": "awaiting"}]}, "packs": [{"id": "drill-med-1", "title": "Drills: Med Pass, part 1 of 2", "sub": "What to check before a medication, then give, hold or call. A pharmacist is especially welcome.", "n": 25, "reviewed": 0, "changed": 0}, {"id": "drill-med-2", "title": "Drills: Med Pass, part 2 of 2", "sub": "What to check before a medication, then give, hold or call. A pharmacist is especially welcome.", "n": 25, "reviewed": 0, "changed": 0}, {"id": "drill-first-1", "title": "Drills: "sub": "21 standalone practice questions.", "n": 21, "reviewed": 0, "changed": 0}, {"id": "bank-icu", "title": "NCLEX question bank: Critical care", "sub": "21 standalone practice questions.", "n": 21, "reviewed": 0, "changed": 0}, {"id": "bank-sd", "title": "NCLEX question bank: Cardiac and step-down", "sub": "19 standalone practice questions.", "n": 19, "reviewed": 0, "changed": 0}, {"id": "bank-peds", "title": "NCLEX question bank: Pediatrics", "sub": "17 standalone practice questions.", "n": 17, "reviewed": 0, "changed": 0}, {"id": "bank-ob", "title": "NCLEX question bank: Obstetrics and newborn", "sub": "15 standalone practice questions.", "n": 15, "reviewed": 0, "changed": 0}, {"id": "bank-psy", "title": "NCLEX question bank: Psychiatric", "sub": "11 standalone practice questions.", "n": 11, "reviewed": 0, "changed": 0}, {"id": "bank-periop", "title": "NCLEX question bank: Perioperative", "sub": "7 standalone practice questions.", "n": 7, "reviewed": 0, "changed": 0}, {"id": "cases-1", "title": "Case studies: Pneumonia that turns septic; Heart failure that tips over; New diabetes in DKA", "sub": "Unfolding case studies: one client, six questions in clinical judgment order.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "cases-2", "title": "Case studies: Hip replacement with a clot that travels; Variceal bleed in cirrhosis; Stroke alert in the ED", "sub": "Unfolding case studies: one client, six questions in clinical judgment order.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "cases-3", "title": "Case studies: Preeclampsia that turns severe; Infant with gastroenteritis and dehydration; House fire with inhalation injury", "sub": "Unfolding case studies: one client, six questions in clinical judgment order.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "cases-4", "title": "Case studies: Ankle fracture that turns into alcohol withdrawal; Stomach bug that ends in hyperkalemia; New antibiotic that triggers serotonin syndrome", "sub": "Unfolding case studies: one client, six questions in clinical judgment order.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "cases-5", "title": "Case studies: COPD flare with pneumonia; Bleeding after a hysterectomy; Head injury after a motorcycle crash", "sub": "Unfolding case studies: one client, six questions in clinical judgment order.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "cases-6", "title": "Case studies: Placental abruption at 34 weeks; Preterm labor at 31 weeks; Bacterial meningitis in a preschooler", "sub": "Unfolding case studies: one client, six questions in clinical judgment order.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "cases-7", "title": "Case studies: Fever and rigidity on haloperidol", "sub": "Unfolding case studies: one client, six questions in clinical judgment order.", "n": 6, "reviewed": 0, "changed": 0}]};</script><script>(()=>{const v=window.Shift||{},d=v.tel,h=window.RI||{packs:[]},p=document.getElementById("app"),i=e=>String(e??"").replace(/[&<>"']/g,a=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[a]),k={awaiting:"Awaiting clinical review",reviewed:"Clinically reviewed",changed:"Changed since its review"},f=e=>(e.reviewed===e.n?'<span class="chip reviewed">Clinically reviewed</span>':`<span class="chip awaiting">${e.reviewed} of ${e.n} reviewed</span>`)+(e.changed?` <span class="chip changed">${e.changed} changed since review</span>`:"");if(!h.pack){const e=[["Drills",a=>a.id.startsWith("drill-")],["NCLEX questions after each shift",a=>a.id.startsWith("ngn-shift")],["NCLEX question bank",a=>a.id.startsWith("bank-")],["Unfolding case studies",a=>a.id.startsWith("cases-")]];p.innerHTML=`<a class="home" href="/">The Shift</a><h1>Clinical review: practice content</h1>
      <p class="muted">The drills and NCLEX practice questions, split into packs a clinician can check in one sitting (about 30 to 45 minutes each). Each item shows the right answer and why every other option is wrong. Pick a pack that matches your experience.</p>
      <p><a href="/review/">Reviewing a whole shift instead? Shift reviews are here.</a></p>
      ${e.map(([a,s])=>{const o=h.packs.filter(s);return o.length?`<h2>${i(a)}</h2><div class="shifts">${o.map(c=>`<a href="/review/practice/${i(c.id)}/"><div class="card"><div style="display:flex;justify-content:space-between;gap:.6rem;flex-wrap:wrap"><h3>${i(c.title)}</h3><span>${f(c)}</span></div><p class="muted" style="margin:.3rem 0 0">${c.n} items. ${i(c.sub)}</p></div></a>`).join("")}</div>`:""}).join("")}`;return}const n=h.pack,g="theshift.review.items."+n.id;let t={};try{t=JSON.parse(localStorage.getItem(g)||"{}")||{}}catch{t={}}t.marks=t.marks||{},t.notes=t.notes||{};const m=()=>{try{localStorage.setItem(g,JSON.stringify(t))}catch{}},E=e=>e?/^  /.test(e)?`<p class="why">${i(e.trim())}</p>`:/^✓/.test(e)?`<p class="ok"><b>${i(e)}</b></p>`:/^(- ✗|- |✗)/.test(e)?`<p class="no">${i(e.replace(/^- /,""))}</p>`:`<p>${i(e)}</p>`:'<div class="sp"></div>',x=e=>`<div class="verdict" role="group" aria-label="Your verdict">${[["ok","Accurate"],["fix","Needs change"],["unsure","Not sure"]].map(([a,s])=>`<button type="button" data-rid="${i(e)}" data-v="${a}" aria-pressed="${t.marks[e]===a}">${s}</button>`).join("")}</div>
    <textarea data-note="${i(e)}" placeholder="What should it say instead? A source helps." ${t.marks[e]==="fix"||t.notes[e]?"":"hidden"} aria-label="Your comment">${i(t.notes[e]||"")}</textarea>`,S=(e,a)=>`<div class="dec item" id="i-${a+1}"><div class="top"><span class="pts">${a+1}</span><span class="chip ${e.st}">${i(k[e.st])}${e.by?`: ${i(e.by)}`:""}</span><span>${i(e.id)} · version ${i(e.hash)}</span></div>
      <b>${i(e.title)}</b><div class="body">${e.body.map(E).join("")}</div>${x(e.id)}</div>`,r=n.items.map(e=>e.id);p.innerHTML=`<a class="home" href="/review/practice/">The Shift · Practice review</a>
    <h1>${i(n.title)}</h1>

    <div class="card how"><h3>How to review</h3><ol>
      <li>For each item, check that the marked answer is right, that every other option is clearly wrong (not just slightly less good), that the numbers are current, and that any tip is safe to remember as a rule.</li>
      <li>Mark <b>Accurate</b>, <b>Needs change</b> or <b>Not sure</b>. Say what's wrong when something needs changing.</li>
      <li>Add your details and any references, then send. Your answers save in this browser as you go, so you can stop and come back.</li></ol>
      <p class="muted" style="margin-bottom:0">These are practice items for nursing students, written to common US teaching. Judge them against what a safe, current standard of care would teach a new nurse, not your facility's policy.</p></div>
