<style>
:root{--bg:#E6EDF0;--surface:#FBFCFC;--surface-2:#EDF2F4;--ink:#152238;--ink-2:#4D5A6F;--line:#CAD5DB;--teal:#2449A8;--teal-ink:#fff;--red:#B3342B;--red-bg:#F8E1DE;--good:#2B7249;--good-bg:#E0F0E6;--amber:#A96C0E;--amber-bg:#FBEFD6;
  --serif:"Barlow Condensed","Arial Narrow",sans-serif;--sans:"Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161C;--surface:#1A1F27;--surface-2:#212833;--ink:#E7E4DB;--ink-2:#A0A5AE;--line:#343C48;--teal:#93B4E4;--teal-ink:#0F1B2C;--red:#F0766B;--red-bg:#3b1d1b;--good:#72c692;--good-bg:#16301f;--amber:#E9AE4E;--amber-bg:#35291a}}
:root[data-theme="dark"]{--bg:#12161C;--surface:#1A1F27;--surface-2:#212833;--ink:#E7E4DB;--ink-2:#A0A5AE;--line:#343C48;--teal:#93B4E4;--teal-ink:#0F1B2C;--red:#F0766B;--red-bg:#3b1d1b;--good:#72c692;--good-bg:#16301f;--amber:#E9AE4E;--amber-bg:#35291a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
main{max-width:52rem;margin:0 auto;padding:clamp(1.2rem,5vw,3rem) 16px calc(5rem + env(safe-area-inset-bottom))}
a{color:var(--teal)}
.home{font-family:var(--serif);font-weight:700;font-size:1.1rem;letter-spacing:.04em;text-transform:uppercase;background:var(--ink);color:var(--bg);padding:.28em .55em .22em;border-radius:2px;text-decoration:none}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.9rem,6vw,2.6rem);line-height:1.1;letter-spacing:0;margin:1.6rem 0 .3rem}
h2{font-size:1.15rem;margin:2.4rem 0 .6rem}
h3{font-size:1rem;margin:0}
p{margin:.5rem 0}
.muted{color:var(--ink-2)}
.meta{display:flex;flex-wrap:wrap;gap:.4rem .6rem;margin-top:.6rem}
.chip{display:inline-flex;align-items:center;padding:.15em .6em;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--surface-2);border:1px solid var(--line)}
.chip.awaiting{background:var(--amber-bg);border-color:transparent;color:var(--amber)}
.chip.reviewed{background:var(--good-bg);border-color:transparent;color:var(--good)}
.chip.changed{background:var(--red-bg);border-color:transparent;color:var(--red)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem 1.1rem;margin:.8rem 0}
.how ol{margin:.4rem 0 0;padding-left:1.2rem}.how li{margin:.2rem 0}
label{display:block;font-weight:600;font-size:.9rem;margin:.7rem 0 .25rem}
input[type=text],input[type=email],textarea,select{width:100%;min-height:44px;padding:.5em .7em;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:5rem;resize:vertical}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:0 1rem}
details.pt{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:.6rem 0}
details.pt>summary{cursor:pointer;padding:.85rem 1rem;font-weight:600;list-style-position:inside}
details.pt>div{padding:0 1rem 1rem}
table{width:100%;border-collapse:collapse;font-size:.88rem;margin:.4rem 0}
th,td{text-align:left;vertical-align:top;padding:.35rem .5rem .35rem 0;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--ink-2);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
.scroll{overflow-x:auto}
ul.plain{margin:.3rem 0;padding-left:1.1rem}
.dec{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:.85rem 1rem;margin:.6rem 0}
.dec.pos{border-left-color:var(--good)}.dec.neg{border-left-color:var(--red)}
.dec .top{display:flex;flex-wrap:wrap;gap:.3rem .5rem;align-items:center;font-size:.78rem;color:var(--ink-2);font-weight:600}
.pts{font-weight:700;padding:.05em .45em;border-radius:4px;background:var(--surface-2)}
.pos .pts{color:var(--good);background:var(--good-bg)}.neg .pts{color:var(--red);background:var(--red-bg)}
.dec b{display:block;margin:.35rem 0 .15rem;font-size:1rem}
.dec .why{font-family:var(--sans);color:var(--ink-2);margin:0}
.dec .src{font-size:.75rem;color:var(--ink-2);margin-top:.35rem}
.verdict{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.7rem}
.verdict button{min-height:40px;padding:.35em .9em;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer}
.verdict button[aria-pressed="true"][data-v="ok"]{background:var(--good);border-color:var(--good);color:var(--teal-ink)}
.verdict button[aria-pressed="true"][data-v="fix"]{background:var(--red);border-color:var(--red);color:var(--teal-ink)}
.verdict button[aria-pressed="true"][data-v="unsure"]{background:var(--amber);border-color:var(--amber);color:var(--teal-ink)}
.dec textarea{margin-top:.5rem;min-height:3.6rem}
.opt{padding:.4rem 0;border-bottom:1px solid var(--line);font-size:.92rem}.opt:last-child{border:0}
.opt i{font-style:normal;font-weight:700;font-size:.75rem;padding:.05em .4em;border-radius:4px;margin-right:.4rem;background:var(--surface-2)}
.bar{position:sticky;top:0;z-index:5;margin:0 -16px;padding:.6rem 16px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:.6rem;font-size:.9rem}
.bar .prog{display:block;flex:1;min-width:4rem;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;max-width:12rem}.bar .prog i{display:block;height:100%;background:var(--teal)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:.55em 1.2em;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn-primary{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.row{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1rem}
.check{display:flex;gap:.6rem;align-items:flex-start;font-weight:500;margin-top:1rem}
.check input{width:1.2rem;height:1.2rem;margin-top:.2rem;flex:none}
.msg{margin-top:.8rem;font-weight:600}.msg.err{color:var(--red)}.msg.ok{color:var(--good)}
pre{white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:.8rem;font-size:.8rem;max-height:18rem;overflow:auto}
.shifts a{display:block;text-decoration:none;color:inherit}
.shifts .card:hover{border-color:var(--ink-2)}
</style>
<style>.item .body p{margin:.15rem 0}.item .body .why{color:var(--ink-2);font-size:.92rem;margin:0 0 .35rem 1.1rem}.item .body .ok b{display:inline;margin:0;color:var(--good)}.item .body .no{color:var(--ink)}.item .body .sp{height:.5rem}.item>b{margin-bottom:.5rem}</style></head>

sed. HR 118, BP 92/60, T 38.6.", "", "Why: New confusion with a fast heart rate, low pressure and fever is sepsis. The others are expected for their conditions.", "Pearl: Unexpected beats expected. Acute beats chronic. Sepsis is a clock."], "st": "awaiting"}, {"id": "drill:wf-pe", "hash": "72926aa559", "title": "Ortho, 10:00", "body": ["Four call lights at once. Who first?", "", "- Mrs. Adler, 72: Hip replacement day 1. Pain 8 of 10, BP 158/92.", "  Not first: Pain is driving her pressure up; treat it soon. A new breathing problem comes first.", "✓ FIRST Mr. Nguyen, 55: Knee replacement day 2. Sudden sharp chest pain, short of breath. HR 122.", "- Ms. Patel, 40: Day 1 after a hysterectomy. Temp 38.0. Incentive spirometer at 750 mL.", "  Not first: A low-grade temp on day 1 is usually atelectasis. Keep her deep breathing; she's stable.", "- Mr. Boyd, 64: Day 2 after a knee replacement. Left calf tender and warm.", "  Not first: A possible DVT matters, but a possible PE already causing breathlessness and a fast pulse comes first.", "", "Why: Sudden chest pain and breathlessness after joint surgery is a pulmonary embolism until proven otherwise. Breathing comes before pain.", "Pearl: Airway, breathing, circulation. A new problem with breathing jumps the line."], "st": "awaiting"}, {"id": "drill:wf-psych-calm", "hash": "c3434851b1", "title": "Adult psych, 09:00", "body": ["Who needs you first?", "", "- Jasmine, 27: Manic. Pacing, loud, yelling at a peer. Redirectable so far.", "  Not first: Escalating, but still redirectable and nobody is hurt. A hidden suicide risk is more dangerous.", "✓ FIRST Daniel, 35: Admitted for depression. Suddenly calm and smiling. Gave his watch to a peer.", "- Ruth, 61: Refused her morning lithium. Says it makes her hands shake.", "  Not first: Address the refusal and check the tremor today; not an emergency.", "- Marcus, 44: Hears voices calling him worthless. Says he would never act on them.", "  Not first: Assess the voices soon, but he's engaged and denies intent. Daniel's sudden calm is the bigger red flag.", "", "Why: Sudden calm and giving things away after deep depression can mean a decision has been made. That is a suicide warning sign.", "Pearl: Sudden peace in a depressed patient is a finding, not a recovery. Ask directly about suicide, and keep them safe."], "st": "awaiting"}, {"id": "drill:wf-croup", "hash": "d4379fdd61", "title": "Pediatrics, 14:00", "body": ["Who do you see first?", "", "✓ FIRST Mateo, 2: Croup. Stridor even at rest. Pulling in at the ribs.", "- Ava, 8: Broken arm in a cast. Pain 7 of 10. Fingers pink, cap refill 2 seconds.", "  Not first: Pain to treat soon; circulation is fine.", "- Noah, 6 mos: 6 months old. Temp 38.9, fussy, feeding a little less.", "  Not first: Fever to assess soon, but he's feeding and his airway is fine.", "- Zoe, 15: DKA resolving. Off the drip, glucose 74, eating lunch.", "  Not first: Low-normal and she's eating. Recheck soon; airway first.", "", "Why: Stridor at rest with retractions means the airway is narrowing now. Children decompensate fast.", "Pearl: Stridor at rest is never \"just croup.\" Airway first, always."], "st": "awaiting"}, {"id": "drill:wf-pph", "hash": "39d4ae8e40", "title": "Mother-baby, 11:00", "body": ["Who first?", "", "✓ FIRST Ms. Reyes, 31: 2 hours after birth. Fundus boggy. Soaked a pad in 15 minutes.", "- Mrs. Chen, 34: Day 1. BP 142/90. No headache or vision changes.", "  Not first: Raised but not severe range, and no symptoms. Recheck soon; active bleeding comes first.", "- Ms. Ward, 26: Day 2. Temp 38.1, breasts full and tender.", "  Not first: Engorgement can cause a low-grade temperature. Assess her, but she's stable.", "- Baby Ito, 3 days: Day 3. Jaundice to the chest. Bilirubin near the phototherapy line.", "  Not first: Needs a recheck and maybe phototherapy today; not a minutes-matter emergency.", "", "Why: A boggy uterus soaking a pad in 15 minutes is a postpartum hemorrhage. She can lose a lot of blood very fast.", "Pearl: Postpartum: a soft fundus and heavy bleeding means massage the fundus and get help, now."], "st": "awaiting"}, {"id": "drill:wf-k", "hash": "c2b323dab6", "title": "Lab results, 06:00", "body": ["Four results post at once. Which do you act on first?", "", "✓ FIRST Mr. Hale, 67: K 6.8. Peaked T waves on the monitor.", "- Mrs. Ruiz, 58: Sodium 127. Mild headache, alert.", "  Not first: Low and needs follow-up, but she's alert with mild symptoms. ECG changes with K 6.8 come first.", "- Mr. Owens, 49: Hemoglobin 7.6, down from 8.4. No bleeding seen.", "  Not first: A drop to report today, possibly a transfusion. Not as immediate as a lethal rhythm.", "- Ms. Lin, 44: Glucose 412 on steroids. Alert, no ketones.", "  Not first: High and needs insulin per orders, but not immediately life-threatening.", "", "Why: A potassium of 6.8 with ECG changes can cause a fatal arrhythmia within minutes.", "Pearl: A critical value with a physical sign (ECG change, symptoms) is an emergency, not a result to file."], "st": "awaiting"}, {"id": "drill:wf-stroke", "hash": "ccde0b0f71", "title": "Med-surg, 15:10", "body": ["Who first?", "", "✓ FIRST Mr. Feld, 74: New facial droop and slurred speech. Fine at 14:50.", "- Mrs. Dunn, 80: Aphasia from an old stroke, unchanged. Temp 38.2 tonight.", "  Not first: Fever needs a workup soon, but her deficit is old. A new deficit inside the treatment window comes first.", "- Mr. Obi, 69: Atrial fibrillation, rate 128, BP 124/78. Says he feels fine.", "  Not first: Rapid AF with a normal pressure and no symptoms: report it, but he's stable.", "- Ms. Ross, 52: Migraine history. Headache 6 of 10, like her usual ones.", "  Not first: A familiar pattern and stable. Treat after the stroke alert.", "", "Why: New stroke signs with a known last-well time 20 minutes ago. Every minute counts for clot-busting and clot removal.", "Pearl: New neuro deficit: note the last known well time and call the stroke alert. Old deficits are baseline."], "st": "awaiting"}, {"id": "drill:wf-thyroid", "hash": "40c7eae0f3", "title": "Surgical, 13:00", "body": ["Who first?", "", "✓ FIRST Ms. Ford, 45: 4 hours after thyroidectomy. Hoarse, new noisy breathing.", "- Mr. Silva, 50: Gallbladder out yesterday. Right shoulder pain 6 of 10.", "  Not first: Referred gas pain after laparoscopy is expected.", "- Mrs. Bly, 66: Catheter out 6 hours ago. Hasn't voided. Bladder scan 450 mL.", "  Not first: Needs a straight cath soon. It can wait minutes; an airway can't.", "- Mr. Kahn, 38: Thyroidectomy yesterday. Tingling around his lips.", "  Not first: Possible low calcium: check a calcium soon. But noisy breathing right now is the airway.", "", "Why: Noisy breathing after neck surgery can be a hematoma or swelling closing the airway.", "Pearl: After neck surgery: stridor, hoarseness or swelling is an airway emergency. Shoulder pain after laparoscopy is expected gas."], "st": "awaiting"}, {"id": "drill:wf-heparin-bleed", "hash": "bd31e1d4b8", "title": "Telemetry, 02:00", "body": ["Who first?", "", "- Mr. Cole, 60: Cirrhosis. Abdomen tighter than yesterday, breathing comfortably.", "  Not first: More ascites to report, but he's breathing comfortably.", "✓ FIRST Mrs. Grant, 71: Heparin drip. New headache, now confused.", "- Mr. Ali, 57: On chemo. Vomited twice, nausea 7 of 10.", "  Not first: Give the PRN antiemetic soon; not a neuro emergency.", "- Ms. Park, 48: Can't sleep. Heart rate 108, says she can't stop worrying.", "  Not first: Worth assessing, but she's talking and stable.", "", "Why: A new headache and confusion on an anticoagulant could be bleeding in the brain.", "Pearl: Anticoagulant plus a new neuro change: stop the drip, neuro checks, call now."], "st": "awaiting"}, {"id": "drill:wf-rp-bleed", "hash": "aad28fa82f", "title": "Step-down, 18:00", "body": ["Who first?", "", "✓ FIRST Mr. Webb, 63: Femoral cath 3 hours ago. New back pain. HR 110, BP 98/60.", "- Mrs. Lowe, 79: Pacemaker placed today. Hiccups since the procedure.", "  Not first: Constant hiccups can mean the lead is pacing the diaphragm: report it. She's stable; hidden bleeding is first.", "- Mr. Diaz, 55: Ileus. NG output 900 mL since noon.", "  Not first: Replace the losses per orders and watch his potassium. Not as urgent as shock.", "- Ms. Moore, 61: Glucose 238 before dinner. Correction insulin due.", "  Not first: Correction insulin per the scale; not urgent.", "", "Why: Back or flank pain with a rising heart rate after a femoral procedure is a retroperitoneal bleed until proven otherwise. The groin can look fine.", "Pearl: Bleeding hides. Rising heart rate and falling pressure after a procedure: think blood loss."], "st": "awaiting"}, {"id": "drill:wf-dts", "hash": "095e229a64", "title": "Med-surg, 22:00", "body": ["Who first?", "", "✓ FIRST Mr. Tate, 52: Last drink 2 days ago. Sweating, shaking, HR 118. Says there are bugs on the wall.", "- Ms. Ortiz, 33: Depression. Says she's tired of living. No plan.", "  Not first: Needs a suicide risk assessment today. Untreated severe withdrawal can kill within hours.", "- Mr. Bloom, 47: Hears voices telling him to leave. Calm, in his room.", "  Not first: Assess the command voices soon; he's calm and safe right now.", "- Ms. Kay, 19: Anorexia, day 3 of refeeding. Phosphorus 2.4.", "  Not first: Just under normal: watch closely and report. She's stable now.", "", "Why: Hallucinations, tremor and a fast pulse two days after the last drink point to severe withdrawal. Delirium tremens can kill.", "Pearl: Alcohol withdrawal peaks at 24 to 72 hours. Score it (CIWA), treat it, and watch for seizures."], "st": "awaiting"}, {"id": "drill:wf-neutro", "hash": "c28dddd323", "title": "Oncology, 16:00", "body": ["Who first?", "", "✓ FIRST Mr. Shah, 58: ANC 300. Temp just came back 38.4.", "- Mrs. Kerr, 66: Mouth sores, pain 7 of 10, not drinking much.", "  Not first: Needs pain control and fluids, but not the one-hour clock of neutropenic fever.", "- Ms. Bell, 49: Platelets 18,000. A few new bruises.", "  Not first: Bleeding precautions and report, but no active bleeding.", "- Mr. Young, 70: Hemoglobin 7.8. Tired, vitals stable.", "  Not first: May need a transfusion today; stable.", "", "Why: Fever with neutropenia is an emergency. Without neutrophils, infection spreads fast; antibiotics are due within an hour.", "Pearl: Neutropenic fever: cultures and antibiotics within the hour. The conversation about hospice matters, and comes next."], "st": "awaiting"}, {"id": "drill:wf-ed-chest", "hash": "6dbabaf550", "title": "ED triage, 13:00", "body": ["Four people at the triage desk. Who goes back first?", "", "✓ FIRST Mr. Hayes, 54: Pressure in his chest for 30 minutes. Sweaty and pale.", "- Ms. Grant, 22: Ankle injury. Can't bear weight. Foot pink and warm.", "  Not first: Likely a fracture, but the foot is perfused.", "- Mrs. Lopez, 38: Burning urination and flank pain. Temp 38.4, HR 102.", "  Not first: Possible kidney infection: soon. Possible heart attack: now.", "- Mr. Byrd, 30: Deep hand laceration. Bleeding controlled with pressure.", "  Not first: Controlled bleeding can wait for the next bed.", "", "Why: Chest pressure with sweating and pallor is a heart attack until proven otherwise. He needs an ECG within 10 minutes of arrival.", "Pearl: ED chest pain: ECG within 10 minutes. Sweating, pallor and pressure are cardiac warning signs, even if the pain is \"only a 4.\""], "st": "awaiting"}, {"id": "drill:wf-ectopic", "hash": "d6d7156beb", "title": "ED, 21:00", "body": ["Who do you see first?", "", "✓ FIRST Ms. Kim, 26: Lower belly pain, period is 6 weeks late. Dizzy. Pain in her right shoulder.", "- Mr. Shaw, 41: Migraine like his usual ones. Pain 8, vomited once.", "  Not first: A familiar pattern; treat soon.", "- Ms. Fox, 33: Hives after a new antibiotic. Lips normal, breathing fine.", "  Not first: Watch for anaphylaxis, but no airway or circulation signs right now.", "- Mr. Okoro, 60: Ran out of blood pressure pills a week ago. BP 188/104. No headache or chest pain.", "  Not first: Very high, but no signs of organ damage: urgent, not an emergency.", "", "Why: A missed period, belly pain, dizziness and shoulder-tip pain point to a ruptured ectopic pregnancy bleeding into the abdomen.", "Pearl: Any person of childbearing age with belly pain gets a pregnancy test. Shoulder-tip pain plus dizziness can mean blood under the diaphragm."], "st": "awaiting"}, {"id": "drill:wf-cord", "hash": "2b054302d7", "title": "Labor and delivery, 03:00", "body": ["Who first?", "", "✓ FIRST Ms. Diaz, 28: Waters just broke. You see a loop of cord at the opening.", "- Mrs. Tran, 32: 7 cm, asking for her epidural. Fetal heart rate 140s, moderate variability.", "  Not first: A reassuring tracing. Her epidural can wait a few minutes.", "- Ms. Hall, 25: GBS positive. Antibiotic dose 30 minutes late.", "  Not first: Give it soon; a late dose isn't a baby losing oxygen.", "- Mrs. Abebe, 35: 1 hour after birth. Fundus firm. BP 152/96.", "  Not first: Recheck her pressure and symptoms soon. A cord prolapse is minutes.", "", "Why: A prolapsed cord can be squeezed shut by the baby's head, cutting off the baby's oxygen. Minutes count.", "Pearl: Cord prolapse: call for help, lift the presenting part off the cord with a gloved hand, knees-to-chest or Trendelenburg, and stay until delivery."], "st": "awaiting"}, {"id": "drill:wf-vent", "hash": "153c08d97f", "title": "ICU, 10:00", "body": ["Who first?", "", "✓ FIRST Mr. Ruiz, 58: On the ventilator. High-pressure alarm, SpO₂ 84% and falling.", "- Mrs. Kane, 70: Norepinephrine bag will be empty in about 15 minutes. MAP 68 and steady.", "  Not first: Get the next bag ready soon. A patient desaturating on the vent is happening now.", "- Mr. Bell, 66: Sedation pause in progress. Awake, following commands.", "  Not first: Expected during a pause; reassess for a breathing trial.", "- Mrs. Wu, 81: Urine output 25 mL/hr for the last 2 hours.", "  Not first: Low and needs reporting, but not seconds-to-minutes.", "", "Why: A high-pressure alarm with falling oxygen means something is blocking or fighting the airway: a plug, a kink, biting, or a collapsed lung. That's seconds to minutes.", "Pearl: Vent alarm plus falling SpO₂: look at the patient, not the screen. If you can't fix it fast, take them off the vent and bag them with 100% oxygen. Remember DOPE: displacement, obstruction, pneumothorax, equipment."], "st": "awaiting"}, {"id": "drill:wf-nms", "hash": "56b01e2deb", "title": "Adult psych, 14:00", "body": ["Who first?", "", "✓ FIRST Leon, 33: Started haloperidol 3 days ago. T 39.4, stiff arms, confused, sweating.", "- Maya, 24: Manic. Hasn't slept in two nights, pacing.", "  Not first: Needs sleep and limit-setting; not a medical emergency right now.", "- Gus, 58: Lithium level 1.4 this morning. Mild hand tremor.", "  Not first: Slightly high: hold and report. Not as urgent as NMS.", "- Rina, 41: On clozapine for two months. Drooling at night. Bowel movement yesterday, eating well.", "  Not first: Expected clozapine side effect; stable.", "", "Why: Fever, rigid muscles and confusion after starting an antipsychotic point to neuroleptic malignant syndrome. It can kill through high fever, kidney failure and unstable vital signs.", "Pearl: NMS: fever, \"lead-pipe\" rigidity, confusion, unstable vitals. Stop the antipsychotic, cool, fluids, and get a medical team now. Check a CK."], "st": "awaiting"}, {"id": "drill:wf-peds-edema", "hash": "d7a87ea6ed", "title": "Pediatrics, 23:00", "body": ["Who first?", "", "✓ FIRST Ella, 13: DKA, on her insulin drip. New headache, heart rate dropped from 110 to 58, now confused.", "- Omar, 4: Ear infection. Temp 39.5, crying but consolable.", "  Not first: Fever to treat; consolable and stable.", "- Lily, 10: Asthma. SpO₂ 93%, mild wheeze, talking in sentences.", "  Not first: Mild: nebulizer per orders. A neuro decline in DKA comes first.", "- Baby Cole, 2 days: 2 days old. Jaundice to the belly. Feeding every 3 hours.", "  Not first: Needs a bilirubin check today; not first.", "", "Why: A headache, falling heart rate and new confusion during DKA treatment in a child suggest cerebral edema, the leading cause of death in pediatric DKA.", "Pearl: Kids in DKA: neuro checks hourly. Headache, slowing heart rate, rising blood pressure or confusion: call now. Treatment can't wait for a scan."], "st": "awaiting"}]}, "packs": [{"id": "drill-med-1", "title": "Drills: Med Pass, part 1 of 2", "sub": "What to check before a medication, then give, hold or call. A pharmacist is especially welcome.", "n": 25, "reviewed": 0, "changed": 0}, {"id": "drill-med-2", "title": "Drills: Med Pass, part 2 of 2", "sub": "What to check before a medication, then give, hold or call. A pharmacist is especially welcome.", "n": 25, "reviewed": 0, "changed": 0}, {"id": "drill-first-1", "title": "Drills: Who's First, part 1 of 2", "sub": "Four patients, one nurse: who do you see first, and why not the others.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "drill-first-2", "title": "Drills: Who's First, part 2 of 2", "sub": "Four patients, one nurse: who do you see first, and why not the others.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "drill-sbar", "title": "Drills: SBAR", "sub": "Building a call to the provider line by line, and the order that comes back.", "n": 20, "reviewed": 0, "changed": 0}, {"id": "drill-calm", "title": "Drills: De-escalation", "sub": "What to say to an agitated patient, turn by turn. Psych or ED experience fits best.", "n": 22, "reviewed": 0, "changed": 0}, {"id": "ngn-shift-1", "title": "NCLEX questions after each shift, part 1 of 3", "sub": "Five per shift, including the two harder NCLEX challenge items.", "n": 19, "reviewed": 0, "changed": 0}, {"id": "ngn-shift-2", "title": "NCLEX questions after each shift, part 2 of 3", "sub": "Five per shift, including the two harder NCLEX challenge items.", "n": 19, "reviewed": 0, "changed": 0}, {"id": "ngn-shift-3", "title": "NCLEX questions after each shift, part 3 of 3", "sub": "Five per shift, including the two harder NCLEX challenge items.", "n": 17, "reviewed": 0, "changed": 0}, {"id": "bank-ms-1", "title": "NCLEX question bank: Medical-surgical, part 1 of 3", "sub": "68 standalone practice questions.", "n": 23, "reviewed": 0, "changed": 0}, {"id": "bank-ms-2", "title": "NCLEX question bank: Medical-surgical, part 2 of 3", "sub": "68 standalone practice questions.", "n": 23, "reviewed": 0, "changed": 0}, {"id": "bank-ms-3", "title": "NCLEX question bank: Medical-surgical, part 3 of 3", "sub": "68 standalone practice questions.", "n": 22, "reviewed": 0, "changed": 0}, {"id": "bank-ed", "title": "NCLEX question bank: Emergency", "sub": "23 standalone practice questions.", "n": 23, "reviewed": 0, "changed": 0}, {"id": "bank-comm", "title": "NCLEX question bank: Community and fundamentals", "sub": "21 standalone practice questions.", "n": 21, "reviewed": 0, "changed": 0}, {"id": "bank-icu", "title": "NCLEX question bank: Critical care", "sub": "21 standalone practice questions.", "n": 21, "reviewed": 0, "changed": 0}, {"id": "bank-sd", "title": "NCLEX question bank: Cardiac and step-down", "sub": "19 standalone practice questions.", "n": 19, "reviewed": 0, "changed": 0}, {"id": "bank-peds", "title": "NCLEX question bank: Pediatrics", "sub": "17 standalone practice questions.", "n": 17, "reviewed": 0, "changed": 0}, {"id": "bank-ob", "title": "NCLEX question bank: Obstetrics and newborn", "sub": "15 standalone practice questions.", "n": 15, "reviewed": 0, "changed": 0}, {"id": "bank-psy", "title": "NCLEX question bank: Psychiatric", "sub": "11 standalone practice questions.", "n": 11, "reviewed": 0, "changed": 0}, {"id": "bank-periop", "title": "NCLEX question bank: Perioperative", "sub": "7 standalone practice questions.", "n": 7, "reviewed": 0, "changed": 0}, {"id": "cases-1", "title": "Case studies: Pneumonia that turns septic; Heart failure that tips over; New diabetes in DKA", "sub": "Unfolding case studies: one client, six questions in clinical judgment order.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "cases-2", "title": "Case studies: Hip replacement with a clot that travels; Variceal bleed in cirrhosis; Stroke alert in the ED", "sub": "Unfolding case studies: one client, six questions in clinical judgment order.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "cases-3", "title": "Case studies: Preeclampsia that turns severe; Infant with gastroenteritis and dehydration; House fire with inhalation injury", "sub": "Unfolding case studies: one client, six questions in clinical judgment order.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "cases-4", "title": "Case studies: Ankle fracture that turns into alcohol withdrawal; Stomach bug that ends in hyperkalemia; New antibiotic that triggers serotonin syndrome", "sub": "Unfolding case studies: one client, six questions in clinical judgment order.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "cases-5", "title": "Case studies: COPD flare with pneumonia; Bleeding after a hysterectomy; Head injury after a motorcycle crash", "sub": "Unfolding case studies: one client, six questions in clinical judgment order.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "cases-6", "title": "Case studies: Placental abruption at 34 weeks; Preterm labor at 31 weeks; Bacterial meningitis in a preschooler", "sub": "Unfolding case studies: one client, six questions in clinical judgment order.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "cases-7", "title": "Case studies: Fever and rigidity on haloperidol", "sub": "Unfolding case studies: one client, six questions in clinical judgment order.", "n": 6, "reviewed": 0, "changed": 0}]};</script><script>(()=>{const v=window.Shift||{},d=v.tel,h=window.RI||{packs:[]},p=document.getElementById("app"),i=e=>String(e??"").replace(/[&<>"']/g,a=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[a]),k={awaiting:"Awaiting clinical review",reviewed:"Clinically reviewed",changed:"Changed since its review"},f=e=>(e.reviewed===e.n?'<span class="chip reviewed">Clinically reviewed</span>':`<span class="chip awaiting">${e.reviewed} of ${e.n} reviewed</span>`)+(e.changed?` <span class="chip changed">${e.changed} changed since review</span>`:"");if(!h.pack){const e=[["Drills",a=>a.id.startsWith("drill-")],["NCLEX questions after each shift",a=>a.id.startsWith("ngn-shift")],["NCLEX question bank",a=>a.id.startsWith("bank-")],["Unfolding case studies",a=>a.id.startsWith("cases-")]];p.innerHTML=`<a class="home" href="/">The Shift</a><h1>Clinical review: practice content</h1>
      <p class="muted">The drills and NCLEX practice questions, split into packs a clinician can check in one sitting (about 30 to 45 minutes each). Each item shows the right answer and why every other option is wrong. Pick a pack that matches your experience.</p>
      <p><a href="/review/">Reviewing a whole shift instead? Shift reviews are here.</a></p>
      ${e.map(([a,s])=>{const o=h.packs.filter(s);return o.length?`<h2>${i(a)}</h2><div class="shifts">${o.map(c=>`<a href="/review/practice/${i(c.id)}/"><div class="card"><div style="display:flex;justify-content:space-between;gap:.6rem;flex-wrap:wrap"><h3>${i(c.title)}</h3><span>${f(c)}</span></div><p class="muted" style="margin:.3rem 0 0">${c.n} items. ${i(c.sub)}</p></div></a>`).join("")}</div>`:""}).join("")}`;return}const n=h.pack,g="theshift.review.items."+n.id;let t={};try{t=JSON.parse(localStorage.getItem(g)||"{}")||{}}catch{t={}}t.marks=t.marks||{},t.notes=t.notes||{};const m=()=>{try{localStorage.setItem(g,JSON.stringify(t))}catch{}},E=e=>e?/^  /.test(e)?`<p class="why">${i(e.trim())}</p>`:/^✓/.test(e)?`<p class="ok"><b>${i(e)}</b></p>`:/^(- ✗|- |✗)/.test(e)?`<p class="no">${i(e.replace(/^- /,""))}</p>`:`<p>${i(e)}</p>`:'<div class="sp"></div>',x=e=>`<div class="verdict" role="group" aria-label="Your verdict">${[["ok","Accurate"],["fix","Needs change"],["unsure","Not sure"]].map(([a,s])=>`<button type="button" data-rid="${i(e)}" data-v="${a}" aria-pressed="${t.marks[e]===a}">${s}</button>`).join("")}</div>
    <textarea data-note="${i(e)}" placeholder="What should it say instead? A source helps." ${t.marks[e]==="fix"||t.notes[e]?"":"hidden"} aria-label="Your comment">${i(t.notes[e]||"")}</textarea>`,S=(e,a)=>`<div class="dec item" id="i-${a+1}"><div class="top"><span class="pts">${a+1}</span><span class="chip ${e.st}">${i(k[e.st])}${e.by?`: ${i(e.by)}`:""}</span><span>${i(e.id)} · version ${i(e.hash)}</span></div>
      <b>${i(e.title)}</b><div class="body">${e.body.map(E).join("")}</div>${x(e.id)}</div>`,r=n.items.map(e=>e.id);p.innerHTML=`<a class="home" href="/review/practice/">The Shift · Practice review</a>
    <h1>${i(n.title)}</h1>
    <p class="muted" style="margin:0">${i(n.sub)}</p>
    <div class="meta">${f(h.packs.find(e=>e.id===n.id)||{n:r.length,reviewed:0,changed:0})}<span class="chip">${r.length} items</span></div>
    <div class="card how"><h3>How to review</h3><ol>
      <li>For each item, check that the marked answer is right, that every other option is clearly wrong (not just slightly less good), that the numbers are current, and that any tip is safe to remember as a rule.</li>
      <li>Mark <b>Accurate</b>, <b>Needs change</b> or <b>Not sure</b>. Say what's wrong when something needs changing.</li>
      <li>Add your details and any references, then send. Your answers save in this browser as you go, so you can stop and come back.</li></ol>
      <p class="muted" style="margin-bottom:0">These are practice items for nursing students, written to common US teaching. Judge them against what a safe, current standard of care would teach a new nurse, not your facility's policy.</p></div>
    <div class="bar"><span id="count"></span><span class="prog" aria-hidden="true"><i id="progbar"></i></span><a class="btn" href="#send" style="min-height:38px">Send</a></div>
    <h2>About you</h2>
    <div class="grid2"><div><label for="rv-name">Name</label><input id="rv-name" type="text" autocomplete="name" data-f="name" value="${i(t.name||"")}"></div>
      <div><label for="rv-cred">Credentials</label><input id="rv-cred" type="text" placeholder="RN, MSN, PharmD…" data-f="cred" value="${i(t.cred||"")}"></div>
      <div><label for="rv-role">Current role and specialty</label><input id="rv-role" type="text" placeholder="Med-surg RN, 6 years; nurse educator…" data-f="role" value="${i(t.role||"")}"></div>
      <div><label for="rv-email">Email</label><input id="rv-email" type="email" autocomplete="email" data-f="email" value="${i(t.email||"")}"></div></div>
    <h2>Items</h2>${n.items.map(S).join("")}
    <h2 id="send">Send your review</h2>
    <label for="rv-refs">References you'd cite</label><textarea id="rv-refs" data-f="refs" placeholder="Guidelines, drug references or textbooks that support or contradict the content">${i(t.refs||"")}</textarea>
    <label for="rv-overall">Anything else</label><textarea id="rv-overall" data-f="overall" placeholder="Patterns you noticed, items a new grad would find unfair, anything missing">${i(t.overall||"")}</textarea>
