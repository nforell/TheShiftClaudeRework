<style>
:root{--bg:#E6EDF0;--surface:#FBFCFC;--surface-2:#EDF2F4;--ink:#152238;--ink-2:#4D5A6F;--line:#CAD5DB;--teal:#2449A8;--teal-ink:#fff;--red:#B3342B;--red-bg:#F8E1DE;--good:#2B7249;--good-bg:#E0F0E6;--amber:#A96C0E;--amber-bg:#FBEFD6;
  --serif:"Barlow Condensed","Arial Narrow",sans-serif;--sans:"Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161C;--surface:#1A1F27;--surface-2:#212833;--ink:#E7E4DB;--ink-2:#A0A5AE;--line:#343C48;--teal:#93B4E4;--teal-ink:#0F1B2C;--red:#F0766B;--red-bg:#3b1d1b;--good:#72c692;--good-bg:#16301f;--amber:#E9AE4E;--amber-bg:#35291a}}
:root[data-theme="dark"]{--bg:#12161C;--surface:#1A1F27;--surface-2:#212833;--ink:#E7E4DB;--ink-2:#A0A5AE;--line:#343C48;--teal:#93B4E4;--teal-ink:#0F1B2C;--red:#F0766B;--red-bg:#3b1d1b;--good:#72c692;--good-bg:#16301f;--amber:#E9AE4E;--amber-bg:#35291a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
main{max-width:52rem;margin:0 auto;padding:clamp(1.2rem,5vw,3rem) 16px calc(5rem + env(safe-area-inset-bottom))}
a{color:var(--teal)}
.home{font-family:var(--serif);font-weight:700;font-size:1.1rem;letter-spacing:.04em;text-transform:uppercase;background:var(--ink);color:var(--bg);padding:.28em .55em .22em;border-radius:2px;text-decoration:none}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.9rem,6vw,2.6rem);line-height:1.1;letter-spacing:0;margin:1.6rem 0 .3rem}
h2{font-size:1.15rem;margin:2.4rem 0 .6rem}
h3{font-size:1rem;margin:0}
p{margin:.5rem 0}
.muted{color:var(--ink-2)}
.meta{display:flex;flex-wrap:wrap;gap:.4rem .6rem;margin-top:.6rem}
.chip{display:inline-flex;align-items:center;padding:.15em .6em;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--surface-2);border:1px solid var(--line)}
.chip.awaiting{background:var(--amber-bg);border-color:transparent;color:var(--amber)}
.chip.reviewed{background:var(--good-bg);border-color:transparent;color:var(--good)}
.chip.changed{background:var(--red-bg);border-color:transparent;color:var(--red)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem 1.1rem;margin:.8rem 0}
.how ol{margin:.4rem 0 0;padding-left:1.2rem}.how li{margin:.2rem 0}
label{display:block;font-weight:600;font-size:.9rem;margin:.7rem 0 .25rem}
input[type=text],input[type=email],textarea,select{width:100%;min-height:44px;padding:.5em .7em;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:5rem;resize:vertical}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:0 1rem}
details.pt{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:.6rem 0}
details.pt>summary{cursor:pointer;padding:.85rem 1rem;font-weight:600;list-style-position:inside}
details.pt>div{padding:0 1rem 1rem}
table{width:100%;border-collapse:collapse;font-size:.88rem;margin:.4rem 0}
th,td{text-align:left;vertical-align:top;padding:.35rem .5rem .35rem 0;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--ink-2);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
.scroll{overflow-x:auto}
ul.plain{margin:.3rem 0;padding-left:1.1rem}
.dec{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:.85rem 1rem;margin:.6rem 0}
.dec.pos{border-left-color:var(--good)}.dec.neg{border-left-color:var(--red)}
.dec .top{display:flex;flex-wrap:wrap;gap:.3rem .5rem;align-items:center;font-size:.78rem;color:var(--ink-2);font-weight:600}
.pts{font-weight:700;padding:.05em .45em;border-radius:4px;background:var(--surface-2)}
.pos .pts{color:var(--good);background:var(--good-bg)}.neg .pts{color:var(--red);background:var(--red-bg)}
.dec b{display:block;margin:.35rem 0 .15rem;font-size:1rem}
.dec .why{font-family:var(--sans);color:var(--ink-2);margin:0}
.dec .src{font-size:.75rem;color:var(--ink-2);margin-top:.35rem}
.verdict{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.7rem}
.verdict button{min-height:40px;padding:.35em .9em;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer}
.verdict button[aria-pressed="true"][data-v="ok"]{background:var(--good);border-color:var(--good);color:var(--teal-ink)}
.verdict button[aria-pressed="true"][data-v="fix"]{background:var(--red);border-color:var(--red);color:var(--teal-ink)}
.verdict button[aria-pressed="true"][data-v="unsure"]{background:var(--amber);border-color:var(--amber);color:var(--teal-ink)}
.dec textarea{margin-top:.5rem;min-height:3.6rem}
.opt{padding:.4rem 0;border-bottom:1px solid var(--line);font-size:.92rem}.opt:last-child{border:0}
.opt i{font-style:normal;font-weight:700;font-size:.75rem;padding:.05em .4em;border-radius:4px;margin-right:.4rem;background:var(--surface-2)}
.bar{position:sticky;top:0;z-index:5;margin:0 -16px;padding:.6rem 16px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:.6rem;font-size:.9rem}
.bar .prog{display:block;flex:1;min-width:4rem;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;max-width:12rem}.bar .prog i{display:block;height:100%;background:var(--teal)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:.55em 1.2em;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn-primary{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.row{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1rem}
.check{display:flex;gap:.6rem;align-items:flex-start;font-weight:500;margin-top:1rem}
.check input{width:1.2rem;height:1.2rem;margin-top:.2rem;flex:none}
.msg{margin-top:.8rem;font-weight:600}.msg.err{color:var(--red)}.msg.ok{color:var(--good)}
pre{white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:.8rem;font-size:.8rem;max-height:18rem;overflow:auto}
.shifts a{display:block;text-decoration:none;color:inherit}
.shifts .card:hover{border-color:var(--ink-2)}
</style>
<style>.item .body p{margin:.15rem 0}.item .body .why{color:var(--ink-2);font-size:.92rem;margin:0 0 .35rem 1.1rem}.item .body .ok b{display:inline;margin:0;color:var(--good)}.item .body .no{color:var(--ink)}.item .body .sp{height:.5rem}.item>b{margin-bottom:.5rem}</style></head>

m.", "- Give scheduled oral ibuprofen to a stable client on postpartum day 1 → LPN", "  giving oral medications to a stable client is within LPN scope; UAP cannot give medications.", "- Reinforce the perineal care teaching the RN gave earlier → LPN", "  the LPN may reinforce teaching the RN has already done. Initial teaching would stay with the RN.", "- Admit a client just transferred from labor and delivery after a cesarean birth → RN", "  a fresh post-op client is unstable and needs an RN admission assessment of fundus, bleeding, incision and vital signs.", "- Evaluate a client who reports soaking a pad in 30 minutes → RN", "  possible postpartum hemorrhage needs immediate RN assessment and judgment. The trap is sending the UAP to weigh the pad first.", "", "Why: Match each task to the lowest level of staff who can do it safely. UAP handle routine care for stable clients, the LPN gives medications and reinforces teaching for stable clients, and the RN keeps admissions, assessments of change and anything requiring judgment. Bleeding concerns after birth are always an RN assessment.", "Tip: First pull out anything involving assessment, new admission or a possible complication for the RN, then sort the remaining tasks by whether a license is required."], "st": "awaiting"}, {"id": "ngn:qb-hp-4", "hash": "a56978bd94", "title": "Prenatal danger signs · Evaluate outcomes", "body": ["A 26-year-old, G1P0, at 30 weeks' gestation is seen in the prenatal clinic. Her pregnancy has been uncomplicated, BP 116/72. The nurse has just taught her the warning signs to report before her next visit.", "", "Which statements by the client indicate understanding of the teaching? Select all that apply.", "", "- \"A little bright red bleeding is normal now, so I can wait until my next appointment.\"", "  No: vaginal bleeding in the third trimester may mean placenta previa or abruption and must be reported immediately.", "✓ \"Fluid leaking or gushing from my vagina is a reason to call, even without contractions.\"", "  Yes: this may be preterm rupture of membranes, which raises the risk of infection and preterm birth.", "✓ \"I'll call if I get a headache that doesn't go away with acetaminophen or if I see spots.\"", "  Yes: persistent headache and visual changes can signal preeclampsia with severe features and need prompt evaluation.", "✓ \"Tightening every 10 minutes or more often for an hour means I need to be checked.\"", "  Yes: regular contractions before 37 weeks may be preterm labor, which can sometimes be slowed if caught early.", "✓ \"If the baby is moving less than usual, I'll call right away instead of waiting for my next visit.\"", "  Yes: decreased fetal movement can be an early sign of fetal compromise and needs same-day assessment.", "- \"Swelling in my ankles at the end of the day means I should go to the hospital.\"", "  No: dependent ankle edema that improves with rest is common late in pregnancy. Swelling of the face or hands is the concern.", "- \"I should rest flat on my back so more blood flows to the baby.\"", "  No: lying supine lets the uterus compress the vena cava and can lower blood flow to the placenta. Side-lying is preferred.", "", "Why: Prenatal teaching focuses on signs of preeclampsia, preterm labor, rupture of membranes, bleeding and fetal compromise. Dependent ankle edema is a common discomfort, while bleeding is never normal late in pregnancy. Lying on the back can reduce placental blood flow.", "Tip: Sort each statement into common discomfort or warning sign; anything involving bleeding, fluid, vision, headache or fetal movement belongs in warning signs."], "st": "awaiting"}, {"id": "ngn:qb-hp-5", "hash": "5c122aac46", "title": "Postpartum fundal assessment · Prioritize hypotheses", "body": ["A 29-year-old, G2P2, gave birth vaginally 4 hours ago. During the postpartum assessment, the fundus is boggy, 2 cm above the umbilicus and deviated to the right. Lochia rubra is moderate, up from scant an hour ago. A rounded swelling is felt above the symphysis pubis. She has not voided since the birth. BP 118/72, HR 84.", "", "Complete the diagram: the condition the client is most likely experiencing, two actions the nurse should take, and two parameters to monitor.", "", "Condition:", "✓ Bladder distention displacing the uterus", "  Yes: a full bladder pushes the uterus up and to the side and keeps it from contracting, which explains the boggy, displaced fundus and increasing lochia.", "- Retained placental fragments", "  No: retained fragments cause a boggy uterus and bleeding, but they do not explain the displaced fundus and the full bladder.", "- Postpartum preeclampsia", "  No: preeclampsia causes elevated blood pressure, headache or visual changes, and her BP is normal.", "- Normal uterine involution", "  No: normally the fundus is firm and midline at or near the umbilicus after birth; boggy and deviated is not normal.", "Actions to take:", "✓ Massage fundus until firm", "  Yes: massaging a boggy fundus stimulates the uterus to contract and compress open blood vessels at the placental site.", "✓ Assist to void or straight-cath as ordered", "  Yes: emptying the bladder lets the uterus return to midline and contract; it is the fix for the underlying cause.", "- Administer methylergonovine IM before checking bladder", "  No: a uterotonic is not the first step when a full bladder is the cause, and it needs an order based on ongoing atony.", "- Place her flat in full Trendelenburg position now", "  No: Trendelenburg is not used for postpartum bleeding and does not address the full bladder.", "- Wait to check her bladder until the next scheduled round", "  No: delaying voiding keeps the uterus displaced and boggy and increases the risk of postpartum hemorrhage.", "Parameters to monitor:", "✓ Fundal tone and position", "  Yes: a firm, midline fundus at or below the umbilicus after voiding confirms the bladder was the cause.", "✓ Quantitative blood loss", "  Yes: lochia that returns to a small to moderate amount shows bleeding is controlled; heavy flow needs escalation.", "- Patellar deep tendon reflexes", "  No: reflexes are monitored for magnesium therapy or preeclampsia, not for a displaced uterus.", "- Breast fullness and tenderness", "  No: breast fullness is part of the postpartum assessment but does not show whether this problem is resolving.", "- Capillary fingerstick blood glucose", "  No: glucose is not affected by bladder distention and does not reflect uterine tone or bleeding.", "", "Why: A fundus that is boggy, high and deviated to one side with a palpable bladder points to bladder distention, a common and preventable cause of uterine atony and bleeding. The nurse massages the fundus and helps the client empty her bladder. The fundus and lochia are then reassessed using the BUBBLE-HE approach.", "Tip: A fundus deviated to the side is a full bladder until proven otherwise; fix the cause before reaching for medications."], "st": "awaiting"}, {"id": "ngn:qb-hp-6", "hash": "9beac2d0cc", "title": "Fetal heart rate decelerations · Analyze cues", "body": ["A labor and delivery nurse is reviewing fetal heart rate tracing patterns with a nursing student. The client is a 31-year-old, G2P1, at 39 weeks in active labor with continuous electronic fetal monitoring.", "", "For each description, indicate the type of deceleration it represents.", "", "- Gradual decrease that begins with the contraction, with its lowest point at the peak of the contraction → Early deceleration", "  early decelerations mirror the contraction, starting, peaking and ending with it.", "- Abrupt, V-shaped drop that varies in timing from one contraction to the next → Variable deceleration", "  variable decelerations fall abruptly and their timing is unrelated to the shape of the contraction.", "- Gradual decrease with its lowest point after the peak of the contraction, returning to baseline after the contraction ends → Late deceleration", "  late decelerations are offset from the contraction, lagging behind it from start to finish.", "- Caused by compression of the fetal head during descent → Early deceleration", "  head compression triggers a vagal response; early decelerations are benign and need no intervention.", "- Caused by compression of the umbilical cord → Variable deceleration", "  cord compression briefly cuts off blood flow, producing the sudden drop seen in variable decelerations.", "- Caused by uteroplacental insufficiency → Late deceleration", "  reduced blood flow through the placenta during contractions lowers fetal oxygen and causes late decelerations.", "", "Why: Decelerations are classified by their shape and their timing relative to contractions. Early decelerations mirror the contraction and come from head compression. Variable decelerations are abrupt and come from cord compression. Late decelerations follow the contraction and signal uteroplacental insufficiency, which needs prompt intervention.", "Tip: Use VEAL CHOP: variable is cord, early is head, accelerations are okay, late is placenta."], "st": "awaiting"}, {"id": "ngn:qb-hp-7", "hash": "2c8a453960", "title": "Late deceleration response · Take action", "body": ["A 33-year-old, G1P0, at 40 weeks is 6 cm dilated and receiving an oxytocin infusion. Contractions are every 2 minutes, lasting 70 seconds. For the past 30 minutes the fetal heart rate tracing shows recurrent late decelerations with minimal variability. BP 102/60, HR 92.", "", "Which actions should the nurse take? Select all that apply.", "", "✓ Turn the client onto her side", "  Yes: a lateral position takes pressure off the vena cava and improves blood return and placental perfusion.", "- Increase the oxytocin to speed delivery", "  No: more oxytocin means more frequent contractions and less oxygen to the fetus. The trap is thinking faster birth helps.", "- Place the client supine with her legs elevated", "  No: supine positioning compresses the vena cava, lowering cardiac output and placental blood flow even further.", "- Continue to observe and document at the next routine check", "  No: recurrent late decelerations require immediate intrauterine resuscitation, not watchful waiting.", "✓ Notify the provider of the tracing", "  Yes: recurrent late decelerations with minimal variability suggest fetal compromise and need provider evaluation and a plan.", "✓ Stop the oxytocin infusion", "  Yes: oxytocin increases contraction frequency and strength, which further cuts placental blood flow. Stopping it gives the fetus more recovery time between contractions.", "✓ Give an IV fluid bolus as ordered", "  Yes: increasing circulating volume raises maternal blood pressure and improves blood flow to the placenta, especially with a soft BP.", "", "Why: Recurrent late decelerations reflect uteroplacental insufficiency. Intrauterine resuscitation aims to improve blood flow to the placenta: stop oxytocin, reposition to the side, correct hypotension with IV fluids and notify the provider. The nurse then evaluates the tracing to see whether the decelerations resolve.", "Tip: For late decelerations, choose actions that increase blood flow to the placenta and remove anything that adds uterine stress."], "st": "awaiting"}, {"id": "ngn:qb-hp-9", "hash": "2a09aafa7c", "title": "Newborn vitamin K and eye prophylaxis · Evaluate outcomes", "body": ["A 31-year-old gave birth to a healthy term newborn 1 hour ago and plans to breastfeed exclusively. The nurse has taught her about the vitamin K injection and erythromycin eye ointment ordered for the newborn.", "", "Which statement by the parent indicates understanding of the teaching?", "", "- \"Since I'm breastfeeding, my milk will give the baby all the vitamin K he needs for clotting.\"", "  No: breast milk is low in vitamin K, so exclusively breastfed infants are at higher risk of bleeding without the injection.", "✓ \"The vitamin K shot helps my baby's blood clot, because babies are born with low levels.\"", "  Yes: newborns have little vitamin K and lack the gut bacteria that make it, so a single dose prevents vitamin K deficiency bleeding.", "- \"Vitamin K is only needed if my baby has a circumcision.\"", "  No: vitamin K deficiency bleeding can occur in the brain or gut without any procedure, so every newborn should receive it.", "- \"The eye ointment is given to prevent jaundice.\"", "  No: erythromycin eye ointment prevents gonococcal eye infection acquired during birth. It has no effect on jaundice.", "", "Why: Newborns are born with low vitamin K and a sterile gut, so they cannot make enough clotting factors at first. A single IM dose prevents vitamin K deficiency bleeding, which can cause brain hemorrhage, and it matters most for breastfed infants. Erythromycin eye ointment prevents gonococcal ophthalmia neonatorum.", "Tip: On teaching questions, the correct statement usually gives the accurate reason for the treatment, not a limiting condition or a mixed-up purpose."], "st": "awaiting"}, {"id": "ngn:qb-pharm-7", "hash": "ea4503b065", "title": "IV push volume · Take action", "body": ["A 31-year-old at 36 weeks with preeclampsia has BP 166/112 on two readings 15 minutes apart. The provider orders labetalol 20 mg IV push over 2 minutes. The vial is labeled labetalol 5 mg/mL.", "", "How many mL should the nurse draw up?", "", "Answer: 4 mL. Round to the nearest tenth.", "  Desired ÷ have × quantity = 20 mg ÷ 5 mg × 1 mL", "  = 4 mL, given slowly over 2 minutes", "", "Why: Desired over have times volume gives the IV push amount. Labetalol is a first-line drug for severe hypertension in pregnancy; it is avoided in clients with asthma, and blood pressure and heart rate are rechecked after each dose.", "Tip: Estimate first: each mL holds 5 mg, so 20 mg must be 4 mL; if your answer is far from the estimate, recheck the setup."], "st": "awaiting"}, {"id": "ngn:qb-pharm-20", "hash": "552a8c5d7a", "title": "Blood transfusion safety · Generate solutions", "body": ["A 29-year-old had a postpartum hemorrhage after a vaginal birth. Hemoglobin is 6.8 g/dL. She has consented to 2 units of packed red blood cells. Lactated Ringer's with oxytocin is infusing through her 18-gauge IV.", "", "Which actions should the nurse include in the plan for the transfusion? Select all that apply.", "", "✓ Complete each unit within 4 hours of leaving the blood bank", "  Yes: After 4 hours at room temperature, bacterial growth in the unit becomes a risk.", "✓ Prime a filtered blood administration set with 0.9% sodium chloride only", "  Yes: Normal saline is the only solution compatible with red cells; the filter removes clots and debris.", "- Warm the blood in a microwave if she feels cold", "  No: Microwaving damages red cells and causes hemolysis. Only an approved blood warmer is used.", "✓ Take baseline vital signs and stay with the client for the first 15 minutes", "  Yes: Most severe reactions begin early, so close observation and a slow start during the first 15 minutes are standard.", "- Prime the tubing with D5W", "  No: Dextrose solutions make red cells swell and break apart.", "✓ Verify the client and the blood unit at the bedside with a second qualified licensed staff member using two identifiers", "  Yes: Bedside two-person verification is the key safeguard against giving the wrong blood, the main cause of acute hemolytic reactions.", "- Run the blood through the lactated Ringer's line to save time", "  No: The calcium in lactated Ringer's can clot the blood in the tubing; use saline only.", "", "Why: Safe transfusion depends on correct identification, the right tubing and solution, and close early monitoring. Blood is given only with 0.9% sodium chloride, through a filter, within 4 hours, with the nurse watching the client closely during the first 15 minutes.", "Tip: For blood questions, remember: two people, two identifiers, saline only, stay 15 minutes, finish in 4 hours."], "st": "awaiting"}, {"id": "ngn:qb-basic-6", "hash": "8f9a861f86", "title": "Postpartum urinary retention · Analyze cues", "body": ["A 29-year-old is 7 hours postpartum after a vaginal birth with epidural anesthesia. Since the birth she has voided twice, 40 mL and 50 mL. She says she still feels like she needs to go.", "", "Which findings are consistent with urinary retention? Select all that apply.", "", "✓ Palpable fullness above the symphysis pubis", "  Yes: A distended bladder rises above the pubic bone and can be felt on palpation.", "- Breasts soft with colostrum expressible", "  No: This is a normal early postpartum breast finding unrelated to bladder emptying.", "✓ Small, frequent voids of 40 to 50 mL", "  Yes: Repeated small voids suggest overflow from a full bladder. The trap is reading any voiding as adequate emptying.", "✓ Bladder scan volume of 700 mL", "  Yes: This volume after small voids shows she is not emptying her bladder.", "- Lochia rubra, moderate amount", "  No: Moderate red lochia is expected in the first days after birth.", "- BP 118/72, HR 78", "  No: These vital signs are normal and do not point to retention.", "✓ Fundus 2 cm above the umbilicus and displaced to the right", "  Yes: A full bladder pushes the uterus up and to one side, which also keeps it from contracting well.", "", "Why: Epidural anesthesia, birth trauma and perineal swelling put postpartum clients at risk for urinary retention. A high, displaced fundus, suprapubic fullness, small frequent voids and a large bladder scan volume all point to retention. A full bladder also raises the risk of postpartum hemorrhage by keeping the uterus from contracting.", "Tip: In postpartum items, a fundus that is high and off to one side should make you think of the bladder first."], "st": "awaiting"}, {"id": "ngn:qb-phys-18", "hash": "4e52b4f8c4", "title": "Anaphylaxis · Take action", "body": ["A 31-year-old who is 2 days postpartum is receiving her first dose of IV ampicillin for endometritis. Ten minutes into the infusion she says her throat feels tight. She has hives on her chest, audible stridor and BP 84/48, HR 128. The nurse has stopped the infusion and called the rapid response team.", "", "Which action should the nurse take next?", "", "✓ Give epinephrine 0.5 mg IM into the mid-outer thigh as ordered", "  Yes: IM epinephrine is the first-line treatment for anaphylaxis; it reverses airway swelling, bronchospasm and vasodilation within minutes.", "- Give methylprednisolone IV as ordered", "  No: corticosteroids take hours to work and are an adjunct; they do not reverse the immediate threat.", "- Give diphenhydramine IV as ordered", "  No: antihistamines help hives and itching but do not treat airway swelling or shock. The trap is choosing the familiar allergy drug first.", "- Give albuterol by nebulizer", "  No: albuterol may help residual wheezing but does not treat upper airway swelling or hypotension.", "", "Why: Anaphylaxis with stridor and hypotension is life threatening. After stopping the trigger and calling for help, IM epinephrine in the thigh is the priority because it treats every dangerous part of the reaction. Antihistamines, steroids and bronchodilators are adjuncts that follow.", "Tip: In anaphylaxis, choose epinephrine over any adjunct drug; it is the only one that treats the airway and the blood pressure."], "st": "awaiting"}, {"id": "ngn:qb-psy-3", "hash": "0b9978c4e2", "title": "Intimate partner violence screening · Take action", "body": ["A 26-year-old at 24 weeks of pregnancy comes to the prenatal clinic with her partner, who answers most of the nurse's questions for her. She has missed two appointments. The nurse notes bruises in different stages of healing on both upper arms.", "", "Which action should the nurse take first?", "", "- Tell her she needs to leave the relationship for the baby's safety", "  No: leaving is the most dangerous time, and the decision belongs to her. The nurse supports her and helps with a safety plan.", "✓ Ask the partner to step out for part of the visit, then ask her privately about her safety at home", "  Yes: screening for abuse must be done in private. Many clinics routinely see clients alone for part of each visit, which avoids alerting the partner.", "- Ask both of them how she got the bruises on her arms", "  No: asking in front of a possible abuser is unsafe and unlikely to get an honest answer. It may put her at greater risk.", "- Give the partner a pamphlet about local domestic violence resources", "  No: giving resources to the possible abuser could provoke violence. Information is shared privately and safely with the client.", "", "Why: Pregnancy is a time of increased risk for intimate partner violence. A controlling partner, missed visits and bruises in different stages of healing are warning signs. The first step is private screening, followed by safety planning, resources and documentation, with reporting as required by state law.", "Tip: In abuse questions, the safest first action almost always involves separating the client from the suspected abuser."], "st": "awaiting"}, {"id": "ngn:qb-psy-8", "hash": "d9b605b8ba", "title": "Perinatal loss · Generate solutions", "body": ["A 29-year-old has just given birth to a stillborn son at 36 weeks. She and her husband named him Elijah. They are crying quietly and holding hands. The couple is Catholic.", "", "Which interventions should the nurse include in the plan of care? Select all that apply.", "", "✓ Offer mementos such as footprints, a lock of hair and photographs", "  Yes: keepsakes validate the baby's life and give parents something to hold onto as they grieve.", "✓ Offer the parents the chance to see and hold Elijah, without pressure", "  Yes: many parents find that seeing and holding their baby helps them grieve. The choice is offered, not forced, and can be revisited later.", "✓ Refer to the baby by his name", "  Yes: using the name acknowledges him as their son and shows respect for their loss.", "- Tell them they are young and can have another baby", "  No: this minimizes the loss and implies the baby can be replaced. It is a common but hurtful nontherapeutic response.", "- Place her in a postpartum room next to the newborn nursery", "  No: hearing other newborns can be very painful. A room away from crying babies is offered, with her preference respected.", "✓ Ask whether they would like a priest or the chaplain, or a blessing or baptism", "  Yes: asking about spiritual and cultural wishes lets the nurse support rituals that may be important to them.", "", "Why: After a perinatal loss, nurses support grief by acknowledging the baby as a person, offering contact and keepsakes, and respecting spiritual and cultural practices. Parents should be offered choices rather than told what to do. Statements that minimize the loss and environments full of reminders add to their distress.", "Tip: In grief questions, choose actions that acknowledge the loss and offer choices; reject anything that minimizes or rushes the grief."], "st": "awaiting"}, {"id": "ngn:sa-health-2", "hash": "c388b18485", "title": "Vaccines during pregnancy · Generate solutions", "body": ["A 27-year-old at 28 weeks of gestation is seen in October for a routine prenatal visit. Her labs show she is not immune to rubella, and she has no history of varicella or varicella vaccine. She has never received Tdap.", "", "Which vaccines should the nurse anticipate giving during this pregnancy? Select all that apply.", "", "✓ Tdap", "  Yes: Tdap is recommended in every pregnancy, ideally at 27 to 36 weeks. Maternal antibodies protect the newborn from pertussis before infant vaccines take effect.", "- Varicella vaccine", "  No: varicella is a live vaccine and is contraindicated in pregnancy. It is given after delivery.", "- Live attenuated influenza vaccine by nasal spray", "  No: the nasal flu vaccine is live and not used in pregnancy. The trap is thinking any flu vaccine is fine.", "- Measles, mumps and rubella (MMR)", "  No: MMR is a live vaccine and is not given in pregnancy. She should receive it postpartum, before discharge.", "✓ Inactivated influenza vaccine by injection", "  Yes: the inactivated flu shot is recommended in any trimester during flu season. Pregnancy increases the risk of severe influenza.", "- Human papillomavirus (HPV) vaccine", "  No: HPV vaccination is postponed until after pregnancy. It is not live, but it is not recommended during pregnancy.", "", "Why: Inactivated vaccines that protect mother and baby, such as Tdap and the flu shot, are given during pregnancy. Live vaccines (MMR, varicella, nasal flu) are avoided until after delivery. A rubella nonimmune client receives MMR postpartum.", "Tip: In pregnancy, rule out every live vaccine first, then choose the inactivated ones that protect the newborn."], "st": "awaiting"}, {"id": "ngn:sa-health-3", "hash": "1d09fd56cb", "title": "Placenta previa · Prioritize hypotheses", "body": ["A 33-year-old, G3 P2, at 32 weeks of gestation comes to labor and delivery with bright red vaginal bleeding that started while she was sitting on the couch. She has no pain or contractions. The uterus is soft and nontender. She has had two cesarean births. BP 118/72, HR 96. Fetal heart rate 140 with moderate variability.", "", "Complete the diagram: the condition the client is most likely experiencing, two actions the nurse should take, and two parameters to monitor.", "", "Condition:", "- Placental abruption", "  No: abruption usually causes pain and a firm, tender uterus, often with dark bleeding. This client has none of these.", "- Preterm labor", "  No: preterm labor causes contractions and cervical change. Painless bright red bleeding without contractions points elsewhere.", "- Uterine rupture", "  No: uterine rupture causes sudden severe pain and signs of shock or fetal distress, usually during labor.", "✓ Placenta previa", "  Yes: painless bright red bleeding with a soft uterus in the third trimester is placenta previa. Prior cesarean births are a major risk factor.", "Actions to take:", "✓ Avoid any digital vaginal examination", "  Yes: a vaginal exam can tear the low-lying placenta and cause massive hemorrhage. Nothing goes in the vagina until previa is ruled out by ultrasound.", "- Perform a sterile vaginal exam to check dilation", "  No: this is the trap. A digital exam is contraindicated with suspected previa.", "✓ Start continuous electronic fetal monitoring", "  Yes: continuous monitoring detects fetal compromise from blood loss early.", "- Position her flat on her back", "  No: lying flat compresses the vena cava and reduces placental blood flow. A side-lying position is preferred.", "- Encourage her to walk to stimulate labor", "  No: walking may increase bleeding. Activity is limited while she is bleeding.", "Parameters to monitor:", "- Patellar deep tendon reflexes", "  No: reflexes are monitored for magnesium sulfate and preeclampsia, not previa.", "✓ Amount of vaginal bleeding", "  Yes: pad counts or weighed pads quantify blood loss and guide decisions about delivery.", "✓ Fetal heart rate pattern", "  Yes: the fetal heart rate shows whether placental blood flow is adequate.", "- Uterine fundal height in cm", "  No: fundal height is a routine growth measure and does not change acute management.", "- Capillary fingerstick glucose", "  No: glucose is not affected by this condition.", "", "Why: Painless bright red bleeding in the third trimester is placenta previa until ultrasound shows otherwise. Never perform a vaginal exam, monitor the fetus continuously and quantify the bleeding. Abruption is the main alternative, and it usually comes with pain and a rigid uterus.", "Tip: Use pain to split the two big third-trimester bleeds: painless and bright red is previa; painful with a firm uterus is abruption."], "st": "awaiting"}, {"id": "ngn:sa-health-4", "hash": "1e38a09d18", "title": "Newborn discharge teaching · Evaluate outcomes", "body": ["Before discharge, the nurse asks the parents of a healthy 2-day-old term newborn to describe how they will care for him at home.", "", "Highlight the statements that indicate a need for more teaching.", "", "- \"We'll lay him on his back in his own crib to sleep.\"", "  No: back to sleep, alone, in a crib is correct safe sleep practice. It lowers the risk of sudden infant death.", "✓ highlight \"We bought soft bumpers and a blanket so he's cozy in the crib.\"", "  Yes: bumpers and loose bedding raise suffocation and SIDS risk. The crib should hold only a firm mattress and a fitted sheet.", "- \"We'll fold his diaper below the cord stump and let it fall off on its own.\"", "  No: keeping the stump clean, dry and uncovered lets it dry and separate naturally in 1 to 2 weeks.", "✓ highlight \"His car seat will face forward in the back seat so we can see him in the mirror.\"", "  Yes: infants ride rear-facing in the back seat. Rear-facing protects the head and neck in a crash.", "- \"If his rectal temperature is 38 °C (100.4 °F) or higher, we'll call the pediatrician right away.\"", "  No: fever in a newborn under 3 months needs prompt evaluation. This shows correct understanding.", "✓ highlight \"We'll give him some water between feedings when it's hot outside.\"", "  Yes: young infants should not get plain water. It can cause low sodium and seizures; breast milk or formula meets fluid needs.", "- \"By the end of the first week we expect at least 6 wet diapers a day.\"", "  No: 6 or more wet diapers a day after the first several days shows adequate intake. This is correct.", "", "Why: Discharge teaching is evaluated by listening for unsafe plans. Soft bedding, a forward-facing car seat and water for a newborn are all dangerous. Back to sleep, dry cord care, calling for fever and counting wet diapers are correct.", "Tip: In eval items about teaching, look for the statements that would harm the client if acted on."], "st": "awaiting"}]}, "packs": [{"id": "drill-med-1", "title": "Drills: Med Pass, part 1 of 3", "sub": "What to check before a medication, then give, hold or call. A pharmacist is especially welcome.", "n": 21, "reviewed": 0, "changed": 0}, {"id": "drill-med-2", "title": "Drills: Med Pass, part 2 of 3", "sub": "What to check before a medication, then give, hold or call. A pharmacist is especially welcome.", "n": 21, "reviewed": 0, "changed": 0}, {"id": "drill-med-3", "title": "Drills: Med Pass, part 3 of 3", "sub": "What to check before a medication, then give, hold or call. A pharmacist is especially welcome.", "n": 21, "reviewed": 0, "changed": 0}, {"id": "drill-first-1", "title": "Drills: Who's First, part 1 of 2", "sub": "Four patients, one nurse: who do you see first, and why not the others.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "drill-first-2", "title": "Drills: Who's First, part 2 of 2", "sub": "Four patients, one nurse: who do you see first, and why not the others.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "drill-sbar", "title": "Drills: SBAR", "sub": "Building a call to the provider line by line, and the order that comes back.", "n": 20, "reviewed": 0, "changed": 0}, {"id": "drill-calm", "title": "Drills: De-escalation", "sub": "What to say to an agitated patient, turn by turn. Psych or ED experience fits best.", "n": 22, "reviewed": 0, "changed": 0}, {"id": "ngn-shift-1", "title": "NCLEX questions after each shift, part 1 of 3", "sub": "Five per shift, including the two harder NCLEX challenge items.", "n": 19, "reviewed": 0, "changed": 0}, {"id": "ngn-shift-2", "title": "NCLEX questions after each shift, part 2 of 3", "sub": "Five per shift, including the two harder NCLEX challenge items.", "n": 19, "reviewed": 0, "changed": 0}, {"id": "ngn-shift-3", "title": "NCLEX questions after each shift, part 3 of 3", "sub": "Five per shift, including the two harder NCLEX challenge items.", "n": 17, "reviewed": 0, "changed": 0}, {"id": "bank-ms-1", "title": "NCLEX question bank: Medical-surgical, part 1 of 3", "sub": "68 standalone practice questions.", "n": 23, "reviewed": 0, "changed": 0}, {"id": "bank-ms-2", "title": "NCLEX question bank: Medical-surgical, part 2 of 3", "sub": "68 standalone practice questions.", "n": 23, "reviewed": 0, "changed": 0}, {"id": "bank-ms-3", "title": "NCLEX question bank: Medical-surgical, part 3 of 3", "sub": "68 standalone practice questions.", "n": 22, "reviewed": 0, "changed": 0}, {"id": "bank-ed", "title": "NCLEX question bank: Emergency", "sub": "23 standalone practice questions.", "n": 23, "reviewed": 0, "changed": 0}, {"id": "bank-comm", "title": "NCLEX question bank: Community and fundamentals", "sub": "21 standalone practice questions.", "n": 21, "reviewed": 0, "changed": 0}, {"id": "bank-icu", "title": "NCLEX question bank: Critical care", "sub": "21 standalone practice questions.", "n": 21, "reviewed": 0, "changed": 0}, {"id": "bank-sd", "title": "NCLEX question bank: Cardiac and step-down", "sub": "19 standalone practice questions.", "n": 19, "reviewed": 0, "changed": 0}, {"id": "bank-peds", "title": "NCLEX question bank: Pediatrics", "sub": "17 standalone practice questions.", "n": 17, "reviewed": 0, "changed": 0}, {"id": "bank-ob", "title": "NCLEX question bank: Obstetrics and newborn", "sub": "15 standalone practice questions.", "n": 15, "reviewed": 0, "changed": 0}, {"id": "bank-psy", "title": "NCLEX question bank: Psychiatric", "sub": "11 standalone practice questions.", "n": 11, "reviewed": 0, "changed": 0}, {"id": "bank-periop", "title": "NCLEX question bank: Perioperative", "sub": "7 standalone practice questions.", "n": 7, "reviewed": 0, "changed": 0}, {"id": "cases-1", "title": "Case studies: 78-year-old admitted with community-acquired pneumonia; 72-year-old with worsening ankle swelling and dyspnea; 14-year-old with nausea, belly pain, and rapid breathing", "sub": "Unfolding case studies: one client, six questions in clinical judgment order.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "cases-2", "title": "Case studies: 68-year-old on day 2 after hip arthroplasty; 56-year-old with cirrhosis and hematemesis; 71-y
