<style>
:root{--bg:#E6EDF0;--surface:#FBFCFC;--surface-2:#EDF2F4;--ink:#152238;--ink-2:#4D5A6F;--line:#CAD5DB;--teal:#2449A8;--teal-ink:#fff;--red:#B3342B;--red-bg:#F8E1DE;--good:#2B7249;--good-bg:#E0F0E6;--amber:#A96C0E;--amber-bg:#FBEFD6;
  --serif:"Barlow Condensed","Arial Narrow",sans-serif;--sans:"Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161C;--surface:#1A1F27;--surface-2:#212833;--ink:#E7E4DB;--ink-2:#A0A5AE;--line:#343C48;--teal:#93B4E4;--teal-ink:#0F1B2C;--red:#F0766B;--red-bg:#3b1d1b;--good:#72c692;--good-bg:#16301f;--amber:#E9AE4E;--amber-bg:#35291a}}
:root[data-theme="dark"]{--bg:#12161C;--surface:#1A1F27;--surface-2:#212833;--ink:#E7E4DB;--ink-2:#A0A5AE;--line:#343C48;--teal:#93B4E4;--teal-ink:#0F1B2C;--red:#F0766B;--red-bg:#3b1d1b;--good:#72c692;--good-bg:#16301f;--amber:#E9AE4E;--amber-bg:#35291a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
main{max-width:52rem;margin:0 auto;padding:clamp(1.2rem,5vw,3rem) 16px calc(5rem + env(safe-area-inset-bottom))}
a{color:var(--teal)}
.home{font-family:var(--serif);font-weight:700;font-size:1.1rem;letter-spacing:.04em;text-transform:uppercase;background:var(--ink);color:var(--bg);padding:.28em .55em .22em;border-radius:2px;text-decoration:none}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.9rem,6vw,2.6rem);line-height:1.1;letter-spacing:0;margin:1.6rem 0 .3rem}
h2{font-size:1.15rem;margin:2.4rem 0 .6rem}
h3{font-size:1rem;margin:0}
p{margin:.5rem 0}
.muted{color:var(--ink-2)}
.meta{display:flex;flex-wrap:wrap;gap:.4rem .6rem;margin-top:.6rem}
.chip{display:inline-flex;align-items:center;padding:.15em .6em;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--surface-2);border:1px solid var(--line)}
.chip.awaiting{background:var(--amber-bg);border-color:transparent;color:var(--amber)}
.chip.reviewed{background:var(--good-bg);border-color:transparent;color:var(--good)}
.chip.changed{background:var(--red-bg);border-color:transparent;color:var(--red)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem 1.1rem;margin:.8rem 0}
.how ol{margin:.4rem 0 0;padding-left:1.2rem}.how li{margin:.2rem 0}
label{display:block;font-weight:600;font-size:.9rem;margin:.7rem 0 .25rem}
input[type=text],input[type=email],textarea,select{width:100%;min-height:44px;padding:.5em .7em;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:5rem;resize:vertical}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:0 1rem}
details.pt{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:.6rem 0}
details.pt>summary{cursor:pointer;padding:.85rem 1rem;font-weight:600;list-style-position:inside}
details.pt>div{padding:0 1rem 1rem}
table{width:100%;border-collapse:collapse;font-size:.88rem;margin:.4rem 0}
th,td{text-align:left;vertical-align:top;padding:.35rem .5rem .35rem 0;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--ink-2);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
.scroll{overflow-x:auto}
ul.plain{margin:.3rem 0;padding-left:1.1rem}
.dec{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:.85rem 1rem;margin:.6rem 0}
.dec.pos{border-left-color:var(--good)}.dec.neg{border-left-color:var(--red)}
.dec .top{display:flex;flex-wrap:wrap;gap:.3rem .5rem;align-items:center;font-size:.78rem;color:var(--ink-2);font-weight:600}
.pts{font-weight:700;padding:.05em .45em;border-radius:4px;background:var(--surface-2)}
.pos .pts{color:var(--good);background:var(--good-bg)}.neg .pts{color:var(--red);background:var(--red-bg)}
.dec b{display:block;margin:.35rem 0 .15rem;font-size:1rem}
.dec .why{font-family:var(--sans);color:var(--ink-2);margin:0}
.dec .src{font-size:.75rem;color:var(--ink-2);margin-top:.35rem}
.verdict{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.7rem}
.verdict button{min-height:40px;padding:.35em .9em;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer}
.verdict button[aria-pressed="true"][data-v="ok"]{background:var(--good);border-color:var(--good);color:var(--teal-ink)}
.verdict button[aria-pressed="true"][data-v="fix"]{background:var(--red);border-color:var(--red);color:var(--teal-ink)}
.verdict button[aria-pressed="true"][data-v="unsure"]{background:var(--amber);border-color:var(--amber);color:var(--teal-ink)}
.dec textarea{margin-top:.5rem;min-height:3.6rem}
.opt{padding:.4rem 0;border-bottom:1px solid var(--line);font-size:.92rem}.opt:last-child{border:0}
.opt i{font-style:normal;font-weight:700;font-size:.75rem;padding:.05em .4em;border-radius:4px;margin-right:.4rem;background:var(--surface-2)}
.bar{position:sticky;top:0;z-index:5;margin:0 -16px;padding:.6rem 16px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:.6rem;font-size:.9rem}
.bar .prog{display:block;flex:1;min-width:4rem;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;max-width:12rem}.bar .prog i{display:block;height:100%;background:var(--teal)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:.55em 1.2em;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn-primary{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.row{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1rem}
.check{display:flex;gap:.6rem;align-items:flex-start;font-weight:500;margin-top:1rem}
.check input{width:1.2rem;height:1.2rem;margin-top:.2rem;flex:none}
.msg{margin-top:.8rem;font-weight:600}.msg.err{color:var(--red)}.msg.ok{color:var(--good)}
pre{white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:.8rem;font-size:.8rem;max-height:18rem;overflow:auto}
.shifts a{display:block;text-decoration:none;color:inherit}
.shifts .card:hover{border-color:var(--ink-2)}
</style>
<style>.item .body p{margin:.15rem 0}.item .body .why{color:var(--ink-2);font-size:.92rem;margin:0 0 .35rem 1.1rem}.item .body .ok b{display:inline;margin:0;color:var(--good)}.item .body .no{color:var(--ink)}.item .body .sp{height:.5rem}.item>b{margin-bottom:.5rem}</style></head>

s the counter.", "Turn 2: \"My kid's home with my sister and she has to leave at five.\"", "✓ (-2) \"So you need to get home to your kid. Let me find out where you are in line, and I'll come back by 16:40.\"", "  Reaction: His shoulders come down an inch.", "- (+1) \"I'm sorry, but I can't do anything about childcare. Is there someone else who can pick her up?\"", "  Reaction: \"Then what CAN you do?\"", "- (+2) \"I know it's been long. You'll be seen when it's your turn; the sickest people go first, that's how triage works.\"", "  Reaction: \"That's what they said four hours ago!\"", "Turn 3: He steps in close and points at your face. \"Don't feed me a line.\"", "✓ (-1) Step back so you're out of reach, open hands. \"I hear you. I'm going to give you some space, and I'll be back with a real answer.\"", "  Reaction: He drops his hand.", "- (+3) Put a hand on his shoulder to reassure him. \"Hey, I'm on your side. Let's take a breath together.\"", "  Reaction: He jerks away. \"Don't touch me!\"", "- (+3) Hold your ground so he knows you won't be pushed around, and match his volume: \"I am NOT feeding you a line.\"", "  Reaction: Now you're both shouting.", "Turn 4: \"...Fine. Can I at least get some water?\"", "✓ (-2) \"Let me check if you can drink before they stitch you. If yes, I'll bring it myself.\"", "  Reaction: \"Okay. Thanks.\"", "- (+1) \"No food or water until you're seen. That's the rule for everyone waiting on a procedure.\"", "  Reaction: He sighs and sits, jaw tight.", "- (+1) \"If you sit down and stay quiet for a while, I'll see what I can do about some water.\"", "  Reaction: \"Like a dog?\"", "", "Why: ", "Pearl: Introduce yourself, use their name, name the feeling, find the real need, and stay out of reach."], "st": "awaiting"}, {"id": "drill:de-hold", "hash": "5b08e2b286", "title": "Nadia Farouk, Adult psych, 11:00 (agitation starts at 6/10)", "body": ["Brought in on a 72-hour hold overnight. She's at the locked door, pulling the handle.", "", "Turn 1: \"You can't keep me here! I didn't do anything!\"", "✓ (-2) \"I'm Alex, your nurse today. It's frightening to wake up somewhere locked. Can we sit and talk about what happens next?\"", "  Reaction: She lets go of the handle.", "- (+2) \"Actually we can. You're on a legal hold, so the doors stay locked until the doctor says otherwise.\"", "  Reaction: \"So I'm a prisoner?\"", "- (+2) \"Everyone says that on their first day. Give it a little time and you'll see it's not so bad in here.\"", "  Reaction: She glares and pulls harder.", "Turn 2: \"How long? Tell me the truth.\"", "✓ (-2) \"Up to 72 hours for now. You have rights: a patients' rights advocate, and a hearing if they want to keep you longer.\"", "  Reaction: \"An advocate. Okay. I want that.\"", "- (+1) \"Just a few hours, probably. Let's not worry about that right now; let's get you something to eat.\"", "  Reaction: She looks at you hard. She doesn't believe it.", "- (+1) \"That's up to the doctor, not me. I just work here. You can ask her when she rounds tomorrow.\"", "  Reaction: \"Great. Nobody knows anything.\"", "Turn 3: \"I need my phone. My mom doesn't know where I am.\"", "✓ (-2) \"Let's call her from the unit phone right now. Your phone is locked up safely and you'll get it back.\"", "  Reaction: She nods. Her breathing slows.", "- (+2) \"Phones aren't allowed on the unit. Those are the rules for everybody, and I can't make exceptions.\"", "  Reaction: \"So I can't talk to anyone?\"", "- (+2) \"Your mom will find out eventually. The social worker usually calls families in a day or two, so try not to worry.\"", "  Reaction: Her eyes fill and her voice rises.", "Turn 4: \"Fine. But I'm not taking any pills.\"", "✓ (-1) \"You can ask about any medicine before you decide. Nobody will hide anything in your food.\"", "  Reaction: \"Okay. I'll listen.\"", "- (+3) \"If you don't take them, the doctor can order a shot, and nobody wants it to come to that.\"", "  Reaction: She backs into the corner.", "- (+1) \"You'll feel better if you do. Everyone feels that way at first, and the medicine really does help.\"", "  Reaction: \"You don't know that.\"", "", "Why: ", "Pearl: Honesty de-escalates. Explain the hold, her rights, and what happens next. Threats escalate."], "st": "awaiting"}, {"id": "drill:de-sundown", "hash": "9d8c01fc05", "title": "Harold Pike, Med-surg, 18:30 (agitation starts at 5/10)", "body": ["Dementia. He's out of bed, pulling at his IV, trying the door.", "", "Turn 1: \"I have to get home. The kids need dinner.\"", "✓ (-2) \"You're thinking about your kids. Tell me about them.\"", "  Reaction: He pauses. \"Three boys. Always hungry.\"", "- (+2) \"Harold, your kids are grown. You're in the hospital.\"", "  Reaction: He looks scared. \"What hospital? Where are they?\"", "- (+2) \"You can't go home tonight, Harold. Get back in bed.\"", "  Reaction: He pushes the door harder.", "Turn 2: \"Who are you? What's this thing in my arm?\"", "✓ (-2) Get to eye level, slow and quiet. \"I'm Jo, a nurse. That's medicine to help you. Let's keep it safe.\"", "  Reaction: He stops pulling.", "- (+3) Gently hold his hand down so he can't reach the IV. \"Don't touch that, Harold, you'll hurt yourself.\"", "  Reaction: He shouts and swings his other arm.", "- (+1) \"I told you already, Harold. It's your IV, the same one you asked me about ten minutes ago.\"", "  Reaction: \"You never told me anything.\"", "Turn 3: \"I'm so hungry. When's supper?\"", "✓ (-2) \"Let's get you something now. Sit with me and we'll have a snack.\"", "  Reaction: He shuffles to the chair.", "- (+1) \"Dinner was an hour ago, Harold. You ate the whole tray, remember?\"", "  Reaction: \"No it wasn't.\"", "- (0) Call the provider and ask for a sedative to help him settle for the night.", "  Reaction: The order takes 20 minutes. He's still at the door.", "Turn 4: He sits, chewing a graham cracker. \"Is it dark out?\"", "✓ (-2) \"It is. Let's turn on the lamp and close the curtain. Would you like the radio?\"", "  Reaction: \"Big band. If you have it.\"", "- (+2) Leave the overheads on and the TV loud so he stays awake until a normal bedtime and sleeps through.", "  Reaction: He winces and gets up again.", "- (+1) Say nothing, since he's settled, and slip out to catch up on your charting.", "  Reaction: He's at the door again in five minutes.", "", "Why: ", "Pearl: In dementia: don't argue with the reality they're in. Join it, redirect, and meet the need underneath (hunger, fear, the dark)."], "st": "awaiting"}, {"id": "drill:de-teen-phone", "hash": "8d73d3848d", "title": "Kai, Teen psych, 21:00 (agitation starts at 5/10)", "body": ["Phone time is over. He refuses to hand it back and is swearing at staff.", "", "Turn 1: \"This is so stupid. I was literally in the middle of something.\"", "✓ (-2) \"Sounds like I caught you mid-conversation. That's frustrating.\"", "  Reaction: \"Yeah. With my girlfriend.\"", "- (+2) \"Rules are rules, and phone time is over for everyone. Hand it to me, please.\"", "  Reaction: He shoves the phone in his pocket.", "- (+2) \"Watch your language. You don't talk to staff like that here.\"", "  Reaction: He says it again, louder.", "Turn 2: \"Everyone else got five extra minutes yesterday.\"", "✓ (-2) \"You can take two minutes to say goodnight, then hand it to me. Or hand it now and have first phone time tomorrow.\"", "  Reaction: He thinks about it.", "- (+1) \"I don't care what happened yesterday. I wasn't here, and tonight phone time ends when I say it ends.\"", "  Reaction: \"Of course you don't.\"", "- (-1) \"Fine, keep it tonight. But this is a one-time thing, and I want it handed in first thing in the morning.\"", "  Reaction: He calms, but now every teen on the unit wants the same deal.", "Turn 3: \"Whatever. You can't make me.\"", "✓ (-2) \"You're right, I won't grab it. I'd rather you choose. Two minutes?\"", "  Reaction: He exhales. \"Two minutes.\"", "- (+3) Call three staff to stand around him until he hands it over.", "  Reaction: He backs against the wall, fists up.", "- (+1) \"Then you lose phone time tomorrow too. And the day after, if you keep this up.\"", "  Reaction: \"I don't care!\" He does.", "Turn 4: He hands it over. \"Can I at least have music to fall asleep?\"", "✓ (-2) \"Yes, the unit player's in the day room. Thanks for handing it over. That took something.\"", "  Reaction: A tiny shrug. Almost a smile.", "- (+1) \"Don't push it. You already got more chances tonight than you should have.\"", "  Reaction: He slams his door.", "- (0) \"We'll see. It depends how the rest of the night goes.\"", "  Reaction: He shrugs.", "", "Why: ", "Pearl: With teens, give two acceptable choices and a way to save face. Power struggles have no winner."], "st": "awaiting"}, {"id": "drill:de-withdrawal", "hash": "cbd5961db1", "title": "Greg Tate, Med-surg, 02:00 (agitation starts at 6/10)", "body": ["Admitted for pancreatitis. Shouting, sweating, shaking. Last drink was about 48 hours ago.", "", "Turn 1: \"Get them OFF me! The bugs, they're on the wall!\"", "✓ (-1) Check his vital signs and score his withdrawal.", "  Reaction: HR 124, BP 168/98, T 38.1. Withdrawal score: 24. Severe.", "- (+2) \"There are no bugs. You're imagining it.\"", "  Reaction: \"You're lying! They're right there!\"", "- (+2) \"Keep it down, please. People are trying to sleep.\"", "  Reaction: He throws his water cup.", "Turn 2: \"Make it stop. Please. I'm scared.\"", "✓ (-3) Give the lorazepam ordered for his withdrawal score, and tell him it will help.", "  Reaction: Twenty minutes later his hands are steadier.", "- (0) Give haloperidol for the hallucinations, since that's what's scaring him.", "  Reaction: It doesn't treat withdrawal, and it lowers the seizure threshold.", "- (+3) Tell him this is what happens when you drink, and that he did this to himself.", "  Reaction: He pulls at his IV.", "Turn 3: \"Everything's so loud. And bright.\"", "✓ (-2) Lower the lights, close the door, one calm voice.", "  Reaction: He closes his eyes.", "- (+1) Move him by the nurses' station where it's busy.", "  Reaction: He flinches at every phone ring.", "- (+1) Put on the TV to give him something else to look at.", "  Reaction: He thinks the TV is talking to him.", "Turn 4: Quieter now. \"Am I going to die?\"", "✓ (-2) \"You're in the right place. We're watching you closely and treating it. I'll be back every 30 minutes.\"", "  Reaction: \"Okay.\" He holds the rail, not your arm.", "- (+2) \"I won't lie to you: people do die from alcohol withdrawal, so you need to do exactly what we tell you tonight.\"", "  Reaction: His heart rate jumps.", "- (0) \"Just try to sleep. You'll feel a lot better in the morning, I promise.\"", "  Reaction: He watches the door.", "", "Why: ", "Pearl: Agitation can be medical. Withdrawal, low glucose, low oxygen and pain all look like \"behavior.\" Assess before you redirect."], "st": "awaiting"}, {"id": "drill:de-family", "hash": "5d20e9fc8a", "title": "Dana Whitfield, Med-surg, 13:00 (agitation starts at 6/10)", "body": ["A daughter found her mother wet, with the call light on for 20 minutes. She's at the station, furious.", "", "Turn 1: \"My mother sat in urine for TWENTY minutes. Where was everyone?\"", "✓ (-3) \"I'm so sorry. That shouldn't have happened. Let's go to her together right now.\"", "  Reaction: \"...Thank you.\"", "- (+2) \"I'm sorry, but we have a lot of patients today and we're short one aide.\"", "  Reaction: \"That's not my problem.\"", "- (+2) \"I wasn't her nurse this morning, so I can't tell you what happened before I got here.\"", "  Reaction: \"Then who was?\"", "Turn 2: Back in the room, after you've changed her: \"This keeps happening.\"", "✓ (-2) \"Tell me what you've seen. I'm going to set up a toileting schedule every two hours and write it on her board.\"", "  Reaction: She takes a breath and lists three things.", "- (+2) \"I'm sure it's not that often. The aides round every two hours and I haven't heard about any other times.\"", "  Reaction: \"Are you calling me a liar?\"", "- (+1) \"You can file a complaint with patient relations downstairs. They're open until five.\"", "  Reaction: \"Oh, I will.\"", "Turn 3: \"I want to talk to someone in charge.\"", "✓ (-2) \"Of course. I'll get the charge nurse now, and I'll stay until she arrives.\"", "  Reaction: \"Okay. Good.\"", "- (+2) \"That's not necessary. I'm her nurse and I can handle whatever you need.\"", "  Reaction: \"No. I want someone in charge.\"", "- (+2) \"She's busy with a new admission right now. I can leave her a note for later.\"", "  Reaction: She raises her voice again.", "Turn 4: \"I just want her to be treated like she matters.\"", "✓ (-2) \"She does. I'll check on her myself every hour today. Here's the unit number if you want an update.\"", "  Reaction: Her eyes well up. \"Thank you.\"", "- (+1) \"We treat everyone the same here. Every patient gets the same care, no matter who they are.\"", "  Reaction: \"That's what worries me.\"", "- (0) \"I understand. I'd feel exactly the same way if it were my own mother lying in that bed, believe me.\"", "  Reaction: She nods, unconvinced.", "", "Why: ", "Pearl: With angry families: apologize for the experience, act right away, and follow through on what you promise."], "st": "awaiting"}, {"id": "drill:de-chair", "hash": "19b9877e75", "title": "Victor Kane, Adult psych, 15:00 (agitation starts at 7/10)", "body": ["He's been pacing all morning. Now he picks up a chair in the day room. Two other patients are nearby.", "", "Turn 1: He raises the chair. \"Everybody get BACK!\"", "✓ (-1) Keep your distance, call for help, and get the other patients out.", "  Reaction: The team is on the way. The other patients are out.", "- (+3) Walk up to him alone, slowly, and try to take the chair.", "  Reaction: He swings it.", "- (+1) Stay where you are and keep talking to him, alone, with the others watching.", "  Reaction: He turns toward the other patients.", "Turn 2: Team at the door. He's breathing hard. \"They're saying I'm going to die in here.\"", "✓ (-2) One person talks, from a distance: \"Victor, it's Sam. You're safe. Nobody's going to hurt you. Can you set the chair down?\"", "  Reaction: He lowers the chair a few inches.", "- (+2) Everyone on the team talks at once, each trying a different way to reach him.", "  Reaction: He backs up and raises it again.", "- (+2) From the doorway, firm and loud so he knows you mean it: \"Victor, put it down NOW.\"", "  Reaction: He grips it tighter.", "Turn 3: He sets the chair down. \"I can't stop hearing them.\"", "✓ (-2) \"That sounds exhausting. You have a medicine that can quiet them down. Will you take it by mouth?\"", "  Reaction: \"Yeah. Okay.\"", "- (+3) Signal the team to hold him for an injection now that the chair is down and his hands are free.", "  Reaction: He fights the hold.", "- (+1) \"Good. Now go to your room and stay there until you've calmed down.\"", "  Reaction: He sits on the floor and won't move.", "Turn 4: After the medicine: \"I didn't want to hurt anybody.\"", "✓ (-2) \"I know. You stopped. Let's talk later about what helps when the voices get loud.\"", "  Reaction: He nods and lies down.", "- (+1) \"You scared a lot of people tonight, Victor. We're going to have to talk about that.\"", "  Reaction: He stares at the floor.", "- (0) Say nothing. He needs to sit with what he did.", "  Reaction: He watches the door.", "", "Why: ", "Pearl: When there's a weapon: distance, help, and clear the area first. One voice. Offer oral medicine before anything more restrictive."], "st": "awaiting"}, {"id": "drill:de-pain", "hash": "97be923dbd", "title": "Tina Marsh, Surgical, 04:00 (agitation starts at 5/10)", "body": ["Day 1 after abdominal surgery. You're here for vitals. She yanks her arm away.", "", "Turn 1: \"STOP poking me! Every hour, all night!\"", "✓ (-2) \"You haven't slept at all. That's awful. How's your pain right now?\"", "  Reaction: \"Nine. It's a nine.\"", "- (+1) \"I have to do vitals every four hours after surgery. It's hospital policy.\"", "  Reaction: \"I don't CARE about policy.\"", "- (+3) Put the cuff on anyway. It only takes a minute.", "  Reaction: She rips it off.", "Turn 2: \"Nine. Nobody's given me anything since ten.\"", "✓ (-2) Check her MAR: hydromorphone is due. \"You're due for pain medicine. Let me do your pressure first, then give it.\"", "  Reaction: She offers her arm.", "- (+2) \"Pain is expected after surgery. It usually gets better by the second or third day.\"", "  Reaction: \"So I just have to suffer?\"", "- (+2) \"You'll have to ask the doctor in the morning. I can't change your orders in the middle of the night.\"", "  Reaction: She starts to cry, furious.", "Turn 3: \"And can you all stop waking me up?\"", "✓ (-2) \"Let's group things: I'll do your next checks and meds together at 08:00, and put a sign on your door.\"", "  Reaction: \"You can do that?\"", "- (+1) \"No. That's the schedule after surgery, and it's there to keep you safe.\"", "  Reaction: She turns away.", "- (-1) \"Sure, I'll skip your vitals for the rest of tonight so you can get some real sleep.\"", "  Reaction: She settles, but you've skipped checks she still needs.", "Turn 4: Thirty minutes later: \"It's a four now.\"", "✓ (-2) \"Good. Get some sleep. The light's by your hand if it creeps back up.\"", "  Reaction: She's asleep before you leave.", "- (+2) \"See? You didn't need to yell. All you had to do was ask me nicely the first time.\"", "  Reaction: \"Wow.\"", "- (0) Leave quietly without saying anything so she can sleep.", "  Reaction: She stares at the ceiling.", "", "Why: ", "Pearl: Pain is a common cause of anger. Ask about pain first, then explain, then cluster care so people can sleep."], "st": "awaiting"}, {"id": "drill:de-intox-ama", "hash": "131049d075", "title": "Rick Dawson, ED, 01:30 (agitation starts at 6/10)", "body": ["Brought in drunk after hitting his head. He's pulling off the monitor leads and heading for the door.", "", "Turn 1: \"I'm FINE. I'm going home. You can't stop me.\"", "✓ (-2) \"Rick, I'm Jess, your nurse. I hear you want to go home. Can you sit with me for one minute so I can check your head first?\"", "  Reaction: He stops by the door, swaying.", "- (+2) \"Rick, you're too drunk to leave and you know it. Sit down before you fall and hurt yourself again.\"", "  Reaction: \"Watch me.\"", "- (+2) Call security to stand in the doorway so he can see that leaving isn't an option tonight, then try talking to him.", "  Reaction: He sees the guards and raises his fists.", "Turn 2: \"My head's fine. I've been hit harder.\"", "✓ (-2) \"Maybe so. With a head injury and alcohol, I can't tell yet, and neither can you. That's why we want a scan.\"", "  Reaction: He touches the cut on his head and frowns.", "- (+1) \"You could have a bleed in your head right now. You could die tonight if you walk out that door, do you understand?\"", "  Reaction: \"Everybody dies.\"", "- (0) \"Fine. It's your choice. Sign here that you're leaving against medical advice and you can go.\"", "  Reaction: He grabs the pen. You're not sure he can make this decision.", "Turn 3: \"I need a cigarette. I'm going nuts in here.\"", "✓ (-2) \"I can't let you smoke, but I can ask the doctor about a nicotine patch and get you a sandwich. Deal?\"", "  Reaction: \"...A sandwich would be good.\"", "- (+1) \"No smoking anywhere on hospital grounds. Those are the rules and I don't make them.\"", "  Reaction: \"Then I'm out.\"", "- (+1) \"Go ahead outside for five minutes, just promise me you'll come straight back in for your scan afterward.\"", "  Reaction: He wanders toward the exit unmonitored.", "Turn 4: Sitting now, eating. \"How long's the scan?\"", "✓ (-1) \"About half an hour. I'll come back and tell you when it's time, and I'll check on you in between.\"", "  Reaction: He nods and leans back.", "- (+1) \"Whenever they get to you. Radiology is backed up tonight, so it could be a while.\"", "  Reaction: He starts looking at the door again.", "- (+2) \"Not long. Just stay put this time, and don't make me chase you down the hallway again.\"", "  Reaction: \"Nobody's chasing me.\"", "", "Why: ", "Pearl: Intoxicated people with head injuries can't reliably judge their own risk. Stay calm, give a reason, meet a need (food, nicotine), and involve the provider on capacity."], "st": "awaiting"}, {"id": "drill:de-paranoid", "hash": "e5a76a22b1", "title": "Celia Vance, Adult psych, 12:15 (agitation starts at 6/10)", "body": ["She hasn't eaten in two days. She pushes her tray away and stands up.", "", "Turn 1: \"I know what you put in it. I'm not stupid.\"", "✓ (-2) \"It sounds scary to think your food isn't safe. I'm not going to argue with you about it.\"", "  Reaction: She sits back down, watching you.", "- (+2) \"There's nothing in your food. That's the illness talking; it's a paranoid thought, and it isn't real.\"", "  Reaction: \"That's what they'd say.\"", "- (+3) \"If you don't start eating, the doctor will have to order a feeding tube.\"", "  Reaction: She shoves the tray off the table.", "Turn 2: \"Everyone here is in on it.\"", "✓ (-2) \"I can't see what you're seeing. What would help you feel safe enough to eat something?\"", "  Reaction: She thinks. \"Something sealed.\"", "- (+1) \"Nobody is in on anything. We're all here to help you, every single one of us.\"", "  Reaction: \"You would say that.\"", "- (0) \"Okay, I believe you. I've wondered about the kitchen staff myself.\"", "  Reaction: She looks unsure. Now you're part of the story too.", "Turn 3: \"Sealed. From a package I open myself.\"", "✓ (-2) \"I can bring you sealed crackers, peanut butter and a juice box from the pantry. You open them.\"", "  Reaction: \"...Okay.\"", "- (+2) \"We can't make special arrangements for one patient. The trays all come from the same kitchen.\"", "  Reaction: She turns away.", "- (+1) \"Just eat what's here. It's fine. Look, I'll take a bite of it first to show you.\"", "  Reaction: She doesn't touch it.", "Turn 4: She eats the crackers. \"Don't tell anyone I ate.\"", "✓ (-1) \"I need to write down what you ate so your team knows you're okay. I won't make a big deal of it.\"", "  Reaction: \"Fine. Just you.\"", "- (0) \"Okay, I won't tell anyone. It can stay just between the two of us, I promise.\"", "  Reaction: She relaxes, but you've promised a secret you can't keep.", "- (+1) \"Great job! See, nothing happened! I told you the food here was perfectly safe.\"", "  Reaction: She stops chewing and stares at you.", "", "Why: ", "Pearl: Don't argue with a delusion, and don't agree with it. Acknowledge the feeling, find a safe workaround, and never promise secrecy."], "st": "awaiting"}, {"id": "drill:de-parent-ivs", "hash": "d4053ef81f", "title": "Denise Carter, Pediatrics, 15:00 (agitation starts at 7/10)", "body": ["Her 3-year-old has been stuck three times for an IV. You come in with supplies for a fourth try.", "", "Turn 1: \"NO. You're not touching him again. Three times!\"", "✓ (-2) \"Three tries is too many. I'm sorry. Let's stop and talk about what happens next.\"", "  Reaction: She lowers her arm, still between you and the bed.", "- (+2) \"I understand, but he needs this IV for his fluids. We have to try again.\"", "  Reaction: \"Over my dead body.\"", "- (+1) \"I'm sorry. The last nurse wasn't very experienced with kids. I'm better at this, I promise.\"", "  Reaction: \"So you sent a beginner to stab my son?\"", "Turn 2: \"Why can't anyone get it?\"", "✓ (-2) \"He's dehydrated, which makes veins hard to find. I'd like to ask our vascular team to use an ultrasound to find one.\"", "  Reaction: \"An ultrasound? Why didn't anyone say that before?\"", "- (+1) \"Kids just have small veins, and his are smaller than most. It's nobody's fault, it just happens sometimes.\"", "  Reaction: \"That's not an answer.\"", "- (+2) \"He wouldn't hold still for us. It's very hard to get a vein when a child is moving that much.\"", "  Reaction: \"He's THREE.\"", "Turn 3: \"He's so scared of you all now.\"", "✓ (-2) \"Let's give him a break. Numbing cream first, his tablet and you holding him on your lap. Child life can help too.\"", "  Reaction: She strokes his hair. \"Can I hold him?\"", "- (+2) \"He'll forget about it by tomorrow. Kids his age bounce back fast, faster than their parents do.\"", "  Reaction: \"He won't.\"", "- (+2) \"We'll just have to hold him down this time so it's over quickly. It's kinder in the long run.\"", "  Reaction: She picks him up and backs away.", "Turn 4: \"Okay. Ultrasound. But I'm staying.\"", "✓ (-1) \"Of course. You're the person he trusts most. I'll be here too.\"", "  Reaction: \"Thank you.\"", "- (+2) \"Parents usually wait outside for this. It tends to go more smoothly that way.\"", "  Reaction: \"Absolutely not.\"", "- (0) \"Fine. Just try to stay out of the way.\"", "  Reaction: She nods, still tense.", "", "Why: ", "Pearl: With frightened parents: apologize for the experience, explain the \"why,\" offer a better plan (ultrasound, numbing, comfort positions), and keep them close."], "st": "awaiting"}, {"id": "drill:de-ama-cp", "hash": "321aa1490e", "title": "Frank Morris, Telemetry, 18:00 (agitation starts at 6/10)", "body": ["Admitted with chest pain to rule out a heart attack. Second troponin pending. He's getting dressed.", "", "Turn 1: \"I've got a business to run. I'm leaving.\"", "✓ (-2) \"Your business matters. Can I tell you what we're waiting for, and then you decide?\"", "  Reaction: He pauses with one shoe on. \"Make it quick.\"", "- (+2) \"You can't leave, sir. You might be having a heart attack right now, and I can't let you walk out.\"", "  Reaction: \"Try and stop me.\"", "- (+1) \"Okay, it's your right to leave. I'll get the paperwork for you to sign.\"", "  Reaction: He leaves before anyone explains the risk.", "Turn 2: \"The first test was normal. So I'm fine.\"", "✓ (-2) \"The first one is often normal early. The second one, in about an hour, is the one that catches it.\"", "  Reaction: \"One hour?\"", "- (+1) \"Tests can be wrong, so one normal result doesn't really tell us anything about your heart.\"", "  Reaction: \"Then why bother?\"", "- (+1) \"I'm not a doctor, so I can't say what the tests mean. You'd have to ask her when she's free.\"", "  Reaction: \"Then why are you stopping me?\"", "Turn 3: \"My wife's going to kill me either way.\"", "✓ (-2) \"Want to call her? I'll get you a phone, and I'll ask the doctor to come talk to you both.\"", "  Reaction: He sits. \"Yeah. Okay.\"", "- (+2) \"That's between you and her. It's not my problem, and it's not a reason to leave.\"", "  Reaction: He picks up his keys.", "- (0) \"Trust me, heart attacks are a lot worse than angry wives. She'd rather have you late than dead.\"", "  Reaction: He half-laughs, half-scowls.", "Turn 4: \"If I stay, can I at least use my laptop?\"", "✓ (-1) \"Yes. I'll find you an outlet and the wifi password.\"", "  Reaction: He opens his laptop.", "- (+2) \"No, you need to rest. Work stress is the last thing your heart needs right now.\"", "  Reaction: \"Then I'm resting at home.\"", "- (+1) \"Maybe later, once the doctor has seen you.\"", "  Reaction: He sighs and looks at the door.", "", "Why: ", "Pearl: Patients can refuse care, but they need the real risk in plain words first. Find what's driving the exit (work, family), meet it, and bring in the provider."], "st": "awaiting"}, {"id": "drill:de-icu-delirium", "hash": "0f9fdb4d80", "title": "Ruth Gallo, ICU, 03:00 (agitation starts at 7/10)", "body": ["Two days after bowel surgery. She's trying to climb out of bed and pulling at her central line.", "", "Turn 1: \"Let me out! Where am I? Who are you people?\"", "✓ (-1) Check her oxygen and glucose first.", "  Reaction: SpO₂ 86%: her oxygen cannula is off. Glucose 112.", "- (+3) Ask for wrist restraints before she pulls a line.", "  Reaction: She fights harder.", "- (+1) \"Ruth, calm down. You're fine. Lie back.\"", "  Reaction: \"I'm NOT fine!\"", "Turn 2: \"I can't breathe right.\"", "✓ (-3) Put her oxygen back on and speak slowly: \"Ruth, I'm Kim, your nurse. You're in the hospital after surgery. You're safe.\"", "  Reaction: Her breathing slows. SpO₂ climbs to 93%.", "- (+2) \"Your breathing is fine, Ruth. Your numbers look okay to me, so try to relax and stop pulling at things.\"", "  Reaction: She grabs your arm in panic.", "- (0) Give the PRN haloperidol so she settles and stops pulling at her lines, then reassess her.", "  Reaction: She's quieter but still hypoxic and confused.", "Turn 3: \"Where are my glasses? Everything's blurry.\"", "✓ (-2) Find her glasses and hearing aid, turn on a soft light, and show her the clock.", "  Reaction: \"Oh. It's three in the morning.\"", "- (+1) \"You don't need them right now. It's the middle of the night and there's nothing to see.\"", "  Reaction: She squints and reaches for the line again.", "- (+1) Turn on the bright overheads so she can see the whole room clearly.", "  Reaction: She flinches.", "Turn 4: \"I want my son.\"", "✓ (-2) \"Let's call him. He asked us to, any time. And I'll put his photo where you can see it.\"", "  Reaction: She holds the photo and closes her eyes.", "- (+1) \"It's too late to call. It's three in the morning and he needs his sleep too. We'll try him after breakfast.\"", "  Reaction: She starts crying.", "- (0) \"He'll be here tomorrow. Try to get some sleep so you're rested when he comes.\"", "  Reaction: \"Tomorrow when?\"", "", "Why: ", "Pearl: In delirium, look for a cause first: low oxygen, low glucose, pain, a full bladder. Then reorient, glasses and hearing aids, light, family. Restraints and drugs come last."], "st": "awaiting"}, {"id": "drill:de-mania", "hash": "8b84fffd17", "title": "Dev Anand, Adult psych, 22:30 (agitation starts at 7/10)", "body": ["He's at the nurses' station talking fast and loud, demanding to call his lawyer about his \"billion-dollar app.\"", "", "Turn 1: \"I need a phone RIGHT NOW. Do you know who I am?\"", "✓ (-2) Speak slowly and quietly: \"Dev, I can tell this is important to you. Let's step into the quiet room and figure it out.\"", "  Reaction: He follows, still talking fast.", "- (+2) \"Everyone on this unit thinks they're important, Dev. You'll wait for phone hours like everybody else.\"", "  Reaction: \"You're all JEALOUS.\"", "- (+2) Match his energy to engage him: \"A billion dollars? Tell me everything, let's get your lawyer on the line!\"", "  Reaction: He gets louder.", "Turn 2: \"I don't need sleep. I'm on fire tonight.\"", "✓ (-1) \"You haven't slept in two nights. Your brain needs it, even when it doesn't feel that way.\"", "  Reaction: He pauses. \"Two nights?\"", "- (+2) \"It's late and lights out has come and gone. Go to bed now.\"", "  Reaction: \"You can't make me.\"", "- (+1) \"A billion-dollar app? That sounds amazing. Tell me more about the app and how you came up with it.\"", "  Reaction: He talks for ten minutes, faster and faster.", "Turn 3: \"Fine, but I need to call my lawyer.\"", "✓ (-2) \"Phone hours start at 08:00. I'll write your lawyer's name on the board so it's first on your list.\"", "  Reaction: \"First on the list. Okay.\"", "- (+2) \"No calls at night. Those are the rules for everybody, including you.\"", "  Reaction: He slams the table.", "- (+1) \"Fine, use my phone, but keep it short and give it right back to me when you're done with your lawyer.\"", "  Reaction: He calls four people and gets more wound up.", "Turn 4: \"I'm too wired. I can't.\"", "✓ (-2) \"Your PRN can help your body slow down. Want to try it, with a dark room and some quiet?\"", "  Reaction: \"...Yeah. Dark sounds good.\"", "- (+3) \"You'll get a shot if you don't settle down in the next few minutes. It's up to you.\"", "  Reaction: He backs against the wall.", "- (+1) \"Try harder. Lie down, close your eyes and count.\"", "  Reaction: He paces again.", "", "Why: ", "Pearl: Mania: low stimulation, short clear sentences, firm and kind limits, and channel the energy. Don't argue with grandiosity, and don't feed it either."], "st": "awaiting"}, {"id": "drill:de-lateral", "hash": "645d140270", "title": "Dr. Raines, Med-surg hallway, 08:15 (agitation starts at 7/10)", "body": ["You called him overnight about a patient's low blood pressure. Now he's shouting at you in the hallway in front of families.", "", "Turn 1: \"Why the hell would you call me at 3 AM for THAT?\"", "✓ (-2) \"I want to talk about this, and I'd like to do it somewhere private. Can we step into the conference room?\"", "  Reaction: He glances at the families and walks.", "- (+2) \"Don't yell at me! I was doing my job, and I won't be spoken to like that in front of the whole unit.\"", "  Reaction: \"I'll yell when I want.\"", "- (0) Apologize for waking him, say it won't happen again, and get back to your patients before it gets worse.", "  Reaction: He nods, satisfied. But the next nurse may not call when it matters.", "Turn 2: \"His pressure was 88. That's not a crisis.\"", "✓ (-2) \"His baseline is 140. 88 with a heart rate of 120 is a change. I was concerned.\"", "  Reaction: \"...He was tachy?\"", "- (+1) \"I was just following policy. It says to call for a systolic under 90, so I called.\"", "  Reaction: \"Use your judgment.\"", "- (+2) \"You weren't there. You didn't see him. I did.\"", "  Reaction: \"Excuse me?\"", "Turn 3: \"Nobody told me he was tachy.\"", "✓ (-2) \"I may not have said it clearly. Next time I'll start with the trend and the heart rate. What would you want first?\"", "  Reaction: \"Trend, then your ask. That works.\"", "- (+1) \"I did tell you. I said his heart rate was up when I gave you his vitals.\"", "  Reaction: \"Not clearly.\"", "- (+2) \"Maybe you should listen when nurses call you at night instead of rushing us off the phone every single time.\"", "  Reaction: His face reddens.", "Turn 4: \"Fine. But don't page for nonsense.\"", "✓ (-1) \"I'll always call when I'm worried about a patient. I'd appreciate it if we kept these talks private.\"", "  Reaction: He pauses. \"Fair.\"", "- (+1) \"Okay, I won't. I'll hold the smaller things for morning rounds from now on.\"", "  Reaction: You're less likely to call next time, and the patient pays.", "- (+1) \"I'm reporting you to the chief of medicine. You can't talk to nurses like this and get away with it.\"", "  Reaction: \"Do what you want.\" He walks off.", "", "Why: ", "Pearl: Disruptive behavior: move it out of public view, stay factual, focus on the patient. Never promise not to call when you're worried. Report the behavior through your chain of command."], "st": "awaiting"}, {"id": "drill:de-dementia-bath", "hash": "c268c3c697", "title": "Mabel Ortiz, Med-surg, 09:00 (agitation starts at 6/10)", "body": ["Dementia. Incontinent overnight. When the aide brings the washbasin, she swats at her and yells.", "", "Turn 1: \"Get away! I don't know you!\"", "✓ (-2) Step back, get to eye level and smile: \"Good morning, Mabel. I'm Rosa. I'm here to help you feel fresh.\"", "  Reaction: She looks at you, wary but quieter.", "- (+2) \"Mabel, you're wet. We have to clean you up now, or your skin will break down.\"", "  Reaction: \"How DARE you!\"", "- (+3) Ask a second aide to hold her hands so you can get the wet gown off quickly and be done before she's more upset.", "  Reaction: She screams and kicks.", "Turn 2: \"I bathe at night. Always have.\"", "✓ (-2) \"Then we'll save the full bath for tonight. Right now, just a warm cloth and a fresh nightgown?\"", "  Reaction: \"Warm. Not cold.\"", "- (+2) \"Hospital baths are in the morning, Mabel. That's when we have the staff to help you.\"", "  Reaction: \"Not mine.\"", "- (0) Skip care entirely for now and chart that she refused.", "  Reaction: She calms, but her skin is still wet and breaking down.", "Turn 3: \"It's so cold in here.\"", "✓ (-2) Warm the cloths, cover her with a towel, and wash one area at a time.", "  Reaction: She sighs. \"That's nice.\"", "- (+1) \"It's not cold, Mabel. The thermostat says 72 in here, and we're nearly done.\"", "  Reaction: She pulls the blanket up tight.", "- (+1) Hurry through it to get it over with.", "  Reaction: She shivers and pushes your hand away.", "Turn 4: \"My mother used to sing when she did my hair.\"", "✓ (-1) Hum a song while you brush her hair.", "  Reaction: She hums along.", "- (0) \"Oh, I can't sing. You wouldn't want to hear me try.\"", "  Reaction: She goes quiet.", "- (+2) \"Your mother has passed, Mabel. That was a long time ago.\"", "  Reaction: Her face crumples.", "", "Why: ", "Pearl: Dementia care: approach from the front, slowly, at eye level. Keep their routines when you can, keep them warm and covered, and break care into small steps."], "st": "awaiting"}, {"id": "drill:de-h-grief", "hash": "45e8dc7cdc", "title": "Carla Diaz, Med-surg, 20:00 · NCLEX level (agitation starts at 6/10)", "body": ["Her father is dying. She snaps at you when you come in to turn him: \"Can't you people leave him alone?\"", "", "Turn 1: \"Every hour someone comes in and hurts him.\"", "✓ (-2) \"It's hard to watch him be moved when he's this frail.\"", "  Reaction: She looks at you. \"It is.\"", "- (+1) \"We have to turn him every two hours to prevent pressure sores.\"", "  Reaction: \"I don't care about pressure sores. He's dying.\"", "- (+1) \"I understand exactly how you feel. I went through this with my own father.\"", "  Reaction: \"No, you don't.\"", "Turn 2: \"Nobody told us it would be this fast.\"", "✓ (-2) \"Tell me what you've been told so far.\"", "  Reaction: She lists what the doctor said, then stops. \"I didn't hear the rest.\"", "- (+1) \"The doctor should have explained that.\"", "  Reaction: \"So it's her fault now?\"", "- (0) \"Don't worry, he's comfortable. He isn't aware of any of this.\"", "  Reaction: She glances at him, not convinced.", "Turn 3: \"Is he in pain? He keeps frowning.\"", "✓ (-2) \"Let me check him with you. A frown can mean pain, and we can treat it.\"", "  Reaction: She nods and watches you assess him.", "- (+2) \"That's just a reflex. People this close to the end of life don't really feel pain the way we do.\"", "  Reaction: \"How would you know?\"", "- (+1) \"He's had his scheduled dose. Why do you think he's in pain?\"", "  Reaction: \"Because he's FROWNING.\"", "Turn 4: After his medicine he settles. \"I don't know what to do now.\"", "✓ (-2) \"You can sit close and talk to him. Hearing is often one of the last senses to go.\"", "  Reaction: She takes his hand.", "- (+1) \"You've been here all night. You should go home and get some rest.\"", "  Reaction: \"I'm not leaving him.\"", "- (+1) \"Everything will be okay. You're doing everything right.\"", "  Reaction: She looks away.", "", "Why: ", "Pearl: Grief often comes out as anger. Reflect the feeling, find out what they know, treat what you can (pain), and tell them what they can do. Avoid false reassurance and \"I know how you feel.\""], "st": "awaiting"}, {"id": "drill:de-h-new-dx", "hash": "374a9f2612", "title": "Mark Ellis, Oncology, 16:00 · NCLEX level (agitation starts at 5/10)", "body": ["He learned an hour ago that his cancer has spread. He's staring at the wall and won't take his medicine.", "", "Turn 1: \"What's the point of any of it?\"", "✓ (-2) \"You just got hard news. I'm here. We don't have to talk about medicine right now.\"", "  Reaction: He lets out a long breath.", "- (+1) \"Lots of people live for years with treatment now. You have to stay positive and fight this.\"", "  Reaction: \"You don't know that about me.\"", "- (+1) \"I know it's hard, but you need to take your medicine so you stay strong for what's ahead.\"", "  Reaction: He turns further away.", "Turn 2: \"I keep thinking about my kids.\"", "✓ (-2) \"Tell me about them.\"", "  Reaction: He talks about his daughter's soccer season.", "- (+2) \"Why are you thinking about that now?\"", "  Reaction: \"What kind of question is that?\"", "- (+1) \"Try not to think about that right now.\"", "  Reaction: He goes quiet.", "Turn 3: \"Am I going to die soon?\"", "✓ (-2) \"That's an important question. I'll make sure your oncologist sits down with you about it. What have they told you so far?\"", "  Reaction: \"Just 'treatment options.' I want the real answer.\"", "- (0) \"Nobody can know that. Every patient is different, and statistics don't tell you about one person.\"", "  Reaction: He nods, unsatisfied.", "- (+2) \"Of course not, don't think like that. You've only just started; give the treatment a chance to work first.\"", "  Reaction: \"Don't lie to me.\"", "Turn 4: \"I just don't want to feel like this tonight.\"", "✓ (-1) \"Are you having any thoughts of hurting yourself?\"", "  Reaction: \"No. Just tired. And scared.\" His shoulders drop.", "- (0) \"Let me get you something to help you sleep. Things feel worse at night.\"", "  Reaction: He shrugs.", "- (+1) \"Tomorrow will look better. It always does after some sleep.\"", "  Reaction: He shakes his head.", "", "Why: ", "Pearl: After bad news: presence first, then open questions. Don't reassure falsely or dodge. Ask directly about suicide when someone says they don't want to feel this way."], "st": "awaiting"}, {"id": "drill:de-h-refuse", "hash": "72cd832a43", "title": "Ivy Chen, Adult psych, 09:00 · NCLEX level (agitation starts at 6/10)", "body": ["On a 72-hour hold for psychosis. She refuses her antipsychotic: \"It makes me a zombie.\"", "", "Turn 1: \"I'm not taking it. You can't make me.\"", "✓ (-2) \"You're right that you can refuse. Can you tell me what it's been like on it?\"", "  Reaction: \"Slow. Like my head is full of cotton.\"", "- (+3) \"If you don't take it by mouth, the doctor will just order a shot, so you may as well take it now.\"", "  Reaction: \"See? You're all the same.\"", "- (+1) \"It's for your own good. You were much sicker before you started it.\"", "  Reaction: \"Says who?\"", "Turn 2: \"Slow. Like my head is full of cotton. I can't think.\"", "✓ (-2) \"That sounds miserable. I'll tell your doctor exactly how it feels so the dose or the drug can be looked at.\"", "  Reaction: \"You'd do that?\"", "- (+1) \"That's a normal side effect when you first start. It goes away in a few weeks for most people.\"", "  Reaction: \"It's been a week.\"", "- (+1) \"Everyone feels like that at first. Your body just needs time to get used to the medicine.\"", "  Reaction: \"I'm not everyone.\"", "Turn 3: \"And if I still say no?\"", "✓ (-2) \"Then I write down that you refused and why, and your doctor talks with you about other options.\"", "  Reaction: She nods slowly.", "- (+2) \"Then you won't get better, and you'll be in here a lot longer than you need to be.\"", "  Reaction: \"Great.\"", "- (0) \"Let's not worry about that right now. Let's just take this one dose at a time.\"", "  Reaction: She frowns, unsure what you mean.", "Turn 4: \"Okay. I'll talk to her.\"", "✓ (-1) \"I'll ask her to see you this morning. Thanks for telling me what's been happening.\"", "  Reaction: \"Thanks for listening.\"", "- (+2) \"Good. Now take your pill this morning, and you can talk to her about it afterward.\"", "  Reaction: She pushes the cup away.", "- (0) \"Great decision. I knew you'd come around.\"", "  Reaction: She shrugs.", "", "Why: ", "Pearl: Patients on a hold still have the right to refuse medication except in an emergency or by court order. Ask about side effects, advocate, and document the refusal and the reason."], "st": "awaiting"}, {"id": "drill:de-h-veteran", "hash": "7c7d254faf", "title": "Ray Ortiz, ICU step-down, 02:30 · NCLEX level (agitation starts at 7/10)", "body": ["A veteran recovering from surgery. A tray crashed in the hall. Now he's out of bed, breathing fast, eyes darting.", "", "Turn 1: \"Where am I? Get down!\"", "✓ (-2) From a few feet away, calmly: \"Ray, it's Dana, your nurse. You're in the hospital. You're safe.\"", "  Reaction: His eyes find yours.", "- (+2) Put a hand on his shoulder to ground him and say his name firmly: \"Ray. Look at me.\"", "  Reaction: He flinches hard and swings.", "- (+1) \"It's just a tray. Nothing's wrong. Get back in bed.\"", "  Reaction: \"Something's wrong!\"", "Turn 2: \"I heard it. It was right there.\"", "✓ (-2) \"A tray fell in the hall. It was loud. You're in room 6, and it's 2:30 in the morning.\"", "  Reaction: He looks at the door, then the clock.", "- (0) \"Are you having a flashback? Is this about the war? Tell me what you're seeing right now.\"", "  Reaction: He doesn't answer.", "- (+3) \"You're overreacting. It was only a tray.\"", "  Reaction: \"Don't tell me how to react.\"", "Turn 3: Breathing hard. \"I can't slow down.\"", "✓ (-2) \"Breathe with me: in for four, out for six. Feel your feet on the floor.\"", "  Reaction: His breathing slows.", "- (+1) \"Just relax. Nothing here can hurt you, so there's no reason to breathe like that.\"", "  Reaction: \"I CAN'T.\"", "- (0) \"Let me get you something to calm you down. You have lorazepam ordered.\"", "  Reaction: He shakes his head. \"No drugs.\"", "Turn 4: \"Sorry. That happens.\"", "✓ (-2) \"No need to be sorry. Would it help to keep the door closed and a light on at night?\"", "  Reaction: \"Yeah. That would.\"", "- (0) \"It's okay, everybody gets scared sometimes. It's nothing to be embarrassed about.\"", "  Reaction: He looks away.", "- (+2) \"Why didn't you tell us about your PTSD when you were admitted?\"", "  Reaction: His jaw tightens.", "", "Why: ", "Pearl: Trauma responses: keep your distance, say who you are and where they are, avoid touching without asking, ground with breath and senses, then adjust the environment."], "st": "awaiting"}, {"id": "drill:de-h-teen-od", "hash": "0b83d8c0fa", "title": "Riley, Pediatrics, 10:00 · NCLEX level (agitation starts at 6/10)", "body": ["Admitted after an acetaminophen overdose. Medically stable now. She glares when you come in: \"I don't want to talk.\"", "", "Turn 1: \"I don't want to talk.\"", "✓ (-2) \"That's okay. I'm going to sit here for a few minutes while I check your IV.\"", "  Reaction: She doesn't look up, but doesn't tell you to leave.", "- (+2) \"You'll have to talk to someone eventually. The psychiatrist won't clear you until you do.\"", "  Reaction: \"Not to you.\"", "- (+2) \"Okay. Can you at least tell me why you did it?\"", "  Reaction: She pulls the blanket over her head.", "Turn 2: \"My mom's acting like I ruined her life.\"", "✓ (-2) \"It sounds like you're feeling blamed.\"", "  Reaction: \"Yeah. Like it's about her.\"", "- (+1) \"I'm sure she's just worried about you.\"", "  Reaction: \"You don't know her.\"", "- (+1) \"Your mom loves you.\"", "  Reaction: She rolls her eyes.", "Turn 3: \"Are you going to tell her what I say?\"", "✓ (-2) \"Most of what you tell me stays between us and your care team. If you're in danger, I can't keep that private, and I'd tell you first.\"", "  Reaction: She thinks about it. \"Okay.\"", "- (+1) \"No, everything you say to me is confidential. I won't repeat a word of it to your mom or anyone else.\"", "  Reaction: She relaxes, but you've promised something you can't keep.", "- (+2) \"You're a minor, so your mom has a right to know everything you tell us while you're here.\"", "  Reaction: \"Then forget it.\"", "Turn 4: \"I still kind of want to die.\"", "✓ (-1) \"Thank you for telling me. Do you have a plan for how?\"", "  Reaction: \"No. I just feel empty.\" She stays.", "- (+2) \"You don't mean that. You're just exhausted and upset.\"", "  Reaction: \"Yes, I do.\"", "- (+1) \"You're so young. You have so much to live for, and so many people who love you.\"", "  Reaction: She stops talking.", "", "Why: ", "Pearl: With teens: presence before questions, reflect feelings, and be honest about confidentiality limits. Ask directly about suicide and a plan; it doesn't plant the idea."], "st": "awaiting"}, {"id": "drill:de-h-son-ama", "hash": "b0b4533512", "title": "Victor Hale, Med-surg, 17:30 · NCLEX level (agitation starts at 6/10)", "body": ["His mother, 83, has pneumonia and is confused today. He's packing her bag. \"I'm taking her home. You people aren't helping.\"", "", "Turn 1: \"She was fine before she came here.\"", "✓ (-2) \"Seeing her this confused is frightening. Can you tell me what she's usually like at home?\"", "  Reaction: \"Sharp. She does her own bills.\"", "- (+1) \"She's confused because of the infection, not because of anything we've done. This is very common at her age.\"", "  Reaction: \"So you're saying it's not your fault?\"", "- (+2) \"Sir, please calm down. I can't help you or your mother when you're raising your voice.\"", "  Reaction: \"Don't tell me to calm down.\"", "Turn 2: \"Sharp. She does her own bills.\"", "✓ (-2) \"That's really helpful. A sudden change like this is called delirium. It often improves as the infection is treated.\"", "  Reaction: \"It gets better?\"", "- (0) \"Older people often get confused in the hospital. It's the new surroundings and the broken sleep.\"", "  Reaction: \"That's not an answer.\"", "- (+1) \"She'll be fine. Once the antibiotics kick in she'll be back to herself.\"", "  Reaction: \"You can't promise that.\"", "Turn 3: \"So what am I supposed to do? Just watch?\"", "✓ (-2) \"You can help a lot: her glasses and hearing aids, photos, talking about home, being here at night if you can.\"", "  Reaction: He sets the bag down.", "- (+1) \"The best thing is to let the staff handle it. She needs rest more than visitors right now.\"", "  Reaction: \"That's what I've been doing.\"", "- (+1) \"If you take her home like this, she could die. I need you to understand that.\"", "  Reaction: He stares at you, frozen.", "Turn 4: \"Can I talk to her doctor?\"", "✓ (-1) \"Yes. I'll page her now and stay with you until she calls.\"", "  Reaction: \"Thank you.\"", "- (+2) \"The doctor's very busy tonight. She has thirty patients.\"", "  Reaction: He picks the bag up again.", "- (+1) \"Maybe tomorrow on rounds. They usually come by around nine.\"", "  Reaction: \"Tomorro
