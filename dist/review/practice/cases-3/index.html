<style>
:root{--bg:#E6EDF0;--surface:#FBFCFC;--surface-2:#EDF2F4;--ink:#152238;--ink-2:#4D5A6F;--line:#CAD5DB;--teal:#2449A8;--teal-ink:#fff;--red:#B3342B;--red-bg:#F8E1DE;--good:#2B7249;--good-bg:#E0F0E6;--amber:#A96C0E;--amber-bg:#FBEFD6;
  --serif:"Barlow Condensed","Arial Narrow",sans-serif;--sans:"Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161C;--surface:#1A1F27;--surface-2:#212833;--ink:#E7E4DB;--ink-2:#A0A5AE;--line:#343C48;--teal:#93B4E4;--teal-ink:#0F1B2C;--red:#F0766B;--red-bg:#3b1d1b;--good:#72c692;--good-bg:#16301f;--amber:#E9AE4E;--amber-bg:#35291a}}
:root[data-theme="dark"]{--bg:#12161C;--surface:#1A1F27;--surface-2:#212833;--ink:#E7E4DB;--ink-2:#A0A5AE;--line:#343C48;--teal:#93B4E4;--teal-ink:#0F1B2C;--red:#F0766B;--red-bg:#3b1d1b;--good:#72c692;--good-bg:#16301f;--amber:#E9AE4E;--amber-bg:#35291a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
main{max-width:52rem;margin:0 auto;padding:clamp(1.2rem,5vw,3rem) 16px calc(5rem + env(safe-area-inset-bottom))}
a{color:var(--teal)}
.home{font-family:var(--serif);font-weight:700;font-size:1.1rem;letter-spacing:.04em;text-transform:uppercase;background:var(--ink);color:var(--bg);padding:.28em .55em .22em;border-radius:2px;text-decoration:none}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.9rem,6vw,2.6rem);line-height:1.1;letter-spacing:0;margin:1.6rem 0 .3rem}
h2{font-size:1.15rem;margin:2.4rem 0 .6rem}
h3{font-size:1rem;margin:0}
p{margin:.5rem 0}
.muted{color:var(--ink-2)}
.meta{display:flex;flex-wrap:wrap;gap:.4rem .6rem;margin-top:.6rem}
.chip{display:inline-flex;align-items:center;padding:.15em .6em;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--surface-2);border:1px solid var(--line)}
.chip.awaiting{background:var(--amber-bg);border-color:transparent;color:var(--amber)}
.chip.reviewed{background:var(--good-bg);border-color:transparent;color:var(--good)}
.chip.changed{background:var(--red-bg);border-color:transparent;color:var(--red)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem 1.1rem;margin:.8rem 0}
.how ol{margin:.4rem 0 0;padding-left:1.2rem}.how li{margin:.2rem 0}
label{display:block;font-weight:600;font-size:.9rem;margin:.7rem 0 .25rem}
input[type=text],input[type=email],textarea,select{width:100%;min-height:44px;padding:.5em .7em;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:5rem;resize:vertical}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:0 1rem}
details.pt{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:.6rem 0}
details.pt>summary{cursor:pointer;padding:.85rem 1rem;font-weight:600;list-style-position:inside}
details.pt>div{padding:0 1rem 1rem}
table{width:100%;border-collapse:collapse;font-size:.88rem;margin:.4rem 0}
th,td{text-align:left;vertical-align:top;padding:.35rem .5rem .35rem 0;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--ink-2);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
.scroll{overflow-x:auto}
ul.plain{margin:.3rem 0;padding-left:1.1rem}
.dec{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:.85rem 1rem;margin:.6rem 0}
.dec.pos{border-left-color:var(--good)}.dec.neg{border-left-color:var(--red)}
.dec .top{display:flex;flex-wrap:wrap;gap:.3rem .5rem;align-items:center;font-size:.78rem;color:var(--ink-2);font-weight:600}
.pts{font-weight:700;padding:.05em .45em;border-radius:4px;background:var(--surface-2)}
.pos .pts{color:var(--good);background:var(--good-bg)}.neg .pts{color:var(--red);background:var(--red-bg)}
.dec b{display:block;margin:.35rem 0 .15rem;font-size:1rem}
.dec .why{font-family:var(--sans);color:var(--ink-2);margin:0}
.dec .src{font-size:.75rem;color:var(--ink-2);margin-top:.35rem}
.verdict{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.7rem}
.verdict button{min-height:40px;padding:.35em .9em;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer}
.verdict button[aria-pressed="true"][data-v="ok"]{background:var(--good);border-color:var(--good);color:var(--teal-ink)}
.verdict button[aria-pressed="true"][data-v="fix"]{background:var(--red);border-color:var(--red);color:var(--teal-ink)}
.verdict button[aria-pressed="true"][data-v="unsure"]{background:var(--amber);border-color:var(--amber);color:var(--teal-ink)}
.dec textarea{margin-top:.5rem;min-height:3.6rem}
.opt{padding:.4rem 0;border-bottom:1px solid var(--line);font-size:.92rem}.opt:last-child{border:0}
.opt i{font-style:normal;font-weight:700;font-size:.75rem;padding:.05em .4em;border-radius:4px;margin-right:.4rem;background:var(--surface-2)}
.bar{position:sticky;top:0;z-index:5;margin:0 -16px;padding:.6rem 16px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:.6rem;font-size:.9rem}
.bar .prog{display:block;flex:1;min-width:4rem;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;max-width:12rem}.bar .prog i{display:block;height:100%;background:var(--teal)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:.55em 1.2em;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn-primary{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.row{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1rem}
.check{display:flex;gap:.6rem;align-items:flex-start;font-weight:500;margin-top:1rem}
.check input{width:1.2rem;height:1.2rem;margin-top:.2rem;flex:none}
.msg{margin-top:.8rem;font-weight:600}.msg.err{color:var(--red)}.msg.ok{color:var(--good)}
pre{white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:.8rem;font-size:.8rem;max-height:18rem;overflow:auto}
.shifts a{display:block;text-decoration:none;color:inherit}
.shifts .card:hover{border-color:var(--ink-2)}
</style>

2; Blood pressure 07:40 162/110; Blood pressure 07:55 (repeat) 164/112; Respiratory rate 18; SpO₂ 98% on room air; Fetal heart rate Baseline 140, moderate variability, accelerations present, no decelerations", "Nurses' Notes 07:45: Client reports a throbbing frontal headache rated 8/10 that did not improve with acetaminophen 1,000 mg at 05:00. She says she has been seeing flashing spots since last night. She reports a constant ache under her right ribs and in the upper abdomen. Trace edema of both ankles. Patellar reflexes 3+ with 2 beats of clonus. Urine dipstick protein 3+. Fetal heart rate baseline 140 with moderate variability and accelerations. She reports active fetal movement.", "Laboratory Results 08:20 (shown from item 2): Platelets 92,000/mm³ (low); AST 98 units/L (high); ALT 110 units/L (high); Creatinine 1.2 mg/dL (high); Urine protein/creatinine ratio 2.1 (high); Hemoglobin 11.4 g/dL", "Orders 08:30 (shown from item 5): 1. Labetalol 20 mg IV over 2 minutes now for BP 160/110 or higher; recheck BP in 10 minutes; if still 160/110 or higher give 40 mg IV, then 80 mg IV per protocol. 2. Magnesium sulfate 4 g IV over 20 minutes, then 1 g/h continuous infusion (maintenance reduced for creatinine above 1.1 mg/dL). Stop the infusion for absent reflexes, RR below 12 or decreased level of consciousness. 3. Calcium gluconate 1 g IV at the bedside; give 1 g IV over 3 minutes for RR below 12 per magnesium toxicity protocol. 4. BP every 15 minutes; reflexes, RR, level of consciousness and urine output every hour. 5. Indwelling urinary catheter; strict intake and output; total IV fluids 100 mL/h. 6. Notify provider for RR below 12, absent reflexes, urine output below 30 mL/h or SpO₂ below 95%. 7. Serum magnesium level 4 hours after the infusion starts and if toxicity is suspected. 8. Continuous fetal monitoring. 9. Begin induction of labor with oxytocin per protocol after maternal stabilization.", "Medication Administration Record 08:35 (shown from item 5): 08:35 Labetalol 20 mg IV (BP 164/110). 08:45 BP 162/108; labetalol 40 mg IV given 08:46. 08:56 BP 150/98. 08:40 Magnesium sulfate 4 g IV loading dose started; completed 09:00. 09:00 Magnesium sulfate 1 g/h started. 10:00 Oxytocin 2 milliunits/min started.", "Intake and Output 13:00 (shown from item 5): Urine 10:00 to 11:00 40 mL; Urine 11:00 to 12:00 24 mL; Urine 12:00 to 13:00 18 mL; IV intake 12:00 to 13:00 100 mL", "Nurses' Notes 13:00 (shown from item 5): Client is drowsy and opens her eyes to voice; speech is slurred. Patellar reflexes absent bilaterally. RR 10 and shallow. SpO₂ 93% on room air. BP 148/94, HR 88. Cervix 4 cm. Fetal heart rate baseline 130 with minimal variability, no decelerations.", "Laboratory Results 13:40 (shown from item 6): Magnesium (drawn 13:10) 10.6 mg/dL (therapeutic 4.8 to 8.4) (high); Creatinine (drawn 13:10) 1.5 mg/dL (high)", "Nurses' Notes 14:15 (shown from item 6): Magnesium infusion stopped at 13:01. Oxygen by nonrebreather mask at 13:02. Calcium gluconate 1 g IV given 13:03 to 13:06. Provider at bedside 13:10. Client now alert and oriented, speaking clearly. Patellar reflexes 1+ bilaterally. Headache has returned, rated 6/10.", "Vital Signs 14:15 (shown from item 6): Blood pressure 14:00 164/108; Blood pressure 14:15 (repeat) 166/108; Heart rate 96; Respiratory rate 16; SpO₂ 99% on nonrebreather mask; Fetal heart rate Baseline 135, moderate variability, no decelerations", "Intake and Output 14:00 (shown from item 6): Urine 13:00 to 14:00 28 mL", "", "Refer to the chart. The nurse admits the client at 07:45.", "", "Highlight the findings in the 07:45 nurses' note that require follow-up.", "", "✓ highlight Client reports a throbbing frontal headache rated 8/10 that did not improve with acetaminophen 1,000 mg at 05:00.", "  Yes: a new, persistent headache that does not respond to analgesics is a cerebral sign of preeclampsia with severe features and a warning sign of eclampsia.", "✓ highlight She says she has been seeing flashing spots since last night.", "  Yes: scotomata reflect cerebral vasospasm and edema; visual disturbance is a severe feature and often comes before a seizure.", "✓ highlight She reports a constant ache under her right ribs and in the upper abdomen.", "  Yes: right upper quadrant or epigastric pain signals liver swelling or injury. The trap is writing it off as heartburn of late pregnancy.", "- Trace edema of both ankles.", "  No: dependent ankle edema is common in the third trimester and is no longer a diagnostic criterion for preeclampsia.", "✓ highlight Patellar reflexes 3+ with 2 beats of clonus.", "  Yes: hyperreflexia with clonus shows central nervous system irritability and raises the risk of an eclamptic seizure.", "✓ highlight Urine dipstick protein 3+.", "  Yes: new proteinuria with hypertension after 20 weeks supports preeclampsia and needs a quantitative test to confirm.", "- Fetal heart rate baseline 140 with moderate variability and accelerations.", "  No: a normal baseline with moderate variability and accelerations is a reassuring tracing that shows the fetus is well oxygenated right now.", "- She reports active fetal movement.", "  No: active movement is a reassuring sign of fetal well-being and does not need follow-up.", "", "Why: This client has severe-range blood pressure plus cerebral, visual and hepatic symptoms, which together point to preeclampsia with severe features. Hyperreflexia with clonus signals that the brain is irritable and a seizure could follow. The fetal findings are reassuring for now, and ankle edema is an expected pregnancy change.", "Tip: Sort each finding by body system and ask whether it is new and abnormal for pregnancy or an expected third-trimester change."], "st": "awaiting"}, {"id": "ngn:cs-preeclampsia-2", "hash": "d0251c7e1c", "title": "Preeclampsia that turns severe · item 2 · Matrix · Analyze cues", "body": ["Refer to the chart.", "", "For each finding, indicate whether it is a severe feature of preeclampsia or is not a severe feature.", "", "- BP 162/110 and 164/112, 15 minutes apart → Severe feature", "  a systolic of 160 or higher or a diastolic of 110 or higher, confirmed on repeat, is severe-range hypertension that must be treated promptly.", "- Platelets 92,000/mm³ → Severe feature", "  a platelet count below 100,000/mm³ is a severe feature and raises concern for evolving HELLP syndrome.", "- AST 98 units/L and ALT 110 units/L → Severe feature", "  liver enzymes at twice the upper limit of normal reflect hepatic injury and explain her right upper quadrant pain.", "- Creatinine 1.2 mg/dL → Severe feature", "  a creatinine above 1.1 mg/dL signals renal insufficiency. Creatinine normally falls in pregnancy, so this value is clearly abnormal.", "- Urine protein/creatinine ratio 2.1 → Not a severe feature", "  the ratio confirms proteinuria, but the amount of protein is no longer counted as a severe feature. The trap is assuming more protein means more severe disease.", "- Hemoglobin 11.4 g/dL → Not a severe feature", "  mild dilutional anemia is expected in the third trimester because plasma volume expands faster than red cell mass.", "", "Why: Under ACOG criteria, severe features include severe-range BP, platelets below 100,000/mm³, liver enzymes twice normal, creatinine above 1.1 mg/dL, pulmonary edema, and new cerebral or visual symptoms. The quantity of proteinuria is not a severe feature. This client meets several criteria, so delivery after stabilization is indicated at 35 weeks.", "Tip: Memorize the short list of severe features; anything not on that list, such as the amount of protein or edema, does not upgrade the diagnosis."], "st": "awaiting"}, {"id": "ngn:cs-preeclampsia-3", "hash": "d58c01c5f5", "title": "Preeclampsia that turns severe · item 3 · Drop-down · Prioritize hypotheses", "body": ["Refer to the chart.", "", "Complete the sentences.", "", "Blank 1:", "- hypovolemic shock", "  No: she is hypertensive, not hypotensive, and has no bleeding; shock is not the current threat.", "- a pulmonary embolism", "  No: pregnancy raises clot risk, but she has no dyspnea, chest pain or hypoxemia to suggest an embolism.", "✓ an eclamptic seizure", "  Yes: preeclampsia with cerebral symptoms and hyperreflexia can progress to eclampsia, a life-threatening seizure for both client and fetus.", "Blank 2:", "- the ankle edema and urine protein", "  No: edema is expected in pregnancy and proteinuria confirms the diagnosis, but neither predicts a seizure.", "- the fetal heart rate baseline of 140", "  No: a baseline of 140 is normal and reflects fetal status, not maternal seizure risk.", "✓ the persistent headache, flashing spots and 3+ reflexes with clonus", "  Yes: these are signs of cerebral irritability and vasospasm, the warning signs that most often come before an eclamptic seizure.", "Blank 3:", "- hypoglycemia", "  No: nothing in the record suggests a glucose problem; she has no diabetes.", "- deep vein thrombosis", "  No: DVT is a pregnancy risk, but it is not caused by acute severe hypertension.", "✓ hemorrhagic stroke", "  Yes: severe systolic hypertension is the leading cause of stroke in preeclampsia, which is why severe-range BP is treated within 30 to 60 minutes.", "", "Why: Two threats compete for attention: eclampsia and stroke. Headache, visual changes and hyperreflexia warn of a seizure, so magnesium sulfate is needed. Sustained severe-range BP threatens a cerebral hemorrhage, so a fast-acting antihypertensive is needed at the same time. Both are treated urgently.", "Tip: When a client has severe hypertension, link each finding to the organ at risk: brain signs predict seizure and stroke, liver and platelet changes predict HELLP."], "st": "awaiting"}, {"id": "ngn:cs-preeclampsia-4", "hash": "f21a9ef85b", "title": "Preeclampsia that turns severe · item 4 · Select all · Generate solutions", "body": ["Refer to the chart.", "", "Which interventions should the nurse anticipate in the plan of care? Select all that apply.", "", "- Furosemide IV to reduce her edema", "  No: preeclampsia already depletes intravascular volume; a diuretic would worsen kidney and placental perfusion. The trap is treating the edema.", "✓ Magnesium sulfate IV loading dose followed by a continuous infusion", "  Yes: magnesium sulfate is the drug of choice to prevent eclamptic seizures. With a creatinine of 1.2 mg/dL the loading dose is unchanged, but the maintenance rate is reduced and levels are checked because the kidneys clear magnesium.", "✓ Seizure precautions with suction and oxygen at the bedside and low stimulation", "  Yes: magnesium lowers but does not remove seizure risk, so the room must be ready to protect the airway.", "✓ Give an IV antihypertensive within 30 to 60 minutes of the confirmed severe-range BP", "  Yes: ACOG recommends treating confirmed severe-range BP within 30 to 60 minutes with IV labetalol, IV hydralazine or immediate-release oral nifedipine to prevent stroke.", "✓ Calcium gluconate available at the bedside", "  Yes: calcium gluconate is the antidote for magnesium toxicity and must be ready before the infusion begins.", "- Encourage 3 L of oral fluids to protect her kidneys", "  No: leaky capillaries put her at risk for pulmonary edema, so total fluids are restricted and tracked closely.", "✓ Hourly patellar reflexes, respiratory rate, urine output and level of consciousness", "  Yes: loss of reflexes, slowed breathing, low urine output and drowsiness are the bedside signs of rising magnesium levels.", "- Lower the BP to 110/70 within the first hour", "  No: the goal is about 140 to 150 over 90 to 100; dropping BP too far or too fast reduces placental blood flow and harms the fetus.", "", "Why: The plan has two urgent goals: lower severe-range BP promptly and prevent seizures. That means a first-line antihypertensive within 30 to 60 minutes and magnesium sulfate with hourly toxicity checks and the antidote ready. Fluids are restricted, diuretics are avoided, and BP is lowered gradually to protect the placenta.", "Tip: For severe preeclampsia, think in pairs: an antihypertensive for stroke and magnesium for seizures, each with its own safety monitoring."], "st": "awaiting"}, {"id": "ngn:cs-preeclampsia-5", "hash": "a7328d829f", "title": "Preeclampsia that turns severe · item 5 · Ordered response · Take action", "body": ["Refer to the chart, including the Orders, Medication Administration Record and Intake and Output.", "", "Place the nurse's actions in the order they should be performed.", "", "Correct order:", "1. Stop the magnesium sulfate infusion.", "  Yes: stopping the source comes first; every minute it runs adds magnesium that her failing kidneys cannot clear, and the order set authorizes stopping it.", "2. Stay with the client, call for help and have the provider notified now, and apply oxygen by nonrebreather mask.", "  Yes: RR 10 with drowsiness threatens her breathing, so support oxygenation and summon the team and provider without leaving the bedside; the order calls for prompt notification.", "3. Give calcium gluconate 1 g IV over 3 minutes per protocol.", "  Yes: calcium reverses magnesium's effect at the neuromuscular junction; the protocol allows it for RR below 12 without waiting for a level.", "4. Draw the serum magnesium level and recheck reflexes, RR, SpO₂ and level of consciousness after the calcium dose.", "  Yes: the level confirms toxicity and guides when magnesium can safely resume, and reassessment after the antidote shows whether it worked.", "5. Give the provider a full SBAR report at the bedside, including the response to calcium and the urine output trend.", "  Yes: once the antidote and reassessment are done, a complete report lets the provider decide on further magnesium, the BP and the delivery plan.", "", "Why: Absent reflexes, RR 10, drowsiness and urine output below 30 mL/h for 2 hours mean magnesium toxicity. Magnesium is cleared by the kidneys, so oliguria lets it build up even at a reduced maintenance rate. The nurse stops the drug, calls for help and the provider while supporting breathing, gives the antidote, then reassesses and gives a full report.", "Tip: In a drug toxicity emergency, stop the drug, call for help while protecting the airway, give the antidote, then reassess and report the response."], "st": "awaiting"}, {"id": "ngn:cs-preeclampsia-6", "hash": "a904c8e659", "title": "Preeclampsia that turns severe · item 6 · Matrix · Evaluate outcomes", "body": ["Refer to the chart.", "", "For each finding, indicate whether it shows improvement or requires follow-up.", "", "- RR 16 and SpO₂ 99% → Improving", "  breathing has returned to normal after stopping the infusion and giving calcium gluconate.", "- Patellar reflexes 1+ → Improving", "  the return of reflexes shows the magnesium effect on the neuromuscular junction is lessening.", "- Alert, oriented and speaking clearly → Improving", "  her level of consciousness has returned, which shows central nervous system depression has resolved.", "- Urine output 28 mL in the last hour → Requires follow-up", "  output is still below 30 mL/h and creatinine has risen, so magnesium will keep accumulating if it is restarted at the same dose.", "- BP 164/108 and 166/108, 15 minutes apart → Requires follow-up", "  this is severe-range hypertension again and needs an antihypertensive within 30 to 60 minutes; her returning headache adds to the concern.", "- Fetal heart rate baseline 135 with moderate variability → Improving", "  variability has returned from minimal to moderate as the magnesium effect fades, a reassuring sign of fetal oxygenation.", "", "Why: The antidote worked: breathing, reflexes and alertness have recovered. The client is not out of danger, though. Her BP is back in the severe range with a headache, and her kidneys are still clearing poorly, so the provider must treat the BP now and adjust magnesium before restarting it.", "Tip: When evaluating, check whether each original problem resolved, then look for anything that has returned or worsened."], "st": "awaiting"}, {"id": "ngn:cs-infant-dehydration-1", "hash": "06b0552911", "title": "Infant with gastroenteritis and dehydration · item 1 · Select all · Recognize cues", "body": ["Client: 11-month-old male, 8.5 kg, admitted to the pediatric unit with vomiting and diarrhea", "History and Physical 10:00: 11-month-old, previously healthy. Rotavirus vaccine series not completed. Attends daycare where several children have had diarrhea this week. Watery, nonbloody stools 8 to 10 times a day for 3 days and vomiting for 2 days. Taking only sips of formula since yesterday. Weight today 8.5 kg (18.7 lb); weight at a clinic visit 2 weeks ago 9.5 kg (20.9 lb). No known allergies.", "Vital Signs 10:05: Temperature 38.3 °C (100.9 °F) axillary; Heart rate 178; Blood pressure 78/48; Respiratory rate 40; Capillary refill 4 seconds; SpO₂ 99% on room air", "Nurses' Notes 10:10: Infant lies quietly in the caregiver's arms and arouses only to touch. Weak cry without tears. Mucous membranes dry and sticky. Anterior fontanel sunken. Skin on the abdomen tents briefly. Hands and feet cool. One wet diaper in the last 12 hours, per the caregiver. Diaper area red and raw.", "Laboratory Results 10:40 (shown from item 2): Sodium 137 mEq/L; Potassium 3.4 mEq/L (low); Chloride 110 mEq/L (high); Bicarbonate 15 mEq/L (low); BUN 28 mg/dL (high); Creatinine 0.6 mg/dL (high); Stool rotavirus antigen Pending", "Orders 10:50 (shown from item 5): 1. Contact precautions. 2. Peripheral IV. 3. 0.9% sodium chloride 170 mL (20 mL/kg) IV over 20 minutes; reassess and notify provider if perfusion does not improve. 4. Point-of-care glucose now. 5. After the bolus: D5 0.9% sodium chloride at 34 mL/h; add potassium chloride 20 mEq/L after the first void. 6. Oral rehydration solution 5 mL every 1 to 2 minutes once awake and able to suck; advance as tolerated. 7. Strict intake and output; weigh all diapers. 8. Daily weight, unclothed, on the same scale.", "Laboratory Results 11:00 (shown from item 5): Point-of-care glucose 74 mg/dL", "Nurses' Notes 11:00 (shown from item 5): 24-gauge IV placed in the right hand on the second attempt. Infant remains lethargic. No void since admission.", "Intake and Output 16:00 (shown from item 6): 0.9% sodium chloride bolus 11:00 to 11:20 170 mL; D5 0.9% sodium chloride 11:20 to 16:00 (potassium chloride added 12:45) 159 mL; Oral rehydration solution 14:00 to 16:00 90 mL; Diaper 12:40, urine 38 g; Diaper 14:10, urine 52 g; Diaper 15:50, urine and loose stool 60 g", "Vital Signs 16:00 (shown from item 6): Temperature 37.6 °C (99.7 °F) axillary; Heart rate 128; Blood pressure 86/54; Respiratory rate 32; Capillary refill 2 seconds", "Nurses' Notes 16:00 (shown from item 6): Infant awake, fussing and reaching for his bottle. Tears present when crying. Mucous membranes moist. Took 90 mL of oral rehydration solution since 14:00 without vomiting. Caregiver at the bedside; oral rehydration teaching started.", "", "Refer to the chart. The nurse completes the admission assessment at 10:10.", "", "Which findings indicate dehydration with poor perfusion? Select all that apply.", "", "✓ Anterior fontanel sunken", "  Yes: a sunken fontanel in an infant reflects loss of extracellular fluid volume and is a classic sign of significant dehydration.", "✓ One wet diaper in 12 hours", "  Yes: low urine output shows the kidneys are conserving water because renal blood flow has dropped.", "- Red, raw diaper area", "  No: this is irritant dermatitis from frequent stools; it needs skin care but does not reflect fluid volume or perfusion.", "- Blood pressure 78/48", "  No: this is within the normal range for age. Infants keep BP normal until late shock; the trap is feeling reassured by it.", "✓ Weak cry without tears", "  Yes: absent tears and a weak cry show the infant is conserving fluid and losing energy, both signs of moderate to severe dehydration.", "✓ Capillary refill 4 seconds with cool hands and feet", "  Yes: refill longer than 3 seconds and cool extremities show the body is shunting blood away from the skin to protect vital organs.", "✓ Heart rate 178", "  Yes: tachycardia is how infants maintain cardiac output when stroke volume falls; it is an early sign of shock.", "✓ Arouses only to touch", "  Yes: lethargy means the brain is not getting enough perfusion and marks dehydration as severe.", "", "Why: Infants show dehydration through the fontanel, tears, mucous membranes, urine output and perfusion. Tachycardia, delayed capillary refill and lethargy mean circulation is affected. A normal BP is expected until shock is advanced, so it should never be used to rule out hypovolemia in a child.", "Tip: In pediatric shock, rely on heart rate, capillary refill and mental status; hypotension is a late, ominous sign."], "st": "awaiting"}, {"id": "ngn:cs-infant-dehydration-2", "hash": "77b5d42716", "title": "Infant with gastroenteritis and dehydration · item 2 · Drop-down · Analyze cues", "body": ["Refer to the chart.", "", "Complete the sentences.", "", "Blank 1:", "- 1%", "  No: 1% confuses the 1 kg lost with a percentage; divide the loss by the starting weight.", "✓ 10%", "  Yes: 1 kg lost from 9.5 kg is about 10.5%. Acute weight loss in diarrheal illness is mostly fluid.", "- 5%", "  No: 5% would be a loss of about 0.5 kg; this infant lost twice that.", "Blank 2:", "- no", "  No: every perfusion and hydration finding in the chart is abnormal.", "✓ severe", "  Yes: a loss of 10% or more with altered mental status and delayed refill is severe dehydration with impaired perfusion.", "- mild", "  No: mild dehydration is under 5% loss with a normal heart rate, normal refill and an alert infant.", "Blank 3:", "- respiratory acidosis from hypoventilation", "  No: his respiratory rate is not low, and a respiratory acidosis would raise bicarbonate, not lower it.", "- metabolic alkalosis from vomiting and loss of stomach acid over two days", "  No: vomiting can cause alkalosis, but a low bicarbonate means acidosis; the diarrhea losses dominate here.", "✓ metabolic acidosis from bicarbonate lost in stool and poor perfusion", "  Yes: diarrhea removes bicarbonate, and poor perfusion adds lactic acid, so the bicarbonate falls and chloride rises.", "", "Why: Percent weight loss is the most objective measure of dehydration in infants. This infant lost about 10% and has lethargy and delayed refill, which is severe dehydration. Diarrhea also causes a non-anion-gap metabolic acidosis, and the low potassium reflects stool losses.", "Tip: Calculate percent weight loss as the amount lost divided by the starting weight, then match it to the mild, moderate and severe ranges."], "st": "awaiting"}, {"id": "ngn:cs-infant-dehydration-3", "hash": "3938456018", "title": "Infant with gastroenteritis and dehydration · item 3 · Matrix · Prioritize hypotheses", "body": ["Refer to the chart.", "", "For each client problem, indicate whether it is the priority now, should be addressed after the priority, or is not a current problem.", "", "- Hypovolemia with poor tissue perfusion → Priority now", "  lethargy, tachycardia and delayed refill show circulation is failing; restoring volume comes first because it threatens life.", "- Metabolic acidosis → Address after the priority", "  the acidosis comes from stool losses and poor perfusion and will improve as volume is restored, so treating the cause comes first.", "- Irritant dermatitis in the diaper area → Address after the priority", "  skin care with barrier cream and frequent changes is needed, but it is not a threat to life.", "- Caregiver knowledge of oral rehydration → Address after the priority", "  teaching matters for home care but should wait until the infant is stable and the caregiver can focus.", "- Fluid volume excess → Not a current problem", "  nothing in the chart suggests overload; the infant is clearly volume depleted.", "- Hypernatremia → Not a current problem", "  the sodium of 137 mEq/L is normal, so this is isotonic dehydration and hypernatremia is not present.", "", "Why: Prioritize by threat to life. Hypovolemia with signs of poor perfusion affects circulation and the brain, so it comes first. The acidosis is a result of the hypovolemia and will improve with fluid. Skin and teaching needs are real but follow stabilization.", "Tip: Use ABCs to prioritize: a circulation problem with altered mental status outranks lab abnormalities that will correct with treatment of the cause."], "st": "awaiting"}, {"id": "ngn:cs-infant-dehydration-4", "hash": "58fc116246", "title": "Infant with gastroenteritis and dehydration · item 4 · Matrix · Generate solutions", "body": ["Refer to the chart. The infant weighs 8.5 kg.", "", "For each potential intervention, indicate whether it is indicated or not indicated for this client.", "", "- 0.9% sodium chloride 170 mL IV bolus → Indicated", "  20 mL/kg times 8.5 kg is 170 mL of isotonic fluid, the standard bolus for hypovolemia with poor perfusion.", "- D5 0.2% sodium chloride 170 mL IV bolus → Not indicated", "  hypotonic dextrose fluid does not stay in the vessels and can cause hyponatremia; boluses must be isotonic.", "- Point-of-care blood glucose → Indicated", "  infants have small glycogen stores, and poor intake plus lethargy can mean hypoglycemia, which must be ruled out quickly.", "- Maintenance IV rate of 34 mL/h after the bolus → Indicated", "  by the 4-2-1 rule, 4 mL/kg/h for the first 10 kg times 8.5 kg is 34 mL/h.", "- Loperamide to slow the diarrhea → Not indicated", "  antidiarrheals are not recommended for young children with acute gastroenteritis because of serious adverse effects, and they do not treat the fluid loss.", "- Potassium chloride in the IV fluid before the first void → Not indicated", "  potassium is added only after urine output confirms the kidneys can excrete it, even though his potassium is low.", "", "Why: Severe dehydration needs a rapid 20 mL/kg isotonic bolus, a glucose check and then weight-based maintenance fluid. Holliday-Segar gives 4 mL/kg/h for the first 10 kg. Hypotonic boluses, antidiarrheals and potassium before voiding are unsafe for this infant.", "Tip: For any pediatric fluid order, check that the bolus is isotonic and weight-based, and confirm urine output before adding potassium."], "st": "awaiting"}, {"id": "ngn:cs-infant-dehydration-5", "hash": "e5b51272b0", "title": "Infant with gastroenteritis and dehydration · item 5 · Select all · Take action", "body": ["Refer to the chart, including the Orders.", "", "Which actions should the nurse take? Select all that apply.", "", "✓ Infuse the 170 mL bolus by infusion pump over 20 minutes", "  Yes: a pump delivers the exact weight-based volume over the ordered time, which prevents both under- and over-infusion in a small infant.", "- Give 120 mL of apple juice by bottle to start oral rehydration", "  No: a lethargic infant is at risk for aspiration, and juice is high in sugar and low in sodium, which worsens diarrhea.", "✓ Place the infant on contact precautions and wear a gown and gloves for care", "  Yes: rotavirus spreads by the fecal-oral route and survives on surfaces, so contact precautions protect other children on the unit.", "✓ Weigh each diaper, subtract the dry weight and record 1 g as 1 mL", "  Yes: diaper weights are the most accurate way to measure infant output; 1 g of wet weight equals about 1 mL of urine.", "- Take the temperature rectally with each set of vital signs", "  No: rectal temperatures are avoided in an infant with frequent diarrhea because they irritate the inflamed mucosa and can stimulate more stools; use the axillary route.", "✓ Reassess heart rate, capillary refill and mental status after the bolus", "  Yes: response to each bolus decides whether another is needed; the order asks the nurse to notify the provider if perfusion does not improve.", "- Hang the maintenance fluid with potassium chloride now", "  No: the infant has not voided; potassium is added only after the first void, as the order states.", "", "Why: The nurse delivers the bolus accurately, checks the response, measures output precisely and protects other clients from a highly contagious virus. Oral fluids wait until the infant is alert enough to suck safely, and potassium waits for urine output.", "Tip: When a sata mixes safety and treatment, check each option against the client's current status, such as level of alertness and whether the client has voided."], "st": "awaiting"}, {"id": "ngn:cs-infant-dehydration-6", "hash": "35cee419de", "title": "Infant with gastroenteritis and dehydration · item 6 · Matrix · Evaluate outcomes", "body": ["Refer to the chart.", "", "For each finding or caregiver statement, indicate whether it shows improvement or understanding, or needs further intervention or teaching.", "", "- Heart rate 128, capillary refill 2 seconds, awake and reaching for his bottle → Shows improvement or understanding", "  heart rate, refill and alertness have all returned toward normal, showing perfusion has been restored.", "- Urine-only diapers of 38 g at 12:40 and 52 g at 14:10 → Shows improvement or understanding", "  about 90 mL of urine in roughly 3 hours after the bolus is well above 1 mL/kg/h for an 8.5 kg infant, showing kidney perfusion has returned.", "- \"I will give him about 5 mL of the solution every minute or two and give more as he keeps it down.\" → Shows improvement or understanding", "  small, frequent amounts are the correct way to give oral rehydration solution because they are absorbed without triggering vomiting.", "- \"At home I will give him apple juice or a sports drink instead, since he likes them better.\" → Needs further intervention or teaching", "  juice and sports drinks have too much sugar and too little sodium; they can worsen diarrhea and do not replace electrolytes.", "- \"If the diarrhea starts again, I will stop his formula and solid foods for a few days.\" → Needs further intervention or teaching", "  infants should resume their usual diet as soon as they are rehydrated; withholding food delays gut recovery and worsens nutrition.", "- \"I will call if he has no wet diaper in 6 hours, will not drink or is very sleepy.\" → Shows improvement or understanding", "  these are the correct warning signs of recurring dehydration that need prompt medical care.", "", "Why: Normal heart rate, brisk refill, alertness and good urine output show the bolus and maintenance fluid worked. Teaching focuses on giving oral rehydration solution in small frequent amounts, avoiding sugary drinks, continuing normal feeding and knowing when to call. Two statements show the caregiver needs more teaching.", "Tip: For evaluation items with caregiver statements, flag any statement that substitutes a sugary drink for oral rehydration solution or withholds normal feeding."], "st": "awaiting"}, {"id": "ngn:cs-burns-1", "hash": "8080bec40e", "title": "House fire with inhalation injury · item 1 · Highlight · Recognize cues", "body": ["Client: 34-year-old male, 80 kg, brought to the emergency department after a house fire", "History and Physical 03:00: 34-year-old male, 80 kg (176 lb), carried by firefighters from a closed bedroom of a burning house. Time of injury about 02:00. EMS could not obtain IV access; no fluids given in the field. No past medical history, no allergies, tetanus status unknown. Burns: partial-thickness and full-thickness burns of the entire anterior trunk and both entire arms. Face reddened without blisters (superficial).", "Vital Signs 03:00: Temperature 36.4 °C (97.5 °F); Heart rate 118; Blood pressure 132/84; Respiratory rate 26; SpO₂ 98% on 2 L/min nasal cannula; Pain 9/10", "Nurses' Notes 03:05: Found in a closed bedroom. Nasal hairs and eyebrows singed. Soot around the mouth; coughing up black-streaked sputum. Voice is hoarse. High-pitched sound on inspiration, heard intermittently. Reports a headache and nausea. SpO₂ 98% on 2 L/min nasal cannula. Rates pain 9/10 in his arms and chest.", "Laboratory Results 03:20 (shown from item 2): pH 7.32 (low); PaCO₂ 36 mm Hg; PaO₂ 92 mm Hg; Bicarbonate 19 mEq/L (low); Carboxyhemoglobin 18% (high); Lactate 2.8 mmol/L (high); Hemoglobin 17.2 g/dL (high)", "Orders 03:30 (shown from item 5): 1. 100% oxygen by nonrebreather mask. 2. Prepare for rapid sequence intubation; anesthesia to the bedside. 3. Two large-bore IVs. 4. Lactated Ringer's by Parkland formula: 4 mL/kg/%TBSA over 24 hours, half in the first 8 hours from the time of injury; titrate to urine output 0.5 mL/kg/h. 5. Indwelling urinary catheter; hourly urine output. 6. Morphine 4 mg IV now and every hour as needed for pain. 7. Cover burns with clean, dry sheets; keep the room warm. 8. Tetanus toxoid IM. 9. NPO. 10. Repeat carboxyhemoglobin and lactate at 08:00.", "Nurses' Notes 03:45 (shown from item 5): On 100% oxygen by nonrebreather mask. Stridor now continuous and voice more hoarse. Anesthesia at the bedside preparing for intubation. Two large-bore IVs in place. Lactated Ringer's ready to start at 04:00.", "Intake and Output 08:00 (shown from item 6): Lactated Ringer's 04:00 to 08:00 3,840 mL; Urine 05:00 to 06:00 45 mL; Urine 06:00 to 07:00 22 mL; Urine 07:00 to 08:00 18 mL", "Laboratory Results 08:00 (shown from item 6): Carboxyhemoglobin 4%; Lactate 3.9 mmol/L (high); Hemoglobin 17.8 g/dL (high)", "Nurses' Notes 08:00 (shown from item 6): Intubated at 03:50; sedated, opens eyes to voice. Heart rate 128, up from 112 at 05:00. BP 92/54. Urine output 22 mL/h and 18 mL/h over the last 2 hours. Lactate 3.9 mmol/L, up from 2.8. Breath sounds clear; SpO₂ 99% on FiO₂ 0.40. Temperature 36.9 °C (98.4 °F) with warm blankets and the room warmed. Carboxyhemoglobin 4%.", "", "Refer to the chart. The client arrived in the emergency department at 03:00.", "", "Highlight the findings in the 03:05 note that suggest inhalation injury or carbon monoxide poisoning.", "", "✓ highlight Found in a closed bedroom.", "  Yes: a fire in an enclosed space traps smoke and hot gases, which greatly raises the risk of both inhalation injury and carbon monoxide poisoning.", "✓ highlight Nasal hairs and eyebrows singed.", "  Yes: singed facial hair shows heat reached the face and airway, a classic sign of thermal airway injury.", "✓ highlight Soot around the mouth; coughing up black-streaked sputum.", "  Yes: carbonaceous sputum means smoke particles reached the lower airway, which signals inhalation injury.", "✓ highlight Voice is hoarse.", "  Yes: hoarseness means the vocal cords and larynx are swelling, an early sign the upper airway may close.", "✓ highlight High-pitched sound on inspiration, heard intermittently.", "  Yes: stridor means the upper airway is already narrowed; swelling worsens over hours, so this is an emergency.", "✓ highlight Reports a headache and nausea.", "  Yes: headache and nausea are early symptoms of carbon monoxide poisoning, which blocks oxygen delivery to tissues.", "- SpO₂ 98% on 2 L/min nasal cannula.", "  No: this reading does not suggest poisoning, but it does not rule it out; pulse oximetry reads carboxyhemoglobin as oxygenated hemoglobin. The trap is feeling reassured.", "- Rates pain 9/10 in his arms and chest.", "  No: severe pain is expected with partial-thickness burns and needs treatment, but it does not point to an airway or carbon monoxide injury.", "", "Why: Inhalation injury is suggested by an enclosed-space fire, singed facial hair, carbonaceous sputum, hoarseness and stridor. Airway edema worsens over the first hours, so these cues call for early intubation. Headache and nausea point to carbon monoxide, which a normal SpO₂ cannot rule out.", "Tip: In any burn client, look at the face, voice and sputum first; airway cues outrank the burn wounds themselves."], "st": "awaiting"}, {"id": "ngn:cs-burns-2", "hash": "ff65324d78", "title": "House fire with inhalation injury · item 2 · Drop-down · Analyze cues", "body": ["Refer to the chart. Use the rule of nines and the Parkland formula (lactated Ringer's 4 mL/kg/%TBSA over 24 hours).", "", "Complete the sentences.", "", "Blank 1:", "- 45%", "  No: this adds the 9% for the head, but the face burn is superficial, and superficial burns are not counted in the TBSA.", "✓ 36%", "  Yes: anterior trunk 18% plus each entire arm 9% equals 36%. Only partial-thickness and full-thickness burns are counted.", "- 27%", "  No: this counts only one arm; both entire arms are burned, 9% each.", "Blank 2:", "- 2,880 mL", "  No: 2,880 mL is one quarter of the total, the amount for each 8-hour period on day 1 after the first.", "- 11,520 mL", "  No: 11,520 mL is the full 24-hour volume, not the first 8-hour portion.", "✓ 5,760 mL", "  Yes: 4 mL x 80 kg x 36% is 11,520 mL for 24 hours; half, 5,760 mL, is given in the first 8 hours from the time of injury.", "Blank 3:", "✓ pulse oximetry overestimates oxygenation in carbon monoxide poisoning", "  Yes: the oximeter cannot tell carboxyhemoglobin from oxyhemoglobin, so it reads falsely normal while tissues are starved of oxygen.", "- the carboxyhemoglobin is within the normal range for a nonsmoking adult", "  No: normal carboxyhemoglobin is under about 3% in nonsmokers; 18% is clinically significant poisoning.", "- tissue oxygenation is adequate", "  No: the metabolic acidosis and rising lactate show tissues are not getting enough oxygen despite the normal reading.", "", "Why: The rule of nines gives 36% TBSA, counting only partial-thickness and full-thickness burns. Parkland gives 11,520 mL over 24 hours, with 5,760 mL in the first 8 hours measured from the time of injury. Carbon monoxide makes the SpO₂ falsely normal, so carboxyhemoglobin and lactate guide oxygen therapy. Parkland (4 mL/kg/%TBSA) is still widely taught, but ABLS 2018 starts adult thermal burns at 2 mL/kg/%TBSA; always calculate from the formula in the order, then titrate to urine output.", "Tip: Leave superficial burns out of the TBSA, and always time the first 8 hours of Parkland from the injury, not from arrival."], "st": "awaiting"}, {"id": "ngn:cs-burns-3", "hash": "b977b17a96", "title": "House fire with inhalation injury · item 3 · Matrix · Prioritize hypotheses", "body": ["Refer to the chart.", "", "For each complication, indicate whether it is an immediate threat in the first hours or a later complication of this injury.", "", "- Upper airway obstruction from edema → Immediate threat in the first hours", "  stridor and hoarseness are already present, and airway swelling peaks within the first 24 hours, so the airway can close quickly.", "- Tissue hypoxia from carbon monoxide → Immediate threat in the first hours", "  a carboxyhemoglobin of 18% with acidosis means oxygen delivery is impaired right now; it needs 100% oxygen immediately.", "- Burn shock from fluid shifting out of the vessels → Immediate threat in the first hours", "  capillary leak begins within minutes of a 36% burn and is greatest in the first 24 hours, so fluid loss is an early threat.", "- Wound infection and sepsis → Later complication", "  infection becomes a major risk after the first several days as the wound is colonized, not in the first hours.", "- Stress ulcer of the stomach or duodenum → Later complication", "  a stress ulcer can develop days after a major burn; prevention starts early, but it is not the immediate threat.", "- Joint contractures → Later complication", "  contractures develop over weeks as burned skin heals and tightens; positioning and therapy prevent them later.", "", "Why: In the first hours after a major burn, the airway, carbon monoxide and burn shock can kill. Infection, stress ulcers and contractures matter later in the course. Prioritizing by time helps the nurse focus on airway, breathing and circulation now.", "Tip: Sort burn complications by phase: airway and circulation threats in the emergent phase, infection and healing problems in the acute and rehabilitation phases."], "st": "awaiting"}, {"id": "ngn:cs-burns-4", "hash": "2f19113a9d", "title": "House fire with inhalation injury · item 4 · Matrix · Generate solutions", "body": ["Refer to the chart.", "", "For each potential intervention, indicate whether it is indicated or not indicated for this client.", "", "- 100% oxygen by nonrebreather mask → Indicated", "  high-flow oxygen shortens the half-life of carboxyhemoglobin and is given until carbon monoxide levels fall, no matter what the SpO₂ shows.", "- Early intubation while the airway can still be secured → Indicated", "  stridor and hoarseness mean edema is closing the airway; waiting can make intubation impossible as swelling peaks.", "- Lactated Ringer's by the Parkland formula through two large-bore IVs → Indicated", "  a 36% burn needs large-volume isotonic fluid to replace capillary leak and prevent burn shock.", "- Ice packs on the burned arms to relieve pain → Not indicated", "  ice causes vasoconstriction that deepens the burn, and cooling large areas causes hypothermia. The trap is treating it like a minor burn.", "- Morphine IM for pain → Not indicated", "  absorption from muscle is unreliable while fluid is shifting and perfusion is poor; opioids are given IV in major burns.", "- Titrate fluid to a urine output of 0.5 mL/kg/h → Indicated", "  for an 80 kg adult that is about 40 mL/h, the main bedside sign that resuscitation is adequate without overloading.", "", "Why: Initial burn care follows the ABCs: protect the airway early, give 100% oxygen for carbon monoxide, and start Parkland fluid titrated to urine output. Pain is treated with IV opioids. The burns are kept clean, dry and warm rather than iced.", "Tip: For a major burn, remember airway, oxygen, fluids by formula, urine output, IV pain control and warmth, in that order of concern."], "st": "awaiting"}, {"id": "ngn:cs-burns-5", "hash": "797d93a901", "title": "House fire with inhalation injury · item 5 · Select all · Take action", "body": ["Refer to the chart, including the Orders. The time of injury was 02:00.", "", "Which actions should the nurse take? Select all that apply.", "", "✓ Give morphine 4 mg IV", "  Yes: IV opioids give reliable, quick relief of severe burn pain; pain also drives tachycardia and oxygen demand.", "✓ Assist with intubation now", "  Yes: continuous stridor and worsening hoarseness mean the airway is narrowing quickly; securing it now comes before anything else.", "- Give sips of water for his dry, sore throat", "  No: he is about to be intubated and is NPO; anything by mouth raises aspiration risk with a compromised airway.", "- Start lactated Ringer's at 720 mL/h, spreading the 5,760 mL over the next 8 hours", "  No: this times the 8 hours from arrival instead of injury and under-resuscitates. The trap is ignoring the 2 hours already lost.", "✓ Cover the burns with clean, dry sheets and warm blankets", "  Yes: burned skin cannot hold heat, and hypothermia worsens bleeding and shock; dry coverings also reduce pain from air on the wounds.", "✓ Insert an indwelling urinary catheter and measure output hourly, aiming for at least 40 mL/h", "  Yes: hourly urine output is the main guide for titrating fluid; 0.5 mL/kg/h for 80 kg is 40 mL/h.", "- Apply cool, wet saline dressings over the chest and both arms", "  No: wet dressings over 36% of the body cause rapid heat loss and hypothermia in a client already at risk.", "✓ Start lactated Ringer's at 960 mL/h so the first 5,760 mL is in by 10:00", "  Yes: the first 8 hours end at 10:00, 8 hours after injury; 5,760 mL over the remaining 6 hours is 960 mL/h.", "", "Why: The nurse secures the airway first, then starts Parkland fluid at a rate that makes up for time lost since injury. Urine output, IV pain control and warmth complete the early bundle. Cooling large burns and oral fluids are unsafe here.", "Tip: When a Parkland question gives both the injury time and the arrival time, subtract the hours already passed before calculating the hourly rate."], "st": "awaiting"}, {"id": "ngn:cs-burns-6", "hash": "2709f296b6", "title": "House fire with inhalation injury · item 6 · Highlight · Evaluate outcomes", "body": ["Refer to the chart, including the Intake and Output. The client weighs 80 kg.", "", "Highlight the findings in the 08:00 note that show the fluid resuscitation is not adequate.", "", "- Intubated at 03:50; sedated, opens eyes to voice.", "  No: this is the expected level of sedation for a ventilated client and does not measure fluid status.", "✓ highlight Heart rate 128, up from 112 at 05:00.", "  Yes: a rising heart rate despite pain control suggests the intravascular volume is still low.", "✓ highlight BP 92/54.", "  Yes: the BP has fallen from 132/84 on arrival, which points to ongoing burn shock from capillary leak.", "✓ highlight Urine output 22 mL/h and 18 mL/h over the last 2 hours.", "  Yes: the goal is at least 40 mL/h (0.5 mL/kg/h); two hours below target means the rate should be increased per protocol.", "✓ highlight Lactate 3.9 mmol/L, up from 2.8.", "  Yes: a rising lactate after carbon monoxide has cleared means tissues are still poorly perfused.", "- Breath sounds clear; SpO₂ 99% on FiO₂ 0.40.", "  No: clear lungs and good oxygenation show no sign of fluid overload, which supports giving more fluid.", "- Temperature 36.9 °C (98.4 °F) with warm blankets and the room warmed.", "  No: a normal temperature shows the warming measures are working; it does not indicate a fluid problem.", "- Carboxyhemoglobin 4%.", "  No: carbon monoxide has largely cleared with 100% oxygen, so the rising lactate is from poor perfusion, not carbon monoxide.", "", "Why: The Parkland formula is only a starting point; urine output decides the rate. Here output is below 0.5 mL/kg/h, heart rate is rising, BP is falling and lactate is climbing, so the client is under-resuscitated. Inhalation injury often raises fluid needs above the formula. Whether the order uses Parkland or the ABLS starting dose of 2 mL/kg/%TBSA, the adult target is 0.5 mL/kg/h. The nurse reports this and increases lactated Ringer's per protocol.", "Tip: Judge burn resuscitation by hourly urine output first, then confirm with heart rate, BP and lactate, not by whether the formula volume was given."], "st": "awaiting"}]}, "packs": [{"id": "drill-med-1", "title": "Drills: Med Pass, part 1 of 2", "sub": "What to check before a medication, then give, hold or call. A pharmacist is especially welcome.", "n": 25, "reviewed": 0, "changed": 0}, {"id": "drill-med-2", "title": "Drills: Med Pass, part 2 of 2", "sub": "What to check before a medication, then give, hold or call. A pharmacist is especially welcome.", "n": 25, "reviewed": 0, "changed": 0}, {"id": "drill-first-1", "title": "Drills: Who's First, part 1 of 2", "sub": "Four patients, one nurse: who do you see first, and why not the others.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "drill-first-2", "title": "Drills: Who's First, part 2 of 2", "sub": "Four patients, one nurse: who do you see first, and why not the others.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "drill-sbar", "title": "Drills: SBAR", "sub": "Building a call to the provider line by line, and the order that comes back.", "n": 20, "reviewed": 0, "changed": 0}, {"id": "drill-calm", "title": "Drills: De-escalation", "sub": "What to say to an agitated patient, turn by turn. Psych or ED experience fits best.", "n": 22, "reviewed": 0, "changed": 0}, {"id": "ngn-shift-1", "title": "NCLEX questions after each shift, part 1 of 3", "sub": "Five per shift, including the two harder NCLEX challenge items.", "n": 19, "reviewed": 0, "changed": 0}, {"id": "ngn-shift-2", "title": "NCLEX questions after each shift, part 2 of 3", "sub": "Five per shift, including the two harder NCLEX challenge items.", "n": 19, "reviewed": 0, "changed": 0}, {"id": "ngn-shift-3", "title": "NCLEX questions after each shift, part 3 of 3", "sub": "Five per shift, including the two harder NCLEX challenge items.", "n": 17, "reviewed": 0, "changed": 0}, {"id": "bank-ms-1", "title": "NCLEX question bank: Medical-surgical, part 1 of 3", "sub": "68 standalone practice questions.", "n": 23, "reviewed": 0, "changed": 0}, {"id": "bank-ms-2", "title": "NCLEX question bank: Medical-surgical, part 2 of 3", "sub": "68 standalone practice questions.", "n": 23, "reviewed": 0, "changed": 0}, {"id": "bank-ms-3", "title": "NCLEX question bank: Medical-surgical, part 3 of 3", "sub": "68 standalone practice questions.", "n": 22, "reviewed": 0, "changed": 0}, {"id": "bank-ed", "title": "NCLEX question bank: Emergency", "sub": "23 standalone practice questions.", "n": 23, "reviewed": 0, "changed": 0}, {"id": "bank-comm", "title": "NCLEX question bank: Community and fundamentals", "sub": "21 standalone practice questions.", "n": 21, "reviewed": 0, "changed": 0}, {"id": "bank-icu", "title": "NCLEX question bank: Critical care", "sub": "21 standalone practice questions.", "n": 21, "reviewed": 0, "changed": 0}, {"id": "bank-sd", "title": "NCLEX question bank: Cardiac and step-down", "sub": "19 standalone practice questions.", "n": 19, "reviewed": 0, "changed": 0}, {"id": "bank-peds", "title": "NCLEX question bank: Pediatrics", "sub": "17 standalone practice questions.", "n": 17, "reviewed": 0, "changed": 0}, {"id": "bank-ob", "title": "NCLEX question bank: Obstetrics and newborn", "sub": "15 standalone practice questions.", "n": 15, "reviewed": 0, "changed": 0}, {"id": "bank-psy", "title": "NCLEX question bank: Psychiatric", "sub": "11 standalone practice questions.", "n": 11, "reviewed": 0, "changed": 0}, {"id": "bank-periop", "title": "NCLEX question bank: Perioperative", "sub": "7 standalone practice questions.", "n": 7, "reviewed": 0, "changed": 0}, {"id": "cases-1", "title": "Case studies: Pneumonia that turns septic; Heart failure that tips over; New diabetes in DKA", "sub": "Unfolding case studies: one client, six questions in clinical judgment order.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "cases-2", "title": "Case studies: Hip replacement with a clot that travels; Variceal bleed in cirrhosis; Stroke alert in the ED", "sub": "Unfolding case studies: one client, six questions in clinical judgment order.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "cases-3", "title": "Case studies: Preeclampsia that turns severe; Infant with gastroenteritis and dehydration; House fire with inhalation injury", "sub": "Unfolding case studies: one client, six questions in clinical judgment order.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "cases-4", "title": "Case studies: Ankle fracture that turns into alcohol withdrawal; Stomach bug that ends in hyperkalemia; New antibiotic that triggers serotonin syndrome", "sub": "Unfolding case studies: one client, six questions in clinical judgment order.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "cases-5", "title": "Case studies: COPD flare with pneumonia; Bleeding after a hysterectomy; Head injury after a motorcycle crash", "sub": "Unfolding case studies: one client, six questions in clinical judgment order.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "cases-6", "title": "Case studies: Placental abruption at 34 weeks; Preterm labor at 31 weeks; Bacterial meningitis in a preschooler", "sub": "Unfolding case studies: one client, six questions in clinical judgment order.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "cases-7", "title": "Case studies: Fever and rigidity on haloperidol", "sub": "Unfolding case studies: one client, six questions in clinical judgment order.", "n": 6, "reviewed": 0, "changed": 0}]};</script><script>(()=>{const v=window.Shift||{},d=v.tel,h=window.RI||{packs:[]},p=document.getElementById("app"),i=e=>String(e??"").replace(/[&<>"']/g,a=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[a]),k={awaiting:"Awaiting clinical review",reviewed:"Clinically reviewed",changed:"Changed since its review"},f=e=>(e.reviewed===e.n?'<span class="chip reviewed">Clinically reviewed</span>':`<span class="chip awaiting">${e.reviewed} of ${e.n} reviewed</span>`)+(e.changed?` <span class="chip changed">${e.changed} changed since review</span>`:"");if(!h.pack){const e=[["Drills",a=>a.id.startsWith("drill-")],["NCLEX questions after each shift",a=>a.id.startsWith("ngn-shift")],["NCLEX question bank",a=>a.id.startsWith("bank-")],["Unfolding case studies",a=>a.id.startsWith("cases-")]];p.innerHTML=`<a class="home" href="/">The Shift</a><h1>Clinical review: practice content</h1>
      <p class="muted">The drills and NCLEX practice questions, split into packs a clinician can check in one sitting (about 30 to 45 minutes each). Each item shows the right answer and why every other option is wrong. Pick a pack that matches your experience.</p>
      <p><a href="/review/">Reviewing a whole shift instead? Shift reviews are here.</a></p>
      ${e.map(([a,s])=>{const o=h.packs.filter(s);return o.length?`<h2>${i(a)}</h2><div class="shifts">${o.map(c=>`<a href="/review/practice/${i(c.id)}/"><div class="card"><div style="display:flex;justify-content:space-between;gap:.6rem;flex-wrap:wrap"><h3>${i(c.title)}</h3><span>${f(c)}</span></div><p class="muted" style="margin:.3rem 0 0">${c.n} items. ${i(c.sub)}</p></div></a>`).join("")}</div>`:""}).join("")}`;return}const n=h.pack,g="theshift.review.items."+n.id;let t={};try{t=JSON.parse(localStorage.getItem(g)||"{}")||{}}catch{t={}}t.marks=t.marks||{},t.notes=t.notes||{};const m=()=>{try{localStorage.setItem(g,JSON.stringify(t))}catch{}},E=e=>e?/^  /.test(e)?`<p class="why">${i(e.trim())}</p>`:/^✓/.test(e)?`<p class="ok"><b>${i(e)}</b></p>`:/^(- ✗|- |✗)/.test(e)?`<p class="no">${i(e.replace(/^- /,""))}</p>`:`<p>${i(e)}</p>`:'<div class="sp"></div>',x=e=>`<div class="verdict" role="group" aria-label="Your verdict">${[["ok","Accurate"],["fix","Needs change"],["unsure","Not sure"]].map(([a,s])=>`<button type="button" data-rid="${i(e)}" data-v="${a}" aria-pressed="${t.marks[e]===a}">${s}</button>`).join("")}</div>
    <textarea data-note="${i(e)}" placeholder="What should it say instead? A source helps." ${t.marks[e]==="fix"||t.notes[e]?"":"hidden"} aria-label="Your comment">${i(t.notes[e]||"")}</textarea>`,S=(e,a)=>`<div class="dec item" id="i-${a+1}"><div class="top"><span class="pts">${a+1}</span><span class="chip ${e.st}">${i(k[e.st])}${e.by?`: ${i(e.by)}`:""}</span><span>${i(e.id)} · version ${i(e.hash)}</span></div>
      <b>${i(e.title)}</b><div class="body">${e.body.map(E).join("")}</div>${x(e.id)}</div>`,r=n.items.map(e=>e.id);p.innerHTML=`<a class="home" href="/review/practice/">The Shift · Practice review</a>
    <h1>${i(n.title)}</h1>
    <p class="muted" style="margin:0">${i(n.sub)}</p>
    <div class="meta">${f(h.packs.find(e=>e.id===n.id)||{n:r.length,reviewed:0,changed:0})}<span class="chip">${r.length} items</span></div>
    <div class="card how"><h3>How to review</h3><ol>
      <li>For each item, check that the marked answer is right, that every other option is clearly wrong (not just slightly less good), that the numbers are current, and that any tip is safe to remember as a rule.</li>
      <li>Mark <b>Accurate</b>, <b>Needs change</b> or <b>Not sure</b>. Say what's wrong when something needs changing.</li>
      <li>Add your details and any references, then send. Your answers save in this browser as you go, so you can stop and come back.</li></ol>
      <p class="muted" style="margin-bottom:0">These are practice items for nursing students, written to common US teaching. Judge them against what a safe, current standard of care would teach a new nurse, not your facility's policy.</p></div>
    <div class="bar"><span id="count"></span><span class="prog" aria-hidden="true"><i id="progbar"></i></span><a class="btn" href="#send" style="min-height:38px">Send</a></div>

    <div class="grid2"><div><label for="rv-name">Name</label><input id="rv-name" type="text" autocomplete="name" data-f="name" value="${i(t.name||"")}"></div>
      <div><label for="rv-cred">Credentials</label><input id="rv-cred" type="text" placeholder="RN, MSN, PharmD…" data-f="cred" value="${i(t.cred||"")}"></div>
