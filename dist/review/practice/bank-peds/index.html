<style>
:root{--bg:#E6EDF0;--surface:#FBFCFC;--surface-2:#EDF2F4;--ink:#152238;--ink-2:#4D5A6F;--line:#CAD5DB;--teal:#2449A8;--teal-ink:#fff;--red:#B3342B;--red-bg:#F8E1DE;--good:#2B7249;--good-bg:#E0F0E6;--amber:#A96C0E;--amber-bg:#FBEFD6;
  --serif:"Barlow Condensed","Arial Narrow",sans-serif;--sans:"Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161C;--surface:#1A1F27;--surface-2:#212833;--ink:#E7E4DB;--ink-2:#A0A5AE;--line:#343C48;--teal:#93B4E4;--teal-ink:#0F1B2C;--red:#F0766B;--red-bg:#3b1d1b;--good:#72c692;--good-bg:#16301f;--amber:#E9AE4E;--amber-bg:#35291a}}
:root[data-theme="dark"]{--bg:#12161C;--surface:#1A1F27;--surface-2:#212833;--ink:#E7E4DB;--ink-2:#A0A5AE;--line:#343C48;--teal:#93B4E4;--teal-ink:#0F1B2C;--red:#F0766B;--red-bg:#3b1d1b;--good:#72c692;--good-bg:#16301f;--amber:#E9AE4E;--amber-bg:#35291a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
main{max-width:52rem;margin:0 auto;padding:clamp(1.2rem,5vw,3rem) 16px calc(5rem + env(safe-area-inset-bottom))}
a{color:var(--teal)}
.home{font-family:var(--serif);font-weight:700;font-size:1.1rem;letter-spacing:.04em;text-transform:uppercase;background:var(--ink);color:var(--bg);padding:.28em .55em .22em;border-radius:2px;text-decoration:none}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.9rem,6vw,2.6rem);line-height:1.1;letter-spacing:0;margin:1.6rem 0 .3rem}
h2{font-size:1.15rem;margin:2.4rem 0 .6rem}
h3{font-size:1rem;margin:0}
p{margin:.5rem 0}
.muted{color:var(--ink-2)}
.meta{display:flex;flex-wrap:wrap;gap:.4rem .6rem;margin-top:.6rem}
.chip{display:inline-flex;align-items:center;padding:.15em .6em;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--surface-2);border:1px solid var(--line)}
.chip.awaiting{background:var(--amber-bg);border-color:transparent;color:var(--amber)}
.chip.reviewed{background:var(--good-bg);border-color:transparent;color:var(--good)}
.chip.changed{background:var(--red-bg);border-color:transparent;color:var(--red)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem 1.1rem;margin:.8rem 0}
.how ol{margin:.4rem 0 0;padding-left:1.2rem}.how li{margin:.2rem 0}
label{display:block;font-weight:600;font-size:.9rem;margin:.7rem 0 .25rem}
input[type=text],input[type=email],textarea,select{width:100%;min-height:44px;padding:.5em .7em;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:5rem;resize:vertical}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:0 1rem}
details.pt{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:.6rem 0}
details.pt>summary{cursor:pointer;padding:.85rem 1rem;font-weight:600;list-style-position:inside}
details.pt>div{padding:0 1rem 1rem}
table{width:100%;border-collapse:collapse;font-size:.88rem;margin:.4rem 0}
th,td{text-align:left;vertical-align:top;padding:.35rem .5rem .35rem 0;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--ink-2);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
.scroll{overflow-x:auto}
ul.plain{margin:.3rem 0;padding-left:1.1rem}
.dec{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:.85rem 1rem;margin:.6rem 0}
.dec.pos{border-left-color:var(--good)}.dec.neg{border-left-color:var(--red)}
.dec .top{display:flex;flex-wrap:wrap;gap:.3rem .5rem;align-items:center;font-size:.78rem;color:var(--ink-2);font-weight:600}
.pts{font-weight:700;padding:.05em .45em;border-radius:4px;background:var(--surface-2)}
.pos .pts{color:var(--good);background:var(--good-bg)}.neg .pts{color:var(--red);background:var(--red-bg)}
.dec b{display:block;margin:.35rem 0 .15rem;font-size:1rem}
.dec .why{font-family:var(--sans);color:var(--ink-2);margin:0}
.dec .src{font-size:.75rem;color:var(--ink-2);margin-top:.35rem}
.verdict{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.7rem}
.verdict button{min-height:40px;padding:.35em .9em;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer}
.verdict button[aria-pressed="true"][data-v="ok"]{background:var(--good);border-color:var(--good);color:var(--teal-ink)}
.verdict button[aria-pressed="true"][data-v="fix"]{background:var(--red);border-color:var(--red);color:var(--teal-ink)}
.verdict button[aria-pressed="true"][data-v="unsure"]{background:var(--amber);border-color:var(--amber);color:var(--teal-ink)}
.dec textarea{margin-top:.5rem;min-height:3.6rem}
.opt{padding:.4rem 0;border-bottom:1px solid var(--line);font-size:.92rem}.opt:last-child{border:0}
.opt i{font-style:normal;font-weight:700;font-size:.75rem;padding:.05em .4em;border-radius:4px;margin-right:.4rem;background:var(--surface-2)}
.bar{position:sticky;top:0;z-index:5;margin:0 -16px;padding:.6rem 16px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:.6rem;font-size:.9rem}
.bar .prog{display:block;flex:1;min-width:4rem;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;max-width:12rem}.bar .prog i{display:block;height:100%;background:var(--teal)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:.55em 1.2em;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn-primary{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.row{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1rem}
.check{display:flex;gap:.6rem;align-items:flex-start;font-weight:500;margin-top:1rem}
.check input{width:1.2rem;height:1.2rem;margin-top:.2rem;flex:none}
.msg{margin-top:.8rem;font-weight:600}.msg.err{color:var(--red)}.msg.ok{color:var(--good)}
pre{white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:.8rem;font-size:.8rem;max-height:18rem;overflow:auto}
.shifts a{display:block;text-decoration:none;color:inherit}
.shifts .card:hover{border-color:var(--ink-2)}
</style>
<style>.item .body p{margin:.15rem 0}.item .body .why{color:var(--ink-2);font-size:.92rem;margin:0 0 .35rem 1.1rem}.item .body .ok b{display:inline;margin:0;color:var(--good)}.item .body .no{color:var(--ink)}.item .body .sp{height:.5rem}.item>b{margin-bottom:.5rem}</style></head>

 decision-makers.", "- Giving bedside handoff to the oncoming nurse in a quiet voice", "  No: sharing information with the care team for treatment is permitted under HIPAA. Bedside handoff also lets the family take part.", "✓ Posting a photo of the unit's holiday decorations in which a child's name is visible on a door sign", "  Yes: a visible name on a pediatric unit identifies a client and discloses that the child is hospitalized. Removing the face is not enough if any identifier remains.", "✓ Telling a coworker in the cafeteria the diagnosis of a well-known local child", "  Yes: discussing a client in a public area with someone not involved in care is a breach. Care discussions belong in private areas among the care team.", "✓ Posting \"Rough night, lost a little one in room 12\" on a personal account with no name", "  Yes: the date, unit and room number can identify the child to family and community. The trap is believing that leaving out the name makes a post private.", "✓ Opening the chart of a classmate's child admitted to another unit to see how she is doing", "  Yes: accessing a record without a care-related need is a privacy violation even if the nurse never shares it. Access is limited to what the nurse's role requires.", "", "Why: HIPAA permits sharing health information for treatment, payment and operations, but any other disclosure, or access without a care need, is a violation. On social media, any detail that could identify a client, such as a name, room, date or unique situation, makes a post a breach. Nurses can face discipline from the employer and the state board of nursing.", "Tip: Ask two questions: does this person need the information to care for the client, and could anyone identify the client from it."], "st": "awaiting"}, {"id": "ngn:qb-mgmt-16", "hash": "8b27abfb7e", "title": "Suspected child abuse · Prioritize hypotheses", "body": ["A 2-month-old is brought to the pediatric emergency area by a parent, who says the infant's leg got caught in the crib slats 2 days ago. X-ray shows a spiral fracture of the femur. The nurse notes bruises of different colors on the chest and back. Sclerae are white. Coagulation studies are normal. The parent becomes irritable when asked for details and gives a different story to the provider.", "", "Complete the diagram: the condition the client is most likely experiencing, two actions the nurse should take, and two parameters the nurse should monitor.", "", "Condition:", "✓ Suspected physical abuse", "  Yes: a spiral femur fracture in a nonmobile infant, bruises of different ages, a delay in care and a changing story are classic warning signs of abuse.", "- Accidental crib injury", "  No: a 2-month-old cannot move enough to twist a femur in crib slats. The mechanism does not match the infant's development.", "- Osteogenesis imperfecta", "  No: this bone disorder often causes blue sclerae and many fractures; white sclerae and a story that keeps changing point to abuse instead.", "- Bleeding disorder", "  No: normal coagulation studies make a bleeding disorder unlikely as the cause of the bruising.", "Actions to take:", "✓ Report suspected abuse to CPS and notify provider", "  Yes: nurses are mandated reporters; reasonable suspicion is enough to report, and good-faith reports are legally protected.", "✓ Document injuries and quote caregivers verbatim", "  Yes: objective descriptions of injuries and caregivers' exact words are key evidence and support the investigation.", "- Confront the parent directly to ask whether they injured the infant", "  No: confronting the parent can escalate the situation and endanger the infant. Investigation is the role of child protective services and law enforcement.", "- Wait to notify CPS until the hospital team confirms abuse occurred", "  No: the law requires reporting on suspicion, not proof. Waiting can leave the infant in danger.", "- Discharge the infant home with a next-day orthopedic clinic visit", "  No: discharging the infant to a possibly unsafe home before a protective assessment could lead to further injury.", "Parameters to monitor:", "✓ Infant-caregiver interaction", "  Yes: how caregivers respond to the infant and how the infant responds to them gives information the protective team needs.", "✓ Pain and limb neurovascular check", "  Yes: the fracture needs ongoing pain control and checks of circulation, sensation and movement in the leg.", "- Serum calcium and vitamin D panel", "  No: calcium does not explain this injury pattern and is not a key ongoing parameter here.", "- Weekly home wet diaper counts", "  No: home diaper counts cannot be monitored while the infant is in the hospital and do not address safety.", "- Height percentile compared with siblings", "  No: comparing height with siblings does not help assess abuse or the current injury.", "", "Why: Injuries that do not match the history or the child's developmental stage, bruises of different ages and a delay in seeking care are red flags for abuse. Nurses must report reasonable suspicion to child protective services; they do not need proof, and good-faith reporters are protected from liability. The nurse documents objectively and keeps the infant safe while treating the injury.", "Tip: Check whether the injury fits the child's age and the story; when it does not, report the suspicion rather than investigating it yourself."], "st": "awaiting"}, {"id": "ngn:qb-mgmt-23", "hash": "6187ca0850", "title": "Chain of command · Take action", "body": ["A nurse on a pediatric unit receives a new order for acetaminophen 800 mg by mouth every 6 hours for an 8 kg infant. The usual dose is 10 to 15 mg/kg. The nurse calls the prescriber, who says, \"Just give it, it's fine,\" and hangs up.", "", "Place the nurse's actions in the order they should occur, from the time she first reads the order.", "", "Correct order:", "1. Hold the dose and check the order against a pediatric drug reference", "  Yes: the safe dose for 8 kg is 80 to 120 mg, so 800 mg is a tenfold error. The nurse never gives a dose she believes is unsafe.", "2. Call the prescriber, state the weight-based safe range, and ask for clarification", "  Yes: the prescriber is the first person to contact, and giving the specific safe range helps the prescriber see the error.", "3. Notify the charge nurse that the prescriber will not change an unsafe order", "  Yes: when the prescriber does not resolve the concern, the next step in the chain of command is the charge nurse.", "4. Escalate through the nursing supervisor to the prescriber's supervising physician per facility policy", "  Yes: if the issue is still unresolved, it moves up the chain through nursing administration to medical leadership.", "5. Document the communication factually and complete a safety report", "  Yes: factual documentation of who was contacted and when, plus a safety report, supports follow-up and system learning.", "", "Why: Nurses are legally accountable for every medication they give, even with an order. When an order is unsafe, the nurse holds it, clarifies with the prescriber, and if needed goes up the chain of command until it is resolved. A pharmacist can also be involved, but the nurse must not give the dose while the concern stands.", "Tip: Never give a dose you believe is unsafe; clarify with the prescriber first, then move up the chain of command one level at a time."], "st": "awaiting"}, {"id": "ngn:qb-safe-5", "hash": "b33b3b2c9c", "title": "Droplet precautions · Generate solutions", "body": ["A 7-year-old is admitted to the pediatric unit with fever, a stiff neck and a purple, non-blanching rash on the legs. Bacterial meningitis caused by Neisseria meningitidis is suspected, and IV antibiotics have just been started.", "", "Which actions should the nurse include in the plan of care? Select all that apply.", "", "- Wear a fit-tested N95 respirator and request a negative-pressure room", "  No: these are airborne precautions. Droplets fall within a short distance, so special air handling is not needed for meningococcal disease.", "- Keep the room door closed at all times", "  No: a closed door is required for airborne precautions, not droplet. Large droplets do not travel through room air into the hallway.", "✓ Place the child in a private room", "  Yes: droplet precautions call for a private room, or cohorting with a child who has the same infection, to limit close contact.", "✓ Wear a surgical mask when entering the room", "  Yes: meningococcus spreads in large respiratory droplets, and a surgical mask protects the nurse's nose and mouth during close contact.", "✓ Continue droplet precautions until she has received 24 hours of effective antibiotic therapy", "  Yes: after 24 hours of effective therapy the child is no longer considered infectious, so precautions can then be discontinued.", "✓ Place a surgical mask on the child if she must leave the room for a test", "  Yes: masking the source contains droplets during transport and protects others in hallways and imaging areas.", "", "Why: Meningococcal meningitis is spread by large respiratory droplets, so the child needs droplet precautions: a private room, a surgical mask for anyone entering, and a mask on the child during transport. Precautions continue until 24 hours of effective antibiotics. Close contacts are usually referred for preventive antibiotics.", "Tip: Know the airborne list cold; anything spread by large droplets, such as meningococcus, pertussis and influenza, needs only a surgical mask and a private room."], "st": "awaiting"}, {"id": "ngn:qb-hp-1", "hash": "ddbc4bdcf9", "title": "Infant developmental milestones · Recognize cues", "body": ["A parent brings a 9-month-old to the pediatric clinic for a well-child visit. The infant was born at term and is growing along the 50th percentile for weight and length.", "", "Which finding reported by the parent requires follow-up?", "", "✓ He cannot sit up without support", "  Yes: most infants sit without support by 9 months. Not doing so suggests a motor delay that needs developmental screening and possible referral.", "- He is not walking yet", "  No: independent walking usually begins around 12 months and can be later. It is not expected at 9 months.", "- He cries when his parent leaves the room", "  No: separation and stranger anxiety are expected at this age and show attachment to caregivers.", "- He babbles \"mamama\" without using it for a specific person", "  No: repetitive babbling is expected at 9 months; meaningful words such as mama for a parent come around 12 months.", "", "Why: At 9 months, infants are expected to sit without support, babble repeated sounds and show separation anxiety. Walking is a later milestone. A term infant who cannot sit unsupported at this age needs further screening for a motor delay.", "Tip: Know one or two anchor milestones for each age, then pick the finding that falls behind the expected timeline, not one that is simply not yet due."], "st": "awaiting"}, {"id": "ngn:qb-hp-10", "hash": "58c0e15b36", "title": "Safe infant sleep · Recognize cues", "body": ["A 2-month-old is seen in the pediatric clinic for a well-child visit. The nurse documents the parent's description of the infant's sleep routine.", "", "Highlight the findings that require follow-up.", "", "- Sleeps on her back for naps and at night.", "  No: the supine position for every sleep is the single most important way to reduce the risk of sudden infant death.", "✓ highlight The crib has bumper pads and a soft quilt to keep her warm.", "  Yes: bumpers and soft bedding raise the risk of suffocation and entrapment; the crib should hold only a firm, flat mattress and fitted sheet.", "- Sleeps in her own bassinet in her parents' room.", "  No: room-sharing without bed-sharing is recommended, ideally for at least the first 6 months.", "✓ highlight On weekends she sleeps in our bed between us.", "  Yes: bed-sharing raises the risk of suffocation and sudden unexpected infant death, especially for infants this young.", "- Takes a pacifier at bedtime.", "  No: offering a pacifier at sleep time is associated with a lower risk of sudden infant death.", "✓ highlight Often falls asleep in her car seat and stays in it in the crib overnight because she spits up.", "  Yes: sitting devices are not safe for routine sleep because the head can fall forward and block the airway. Spitting up is not a reason to change position.", "- No one smokes in the home.", "  No: a smoke-free home lowers the risk of sudden infant death. This is a protective finding.", "", "Why: AAP safe sleep guidance is: back to sleep for every sleep, on a firm flat surface with no soft bedding or bumpers, in the parents' room but not in their bed. Car seats and other sitting devices are not for routine sleep. Pacifiers and a smoke-free home are protective.", "Tip: Picture the ideal sleep space (alone, on the back, in a bare crib) and highlight everything that differs from it."], "st": "awaiting"}, {"id": "ngn:qb-pharm-6", "hash": "73073a3c04", "title": "Pediatric safe dose · Analyze cues", "body": ["A 4-year-old weighing 16 kg has a fever of 38.9 °C (102 °F). The order is acetaminophen 240 mg PO every 6 hours as needed. The safe dose range is 10 to 15 mg/kg/dose. The bottle is labeled acetaminophen oral suspension 160 mg/5 mL.", "", "After confirming the dose is within the safe range, how many mL should the nurse give?", "", "Answer: 7.5 mL. Round to the nearest tenth.", "  Safe range: 10 mg/kg × 16 kg = 160 mg; 15 mg/kg × 16 kg = 240 mg", "  Ordered dose 240 mg is within 160 to 240 mg, so it is safe to give", "  Volume: 240 mg ÷ 160 mg × 5 mL = 7.5 mL", "", "Why: Always check a pediatric dose against the weight-based range before calculating the volume. This order sits at the top of the range, so it is safe. Measure the liquid with an oral syringe, not a household spoon.", "Tip: If a pediatric dose falls outside the safe range, the correct action is to hold and clarify, not to calculate."], "st": "awaiting"}, {"id": "ngn:qb-risk-14", "hash": "49ec7556b2", "title": "NG tube placement · Evaluate outcomes", "body": ["A 7-year-old (22 kg) on the pediatric unit has a new nasogastric tube placed for continuous feedings after a head injury. The tube was measured and inserted to the marked length and taped in place.", "", "Which finding confirms correct placement before the first feeding is started?", "", "- No coughing or distress during insertion", "  No: A tube can enter the airway without coughing, especially in a child with reduced level of consciousness.", "- Clear fluid aspirated from the tube", "  No: Appearance alone cannot tell gastric fluid from respiratory or pleural fluid. pH testing can support placement checks later but does not replace X-ray initially.", "✓ An X-ray report showing the tube tip in the stomach", "  Yes: Radiographic confirmation is the standard for verifying a newly placed feeding tube before anything is put through it.", "- A whooshing sound over the stomach when air is injected", "  No: Auscultation is unreliable because air injected into the lung or esophagus can sound the same over the abdomen.", "", "Why: A misplaced feeding tube can deliver formula into the lungs. Initial placement of a feeding tube is confirmed by X-ray before first use. Afterward, the nurse checks the external mark and follows facility policy, such as aspirate pH, before each feeding or medication.", "Tip: When asked what confirms tube placement, choose the most reliable method, not the quickest bedside one."], "st": "awaiting"}, {"id": "ngn:qb-phys-16", "hash": "0341c0556d", "title": "Sickle cell crisis · Evaluate outcomes", "body": ["A 12-year-old with sickle cell disease was admitted 24 hours ago for a vaso-occlusive crisis with severe pain in both legs. She is receiving IV fluids and scheduled IV opioid analgesia. The nurse is evaluating her response.", "", "Which findings indicate the plan of care is effective? Select all that apply.", "", "- Hemoglobin 6.1 g/dL, down from 8.0 g/dL on admission", "  No: a sharp drop in hemoglobin can mean splenic sequestration or aplastic crisis and requires urgent follow-up.", "✓ Walking to the bathroom with assistance", "  Yes: improved mobility reflects less pain and lowers the risk of complications such as atelectasis.", "✓ Pain rated 3 of 10, down from 9 of 10 on admission", "  Yes: relief of pain shows that hydration and analgesia are breaking the cycle of sickling and ischemia.", "- New chest pain with a temperature of 38.6 °C (101.5 °F)", "  No: new chest pain and fever suggest acute chest syndrome, a life-threatening complication that needs immediate reporting.", "✓ SpO₂ 97% on room air with clear breath sounds", "  Yes: normal oxygenation and clear lungs show no sign of acute chest syndrome, a major complication.", "✓ Urine output 1.2 mL/kg/h", "  Yes: adequate urine output shows the IV fluids have restored hydration, which reduces blood viscosity and sickling.", "", "Why: Vaso-occlusive crisis is treated with hydration, prompt and adequate opioid analgesia, and oxygen if hypoxemic. Success shows up as less pain, good urine output, normal oxygenation and returning mobility. New chest symptoms or a falling hemoglobin signal complications, not improvement.", "Tip: Match each option to a goal of the plan; findings that show a new problem cannot show the plan is working."], "st": "awaiting"}, {"id": "ngn:qb-psy-4", "hash": "4e2c17ab42", "title": "Suspected child abuse · Generate solutions", "body": ["An 8-month-old is admitted to the pediatric unit with a spiral fracture of the femur. The parent says the infant rolled off the couch. The infant is not yet crawling or pulling to stand. The nurse also notes bruises on the infant's back.", "", "Which plan by the nurse is best?", "", "- Ask the provider whether a report is needed", "  No: each mandated reporter has a personal duty to report. The nurse can involve the provider, but in most states cannot hand off the obligation; follow state law and facility policy.", "- Ask the parent to explain how the fracture could have happened from a short fall", "  No: confronting the parent can make them defensive and may lead them to remove the child. Investigation is the role of the agency.", "✓ Report the suspected abuse to child protective services and document the injuries and the parent's exact words", "  Yes: nurses are mandated reporters, and reasonable suspicion is enough to report. Objective documentation supports the investigation.", "- Wait until the skeletal survey results are back before deciding whether to report", "  No: the law requires a report based on reasonable suspicion, not proof. Waiting can leave the infant in danger.", "", "Why: A spiral fracture and back bruises in an infant who cannot yet crawl do not fit a short fall from a couch. An injury that does not match the child's developmental stage is a red flag for abuse. Nurses must report reasonable suspicion and document objectively; they do not need proof. Reporting procedures vary by state and facility.", "Tip: Compare the injury to the child's developmental abilities; when the story does not fit, the answer is to report."], "st": "awaiting"}, {"id": "ngn:sa-pharm-3", "hash": "f2243c7cb6", "title": "Insulin with a missed meal · Analyze cues", "body": ["A 13-year-old with type 1 diabetes is admitted to the pediatric unit for diabetes education. At 0730 her glucose is 142 mg/dL. Her orders are NPH insulin 12 units subcutaneous at breakfast and insulin lispro by carbohydrate count with each meal. Breakfast trays arrive at 0745.", "", "Complete the sentences.", "", "Blank 1:", "- only if her glucose is above 250 mg/dL", "  No: mealtime insulin covers the carbohydrate she eats, not just high readings. Holding it would cause a post-meal spike.", "✓ within 15 minutes before she starts eating", "  Yes: rapid-acting insulin starts working in about 15 minutes, so it is given right before the meal and only when the food is there.", "- 30 to 60 minutes before the meal tray arrives", "  No: 30 to 60 minutes before a meal fits regular insulin. Giving lispro that early risks hypoglycemia before food arrives.", "Blank 2:", "✓ mid-afternoon", "  Yes: NPH is intermediate-acting and peaks about 4 to 12 hours after injection, so a morning dose peaks in the afternoon.", "- next morning before breakfast", "  No: a morning NPH dose has mostly worn off by the next morning. Overnight lows relate to an evening dose.", "- first 15 minutes after the injection", "  No: NPH begins acting in 1 to 2 hours and does not peak right away. Fast onset belongs to rapid-acting insulin.", "Blank 3:", "- peak about 2 hours after injection", "  No: a 2-hour peak describes rapid or short-acting insulin, not glargine.", "✓ provide steady basal coverage without a pronounced peak", "  Yes: glargine is long-acting and releases at a fairly constant rate over about 24 hours, mimicking basal insulin.", "- be mixed with lispro in the same syringe", "  No: glargine should not be mixed with other insulins because mixing changes its absorption.", "", "Why: Matching insulin timing to food prevents both highs and lows. Rapid-acting insulin goes in right before eating. Intermediate-acting NPH peaks hours later, so the nurse watches for lows and makes sure snacks and meals are on time. Long-acting glargine provides a flat background level and is not mixed.", "Tip: Learn each insulin by onset, peak and duration; the peak tells you when to watch for hypoglycemia."], "st": "awaiting"}, {"id": "ngn:calc-13", "hash": "c9aa5c89f6", "title": "Microdrip rate for a child · Take action", "body": ["A 6-year-old client has an order for IV fluid at 75 mL/h. The pump has failed, and the nurse sets up microdrip tubing with a drop factor of 60 gtt/mL while a replacement pump is obtained.", "", "At how many drops per minute should the nurse set the infusion?", "", "Answer: 75 gtt/min. Round to the nearest whole number.", "  Formula: (mL/h x drop factor) / 60 min.", "  (75 mL x 60 gtt/mL) / 60 min", "  = 75", "  Answer: 75 gtt/min", "", "Why: With microdrip tubing, the drop factor of 60 cancels the 60 minutes, so gtt/min equals mL/h. Children are at higher risk of fluid overload, which is why microdrip tubing and a pump are preferred, and the gravity line needs close monitoring until a pump is back.", "Tip: With a 60 gtt/mL drop factor, the gtt/min equals the mL/h; use it as a quick check."], "st": "awaiting"}, {"id": "ngn:calc-16", "hash": "d0a052cb8b", "title": "Pediatric maximum daily dose · Generate solutions", "body": ["A 3-year-old client with acute otitis media weighs 33 lb. The provider orders amoxicillin 875 mg PO every 12 hours. The pediatric reference lists high-dose amoxicillin as 80 to 90 mg/kg/day divided every 12 hours.", "", "What is the maximum safe daily dose for this child in mg?", "", "Answer: 1350 mg/day. Round to the nearest whole number.", "  Weight: 33 lb / 2.2 = 15 kg.", "  Maximum: 90 mg/kg/day x 15 kg = 1,350 mg/day.", "  Ordered: 875 mg x 2 doses = 1,750 mg/day.", "  Answer: 1,350 mg/day; the order exceeds the maximum, so hold and clarify", "", "Why: Children have narrow safety margins and doses are written per kg, so the nurse checks every pediatric order against the safe range before giving it. Here the daily total is above the maximum, so the nurse holds the dose and contacts the prescriber rather than giving it or adjusting it on their own.", "Tip: Compare like with like: convert the order to a daily total before checking it against a mg/kg/day range."], "st": "awaiting"}, {"id": "ngn:calc-17", "hash": "749505506e", "title": "Pediatric acetaminophen suspension volume · Take action", "body": ["A 2-year-old client with a fever of 38.9 °C (102 °F) weighs 22 lb. The order reads acetaminophen 15 mg/kg PO every 6 hours as needed for fever. On hand: acetaminophen oral suspension 160 mg/5 mL.", "", "How many mL should the nurse give?", "", "Answer: 4.7 mL. Round to the nearest tenth.", "  Weight: 22 lb / 2.2 = 10 kg.", "  Dose: 15 mg/kg x 10 kg = 150 mg.", "  Volume: 150 mg / 160 mg x 5 mL = 4.69 mL.", "  Answer: 4.7 mL", "", "Why: Acetaminophen overdose causes liver injury, and children are often given it from more than one product at home. Calculate from the current weight, use the oral syringe that matches the concentration, and confirm the total daily amount stays within the limit.", "Tip: Carry full decimals through the steps and round only the final mL, or a small early rounding error can change the answer."], "st": "awaiting"}, {"id": "ngn:calc-18", "hash": "9d1fb02f5f", "title": "Pediatric ibuprofen maximum dose · Generate solutions", "body": ["A 5-year-old client weighs 41 lb. The provider orders ibuprofen 200 mg PO every 6 hours as needed for pain. The reference dose is ibuprofen 10 mg/kg per dose.", "", "What is the maximum single dose for this child in mg?", "", "Answer: 186 mg. Round to the nearest whole number.", "  Weight: 41 lb / 2.2 = 18.64 kg (keep the full value until the last step).", "  Maximum single dose: 10 mg/kg x 18.64 kg = 186.4 mg, rounded to 186 mg.", "  Compare: ordered 200 mg is more than 186 mg.", "  Answer: 186 mg; the order exceeds the safe dose, so hold and clarify", "", "Why: The safe dose check is the nurse's last barrier before a pediatric dosing error reaches the child. An ordered dose above the calculated maximum is not given; the nurse contacts the prescriber and documents the clarification.", "Tip: In a safe dose item, finish by comparing the order with your number and decide: give, or hold and clarify."], "st": "awaiting"}, {"id": "ngn:calc-26", "hash": "5a04494f99", "title": "Holliday-Segar daily maintenance fluid · Take action", "body": ["A 7-year-old client who is NPO before surgery weighs 23 kg. The provider orders maintenance IV fluids by the Holliday-Segar method: 100 mL/kg for the first 10 kg, 50 mL/kg for the next 10 kg, and 20 mL/kg for each kg over 20.", "", "What is the child's maintenance fluid requirement for 24 hours?", "", "Answer: 1560 mL/day. Round to the nearest whole number.", "  First 10 kg: 10 x 100 = 1,000 mL.", "  Next 10 kg: 10 x 50 = 500 mL.", "  Remaining 3 kg: 3 x 20 = 60 mL.", "  Total: 1,000 + 500 + 60 = 1,560 mL/day", "  Answer: 1,560 mL/day", "", "Why: Maintenance needs are higher per kg in small children because of their higher metabolic rate and body surface area. The nurse checks the ordered rate against this calculation and monitors urine output, at least 1 mL/kg/h in a child, to judge hydration.", "Tip: Split the weight into buckets of 10, 10, and the rest; the per-kg amount drops in each bucket."], "st": "awaiting"}, {"id": "ngn:calc-27", "hash": "5ce4d78945", "title": "Hourly maintenance by 4-2-1 rule · Take action", "body": ["A 2-year-old client with gastroenteritis weighs 14 kg. The order reads maintenance IV fluids by the 4-2-1 rule: 4 mL/kg/h for the first 10 kg, 2 mL/kg/h for the next 10 kg, and 1 mL/kg/h for each kg over 20.", "", "At what rate should the nurse set the pump?", "", "Answer: 48 mL/h. Round to the nearest whole number.", "  First 10 kg: 10 x 4 = 40 mL/h.", "  Remaining 4 kg: 4 x 2 = 8 mL/h.", "  Total: 40 + 8 = 48 mL/h.", "  Answer: 48 mL/h", "", "Why: The 4-2-1 rule is the hourly form of the Holliday-Segar method, so it gives a pump rate directly. A toddler with gastroenteritis can lose fluid quickly, so the nurse compares intake and output and weighs the child daily on the same scale.", "Tip: Use 4-2-1 when you need mL/h and 100-50-20 when you need mL/day; do not mix the two."], "st": "awaiting"}]}, "packs": [{"id": "drill-med-1", "title": "Drills: Med Pass, part 1 of 3", "sub": "What to check before a medication, then give, hold or call. A pharmacist is especially welcome.", "n": 21, "reviewed": 0, "changed": 0}, {"id": "drill-med-2", "title": "Drills: Med Pass, part 2 of 3", "sub": "What to check before a medication, then give, hold or call. A pharmacist is especially welcome.", "n": 21, "reviewed": 0, "changed": 0}, {"id": "drill-med-3", "title": "Drills: Med Pass, part 3 of 3", "sub": "What to check before a medication, then give, hold or call. A pharmacist is especially welcome.", "n": 21, "reviewed": 0, "changed": 0}, {"id": "drill-first-1", "title": "Drills: Who's First, part 1 of 2", "sub": "Four patients, one nurse: who do you see first, and why not the others.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "drill-first-2", "title": "Drills: Who's First, part 2 of 2", "sub": "Four patients, one nurse: who do you see first, and why not the others.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "drill-sbar", "title": "Drills: SBAR", "sub": "Building a call to the provider line by line, and the order that comes back.", "n": 20, "reviewed": 0, "changed": 0}, {"id": "drill-calm", "title": "Drills: De-escalation", "sub": "What to say to an agitated patient, turn by turn. Psych or ED experience fits best.", "n": 22, "reviewed": 0, "changed": 0}, {"id": "ngn-shift-1", "title": "NCLEX questions after each shift, part 1 of 3", "sub": "Five per shift, including the two harder NCLEX challenge items.", "n": 19, "reviewed": 0, "changed": 0}, {"id": "ngn-shift-2", "title": "NCLEX questions after each shift, part 2 of 3", "sub": "Five per shift, including the two harder NCLEX challenge items.", "n": 19, "reviewed": 0, "changed": 0}, {"id": "ngn-shift-3", "title": "NCLEX questions after each shift, part 3 of 3", "sub": "Five per shift, including the two harder NCLEX challenge items.", "n": 17, "reviewed": 0, "changed": 0}, {"id": "bank-ms-1", "title": "NCLEX question bank: Medical-surgical, part 1 of 3", "sub": "68 standalone practice questions.", "n": 23, "reviewed": 0, "changed": 0}, {"id": "bank-ms-2", "title": "NCLEX question bank: Medical-surgical, part 2 of 3", "sub": "68 standalone practice questions.", "n": 23, "reviewed": 0, "changed": 0}, {"id": "bank-ms-3", "title": "NCLEX question bank: Medical-surgical, part 3 of 3", "sub": "68 standalone practice questions.", "n": 22, "reviewed": 0, "changed": 0}, {"id": "bank-ed", "title": "NCLEX question bank: Emergency", "sub": "23 standalone practice questions.", "n": 23, "reviewed": 0, "changed": 0}, {"id": "bank-comm", "title": "NCLEX question bank: Community and fundamentals", "sub": "21 standalone practice questions.", "n": 21, "reviewed": 0, "changed": 0}, {"id": "bank-icu", "title": "NCLEX question bank: Critical care", "sub": "21 standalone practice questions.", "n": 21, "reviewed": 0, "changed": 0}, {"id": "bank-sd", "title": "NCLEX question bank: Cardiac and step-down", "sub": "19 standalone practice questions.", "n": 19, "reviewed": 0, "changed": 0}, {"id": "bank-peds", "title": "NCLEX question bank: Pediatrics", "sub": "17 standalone practice questions.", "n": 17, "reviewed": 0, "changed": 0}, {"id": "bank-ob", "title": "NCLEX question bank: Obstetrics and newborn", "sub": "15 standalone practice questions.", "n": 15, "reviewed": 0, "changed": 0}, {"id": "bank-psy", "title": "NCLEX question bank: Psychiatric", "sub": "11 standalone practice questions.", "n": 11, "reviewed": 0, "changed": 0}, {"id": "bank-periop", "title": "NCLEX question bank: Perioperative", "sub": "7 standalone practice questions.", "n": 7, "reviewed": 0, "changed": 0}, {"id": "cases-1", "title": "Case studies: 78-year-old admitted with community-acquired pneumonia; 72-year-old with worsening ankle swelling and dyspnea; 14-year-old with nausea, belly pain, and rapid breathing", "sub": "Unfolding case studies: one client, six questions in clinical judgment order.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "cases-2", "title": "Case studies: 68-year-old on day 2 after hip arthroplasty; 56-year-old with cirrhosis and hematemesis; 71-year-old brought to the ED with right-sided weakness", "sub": "Unfolding case studies: one client, six questions in clinical judgment order.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "cases-3", "title": "Case studies: 32-year-old at 36 weeks with rising blood pressure; 8-month-old with two days of vomiting and diarrhea; 39-year-old brought in after a house fire", "sub": "Unfolding case studies: one client, six questions in clinical judgment order.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "cases-4", "title": "Case studies: 54-year-old admitted 48 hours ago with an ankle fracture; 67-year-old with chronic kidney disease and gastroenteritis; 41-year-old on an SSRI started on a new antibiotic", "sub": "Unfolding case studies: one client, six questions in clinical judgment order.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "cases-5", "title": "Case studies: 69-year-old with COPD and increased sputum; 48-year-old four hours after abdominal hysterectomy; 29-year-old in the ICU after a motorcycle crash", "sub": "Unfolding case studies: one client, six questions in clinical judgment order.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "cases-6", "title": "Case studies: 34-year-old at 34 weeks with painful vaginal bleeding; 26-year-old at 31 weeks with low back ache and cramping; 4-year-old brought to triage with high fever and irritability", "sub": "Unfolding case studies: one client, six questions in clinical judgment order.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "cases-7", "title": "Case studies: 35-year-old on an antipsychotic with new fever and stiffness", "sub": "Unfolding case studies: one client, six questions in clinical judgment order.", "n": 6, "reviewed": 0, "changed": 0}]};</script><script>(()=>{const v=window.Shift||{},d=v.tel,h=window.RI||{packs:[]},p=document.getElementById("app"),i=e=>String(e??"").replace(/[&<>"']/g,a=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[a]),k={awaiting:"Awaiting clinical review",reviewed:"Clinically reviewed",changed:"Changed since its review"},f=e=>(e.reviewed===e.n?'<span class="chip reviewed">Clinically reviewed</span>':`<span class="chip awaiting">${e.reviewed} of ${e.n} reviewed</span>`)+(e.changed?` <span class="chip changed">${e.changed} changed since review</span>`:"");if(!h.pack){const e=[["Drills",a=>a.id.startsWith("drill-")],["NCLEX questions after each shift",a=>a.id.startsWith("ngn-shift")],["NCLEX question bank",a=>a.id.startsWith("bank-")],["Unfolding case studies",a=>a.id.startsWith("cases-")]];p.innerHTML=`<a class="home" href="/">The Shift</a><h1>Clinical review: practice content</h1>
