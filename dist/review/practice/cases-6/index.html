<style>
:root{--bg:#E6EDF0;--surface:#FBFCFC;--surface-2:#EDF2F4;--ink:#152238;--ink-2:#4D5A6F;--line:#CAD5DB;--teal:#2449A8;--teal-ink:#fff;--red:#B3342B;--red-bg:#F8E1DE;--good:#2B7249;--good-bg:#E0F0E6;--amber:#A96C0E;--amber-bg:#FBEFD6;
  --serif:"Barlow Condensed","Arial Narrow",sans-serif;--sans:"Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161C;--surface:#1A1F27;--surface-2:#212833;--ink:#E7E4DB;--ink-2:#A0A5AE;--line:#343C48;--teal:#93B4E4;--teal-ink:#0F1B2C;--red:#F0766B;--red-bg:#3b1d1b;--good:#72c692;--good-bg:#16301f;--amber:#E9AE4E;--amber-bg:#35291a}}
:root[data-theme="dark"]{--bg:#12161C;--surface:#1A1F27;--surface-2:#212833;--ink:#E7E4DB;--ink-2:#A0A5AE;--line:#343C48;--teal:#93B4E4;--teal-ink:#0F1B2C;--red:#F0766B;--red-bg:#3b1d1b;--good:#72c692;--good-bg:#16301f;--amber:#E9AE4E;--amber-bg:#35291a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
main{max-width:52rem;margin:0 auto;padding:clamp(1.2rem,5vw,3rem) 16px calc(5rem + env(safe-area-inset-bottom))}
a{color:var(--teal)}
.home{font-family:var(--serif);font-weight:700;font-size:1.1rem;letter-spacing:.04em;text-transform:uppercase;background:var(--ink);color:var(--bg);padding:.28em .55em .22em;border-radius:2px;text-decoration:none}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.9rem,6vw,2.6rem);line-height:1.1;letter-spacing:0;margin:1.6rem 0 .3rem}
h2{font-size:1.15rem;margin:2.4rem 0 .6rem}
h3{font-size:1rem;margin:0}
p{margin:.5rem 0}
.muted{color:var(--ink-2)}
.meta{display:flex;flex-wrap:wrap;gap:.4rem .6rem;margin-top:.6rem}
.chip{display:inline-flex;align-items:center;padding:.15em .6em;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--surface-2);border:1px solid var(--line)}
.chip.awaiting{background:var(--amber-bg);border-color:transparent;color:var(--amber)}
.chip.reviewed{background:var(--good-bg);border-color:transparent;color:var(--good)}
.chip.changed{background:var(--red-bg);border-color:transparent;color:var(--red)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem 1.1rem;margin:.8rem 0}
.how ol{margin:.4rem 0 0;padding-left:1.2rem}.how li{margin:.2rem 0}
label{display:block;font-weight:600;font-size:.9rem;margin:.7rem 0 .25rem}
input[type=text],input[type=email],textarea,select{width:100%;min-height:44px;padding:.5em .7em;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:5rem;resize:vertical}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:0 1rem}
details.pt{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:.6rem 0}
details.pt>summary{cursor:pointer;padding:.85rem 1rem;font-weight:600;list-style-position:inside}
details.pt>div{padding:0 1rem 1rem}
table{width:100%;border-collapse:collapse;font-size:.88rem;margin:.4rem 0}
th,td{text-align:left;vertical-align:top;padding:.35rem .5rem .35rem 0;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--ink-2);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
.scroll{overflow-x:auto}
ul.plain{margin:.3rem 0;padding-left:1.1rem}
.dec{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:.85rem 1rem;margin:.6rem 0}
.dec.pos{border-left-color:var(--good)}.dec.neg{border-left-color:var(--red)}
.dec .top{display:flex;flex-wrap:wrap;gap:.3rem .5rem;align-items:center;font-size:.78rem;color:var(--ink-2);font-weight:600}
.pts{font-weight:700;padding:.05em .45em;border-radius:4px;background:var(--surface-2)}
.pos .pts{color:var(--good);background:var(--good-bg)}.neg .pts{color:var(--red);background:var(--red-bg)}
.dec b{display:block;margin:.35rem 0 .15rem;font-size:1rem}
.dec .why{font-family:var(--sans);color:var(--ink-2);margin:0}
.dec .src{font-size:.75rem;color:var(--ink-2);margin-top:.35rem}
.verdict{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.7rem}
.verdict button{min-height:40px;padding:.35em .9em;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer}
.verdict button[aria-pressed="true"][data-v="ok"]{background:var(--good);border-color:var(--good);color:var(--teal-ink)}
.verdict button[aria-pressed="true"][data-v="fix"]{background:var(--red);border-color:var(--red);color:var(--teal-ink)}
.verdict button[aria-pressed="true"][data-v="unsure"]{background:var(--amber);border-color:var(--amber);color:var(--teal-ink)}
.dec textarea{margin-top:.5rem;min-height:3.6rem}
.opt{padding:.4rem 0;border-bottom:1px solid var(--line);font-size:.92rem}.opt:last-child{border:0}
.opt i{font-style:normal;font-weight:700;font-size:.75rem;padding:.05em .4em;border-radius:4px;margin-right:.4rem;background:var(--surface-2)}
.bar{position:sticky;top:0;z-index:5;margin:0 -16px;padding:.6rem 16px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:.6rem;font-size:.9rem}
.bar .prog{display:block;flex:1;min-width:4rem;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;max-width:12rem}.bar .prog i{display:block;height:100%;background:var(--teal)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:.55em 1.2em;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn-primary{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.row{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1rem}
.check{display:flex;gap:.6rem;align-items:flex-start;font-weight:500;margin-top:1rem}
.check input{width:1.2rem;height:1.2rem;margin-top:.2rem;flex:none}
.msg{margin-top:.8rem;font-weight:600}.msg.err{color:var(--red)}.msg.ok{color:var(--good)}
pre{white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:.8rem;font-size:.8rem;max-height:18rem;overflow:auto}
.shifts a{display:block;text-decoration:none;color:inherit}
.shifts .card:hover{border-color:var(--ink-2)}
</style>

ion diagnosed 4 years ago; takes labetalol 200 mg PO twice daily, last dose at 20:00 last night. Prior term vaginal birth 3 years ago. 20-week anatomy ultrasound: posterior fundal placenta, well clear of the cervix. Blood type O negative; received Rh immune globulin 300 mcg at 28 weeks. Nonsmoker, denies substance use. Weight 82 kg (180 lb). No known drug allergies.", "Nurses' Notes 06:45: Reports sudden, constant abdominal pain that began at 06:00, rated 8/10, 'worse than labor with my first.' Dark red vaginal bleeding; pad saturated in about 1 hour. Uterus firm and tender, does not relax between contractions. Felt the baby move at 05:00, less since. Denies leakage of clear fluid. Denies trauma or falls. Mild ankle edema, present for 2 weeks. Skin pale and cool.", "Vital Signs 06:45: T 37 °C (98.6 °F), HR 112, RR 22, BP 158/98, SpO₂ 98% on room air", "Flowsheet 06:50: Electronic fetal monitoring: FHR baseline 160, minimal variability (amplitude 5 bpm or less), no accelerations, late decelerations with each contraction. Contractions every 2 minutes, lasting 40 to 60 seconds. Elevated resting tone between contractions on palpation.", "Orders 06:50: Continuous electronic fetal monitoring. Vital signs every 15 minutes. Insert 18-gauge IV; lactated Ringer's at 125 mL/h. CBC, type and screen. Obstetrician to bedside for ultrasound.", "Laboratory Results 07:15 (shown from item 4): Hemoglobin 9.4 g/dL (11 to 15). Hematocrit 28% (33 to 44). Platelets 96,000/mm³ (150,000 to 400,000). Fibrinogen 180 mg/dL (300 to 600 in late pregnancy). PT 14.8 seconds (11 to 13.5). INR 1.3 (0.8 to 1.1). aPTT 38 seconds (25 to 35). Blood type O negative, antibody screen negative.", "Diagnostic Results 07:20 (shown from item 4): Bedside ultrasound: single fetus, cephalic. Placenta fundal and posterior; no previa. Hypoechoic area behind the placenta consistent with retroplacental clot.", "Nurses' Notes 07:22 (shown from item 4): Obstetrician at bedside; diagnosis of placental abruption discussed with the client and partner. Bleeding continues. Plan for cesarean birth.", "Vital Signs 07:25 (shown from item 5): HR 124, RR 24, BP 132/84, SpO₂ 97% on room air", "Flowsheet 07:25 (shown from item 5): FHR baseline 165, minimal variability, late decelerations with every contraction, now deeper with a slower return to baseline. Client lying supine since the ultrasound.", "Orders 07:26 (shown from item 5): Lactated Ringer's 500 mL IV bolus. Insert a second 18-gauge IV. NPO. Emergency cesarean, OR 2. Anesthesia notified.", "Nurses' Notes 09:15 (shown from item 6): Emergency cesarean birth at 07:48 under general anesthesia. Large retroplacental clot; about 40% of the placenta separated. Male newborn, 2,250 g, Apgar scores 4 and 7, admitted to the NICU; newborn blood type A positive. Estimated blood loss 1,400 mL. Received 2 units packed red blood cells and 10 units cryoprecipitate in the OR.", "Vital Signs 09:30 (shown from item 6): T 36.8 °C (98.2 °F), HR 96, RR 18, BP 136/86, SpO₂ 98% on 2 L nasal cannula", "Laboratory Results 09:30 (shown from item 6): Hemoglobin 9.6 g/dL (9.4 at 07:15). Platelets 88,000/mm³ (96,000 at 07:15). Fibrinogen 260 mg/dL (180 at 07:15). INR 1.1 (1.3 at 07:15). Kleihauer-Betke: estimated fetal whole blood 18 mL.", "Flowsheet 10:00 (shown from item 6): Fundus firm, midline, 1 cm below the umbilicus. Lochia rubra, moderate. Abdominal dressing dry. Urine output 50 mL/h for the last 2 hours. New oozing of blood around the IV site in the left hand.", "", "Refer to the chart.", "", "Highlight the findings in the 06:45 nurses' note that require immediate follow-up.", "", "✓ highlight Reports sudden, constant abdominal pain that began at 06:00, rated 8/10.", "  Yes: sudden, constant pain with bleeding in the third trimester is the classic presentation of placental separation and needs immediate evaluation.", "✓ highlight Dark red vaginal bleeding; pad saturated in about 1 hour.", "  Yes: dark blood suggests bleeding that pooled behind the placenta first, and visible loss can underestimate total loss because some stays concealed in the uterus.", "✓ highlight Uterus firm and tender, does not relax between contractions.", "  Yes: a rigid, board-like uterus with high resting tone suggests blood in the uterine muscle and cuts placental blood flow between contractions.", "✓ highlight Felt the baby move at 05:00, less since.", "  Yes: decreased fetal movement with bleeding and a rigid uterus suggests fetal compromise and matches the abnormal tracing.", "- Denies leakage of clear fluid.", "  No: this lowers concern for ruptured membranes. It is a pertinent negative, useful history, but not a finding the nurse must act on.", "- Denies trauma or falls.", "  No: trauma is a cause of abruption, so its absence is worth documenting, but it does not change what the nurse does next.", "- Mild ankle edema, present for 2 weeks.", "  No: dependent edema is common late in pregnancy. The trap is chasing a stable, expected finding while the uterus and fetus are in trouble.", "✓ highlight Skin pale and cool.", "  Yes: pale, cool skin with HR 112 signals compensation for blood loss. Her chronic hypertension can make the BP look falsely reassuring.", "", "Why: Painful dark bleeding, a rigid tender uterus, less fetal movement and signs of compensation for blood loss point to placental separation in a client with a major risk factor. The pertinent negatives and her chronic ankle edema do not change the priority. Chronic hypertension can mask volume loss, so trust the heart rate and skin.", "Tip: In third-trimester bleeding, flag every finding about pain, uterine tone, fetal status and perfusion before anything else."], "st": "awaiting"}, {"id": "ngn:cs-abruption-2", "hash": "5170ef5ac0", "title": "Placental abruption at 34 weeks · item 2 · Matrix · Analyze cues", "body": ["Her partner asks whether this is the same as a friend's placenta previa.", "", "For each finding, indicate whether it is more consistent with placental abruption or placenta previa.", "", "- Bleeding with constant abdominal pain → Placental abruption", "  abruption hurts because blood collects behind the separating placenta and irritates the uterine muscle; previa bleeding is classically painless.", "- Bright red bleeding with no pain or uterine tenderness → Placenta previa", "  previa bleeds when the lower uterine segment stretches over a placenta covering the os, so the blood is bright red and the uterus stays soft.", "- Rigid, board-like uterus with high resting tone → Placental abruption", "  blood seeping into the myometrium makes the uterus firm and tender. The trap is calling it a strong contraction when it never relaxes.", "- Soft, relaxed uterus between episodes of bleeding → Placenta previa", "  with previa the uterine muscle is not irritated, so resting tone is normal and the fetal tracing is often reassuring at first.", "- Late decelerations with minimal variability early in the presentation → Placental abruption", "  loss of attached placental surface cuts oxygen delivery to the fetus, so fetal compromise appears early in abruption.", "- Chronic hypertension as the main risk factor → Placental abruption", "  hypertension damages the decidual vessels and is a leading risk factor for abruption, along with cocaine use, smoking and abdominal trauma.", "", "Why: Pain and uterine tone separate the two. Abruption hurts, the uterus is rigid, the blood is often dark, and the fetus is stressed early. Previa is painless, bright red bleeding from a soft uterus, with risk factors such as prior cesarean birth. Her anatomy scan placed the placenta well away from the cervix.", "Tip: Sort third-trimester bleeding with two questions: does it hurt, and is the uterus soft or hard?"], "st": "awaiting"}, {"id": "ngn:cs-abruption-3", "hash": "1fea08ff5e", "title": "Placental abruption at 34 weeks · item 3 · Drop-down · Prioritize hypotheses", "body": ["Refer to the chart.", "", "Complete the sentences.", "", "Blank 1:", "✓ placental abruption", "  Yes: painful dark bleeding, a rigid uterus, fetal compromise and chronic hypertension fit early separation of a normally placed placenta.", "- placenta previa", "  No: previa causes painless bright red bleeding with a soft uterus, and her anatomy scan showed a fundal placenta.", "- preterm labor with bloody show", "  No: bloody show is scant, pink and mucus-like; it does not cause a board-like uterus or a pad saturated in an hour.", "Blank 2:", "✓ uteroplacental insufficiency", "  Yes: late decelerations with minimal variability mean the fetus is not getting enough oxygen across a placenta that is partly detached.", "- a normal response to contractions", "  No: minimal variability with recurrent late decelerations is an abnormal category II pattern that calls for intrauterine resuscitation and prompt evaluation.", "- fetal head compression", "  No: head compression causes early decelerations that mirror contractions and are benign. The trap is confusing early with late timing.", "Blank 3:", "- uterine inversion", "  No: uterine inversion is a third-stage complication of traction on the cord, not a risk before birth.", "- chorioamnionitis", "  No: chorioamnionitis follows prolonged rupture of membranes with fever; she is afebrile and her membranes are intact.", "✓ disseminated intravascular coagulation", "  Yes: the retroplacental clot consumes fibrinogen and releases tissue factor into her circulation, making abruption a leading obstetric cause of DIC.", "", "Why: Her presentation is placental abruption. The partly detached placenta cannot fully oxygenate the fetus, which shows as late decelerations with lost variability. For the mother, the danger is hemorrhage and consumptive coagulopathy, so clotting labs are watched closely.", "Tip: Name the condition first, then ask what it threatens for each patient: the fetus and the mother."], "st": "awaiting"}, {"id": "ngn:cs-abruption-4", "hash": "c7e0e8386f", "title": "Placental abruption at 34 weeks · item 4 · Select all · Generate solutions", "body": ["Refer to the chart.", "", "Which orders should the nurse anticipate for this client? Select all that apply.", "", "- Encourage clear oral fluids to replace lost volume", "  No: she is going to surgery and stays NPO. Volume is replaced with IV fluids and blood products, not oral intake.", "✓ Repeat fibrinogen, platelets and coagulation studies", "  Yes: a fibrinogen of 180 mg/dL is low for pregnancy, and falling values signal developing DIC that may need cryoprecipitate or plasma.", "✓ Insert an indwelling urinary catheter and measure output hourly", "  Yes: urine output is a sensitive marker of perfusion during hemorrhage, and the bladder must be drained before cesarean birth.", "✓ Type and crossmatch 2 units of packed red blood cells", "  Yes: Her hemoglobin is already 9.4 g/dL with ongoing bleeding and surgery ahead, so blood must be ready before it is needed.", "- Avoid all vaginal exams for the rest of the pregnancy because of the bleeding", "  No: that rule belongs to placenta previa, where a digital exam can tear the placenta. Ultrasound has already ruled out previa here.", "✓ Send a Kleihauer-Betke test", "  Yes: she is Rh negative and fetal blood may have entered her circulation; the test measures how much, which sets the Rh immune globulin dose.", "✓ Prepare the client for cesarean birth", "  Yes: late decelerations with minimal variability plus early coagulopathy make prompt surgical birth the definitive treatment at 34 weeks.", "- Give terbutaline 0.25 mg subcutaneously to slow the contractions", "  No: tocolysis is contraindicated in abruption with fetal compromise. Relaxing the uterus does not stop the separation and delays a needed birth.", "", "Why: Abruption with fetal compromise and early coagulopathy calls for blood on hand, serial clotting labs, urine output monitoring and prompt cesarean birth. Because she is Rh negative, the Kleihauer-Betke test guides her Rh immune globulin dose. Tocolysis is contraindicated, and the no-vaginal-exam rule applies to previa, which ultrasound excluded.", "Tip: When a diagnosis threatens both mother and fetus, choose options that prepare for hemorrhage and birth, and reject any that delay delivery."], "st": "awaiting"}, {"id": "ngn:cs-abruption-5", "hash": "10651f7191", "title": "Placental abruption at 34 weeks · item 5 · Matrix · Take action", "body": ["Refer to the chart.", "", "For each nursing action, indicate whether the nurse should do it now or should not do it.", "", "- Turn the client onto her left side → Do now", "  lateral positioning lifts the uterus off the vena cava and aorta, improving venous return and placental blood flow; she has been supine since the ultrasound.", "- Start the lactated Ringer's bolus and insert the second large-bore IV → Do now", "  volume supports maternal perfusion and placental flow, and a second line is needed for blood products during surgery.", "- Report the tracing, the BP change and the lab results to the obstetrician using SBAR → Do now", "  a BP drop from 158/98 to 132/84 with HR 124 signals hypovolemia hidden by her hypertension, and the team needs this before surgery.", "- Give the scheduled labetalol 200 mg PO with a sip of water → Do not do", "  she is NPO for surgery and her BP is falling as she bleeds. A beta blocker would also blunt the tachycardia that is compensating for blood loss.", "- Place her flat on her back with her legs elevated → Do not do", "  the supine position compresses the vena cava and worsens fetal oxygenation. The trap is applying a general shock position to a pregnant client.", "- Delay transfer to the OR until the Kleihauer-Betke result returns → Do not do", "  the test guides Rh immune globulin dosing after birth; it never delays an emergency cesarean for fetal compromise.", "", "Why: Intrauterine resuscitation means lateral positioning, IV fluid and fixing the cause, which here only birth can do. Her BP looks normal but is 26 points below her baseline with a rising heart rate, so she is losing volume. Hold oral medications she cannot take and that would mask compensation.", "Tip: For a pregnant client in distress, think left side, fluids, report and prepare for birth; avoid anything that puts her flat on her back or delays surgery."], "st": "awaiting"}, {"id": "ngn:cs-abruption-6", "hash": "a0a8b187bc", "title": "Placental abruption at 34 weeks · item 6 · Select all · Evaluate outcomes", "body": ["Refer to the chart.", "", "Which findings indicate that the client's condition is improving? Select all that apply.", "", "✓ Heart rate 96, down from 124 before surgery", "  Yes: a falling heart rate shows less need to compensate for blood loss now that the bleeding source is removed and blood has been replaced.", "✓ INR 1.1, down from 1.3", "  Yes: a normalizing INR means clotting function is recovering, which lowers the risk of ongoing uterine and incisional bleeding.", "✓ Fibrinogen 260 mg/dL, up from 180 mg/dL", "  Yes: rising fibrinogen after cryoprecipitate shows clotting factors are being restored and consumption slowed once the placenta was delivered.", "- New oozing of blood around the IV site in the left hand", "  No: bleeding from puncture sites can signal ongoing DIC and must be reported even when other clotting tests are improving.", "✓ Fundus firm, midline, 1 cm below the umbilicus with moderate lochia", "  Yes: a firm, midline fundus with moderate flow means the uterus is contracting well and is not a source of new hemorrhage.", "✓ Urine output 50 mL/h for 2 hours", "  Yes: output above 30 mL/h shows the kidneys are perfused, a key sign that circulating volume has been restored.", "- Platelets 88,000/mm³, down from 96,000/mm³", "  No: the platelet count is still falling from dilution and consumption. It needs follow-up and repeat testing, not reassurance.", "", "Why: Delivering the placenta removes the source of clotting factor consumption, and transfusion restores volume and fibrinogen. Her heart rate, urine output, fundus and clotting tests are moving the right way, but falling platelets and new oozing need follow-up. Because she is Rh negative and the newborn is Rh positive, she needs Rh immune globulin within 72 hours, dosed by the Kleihauer-Betke result.", "Tip: In a trend item, compare each value with its earlier value and ask whether it moved toward normal or away from it."], "st": "awaiting"}, {"id": "ngn:cs-preterm-1", "hash": "0a0f8b013b", "title": "Preterm labor at 31 weeks · item 1 · Highlight · Recognize cues", "body": ["Client: 24-year-old G1P0 at 31 weeks 1 day arrives at labor and delivery triage at 07:30 with cramping and low back pain that started last night", "Admission Notes: A 24-year-old G1P0 at 31 weeks 1 day arrives at labor and delivery triage at 07:30 with cramping and low back pain that started last night. She drove herself in from work. You are the triage nurse.", "History and Physical: G1P0 at 31 weeks 1 day by first-trimester ultrasound. Uncomplicated pregnancy to date. No chronic illness. Group B strep status unknown; culture planned at 36 to 37 weeks. Blood type A positive, rubella immune. Takes a prenatal vitamin daily. No known drug allergies. Weight 64 kg (141 lb). Works as a restaurant server, on her feet for 10-hour shifts.", "Nurses' Notes 07:40: Reports dull low back ache since last night that comes and goes, and menstrual-like cramping. Feels pelvic pressure, 'like the baby is pushing down.' Increase in watery, mucus-like vaginal discharge since yesterday. Burning with urination for 3 days. Denies a gush of fluid or vaginal bleeding. Fetal movement active. Fetal fibronectin swab collected before any vaginal exam; no intercourse in the past 48 hours.", "Vital Signs 07:40: T 37.1 °C (98.8 °F), HR 92, RR 18, BP 118/72, SpO₂ 99% on room air", "Flowsheet 07:45: FHR baseline 140, moderate variability, accelerations present, no decelerations. Contractions every 5 to 7 minutes, lasting 30 to 45 seconds, mild to moderate by palpation.", "Orders 07:45: Continuous electronic fetal monitoring. Sterile speculum exam, then cervical exam by provider. Fetal fibronectin. Transvaginal cervical length. Urinalysis with culture. CBC.", "Flowsheet 08:15 (shown from item 2): Sterile speculum exam: no pooling, nitrazine negative, no ferning. Cervix 2 cm dilated, 60% effaced, station minus 2.", "Diagnostic Results 08:30 (shown from item 2): Transvaginal cervical length 18 mm (expected at this gestation: 30 mm or more).", "Laboratory Results 09:00 (shown from item 2): Fetal fibronectin positive. Urinalysis: nitrite positive, leukocyte esterase positive, WBC 25/hpf (0 to 5); culture pending. CBC: WBC 10,800/mm³ (5,000 to 15,000 in pregnancy), hemoglobin 11.6 g/dL (11 to 15), platelets 232,000/mm³ (150,000 to 400,000).", "Flowsheet 10:00 (shown from item 2): Cervix 3 cm dilated, 80% effaced, station minus 1. Contractions every 4 to 5 minutes. FHR baseline 140, moderate variability, accelerations present.", "Orders 10:15 (shown from item 4): Admit to labor and delivery. Betamethasone 12 mg IM now; repeat once in 24 hours. Magnesium sulfate 4 g IV over 20 minutes, then 1 g/h for fetal neuroprotection, maximum 24 hours. Nifedipine 20 mg PO now, then 10 mg PO every 6 hours for 48 hours; hold for SBP under 90. Rectovaginal group B strep culture, then penicillin G 5 million units IV, then 2.5 million units IV every 4 hours. Cephalexin 500 mg PO every 6 hours. Lactated Ringer's at 75 mL/h; total IV intake not to exceed 125 mL/h. Strict intake and output.", "Medication Administration Record 10:30 (shown from item 5): Betamethasone 12 mg IM given 10:20, right ventrogluteal; next dose due 10:20 tomorrow. Group B strep culture collected 10:22. Penicillin G 5 million units IV given 10:25. Magnesium sulfate 4 g IV load started 10:30, then 1 g/h. Nifedipine 20 mg PO given 10:30; next dose due 16:30.", "Vital Signs 11:00 (shown from item 5): T 37 °C (98.6 °F), HR 118, RR 18, BP 86/50, SpO₂ 98% on room air", "Nurses' Notes 11:00 (shown from item 5): Client reports feeling warm, flushed and lightheaded, with a mild headache. Lying supine. Patellar reflexes 2+. Alert and oriented. Contractions every 6 to 8 minutes. FHR baseline 145, moderate variability.", "Flowsheet 18:00 (shown from item 6): Magnesium checks. 14:00: RR 18, patellar reflexes 2+, alert, urine output 45 mL/h. 16:00: RR 14, reflexes 1+, drowsy but easy to rouse, urine output 25 mL/h. 18:00: RR 11, reflexes absent, difficult to rouse, urine output 15 mL/h. Contractions 1 to 2 per hour since 16:00. FHR baseline 140, minimal to moderate variability.", "Vital Signs 18:00 (shown from item 6): T 37 °C (98.6 °F), HR 96, RR 11, BP 108/64, SpO₂ 93% on room air", "Laboratory Results 18:05 (shown from item 6): Serum magnesium 9.6 mg/dL (target for this protocol 4 to 7). Creatinine 1.2 mg/dL (0.4 to 0.8 in pregnancy).", "", "Refer to the chart.", "", "Highlight the findings in the 07:40 nurses' note that require follow-up.", "", "✓ highlight Reports dull low back ache since last night that comes and goes,", "  Yes: an intermittent low back ache is a common, easily dismissed sign of preterm contractions, especially in a first pregnancy.", "✓ highlight and menstrual-like cramping.", "  Yes: period-like cramping at 31 weeks can be uterine contractions that are changing the cervix, so it must be assessed.", "✓ highlight Feels pelvic pressure, 'like the baby is pushing down.'", "  Yes: pelvic pressure suggests the presenting part is descending or the cervix is changing, both signs of preterm labor.", "✓ highlight Increase in watery, mucus-like vaginal discharge since yesterday.", "  Yes: a change in discharge can reflect cervical change or ruptured membranes, so it needs a sterile speculum exam and testing.", "✓ highlight Burning with urination for 3 days.", "  Yes: a urinary tract infection is a known trigger for preterm contractions and needs a urinalysis, culture and treatment.", "- Denies a gush of fluid or vaginal bleeding.", "  No: this pertinent negative lowers concern for ruptured membranes or abruption. It is useful history, not a finding to act on.", "- Fetal movement active.", "  No: active fetal movement is reassuring for fetal well-being and needs no follow-up right now.", "- Fetal fibronectin swab collected before any vaginal exam.", "  No: collecting the swab before a digital exam or lubricant is correct technique, so the result will be valid. Nothing needs correcting.", "", "Why: Preterm labor often starts quietly: back ache, cramping, pressure and a change in discharge. Each needs follow-up at 31 weeks, and so do urinary symptoms because infection can trigger contractions. Correct specimen technique and reassuring negatives do not.", "Tip: Before 37 weeks, treat any symptom that sounds like mild labor as possible preterm labor until the cervix says otherwise."], "st": "awaiting"}, {"id": "ngn:cs-preterm-2", "hash": "30afd47836", "title": "Preterm labor at 31 weeks · item 2 · Matrix · Analyze cues", "body": ["Refer to the chart.", "", "For each finding, indicate whether it supports a diagnosis of preterm labor or its cause, or is reassuring.", "", "- Cervix 2 cm and 60% effaced at 08:15, then 3 cm and 80% effaced at 10:00 → Supports preterm labor or its cause", "  documented cervical change with regular contractions is the defining finding of preterm labor; contractions alone are not enough to make the diagnosis.", "- Positive fetal fibronectin → Supports preterm labor or its cause", "  fibronectin leaking past the membranes signals disruption at the placental interface. A negative result is the more useful one because it makes birth within 14 days unlikely.", "- Cervical length 18 mm → Supports preterm labor or its cause", "  a cervix shorter than 25 mm before 34 weeks greatly raises the risk of preterm birth.", "- Urinalysis positive for nitrite and leukocyte esterase → Supports preterm labor or its cause", "  these suggest a urinary tract infection, which releases inflammatory mediators that can trigger contractions.", "- Nitrazine negative, no ferning and no pooling → Reassuring", "  these show the membranes are intact, so this is preterm labor without prelabor rupture, which changes antibiotic and delivery planning.", "- FHR baseline 140 with moderate variability and accelerations → Reassuring", "  a category I tracing means the fetus is well oxygenated now, so there is time to give corticosteroids and magnesium.", "", "Why: Preterm labor is regular contractions with cervical change before 37 weeks, and she has both. The short cervix and positive fibronectin add risk, and the urinary infection is a likely trigger. Intact membranes and a category I tracing are reassuring and buy time for treatment.", "Tip: Find the one finding that defines the diagnosis, here cervical change, then sort the rest into risk, cause and reassurance."], "st": "awaiting"}, {"id": "ngn:cs-preterm-3", "hash": "7088198c8a", "title": "Preterm labor at 31 weeks · item 3 · Drop-down · Prioritize hypotheses", "body": ["Refer to the chart.", "", "Complete the sentences.", "", "Blank 1:", "- preterm prelabor rupture of membranes", "  No: nitrazine, ferning and pooling are all negative, so her membranes are intact.", "✓ preterm labor", "  Yes: regular contractions with cervical change from 2 cm to 3 cm before 37 weeks meet the definition of preterm labor.", "- Braxton Hicks contractions", "  No: Braxton Hicks contractions are irregular and do not change the cervix; hers changed within 2 hours.", "Blank 2:", "- induce birth before the infection worsens", "  No: a urinary tract infection is treated with antibiotics; it is not a reason to deliver a 31-week fetus with a reassuring tracing.", "- stop labor with tocolytics and bed rest until she reaches 37 weeks", "  No: no medication reliably stops preterm labor for weeks. The trap is expecting tocolysis to carry the pregnancy to term.", "✓ give antenatal corticosteroids and magnesium sulfate before birth", "  Yes: corticosteroids reduce newborn respiratory distress and brain bleeding, and magnesium before 32 weeks lowers the risk of cerebral palsy.", "Blank 3:", "- 2 weeks", "  No: tocolytics have not been shown to improve newborn outcomes beyond 48 hours, and longer use adds maternal risk.", "✓ 48 hours", "  Yes: short-term tocolysis buys about 48 hours so the corticosteroid course can be completed and the client transferred if needed.", "- 4 weeks", "  No: maintenance tocolysis for weeks is not recommended; it does not prevent preterm birth and exposes her to side effects.", "", "Why: She is in preterm labor at 31 weeks. The realistic goal is not to stop labor for good but to prepare the fetus for birth: corticosteroids for the lungs and brain, and magnesium for neuroprotection. Tocolysis buys the 48 hours the steroids need.", "Tip: In preterm labor questions, choose answers that prepare the baby for early birth over answers that promise to stop labor."], "st": "awaiting"}, {"id": "ngn:cs-preterm-4", "hash": "e6e13c127b", "title": "Preterm labor at 31 weeks · item 4 · Select all · Generate solutions", "body": ["Refer to the chart.", "", "Which actions should the nurse include in the plan of care? Select all that apply.", "", "✓ Collect the group B strep culture before the first dose of penicillin", "  Yes: her status is unknown and she is in preterm labor, so the culture is collected first and prophylaxis starts right away.", "- Teach the client she will need strict bed rest at home after discharge", "  No: bed rest does not prevent preterm birth and raises the risk of blood clots, bone loss and deconditioning.", "✓ Assess patellar reflexes, respiratory rate, level of consciousness and urine output every hour during the magnesium infusion", "  Yes: magnesium is cleared by the kidneys, and loss of patellar reflexes is the earliest sign of toxicity, before respiratory depression.", "✓ Check the blood pressure before each nifedipine dose", "  Yes: nifedipine lowers blood pressure, and the drop can be greater when it is given with magnesium; the order holds for SBP under 90.", "- Add terbutaline to the nifedipine to strengthen tocolysis", "  No: combining tocolytics adds cardiovascular risk without proven benefit, and terbutaline carries a warning against prolonged use for preterm labor.", "✓ Keep calcium gluconate 1 g at the bedside", "  Yes: calcium gluconate is the antidote for magnesium toxicity and must be ready if reflexes disappear or breathing slows.", "✓ Schedule the second betamethasone dose for 24 hours after the first", "  Yes: the two doses are given 24 hours apart, and the full fetal benefit begins about 24 hours after the second dose.", "- Encourage her to drink at least 3 L of fluid a day during the magnesium infusion", "  No: magnesium therapy raises the risk of pulmonary edema, so total fluids are limited. The trap is the old idea that hydration stops contractions.", "", "Why: The plan protects the fetus with corticosteroids, magnesium and group B strep prophylaxis, and protects the mother from the medications' risks. Magnesium needs hourly checks of reflexes, breathing, mental status and urine output with the antidote ready. Nifedipine needs a BP check before each dose. Bed rest, extra fluids and stacked tocolytics do not help.", "Tip: For every high-alert medication in the plan, pair it with its monitoring and its antidote or hold parameter."], "st": "awaiting"}, {"id": "ngn:cs-preterm-5", "hash": "cdc1856565", "title": "Preterm labor at 31 weeks · item 5 · Matrix · Take action", "body": ["Refer to the chart.", "", "For each nursing action, indicate whether it is indicated or not indicated at this time.", "", "- Turn the client onto her side and recheck the BP in 15 minutes → Indicated", "  side-lying improves venous return and uteroplacental flow, and a prompt recheck shows whether the drop is resolving.", "- Report the BP and heart rate to the provider → Indicated", "  SBP 86 is below the hold parameter, and nifedipine with magnesium can cause marked hypotension, so the provider needs to adjust the plan.", "- Plan to hold the 16:30 nifedipine dose if the SBP is still under 90 → Indicated", "  the order includes a hold parameter, and checking the BP before each dose prevents a second, deeper drop.", "- Stop the magnesium infusion because she feels warm and flushed → Not indicated", "  warmth and flushing are expected from vasodilation and are not toxicity while reflexes are 2+, breathing is normal and she is alert.", "- Explain that warmth, flushing and drowsiness are expected with magnesium and to report trouble breathing or heavy weakness → Indicated", "  teaching lowers anxiety and helps her recognize and report the early symptoms of toxicity.", "- Give a 1,000 mL lactated Ringer's bolus to raise her BP → Not indicated", "  a bolus needs a provider order, and large volumes during magnesium therapy raise the risk of pulmonary edema.", "", "Why: Hypotension and tachycardia after nifedipine, on top of magnesium, call for repositioning, a recheck, a report and a hold on the next dose if it persists. Flushing and warmth are expected magnesium effects, so the response is teaching, not stopping the infusion. Fluids need an order and are limited during magnesium therapy.", "Tip: Separate expected side effects, which need teaching, from adverse effects that cross a parameter, which need a hold and a report."], "st": "awaiting"}, {"id": "ngn:cs-preterm-6", "hash": "9e31560b62", "title": "Preterm labor at 31 weeks · item 6 · Matrix · Evaluate outcomes", "body": ["Refer to the chart.", "", "For each finding at 18:00, indicate whether it shows a desired response to treatment or requires immediate follow-up.", "", "- Contractions 1 to 2 per hour, down from every 4 to 5 minutes → Desired response", "  fewer contractions show tocolysis is working, buying time to complete the betamethasone course.", "- BP 108/64, up from 86/50 at 11:00 → Desired response", "  her pressure has recovered from 86/50 at 11:00, so placental perfusion is better supported.", "- Patellar reflexes absent, 2+ at 14:00 → Requires immediate follow-up", "  loss of deep tendon reflexes is the earliest clinical sign of magnesium toxicity, so the infusion is stopped and the provider notified.", "- RR 11, down from 18 at 14:00 → Requires immediate follow-up", "  a respiratory rate under 12 signals respiratory depression from rising magnesium and calls for stopping the infusion and readying calcium gluconate.", "- Urine output 15 mL/h, down from 45 mL/h → Requires immediate follow-up", "  magnesium is cleared by the kidneys, so falling output lets it build up. Output under 30 mL/h needs prompt action.", "- Serum magnesium 9.6 mg/dL → Requires immediate follow-up", "  this is above the target range and matches her absent reflexes, slowed breathing and sedation.", "", "Why: The tocolysis and BP goals are met, but magnesium has accumulated as her urine output fell. Absent reflexes, a respiratory rate of 11, sedation and a level of 9.6 mg/dL mean toxicity. The nurse stops the infusion, calls the provider and prepares calcium gluconate as ordered.", "Tip: When reflexes, breathing and urine output fall together over time, suspect drug accumulation and act before the next value drops."], "st": "awaiting"}, {"id": "ngn:cs-meningitis-1", "hash": "48bd200f87", "title": "Bacterial meningitis in a preschooler · item 1 · Highlight · Recognize cues", "body": ["Client: 4-year-old boy is brought to the pediatric emergency department at 13:30 by his mother for fever, vomiting and increasing sleepiness since this morning", "Admission Notes: A 4-year-old boy is brought to the pediatric emergency department at 13:30 by his mother for fever, vomiting and increasing sleepiness since this morning. He attends a full-time daycare. You are the pediatric emergency nurse.", "History and Physical: 4-year-old male, weight 16 kg (35 lb). Healthy, born at term. Immunizations up to date for age, including Hib and pneumococcal conjugate vaccines; meningococcal vaccine not yet due at this age. Mild cold symptoms 3 days ago. Fever to 39.4 °C (102.9 °F) since 05:00, vomited 4 times, refused breakfast and lunch. Last void about 07:00. No known drug allergies. Lives with his mother, father and 7-year-old sister; attends daycare 5 days a week.", "Vital Signs 13:35: T 39.6 °C (103.3 °F), HR 148, RR 30, BP 94/56, SpO₂ 97% on room air, capillary refill 3 seconds. Normal for age: HR 80 to 120, RR 20 to 28, SBP 89 to 112.", "Nurses' Notes 13:40: Irritable and cries when moved; wants the lights off. Says his head and neck hurt. Resists bending his neck forward; nuchal rigidity present. Flexing his neck causes his hips and knees to bend. Pain and resistance when the knee is extended with the hip flexed. Small purple-red spots on both legs and the lower abdomen that do not blanch, new since noon per mother. Mucous membranes dry. Clear runny nose. Opens eyes to voice. Pupils equal and reactive. No seizure activity.", "Orders 13:45: IV access. Blood culture, CBC, comprehensive metabolic panel, CRP, coagulation panel, lactate. 0.9% sodium chloride 20 mL/kg (320 mL) IV bolus. Ceftriaxone 800 mg IV every 12 hours and vancomycin 240 mg IV every 6 hours, first doses immediately after the blood culture; do not delay for lumbar puncture. Acetaminophen 240 mg PR every 6 hours as needed for fever.", "Medication Administration Record 14:15 (shown from item 4): Blood culture drawn 13:52. Ceftriaxone 800 mg IV given 13:58. Vancomycin 240 mg IV started 14:05. Acetaminophen 240 mg PR given 14:00. 0.9% sodium chloride 320 mL bolus completed 14:15.", "Vital Signs 14:20 (shown from item 4): T 39.1 °C (102.4 °F), HR 132, RR 28, BP 98/60, SpO₂ 98% on room air, capillary refill 2 seconds", "Orders 14:25 (shown from item 4): Lumbar puncture at bedside at 14:30: cell count, glucose, protein, Gram stain and culture. Admit to the pediatric unit. Neuro checks every hour. Dextrose 5% in 0.9% sodium chloride at 54 mL/h. Strict intake and output; daily weight. Serum sodium every 12 hours. Lorazepam 1.6 mg IV for a seizure lasting 5 minutes or longer.", "Laboratory Results 15:30 (shown from item 5): CSF: cloudy. WBC 2,400/mm³ (0 to 5) with 92% neutrophils. Protein 210 mg/dL (15 to 45). Glucose 20 mg/dL (40 to 70); serum glucose 96 mg/dL. Gram stain: gram-negative diplococci. Blood: WBC 22,400/mm³ (5,500 to 15,500), platelets 168,000/mm³ (150,000 to 400,000), sodium 136 mEq/L (135 to 145), CRP 18 mg/dL (under 1).", "Nurses' Notes 16:10 (shown from item 5): On the pediatric unit. At 16:05 a generalized tonic-clonic seizure began; still seizing at 16:10. Lying on his back. SpO₂ 90% on room air. Mother at the bedside.", "Vital Signs 08:00 (shown from item 6): Hospital day 2: T 37.8 °C (100 °F), HR 112, RR 24, BP 100/62, SpO₂ 98% on room air. Day 1 at 14:20: T 39.1 °C (102.4 °F), HR 132, RR 28, BP 98/60.", "Laboratory Results 06:00 (shown from item 6): Sodium 128 mEq/L (135 to 145); 136 at 15:30 yesterday. Serum osmolality 262 mOsm/kg (275 to 295). Urine specific gravity 1.028 (1.005 to 1.030).", "Flowsheet 08:00 (shown from item 6): Last 24 hours: intake 1,450 mL, urine output 290 mL (about 0.75 mL/kg/h). Weight 16.6 kg (16 kg on admission). Petechiae unchanged in size and number, no new lesions. No seizures since 16:12 yesterday. Alert and talking with his mother; still uncomfortable with neck flexion.", "Nurses' Notes 08:30 (shown from item 6): Mother says, 'He doesn't turn around when I call him from the doorway anymore. He always used to.'", "", "Refer to the chart.", "", "Highlight the findings in the 13:40 nurses' note that require immediate follow-up.", "", "✓ highlight Irritable and cries when moved; wants the lights off.", "  Yes: irritability that worsens with handling and photophobia are meningeal signs in a young child, because movement stretches inflamed meninges.", "✓ highlight Resists bending his neck forward; nuchal rigidity present.", "  Yes: neck stiffness is a hallmark of meningeal irritation and, with high fever, points strongly to meningitis.", "✓ highlight Flexing his neck causes his hips and knees to bend.", "  Yes: this is a positive Brudzinski sign, a reflex response to stretching inflamed meninges along the spinal cord.", "✓ highlight Small purple-red spots on both legs and the lower abdomen that do not blanch, new since noon.", "  Yes: a spreading nonblanching rash with fever suggests meningococcal infection with possible septicemia, which can progress to shock within hours.", "- Clear runny nose.", "  No: rhinorrhea fits his recent cold and does not change the urgency. The trap is blaming the whole illness on a viral upper respiratory infection.", "- Pupils equal and reactive.", "  No: equal, reactive pupils are a reassuring neurologic finding right now, though they are rechecked often.", "- No seizure activity.", "  No: this pertinent negative needs no action itself, although seizure precautions are still planned because of the meningeal inflammation.", "", "Why: Fever with photophobia, irritability, nuchal rigidity and a positive Brudzinski sign points to meningitis. A new nonblanching petechial rash raises concern for meningococcal disease, which can cause shock within hours. The cold symptoms, reactive pupils and absence of seizures do not change the urgency.", "Tip: In a febrile child, a rash that does not blanch is an emergency until proven otherwise; flag it first."], "st": "awaiting"}, {"id": "ngn:cs-meningitis-2", "hash": "57e6951154", "title": "Bacterial meningitis in a preschooler · item 2 · Matrix · Analyze cues", "body": ["Refer to the chart.", "", "For each finding, indicate the process it most likely reflects.", "", "- Pain and resistance when the knee is extended with the hip flexed → Meningeal irritation", "  this is a positive Kernig sign; extending the knee stretches the inflamed lumbar meninges and nerve roots.", "- Photophobia and neck pain → Meningeal irritation", "  inflamed meninges make light and neck movement painful, which is why he wants the lights off and resists neck flexion.", "- Repeated vomiting with worsening headache and increasing sleepiness → Increased intracranial pressure", "  rising pressure inside the skull causes headache, vomiting and a falling level of consciousness. The trap is blaming the vomiting on a stomach virus.", "- HR 148 and capillary refill 3 seconds → Sepsis or poor perfusion", "  a heart rate well above the normal 80 to 120 with delayed refill shows the circulation is compensating for sepsis and volume loss.", "- Nonblanching petechiae spreading on the legs and abdomen → Sepsis or poor perfusion", "  meningococcal petechiae reflect damaged capillaries and early clotting abnormalities in the bloodstream, a warning that septic shock can follow.", "- No urine since 07:00 with dry mucous membranes → Sepsis or poor perfusion", "  low output and dry membranes reflect volume loss from fever and vomiting, which worsens perfusion and supports the ordered fluid bolus.", "", "Why: His findings come from three processes. Kernig sign, neck pain and photophobia show meningeal irritation. Headache, vomiting and sleepiness can reflect rising intracranial pressure. Tachycardia, slow refill, no urine and spreading petechiae show a systemic infection affecting perfusion, so fluids and antibiotics cannot wait.", "Tip: Group findings by the process that causes them; each group leads to its own set of nursing actions."], "st": "awaiting"}, {"id": "ngn:cs-meningitis-3", "hash": "50041d3fa6", "title": "Bacterial meningitis in a preschooler · item 3 · Drop-down · Prioritize hypotheses", "body": ["Refer to the chart.", "", "Complete the sentences.", "", "Blank 1:", "- influenza with dehydration", "  No: influenza does not cause nuchal rigidity or positive Kernig and Brudzinski signs. The trap is explaining away meningeal signs as dehydration.", "✓ bacterial meningitis", "  Yes: high fever, meningeal signs, a falling level of consciousness and a nonblanching rash fit a bacterial infection that can kill or disable within hours.", "- viral meningitis", "  No: viral meningitis is usually milder, without a petechial rash or poor perfusion, and is diagnosed only after bacterial causes are excluded.", "Blank 2:", "✓ Neisseria meningitidis", "  Yes: petechiae and purpura with meningitis are classic for meningococcus, which spreads by respiratory droplets and can cause rapid septic shock.", "- Haemophilus influenzae type b", "  No: Hib meningitis is now rare because of vaccination, he is fully immunized, and it does not usually cause a petechial rash.", "- herpes simplex virus", "  No: herpes simplex causes encephalitis with seizures and behavior change, not a nonblanching rash with meningeal signs.", "Blank 3:", "✓ give the first antibiotic doses right after the blood culture is drawn", "  Yes: every hour of delay in antibiotics worsens outcomes; the blood culture is drawn first, but antibiotics never wait for the lumbar puncture.", "- give acetaminophen and recheck the temperature in 1 hour", "  No: treating fever is comfort care, and rechecking in an hour delays the treatment that addresses the infection itself.", "- wait for the lumbar puncture results before giving the first antibiotics", "  No: waiting for CSF results is a dangerous trap. The CSF can still be diagnostic after the first antibiotic dose, so treatment starts now.", "", "Why: This is bacterial meningitis, and the rash points to meningococcus. The top nursing priority is getting antibiotics in fast, right after the blood culture. A lumbar puncture is still useful after antibiotics, so it never justifies waiting.", "Tip: When a question asks for the priority in a time-critical infection, choose the option that starts definitive treatment soonest."], "st": "awaiting"}, {"id": "ngn:cs-meningitis-4", "hash": "92f51b0aa3", "title": "Bacterial meningitis in a preschooler · item 4 · Select all · Generate solutions", "body": ["Refer to the chart.", "", "The nurse is planning care for the next several hours. Which actions should the nurse include? Select all that apply.", "", "- Place him in airborne precautions in a negative-pressure room", "  No: meningococcus spreads by droplets, not airborne particles. Airborne isolation is for measles, varicella and tuberculosis.", "✓ For the lumbar puncture, hold him side-lying with his knees drawn up and chin tucked toward his chest", "  Yes: this curled position widens the spaces between the lumbar vertebrae so the needle can reach the subarachnoid space safely.", "✓ Keep the room dark and quiet and cluster care", "  Yes: less light and noise eases photophobia and irritability and limits stimulation that can raise intracranial pressure.", "✓ Place the child on droplet precautions in a private room", "  Yes: meningococcus spreads by respiratory droplets, so staff wear a mask for close contact until he has had 24 hours of effective antibiotics.", "- Lay him flat with a pillow under his head to flex his neck forward", "  No: neck flexion is painful with meningeal irritation. A side-lying position with the head slightly raised and the neck neutral is more comfortable.", "✓ Monitor intake and output, daily weight and serum sodium for fluid retention", "  Yes: meningitis can trigger SIADH, with water retention, low sodium and seizures; early detection lets the provider adjust fluids.", "✓ Pad the side rails and keep suction and oxygen at the bedside", "  Yes: inflamed meninges irritate the brain, so seizures are a real risk; padding and working suction protect him and his airway.", "", "Why: The plan addresses spread, the lumbar puncture, seizures, comfort and fluid balance. Droplet precautions continue until 24 hours of effective antibiotics. The curled side-lying position opens the lumbar spaces. Seizure precautions, a quiet room and close tracking of sodium and fluids protect the brain.", "Tip: Match each precaution to the organism's route of spread: droplet for meningococcus, airborne only for measles, varicella and tuberculosis."], "st": "awaiting"}, {"id": "ngn:cs-meningitis-5", "hash": "b78b7efc9a", "title": "Bacterial meningitis in a preschooler · item 5 · Matrix · Take action", "body": ["Refer to the chart.", "", "For each action, indicate whether it is indicated or not indicated.", "", "- Turn him onto his side and move objects away from him → Indicated", "  side-lying lets secretions drain and protects the airway, and clearing the area prevents injury while he is seizing.", "- Give lorazepam 1.6 mg IV as ordered → Indicated", "  the seizure has lasted 5 minutes, which meets the order and the threshold for status epilepticus that needs a benzodiazepine.", "- Insert a padded tongue blade so he does not bite his tongue → Not indicated", "  objects in the mouth can break teeth, cause aspiration or block the airway; nothing goes in the mouth during a seizure.", "- Hold his arms and legs down to prevent injury → Not indicated", "  restraining a seizing child can cause fractures and soft tissue injury; padding and clearing the area protect him instead.", "- Once the seizure is controlled, notify infection prevention of the Gram stain so household and daycare contacts can receive prophylaxis → Indicated", "  gram-negative diplococci point to meningococcus, and close contacts need prompt antibiotic prophylaxis, such as rifampin, ceftriaxone or ciprofloxacin.", "- Arrange prophylaxis for every nurse who cared for him in the emergency department → Not indicated", "  health care workers need prophylaxis only after unprotected exposure to oral secretions, such as suctioning or intubation without a mask.", "", "Why: During a seizure the nurse protects the airway and body, applies oxygen and suctions as needed, and gives the ordered benzodiazepine at 5 minutes. Nothing goes in the mouth and limbs are not restrained. The CSF shows bacterial meningitis with gram-negative diplococci, so prophylaxis for close contacts starts promptly.", "Tip: For seizure care, choose actions that protect the airway and prevent injury; reject anything placed in the mouth or used to hold the child down."], "st": "awaiting"}, {"id": "ngn:cs-meningitis-6", "hash": "144d442a80", "title": "Bacterial meningitis in a preschooler · item 6 · Matrix · Evaluate outcomes", "body": ["Refer to the chart.", "", "For each finding, indicate whether it shows improvement or requires follow-up.", "", "- T 37.8 °C (100 °F) and HR 112, down from 39.1 °C (102.4 °F) and HR 132 → Improving", "  a falling fever and a heart rate back within the normal 80 to 120 show the infection is responding to antibiotics.", "- Petechiae unchanged, with no new lesions → Improving", "  a rash that is no longer spreading suggests the bloodstream infection and clotting abnormality are not progressing.", "- Alert and talking, with no seizures since 16:12 yesterday → Improving", "  a better level of consciousness and no further seizures reflect less brain irritation and stable intracranial pressure.", "- Sodium 128 mEq/L, down from 136, with serum osmolality 262 mOsm/kg → Requires follow-up", "  falling sodium and osmolality suggest SIADH; hyponatremia worsens cerebral edema and can cause seizures, so fluids must be adjusted.", "- Weight 16.6 kg, up from 16 kg, with urine output about 0.75 mL/kg/h and specific gravity 1.028 → Requires follow-up", "  weight gain with low output and concentrated urine points to water retention from SIADH, not better hydration.", "- Mother reports he no longer turns when called from the doorway → Requires follow-up", "  sensorineural hearing loss is the most common lasting complication of bacterial meningitis, so he needs a formal hearing evaluation before discharge.", "", "Why: The infection is responding: fever, heart rate, rash and mental status are all better. Fluid balance is not; falling sodium with weight gain and concentrated urine points to SIADH and needs a change in the fluid plan. A new hearing concern is common after bacterial meningitis and calls for audiology testing before discharge.", "Tip: In an evaluation trend, check each system separately; improvement in the infection does not cancel a new problem in fluids or hearing."], "st": "awaiting"}]}, "packs": [{"id": "drill-med-1", "title": "Drills: Med Pass, part 1 of 2", "sub": "What to check before a medication, then give, hold or call. A pharmacist is especially welcome.", "n": 25, "reviewed": 0, "changed": 0}, {"id": "drill-med-2", "title": "Drills: Med Pass, part 2 of 2", "sub": "What to check before a medication, then give, hold or call. A pharmacist is especially welcome.", "n": 25, "reviewed": 0, "changed": 0}, {"id": "drill-first-1", "title": "Drills: Who's First, part 1 of 2", "sub": "Four patients, one nurse: who do you see first, and why not the others.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "drill-first-2", "title": "Drills: Who's First, part 2 of 2", "sub": "Four patients, one nurse: who do you see first, and why not the others.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "drill-sbar", "title": "Drills: SBAR", "sub": "Building a call to the provider line by line, and the order that comes back.", "n": 20, "reviewed": 0, "changed": 0}, {"id": "drill-calm", "title": "Drills: De-escalation", "sub": "What to say to an agitated patient, turn by turn. Psych or ED experience fits best.", "n": 22, "reviewed": 0, "changed": 0}, {"id": "ngn-shift-1", "title": "NCLEX questions after each shift, part 1 of 3", "sub": "Five per shift, including the two harder NCLEX challenge items.", "n": 19, "reviewed": 0, "changed": 0}, {"id": "ngn-shift-2", "title": "NCLEX questions after each shift, part 2 of 3", "sub": "Five per shift, including the two harder NCLEX challenge items.", "n": 19, "reviewed": 0, "changed": 0}, {"id": "ngn-shift-3", "title": "NCLEX questions after each shift, part 3 of 3", "sub": "Five per shift, including the two harder NCLEX challenge items.", "n": 17, "reviewed": 0, "changed": 0}, {"id": "bank-ms-1", "title": "NCLEX question bank: Medical-surgical, part 1 of 3", "sub": "68 standalone practice questions.", "n": 23, "reviewed": 0, "changed": 0}, {"id": "bank-ms-2", "title": "NCLEX question bank: Medical-surgical, part 2 of 3", "sub": "68 standalone practice questions.", "n": 23, "reviewed": 0, "changed": 0}, {"id": "bank-ms-3", "title": "NCLEX question bank: Medical-surgical, part 3 of 3", "sub": "68 standalone practice questions.", "n": 22, "reviewed": 0, "changed": 0}, {"id": "bank-ed", "title": "NCLEX question bank: Emergency", "sub": "23 standalone practice questions.", "n": 23, "reviewed": 0, "changed": 0}, {"id": "bank-comm", "title": "NCLEX question bank: Community and fundamentals", "sub": "21 standalone practice questions.", "n": 21, "reviewed": 0, "changed": 0}, {"id": "bank-icu", "title": "NCLEX question bank: Critical care", "sub": "21 standalone practice questions.", "n": 21, "reviewed": 0, "changed": 0}, {"id": "bank-sd", "title": "NCLEX question bank: Cardiac and step-down", "sub": "19 standalone practice questions.", "n": 19, "reviewed": 0, "changed": 0}, {"id": "bank-peds", "title": "NCLEX question bank: Pediatrics", "sub": "17 standalone practice questions.", "n": 17, "reviewed": 0, "changed": 0}, {"id": "bank-ob", "title": "NCLEX question bank: Obstetrics and newborn", "sub": "15 standalone practice questions.", "n": 15, "reviewed": 0, "changed": 0}, {"id": "bank-psy", "title": "NCLEX question bank: Psychiatric", "sub": "11 standalone practice questions.", "n": 11, "reviewed": 0, "changed": 0}, {"id": "bank-periop", "title": "NCLEX question bank: Perioperative", "sub": "7 standalone practice questions.", "n": 7, "reviewed": 0, "changed": 0}, {"id": "cases-1", "title": "Case studies: Pneumonia that turns septic; Heart failure that tips over; New diabetes in DKA", "sub": "Unfolding case studies: one client, six questions in clinical judgment order.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "cases-2", "title": "Case studies: Hip replacement with a clot that travels; Variceal bleed in cirrhosis; Stroke alert in the ED", "sub": "Unfolding case studies: one client, six questions in clinical judgment order.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "cases-3", "title": "Case studies: Preeclampsia that turns severe; Infant with gastroenteritis and dehydration; House fire with inhalation injury", "sub": "Unfolding case studies: one client, six questions in clinical judgment order.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "cases-4", "title": "Case studies: Ankle fracture that turns into alcohol withdrawal; Stomach bug that ends in hyperkalemia; New antibiotic that triggers serotonin syndrome", "sub": "Unfolding case studies: one client, six questions in clinical judgment order.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "cases-5", "title": "Case studies: COPD flare with pneumonia; Bleeding after a hysterectomy; Head injury after a motorcycle crash", "sub": "Unfolding case studies: one client, six questions in clinical judgment order.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "cases-6", "title": "Case studies: Placental abruption at 34 weeks; Preterm labor at 31 weeks; Bacterial meningitis in a preschooler", "sub": "Unfolding case studies: one client, six questions in clinical judgment order.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "cases-7", "title": "Case studies: Fever and rigidity on haloperidol", "sub": "Unfolding case studies: one client, six questions in clinical judgment order.", "n": 6, "reviewed": 0, "changed": 0}]};</script><script>(()=>{const v=window.Shift||{},d=v.tel,h=window.RI||{packs:[]},p=document.getElementById("app"),i=e=>String(e??"").replace(/[&<>"']/g,a=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[a]),k={awaiting:"Awaiting clinical review",reviewed:"Clinically reviewed",changed:"Changed since its review"},f=e=>(e.reviewed===e.n?'<span class="chip reviewed">Clinically reviewed</span>':`<span class="chip awaiting">${e.reviewed} of ${e.n} reviewed</span>`)+(e.changed?` <span class="chip changed">${e.changed} changed since review</span>`:"");if(!h.pack){const e=[["Drills",a=>a.id.startsWith("drill-")],["NCLEX questions after each shift",a=>a.id.startsWith("ngn-shift")],["NCLEX question bank",a=>a.id.startsWith("bank-")],["Unfolding case studies",a=>a.id.startsWith("cases-")]];p.innerHTML=`<a class="home" href="/">The Shift</a><h1>Clinical review: practice content</h1>
      <p class="muted">The drills and NCLEX practice questions, split into packs a clinician can check in one sitting (about 30 to 45 minutes each). Each item shows the right answer and why every other option is wrong. Pick a pack that matches your experience.</p>
      <p><a href="/review/">Reviewing a whole shift instead? Shift reviews are here.</a></p>
      ${e.map(([a,s])=>{const o=h.packs.filter(s);return o.length?`<h2>${i(a)}</h2><div class="shifts">${o.map(c=>`<a href="/review/practice/${i(c.id)}/"><div class="card"><div style="display:flex;justify-content:space-between;gap:.6rem;flex-wrap:wrap"><h3>${i(c.title)}</h3><span>${f(c)}</span></div><p class="muted" style="margin:.3rem 0 0">${c.n} items. ${i(c.sub)}</p></div></a>`).join("")}</div>`:""}).join("")}`;return}const n=h.pack,g="theshift.review.items."+n.id;let t={};try{t=JSON.parse(localStorage.getItem(g)||"{}")||{}}catch{t={}}t.marks=t.marks||{},t.notes=t.notes||{};const m=()=>{try{localStorage.setItem(g,JSON.stringify(t))}catch{}},E=e=>e?/^  /.test(e)?`<p class="why">${i(e.trim())}</p>`:/^✓/.test(e)?`<p class="ok"><b>${i(e)}</b></p>`:/^(- ✗|- |✗)/.test(e)?`<p class="no">${i(e.replace(/^- /,""))}</p>`:`<p>${i(e)}</p>`:'<div class="sp"></div>',x=e=>`<div class="verdict" role="group" aria-label="Your verdict">${[["ok","Accurate"],["fix","Needs change"],["unsure","Not sure"]].map(([a,s])=>`<button type="button" data-rid="${i(e)}" data-v="${a}" aria-pressed="${t.marks[e]===a}">${s}</button>`).join("")}</div>
    <textarea data-note="${i(e)}" placeholder="What should it say instead? A source helps." ${t.marks[e]==="fix"||t.notes[e]?"":"hidden"} aria-label="Your comment">${i(t.notes[e]||"")}</textarea>`,S=(e,a)=>`<div class="dec item" id="i-${a+1}"><div class="top"><span class="pts">${a+1}</span><span class="chip ${e.st}">${i(k[e.st])}${e.by?`: ${i(e.by)}`:""}</span><span>${i(e.id)} · version ${i(e.hash)}</span></div>
      <b>${i(e.title)}</b><div class="body">${e.body.map(E).join("")}</div>${x(e.id)}</div>`,r=n.items.map(e=>e.id);p.innerHTML=`<a class="home" href="/review/practice/">The Shift · Practice review</a>
    <h1>${i(n.title)}</h1>
    <p class="muted" style="margin:0">${i(n.sub)}</p>
    <div class="meta">${f(h.packs.find(e=>e.id===n.id)||{n:r.length,reviewed:0,changed:0})}<span class="chip">${r.length} items</span></div>
    <div class="card how"><h3>How to review</h3><ol>
      <li>For each item, check that the marked answer is right, that every other option is clearly wrong (not just slightly less good), that the numbers are current, and that any tip is safe to remember as a rule.</li>
      <li>Mark <b>Accurate</b>, <b>Needs change</b> or <b>Not sure</b>. Say what's wrong when something needs changing.</li>
      <li>Add your details and any references, then send. Your answers save in this browser as you go, so you can stop and come back.</li></ol>
      <p class="muted" style="margin-bottom:0">These are practice items for nursing students, written to common US teaching. Judge them against what a safe, current standard of care would teach a new nurse, not your facility's policy.</p></div>

    <h2>About you</h2>
