<style>
:root{--bg:#ECE9E1;--surface:#FAF8F3;--surface-2:#F1EEE6;--ink:#1C2330;--ink-2:#59606B;--line:#D3CEC2;--teal:#22406A;--teal-ink:#fff;--red:#B3342B;--red-bg:#F8E1DE;--good:#2B7249;--good-bg:#E0F0E6;--amber:#A96C0E;--amber-bg:#FBEFD6;
  --serif:"Barlow Condensed","Arial Narrow",sans-serif;--sans:"Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161C;--surface:#1A1F27;--surface-2:#212833;--ink:#E7E4DB;--ink-2:#A0A5AE;--line:#343C48;--teal:#93B4E4;--teal-ink:#0F1B2C;--red:#F0766B;--red-bg:#3b1d1b;--good:#72c692;--good-bg:#16301f;--amber:#E9AE4E;--amber-bg:#35291a}}
:root[data-theme="dark"]{--bg:#12161C;--surface:#1A1F27;--surface-2:#212833;--ink:#E7E4DB;--ink-2:#A0A5AE;--line:#343C48;--teal:#93B4E4;--teal-ink:#0F1B2C;--red:#F0766B;--red-bg:#3b1d1b;--good:#72c692;--good-bg:#16301f;--amber:#E9AE4E;--amber-bg:#35291a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
main{max-width:52rem;margin:0 auto;padding:clamp(1.2rem,5vw,3rem) 16px calc(5rem + env(safe-area-inset-bottom))}
a{color:var(--teal)}
.home{font-family:var(--serif);font-weight:700;font-size:1.1rem;letter-spacing:.04em;text-transform:uppercase;background:var(--ink);color:var(--bg);padding:.28em .55em .22em;border-radius:2px;text-decoration:none}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.9rem,6vw,2.6rem);line-height:1.1;letter-spacing:0;margin:1.6rem 0 .3rem}
h2{font-size:1.15rem;margin:2.4rem 0 .6rem}
h3{font-size:1rem;margin:0}
p{margin:.5rem 0}
.muted{color:var(--ink-2)}
.meta{display:flex;flex-wrap:wrap;gap:.4rem .6rem;margin-top:.6rem}
.chip{display:inline-flex;align-items:center;padding:.15em .6em;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--surface-2);border:1px solid var(--line)}
.chip.awaiting{background:var(--amber-bg);border-color:transparent;color:var(--amber)}
.chip.reviewed{background:var(--good-bg);border-color:transparent;color:var(--good)}
.chip.changed{background:var(--red-bg);border-color:transparent;color:var(--red)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem 1.1rem;margin:.8rem 0}
.how ol{margin:.4rem 0 0;padding-left:1.2rem}.how li{margin:.2rem 0}
label{display:block;font-weight:600;font-size:.9rem;margin:.7rem 0 .25rem}
input[type=text],input[type=email],textarea,select{width:100%;min-height:44px;padding:.5em .7em;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:5rem;resize:vertical}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:0 1rem}
details.pt{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:.6rem 0}
details.pt>summary{cursor:pointer;padding:.85rem 1rem;font-weight:600;list-style-position:inside}
details.pt>div{padding:0 1rem 1rem}
table{width:100%;border-collapse:collapse;font-size:.88rem;margin:.4rem 0}
th,td{text-align:left;vertical-align:top;padding:.35rem .5rem .35rem 0;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--ink-2);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
.scroll{overflow-x:auto}
ul.plain{margin:.3rem 0;padding-left:1.1rem}
.dec{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:.85rem 1rem;margin:.6rem 0}
.dec.pos{border-left-color:var(--good)}.dec.neg{border-left-color:var(--red)}
.dec .top{display:flex;flex-wrap:wrap;gap:.3rem .5rem;align-items:center;font-size:.78rem;color:var(--ink-2);font-weight:600}
.pts{font-weight:700;padding:.05em .45em;border-radius:4px;background:var(--surface-2)}
.pos .pts{color:var(--good);background:var(--good-bg)}.neg .pts{color:var(--red);background:var(--red-bg)}
.dec b{display:block;margin:.35rem 0 .15rem;font-size:1rem}
.dec .why{font-family:var(--sans);color:var(--ink-2);margin:0}
.dec .src{font-size:.75rem;color:var(--ink-2);margin-top:.35rem}
.verdict{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.7rem}
.verdict button{min-height:40px;padding:.35em .9em;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer}
.verdict button[aria-pressed="true"][data-v="ok"]{background:var(--good);border-color:var(--good);color:var(--teal-ink)}
.verdict button[aria-pressed="true"][data-v="fix"]{background:var(--red);border-color:var(--red);color:var(--teal-ink)}
.verdict button[aria-pressed="true"][data-v="unsure"]{background:var(--amber);border-color:var(--amber);color:var(--teal-ink)}
.dec textarea{margin-top:.5rem;min-height:3.6rem}
.opt{padding:.4rem 0;border-bottom:1px solid var(--line);font-size:.92rem}.opt:last-child{border:0}
.opt i{font-style:normal;font-weight:700;font-size:.75rem;padding:.05em .4em;border-radius:4px;margin-right:.4rem;background:var(--surface-2)}
.bar{position:sticky;top:0;z-index:5;margin:0 -16px;padding:.6rem 16px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:.6rem;font-size:.9rem}
.bar .prog{display:block;flex:1;min-width:4rem;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;max-width:12rem}.bar .prog i{display:block;height:100%;background:var(--teal)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:.55em 1.2em;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn-primary{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.row{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1rem}
.check{display:flex;gap:.6rem;align-items:flex-start;font-weight:500;margin-top:1rem}
.check input{width:1.2rem;height:1.2rem;margin-top:.2rem;flex:none}
.msg{margin-top:.8rem;font-weight:600}.msg.err{color:var(--red)}.msg.ok{color:var(--good)}
pre{white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:.8rem;font-size:.8rem;max-height:18rem;overflow:auto}
.shifts a{display:block;text-decoration:none;color:inherit}
.shifts .card:hover{border-color:var(--ink-2)}
</style>
<style>.item .body p{margin:.15rem 0}.item .body .why{color:var(--ink-2);font-size:.92rem;margin:0 0 .35rem 1.1rem}.item .body .ok b{display:inline;margin:0;color:var(--good)}.item .body .no{color:var(--ink)}.item .body .sp{height:.5rem}.item>b{margin-bottom:.5rem}</style></head>

 torsades. Haloperidol, especially IV, prolongs the QT further.", "Pearl: Before QT-prolonging drugs (haloperidol, ondansetron, many antibiotics), check the QTc, potassium and magnesium. Over 500: hold and call."], "st": "awaiting"}, {"id": "drill:mp-mag-tox", "hash": "07f16d79b6", "title": "Magnesium sulfate 2 g/hour IV, continue: Keisha Monroe, 27", "body": ["For: Preeclampsia with severe features", "Six hours after birth. She's hard to rouse and her catheter bag has barely changed.", "", "✓ Check first: Reflexes, breathing and urine output → No knee reflex. RR 10. 40 mL of urine in 2 hours.", "- ✗ Fundus (Firm, at the umbilicus.)", "- ✗ Temperature (37.0.)", "", "✓ Then: Stop the infusion, call now, get calcium gluconate ready", "- ✗ Keep it running and give calcium gluconate", "  Why not: The antidote doesn't make the infusion safe. Stop the magnesium first.", "- ✗ Slow it to 1 g/hour and recheck her reflexes in an hour", "  Why not: No reflexes and a respiratory rate of 10 mean she's toxic now. Stop it.", "", "Why: Magnesium leaves through the kidneys. Low urine output lets it build up; lost reflexes and slow breathing are signs of toxicity.", "Pearl: Magnesium checks: reflexes, breathing (12 or more), urine (30 mL/hr or more), level of consciousness. Toxic? Stop it, call, calcium gluconate is the antidote."], "st": "awaiting"}, {"id": "drill:mp-pit-up", "hash": "77c8a714d6", "title": "Oxytocin: increase by 2 milliunits/min per protocol: Sofia Ramirez, 30", "body": ["For: Induction of labor", "The titration is due. She says the contractions are \"one on top of the other.\"", "", "✓ Check first: The contraction pattern and fetal heart tracing → 6 contractions in 10 minutes. Late decelerations with the last three.", "- ✗ Her pain score (Pain 8.)", "- ✗ Her temperature (37.2.)", "", "✓ Then: Don't increase. Stop the oxytocin, turn her on her side, fluid bolus, call", "- ✗ Decrease it by half and reposition her", "  Why not: With late decelerations, protocols stop oxytocin, not just lower it.", "- ✗ Hold the increase and recheck in 30 minutes", "  Why not: Late decelerations with tachysystole need action now, not a recheck.", "", "Why: More than 5 contractions in 10 minutes is tachysystole. With late decelerations, the baby isn't getting enough oxygen between contractions.", "Pearl: Tachysystole with a worrying tracing: stop oxytocin, lateral position, IV fluid, notify. An order to titrate never overrides the tracing."], "st": "awaiting"}, {"id": "drill:mp-gent-cr", "hash": "a9821e47f4", "title": "Gentamicin IV, scheduled: Ray Holloway, 72", "body": ["For: Urinary sepsis", "Day 4. His urine output has been dropping.", "", "✓ Check first: Creatinine trend and drug level → Creatinine 2.1, up from 1.0. Trough above range.", "- ✗ His temperature (37.3.)", "- ✗ His blood pressure (BP 132/76.)", "", "✓ Then: Hold it and call the provider and pharmacy", "- ✗ Give it and ask pharmacy to recheck a level tomorrow", "  Why not: A doubled creatinine and a high trough mean it's accumulating now.", "- ✗ Give it with an extra liter of fluid to protect his kidneys", "  Why not: Fluid doesn't make a toxic level safe.", "", "Why: Gentamicin can damage the kidneys and the ear. A doubling creatinine and a high trough mean it's building up.", "Pearl: Aminoglycosides and vancomycin: watch creatinine, urine output and levels. Rising creatinine? Hold and call before the next dose."], "st": "awaiting"}, {"id": "drill:mp-alendronate", "hash": "960b24f25a", "title": "Alendronate 70 mg PO, weekly: June Whitaker, 77", "body": ["For: Osteoporosis", "06:30. She's sitting up in the chair. Breakfast arrives at 07:30. She asks for it with her coffee.", "", "✓ Check first: Whether she can stay upright and wait to eat → She can sit up for the next hour. Nothing to eat or drink yet.", "- ✗ Calcium level (9.2. Normal.)", "- ✗ Blood pressure (BP 134/78.)", "", "✓ Then: Give it now with a full glass of plain water. Upright 30 minutes, then breakfast", "- ✗ Give it with her coffee, since she'll stay upright", "  Why not: Anything but plain water blocks absorption.", "- ✗ Give it now, then help her back to bed to rest", "  Why not: Lying down within 30 minutes risks esophageal injury.", "", "Why: Alendronate absorbs poorly with anything but water, and it can burn the esophagus if she lies down.", "Pearl: Bisphosphonates: first thing in the morning, full glass of plain water, upright 30 minutes, nothing else by mouth for 30 minutes."], "st": "awaiting"}, {"id": "drill:mp-vanco-rate", "hash": "6bda999ca1", "title": "Vancomycin 1.5 g IV, infusing: Marcus Webb, 45", "body": ["For: Cellulitis", "Ten minutes in, his face and neck are red and he says he's itchy. He's breathing fine.", "", "✓ Check first: The infusion rate → It's set to run over 30 minutes.", "- ✗ His temperature (37.4.)", "- ✗ His glucose (118.)", "", "✓ Then: Stop it, tell the provider, restart over at least 90 minutes", "- ✗ Keep it running and give PRN diphenhydramine", "  Why not: The rate is the cause. Stop the infusion first.", "- ✗ Stop it and list vancomycin as an allergy", "  Why not: Flushing from a fast infusion is a rate reaction, not usually an allergy. Labeling it an allergy can take away an antibiotic he needs.", "", "Why: Flushing and itching from a fast vancomycin infusion is an infusion reaction, not usually a true allergy. It's about speed: run 1.5 g over 90 minutes or more.", "Pearl: Vancomycin: no faster than about 1 g an hour. Flushing above the waist? Stop, treat as ordered, restart slower. Wheeze, swelling or low BP is anaphylaxis: call a rapid response."], "st": "awaiting"}, {"id": "drill:mp-blood-abo", "hash": "236e7d028a", "title": "1 unit packed red blood cells: Esther Nwosu, 63", "body": ["For: Hemoglobin 6.8", "The unit is here. You and another nurse are at the bedside for the check.", "", "✓ Check first: Her ID band against the unit tag, together → Name and record number match. The unit is A positive. Her type is B positive.", "- ✗ Her pre-transfusion vital signs (T 36.9, HR 98, BP 118/70.)", "- ✗ The IV size (20 gauge in her forearm.)", "", "✓ Then: Don't hang it. Return it to the blood bank and call them", "- ✗ Call the blood bank, but hang it while you wait", "  Why not: Nothing mismatched goes up, ever.", "- ✗ Hang it slowly and stay for the first 15 minutes", "  Why not: Watching doesn't make a mismatched unit safe.", "", "Why: Type A cells given to a type B patient can cause a fatal hemolytic reaction within minutes. The bedside check is the last stop before that happens.", "Pearl: Blood: two licensed people check patient and unit at the bedside, every time. Any mismatch, it doesn't go up. Stay with them for the first 15 minutes."], "st": "awaiting"}, {"id": "drill:mp-dka-k", "hash": "3dcefd1558", "title": "Regular insulin infusion, start per DKA protocol: Tyler Brooks, 22", "body": ["For: Diabetic ketoacidosis", "He arrived from the ED with fluids running. The first labs just posted.", "", "✓ Check first: Potassium → K 3.0.", "- ✗ Glucose trend (486, down from 610 with fluids.)", "- ✗ Anion gap (24.)", "", "✓ Then: Hold the insulin. Replace potassium first, then start the drip", "- ✗ Start the drip; his potassium will rise as the acidosis corrects", "  Why not: It's the reverse: correcting acidosis and giving insulin both push potassium into cells.", "- ✗ Start the drip at half rate while potassium runs in", "  Why not: Protocols hold insulin under 3.3. Even half the rate drives potassium lower.", "", "Why: Insulin drives potassium into cells. Starting at 3.0 can push it dangerously low and stop the heart. DKA protocols hold insulin until potassium is at least 3.3.", "Pearl: DKA: fluids first, check potassium before insulin. Under 3.3, replace it before the drip. Glucose is not the emergency; potassium and acidosis are."], "st": "awaiting"}, {"id": "drill:mp-peds-ibu", "hash": "5812d87e6f", "title": "Ibuprofen 10 mg/kg PO: Mila Torres, 2", "body": ["For: Fever, 38.8", "Gastroenteritis. She's been vomiting since last night.", "", "✓ Check first: Her hydration and urine output → No wet diaper in 10 hours. Dry lips, no tears.", "- ✗ Her weight (12 kg.)", "- ✗ Her ears (Normal.)", "", "✓ Then: Hold the ibuprofen and call about fluids", "- ✗ Give it and start oral rehydration", "  Why not: She's too dry and still vomiting. She needs fluids before an NSAID.", "- ✗ Give it with a small sip of fluid to protect her stomach", "  Why not: The concern isn't her stomach; it's the kidneys of a dehydrated child.", "", "Why: A child who is this dry is at risk of kidney injury, and NSAIDs reduce blood flow to the kidneys. She needs fluids before anything else.", "Pearl: Kids: count the wet diapers. Dehydration plus an NSAID can hurt the kidneys. Fluids first; ask about acetaminophen for the fever."], "st": "awaiting"}, {"id": "drill:mp-olz-benzo", "hash": "83f2e3580b", "title": "Olanzapine 10 mg IM, as needed: Andre Tillman, 39", "body": ["For: Severe agitation", "He's calmer than an hour ago but still yelling. A colleague grabs the olanzapine.", "", "✓ Check first: What he's had in the last few hours → Lorazepam 2 mg IM 40 minutes ago.", "- ✗ His blood pressure (BP 128/78.)", "- ✗ His oxygen saturation (SpO₂ 97%.)", "", "✓ Then: Hold it. Keep watching his breathing and call the prescriber", "- ✗ Give it, since the lorazepam was 40 minutes ago", "  Why not: That's too soon after an injected benzodiazepine.", "- ✗ Give it and check his vitals every 15 minutes", "  Why not: Monitoring is for a decision that's already safe. This combination is warned against.", "", "Why: IM olanzapine soon after an injected benzodiazepine can cause dangerous low blood pressure and slowed breathing.", "Pearl: Before any PRN for agitation, read what was already given. IM olanzapine and an injected benzodiazepine are not given close together."], "st": "awaiting"}, {"id": "drill:mp-dystonia", "hash": "3c4f24f0cb", "title": "Haloperidol 5 mg PO, scheduled: Jordan Ellis, 19", "body": ["For: First-episode psychosis", "He started it yesterday. Staff say he's \"acting out\": his neck is twisted and his eyes keep rolling up.", "", "✓ Check first: Look closely at his neck, jaw and eyes → Neck held to one side, jaw clenched, eyes fixed upward. He says he can't stop it.", "- ✗ His blood pressure (BP 124/78.)", "- ✗ His pulse (HR 96.)", "", "✓ Then: Hold it, give the PRN benztropine or diphenhydramine, call", "- ✗ Give it, along with a dose of benztropine", "  Why not: Treat the dystonia first and tell the prescriber. Giving the same dose again may bring it right back.", "- ✗ Hold it and give lorazepam for the agitation", "  Why not: He isn't agitated; his muscles are in spasm. Benztropine or diphenhydramine treats it.", "", "Why: This is an acute dystonic reaction to haloperidol. It's frightening and painful, and it can affect the airway. An anticholinergic fixes it within minutes.", "Pearl: New antipsychotic plus a twisted neck, rolled eyes or a locked jaw: acute dystonia, not behavior. Benztropine or diphenhydramine, and tell the prescriber."], "st": "awaiting"}, {"id": "drill:mp-ciwa-low", "hash": "983e6b4998", "title": "Lorazepam 1 mg PO, as needed for CIWA 10 or more: Dale Hutchins, 48", "body": ["For: Alcohol withdrawal", "He asks for \"something to take the edge off.\" Last drink: about 30 hours ago.", "", "✓ Check first: His withdrawal score (CIWA) right now → CIWA 6: mild anxiety and a slight tremor.", "- ✗ His glucose (102.)", "- ✗ His liver tests (Mildly up.)", "", "✓ Then: Hold it. Offer a quiet room and fluids, rescore in an hour", "- ✗ Give it, since he's at risk for withdrawal seizures", "  Why not: Symptom-triggered dosing protects him by scoring often, not by dosing under the threshold.", "- ✗ Give half a dose to keep him ahead of it", "  Why not: The order doesn't cover partial doses below the threshold.", "", "Why: His score is below the line on the order. Symptom-triggered dosing works because it's given for the score, not the request. You can still help him.", "Pearl: Symptom-triggered orders: score, then dose. Under the threshold, comfort measures and a rescore. Withdrawal peaks at 24 to 72 hours, so keep scoring."], "st": "awaiting"}, {"id": "drill:mp-enox-epi", "hash": "0583ac3799", "title": "Enoxaparin 40 mg SubQ: Nancy Ferguson, 68", "body": ["For: Clot prevention after knee replacement", "Her epidural catheter is coming out at 10:00. It's 08:00.", "", "✓ Check first: The timing against the epidural removal → Removal is in 2 hours. Her last dose was 20 hours ago.", "- ✗ Her platelets (214,000.)", "- ✗ Her pain score (Pain 3.)", "", "✓ Then: Hold it and check timing with anesthesia", "- ✗ Give it now so it's done before the catheter comes out", "  Why not: That's exactly the timing that risks a spinal hematoma.", "- ✗ Give it and ask anesthesia to push the removal back", "  Why not: Anesthesia sets the timing. Ask before you give, not after.", "", "Why: Removing an epidural catheter while enoxaparin is working can cause a spinal bleed that paralyses. The catheter usually comes out 12 hours after a dose, and the next dose waits about 4 hours after removal.", "Pearl: Anticoagulants and epidurals: line up the dose times with catheter placement and removal. If you're unsure, hold and ask anesthesia."], "st": "awaiting"}, {"id": "drill:mp-kcl-po", "hash": "2242036460", "title": "Potassium chloride 20 mEq PO: Lorraine Biggs, 58", "body": ["For: K 3.4", "She's eating breakfast. \"These pills are huge.\"", "", "✓ Check first: Her urine output and kidney function → Urinating normally. Creatinine 0.8.", "- ✗ Her temperature (36.8.)", "- ✗ Her oxygen (SpO₂ 97%.)", "", "✓ Then: Give it with breakfast and a full glass of water", "- ✗ Give it on an empty stomach so it absorbs better", "  Why not: Oral potassium irritates the stomach. Give it with food.", "- ✗ Crush it into her oatmeal so it's easier to swallow", "  Why not: Many potassium tablets are extended release and can't be crushed. Ask for the liquid form.", "", "Why: Her kidneys work and her potassium is low. Taken with food and water, oral potassium is less likely to upset or injure her stomach.", "Pearl: Oral potassium: with food and a full glass of water, swallowed whole. Many tablets are extended release. If the pill is too big, ask for the liquid."], "st": "awaiting"}, {"id": "drill:mp-ng-check", "hash": "b1c848987e", "title": "Medications through the NG tube: Gerald Fox, 76", "body": ["For: After a stroke", "The tape is loose. The mark at his nose read 55 cm yesterday.", "", "✓ Check first: The tube's mark at the nose → It now reads 47 cm. The tube has slid out 8 cm.", "- ✗ His blood pressure (BP 150/88.)", "- ✗ His gastric residual (30 mL.)", "", "✓ Then: Don't use it. Report it and confirm placement before anything goes in", "- ✗ Advance it back to 55 cm and give the meds", "  Why not: Advancing a tube blindly doesn't confirm where the tip is.", "- ✗ Test the pH of an aspirate and give the meds if it's acidic", "  Why not: After a tube has moved 8 cm, follow policy to reconfirm placement (usually an X-ray) before anything goes in. pH alone isn't enough here.", "", "Why: A tube that has moved may now end in the esophagus or the airway. Anything you push could go into his lungs.", "Pearl: Before every use: check the external length. If it has moved, stop and reconfirm placement per policy (X-ray is the standard). Never push a tube back in blindly."], "st": "awaiting"}, {"id": "drill:mp-h-digoxin-k", "hash": "e933db824b", "title": "Digoxin 0.125 mg PO: Harold Banks, 78 · NCLEX level", "body": ["For: Atrial fibrillation with heart failure", "He also takes furosemide 40 mg daily. Morning labs just posted. He feels fine.", "", "✓ Check first: Potassium → K 3.2.", "- ✗ Apical pulse for a full minute (Apical 72, irregular.)", "- ✗ Yesterday's digoxin level (1.0 ng/mL, in range.)", "", "✓ Then: Hold it and call about the potassium first", "- ✗ Give it: his pulse is over 60 and the level is in range", "  Why not: Both are reassuring, but a low potassium makes even an in-range digoxin level toxic to the heart. Report the K before the dose.", "- ✗ Give it and ask for potassium replacement afterward", "  Why not: Close. The order matters: the provider may want the potassium corrected before he gets more digoxin.", "", "Why: Low potassium lets digoxin bind more tightly to the heart, so toxicity can happen at a normal level. Furosemide is pulling his potassium down.", "Pearl: Digoxin: apical pulse, potassium and the level. Hypokalemia, hypomagnesemia and hypercalcemia all raise the risk of toxicity even when the level looks fine."], "st": "awaiting"}, {"id": "drill:mp-h-lisinopril-give", "hash": "8285221328", "title": "Lisinopril 10 mg PO (hold for SBP under 100): Maria Santos, 64 · NCLEX level", "body": ["For: Hypertension and diabetic kidney disease", "She feels well and wants to walk to the window.", "", "✓ Check first: Blood pressure, against the hold parameter → BP 104/64. No dizziness sitting or standing.", "- ✗ Potassium (K 4.6.)", "- ✗ Creatinine (1.1, stable.)", "", "✓ Then: Give it", "- ✗ Hold it: 104 is too close to the line", "  Why not: Parameters exist so you don't have to guess. She's above it, without symptoms, and the drug also protects her kidneys.", "- ✗ Give half the dose", "  Why not: Changing a dose isn't a nursing decision. Either the parameter is met or it isn't.", "", "Why: Her pressure is above the hold line, she has no symptoms of low blood pressure, and her potassium and kidney function are fine. Holding without a reason is a missed dose.", "Pearl: Hold parameters cut both ways: under the line, hold and report; over it, give. Check orthostatic symptoms if you're unsure."], "st": "awaiting"}, {"id": "drill:mp-h-enox-plt", "hash": "9545686173", "title": "Enoxaparin 40 mg SubQ: Owen Price, 70 · NCLEX level", "body": ["For: Clot prevention after hip surgery", "Day 2 after surgery. A colleague wonders if he should get it with his platelets down.", "", "✓ Check first: Platelets, against his baseline → 141,000, from 168,000 before surgery.", "- ✗ Creatinine (0.9.)", "- ✗ Look at the incision and his skin (Dressing dry. No new bruising.)", "", "✓ Then: Give it", "- ✗ Hold it and report possible HIT", "  Why not: HIT drops platelets by half or more, usually 5 to 10 days after heparin starts. A small dip on day 2 after surgery isn't that pattern.", "- ✗ Hold it until tomorrow's platelet count", "  Why not: Skipping clot prevention after hip surgery raises the risk of a DVT or PE, and nothing here calls for it.", "", "Why: A 16% drop two days after surgery is expected from blood loss and dilution. He isn't bleeding, and his kidneys clear the drug normally.", "Pearl: Think HIT when platelets fall by half or more, 5 to 10 days in (sooner if exposed in the last 100 days), or a new clot forms. Small early dips are common after surgery."], "st": "awaiting"}, {"id": "drill:mp-h-oxy-poss2", "hash": "21dbd639ac", "title": "Oxycodone 5 mg PO, every 4 hours as needed: Darius King, 47 · NCLEX level", "body": ["For: Pain after a hernia repair", "Pain 7 of 10. He has dozed off twice while you talked. His last dose was 4 hours ago.", "", "✓ Check first: Sedation level and breathing → Drowsy but wakes easily to your voice and stays awake. RR 14, SpO₂ 96% on room air.", "- ✗ Blood pressure (BP 138/84.)", "- ✗ Bowel sounds (Present in all four quadrants.)", "", "✓ Then: Give it, and recheck his sedation and breathing in 30 to 60 minutes", "- ✗ Hold it, because he keeps dozing off", "  Why not: Drowsy but easy to rouse is an acceptable sedation level. Untreated pain keeps him from breathing deeply and walking.", "- ✗ Give half the dose to be safe", "  Why not: He's safe for the ordered dose. A partial dose isn't ordered, and undertreating pain has its own risks.", "", "Why: Sedation that's easy to reverse with your voice, with normal breathing, is acceptable for an opioid. Sedation you can't interrupt, or drifting off mid-sentence, is when you hold.", "Pearl: Use a sedation scale (like POSS). 1 to 2 (awake or drowsy, easy to rouse): give and monitor. 3 (falls asleep mid-conversation): hold, rouse, report. 4: emergency."], "st": "awaiting"}, {"id": "drill:mp-h-levo-hr", "hash": "9719f35931", "title": "Levothyroxine 150 mcg PO: Linda Park, 58 · NCLEX level", "body": ["For: Hypothyroidism (dose raised last week)", "06:00. She says her heart has been \"racing\" and she can't sleep.", "", "✓ Check first: Apical pulse and how she looks → HR 118, regular. Fine tremor of the hands. Sweaty.", "- ✗ Last TSH (Low-normal, a month ago, before the dose went up.)", "- ✗ Temperature (37.2.)", "", "✓ Then: Hold it and report the symptoms", "- ✗ Give it: last month's TSH was normal", "  Why not: That TSH was before the dose went up. Her symptoms now point to too much thyroid hormone.", "- ✗ Give it and ask for a beta blocker for the heart rate", "  Why not: Treating the symptom while giving more of the cause doesn't make sense. Report first.", "", "Why: A racing heart, tremor, sweating and insomnia after a dose increase are signs of too much thyroid hormone. In older adults this can trigger atrial fibrillation or angina.", "Pearl: Levothyroxine: hold and report signs of excess (tachycardia, palpitations, tremor, heat intolerance, insomnia), especially after a dose change."], "st": "awaiting"}, {"id": "drill:mp-h-ssri-teen", "hash": "db207c34c7", "title": "Sertraline 50 mg PO: Emma Walsh, 16 · NCLEX level", "body": ["For: Depression, started 2 weeks ago", "She tells you quietly she's been thinking about death more since starting it.", "", "✓ Check first: Ask her directly about suicide → \"I think about not being here. I don't have a plan.\"", "- ✗ Her weight (Down 1 kg since admission.)", "- ✗ Her sleep (About 6 hours a night.)", "", "✓ Then: Give it, keep her safe, and report the suicidal thoughts now", "- ✗ Hold it: antidepressants cause suicidal thoughts in teens", "  Why not: The warning is to watch closely, not to stop on your own. Stopping is the prescriber's call; her safety and the report are yours.", "- ✗ Give it and pass it on to the morning team", "  Why not: New or worse suicidal thoughts are reported now, with a safety check now.", "", "Why: Young people starting an antidepressant need close watching for new or worse suicidal thinking, especially in the first weeks. The response is a safety assessment and an urgent report, not a nurse-initiated stop.", "Pearl: Antidepressants under 25: watch for new suicidal thoughts, agitation or unusual changes, especially early or after a dose change. Ask directly, keep them safe, report now."], "st": "awaiting"}, {"id": "drill:mp-h-warfarin-low", "hash": "2d48cc369e", "title": "Warfarin 5 mg PO: George Hill, 74 · NCLEX level", "body": ["For: Atrial fibrillation (INR goal 2 to 3)", "He missed two doses at home before admission.", "", "✓ Check first: Today's INR → INR 1.6.", "- ✗ Signs of bleeding (None.)", "- ✗ Platelets (220,000.)", "", "✓ Then: Give it and report the low INR", "- ✗ Hold it until the INR is back in range", "  Why not: A low INR means he needs the drug, not less of it. Holding raises his stroke risk further.", "- ✗ Give a double dose to catch up", "  Why not: Dose changes are the prescriber's, and doubling warfarin can overshoot into bleeding.", "", "Why: Below goal, his clot and stroke risk is higher. Give the ordered dose and let the prescriber adjust it or add a bridge.", "Pearl: High INR: hold and report. Low INR: give as ordered and report. Never adjust warfarin yourself."], "st": "awaiting"}, {"id": "drill:mp-h-iron-antacid", "hash": "b5c116232c", "title": "Ferrous sulfate 325 mg PO: Grace Lin, 39 · NCLEX level", "body": ["For: Iron deficiency anemia", "09:00. Her heartburn is bad this morning.", "", "✓ Check first: What else is due at 09:00 → Calcium carbonate antacid, 2 tablets.", "- ✗ Hemoglobin (9.2.)", "- ✗ Her last bowel movement (Yesterday, dark and formed.)", "", "✓ Then: Give the antacid now for her heartburn, and the iron 2 hours later", "- ✗ Give them together with breakfast to protect her stomach", "  Why not: Antacids and food both cut iron absorption. Separate them.", "- ✗ Hold the iron today because of the heartburn", "  Why not: Heartburn isn't a reason to skip iron. Spacing the doses solves it.", "", "Why: Calcium and antacids bind iron in the gut. Space them at least 1 to 2 hours apart. Treat her symptom first, then give the iron later.", "Pearl: Iron: empty stomach if tolerated, with vitamin C helps; not with antacids, calcium, dairy or tea. Dark stools are expected; tarry, sticky stools with symptoms are not."], "st": "awaiting"}, {"id": "drill:mp-h-lithium-give", "hash": "9066202da3", "title": "Lithium carbonate 300 mg PO: Sam Ortega, 29 · NCLEX level", "body": ["For: Bipolar disorder, started 5 days ago", "He says his hands are a bit shaky and he felt queasy after breakfast. He wants to stop it.", "", "✓ Check first: Lithium level and what the tremor looks like → Level 0.8. Fine tremor holding a cup. No vomiting or diarrhea. Alert.", "- ✗ Sodium (Na 139.)", "- ✗ Urine output (Normal, clear.)", "", "✓ Then: Give it with food, and explain these effects often ease", "- ✗ Hold it: tremor and nausea are signs of toxicity", "  Why not: A fine tremor and mild nausea at a level of 0.8 are common early side effects. Toxicity looks like a coarse tremor, vomiting, diarrhea, confusion or unsteadiness.", "- ✗ Hold it because he wants to stop", "  Why not: His concern deserves a conversation and a report to the prescriber, but holding a mood stabilizer on day 5 without that conversation isn't the answer.", "", "Why: His level is in range and his symptoms are the expected early ones. Taking it with food helps the nausea. Tell the prescriber he's thinking of stopping.", "Pearl: Lithium: fine tremor and mild nausea early are common. Coarse tremor, vomiting, diarrhea, confusion or ataxia is toxicity. Keep fluids and salt steady."], "st": "awaiting"}, {"id": "drill:mp-h-furosemide-give", "hash": "fe30fd8c8e", "title": "Furosemide 40 mg IV: Betty Clarke, 81 · NCLEX level", "body": ["For: Heart failure exacerbation", "Weight up 1.2 kg. Crackles at both bases. Her pressure is lower than yesterday.", "", "✓ Check first: Blood pressure and how she feels → BP 104/62, no dizziness. Yesterday 132/78.", "- ✗ Potassium (K 3.8.)", "- ✗ Creatinine (1.2, stable.)", "", "✓ Then: Give it", "- ✗ Hold it: her pressure is soft", "  Why not: 104 without symptoms isn't a hold, and she's carrying extra fluid. The fluid is what's hurting her.", "- ✗ Give it orally instead to make it gentler", "  Why not: Changing the route is a new order, and gut swelling in heart failure makes oral absorption less reliable.", "", "Why: She's fluid overloaded with crackles and weight gain. Her pressure is lower but adequate, potassium and kidneys are fine. Diuresis is the treatment.", "Pearl: In heart failure, a modest pressure drop is common with treatment. Hold for symptomatic hypotension, low potassium or worsening kidney function, not for a number that still meets the order."], "st": "awaiting"}]}, "packs": [{"id": "drill-med-1", "title": "Drills: Med Pass, part 1 of 2", "sub": "What to check before a medication, then give, hold or call. A pharmacist is especially welcome.", "n": 25, "reviewed": 0, "changed": 0}, {"id": "drill-med-2", "title": "Drills: Med Pass, part 2 of 2", "sub": "What to check before a medication, then give, hold or call. A pharmacist is especially welcome.", "n": 25, "reviewed": 0, "changed": 0}, {"id": "drill-first-1", "title": "Drills: Who's First, part 1 of 2", "sub": "Four patients, one nurse: who do you see first, and why not the others.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "drill-first-2", "title": "Drills: Who's First, part 2 of 2", "sub": "Four patients, one nurse: who do you see first, and why not the others.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "drill-sbar", "title": "Drills: SBAR", "sub": "Building a call to the
