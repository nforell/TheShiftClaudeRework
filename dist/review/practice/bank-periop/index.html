<style>
:root{--bg:#E6EDF0;--surface:#FBFCFC;--surface-2:#EDF2F4;--ink:#152238;--ink-2:#4D5A6F;--line:#CAD5DB;--teal:#2449A8;--teal-ink:#fff;--red:#B3342B;--red-bg:#F8E1DE;--good:#2B7249;--good-bg:#E0F0E6;--amber:#A96C0E;--amber-bg:#FBEFD6;
  --serif:"Barlow Condensed","Arial Narrow",sans-serif;--sans:"Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161C;--surface:#1A1F27;--surface-2:#212833;--ink:#E7E4DB;--ink-2:#A0A5AE;--line:#343C48;--teal:#93B4E4;--teal-ink:#0F1B2C;--red:#F0766B;--red-bg:#3b1d1b;--good:#72c692;--good-bg:#16301f;--amber:#E9AE4E;--amber-bg:#35291a}}
:root[data-theme="dark"]{--bg:#12161C;--surface:#1A1F27;--surface-2:#212833;--ink:#E7E4DB;--ink-2:#A0A5AE;--line:#343C48;--teal:#93B4E4;--teal-ink:#0F1B2C;--red:#F0766B;--red-bg:#3b1d1b;--good:#72c692;--good-bg:#16301f;--amber:#E9AE4E;--amber-bg:#35291a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
main{max-width:52rem;margin:0 auto;padding:clamp(1.2rem,5vw,3rem) 16px calc(5rem + env(safe-area-inset-bottom))}
a{color:var(--teal)}
.home{font-family:var(--serif);font-weight:700;font-size:1.1rem;letter-spacing:.04em;text-transform:uppercase;background:var(--ink);color:var(--bg);padding:.28em .55em .22em;border-radius:2px;text-decoration:none}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.9rem,6vw,2.6rem);line-height:1.1;letter-spacing:0;margin:1.6rem 0 .3rem}
h2{font-size:1.15rem;margin:2.4rem 0 .6rem}
h3{font-size:1rem;margin:0}
p{margin:.5rem 0}
.muted{color:var(--ink-2)}
.meta{display:flex;flex-wrap:wrap;gap:.4rem .6rem;margin-top:.6rem}
.chip{display:inline-flex;align-items:center;padding:.15em .6em;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--surface-2);border:1px solid var(--line)}
.chip.awaiting{background:var(--amber-bg);border-color:transparent;color:var(--amber)}
.chip.reviewed{background:var(--good-bg);border-color:transparent;color:var(--good)}
.chip.changed{background:var(--red-bg);border-color:transparent;color:var(--red)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem 1.1rem;margin:.8rem 0}
.how ol{margin:.4rem 0 0;padding-left:1.2rem}.how li{margin:.2rem 0}
label{display:block;font-weight:600;font-size:.9rem;margin:.7rem 0 .25rem}
input[type=text],input[type=email],textarea,select{width:100%;min-height:44px;padding:.5em .7em;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:5rem;resize:vertical}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:0 1rem}
details.pt{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:.6rem 0}
details.pt>summary{cursor:pointer;padding:.85rem 1rem;font-weight:600;list-style-position:inside}
details.pt>div{padding:0 1rem 1rem}
table{width:100%;border-collapse:collapse;font-size:.88rem;margin:.4rem 0}
th,td{text-align:left;vertical-align:top;padding:.35rem .5rem .35rem 0;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--ink-2);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
.scroll{overflow-x:auto}
ul.plain{margin:.3rem 0;padding-left:1.1rem}
.dec{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:.85rem 1rem;margin:.6rem 0}
.dec.pos{border-left-color:var(--good)}.dec.neg{border-left-color:var(--red)}
.dec .top{display:flex;flex-wrap:wrap;gap:.3rem .5rem;align-items:center;font-size:.78rem;color:var(--ink-2);font-weight:600}
.pts{font-weight:700;padding:.05em .45em;border-radius:4px;background:var(--surface-2)}
.pos .pts{color:var(--good);background:var(--good-bg)}.neg .pts{color:var(--red);background:var(--red-bg)}
.dec b{display:block;margin:.35rem 0 .15rem;font-size:1rem}
.dec .why{font-family:var(--sans);color:var(--ink-2);margin:0}
.dec .src{font-size:.75rem;color:var(--ink-2);margin-top:.35rem}
.verdict{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.7rem}
.verdict button{min-height:40px;padding:.35em .9em;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer}
.verdict button[aria-pressed="true"][data-v="ok"]{background:var(--good);border-color:var(--good);color:var(--teal-ink)}
.verdict button[aria-pressed="true"][data-v="fix"]{background:var(--red);border-color:var(--red);color:var(--teal-ink)}
.verdict button[aria-pressed="true"][data-v="unsure"]{background:var(--amber);border-color:var(--amber);color:var(--teal-ink)}
.dec textarea{margin-top:.5rem;min-height:3.6rem}
.opt{padding:.4rem 0;border-bottom:1px solid var(--line);font-size:.92rem}.opt:last-child{border:0}
.opt i{font-style:normal;font-weight:700;font-size:.75rem;padding:.05em .4em;border-radius:4px;margin-right:.4rem;background:var(--surface-2)}
.bar{position:sticky;top:0;z-index:5;margin:0 -16px;padding:.6rem 16px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:.6rem;font-size:.9rem}
.bar .prog{display:block;flex:1;min-width:4rem;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;max-width:12rem}.bar .prog i{display:block;height:100%;background:var(--teal)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:.55em 1.2em;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn-primary{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.row{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1rem}
.check{display:flex;gap:.6rem;align-items:flex-start;font-weight:500;margin-top:1rem}
.check input{width:1.2rem;height:1.2rem;margin-top:.2rem;flex:none}
.msg{margin-top:.8rem;font-weight:600}.msg.err{color:var(--red)}.msg.ok{color:var(--good)}
pre{white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:.8rem;font-size:.8rem;max-height:18rem;overflow:auto}
.shifts a{display:block;text-decoration:none;color:inherit}
.shifts .card:hover{border-color:var(--ink-2)}
</style>
<style>.item .body p{margin:.15rem 0}.item .body .why{color:var(--ink-2);font-size:.92rem;margin:0 0 .35rem 1.1rem}.item .body .ok b{display:inline;margin:0;color:var(--good)}.item .body .no{color:var(--ink)}.item .body .sp{height:.5rem}.item>b{margin-bottom:.5rem}</style></head>

- The client put on reading glasses to read the form", "  No: using glasses shows the client could read the form. Vision aids help consent; they do not threaten it.", "✓ The client asks, \"Is it true this might turn into a big open surgery?\"", "  Yes: an unanswered question about risks or alternatives means the surgeon needs to return. The trap is answering it yourself; the nurse does not provide the informed consent discussion.", "✓ The client received midazolam 2 mg IV 10 minutes ago", "  Yes: a client under the effect of a sedative may not be able to give valid consent. Consent should be obtained before sedating premedication is given.", "- The client's spouse has not arrived yet", "  No: an alert adult with decision-making capacity consents for their own care. A spouse's presence or signature is not required.", "- The client says, \"I'm nervous, but I want to get this done.\"", "  No: some anxiety before surgery is expected and does not make consent invalid. The nurse acknowledges the feeling and continues if the client understands the procedure.", "- The client states a name and date of birth that match the wristband and the form", "  No: matching identifiers are what the nurse should confirm as a witness. This finding supports proceeding.", "", "Why: When the nurse witnesses consent, the nurse confirms the client's identity, that the client signed voluntarily, and that the client appears competent and not impaired. The provider performing the procedure is responsible for explaining it, its risks, benefits and alternatives. If the client lacks understanding, has questions or has been sedated, the nurse stops and notifies the provider.", "Tip: The nurse witnesses the signature; the provider informs. Any sign the client does not understand or cannot decide means stop and call the provider."], "st": "awaiting"}, {"id": "ngn:qb-mgmt-19", "hash": "69859d4aca", "title": "I-PASS handoff · Evaluate outcomes", "body": ["A new graduate nurse in the PACU gives handoff by phone to the surgical unit nurse: \"Mrs. K is a watcher. She's 70, 2 hours after a right hip replacement under spinal anesthesia, on PCA morphine, pain 3/10. To do: hemoglobin at 18:00 and first ambulation tonight. If her systolic drops below 90 or the dressing saturates, call the surgeon.\" The receiving nurse says, \"Okay, thanks,\" and hangs up. The preceptor reviews the handoff with the new nurse.", "", "Complete the sentences.", "", "Blank 1:", "- a full review of systems", "  No: I-PASS is meant to be concise and focused on what the receiver needs, not a complete head-to-toe recitation.", "- the client's insurance information", "  No: insurance information is not part of a clinical handoff and does not affect immediate safety.", "✓ situation awareness and contingency planning", "  Yes: telling the receiver what to watch for and what to do if it happens, such as a systolic below 90, is situation awareness and contingency planning.", "Blank 2:", "- the client's room number", "  No: the room number may help logistics, but its absence is not the key gap in this handoff.", "✓ synthesis by the receiver", "  Yes: the final I-PASS step is the receiver summarizing key points and asking questions. Saying \"okay, thanks\" does not confirm understanding.", "- a list of home medications", "  No: home medications are in the record and are not a required I-PASS element for this transfer.", "Blank 3:", "✓ restate the key points and action items and ask any questions", "  Yes: a read-back of key points and to-do items closes the loop and catches misunderstandings before responsibility transfers.", "- read the PACU record and the anesthesia notes later when time allows", "  No: reading the record later leaves a window when the receiver may miss the 18:00 hemoglobin or the call parameters.", "- sign the transfer form without comment", "  No: signing a form does not verify that the information was understood.", "", "Why: I-PASS stands for Illness severity, Patient summary, Action list, Situation awareness and contingency planning, and Synthesis by receiver. Handoffs are a leading point of communication failure, and the synthesis step closes the loop. The sending nurse should invite and expect a read-back before ending the call.", "Tip: A handoff is not complete until the receiver has repeated back the key information and had a chance to ask questions."], "st": "awaiting"}, {"id": "ngn:qb-safe-7", "hash": "6a32fb53cc", "title": "Sterile field maintenance · Evaluate outcomes", "body": ["In the operating room, a nurse is orienting a new circulating nurse during setup for a 55-year-old's laparoscopic cholecystectomy. The sterile field has been opened on the back table.", "", "Which action by the new circulating nurse requires the precepting nurse to intervene?", "", "✓ Reaches across the sterile field to drop a suture packet onto the far side of the table", "  Yes: an unsterile person must never reach over a sterile field, because particles from the arm and gown can fall onto it. The field is now contaminated.", "- Considers the outer 2.5 cm (1 inch) border of the sterile drape contaminated", "  No: the edge of a sterile field is considered unsterile, so items placed there are treated as contaminated. This is correct.", "- Opens the first flap of a sterile package away from her body", "  No: opening the first flap away from the body keeps her arm from passing over the sterile contents. This is correct technique.", "- Keeps the sterile field in view and never turns her back to it", "  No: a sterile field that is out of sight cannot be confirmed as sterile. Facing the field is correct practice.", "", "Why: Sterile technique depends on a few fixed rules: unsterile people do not reach over a sterile field, the edges are considered contaminated, and the field must stay in view. Reaching across the table breaks sterility, so the item and any affected area must be replaced before the case continues.", "Tip: If you are unsure whether an item is sterile, treat it as contaminated; the rule on the exam is the same as in the operating room."], "st": "awaiting"}, {"id": "ngn:qb-safe-8", "hash": "bee7b09acb", "title": "Wrong-site surgery prevention · Take action", "body": ["A 62-year-old is in the preoperative holding area for a scheduled right total knee arthroplasty. The signed consent says right knee, and the surgeon's initials are on the right knee. While the nurse completes the checklist, the client says, \"I'm glad they're finally fixing my left knee. That's the one that hurts.\"", "", "Which action should the nurse take?", "", "- Document the client's statement in the record and let the surgical team address the discrepancy during the time-out in the operating room", "  No: the time-out is a final check, not the place to first resolve a known conflict. The client may be sedated by then and unable to confirm.", "- Continue the checklist, because the signed consent and site marking both say right knee", "  No: the client's own statement is a key verification source. Proceeding despite a conflict is exactly how wrong-site surgery happens.", "✓ Stop the preoperative process and notify the surgeon so the correct site can be verified before the client goes to the operating room", "  Yes: any discrepancy in the procedure site must be resolved before the procedure. Any team member can and should stop the process to prevent wrong-site surgery.", "- Ask the client to initial the left knee to show the correct site", "  No: the site is marked by the person performing the procedure after verification, not changed by the client or nurse. This adds a second conflicting mark.", "", "Why: The Joint Commission Universal Protocol includes preprocedure verification, site marking and a time-out. Verification uses the client's statement, the consent, the history and imaging, and all must match. When they do not, the nurse stops the process and involves the surgeon before anything else happens.", "Tip: On surgical safety questions, any mismatch means stop and verify; never pick an answer that lets the procedure continue with an unresolved discrepancy."], "st": "awaiting"}, {"id": "ngn:qb-pharm-14", "hash": "5b3bf289e1", "title": "Naloxone and renarcotization · Evaluate outcomes", "body": ["In the PACU, a 70-year-old who received IV hydromorphone after hip surgery had RR 6 and SpO₂ 84% and responded only to a sternal rub. Naloxone 0.04 mg IV was given per protocol. Two minutes later he was awake with RR 14 and SpO₂ 95% on 2 L.", "", "Forty-five minutes later, which finding requires the nurse's immediate follow-up?", "", "- BP 142/86 and HR 96", "  No: A modest rise in blood pressure and heart rate is common after reversal and pain return. It is not the priority here.", "- He rates his hip pain 6 on a 0 to 10 scale and asks for more medicine", "  No: Some pain is expected when an opioid is reversed. It needs a careful plan, but it is not the immediate safety threat.", "✓ RR 9 and he falls asleep in the middle of a sentence", "  Yes: Naloxone wears off in 30 to 90 minutes, often before the opioid does, so respiratory depression can return. This needs repeat assessment and treatment now.", "- He reports mild nausea", "  No: Nausea is common after anesthesia and opioid reversal. It deserves treatment, but it does not threaten breathing.", "", "Why: Naloxone has a shorter duration than most opioids, so clients are monitored closely for at least the expected duration of the opioid. Small, titrated doses restore breathing without causing severe pain or withdrawal. Sedation usually comes before respiratory depression, so increasing sleepiness is an early warning.", "Tip: After giving an antidote, ask which lasts longer, the drug or the antidote, and watch for the problem to come back."], "st": "awaiting"}, {"id": "ngn:qb-pharm-27", "hash": "77f4e73cc4", "title": "Medication reconciliation · Recognize cues", "body": ["At a preoperative visit, a 68-year-old is scheduled for a knee replacement. The record lists warfarin 5 mg daily (to be held before surgery per the surgeon), metoprolol and atorvastatin. When asked about other medicines, he says, \"I take two ibuprofen tablets three times a day for my knee. I didn't think that counted.\"", "", "Complete the sentences.", "", "Blank 1:", "- to use the surgeon's preoperative order set", "  No: An order set shows what is planned, not what the client actually takes at home.", "✓ to review each drug, dose and time with the client, compared with his bottles and pharmacy records", "  Yes: A best possible medication history uses the client's own account checked against bottles and pharmacy fill data, including over-the-counter and herbal products.", "- to copy the list from his discharge summary from last year", "  No: An old discharge list is likely out of date and misses medications started since then.", "Blank 2:", "✓ bleeding", "  Yes: NSAIDs impair platelets and can irritate the stomach, adding to warfarin's bleeding risk, especially around surgery.", "- blood clots", "  No: Ibuprofen does not increase clotting; the combination increases bleeding.", "- low blood sugar", "  No: Neither drug commonly causes hypoglycemia, so this is not the concern.", "Blank 3:", "✓ add the ibuprofen to the list and report it to the surgical team", "  Yes: The discrepancy must be documented and communicated so the provider can decide when to stop the NSAID before surgery.", "- leave it off the list because it is sold over the counter without a prescription", "  No: Over-the-counter drugs cause real interactions and must be on the list. This is the trap the client fell into.", "- tell the client to stop his warfarin today", "  No: Changing the warfarin schedule is a provider decision; the nurse reports the finding instead.", "", "Why: Medication reconciliation compares what the client actually takes with what is ordered and resolves every discrepancy with the provider. Clients often leave out over-the-counter drugs and supplements, so ask about them directly. Here an NSAID with warfarin raises bleeding risk before surgery.", "Tip: Ask every client specifically about over-the-counter drugs, vitamins and herbal products; they rarely volunteer them."], "st": "awaiting"}, {"id": "ngn:qb-risk-11", "hash": "7ad177dbde", "title": "Moderate sedation monitoring · Recognize cues", "body": ["A 50-year-old is having a colonoscopy under moderate sedation with IV midazolam and fentanyl. Baseline: BP 128/80, HR 76, RR 16, SpO₂ 98% on room air. The nurse assesses the client 10 minutes after the last dose.", "", "Which findings require immediate intervention? Select all that apply.", "", "✓ SpO₂ 88%", "  Yes: A drop from 98% to 88% shows inadequate oxygenation from hypoventilation and needs prompt action.", "- BP 118/74", "  No: A small drop from baseline is common with sedation and is still within a safe range.", "- HR 70 and regular", "  No: The heart rate is close to baseline and normal, so it needs no intervention.", "✓ Responds only to a firm sternal rub", "  Yes: Responding only to painful stimulus means deep sedation, beyond the moderate level, where airway reflexes may be lost.", "- Eyes closed but answers questions when spoken to", "  No: Purposeful response to voice is the goal of moderate sedation and is expected.", "✓ Snoring sounds with each breath", "  Yes: Snoring signals partial airway obstruction from the relaxed tongue; a head tilt or jaw thrust is needed.", "✓ RR 7 with shallow breaths", "  Yes: Opioids and benzodiazepines together depress breathing. A rate this low means the client is hypoventilating and needs stimulation and airway support.", "", "Why: Under moderate sedation the client should respond purposefully to voice and keep breathing adequately on their own. Slow, shallow breathing, falling oxygen saturation, snoring and response only to pain mean the client has drifted into deeper sedation. The nurse stimulates the client, opens the airway, gives oxygen and prepares reversal agents as ordered.", "Tip: For sedation items, check airway and breathing first, then the level of response compared with the target sedation level."], "st": "awaiting"}]}, "packs": [{"id": "drill-med-1", "title": "Drills: Med Pass, part 1 of 2", "sub": "What to check before a medication, then give, hold or call. A pharmacist is especially welcome.", "n": 25, "reviewed": 0, "changed": 0}, {"id": "drill-med-2", "title": "Drills: Med Pass, part 2 of 2", "sub": "What to check before a medication, then give, hold or call. A pharmacist is especially welcome.", "n": 25, "reviewed": 0, "changed": 0}, {"id": "drill-first-1", "title": "Drills: Who's First, part 1 of 2", "sub": "Four patients, one nurse: who do you see first, and why not the others.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "drill-first-2", "title": "Drills: Who's First, part 2 of 2", "sub": "Four patients, one nurse: who do you see first, and why not the others.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "drill-sbar", "title": "Drills: SBAR", "sub": "Building a call to the provider line by line, and the order that comes back.", "n": 20, "reviewed": 0, "changed": 0}, {"id": "drill-calm", "title": "Drills: De-escalation", "sub": "What to say to an agitated patient, turn by turn. Psych or ED experience fits best.", "n": 22, "reviewed": 0, "changed": 0}, {"id": "ngn-shift-1", "title": "NCLEX questions after each shift, part 1 of 3", "sub": "Five per shift, including the two harder NCLEX challenge items.", "n": 19, "reviewed": 0, "changed": 0}, {"id": "ngn-shift-2", "title": "NCLEX questions after each shift, part 2 of 3", "sub": "Five per shift, including the two harder NCLEX challenge items.", "n": 19, "reviewed": 0, "changed": 0}, {"id": "ngn-shift-3", "title": "NCLEX questions after each shift, part 3 of 3", "sub": "Five per shift, including the two harder NCLEX challenge items.", "n": 17, "reviewed": 0, "changed": 0}, {"id": "bank-ms-1", "title": "NCLEX question bank: Medical-surgical, part 1 of 3", "sub": "68 s
