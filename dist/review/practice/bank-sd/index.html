<style>
:root{--bg:#E6EDF0;--surface:#FBFCFC;--surface-2:#EDF2F4;--ink:#152238;--ink-2:#4D5A6F;--line:#CAD5DB;--teal:#2449A8;--teal-ink:#fff;--red:#B3342B;--red-bg:#F8E1DE;--good:#2B7249;--good-bg:#E0F0E6;--amber:#A96C0E;--amber-bg:#FBEFD6;
  --serif:"Barlow Condensed","Arial Narrow",sans-serif;--sans:"Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161C;--surface:#1A1F27;--surface-2:#212833;--ink:#E7E4DB;--ink-2:#A0A5AE;--line:#343C48;--teal:#93B4E4;--teal-ink:#0F1B2C;--red:#F0766B;--red-bg:#3b1d1b;--good:#72c692;--good-bg:#16301f;--amber:#E9AE4E;--amber-bg:#35291a}}
:root[data-theme="dark"]{--bg:#12161C;--surface:#1A1F27;--surface-2:#212833;--ink:#E7E4DB;--ink-2:#A0A5AE;--line:#343C48;--teal:#93B4E4;--teal-ink:#0F1B2C;--red:#F0766B;--red-bg:#3b1d1b;--good:#72c692;--good-bg:#16301f;--amber:#E9AE4E;--amber-bg:#35291a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
main{max-width:52rem;margin:0 auto;padding:clamp(1.2rem,5vw,3rem) 16px calc(5rem + env(safe-area-inset-bottom))}
a{color:var(--teal)}
.home{font-family:var(--serif);font-weight:700;font-size:1.1rem;letter-spacing:.04em;text-transform:uppercase;background:var(--ink);color:var(--bg);padding:.28em .55em .22em;border-radius:2px;text-decoration:none}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.9rem,6vw,2.6rem);line-height:1.1;letter-spacing:0;margin:1.6rem 0 .3rem}
h2{font-size:1.15rem;margin:2.4rem 0 .6rem}
h3{font-size:1rem;margin:0}
p{margin:.5rem 0}
.muted{color:var(--ink-2)}
.meta{display:flex;flex-wrap:wrap;gap:.4rem .6rem;margin-top:.6rem}
.chip{display:inline-flex;align-items:center;padding:.15em .6em;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--surface-2);border:1px solid var(--line)}
.chip.awaiting{background:var(--amber-bg);border-color:transparent;color:var(--amber)}
.chip.reviewed{background:var(--good-bg);border-color:transparent;color:var(--good)}
.chip.changed{background:var(--red-bg);border-color:transparent;color:var(--red)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem 1.1rem;margin:.8rem 0}
.how ol{margin:.4rem 0 0;padding-left:1.2rem}.how li{margin:.2rem 0}
label{display:block;font-weight:600;font-size:.9rem;margin:.7rem 0 .25rem}
input[type=text],input[type=email],textarea,select{width:100%;min-height:44px;padding:.5em .7em;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:5rem;resize:vertical}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:0 1rem}
details.pt{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:.6rem 0}
details.pt>summary{cursor:pointer;padding:.85rem 1rem;font-weight:600;list-style-position:inside}
details.pt>div{padding:0 1rem 1rem}
table{width:100%;border-collapse:collapse;font-size:.88rem;margin:.4rem 0}
th,td{text-align:left;vertical-align:top;padding:.35rem .5rem .35rem 0;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--ink-2);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
.scroll{overflow-x:auto}
ul.plain{margin:.3rem 0;padding-left:1.1rem}
.dec{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:.85rem 1rem;margin:.6rem 0}
.dec.pos{border-left-color:var(--good)}.dec.neg{border-left-color:var(--red)}
.dec .top{display:flex;flex-wrap:wrap;gap:.3rem .5rem;align-items:center;font-size:.78rem;color:var(--ink-2);font-weight:600}
.pts{font-weight:700;padding:.05em .45em;border-radius:4px;background:var(--surface-2)}
.pos .pts{color:var(--good);background:var(--good-bg)}.neg .pts{color:var(--red);background:var(--red-bg)}
.dec b{display:block;margin:.35rem 0 .15rem;font-size:1rem}
.dec .why{font-family:var(--sans);color:var(--ink-2);margin:0}
.dec .src{font-size:.75rem;color:var(--ink-2);margin-top:.35rem}
.verdict{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.7rem}
.verdict button{min-height:40px;padding:.35em .9em;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer}
.verdict button[aria-pressed="true"][data-v="ok"]{background:var(--good);border-color:var(--good);color:var(--teal-ink)}
.verdict button[aria-pressed="true"][data-v="fix"]{background:var(--red);border-color:var(--red);color:var(--teal-ink)}
.verdict button[aria-pressed="true"][data-v="unsure"]{background:var(--amber);border-color:var(--amber);color:var(--teal-ink)}
.dec textarea{margin-top:.5rem;min-height:3.6rem}
.opt{padding:.4rem 0;border-bottom:1px solid var(--line);font-size:.92rem}.opt:last-child{border:0}
.opt i{font-style:normal;font-weight:700;font-size:.75rem;padding:.05em .4em;border-radius:4px;margin-right:.4rem;background:var(--surface-2)}
.bar{position:sticky;top:0;z-index:5;margin:0 -16px;padding:.6rem 16px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:.6rem;font-size:.9rem}
.bar .prog{display:block;flex:1;min-width:4rem;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;max-width:12rem}.bar .prog i{display:block;height:100%;background:var(--teal)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:.55em 1.2em;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn-primary{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.row{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1rem}
.check{display:flex;gap:.6rem;align-items:flex-start;font-weight:500;margin-top:1rem}
.check input{width:1.2rem;height:1.2rem;margin-top:.2rem;flex:none}
.msg{margin-top:.8rem;font-weight:600}.msg.err{color:var(--red)}.msg.ok{color:var(--good)}
pre{white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:.8rem;font-size:.8rem;max-height:18rem;overflow:auto}
.shifts a{display:block;text-decoration:none;color:inherit}
.shifts .card:hover{border-color:var(--ink-2)}
</style>
<style>.item .body p{margin:.15rem 0}.item .body .why{color:var(--ink-2);font-size:.92rem;margin:0 0 .35rem 1.1rem}.item .body .ok b{display:inline;margin:0;color:var(--good)}.item .body .no{color:var(--ink)}.item .body .sp{height:.5rem}.item>b{margin-bottom:.5rem}</style></head>

a radial site dressing change and reinforcement of the cardiac diet teaching the RN gave yesterday", "  Yes: reinforcing teaching the RN has already done and caring for a stable site fit the LPN role. Initial teaching would stay with the RN.", "✓ A 66-year-old with heart failure, stable for 2 days, who needs scheduled oral medications and a daily weight before discharge tomorrow", "  Yes: this client is stable with predictable needs. Giving oral medications and collecting data such as weights are within LPN scope.", "- A 59-year-old admitted 30 minutes ago with chest pain and a troponin result pending", "  No: a new admission with possible acute coronary syndrome needs an RN admission assessment and is not yet stable or predictable.", "- A 64-year-old starting a continuous heparin infusion that is titrated by protocol to aPTT results", "  No: titrating a high-alert IV anticoagulant requires ongoing RN assessment and judgment. In many states LPNs also may not manage this kind of IV therapy.", "✓ A 72-year-old with rate-controlled chronic atrial fibrillation who needs scheduled subcutaneous enoxaparin and oral metoprolol", "  Yes: the condition is chronic and stable, and subcutaneous and oral medications are routinely given by LPNs. The LPN reports heart rate or bleeding changes to the RN.", "- A 55-year-old who needs first-time discharge teaching on a new warfarin prescription", "  No: initial teaching and evaluating the client's understanding are RN responsibilities. The LPN may reinforce the teaching afterward.", "", "Why: Assign the LPN stable clients with predictable outcomes whose care involves established procedures, oral and subcutaneous medications, and reinforcement of RN teaching. New admissions, unstable clients, initial teaching and high-alert IV titrations stay with the RN. Because LPN IV scope differs by state, the charge nurse must know the state practice act and facility policy.", "Tip: Ask whether the client is stable and predictable and whether the task requires initial assessment, initial teaching or evaluation; if so, it stays with the RN."], "st": "awaiting"}, {"id": "ngn:qb-mgmt-13", "hash": "da4d22f62a", "title": "Documenting a fall · Recognize cues", "body": ["A charge nurse reviews this progress note written by a new graduate nurse on a telemetry unit after a client fell.", "", "Highlight the statements in the note that are inappropriate and should be corrected by the nurse.", "", "- 03:10 Client found sitting on floor beside bed.", "  No: this is an objective description of exactly what the nurse saw, with the time. It is appropriate.", "✓ highlight Client fell because the UAP left the bed rails down.", "  Yes: the nurse did not witness the fall, so this is an assumption that also blames a coworker. Notes should record facts, not opinions or blame.", "- Alert and oriented x4; states \"I tried to get to the bathroom by myself.\"", "  No: the client's own words in quotation marks and an objective mental status are good documentation.", "- 2 cm abrasion on right elbow; no other injuries noted.", "  No: this is a specific, measurable assessment finding. It is appropriate.", "- BP 132/78, HR 88, telemetry sinus rhythm.", "  No: post-fall vital signs and rhythm are expected objective data. They belong in the note.", "- Dr. Lee notified at 03:20; no new orders.", "  No: naming who was notified, when, and the response is complete documentation of communication.", "✓ highlight Incident report completed and placed in chart.", "  Yes: an incident report is an internal quality document and is never filed in or mentioned in the medical record. Referring to it can make it discoverable in a lawsuit; protection rules vary by state and facility policy.", "✓ highlight Seems fine now, will keep an eye on him.", "  Yes: this is vague and subjective. The note should state the specific reassessment plan, such as neurological checks at set intervals.", "", "Why: Legal documentation is factual, objective, timely and specific. The nurse records what was seen, heard and done, including the client's own words and who was notified. Assumptions, blame, vague wording and any mention of the incident report do not belong in the medical record.", "Tip: Read each statement and ask whether the nurse directly observed or did it; opinions, blame and references to incident reports should be flagged."], "st": "awaiting"}, {"id": "ngn:qb-mgmt-18", "hash": "7b0db1f3a0", "title": "SBAR to the provider · Take action", "body": ["At 02:00 a 76-year-old client admitted yesterday with heart failure exacerbation is short of breath. RR 28, SpO₂ 88% on 2 L, crackles halfway up both lungs. He received furosemide 40 mg IV at 18:00, and urine output since then is 60 mL. The nurse is going to call the provider.", "", "Place the nurse's actions in the order they should occur.", "", "Correct order:", "1. Gather the chart, current vital signs, recent labs, intake and output and active orders before calling", "  Yes: having the data in hand before calling makes the call efficient and lets the nurse answer the provider's questions.", "2. State her name, unit, the client's name, and that he is short of breath with an SpO₂ of 88% on 2 L", "  Yes: Situation comes first: who is calling, about whom, and the immediate problem, so the provider knows the urgency right away.", "3. Explain that he is 76, was admitted with heart failure, and received furosemide 40 mg IV at 18:00", "  Yes: Background gives the context the provider needs, including the diagnosis and the treatment already given.", "4. Report crackles halfway up both lungs, RR 28 and only 60 mL of urine, and say she is concerned about worsening fluid overload", "  Yes: Assessment shares the current findings and the nurse's interpretation of the problem, which a new graduate should state clearly.", "5. Recommend that the provider see the client now and ask for another diuretic dose and a chest x-ray", "  Yes: Recommendation tells the provider what the nurse thinks is needed, so the call ends with a plan.", "6. Read back any new orders and confirm them with the provider", "  Yes: reading back telephone or verbal orders is a Joint Commission safety practice that prevents communication errors.", "", "Why: SBAR (Situation, Background, Assessment, Recommendation) is a structured format that makes urgent communication clear and complete. Preparation comes before the call, and a read-back of any orders closes it. New graduates often leave out the assessment and recommendation, which are the parts that drive the provider's decision.", "Tip: Prepare first, then follow S, B, A, R, and finish with a read-back of new orders."], "st": "awaiting"}, {"id": "ngn:qb-pharm-1", "hash": "ac0b87939d", "title": "Oral tablet dosage · Generate solutions", "body": ["A 70-year-old with new-onset atrial fibrillation has an order for metoprolol tartrate 12.5 mg PO every 12 hours. Apical pulse is 84 and BP is 132/80. The pharmacy supplies metoprolol tartrate 25 mg scored tablets.", "", "How many tablets should the nurse give?", "", "Answer: 0.5 tablet. Round to the nearest tenth.", "  Desired ÷ have × quantity = 12.5 mg ÷ 25 mg × 1 tablet", "  = 0.5 tablet (half of one scored tablet)", "", "Why: Use desired over have times quantity. Only scored tablets should be split, and the client's apical pulse and blood pressure are checked first because metoprolol slows the heart and lowers blood pressure.", "Tip: Estimate first: the dose is half the tablet strength, so the answer must be less than one tablet."], "st": "awaiting"}, {"id": "ngn:qb-pharm-4", "hash": "9b67a5b9e9", "title": "Heparin units to mL/h · Take action", "body": ["A 52-year-old with a new deep vein thrombosis weighs 90 kg. After the bolus, the weight-based protocol calls for a continuous heparin infusion of 18 units/kg/h. The premixed bag contains heparin 25,000 units in 500 mL D5W.", "", "At what rate should the nurse set the pump?", "", "Answer: 32.4 mL/h (± 0.1). Round to the nearest tenth.", "  Concentration: 25,000 units ÷ 500 mL = 50 units/mL", "  Dose: 18 units/kg/h × 90 kg = 1,620 units/h", "  Rate: 1,620 units/h ÷ 50 units/mL = 32.4 mL/h", "", "Why: Find the hourly dose from the weight, then divide by the bag concentration. Heparin is a high-alert medication: an independent double check of the order, weight, concentration and pump setting is required, and the aPTT or anti-Xa is drawn on the protocol schedule.", "Tip: Check that the bag concentration on the label matches the one in your math; heparin comes in more than one premixed strength."], "st": "awaiting"}, {"id": "ngn:qb-pharm-11", "hash": "2e47f877fe", "title": "Digoxin toxicity · Prioritize hypotheses", "body": ["A 78-year-old with heart failure takes digoxin 0.125 mg and furosemide 40 mg daily. He reports 2 days of nausea and poor appetite and says the lights look like they have yellow halos. Apical pulse is 52 and irregular. Potassium is 3.0 mEq/L; digoxin level is 2.4 ng/mL.", "", "Which explanation is most likely?", "", "- Expected slowing of the heart rate from a therapeutic dose", "  No: A level of 2.4 ng/mL is above the therapeutic range, and visual changes are never an expected effect.", "✓ Digoxin toxicity made more likely by low potassium", "  Yes: Nausea, visual halos and bradycardia with a high digoxin level point to toxicity. Hypokalemia from the diuretic increases digoxin's effect on the heart.", "- Worsening heart failure from too little digoxin", "  No: The level is high, not low, and the findings are classic toxicity rather than fluid overload.", "- Viral gastroenteritis", "  No: A virus does not explain yellow halos, a slow irregular pulse or a high drug level. The trap is stopping at the GI symptoms.", "", "Why: Early digoxin toxicity shows up as GI upset, visual changes and new bradycardia or dysrhythmias. Low potassium, often caused by loop diuretics, makes toxicity more likely. Hold the dose, notify the provider and expect potassium replacement and cardiac monitoring.", "Tip: When a client takes digoxin with a loop diuretic, always look at the potassium level alongside the digoxin level."], "st": "awaiting"}, {"id": "ngn:qb-pharm-18", "hash": "a07130f4e3", "title": "Heparin and bleeding · Take action", "body": ["A 66-year-old with a pulmonary embolism is on a continuous heparin infusion. The 14:00 aPTT is 152 seconds; the protocol goal is 60 to 100 seconds. Blood is oozing from her IV site and she has new bruises on her arms. BP is 104/64 (earlier 124/78) and HR 108 (earlier 88).", "", "Which actions should the nurse take? Select all that apply.", "", "✓ Assess for black stools, blood in the urine and changes in level of consciousness", "  Yes: Hidden bleeding in the gut, urinary tract or brain is the main danger, and the vital signs suggest blood loss.", "✓ Notify the provider of the aPTT, bleeding and vital sign changes", "  Yes: A falling blood pressure and rising heart rate with bleeding need prompt provider evaluation and new orders.", "✓ Apply pressure to the oozing IV site", "  Yes: Direct pressure controls local bleeding while the anticoagulant effect wears off.", "✓ Stop the heparin infusion", "  Yes: The aPTT is far above goal and she shows signs of active bleeding, so the infusion stops now.", "✓ Prepare to give protamine sulfate if prescribed", "  Yes: Protamine is the antidote for heparin and may be ordered when bleeding is significant.", "- Give vitamin K as the antidote", "  No: Vitamin K reverses warfarin, not heparin. The trap is confusing the two antidotes.", "- Restart the infusion at half the rate in 1 hour without contacting the provider", "  No: Protocol rate changes do not cover active bleeding with hemodynamic changes; the provider must decide whether and how to resume.", "", "Why: Heparin's short half-life means stopping the infusion begins reversal within hours. With active bleeding, low blood pressure and a very high aPTT, the nurse stops the drug, controls bleeding, searches for hidden bleeding and notifies the provider. Protamine is given for significant bleeding.", "Tip: When an anticoagulant client is bleeding, stop the drug first, then assess and escalate."], "st": "awaiting"}, {"id": "ngn:qb-pharm-24", "hash": "03d5166219", "title": "Antihypertensive hold parameters · Take action", "body": ["It is 09:00 on the telemetry unit. Orders state: hold metoprolol for apical pulse below 60 or systolic BP below 100. The nurse reviews data for several clients before giving scheduled medications.", "", "For each medication, indicate whether the nurse should give it as scheduled or hold it and notify the provider.", "", "- Metoprolol tartrate 25 mg PO: apical pulse 52, BP 102/64 → Hold and notify the provider", "  the pulse is below the hold parameter, and a beta blocker would slow it further.", "- Metoprolol tartrate 25 mg PO: apical pulse 76, BP 138/84 → Give as scheduled", "  both values are above the hold parameters, so the dose is safe and needed.", "- Lisinopril 10 mg PO: potassium 5.8 mEq/L → Hold and notify the provider", "  ACE inhibitors raise potassium, and a level of 5.8 mEq/L risks dysrhythmias.", "- Lisinopril 10 mg PO: BP 134/82, potassium 4.4 mEq/L, creatinine unchanged → Give as scheduled", "  blood pressure, potassium and kidney function are all acceptable.", "- Furosemide 40 mg PO: potassium 3.0 mEq/L → Hold and notify the provider", "  a loop diuretic wastes potassium, so it is held until the provider addresses the low level. The trap is giving it because the client is edematous.", "- Furosemide 40 mg PO: potassium 4.1 mEq/L, BP 128/76, weight up 1.5 kg → Give as scheduled", "  the electrolytes and blood pressure are safe, and the weight gain is the reason the diuretic is needed.", "", "Why: Before each cardiovascular drug, check the value that drug affects most: heart rate and blood pressure for beta blockers, potassium and kidney function for ACE inhibitors, and potassium and blood pressure for loop diuretics. Hold and report when a value crosses a safety limit.", "Tip: Link each drug to the lab or vital sign it changes, then check that value before giving it."], "st": "awaiting"}, {"id": "ngn:qb-risk-1", "hash": "aa2ab98e36", "title": "Hypokalemia with digoxin · Prioritize hypotheses", "body": ["A 74-year-old with heart failure and atrial fibrillation is admitted to the telemetry unit. Home medications include furosemide 40 mg twice daily and digoxin 0.125 mg daily. Morning labs: potassium 3.1 mEq/L, sodium 138 mEq/L, creatinine 1.0 mg/dL. Apical pulse 64 and irregular.", "", "Which risk is the nurse's priority concern based on these findings?", "", "- Fluid volume excess from sodium and water retention", "  No: The sodium is normal and furosemide removes sodium and water. The trap is assuming every heart failure lab change means fluid overload.", "- Metabolic acidosis from diuretic therapy", "  No: Loop diuretics tend to cause metabolic alkalosis through loss of hydrogen and chloride, not acidosis.", "✓ Digoxin toxicity and ventricular dysrhythmias", "  Yes: Low potassium lets digoxin bind more strongly to heart muscle, raising the risk of toxicity and dangerous dysrhythmias even when the digoxin dose is unchanged.", "- Acute kidney injury from the diuretic", "  No: A creatinine of 1.0 mg/dL is within the usual adult range, so there is no current sign of kidney injury.", "", "Why: Potassium below 3.5 mEq/L is low. Hypokalemia increases the heart's sensitivity to digoxin, so a client taking both a loop diuretic and digoxin is at high risk for toxicity and dysrhythmias. The nurse reports the potassium, checks for signs of toxicity and anticipates replacement.", "Tip: When a stem pairs a lab value with a medication, ask how that lab changes the drug's effect."], "st": "awaiting"}, {"id": "ngn:qb-risk-6", "hash": "68aafbc833", "title": "Cardiac catheterization bleeding · Take action", "body": ["A 61-year-old returned to the telemetry unit 2 hours ago after a cardiac catheterization through the right femoral artery. He says his groin feels warm and wet. The dressing is soaked with blood and a firm swelling at the site has grown since the last check. BP 118/72, HR 92.", "", "Which action should the nurse take first?", "", "✓ Apply firm manual pressure just above the puncture site", "  Yes: Direct pressure above the arterial puncture compresses the vessel and stops the bleeding. The nurse calls for help while holding pressure.", "- Check the right pedal pulse and compare it with the left", "  No: Neurovascular checks matter, but active arterial bleeding must be controlled first. The trap is assessing when the problem is already clear.", "- Raise the head of the bed to 45 degrees for comfort", "  No: Flexing the hip strains the femoral puncture and can increase bleeding. The leg stays straight and the head of the bed low per protocol.", "- Call the provider and wait at the bedside for orders", "  No: The provider must be notified, but bleeding continues while the nurse waits. Pressure comes first, then notification.", "", "Why: Bleeding and hematoma at the femoral site are the most common complications after a femoral catheterization. Firm manual pressure just above the puncture controls arterial bleeding. Once bleeding is controlled, the nurse checks distal pulses, vital signs and the size of the hematoma and notifies the provider.", "Tip: When the problem is obvious and ongoing, choose the action that stops the harm before more assessment or a phone call."], "st": "awaiting"}, {"id": "ngn:qb-risk-12", "hash": "4db74448ae", "title": "Chest tube management · Generate solutions", "body": ["A 45-year-old has a right chest tube for a pneumothorax, connected to a wet suction drainage system at 20 cm H₂O suction. The nurse is planning care for the shift.", "", "For each nursing action, indicate whether it is appropriate or inappropriate.", "", "- Keep the drainage unit upright and below the level of the chest → Appropriate", "  gravity keeps drainage and air flowing out of the chest and prevents backflow into the pleural space.", "- Expect gentle, continuous bubbling in the suction control chamber → Appropriate", "  in a wet suction system this shows suction is working. Vigorous bubbling only evaporates the water faster.", "- Expect the water in the water seal chamber to rise and fall with breathing → Appropriate", "  this tidaling shows the tube is open and connected to the pleural space.", "- Treat continuous bubbling in the water seal chamber as expected → Inappropriate", "  continuous bubbling in the water seal signals an air leak in the system or the client. The nurse assesses the client and checks connections.", "- If the tube disconnects from the unit, submerge its end 2 to 3 cm in sterile water → Appropriate", "  this creates a temporary water seal so air cannot enter the chest while a new system is set up.", "- Clamp the tube whenever the client walks to the bathroom → Inappropriate", "  clamping traps air in the chest and can cause a tension pneumothorax. The unit is carried below chest level instead.", "", "Why: Bubbling has a meaning that depends on the chamber. Gentle bubbling in the suction control chamber is expected with wet suction, and tidaling in the water seal shows patency. Continuous bubbling in the water seal means an air leak. If the tube disconnects, the end goes into sterile water; routine clamping is unsafe.", "Tip: Learn each chamber's job, and read every bubbling pattern by asking which chamber it is in."], "st": "awaiting"}, {"id": "ngn:qb-phys-2", "hash": "eaaf81c779", "title": "Symptomatic bradycardia · Generate solutions", "body": ["A 71-year-old on the telemetry unit calls the nurse and says he feels dizzy and weak. The monitor shows sinus bradycardia at 36. BP 78/44, RR 18, SpO₂ 95% on room air. His skin is cool and he is slow to answer questions.", "", "Which interventions should the nurse anticipate? Select all that apply.", "", "- Ask the client to bear down as if having a bowel movement", "  No: bearing down stimulates the vagus nerve and slows the heart further, which is the opposite of what he needs.", "✓ Prepare for transcutaneous pacing", "  Yes: pacing is the next step if atropine does not work, so pads and the pacer should be ready now in a client this unstable.", "✓ Atropine 1 mg IV", "  Yes: atropine is the first-line drug for symptomatic bradycardia and may be repeated every 3 to 5 minutes to a total of 3 mg.", "- Synchronized cardioversion", "  No: cardioversion treats unstable fast rhythms. The trap is reacting to instability without noticing the rate is slow.", "- Adenosine 6 mg rapid IV push", "  No: adenosine briefly stops conduction through the AV node and is used for SVT. Giving it to a client with bradycardia could cause asystole.", "✓ Obtain a 12-lead ECG", "  Yes: a 12-lead shows the rhythm in detail and can reveal heart block or an inferior MI causing the slow rate.", "", "Why: A slow rate is treated when it causes symptoms such as hypotension, altered mental status or signs of shock. Atropine is the first drug. If it fails, transcutaneous pacing or an epinephrine or dopamine infusion follows. A 12-lead helps find the cause.", "Tip: Decide first whether the rhythm is too fast or too slow, then eliminate every option that treats the opposite problem."], "st": "awaiting"}, {"id": "ngn:qb-phys-9", "hash": "2fd568b69d", "title": "Ventricular fibrillation · Take action", "body": ["A 66-year-old on the telemetry unit is found slumped in bed. The monitor shows ventricular fibrillation. A manual defibrillator is on the crash cart in the hallway.", "", "Place the nurse's actions in the order they should be performed.", "", "Correct order:", "1. Check for responsiveness and shout for help to activate the emergency response team", "  Yes: the monitor can be wrong because of a loose lead, so the nurse confirms the client is unresponsive and calls for help and the defibrillator at once.", "2. Check for breathing and a carotid pulse for no more than 10 seconds", "  Yes: a quick check of breathing and pulse confirms cardiac arrest; limiting it to 10 seconds avoids delaying CPR.", "3. Begin high-quality chest compressions", "  Yes: compressions start right away to circulate oxygen to the brain and heart until the defibrillator arrives.", "4. Place defibrillator pads on the chest while compressions continue", "  Yes: pads go on while a second rescuer keeps compressing, so pauses in compressions are kept as short as possible.", "5. Deliver one shock when the defibrillator is charged and everyone is clear", "  Yes: VF is a shockable rhythm, and early defibrillation is the treatment most likely to restore an organized rhythm.", "6. Resume chest compressions immediately for 2 minutes before the next rhythm check", "  Yes: compressions resume right after the shock without a pulse check, because the heart rarely pumps well in the first seconds after a shock.", "", "Why: For in-hospital VF arrest, the nurse confirms unresponsiveness, calls for help, checks breathing and pulse briefly, then starts compressions until the defibrillator is ready. One shock is followed immediately by 2 minutes of CPR. Minimizing pauses in compressions and defibrillating early are the keys to survival.", "Tip: For arrest sequences, recall the pattern: confirm, call, compress, shock, then go right back to compressions."], "st": "awaiting"}, {"id": "ngn:qb-phys-11", "hash": "9e1f6ad166", "title": "Acute myocardial infarction · Recognize cues", "body": ["A 62-year-old was admitted to the telemetry unit for observation after a syncopal episode. Nurse's note, 06:15.", "", "Highlight the findings that require immediate follow-up.", "", "✓ highlight Woke up with crushing chest pressure that spreads to his jaw, rated 8 of 10.", "  Yes: chest pressure radiating to the jaw is classic for myocardial ischemia and needs an ECG within 10 minutes.", "✓ highlight Skin cool and diaphoretic.", "  Yes: sweating and cool skin reflect a sympathetic response to reduced cardiac output, a sign of a serious cardiac event.", "✓ highlight 12-lead ECG shows ST elevation in leads II, III and aVF.", "  Yes: ST elevation in the inferior leads indicates an inferior STEMI, which needs urgent reperfusion.", "✓ highlight HR 48, BP 88/56.", "  Yes: inferior MI often involves the right coronary artery, which supplies the SA and AV nodes, causing bradycardia and hypotension.", "- Takes atorvastatin daily for high cholesterol.", "  No: this is a risk factor and part of the history; it does not change what must be done right now.", "- Wife is at the bedside.", "  No: this is a social detail. It is not a clinical cue that needs follow-up.", "", "Why: Chest pressure radiating to the jaw with diaphoresis and ST elevation in II, III and aVF is an inferior STEMI. The bradycardia and hypotension suggest right coronary artery involvement and possible right ventricular infarction, so nitrates must be used with caution. The goal is rapid reperfusion.", "Tip: Highlight findings that point to an active, dangerous process; leave history and social details unselected."], "st": "awaiting"}, {"id": "ngn:sa-mgmt-2", "hash": "f4ce228457", "title": "Delegating tasks on step-down · Generate solutions", "body": ["An RN on a step-down unit is working with an LPN and an unlicensed assistive personnel (UAP). The clients include a client 2 days after an uncomplicated MI, a client 1 day after a stroke awaiting a swallow evaluation, a client newly prescribed enoxaparin, a client with a urinary catheter, and a client on bed rest.", "", "Which tasks can the RN delegate to the UAP? Select all that apply.", "", "✓ Ambulate the client after the MI to the bathroom with the walker he has used safely since yesterday", "  Yes: assisting a stable client with a known, routine activity is appropriate. The RN gives clear instructions on what to report, such as chest pain or dizziness.", "- Assess the client's pain 30 minutes after IV morphine", "  No: evaluating the response to a medication is assessment, which stays with the licensed nurse. A UAP can report a pain number but cannot judge the response.", "✓ Obtain and record vital signs on the stable client 2 days after the MI", "  Yes: routine vital signs on a stable client are within the UAP role. The RN still interprets the values and acts on any abnormal result.", "✓ Reposition the client on bed rest every 2 hours", "  Yes: turning and repositioning a stable client is a routine UAP skill. The RN still assesses the skin for early pressure injury.", "- Feed breakfast to the client who had a stroke yesterday", "  No: he has not passed a swallow screen, so he must stay NPO. Feeding him risks aspiration, and the trap is treating feeding as always delegable.", "- Teach the client newly prescribed enoxaparin how to self-inject", "  No: initial teaching requires RN knowledge and judgment. A UAP may reinforce nothing that has not first been taught and evaluated by the RN.", "✓ Measure and record urine output from the indwelling catheter", "  Yes: measuring and recording output is a standard, predictable task. The RN reviews the numbers and decides what they mean.", "", "Why: UAPs can do routine, predictable tasks for stable clients: vital signs, intake and output, turning and helping with walking. Assessment, teaching, evaluation and any task with an unpredictable outcome stay with the RN. Feeding a client with an unknown swallow is a safety risk, not a routine task.", "Tip: For each task, ask whether it needs assessment, teaching, evaluation or judgment; if it does, the RN keeps it."], "st": "awaiting"}, {"id": "ngn:sa-safety-5", "hash": "890bc6b1db", "title": "Wrong-patient opioid error · Analyze cues", "body": ["A 74-year-old opioid-naive client admitted for heart failure has no opioid orders. At 1300 he was given hydromorphone 2 mg IV that was meant for the client in the next room. Before the dose: RR 16, SpO₂ 95% on 2 L, alert and talking. At 1320, when the nurse discovers the error: RR 8 and shallow, SpO₂ 88% on 2 L, difficult to arouse, pupils pinpoint.", "", "Complete the diagram: the condition the client is most likely experiencing, two actions the nurse should take, and two parameters to monitor.", "", "Condition:", "- Acute decompensated heart failure", "  No: heart failure worsens over hours with crackles and dyspnea, not sudden sedation and pinpoint pupils right after an opioid.", "- Acute ischemic stroke", "  No: a stroke causes focal deficits such as facial droop or weakness. Pinpoint pupils and slow breathing point to an opioid.", "✓ Opioid-induced respiratory depression", "  Yes: sedation, an RR of 8, falling SpO₂ and pinpoint pupils 20 minutes after an opioid in an opioid-naive client is opioid toxicity.", "- Hypoglycemia", "  No: hypoglycemia causes sweating and tachycardia, not pinpoint pupils and slow breathing. Check glucose, but it does not explain this picture.", "Actions to take:", "✓ Stay with the client, stimulate him, and call the rapid response team or provider", "  Yes: a client with respiratory depression is not left alone. Stimulating him to breathe and bringing help fast protects his airway.", "- Let him sleep and recheck vital signs at 1400", "  No: sleeping through an RR of 8 is how opioid deaths happen. Waiting is the trap.", "- Give his scheduled furosemide early", "  No: the diuretic treats fluid, not this problem. It distracts from the life threat.", "✓ Give naloxone as ordered or per protocol", "  Yes: naloxone reverses opioid respiratory depression. Small titrated doses restore breathing while limiting pain and withdrawal.", "- Complete the incident report before treating the client", "  No: the incident report is required but comes after the client is safe. Treat first, report second.", "Parameters to monitor:", "- Daily weight", "  No: daily weight tracks heart failure fluid, not the effect of the opioid.", "✓ Respiratory rate and depth", "  Yes: breathing is what the opioid is suppressing. Naloxone wears off sooner than hydromorphone, so watch for depression returning.", "- Serum potassium", "  No: potassium matters for his diuretic, but it does not show whether the opioid effect is resolving.", "✓ Level of sedation", "  Yes: sedation level worsens before breathing does, so it is the early warning sign of re-sedation.", "- Urine output", "  No: urine output is useful in heart failure but does not track opioid toxicity.", "", "Why: The change from alert with an RR of 16 to barely arousable with an RR of 8 after a wrong-patient opioid is respiratory depression caused by a medication error. Stay, support breathing, get help and give naloxone. Naloxone is shorter acting than hydromorphone, so keep monitoring sedation and respirations; then disclose and report the error.", "Tip: When an error harms a client, the first actions always treat the client; the reporting comes after."], "st": "awaiting"}, {"id": "ngn:sa-risk-2", "hash": "5470d0ff20", "title": "Post-bronchoscopy monitoring · Recognize cues", "body": ["A 66-year-old had a flexible bronchoscopy with transbronchial biopsy of the right lower lobe under moderate sedation 2 hours ago. Topical lidocaine was sprayed in the throat. The nurse completes a post-procedure assessment.", "", "Highlight the findings that require follow-up.", "", "✓ highlight Asks for a cup of water; gag reflex still absent.", "  Yes: without a gag reflex the client can aspirate. Keep NPO and recheck the gag reflex before giving anything by mouth.", "- Sputum with small streaks of blood.", "  No: blood-streaked sputum is expected for a short time after a biopsy. Frank bleeding or clots would need follow-up.", "- Mild sore throat.", "  No: a scratchy throat is expected after the scope passes through the airway. Lozenges help once the gag reflex returns.", "✓ highlight New high-pitched sound on inspiration.", "  Yes: inspiratory stridor suggests laryngeal edema or spasm, an airway emergency. Notify the provider right away.", "✓ highlight Sharp right-sided chest pain on inspiration with diminished breath sounds on the right.", "  Yes: pleuritic pain and reduced breath sounds on the biopsy side suggest a pneumothorax. A chest x-ray is needed.", "- SpO₂ 95% on 2 L nasal cannula, unchanged from before the procedure.", "  No: oxygenation is stable at the pre-procedure baseline. This is reassuring.", "", "Why: After bronchoscopy, the risks are aspiration, airway swelling, bleeding and pneumothorax. Blood-tinged sputum and a sore throat are expected. An absent gag reflex, stridor and one-sided chest pain with diminished breath sounds are not.", "Tip: After airway procedures, sort findings by expected irritation versus signs of airway, lung or aspiration complications."], "st": "awaiting"}, {"id": "ngn:sa-risk-6", "hash": "77c6afefd4", "title": "Pre-catheterization contrast risks · Generate solutions", "body": ["A 63-year-old with type 2 diabetes is scheduled for a left heart catheterization through the right radial artery at 1000. She takes metformin 1,000 mg twice daily. Her eGFR is 38 mL/min/1.73 m². Two years ago she developed hives after a CT scan with contrast. The nurse prepares her at 0700.", "", "For each action, indicate whether it is indicated or not indicated before the procedure.", "", "- Withhold the morning metformin dose per the procedure protocol. → Indicated", "  Metformin is held around iodinated contrast, especially with reduced kidney function, because of the risk of lactic acidosis.", "- Report the previous contrast reaction to the provider. → Indicated", "  A prior contrast reaction is a risk for another. The provider may order premedication with a corticosteroid and an antihistamine.", "- Start the IV 0.9% sodium chloride infusion as prescribed. → Indicated", "  IV hydration helps protect the kidneys from contrast injury, which matters with an eGFR of 38.", "- Document baseline pulses, color and sensation in the right hand. → Indicated", "  A baseline lets the nurse detect radial artery occlusion or poor circulation after the procedure.", "- Insert the IV catheter in the right forearm. → Not indicated", "  The right arm is the access site. IV lines belong in the other arm so the access site stays free.", "- Give a full breakfast so her glucose does not drop. → Not indicated", "  The client is NPO per protocol before the procedure. Glucose is managed with monitoring and IV fluids as ordered, not a full meal.", "", "Why: Preparing for a cardiac catheterization means protecting the kidneys, preventing a contrast reaction, and setting a baseline for the access limb. Metformin is held, hydration is started, prior reactions are reported, and the access arm is left free.", "Tip: For contrast procedures, check three things: kidney function, metformin and prior contrast reactions."], "st": "awaiting"}, {"id": "ngn:sa-phys-6", "hash": "7bc1d08bb4", "title": "Hypocalcemia after thyroidectomy · Generate solutions", "body": ["A 52-year-old is on post-op day 1 after a total thyroidectomy. At 2200 her calcium was 8.9 mg/dL and QTc 440 ms. At 0600 her calcium is 7.1 mg/dL and QTc 492 ms. She reports tingling around her mouth and in her fingertips, and tapping over the facial nerve causes twitching of her upper lip.", "", "Which interventions should the nurse anticipate? Select all that apply.", "", "✓ IV calcium gluconate as prescribed", "  Yes: symptomatic hypocalcemia with tetany signs and a lengthening QTc is treated with IV calcium.", "✓ Emergency tracheostomy equipment at the bedside", "  Yes: hypocalcemia can cause laryngospasm, and neck swelling after thyroidectomy can block the airway.", "✓ Continuous cardiac monitoring", "  Yes: low calcium prolongs the QT interval, which can lead to dangerous dysrhythmias.", "- Coaching her to take deep, rapid breaths to relieve the tingling", "  No: hyperventilation causes alkalosis, which lowers ionized calcium and worsens tetany.", "✓ Seizure precautions", "  Yes: severe hypocalcemia increases nerve excitability and can cause seizures.", "- IV
