<style>
:root{--bg:#E6EDF0;--surface:#FBFCFC;--surface-2:#EDF2F4;--ink:#152238;--ink-2:#4D5A6F;--line:#CAD5DB;--teal:#2449A8;--teal-ink:#fff;--red:#B3342B;--red-bg:#F8E1DE;--good:#2B7249;--good-bg:#E0F0E6;--amber:#A96C0E;--amber-bg:#FBEFD6;
  --serif:"Barlow Condensed","Arial Narrow",sans-serif;--sans:"Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161C;--surface:#1A1F27;--surface-2:#212833;--ink:#E7E4DB;--ink-2:#A0A5AE;--line:#343C48;--teal:#93B4E4;--teal-ink:#0F1B2C;--red:#F0766B;--red-bg:#3b1d1b;--good:#72c692;--good-bg:#16301f;--amber:#E9AE4E;--amber-bg:#35291a}}
:root[data-theme="dark"]{--bg:#12161C;--surface:#1A1F27;--surface-2:#212833;--ink:#E7E4DB;--ink-2:#A0A5AE;--line:#343C48;--teal:#93B4E4;--teal-ink:#0F1B2C;--red:#F0766B;--red-bg:#3b1d1b;--good:#72c692;--good-bg:#16301f;--amber:#E9AE4E;--amber-bg:#35291a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
main{max-width:52rem;margin:0 auto;padding:clamp(1.2rem,5vw,3rem) 16px calc(5rem + env(safe-area-inset-bottom))}
a{color:var(--teal)}
.home{font-family:var(--serif);font-weight:700;font-size:1.1rem;letter-spacing:.04em;text-transform:uppercase;background:var(--ink);color:var(--bg);padding:.28em .55em .22em;border-radius:2px;text-decoration:none}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.9rem,6vw,2.6rem);line-height:1.1;letter-spacing:0;margin:1.6rem 0 .3rem}
h2{font-size:1.15rem;margin:2.4rem 0 .6rem}
h3{font-size:1rem;margin:0}
p{margin:.5rem 0}
.muted{color:var(--ink-2)}
.meta{display:flex;flex-wrap:wrap;gap:.4rem .6rem;margin-top:.6rem}
.chip{display:inline-flex;align-items:center;padding:.15em .6em;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--surface-2);border:1px solid var(--line)}
.chip.awaiting{background:var(--amber-bg);border-color:transparent;color:var(--amber)}
.chip.reviewed{background:var(--good-bg);border-color:transparent;color:var(--good)}
.chip.changed{background:var(--red-bg);border-color:transparent;color:var(--red)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem 1.1rem;margin:.8rem 0}
.how ol{margin:.4rem 0 0;padding-left:1.2rem}.how li{margin:.2rem 0}
label{display:block;font-weight:600;font-size:.9rem;margin:.7rem 0 .25rem}
input[type=text],input[type=email],textarea,select{width:100%;min-height:44px;padding:.5em .7em;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:5rem;resize:vertical}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:0 1rem}
details.pt{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:.6rem 0}
details.pt>summary{cursor:pointer;padding:.85rem 1rem;font-weight:600;list-style-position:inside}
details.pt>div{padding:0 1rem 1rem}
table{width:100%;border-collapse:collapse;font-size:.88rem;margin:.4rem 0}
th,td{text-align:left;vertical-align:top;padding:.35rem .5rem .35rem 0;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--ink-2);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
.scroll{overflow-x:auto}
ul.plain{margin:.3rem 0;padding-left:1.1rem}
.dec{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:.85rem 1rem;margin:.6rem 0}
.dec.pos{border-left-color:var(--good)}.dec.neg{border-left-color:var(--red)}
.dec .top{display:flex;flex-wrap:wrap;gap:.3rem .5rem;align-items:center;font-size:.78rem;color:var(--ink-2);font-weight:600}
.pts{font-weight:700;padding:.05em .45em;border-radius:4px;background:var(--surface-2)}
.pos .pts{color:var(--good);background:var(--good-bg)}.neg .pts{color:var(--red);background:var(--red-bg)}
.dec b{display:block;margin:.35rem 0 .15rem;font-size:1rem}
.dec .why{font-family:var(--sans);color:var(--ink-2);margin:0}
.dec .src{font-size:.75rem;color:var(--ink-2);margin-top:.35rem}
.verdict{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.7rem}
.verdict button{min-height:40px;padding:.35em .9em;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer}
.verdict button[aria-pressed="true"][data-v="ok"]{background:var(--good);border-color:var(--good);color:var(--teal-ink)}
.verdict button[aria-pressed="true"][data-v="fix"]{background:var(--red);border-color:var(--red);color:var(--teal-ink)}
.verdict button[aria-pressed="true"][data-v="unsure"]{background:var(--amber);border-color:var(--amber);color:var(--teal-ink)}
.dec textarea{margin-top:.5rem;min-height:3.6rem}
.opt{padding:.4rem 0;border-bottom:1px solid var(--line);font-size:.92rem}.opt:last-child{border:0}
.opt i{font-style:normal;font-weight:700;font-size:.75rem;padding:.05em .4em;border-radius:4px;margin-right:.4rem;background:var(--surface-2)}
.bar{position:sticky;top:0;z-index:5;margin:0 -16px;padding:.6rem 16px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:.6rem;font-size:.9rem}
.bar .prog{display:block;flex:1;min-width:4rem;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;max-width:12rem}.bar .prog i{display:block;height:100%;background:var(--teal)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:.55em 1.2em;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn-primary{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.row{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1rem}
.check{display:flex;gap:.6rem;align-items:flex-start;font-weight:500;margin-top:1rem}
.check input{width:1.2rem;height:1.2rem;margin-top:.2rem;flex:none}
.msg{margin-top:.8rem;font-weight:600}.msg.err{color:var(--red)}.msg.ok{color:var(--good)}
pre{white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:.8rem;font-size:.8rem;max-height:18rem;overflow:auto}
.shifts a{display:block;text-decoration:none;color:inherit}
.shifts .card:hover{border-color:var(--ink-2)}
</style>
<style>.item .body p{margin:.15rem 0}.item .body .why{color:var(--ink-2);font-size:.92rem;margin:0 0 .35rem 1.1rem}.item .body .ok b{display:inline;margin:0;color:var(--good)}.item .body .no{color:var(--ink)}.item .body .sp{height:.5rem}.item>b{margin-bottom:.5rem}</style></head>

e classic signs of rising pressure inside a muscle compartment.", "- Deep vein thrombosis", "  No: DVT causes calf swelling and aching, not pain on passive stretch with paresthesia and pale, cool toes 10 hours after injury.", "- Fat embolism syndrome", "  No: Fat embolism usually appears 24 to 72 hours after a long bone fracture with respiratory distress, confusion and petechiae.", "- Expected fracture pain", "  No: Expected fracture pain responds to opioids. The trap is treating unrelieved pain with neurovascular changes as normal.", "Actions to take:", "✓ Notify the provider immediately", "  Yes: Compartment syndrome can cause permanent muscle and nerve death within hours; the cast may need to be split and a fasciotomy may be needed.", "✓ Keep the leg at the level of the heart", "  Yes: Heart level balances venous drainage with arterial inflow. Elevating higher lowers arterial pressure into the compartment.", "- Elevate the leg on pillows well above the heart", "  No: In suspected compartment syndrome, elevation above the heart reduces arterial flow and worsens tissue ischemia.", "- Apply ice packs over the cast", "  No: Cold causes vasoconstriction and further reduces blood flow to tissue that is already ischemic.", "- Give the next opioid dose early and reassess in 1 hour", "  No: More opioid masks the key symptom and delays treatment. Unrelieved pain is the warning, not the problem to sedate.", "Parameters to monitor:", "✓ Pain with passive stretch of the toes", "  Yes: Pain on passive stretch is one of the earliest and most reliable signs, so it shows whether pressure is rising or falling.", "✓ Capillary refill, sensation and movement of the toes", "  Yes: Neurovascular checks track perfusion and nerve function distal to the injury and show whether treatment is working.", "- Blood glucose", "  No: Glucose is not related to compartment pressure or limb perfusion.", "- Bowel sounds", "  No: Bowel sounds are unrelated to the limb and do not help track this problem.", "- Oral temperature", "  No: Temperature does not reflect compartment pressure or distal perfusion in this client.", "", "Why: Pain out of proportion to the injury, pain on passive stretch, paresthesia, pallor and slow capillary refill point to acute compartment syndrome. It is a surgical emergency: notify the provider, keep the limb at heart level, and avoid ice and elevation. Frequent neurovascular checks track the response.", "Tip: Pain that opioids do not touch in a casted limb is compartment syndrome until proven otherwise."], "st": "awaiting"}, {"id": "ngn:qb-risk-15", "hash": "9edb9af454", "title": "Wound evisceration · Take action", "body": ["A 63-year-old with obesity and diabetes is on post-op day 6 after an open bowel resection. After a coughing spell she says, \"Something just gave way.\" The nurse sees a loop of bowel protruding through the separated incision.", "", "Which actions should the nurse take? Select all that apply.", "", "- Raise the head of the bed fully and ask her to cough", "  No: Sitting fully upright and coughing increase abdominal pressure and can push out more bowel.", "✓ Keep her NPO", "  Yes: She will likely return to surgery for closure, so nothing is given by mouth.", "✓ Cover the bowel with sterile dressings moistened with sterile normal saline", "  Yes: Moist sterile dressings keep the exposed bowel from drying out and lower the risk of infection and tissue death.", "- Gently push the bowel back into the abdomen", "  No: Reinserting the bowel can injure it and introduce infection. Only the surgeon replaces organs.", "✓ Stay with her and have another staff member notify the surgeon", "  Yes: Evisceration is a surgical emergency; the nurse remains to monitor for shock and keep her calm while help is called.", "✓ Place her in low Fowler's position with her knees bent", "  Yes: This position relaxes the abdominal muscles and reduces tension on the wound.", "- Cover the bowel with dry sterile gauze", "  No: Dry gauze sticks to and dries the bowel. The dressing must be moist with sterile saline.", "", "Why: Evisceration usually follows dehiscence in clients with risk factors such as obesity, diabetes and coughing. The nurse protects the exposed organs with sterile saline-moistened dressings, reduces abdominal tension, keeps the client NPO and stays with her while the surgeon is notified, watching for shock.", "Tip: In surgical emergencies, choose actions that protect tissue and prepare for surgery; never pick an option where the nurse repairs or replaces anatomy."], "st": "awaiting"}, {"id": "ngn:qb-risk-16", "hash": "faf82fe16e", "title": "Rapid response criteria · Prioritize hypotheses", "body": ["The nurse is caring for four clients on a medical-surgical unit.", "", "For which client should the nurse call the rapid response team?", "", "- A 38-year-old 6 hours after a lumbar puncture with a mild headache when sitting up, rated 3/10", "  No: A mild positional headache after lumbar puncture is a known minor complication; report it and encourage fluids if allowed.", "- A 45-year-old on post-op day 3 after bowel surgery with mild abdominal distention and no flatus yet", "  No: This fits a postoperative ileus, which is managed with walking, NPO status as ordered and monitoring, not a rapid response.", "- A 70-year-old on post-op day 2 with temperature 37.8 °C (100.0 °F) and diminished breath sounds in both bases", "  No: This suggests atelectasis. The nurse encourages incentive spirometry, deep breathing and walking, and reports it, but it is not an emergency.", "✓ A 52-year-old 4 hours after abdominal hysterectomy who is restless with HR 132 (was 84), BP 84/50 and cool, clammy skin", "  Yes: A new tachycardia, systolic pressure under 90 and restlessness point to hemorrhage and shock. These meet common rapid response criteria and need immediate help.", "", "Why: Rapid response teams are called for acute changes such as a heart rate over about 130, systolic BP under 90, a big change in respiratory rate or new confusion, or when the nurse is worried. Early post-op hemorrhage shows up as tachycardia, hypotension, restlessness and cool skin. The other clients have expected or minor complications.", "Tip: Pick the client whose findings show an acute change in airway, breathing, circulation or mental status."], "st": "awaiting"}, {"id": "ngn:qb-basic-2", "hash": "ff5f0c5009", "title": "Pressure injury prevention · Generate solutions", "body": ["A 79-year-old who had a stroke is on bed rest on the med-surg unit. His Braden score is 12. He is sometimes incontinent of urine and eats about half of each meal.", "", "Which interventions should the nurse include in his plan of care? Select all that apply.", "", "- Place a donut-shaped cushion under his sacrum", "  No: Ring cushions concentrate pressure on the surrounding tissue and reduce blood flow to the center.", "✓ Float his heels off the bed with a pillow under his calves", "  Yes: Heels are a common site of pressure injury; lifting them off the mattress removes the pressure entirely.", "✓ Keep the head of the bed at or below 30 degrees except during meals", "  Yes: Higher angles cause sliding and shear over the sacrum; raising the head for meals still protects him from aspiration.", "✓ Reposition him at least every 2 hours on a written turning schedule", "  Yes: Regular repositioning relieves pressure over bony prominences before tissue damage begins.", "✓ Clean his skin promptly after incontinence and apply a moisture barrier", "  Yes: Moisture softens skin and makes it break down faster; gentle cleansing and a barrier protect it.", "✓ Request a dietitian consult for protein and calorie intake", "  Yes: Eating half of meals puts him at nutritional risk, and adequate protein is needed to keep skin intact.", "- Massage reddened areas over bony prominences", "  No: Massage can damage fragile tissue and capillaries that are already injured. The trap is thinking it improves circulation.", "", "Why: A Braden score of 12 indicates high risk; lower scores mean higher risk, and 18 or less signals risk. Prevention targets each subscale: relieve pressure, reduce shear, manage moisture and support nutrition. Massage over reddened bony prominences and donut cushions are outdated and harmful.", "Tip: Match interventions to the Braden subscales the stem describes: mobility, moisture, nutrition, and friction and shear."], "st": "awaiting"}, {"id": "ngn:qb-basic-5", "hash": "afa191c9c9", "title": "Dysphagia precautions · Evaluate outcomes", "body": ["A 72-year-old had a stroke 4 days ago. The speech-language pathologist ordered mildly thick liquids, a minced and moist diet, and aspiration precautions, including a chin tuck when swallowing. The nurse observes a UAP assisting her with lunch.", "", "For each UAP action, indicate whether it is appropriate or requires the nurse to intervene.", "", "- Sits the client fully upright in a chair for the meal → Appropriate", "  upright positioning helps food move down the esophagus and protects the airway.", "- Offers small bites and waits for each swallow → Appropriate", "  small amounts with time to swallow lower the risk that food enters the airway.", "- Reminds her to tuck her chin when she swallows → Appropriate", "  the chin tuck ordered by the speech-language pathologist narrows the airway entrance during the swallow.", "- Gives her thin water through a straw because she is thirsty → Requires intervention", "  thin liquids move too fast for a weak swallow, and straws increase the volume and speed. All liquids must be thickened as ordered.", "- Checks her weak cheek for pocketed food after the meal → Appropriate", "  food can collect on the weak side after a stroke and be aspirated later.", "- Lays the bed flat 10 minutes after the meal so she can nap → Requires intervention", "  she should stay upright for about 30 minutes after eating to prevent reflux and aspiration.", "", "Why: Dysphagia precautions keep food and fluid out of the airway: upright positioning, small bites, ordered swallowing techniques, prescribed consistencies and checking for pocketing. Thin liquids, straws and lying flat soon after eating all raise aspiration risk and require the nurse to step in.", "Tip: For each action, ask whether it speeds food toward the airway or slows it; anything that speeds it requires intervention."], "st": "awaiting"}, {"id": "ngn:qb-basic-7", "hash": "c4371bbf9e", "title": "CAUTI prevention · Evaluate outcomes", "body": ["A 68-year-old has an indwelling urinary catheter after hip surgery. The nurse observes a UAP providing her morning care.", "", "Which action by the UAP requires the nurse to intervene?", "", "- Empties the bag into a container used only for this client, without letting the spout touch it", "  No: A separate container and a clean spout prevent cross-contamination, which is correct technique.", "✓ Places the drainage bag on the client's abdomen while turning her", "  Yes: Raising the bag above bladder level lets urine flow back into the bladder and increases the risk of infection.", "- Cleans the perineum and the catheter near the meatus with soap and water", "  No: Routine cleaning with soap and water during hygiene is the recommended practice.", "- Secures the catheter tubing to the client's upper thigh", "  No: Securing the tubing prevents pulling and movement that can injure the urethra and introduce bacteria.", "", "Why: CAUTI prevention keeps urine flowing one way and the system closed and clean: bag below the bladder and off the floor, tubing secured without kinks, daily hygiene and clean emptying technique. Most important, the nurse asks each day whether the catheter is still needed and gets it removed as soon as possible.", "Tip: In observe-and-intervene items, look for the action that breaks a basic principle such as gravity, asepsis or safety."], "st": "awaiting"}, {"id": "ngn:qb-basic-8", "hash": "15c57fee67", "title": "Sleep disruption in hospital · Recognize cues", "body": ["Nurse's note at 06:00 for a 76-year-old admitted 2 days ago with left leg cellulitis. She says she slept about 2 hours and feels exhausted.", "", "Highlight the factors likely disrupting her sleep that the nurse can address.", "", "✓ highlight Vital signs taken at 00:00, 02:00 and 04:00 while stable for 36 hours.", "  Yes: Frequent overnight checks on a stable client break up sleep; the nurse can ask the provider to adjust the frequency.", "✓ highlight Furosemide 40 mg IV given at 21:00.", "  Yes: A diuretic given late in the evening causes nighttime urination. The nurse can request an earlier scheduled time.", "✓ highlight Drank two cups of coffee with dinner at 18:00.", "  Yes: Caffeine in the evening delays sleep; the nurse can offer decaffeinated drinks after midday.", "✓ highlight Door left open with hall lights on overnight.", "  Yes: Light and noise from the hallway disrupt sleep; closing the door or dimming lights is a simple fix.", "- Says she usually reads for 20 minutes before bed at home.", "  No: A familiar bedtime routine supports sleep, so the nurse should encourage it rather than treat it as a problem.", "- Leg pain rated 2/10, redness fading.", "  No: Her pain is well controlled and the infection is improving, so pain is not the cause of her poor sleep.", "", "Why: Hospital routines are a common cause of poor sleep. Unnecessary overnight vital signs, late diuretic doses, evening caffeine and light and noise can all be changed by the nurse or with a quick request to the provider. Supporting the client's usual bedtime routine helps.", "Tip: Look for factors the care team itself controls; those are the easiest and most effective to change."], "st": "awaiting"}, {"id": "ngn:qb-basic-9", "hash": "a4969063f1", "title": "Pain assessment scales · Recognize cues", "body": ["A float nurse is assigned to several clients across the hospital and must choose the right pain assessment tool for each.", "", "For each client, indicate the most appropriate pain assessment tool.", "", "- A 2-year-old after a tonsillectomy → FLACC scale", "  FLACC scores face, legs, activity, cry and consolability for children too young to rate their own pain.", "- A 6-month-old after a hernia repair → FLACC scale", "  FLACC is validated for infants and young children who cannot describe pain in words.", "- An intubated, sedated adult in the ICU after abdominal surgery → Critical-Care Pain Observation Tool (CPOT)", "  CPOT uses facial expression, body movement, muscle tension and ventilator tolerance in critically ill adults who cannot self-report.", "- An alert 45-year-old after a knee replacement → Numeric rating scale (0 to 10)", "  self-report is the most reliable measure of pain, and an alert adult can rate it on a 0 to 10 scale.", "- An alert 14-year-old after an appendectomy → Numeric rating scale (0 to 10)", "  school-age children and adolescents who understand numbers can reliably use the numeric scale.", "", "Why: Self-report is the gold standard whenever the client can give it, so alert adults and older children use a numeric scale. When a client cannot self-report, the nurse uses a validated behavioral tool: FLACC for infants and young children, and CPOT for critically ill adults such as those on a ventilator.", "Tip: First ask whether the client can self-report; only if they cannot, choose the behavioral tool that fits their age and setting."], "st": "awaiting"}, {"id": "ngn:qb-phys-8", "hash": "2a8ddf3dc2", "title": "Autonomic dysreflexia · Take action", "body": ["A 30-year-old with a complete T4 spinal cord injury is lying in bed on the rehabilitation unit. He suddenly reports a pounding headache. BP 202/108, HR 52. His face and neck are flushed and sweaty, and his legs are cool and pale.", "", "Which action should the nurse take first?", "", "- Give the PRN antihypertensive", "  No: medication is used if BP stays high after positioning and removing the trigger. The trap is skipping fast, nondrug steps.", "- Check his bladder for distention and his catheter for kinks", "  No: a full bladder is the most common trigger and is checked next, but the BP is lowered by positioning first.", "✓ Raise the head of the bed and sit him upright with his legs lowered", "  Yes: sitting upright pools blood in the legs and lowers blood pressure right away, buying time to find the trigger.", "- Lay him flat and elevate his legs", "  No: this increases venous return and raises blood pressure further, which can lead to stroke or seizure.", "", "Why: Autonomic dysreflexia happens in injuries at T6 or above when a stimulus below the injury, most often a full bladder or bowel, triggers uncontrolled sympathetic activity. BP can reach stroke levels. The nurse sits the client up, loosens tight clothing, then finds and removes the trigger, and gives an antihypertensive if BP stays high.", "Tip: When two options are both correct, choose the one that works fastest to reduce the immediate danger."], "st": "awaiting"}, {"id": "ngn:qb-phys-10", "hash": "83d1111dfc", "title": "Early hypovolemic shock · Recognize cues", "body": ["A 58-year-old is 4 hours out from a bowel resection. Preoperative HR was 78 and BP 132/80. The nurse is assessing for early signs of hypovolemic shock.", "", "Which findings are early signs of hypovolemic shock? Select all that apply.", "", "✓ New restlessness and anxiety", "  Yes: subtle changes in mental status reflect reduced brain perfusion and often appear before the blood pressure falls.", "- Warm, flushed skin", "  No: warm, flushed skin fits early septic or anaphylactic shock from vasodilation, not volume loss.", "✓ Cool, pale skin with capillary refill of 4 seconds", "  Yes: blood is shunted away from the skin to vital organs, so the skin cools and refill slows.", "✓ BP 118/96, a narrowed pulse pressure", "  Yes: vasoconstriction raises the diastolic pressure while stroke volume falls, so the pulse pressure narrows before the systolic drops.", "✓ Urine output 20 mL/h for the past 2 hours", "  Yes: the kidneys receive less blood flow and hormones conserve water, so urine output drops below 0.5 mL/kg/h.", "✓ HR 112, up from 78", "  Yes: tachycardia is one of the first compensations for lost volume, as the heart beats faster to keep cardiac output up.", "- Systolic BP 82", "  No: hypotension is a late sign that shows compensation has failed. The trap is waiting for low BP to recognize shock.", "", "Why: In early hypovolemic shock the body compensates with sympathetic activity: the heart rate rises, vessels constrict, the skin cools and urine output falls, while the systolic BP is often still normal. Restlessness can be the first clue. A falling systolic BP means compensation is failing.", "Tip: When a question asks for early signs, exclude the dramatic late findings such as hypotension, even though they also need action."], "st": "awaiting"}, {"id": "ngn:qb-phys-12", "hash": "5f0a4c93a6", "title": "Acute pancreatitis · Prioritize hypotheses", "body": ["A 49-year-old with a history of heavy alcohol use is admitted with acute pancreatitis. He is NPO with IV fluids running. The nurse reviews his 14:00 assessment.", "", "Which finding is the priority for the nurse to address?", "", "✓ BP 84/50 and HR 126", "  Yes: pancreatitis causes large fluid shifts into the abdomen, and hypotension with tachycardia signals hypovolemic shock that threatens perfusion.", "- Nausea with two episodes of vomiting", "  No: nausea is common and is managed with NPO status and antiemetics; it is not an immediate threat to life.", "- Epigastric pain radiating to the back, rated 7 of 10", "  No: pain is expected and must be treated, but circulation problems come before pain in priority.", "- Serum lipase 1,450 units/L", "  No: a high lipase confirms the diagnosis and is expected. Its level does not reflect how sick the client is right now.", "", "Why: Acute pancreatitis releases inflammatory mediators that make capillaries leak, shifting large volumes of fluid out of the vessels. Hypotension and tachycardia mean shock and need aggressive fluid resuscitation. Expected findings such as a high lipase and pain are important but lower priority.", "Tip: Separate expected findings of the diagnosis from findings that show a complication; the complication is usually the priority."], "st": "awaiting"}, {"id": "ngn:qb-phys-13", "hash": "effe798d05", "title": "COPD and acid-base · Analyze cues", "body": ["A 70-year-old with COPD is admitted with an exacerbation. She is drowsy and using accessory muscles. Arterial blood gas: pH 7.31, PaCO₂ 64 mm Hg, HCO₃ 31 mEq/L, PaO₂ 54 mm Hg.", "", "Complete the sentences.", "", "Blank 1:", "- respiratory alkalosis", "  No: the pH is below 7.35, which is acidosis, not alkalosis.", "✓ respiratory acidosis", "  Yes: the pH is below 7.35 and the PaCO₂ is above 45 mm Hg, so retained carbon dioxide is causing the acidosis.", "- metabolic acidosis", "  No: in metabolic acidosis the bicarbonate is low. Her bicarbonate is high, which points to a respiratory cause.", "Blank 2:", "- uncompensated", "  No: uncompensated would mean a normal bicarbonate. Hers is elevated, so the kidneys are already compensating.", "✓ partially compensated", "  Yes: the kidneys are retaining bicarbonate, which is above 26 mEq/L, but the pH is still abnormal.", "- fully compensated", "  No: full compensation would bring the pH back to between 7.35 and 7.45. Her pH of 7.31 is still low.", "Blank 3:", "✓ 88% to 92%", "  Yes: this target corrects dangerous hypoxemia while limiting the rise in carbon dioxide that high oxygen can cause in COPD.", "- 98% to 100%", "  No: aiming this high in a client who retains carbon dioxide can worsen hypercapnia and drowsiness.", "- 80% to 84%", "  No: this range leaves her hypoxemic. Oxygen should never be withheld from a hypoxemic client because of COPD.", "", "Why: A low pH with a high PaCO₂ is respiratory acidosis, and a high bicarbonate shows the kidneys are partly compensating. Drowsiness suggests the carbon dioxide is affecting her level of consciousness. Oxygen is titrated to 88% to 92% in COPD, and worsening drowsiness may mean she needs noninvasive ventilation.", "Tip: Read the pH first, then match the PaCO₂ or bicarbonate that moves in the same direction as the problem."], "st": "awaiting"}, {"id": "ngn:qb-phys-14", "hash": "3f07df56b3", "title": "Pneumothorax and chest tube · Evaluate outcomes", "body": ["A 24-year-old had a right chest tube placed yesterday for a spontaneous pneumothorax. The tube is connected to a water-seal drainage system with suction.", "", "Which finding indicates the treatment is effective?", "", "- Crackling under the skin that has spread from the insertion site to the neck", "  No: spreading subcutaneous emphysema means air is leaking into tissue and needs to be reported.", "✓ Breath sounds are now heard in the right upper lobe and SpO₂ is 97% on room air", "  Yes: returning breath sounds and normal oxygenation show the lung has re-expanded, which is the goal of the chest tube.", "- Trachea shifted toward the left side", "  No: tracheal shift away from the affected side suggests a tension pneumothorax, an emergency.", "- Continuous bubbling in the water-seal chamber", "  No: continuous bubbling in the water-seal chamber suggests an air leak in the system or a persistent leak from the lung. Intermittent bubbling with exhalation or coughing can be expected while air is still leaving the pleural space.", "", "Why: A chest tube for pneumothorax works by removing air so the lung can re-expand. Restored breath sounds on the affected side, easier breathing and normal oxygen saturation show it is working. Continuous water-seal bubbling, tracheal shift and spreading crepitus are signs of problems.", "Tip: For evaluate questions, name the goal of the treatment, then pick the finding that shows that goal was met."], "st": "awaiting"}, {"id": "ngn:qb-phys-17", "hash": "bf6754f1c7", "title": "Adrenal crisis · Prioritize hypotheses", "body": ["A 54-year-old who has taken prednisone 20 mg daily for 2 years for rheumatoid arthritis ran out of her medication 5 days ago. She is admitted with 2 days of vomiting and abdominal pain. She is confused and weak. T 37.2 °C (99 °F), BP 78/46, HR 118. Labs: sodium 127 mEq/L, potassium 4.6 mEq/L, glucose 54 mg/dL.", "", "Complete the diagram: the condition the client is most likely experiencing, two actions the nurse should take, and two parameters to monitor.", "", "Condition:", "✓ Acute adrenal crisis", "  Yes: abruptly stopping long-term steroids plus illness causes cortisol deficiency, with hypotension, hyponatremia and hypoglycemia.", "- Septic shock", "  No: sepsis can cause hypotension, but her normal temperature, low glucose and abrupt steroid stop point to adrenal failure.", "- Thyroid storm", "  No: thyroid storm causes high fever, agitation and often hyperglycemia, not hypoglycemia with hyponatremia.", "- SIADH", "  No: SIADH causes low sodium from water retention, but not hypotension, volume loss or low glucose.", "Actions to take:", "✓ Give IV hydrocortisone as ordered", "  Yes: IV hydrocortisone replaces the missing cortisol and is lifesaving; it also helps correct the sodium, glucose and blood pressure.", "✓ Infuse 0.9% sodium chloride with dextrose rapidly as ordered", "  Yes: large volumes of isotonic fluid with dextrose restore circulating volume and treat the hypoglycemia.", "- Restrict fluids to 1 liter per day", "  No: she is in shock from volume loss. Fluid restriction treats SIADH and would worsen her hypotension.", "- Apply a cooling blanket", "  No: she is not febrile. Cooling is used for hyperthermia such as thyroid storm.", "- Give spironolactone as ordered for blood pressure", "  No: spironolactone is a diuretic and aldosterone blocker; it would worsen her volume loss, hypotension and hyponatremia.", "Parameters to monitor:", "✓ Blood pressure", "  Yes: blood pressure shows whether fluids and hydrocortisone are reversing the shock.", "✓ Blood glucose", "  Yes: cortisol deficiency causes hypoglycemia, so glucose is checked often until it is stable.", "- Thyroid stimulating hormone", "  No: TSH evaluates thyroid function and does not guide treatment of adrenal crisis.", "- Hemoglobin A1C", "  No: A1C reflects 3 months of glucose control and does not help in an acute crisis.", "- Peak expiratory flow", "  No: peak flow measures airway obstruction in asthma, which is not part of this picture.", "", "Why: Stopping long-term glucocorticoids suppresses the body's own cortisol production, and an illness can then tip the client into adrenal crisis. Hypotension, hyponatremia and hypoglycemia are the classic pattern; hyperkalemia is typical of primary adrenal insufficiency (Addison disease) but uncommon after steroid withdrawal, because aldosterone is still made. Treatment is IV hydrocortisone and rapid isotonic fluid with dextrose, with close monitoring of BP, glucose and electrolytes.", "Tip: When the stem mentions long-term steroids that were stopped suddenly, think adrenal crisis before other causes of shock."], "st": "awaiting"}, {"id": "ngn:qb-psy-5", "hash": "1e4bb53be9", "title": "Delirium, dementia, depression · Analyze cues", "body": ["The med-surg nurse is caring for three older adults with confusion or memory complaints. The nurse is sorting the findings to decide which condition each one suggests.", "", "For each finding, indicate whether it is most consistent with delirium, dementia or depression.", "", "- Confusion began suddenly the night after surgery, with attention that comes and goes → Delirium", "  acute onset over hours to days with a fluctuating level of attention is the hallmark of delirium.", "- Sees bugs crawling on the wall and is worse at night → Delirium", "  visual hallucinations and evening worsening are common in delirium, which often reverses when the cause is treated.", "- Memory has slowly declined over 3 years, and she now gets lost in her own neighborhood → Dementia", "  gradual, progressive loss of memory and orientation over years with a normal level of alertness fits dementia.", "- Tries hard to answer memory questions and makes up details to fill gaps → Dementia", "  confabulation covers memory loss in dementia; the client tries to hide deficits rather than point them out.", "- Answers most memory questions with \"I don't know\" and makes little effort → Depression", "  low effort and quick \"I don't know\" answers suggest depression, which can look like dementia in older adults.", "- Sad mood, poor appetite and early morning waking for the past 2 months → Depression", "  a persistent low mood with changes in sleep and appetite over weeks points to depression.", "", "Why: Delirium is sudden, fluctuating and often reversible, with impaired attention. Dementia is gradual and progressive, with clients often trying to hide deficits. Depression in older adults can look like memory loss, but clients tend to report deficits and give low effort. A client can have more than one at the same time.", "Tip: Use onset and course first: sudden means delirium, slow over years means dementia, and weeks of low mood means depression."], "st": "awaiting"}, {"id": "ngn:qb-psy-10", "hash": "6c1df57da7", "title": "Therapeutic communication · Evaluate outcomes", "body": ["A 58-year-old on the med-surg unit was just told he has metastatic lung cancer. He says to the nurse, \"I don't know how I'm going to tell my kids.\" The charge nurse is evaluating a new nurse's responses.", "", "For each response, indicate whether it is therapeutic or nontherapeutic.", "", "- \"You're worried about how to tell your children.\" → Therapeutic", "  reflecting his feelings shows he was heard and invites him to keep talking.", "- \"Tell me more about what you're thinking.\" → Therapeutic", "  an open-ended prompt lets him lead and share what matters most to him.", "- \"I'll sit with you for a while.\" → Therapeutic", "  offering self conveys presence and support without forcing him to talk.", "- \"Don't worry, your kids will handle it fine.\" → Nontherapeutic", "  this is false reassurance that dismisses his concern and closes the conversation.", "- \"Why haven't you told them yet?\" → Nontherapeutic", "  why questions sound judgmental and put the client on the defensive.", "- \"If I were you, I would tell them tonight.\" → Nontherapeutic", "  giving advice takes the decision away from the client and puts the nurse's values first.", "", "Why: Therapeutic communication keeps the focus on the client's feelings. Reflection, open-ended questions and offering self encourage him to express his concerns. False reassurance, why questions and advice block communication because they dismiss feelings, judge or take over decisions.", "Tip: Ask whether each response keeps the focus on the client's feelings; if it shifts to the nurse's opinion or reassurance, it is nontherapeutic."], "st": "awaiting"}, {"id": "ngn:sa-mgmt-1", "hash": "f064aa16b9", "title": "Prioritizing a possible PE · Prioritize hypotheses", "body": ["At 0700 a med-surg nurse receives report on four clients. A 66-year-old on post-op day 2 after a right total knee replacement is newly restless: HR 118, RR 28, SpO₂ 89% on room air (96% yesterday). A 58-year-old with type 2 diabetes has a fingerstick glucose of 248 mg/dL before breakfast. A 74-year-old with COPD has an SpO₂ of 89% on 2 L, her documented baseline. A 40-year-old with pancreatitis reports pain 6/10; his PRN opioid is due in 1 hour.", "", "Complete the sentences.", "", "Blank 1:", "✓ after the knee replacement", "  Yes: new restlessness, tachycardia, tachypnea and a drop in SpO₂ two days after joint surgery is an unstable, unexpected change. This client could die without fast action.", "- with COPD", "  No: an SpO₂ of 89% is her documented baseline. Stable findings that are expected for the client are a lower priority than a new change.", "- with pancreatitis", "  No: pain 6/10 matters, but his medication is not due yet and pain is not life threatening. Comfort comes after a possible airway or circulation problem.", "Blank 2:", "- anxiety about discharge", "  No: anxiety is a diagnosis of exclusion. Restlessness with hypoxemia is a sign of low oxygen until proven otherwise.", "✓ pulmonary embolism", "  Yes: orthopedic surgery of the leg plus immobility is a classic setup for a clot. Sudden hypoxemia, tachycardia and tachypnea fit a pulmonary embolism.", "- expected postoperative pain", "  No: pain does not explain a new oxygen drop. Calling it pain is the trap that delays care for a clot.", "Blank 3:", "✓ with COPD at her baseline SpO₂", "  Yes: her findings are chronic, expected and unchanged. A stable client with an expected finding can wait while others are assessed.", "- with pancreatitis pain", "  No: his pain needs reassessment and nondrug comfort measures. Untreated acute pain ranks above a stable chronic finding.", "- with a glucose of 248 mg/dL", "  No: she needs her insulin dose before breakfast arrives, which is time sensitive. She should be seen before the stable client.", "", "Why: Prioritize an unexpected, acute change over a stable or expected finding. New hypoxemia, tachycardia and restlessness after knee surgery point to a pulmonary embolism, an airway and breathing problem that can be fatal. A client with COPD sitting at her own baseline is the most stable.", "Tip: Ask which finding is new and unexpected for that client, then rank it with ABCs; a baseline value is not an emergency."], "st": "awaiting"}, {"id": "ngn:sa-mgmt-5", "hash": "e488fe7ec1", "title": "Escalating postoperative hemorrhage · Take action", "body": ["A 56-year-old is 4 hours after an open bowel resection. At 1600: HR 88, BP 128/76. At 1700: HR 106, BP 108/66. At 1800: HR 122, BP 92/58, skin cool and clammy, abdominal dressing saturated with bright red blood, and 250 mL of bloody drainage in the surgical drain in the last hour. The nurse paged the surgeon at 1715 and 1745 with no response.", "", "Complete the diagram: the condition the client is most likely experiencing, two actions the nurse should take, and two parameters to monitor.", "", "Condition:", "- Expected tachycardia from postoperative pain", "  No: pain raises the heart rate but does not drop the blood pressure or soak a dressing with blood. Blaming pain is the trap.", "✓ Hypovolemic shock from postoperative bleeding", "  Yes: rising heart rate, falling pressure, cool clammy skin and heavy bright red drainage over 2 hours is hemorrhage progressing to shock.", "- Sepsis from an anastomotic leak", "  No: sepsis from a leak usually appears days later with fever, not 4 hours after surgery with frank bleeding.", "- Fluid volume overload", "  No: overload raises blood pressure and causes crackles and edema. This client's pressure is falling.", "Actions to take:", "- Page the surgeon again and wait 30 more minutes", "  No: two unanswered pages with a client in shock means waiting is unsafe. The nurse must escalate now.", "- Remove the dressing and pack the wound", "  No: packing a fresh surgical wound is outside nursing scope and does not stop internal bleeding. Reinforce the dressing instead.", "✓ Call the rapid response team", "  Yes: the rapid response team brings immediate bedside help for a deteriorating client while the surgeon is reached.", "✓ Notify the charge nurse and escalate up the chain of command now", "  Yes: when the provider does not respond, the nurse follows the chain of command: charge nurse, then supervisor or another physician, until someone acts.", "- File an incident report about the surgeon before calling anyone else", "  No: an incident report may be filed later, but it never comes before getting the client help.", "Parameters to monitor:", "✓ Heart rate and blood pressure", "  Yes: trending heart rate and blood pressure shows whether bleeding and shock are worsening or responding to treatment.", "- Blood glucose", "  No: glucose is not a priority marker of bleeding. It does not change the immediate plan.", "- Bowel sounds", "  No: bowel sounds return slowly after bowel surgery and say nothing about active bleeding.", "✓ Drain output and dressing saturation", "  Yes: measured drain output and dressing saturation show how fast the client is losing blood.", "- Temperature", "  No: temperature does not track blood loss. It matters later for infection, not now.", "", "Why: The vital signs trend shows compensated shock turning into uncompensated shock from bleeding. A nurse who cannot reach the provider has a duty to escalate through the chain of command and to call for rapid response help. Monitor the vital signs and the measured blood loss to judge whether interventions are working.", "Tip: When a client is deteriorating and the provider does not answer, the correct answer is escalation, never waiting."], "st": "awaiting"}, {"id": "ngn:sa-mgmt-6", "hash": "8ae0f0cae5", "title": "Incident reports and fall charting · Evaluate outcomes", "body": ["At 0215 a new graduate nurse found a 79-year-old client on the bathroom floor on a med-surg unit. She assessed him, found no injury, and notified the provider. The charge nurse reviews her plan for documentation.", "", "Which statements by the new nurse indicate correct understanding of documentation and incident reporting? Select all that apply.", "", "✓ \"I'll chart that I found him on the floor next to the toilet, plus my assessment findings.\"", "  Yes: the chart should hold objective facts: what was seen, where, and the assessment. She did not see the fall, so she documents what she found.", "✓ \"I'll complete an incident report and send it to risk management according to policy.\"", "  Yes: incident reports go to risk management for quality improvement. They are an internal document, separate from the medical record.", "- \"I'll put a copy of the incident report in his chart.\"", "  No: the incident report never goes in the medical record. Copying it into the chart defeats its confidential purpose.", "✓ \"I'll chart the time I notified the provider and the orders I received.\"", "  Yes: notification time and new orders show that the nurse acted promptly and followed through. This protects the client and the nurse.", "- \"I'll write 'incident report filed' in my progress note so the record is complete.\"", "  No: mentioning the incident report in the chart can make it discoverable in a lawsuit. Chart the event and care, not the report.", "✓ \"If I forget something, I'll add a late entry labeled with the current date and time.\"", "  Yes: a clearly labeled late entry is the legal way to add missed information. Backdating an entry is falsifying the record.", "- \"I'll document that he fell because the UAP didn't answer his call light.\"", "  No: the chart is not the place for blame or speculation about cause. Document only objective facts the nurse observed.", "", "Why: Chart objective facts, assessments, notifications and orders. The incident report is a separate quality document: it is filed with risk management, never copied into the chart and never mentioned in it. Blame and guesses about cause do not belong in documentation.", "Tip: Ask whether each statement is objective and belongs in the legal record; blame and references to the incident report do not."], "st": "awaiting"}, {"id": "ngn:sa-health-6", "hash": "71fc6246a0", "title": "Aging versus acute change · Analyze cues", "body": ["An 84-year-old woman is admitted for observation after a fall at home with no fracture. Her daughter says she lives alone and was \"sharp as a tack\" last week. The nurse completes the admission assessment.", "", "For each finding, indicate whether it is an expected age-related change or requires further evaluation.", "", "- Needs reading glasses to read the menu → Expected age-related change", "  Presbyopia, the loss of near focus as the lens stiffens, is a normal change of aging.", "- Gets up once a night to urinate → Expected age-related change", "  Bladder capacity falls and nighttime urine production rises with age, so one episode of nocturia is common.", "- Confused about where she is since yesterday → Requires further evaluation", "  A sudden change in mental status is delirium until proven otherwise. Confusion is never a normal part of aging.", "- Thin, dry skin that bruises easily → Expected age-related change", "  The skin loses collagen, fat and oil glands with age. Thin, fragile skin is expected, though it raises injury risk.", "- New urinary incontinence and burning on urination → Requires further evaluation", "  New incontinence with dysuria suggests a urinary tract infection. In older adults a UTI can also cause sudden confusion and falls.", "- Takes longer to answer questions but answers correctly → Expected age-related change", "  Processing speed slows with age, but accuracy and judgment stay intact. This is expected.", "", "Why: Normal aging slows the body but does not cause sudden change. Presbyopia, mild nocturia, fragile skin and slower responses are expected. New confusion, new incontinence and dysuria point to an acute problem such as infection, which may also explain the fall.", "Tip: Ask whether a finding is gradual or sudden; sudden change in an older adult is never just aging."], "st": "awaiting"}, {"id": "ngn:sa-psych-2", "hash": "a27f5627d6", "title": "Depression in an older widower · Prioritize hypotheses", "body": ["A 78-year-old man on a med-surg unit is recovering from surgical repair of a hip fracture. His wife died 3 months ago. On post-op day 2 he said, \"What's the point of rehab? There's nothing to go home to,\" ate 25% of his meals and slept poorly. On post-op day 6 he is calm and smiling, says he \"finally feels at peace,\" and has asked his son to bring his will and to give his dog to a neighbor.", "", "Complete the diagram: the condition the client is most likely experiencing, two actions the nurse should take, and two parameters to monitor.", "", "Condition:", "- Depression improving with physical recovery", "  No: this is the trap. A sudden lift in mood after hopelessness, with putting affairs in order, can mean he has decided on a plan.", "✓ High risk for suicide", "  Yes: an older widowed man with hopelessness, recent loss and illness who suddenly feels at peace and gives away a pet has several high-risk warning signs.", "- Postoperative delirium", "  No: delirium causes fluctuating attention and confusion. He is calm, clear and purposeful.", "- Uncomplicated grief", "  No: grief includes sadness but not hopelessness about living plus giving away possessions. Those are suicide warning signs.", "Actions to take:", "✓ Ask him directly whether he is thinking about killing himself", "  Yes: asking directly about suicide does not plant the idea. It opens the conversation and is the only way to assess plan and intent.", "- Tell him things will look better once he is home", "  No: false reassurance dismisses his feelings and misses the risk. It closes the conversation.", "- Wait for the psychiatry consult in the morning before discussing suicide", "  No: delaying assessment leaves a high-risk client unprotected overnight. The nurse assesses and acts now.", "- Ask him to sign a no-suicide contract", "  No: no-suicide contracts do not prevent suicide and can give false comfort. A safety plan with observation is used instead.", "✓ Notify the provider and start continuous observation per policy", "  Yes: high risk requires a safe environment and close observation. The provider needs to know for a psychiatric evaluation.", "Parameters to monitor:", "✓ Suicidal thoughts, plan and intent on each reassessment", "  Yes: ideation, plan and intent show how imminent the risk is and guide the level of observation.", "- Incision appearance", "  No: the incision matters for healing but not for suicide risk.", "- Serum sodium", "  No: sodium does not reflect his current risk.", "✓ Mood and behavior, including hopeless statements", "  Yes: changes in mood and hopeless statements, along with behaviors like giving things away, track whether risk is rising or falling.", "- Bowel sounds", "  No: bowel sounds are a routine post-op check unrelated to this concern.", "", "Why: Older men who are widowed and newly ill have one of the highest suicide rates. The trend from hopelessness to sudden calm, with a will and a pet being given away, signals a possible decision to die. Ask directly, keep him safe with close observation, and involve the provider.", "Tip: A sudden improvement in mood in a depressed client is a red flag, not a sign of recovery."], "st": "awaiting"}, {"id": "ngn:sa-psych-4", "hash": "932ef30c77", "title": "Denial and anger in grief · Analyze cues", "body": ["A 54-year-old on a med-surg unit learned yesterday that his liver biopsy shows metastatic pancreatic cancer. Today he tells the nurse, \"The lab must have mixed up my sample. I'll be back at work next week.\" An hour later he yells at the dietary aide because his coffee is cold.", "", "Complete the sentences.", "", "Blank 1:", "- rationalization", "  No: rationalization is making up a logical-sounding excuse for behavior. He is rejecting the diagnosis itself.", "✓ denial", "  Yes: refusing to accept a painful reality, such as a new cancer diagnosis, is denial. It is a common first response to bad news.", "- projection", "  No: projection is blaming others for one's own unacceptable feelings. He is not attributing his feelings to anyone.", "Blank 2:", "- a refusal of treatment to document", "  No: he has not refused any care. Disbelief about a diagnosis is not a refusal of treatment.", "- a sign of psychosis that needs medication", "  No: denial is not a break from reality like a delusion. Labeling it psychosis is the trap.", "✓ an expected early response to a major loss", "  Yes: denial buffers shocking news and usually fades as the person absorbs it. The nurse accepts it without arguing or reinforcing it.", "Blank 3:", "✓ displacement", "  Yes: he is moving anger about his diagnosis onto a less threatening person. This is displacement and also fits the anger stage of grief.", "- sublimation", "  No: sublimation channels feelings into a socially acceptable activity, such as exercise or art. Yelling is not that.", "- regression", "  No: regression is a return to earlier developmental behavior, such as bedwetting or thumb-sucking. This is anger aimed at a safe target.", "", "Why: Shock at a terminal diagnosis often shows up first as denial, then anger. Denial is protective early on and is not challenged harshly. Displaced anger at staff is common; the nurse responds calmly and does not take it personally.", "Tip: Name the defense mechanism by asking what feeling is being handled and where it is directed."], "st": "awaiting"}, {"id": "ngn:sa-basic-1", "hash": "523362872b", "title": "Enteral feeding safety · Recognize cues", "body": ["A 76-year-old with dysphagia after a stroke receives a continuous enteral feeding at 55 mL/h through a small-bore nasogastric tube. Placement was confirmed by x-ray on admission. The nurse reviews the 0400 note.", "", "Highlight the findings that require follow-up.", "", "✓ highlight Head of bed at 15 degrees after a linen change at 0315.", "  Yes: a continuous feeding needs the head of bed at 30 to 45 degrees; lying flatter lets formula reflux and be aspirated.", "✓ highlight External tube mark at the nare is 8 cm longer than the mark documented after x-ray confirmation.", "  Yes: a longer external length means the tube has pulled back and the tip may sit in the esophagus. Stop the feeding and verify placement.", "✓ highlight Coughing with a wet, gurgling voice since 0330.", "  Yes: new coughing and a wet voice during a feeding suggest aspiration. Stop the feeding and assess the lungs and oxygen saturation.", "- Gastric residual volume 90 mL, returned to the stomach.", "  No: 90 mL is well under the usual hold threshold of 250 to 500 mL, and returning it preserves fluid and electrolytes. The trap is treating any residual as a problem.", "- Skin at the nare intact; tube secured with a fixation device.", "  No: intact skin and a secured tube are the goal. Keep checking the nare for pressure injury each shift.", "- Bowel sounds present in all four quadrants.", "  No: active bowel sounds support continuing the feeding. Absent sounds with distension would be the concern.", "", "Why: Three findings point the same way: the head of the bed is low, the tube has migrated out, and the client is coughing with a wet voice. Together they suggest aspiration of formula. The nurse stops the feeding, raises the head of the bed, and verifies tube position before restarting.", "Tip: For tube feeding items, check position, placement and tolerance in that order; any sign the tip moved comes before a residual number."], "st": "awaiting"}]}, "packs": [{"id": "drill-med-1", "title": "Drills: Med Pass, part 1 of 2", "sub": "What to check before a medication, then give, hold or call. A pharmacist is especially welcome.", "n": 25, "reviewed": 0, "changed": 0}, {"id": "drill-med-2", "title": "Drills: Med Pass, part 2 of 2", "sub": "What to check before a medication, then give, hold or call. A pharmacist is especially welcome.", "n": 25, "reviewed": 0, "changed": 0}, {"id": "drill-first-1", "title": "Drills: Who's First, part 1 of 2", "sub": "Four patients, one nurse: who do you see first, and why not the others.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "drill-first-2", "title": "Drills: Who's First, part 2 of 2", "sub": "Four patients, one nurse: who do you see first, and why not the others.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "drill-sbar", "title": "Drills: SBAR", "sub": "Building a call to the provider line by line, and the order that comes back.", "n": 20, "reviewed": 0, "changed": 0}, {"id": "drill-calm", "title": "Drills: De-escalation", "sub": "What to say to an agitated patient, turn by turn. Psych or ED experience fits best.", "n": 22, "reviewed": 0, "changed": 0}, {"id": "ngn-shif
