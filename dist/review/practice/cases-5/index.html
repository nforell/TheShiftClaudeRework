<style>
:root{--bg:#E6EDF0;--surface:#FBFCFC;--surface-2:#EDF2F4;--ink:#152238;--ink-2:#4D5A6F;--line:#CAD5DB;--teal:#2449A8;--teal-ink:#fff;--red:#B3342B;--red-bg:#F8E1DE;--good:#2B7249;--good-bg:#E0F0E6;--amber:#A96C0E;--amber-bg:#FBEFD6;
  --serif:"Barlow Condensed","Arial Narrow",sans-serif;--sans:"Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161C;--surface:#1A1F27;--surface-2:#212833;--ink:#E7E4DB;--ink-2:#A0A5AE;--line:#343C48;--teal:#93B4E4;--teal-ink:#0F1B2C;--red:#F0766B;--red-bg:#3b1d1b;--good:#72c692;--good-bg:#16301f;--amber:#E9AE4E;--amber-bg:#35291a}}
:root[data-theme="dark"]{--bg:#12161C;--surface:#1A1F27;--surface-2:#212833;--ink:#E7E4DB;--ink-2:#A0A5AE;--line:#343C48;--teal:#93B4E4;--teal-ink:#0F1B2C;--red:#F0766B;--red-bg:#3b1d1b;--good:#72c692;--good-bg:#16301f;--amber:#E9AE4E;--amber-bg:#35291a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
main{max-width:52rem;margin:0 auto;padding:clamp(1.2rem,5vw,3rem) 16px calc(5rem + env(safe-area-inset-bottom))}
a{color:var(--teal)}
.home{font-family:var(--serif);font-weight:700;font-size:1.1rem;letter-spacing:.04em;text-transform:uppercase;background:var(--ink);color:var(--bg);padding:.28em .55em .22em;border-radius:2px;text-decoration:none}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.9rem,6vw,2.6rem);line-height:1.1;letter-spacing:0;margin:1.6rem 0 .3rem}
h2{font-size:1.15rem;margin:2.4rem 0 .6rem}
h3{font-size:1rem;margin:0}
p{margin:.5rem 0}
.muted{color:var(--ink-2)}
.meta{display:flex;flex-wrap:wrap;gap:.4rem .6rem;margin-top:.6rem}
.chip{display:inline-flex;align-items:center;padding:.15em .6em;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--surface-2);border:1px solid var(--line)}
.chip.awaiting{background:var(--amber-bg);border-color:transparent;color:var(--amber)}
.chip.reviewed{background:var(--good-bg);border-color:transparent;color:var(--good)}
.chip.changed{background:var(--red-bg);border-color:transparent;color:var(--red)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem 1.1rem;margin:.8rem 0}
.how ol{margin:.4rem 0 0;padding-left:1.2rem}.how li{margin:.2rem 0}
label{display:block;font-weight:600;font-size:.9rem;margin:.7rem 0 .25rem}
input[type=text],input[type=email],textarea,select{width:100%;min-height:44px;padding:.5em .7em;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:5rem;resize:vertical}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:0 1rem}
details.pt{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:.6rem 0}
details.pt>summary{cursor:pointer;padding:.85rem 1rem;font-weight:600;list-style-position:inside}
details.pt>div{padding:0 1rem 1rem}
table{width:100%;border-collapse:collapse;font-size:.88rem;margin:.4rem 0}
th,td{text-align:left;vertical-align:top;padding:.35rem .5rem .35rem 0;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--ink-2);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
.scroll{overflow-x:auto}
ul.plain{margin:.3rem 0;padding-left:1.1rem}
.dec{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:.85rem 1rem;margin:.6rem 0}
.dec.pos{border-left-color:var(--good)}.dec.neg{border-left-color:var(--red)}
.dec .top{display:flex;flex-wrap:wrap;gap:.3rem .5rem;align-items:center;font-size:.78rem;color:var(--ink-2);font-weight:600}
.pts{font-weight:700;padding:.05em .45em;border-radius:4px;background:var(--surface-2)}
.pos .pts{color:var(--good);background:var(--good-bg)}.neg .pts{color:var(--red);background:var(--red-bg)}
.dec b{display:block;margin:.35rem 0 .15rem;font-size:1rem}
.dec .why{font-family:var(--sans);color:var(--ink-2);margin:0}
.dec .src{font-size:.75rem;color:var(--ink-2);margin-top:.35rem}
.verdict{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.7rem}
.verdict button{min-height:40px;padding:.35em .9em;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer}
.verdict button[aria-pressed="true"][data-v="ok"]{background:var(--good);border-color:var(--good);color:var(--teal-ink)}
.verdict button[aria-pressed="true"][data-v="fix"]{background:var(--red);border-color:var(--red);color:var(--teal-ink)}
.verdict button[aria-pressed="true"][data-v="unsure"]{background:var(--amber);border-color:var(--amber);color:var(--teal-ink)}
.dec textarea{margin-top:.5rem;min-height:3.6rem}
.opt{padding:.4rem 0;border-bottom:1px solid var(--line);font-size:.92rem}.opt:last-child{border:0}
.opt i{font-style:normal;font-weight:700;font-size:.75rem;padding:.05em .4em;border-radius:4px;margin-right:.4rem;background:var(--surface-2)}
.bar{position:sticky;top:0;z-index:5;margin:0 -16px;padding:.6rem 16px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:.6rem;font-size:.9rem}
.bar .prog{display:block;flex:1;min-width:4rem;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;max-width:12rem}.bar .prog i{display:block;height:100%;background:var(--teal)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:.55em 1.2em;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn-primary{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.row{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1rem}
.check{display:flex;gap:.6rem;align-items:flex-start;font-weight:500;margin-top:1rem}
.check input{width:1.2rem;height:1.2rem;margin-top:.2rem;flex:none}
.msg{margin-top:.8rem;font-weight:600}.msg.err{color:var(--red)}.msg.ok{color:var(--good)}
pre{white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:.8rem;font-size:.8rem;max-height:18rem;overflow:auto}
.shifts a{display:block;text-decoration:none;color:inherit}
.shifts .card:hover{border-color:var(--ink-2)}
</style>
<style>.item .body p{margin:.15rem 0}.item .body .why{color:var(--ink-2);font-size:.92rem;margin:0 0 .35rem 1.1rem}.item .body .ok b{display:inline;margin:0;color:var(--good)}.item .body .no{color:var(--ink)}.item .body .sp{height:.5rem}.item>b{margin-bottom:.5rem}</style></head>

ack-year history, still smokes half a pack a day. Two exacerbations last year; no home oxygen. Pulmonology note: usual SpO₂ 90 to 92% on room air. Type 2 diabetes (A1c 7.2%), hypertension. Home medications: tiotropium inhaler daily, albuterol inhaler as needed, metformin 1,000 mg PO twice daily, lisinopril 10 mg PO daily. Four days of worsening dyspnea, more sputum that has turned thick and green, and fever with chills since yesterday. Has not received a pneumococcal vaccine. Weight 58 kg (127.9 lb). Lives with her daughter. No known allergies.", "Vital Signs 14:00: T 38.4 °C (101.1 °F), HR 112, BP 146/88, RR 28, SpO₂ 85% on room air, 90% on 2 L nasal cannula.", "Laboratory Results 13:30: Arterial blood gas on 2 L: pH 7.33 (7.35 to 7.45), PaCO₂ 58 mm Hg (35 to 45), HCO₃ 30 mEq/L (22 to 26), PaO₂ 61 mm Hg (80 to 100). WBC 15,200/mm³ (5,000 to 10,000), neutrophils 84% (40 to 70). Glucose 164 mg/dL (70 to 99). Sodium 138 mEq/L. Potassium 4.2 mEq/L. Creatinine 0.8 mg/dL. Lactate 1.4 mmol/L (0.5 to 2.2).", "Diagnostic Results 13:00: Chest x-ray: hyperinflated lungs with flattened diaphragms; right lower lobe consolidation.", "Nurses' Notes 14:30: Arrived from the ED on 2 L nasal cannula. Using neck and shoulder muscles to breathe at rest. Speaks 4 to 5 words between breaths. Barrel-shaped chest. Pursed-lip breathing. Coarse crackles over the right lower lobe; expiratory wheezes throughout. Clubbing of the fingertips. Coughing thick green sputum; daughter says it was white last week. Alert and oriented to person, place, time and situation, answering questions appropriately.", "Orders 14:45: Oxygen by nasal cannula, titrate to SpO₂ 88 to 92%; notify provider for SpO₂ under 88%, need for more than 4 L, or new drowsiness or confusion. Ipratropium-albuterol nebulizer every 4 hours; albuterol 2.5 mg nebulizer every 2 hours PRN wheezing. Prednisone 40 mg PO daily for 5 days, first dose now. Blood cultures x2 and sputum culture, then ceftriaxone 1 g IV every 24 hours and azithromycin 500 mg IV every 24 hours. Point-of-care glucose before meals and at bedtime with insulin lispro correction scale: 151 to 200, 2 units; 201 to 250, 4 units; 251 to 300, 6 units; over 300, call provider. Continue metformin and lisinopril. Enoxaparin 40 mg subcut daily. Nicotine patch 14 mg daily. Zolpidem 5 mg PO at bedtime PRN sleep. Head of bed 30 degrees or higher. Repeat ABG for drowsiness, confusion or SpO₂ outside target.", "Medication Administration Record 16:45 (shown from item 4): Ipratropium-albuterol nebulizer 15:00. Prednisone 40 mg PO 15:00. Blood cultures x2 and sputum culture collected 15:30. Ceftriaxone 1 g IV 15:45. Azithromycin 500 mg IV 16:00. Insulin lispro 4 units subcut 16:45.", "Laboratory Results 16:40 (shown from item 4): Point-of-care glucose 248 mg/dL.", "Vital Signs 17:00 (shown from item 4): T 38.1 °C (100.6 °F), HR 104, BP 140/84, RR 24, SpO₂ 91% on 2 L nasal cannula.", "Nurses' Notes 17:00 (shown from item 4): Tired. Coughs often but cannot bring up the thick sputum. Wheezes slightly decreased after the nebulizer. Oral intake 300 mL since arrival. Her daughter asks why her mother can't have \"more oxygen to make it easier.\" Client asks to skip the prednisone because her sugar is high.", "Nurses' Notes 22:00 (shown from item 5): Found the flowmeter at 5 L. Daughter turned it up at about 19:30 \"because she was working so hard to breathe.\" Client is drowsy and falls asleep mid-sentence but wakes to her name. Complains of a headache. Respirations shallow. Skin warm and flushed. Daughter asks for \"her sleeping pill so she can rest.\"", "Vital Signs 22:00 (shown from item 5): T 37.9 °C (100.2 °F), HR 98, BP 154/92, RR 12, SpO₂ 98% on 5 L nasal cannula.", "Laboratory Results 22:15 (shown from item 5): Arterial blood gas on 5 L: pH 7.25, PaCO₂ 74 mm Hg, HCO₃ 31 mEq/L, PaO₂ 108 mm Hg. Compare 13:30 on 2 L: pH 7.33, PaCO₂ 58 mm Hg, HCO₃ 30 mEq/L, PaO₂ 61 mm Hg.", "Flowsheet 06:00 (shown from item 6): BiPAP from 22:45 to 06:00, then 2 L nasal cannula.", "Laboratory Results 05:30 (shown from item 6): Arterial blood gas on 2 L: pH 7.35, PaCO₂ 57 mm Hg, HCO₃ 31 mEq/L, PaO₂ 62 mm Hg. WBC 12,400/mm³ (15,200 on admission). Sputum culture: Streptococcus pneumoniae, sensitivities pending.", "Laboratory Results 11:30 (shown from item 6): Point-of-care glucose: day 1 at 21:00, 286 mg/dL; day 2 at 07:00, 162 mg/dL; day 2 at 11:30, 274 mg/dL.", "Vital Signs 08:00 (shown from item 6): T 37.4 °C (99.3 °F), HR 92, BP 138/80, RR 20, SpO₂ 90% on 2 L nasal cannula.", "Nurses' Notes 12:00 (shown from item 6): Alert and oriented to person, place, time and situation. Speaks in full sentences. Wheezes decreased; coarse crackles remain over the right lower lobe. Coughing up thinner, lighter sputum. States, \"As soon as I can walk, I'm going outside for a cigarette. I'll take this oxygen off first, so don't worry.\"", "", "Refer to the 14:30 nurses' note.", "", "Highlight the findings that require follow-up.", "", "✓ highlight Using neck and shoulder muscles to breathe at rest.", "  Yes: accessory muscle use at rest means her breathing muscles are working near their limit. Fatigue can follow and lead to respiratory failure.", "✓ highlight Speaks 4 to 5 words between breaths.", "  Yes: being unable to finish a sentence shows a high work of breathing. It is a quick bedside measure you can trend.", "- Barrel-shaped chest.", "  No: a barrel chest comes from years of air trapping in COPD. It is her chronic baseline, not a new problem.", "- Pursed-lip breathing.", "  No: pursed lips keep small airways open and help her empty her lungs. It is a helpful technique, not a sign of new trouble.", "✓ highlight Coarse crackles over the right lower lobe.", "  Yes: crackles over the area of consolidation on x-ray reflect the new pneumonia. They are new compared with her usual COPD exam.", "- Clubbing of the fingertips.", "  No: clubbing develops over months to years of low oxygen. The trap is treating a chronic finding as an acute change.", "✓ highlight Coughing thick green sputum; daughter says it was white last week.", "  Yes: a change in sputum color and volume is a key sign of a bacterial exacerbation and supports starting antibiotics.", "- Alert and oriented to person, place, time and situation, answering questions appropriately.", "  No: normal mentation is her baseline. Record it carefully, because new drowsiness would be an early sign of rising CO₂.", "", "Why: Sort what is chronic from what is new. Barrel chest, clubbing and pursed-lip breathing are her COPD baseline. Accessory muscle use, short phrases, new focal crackles and green sputum describe an acute exacerbation with pneumonia.", "Tip: For a client with a chronic disease, ask whether each finding was there last month; only the new or worse findings need follow-up."], "st": "awaiting"}, {"id": "ngn:cs-copd-2", "hash": "37ec5fc285", "title": "COPD flare with pneumonia · item 2 · Drop-down · Analyze cues", "body": ["Refer to the 13:30 arterial blood gas.", "", "Complete the sentences.", "", "Blank 1:", "- respiratory alkalosis", "  No: alkalosis requires a pH above 7.45. The trap is reading the high HCO₃ alone without starting from the pH.", "✓ respiratory acidosis", "  Yes: the pH is below 7.35 and the PaCO₂ is high, moving in opposite directions. Retained CO₂ from poor ventilation is causing the acidosis.", "- metabolic acidosis", "  No: in metabolic acidosis the HCO₃ is low. Her HCO₃ is high, so the bicarbonate is not the cause.", "Blank 2:", "- not compensated", "  No: an uncompensated gas would have a normal HCO₃. Hers is elevated, which takes days of kidney work.", "✓ partially compensated", "  Yes: the kidneys have retained bicarbonate to buffer the acid, but the pH is still below normal. That is partial compensation.", "- fully compensated", "  No: full compensation brings the pH back into the normal range. Her pH of 7.33 is still acidotic.", "Blank 3:", "✓ 88 to 92%", "  Yes: GOLD guidance targets 88 to 92% in COPD with CO₂ retention. It prevents hypoxemia without driving the CO₂ higher.", "- 100%", "  No: there is no benefit to full saturation, and high-flow oxygen can cause CO₂ narcosis in a chronic retainer.", "- 94 to 98%", "  No: this is the target for most clients without CO₂ retention. In her, extra oxygen can raise the PaCO₂ and cause drowsiness.", "", "Why: Start with the pH, then match the PaCO₂ or HCO₃ that explains it. Her acidosis is respiratory, and the high HCO₃ shows the kidneys have been holding bicarbonate for some time, so she is a chronic CO₂ retainer with an acute rise on top. That is why her oxygen target is 88 to 92%.", "Tip: Use the same three steps on every ABG: pH for acid or base, PaCO₂ or HCO₃ for the cause, then the other value for compensation."], "st": "awaiting"}, {"id": "ngn:cs-copd-3", "hash": "f69123270c", "title": "COPD flare with pneumonia · item 3 · Select all · Prioritize hypotheses", "body": ["Refer to the chart.", "", "Which client problems should the nurse address as priorities now? Select all that apply.", "", "- Acute pulmonary embolism", "  No: fever, purulent sputum and a lobar consolidation explain her findings. The trap is chasing a rare cause when a common one fits the data.", "✓ Infection that could progress to sepsis without prompt antibiotics", "  Yes: fever, HR 112, RR 28 and a WBC of 15,200 with a consolidation need cultures and antibiotics promptly. Her normal lactate and BP are reassuring for now.", "- Fluid volume excess", "  No: she has no edema, neck vein distention or bilateral crackles. Her crackles are localized to the consolidated lobe.", "- Disturbed body image related to her barrel chest", "  No: psychosocial needs matter, but there is no data suggesting distress about her appearance. Airway, breathing and infection come first now.", "✓ Worsening CO₂ retention if oxygen is given above her target", "  Yes: her ABG shows chronic CO₂ retention. Oxygen above 88 to 92% can blunt her drive to breathe and push the PaCO₂ higher.", "✓ Impaired gas exchange from airway obstruction and consolidation", "  Yes: an SpO₂ of 85% on room air, a PaO₂ of 61 mm Hg and a PaCO₂ of 58 mm Hg show she is not oxygenating or ventilating well.", "✓ Ineffective airway clearance from thick, increased secretions", "  Yes: thick green sputum and wheezes block small airways that are already narrowed by COPD. Clearing them improves gas exchange.", "- Hypoglycemia", "  No: her glucose is 164 mg/dL, and the steroid she is about to start will raise it further. The risk is high glucose, not low.", "", "Why: Her problems now are breathing and infection. Gas exchange and airway clearance come from the exacerbation and pneumonia, the infection needs prompt treatment, and her chronic CO₂ retention makes oxygen dosing a safety issue. The other choices are not supported by her data.", "Tip: Choose problems that the chart directly supports and that threaten airway, breathing or circulation right now."], "st": "awaiting"}, {"id": "ngn:cs-copd-4", "hash": "f9ec3fb8c0", "title": "COPD flare with pneumonia · item 4 · Matrix · Generate solutions", "body": ["It is 17:00 on day 1. Refer to the new chart entries.", "", "For each intervention, indicate whether it is indicated or contraindicated for this client now.", "", "- Keep the head of the bed high and let her lean forward on the over-bed table if she prefers → Indicated", "  upright, forward-leaning positions lower the diaphragm and let her use her accessory muscles more efficiently.", "- Increase the oxygen to 6 L so her SpO₂ reaches 98% → Contraindicated", "  her SpO₂ of 91% is in target. Raising it to 98% risks CO₂ narcosis, which is the trap behind the daughter's request.", "- Encourage oral fluids, about 2 L a day unless restricted, to thin secretions → Indicated", "  she has taken only 300 mL and has a fever. Adequate hydration makes thick sputum easier to cough up.", "- Teach huff coughing after each nebulizer treatment → Indicated", "  huff coughing moves secretions without collapsing her floppy airways, and it works best once the bronchodilator has opened them.", "- Hold the prednisone because the glucose is 248 mg/dL → Contraindicated", "  systemic steroids shorten COPD exacerbations. Steroid hyperglycemia is expected and managed with insulin, not by stopping the steroid.", "- Cluster care and plan rest periods between activities → Indicated", "  she is tired, and every task costs oxygen. Spacing activity protects her from respiratory muscle fatigue.", "", "Why: Good care for a COPD exacerbation opens airways, clears secretions and keeps oxygen in a safe range. Position, fluids, huff coughing and rest all support her breathing. Over-oxygenating her or stopping the steroid would trade a short-term comfort for real harm.", "Tip: When a family member or client requests a change, test it against the target or the order before agreeing."], "st": "awaiting"}, {"id": "ngn:cs-copd-5", "hash": "505b271e8b", "title": "COPD flare with pneumonia · item 5 · Select all · Take action", "body": ["It is 22:15 on day 1. Refer to the new chart entries.", "", "Which actions should the nurse take now? Select all that apply.", "", "✓ Turn the oxygen down and titrate to an SpO₂ of 88 to 92%", "  Yes: excess oxygen is driving the CO₂ up. Lowering it to her target reverses the cause while keeping her oxygenated.", "✓ Notify the provider or call a rapid response and report the ABG", "  Yes: a pH of 7.25 with a PaCO₂ of 74 mm Hg and new drowsiness is acute hypercapnic respiratory failure needing urgent evaluation.", "✓ Explain her 88 to 92% target to her daughter and ask her to call the nurse instead of adjusting the flowmeter", "  Yes: the daughter acted out of love. Teaching her why more oxygen is harmful prevents a repeat.", "- Give the PRN zolpidem so she can rest", "  No: a sedative-hypnotic will further depress her drive to breathe. Hold it and ask to have it discontinued.", "- Switch to a nonrebreather mask to support her breathing", "  No: a nonrebreather delivers even more oxygen and would worsen the CO₂ retention. It does nothing to improve ventilation.", "- Turn the oxygen off completely until she is fully awake", "  No: stopping oxygen abruptly can drop her PaO₂ dangerously low. The trap is overcorrecting; titrate down, do not remove.", "✓ Stay with the client and keep the head of the bed elevated", "  Yes: she is sedated by CO₂ and could stop protecting her airway. Upright positioning helps ventilation, and someone must watch her closely.", "✓ Prepare for noninvasive positive pressure ventilation", "  Yes: BiPAP is first-line for acute hypercapnic failure in COPD. It improves ventilation and can prevent intubation.", "", "Why: Too much oxygen in a chronic CO₂ retainer reduced her drive to breathe, and her CO₂ rose from 58 to 74 mm Hg. Titrate the oxygen down, stay with her, get help, and prepare for BiPAP. Removing oxygen entirely, sedating her or adding more oxygen would each make her worse.", "Tip: When the cause of deterioration is something the team gave, the first action is usually to correct it safely, not stop it abruptly."], "st": "awaiting"}, {"id": "ngn:cs-copd-6", "hash": "5228ac76bf", "title": "COPD flare with pneumonia · item 6 · Matrix · Evaluate outcomes", "body": ["It is 12:00 on day 2. Refer to the new chart entries.", "", "For each finding, indicate whether it shows the treatment is effective or that the client needs further intervention.", "", "- Drowsy at 22:00; now alert and oriented in full sentences → Effective", "  her mental status returned to baseline as the CO₂ came down on BiPAP and correct oxygen dosing.", "- ABG pH 7.25 and PaCO₂ 74 mm Hg at 22:15; pH 7.35 and PaCO₂ 57 mm Hg at 05:30 → Effective", "  the pH is back in range and the PaCO₂ is near her admission value. A chronic retainer will not normalize her CO₂.", "- SpO₂ 90% on 2 L nasal cannula → Effective", "  this is inside her 88 to 92% target. The trap is calling 90% low when the goal for her is not 95%.", "- Temperature 38.4 °C (101.1 °F) on admission, now 37.4 °C (99.3 °F); WBC 15,200, now 12,400/mm³ → Effective", "  falling fever and white count within 24 hours of antibiotics show the pneumonia is responding. Persistent crackles are expected for days.", "- Glucose 286 mg/dL at 21:00 and 274 mg/dL at 11:30 → Needs further intervention", "  correction insulin alone is not controlling steroid-driven afternoon highs. Report the pattern so the provider can add scheduled or mealtime insulin.", "- \"I'll take this oxygen off first, so don't worry.\" → Needs further intervention", "  smoking is the main driver of her COPD and delays recovery. She needs cessation counseling, use of her nicotine patch, and support rather than a lecture.", "", "Why: Her breathing, mental status and infection are improving, which shows BiPAP, oxygen titration and antibiotics are working. Steroid hyperglycemia is not controlled by correction insulin alone, and her plan to smoke shows she needs cessation support. Mixed results like this are common on day 2.", "Tip: Compare each value with the client's own target, not a textbook normal, before calling it effective or not."], "st": "awaiting"}, {"id": "ngn:cs-hemorrhage-1", "hash": "599402e96d", "title": "Bleeding after a hysterectomy · item 1 · Matrix · Recognize cues", "body": ["Client: 54-year-old woman is on the medical-surgical unit after an open total abdominal hysterectomy this morning", "Admission Notes: A 54-year-old woman is on the medical-surgical unit after an open total abdominal hysterectomy this morning. She arrived from the PACU at 13:30 with stable vital signs. You are her nurse for the afternoon.", "History and Physical: 54-year-old female. Open total abdominal hysterectomy with bilateral salpingo-oophorectomy for symptomatic fibroids and heavy menstrual bleeding. Surgery 08:15 to 11:05; estimated blood loss 450 mL. History: hypertension, iron deficiency anemia. Home medications: lisinopril 10 mg PO daily, ferrous sulfate 325 mg PO daily. Weight 72 kg (159 lb). Allergies: none known. Blood type O positive, antibody screen negative; type and screen drawn 06:00, valid 72 hours.", "Laboratory Results 06:00: Preoperative. Hemoglobin 11.2 g/dL (12 to 16). Hematocrit 34% (36 to 46). Platelets 268,000/mm³ (150,000 to 400,000). INR 1.1 (0.8 to 1.1). Potassium 4.2 mEq/L (3.5 to 5). Creatinine 0.8 mg/dL (0.6 to 1.1).", "Orders 13:30: Vital signs every hour for 4 hours, then every 4 hours. Lactated Ringer's at 125 mL/h. Indwelling urinary catheter to gravity; hourly urine output. Hydromorphone PCA: 0.2 mg demand dose, 10-minute lockout, no basal rate. Ondansetron 4 mg IV every 6 hours as needed for nausea. Sequential compression devices. Incentive spirometer 10 times an hour while awake. Enoxaparin 40 mg subcut daily, first dose POD 1 at 08:00. CBC at 18:00 and 05:00. Clear liquids when nausea free. Lisinopril on hold.", "Vital Signs 13:30: T 36.8 °C (98.2 °F), HR 84, RR 16, BP 132/78, SpO₂ 97% on 2 L nasal cannula. Pain 4/10.", "Vital Signs 14:30: T 36.9 °C (98.4 °F), HR 92, RR 18, BP 128/82, SpO₂ 97% on 2 L nasal cannula. Pain 5/10.", "Vital Signs 15:30: T 37 °C (98.6 °F), HR 104, RR 20, BP 122/86, SpO₂ 96% on 2 L nasal cannula. Pain 5/10.", "Vital Signs 16:30: T 37.1 °C (98.8 °F), HR 116, RR 22, BP 112/88, SpO₂ 95% on 2 L nasal cannula. Pain 6/10.", "Flowsheet 16:30: Urine output: 13:30 to 14:30, 60 mL; 14:30 to 15:30, 35 mL; 15:30 to 16:30, 20 mL. IV intake 125 mL/h. PCA: 14 demands, 12 doses delivered since 13:30.", "Nurses' Notes 16:30: Restless, keeps shifting in bed. States, I just feel off, and asks for another blanket. Skin cool and pale; capillary refill 3 seconds. Abdomen more distended and firmer than at 13:30, tender around the incision. Bowel sounds hypoactive. Midline dressing dry and intact. Scant dark red vaginal drainage on the pad. Lungs clear. Alert and oriented x4.", "Nurses' Notes 16:40 (shown from item 4): Rapid response team at bedside 16:38. Surgeon paged and on the way. Only IV access is a 20 gauge in the left hand. Client says, Something is wrong. Abdomen firm, distended and tender. Stat labs sent.", "Vital Signs 16:55 (shown from item 4): T 37.1 °C (98.8 °F), HR 122, RR 24, BP 104/84, SpO₂ 95% on 2 L nasal cannula.", "Laboratory Results 16:55 (shown from item 4): Hemoglobin 7.6 g/dL (12 to 16; 11.2 at 06:00). Hematocrit 23% (36 to 46). Platelets 214,000/mm³ (150,000 to 400,000). INR 1.1 (0.8 to 1.1). PTT 31 seconds (25 to 35). Lactate 3.2 mmol/L (0.5 to 2). Potassium 4.1 mEq/L (3.5 to 5). Creatinine 1.1 mg/dL (0.6 to 1.1).", "Orders 17:05 (shown from item 5): Transfuse packed red blood cells, 2 units, now. Continue lactated Ringer's 1,000 mL bolus. Exploratory laparotomy; OR notified, case at 18:00; surgeon has obtained consent. Vital signs every 15 minutes. Strict intake and output. Repeat CBC after the second unit.", "Medication Administration Record 17:00 (shown from item 5): Lactated Ringer's 1,000 mL IV bolus started 17:00 via 18 gauge right antecubital IV (placed 16:50).", "Laboratory Results 17:20 (shown from item 5): Blood bank: unit 1 packed red blood cells, O positive, crossmatch compatible, issued 17:20.", "Vital Signs 17:20 (shown from item 5): T 37.1 °C (98.8 °F), HR 124, RR 24, BP 98/82, SpO₂ 95% on 2 L nasal cannula.", "Nurses' Notes 20:45 (shown from item 6): Returned from the OR. Operative report: 1,200 mL of blood evacuated from the pelvis; bleeding from the left uterine artery pedicle, ligated. Received 2 units packed red blood cells (1 on the unit, 1 in the OR) and 2,500 mL lactated Ringer's total since 17:00.", "Laboratory Results 21:30 (shown from item 6): Hemoglobin 9.2 g/dL (12 to 16). Hematocrit 28% (36 to 46). Platelets 176,000/mm³ (150,000 to 400,000). INR 1.1 (0.8 to 1.1). Lactate 1.5 mmol/L (0.5 to 2).", "Vital Signs 22:30 (shown from item 6): T 37 °C (98.6 °F), HR 94, RR 22, BP 118/74, SpO₂ 91% on 2 L nasal cannula (96% at 21:30).", "Nurses' Notes 22:30 (shown from item 6): Heart rate 94, down from 124 before surgery. BP 118/74, pulse pressure 44. Urine output 45 mL and 50 mL over the last 2 hours. Skin warm and dry, capillary refill under 2 seconds. Lactate 1.5 mmol/L and hemoglobin 9.2 g/dL. New fine crackles in both lung bases. SpO₂ 91% on 2 L, was 96% at 21:30.", "", "Refer to the vital signs and flowsheet from 13:30 to 16:30.", "", "For each finding, indicate whether it requires follow-up or is expected after this surgery.", "", "- Heart rate 84, 92, 104, then 116 → Requires follow-up", "  a steady climb past 100 is the earliest compensatory sign of volume loss. The trap is blaming pain, which has barely changed.", "- Blood pressure 132/78 falling to 112/88 → Requires follow-up", "  systolic falls while diastolic rises, so pulse pressure narrows from 54 to 24 as vasoconstriction offsets a shrinking stroke volume.", "- Urine output 60, 35, then 20 mL/h → Requires follow-up", "  20 mL/h is below 0.5 mL/kg/h (36 mL/h for 72 kg); blood is being diverted away from the kidneys to protect the brain and heart.", "- Respiratory rate 16 rising to 22 → Requires follow-up", "  faster breathing accompanies early shock as tissues make lactate. A client using an opioid PCA would be expected to breathe slower, not faster.", "- Temperature 37.1 °C (98.8 °F) → Expected", "  a mild rise in the first 24 hours is the normal inflammatory response to surgery and does not point to bleeding or infection.", "- Scant dark red vaginal drainage on the pad → Expected", "  a small amount of vaginal bleeding is expected after hysterectomy. Bleeding here is hidden in the abdomen, so a clean pad is not reassuring.", "", "Why: Trend each value against the client's own first reading. Heart rate, respirations and diastolic pressure rise while urine output falls, which is the pattern of compensated hypovolemia. Systolic pressure is still over 110, and that is exactly why bleeding is missed when the nurse waits for hypotension.", "Tip: On trend items, compare each value with the client's first reading rather than the normal range, and ask which direction it is moving."], "st": "awaiting"}, {"id": "ngn:cs-hemorrhage-2", "hash": "56ed63fe59", "title": "Bleeding after a hysterectomy · item 2 · Select all · Analyze cues", "body": ["Refer to the chart.", "", "Which findings are consistent with a loss of circulating blood volume? Select all that apply.", "", "✓ Pulse pressure narrowing from 54 to 24", "  Yes: arterioles constrict and raise the diastolic pressure while the systolic falls; a narrowing pulse pressure is an early sign of hypovolemia.", "- SpO₂ 95% on 2 L nasal cannula", "  No: a saturation of 95% is acceptable and has changed little; it does not reflect circulating volume and is not a reliable early shock sign.", "✓ Urine output 20 mL/h", "  Yes: low kidney perfusion plus aldosterone and antidiuretic hormone release cut urine output; it is one of the most sensitive early signs of volume loss.", "✓ Heart rate 116", "  Yes: sympathetic stimulation speeds the heart to keep cardiac output up as the stroke volume falls with blood loss.", "✓ Cool, pale skin with capillary refill of 3 seconds", "  Yes: blood is shunted away from the skin to the vital organs, so the skin cools and pales before the blood pressure drops.", "- Hypoactive bowel sounds", "  No: slowed bowel activity is expected for a day or more after abdominal surgery and anesthesia; it does not indicate blood loss.", "- Midline dressing dry and intact", "  No: a dry dressing does not rule out bleeding. The trap is checking only the incision when bleeding after hysterectomy usually collects inside.", "✓ Abdomen more distended and firmer than at 13:30", "  Yes: an enlarging, firm abdomen after pelvic surgery suggests blood collecting in the abdomen or pelvis, where it cannot be seen.", "", "Why: The body defends blood pressure by speeding the heart, constricting vessels and holding on to water. That is what produces tachycardia, a narrow pulse pressure, cool skin and low urine output while the systolic pressure looks acceptable. A firm, distended abdomen tells you where the blood is going.", "Tip: For each option, ask whether the body would produce it to compensate for less volume; findings expected after any abdominal surgery are distractors."], "st": "awaiting"}, {"id": "ngn:cs-hemorrhage-3", "hash": "975fdb867d", "title": "Bleeding after a hysterectomy · item 3 · Drop-down · Prioritize hypotheses", "body": ["Refer to the chart.", "", "Complete the sentences.", "", "Blank 1:", "- early sepsis from a deep surgical site infection", "  No: infection rarely appears 5 hours after surgery, and early sepsis usually causes fever and warm skin rather than a narrowing pulse pressure.", "- opioid-induced respiratory depression", "  No: opioid toxicity slows breathing and causes sedation; she is breathing faster, restless and tachycardic.", "✓ hemorrhage progressing toward hypovolemic shock", "  Yes: rising heart rate, narrowing pulse pressure, cool skin, falling urine output and a firmer abdomen hours after pelvic surgery all point to bleeding.", "Blank 2:", "- progressive", "  No: progressive shock brings hypotension, a MAP under 65 and worsening organ dysfunction; her pressure has not fallen that far yet.", "- irreversible", "  No: irreversible shock is organ failure that no longer responds to treatment; she can still be rescued.", "✓ compensated", "  Yes: in compensated shock, tachycardia and vasoconstriction hold the systolic pressure near normal while perfusion to the skin and kidneys falls.", "Blank 3:", "✓ call the rapid response team and notify the surgeon", "  Yes: compensation can fail suddenly, so she needs a team at the bedside and the surgeon informed now.", "- recheck her vital signs in 1 hour", "  No: waiting lets her keep bleeding; by the time the systolic pressure falls she may have lost 30% or more of her blood volume.", "- encourage her to use the PCA button more often for her pain", "  No: pain does not explain this trend, and more opioid can drop her pressure and mask the restlessness of shock.", "", "Why: The cluster fits postoperative hemorrhage in compensated shock. Compensation buys time but fails abruptly, so the nurse escalates on the trend instead of waiting for hypotension. Sepsis and opioid toxicity each have features she does not have.", "Tip: When a stable client changes after surgery, name the complication that fits every cue and the timing, then escalate before the blood pressure falls."], "st": "awaiting"}, {"id": "ngn:cs-hemorrhage-4", "hash": "64620da62f", "title": "Bleeding after a hysterectomy · item 4 · Matrix · Generate solutions", "body": ["Refer to the chart.", "", "The nurse prepares for the surgeon's arrival. For each intervention, indicate whether it is anticipated or contraindicated.", "", "- Insert a second IV, 18 gauge or larger → Anticipated", "  a single 20 gauge cannot deliver fluid and blood fast enough; flow rises sharply with catheter diameter, so two large-bore lines are standard.", "- Send a type and crossmatch for packed red blood cells → Anticipated", "  her hemoglobin has dropped from 11.2 to 7.6 g/dL with ongoing signs of shock; crossmatched units should be ready before they are needed.", "- Give a 1,000 mL lactated Ringer's bolus → Anticipated", "  isotonic crystalloid supports volume while blood is prepared. Large volumes alone dilute clotting factors, so blood should follow promptly.", "- Keep her NPO for a possible return to surgery → Anticipated", "  a firm, distended abdomen with a falling hemoglobin often means a bleeding vessel that must be tied off; an empty stomach lowers aspiration risk.", "- Give the enoxaparin dose now instead of in the morning → Contraindicated", "  an anticoagulant during active bleeding worsens hemorrhage. The trap is following the clot-prevention routine when bleeding is the immediate threat.", "- Give ketorolac 30 mg IV for her abdominal pain → Contraindicated", "  ketorolac is an NSAID that impairs platelet function and kidney blood flow, both dangerous in a client who is bleeding with low urine output.", "", "Why: The plan is to restore volume and stop the bleeding: two large-bore lines, crystalloid, blood ready, and an empty stomach for surgery. Anything that impairs clotting or kidney perfusion makes things worse. A hemoglobin drop of more than 3 g/dL in hours confirms what the vital signs showed.", "Tip: For anticipated versus contraindicated items, ask whether each option helps restore volume or stop bleeding, or instead adds to the bleeding."], "st": "awaiting"}, {"id": "ngn:cs-hemorrhage-5", "hash": "0024996eb0", "title": "Bleeding after a hysterectomy · item 5 · Select all · Take action", "body": ["Refer to the chart.", "", "The first unit of packed red blood cells arrives at 17:25. Which actions should the nurse take? Select all that apply.", "", "- Warm the unit in the unit microwave to prevent hypothermia", "  No: microwaving heats unevenly and destroys red cells. When warming is needed, only an approved blood warmer is used.", "✓ Check the client's two identifiers, ABO and Rh type, unit number and expiration with a second licensed nurse at the bedside", "  Yes: bedside verification by two licensed staff is the main safeguard against an ABO mismatch, the most common cause of fatal transfusion reactions.", "- Connect the blood to the lactated Ringer's line to save a step", "  No: the calcium in lactated Ringer's can trigger clotting of the citrated blood in the tubing; textbook practice is 0.9% sodium chloride only.", "✓ Prime the blood tubing with 0.9% sodium chloride", "  Yes: normal saline is the only solution that is compatible with red cells; it does not cause clotting or hemolysis in the line.", "✓ Stay with the client for the first 15 minutes of the transfusion", "  Yes: most severe reactions, including acute hemolytic and anaphylactic reactions, appear early, so the nurse watches closely and repeats vital signs at 15 minutes.", "✓ Infuse the blood through the 18 gauge antecubital IV", "  Yes: an 18 gauge catheter lets blood run quickly without damaging red cells, which matters in a client who is actively bleeding.", "✓ Take a full set of vital signs before starting the unit", "  Yes: a baseline is needed to recognize a reaction; fever, a rising heart rate or a falling pressure are compared with the pre-transfusion values.", "- Ask the unlicensed assistive personnel to do the bedside check with you to save time", "  No: verifying blood products cannot be delegated to unlicensed staff. The trap is trading safety for speed in an emergency.", "", "Why: Urgency does not change the transfusion safety steps. Two licensed staff verify the client and the unit at the bedside, the line is primed with normal saline, and baseline vital signs come first. The nurse stays for the first 15 minutes, when most severe reactions appear.", "Tip: Transfusion items test safety rules that do not bend in an emergency; eliminate any option that skips verification, uses the wrong fluid or delegates the check."], "st": "awaiting"}, {"id": "ngn:cs-hemorrhage-6", "hash": "88ad4eb557", "title": "Bleeding after a hysterectomy · item 6 · Highlight · Evaluate outcomes", "body": ["Refer to the chart.", "", "Refer to the 22:30 nurse's note. Highlight the findings that show the client's condition has improved.", "", "✓ highlight Heart rate 94, down from 124 before surgery.", "  Yes: with the bleeding stopped and volume restored, the sympathetic drive eases and the heart no longer has to race to keep output up.", "✓ highlight BP 118/74, pulse pressure 44.", "  Yes: the pulse pressure has widened back toward her baseline of 54, showing stroke volume has recovered and vasoconstriction has relaxed.", "✓ highlight Urine output 45 mL and 50 mL over the last 2 hours.", "  Yes: output is above 0.5 mL/kg/h (36 mL/h), so the kidneys are perfused again.", "✓ highlight Skin warm and dry, capillary refill under 2 seconds.", "  Yes: blood is returning to the skin because the body no longer needs to divert it to the core organs.", "✓ highlight Lactate 1.5 mmol/L and hemoglobin 9.2 g/dL.", "  Yes: a normal lactate shows tissues are getting enough oxygen, and the hemoglobin rose as expected after 2 units with the bleeding controlled.", "- New fine crackles in both lung bases.", "  No: new crackles after 2 units of blood and 2.5 L of fluid suggest volume overload or transfusion-associated circulatory overload; notify the provider.", "- SpO₂ 91% on 2 L, was 96% at 21:30.", "  No: falling oxygenation with new crackles is a worsening finding. Raise the head of the bed, increase oxygen as ordered and report it.", "", "Why: Heart rate, pulse pressure, urine output, skin and lactate all show that perfusion has been restored. Evaluation also means catching what the treatment caused: new crackles and a falling SpO₂ after large volumes of fluid and blood point to circulatory overload. The nurse reports this and anticipates a diuretic and slower fluids.", "Tip: When evaluating, sort findings into improved, unchanged and new problems; a new problem caused by the treatment is never a sign of improvement."], "st": "awaiting"}, {"id": "ngn:cs-tbi-1", "hash": "eeb698e527", "title": "Head injury after a motorcycle crash · item 1 · Highlight · Recognize cues", "body": ["Client: 23-year-old man was admitted to the neuro ICU after a motorcycle crash with a right temporal skull fracture, a brain contusion and a small subdural hematoma", "Admission Notes 21:30: A 23-year-old man was admitted to the neuro ICU after a motorcycle crash with a right temporal skull fracture, a brain contusion and a small subdural hematoma. Neurosurgery is managing him without surgery for now. You take over his care at 22:00.", "History and Physical 21:30: 23-year-old male, motorcycle driver, no helmet, struck a car at about 40 mph at 20:10. Brief loss of consciousness at the scene per EMS. ED GCS 14. CT head: nondisplaced right temporal bone fracture, right temporal contusion, 6 mm acute right subdural hematoma, 2 mm midline shift. Neurosurgery: nonoperative management, repeat CT at 04:00 or sooner with any decline. CT cervical spine: no fracture; collar stays on until clinical clearance. Closed left distal radius fracture, splinted. No past medical history, no daily medications, no known allergies. Weight 78 kg (172 lb).", "Laboratory Results 21:20: Sodium 140 mEq/L (135 to 145). Potassium 3.9 mEq/L (3.5 to 5). Glucose 148 mg/dL (70 to 99). Serum osmolality 292 mOsm/kg (275 to 295). Hemoglobin 14.1 g/dL (13.5 to 17.5). Platelets 236,000/mm³ (150,000 to 400,000). INR 1.1 (0.8 to 1.1). Blood alcohol 90 mg/dL. Urine drug screen negative.", "Orders 22:00: Admit to neuro ICU. Neuro checks every hour: GCS, pupils, motor strength. Head of bed 30 degrees, head and neck midline. Cervical collar on. 0.9% sodium chloride at 75 mL/h. Oxygen to keep SpO₂ 94% or higher. Levetiracetam 1,000 mg IV every 12 hours for 7 days. Acetaminophen 1,000 mg IV every 6 hours as needed for pain. Fentanyl 25 mcg IV every hour as needed for severe pain. Seizure precautions. NPO. Nothing in the nose. Notify provider for a GCS drop of 2 or more, any new pupil change, SBP under 110 or over 160, or seizure.", "Flowsheet 22:00: GCS 13 (E3 V4 M6). Pupils: right 3 mm brisk, left 3 mm brisk. Moves all extremities; strength 5/5 except left wrist in splint.", "Vital Signs 22:00: T 37.2 °C (99 °F), HR 92, RR 18, BP 134/78, SpO₂ 98% on 2 L nasal cannula.", "Flowsheet 00:00: GCS 12 (E3 V3 M6). Pupils: right 3 mm brisk, left 3 mm brisk. Moves all extremities equally.", "Vital Signs 00:00: T 37.4 °C (99.3 °F), HR 84, RR 18, BP 142/76, SpO₂ 97% on 2 L nasal cannula.", "Nurses' Notes 00:00: Reports headache worsening, now 8/10. Vomited once without nausea at 23:40. Harder to rouse; opens eyes to loud voice and answers with random words. Clear, watery drainage from the right ear; on the pillowcase it dries as a blood spot with a yellow ring around it. Bruising behind the right ear. Breath smells of alcohol. Splinted left wrist: fingers warm, capillary refill under 2 seconds. Abrasions on both knees, cleaned and dressed.", "Flowsheet 02:00 (shown from item 3): GCS 9 (E2 V2 M5). Pupils: right 5 mm sluggish, left 3 mm brisk. Left arm and leg 4/5; right side 5/5.", "Vital Signs 02:00 (shown from item 3): T 37.6 °C (99.7 °F), HR 56, RR 10 and irregular with pauses, BP 178/72, SpO₂ 93% on 2 L nasal cannula.", "Nurses' Notes 02:05 (shown from item 4): Provider and neurosurgery notified of GCS 9, right pupil change and vital signs. Intensivist at bedside 02:08. Anesthesia called for intubation. Stat CT head ordered after airway secured.", "Vital Signs 02:10 (shown from item 4): HR 58, RR 10 and irregular, BP 176/70, SpO₂ 92% on 2 L nasal cannula; increased to nonrebreather mask, SpO₂ 98%.", "Nurses' Notes 02:25 (shown from item 5): Intubated at 02:22 with an orotracheal tube; placement confirmed by end-tidal CO₂ and chest x-ray. Orogastric tube placed. Propofol infusion started for sedation per protocol. Arterial blood gas: PaCO₂ 38 mm Hg, PaO₂ 142 mm Hg.", "Orders 02:30 (shown from item 5): Mannitol 20% 78 g (1 g/kg) IV over 20 minutes now. Indwelling urinary catheter; hourly urine output. Serum sodium and osmolality every 6 hours; hold repeat mannitol and notify for serum osmolality over 320 mOsm/kg. Ventilator: target PaCO₂ 35 to 40 mm Hg. Continue levetiracetam. CT head when mannitol is infusing.", "Vital Signs 02:30 (shown from item 5): T 37.6 °C (99.7 °F), HR 60, RR 16 on ventilator, BP 170/74, SpO₂ 99% on FiO₂ 0.4.", "Diagnostic Results 03:00 (shown from item 6): CT head: right subdural hematoma 7 mm (was 6 mm), midline shift 3 mm (was 2 mm), increased edema around the right temporal contusion, no new bleeding. Neurosurgery: continue medical management; repeat CT at 08:00.", "Flowsheet 04:00 (shown from item 6): Sedation paused for neuro check: GCS E3 VT M6; opens eyes to voice, squeezes hand on command. Pupils: right 4 mm brisk, left 3 mm brisk. Urine output 02:30 to 04:00: 1,150 mL.", "Vital Signs 04:00 (shown from item 6): T 38.5 °C (101.3 °F), HR 78, RR 16 on ventilator, BP 138/76, SpO₂ 99% on FiO₂ 0.4.", "Laboratory Results 04:00 (shown from item 6): Sodium 146 mEq/L (135 to 145). Potassium 3.6 mEq/L (3.5 to 5). Serum osmolality 308 mOsm/kg (275 to 295). Glucose 136 mg/dL (70 to 99). PaCO₂ 37 mm Hg.", "", "Refer to the chart.", "", "Refer to the 00:00 nurse's note. Highlight the findings that require follow-up.", "", "✓ highlight Reports headache worsening, now 8/10.", "  Yes: a headache that keeps getting worse after a head injury can mean rising intracranial pressure from an expanding bleed or swelling.", "✓ highlight Vomited once without nausea at 23:40.", "  Yes: vomiting without nausea comes from pressure on the brainstem vomiting center, a classic sign of increasing intracranial pressure.", "✓ highlight Harder to rouse; opens eyes to loud voice and answers with random words.", "  Yes: level of consciousness is the earliest and most sensitive sign of neurologic decline; his verbal score has dropped from confused to inappropriate words.", "✓ highlight Clear, watery drainage from the right ear that dries as a blood spot with a yellow ring.", "  Yes: a halo or ring sign suggests cerebrospinal fluid leaking through a skull base fracture, which raises the risk of meningitis.", "- Breath smells of alcohol.", "  No: alcohol may have explained some drowsiness on arrival, but the level falls over time. The trap is blaming worsening consciousness hours later on alcohol.", "- Splinted left wrist: fingers warm, capillary refill under 2 seconds.", "  No: warm fingers with brisk refill show good circulation below the splint; no follow-up is needed.", "- Abrasions on both knees, cleaned and dressed.", "  No: minor abrasions that are already cleaned and covered need routine care only.", "", "Why: After a head injury, any decline in consciousness, a worsening headache or vomiting without nausea suggests rising intracranial pressure. Clear drainage from the ear or nose with a halo suggests a CSF leak from a basilar skull fracture. Alcohol is a dangerous explanation to accept, because it hides a bleed that is growing.", "Tip: In neuro items, treat any change in level of consciousness as the most important cue until proven otherwise."], "st": "awaiting"}, {"id": "ngn:cs-tbi-2", "hash": "e358831188", "title": "Head injury after a motorcycle crash · item 2 · Matrix · Analyze cues", "body": ["Refer to the chart.", "", "For each finding, indicate whether it is consistent with increasing intracranial pressure, a basilar skull fracture with CSF leak, or neither.", "", "- GCS falling from 13 to 12 → Increasing intracranial pressure", "  rising pressure reduces blood flow to the cortex, so arousal and orientation fail first.", "- Worsening headache with vomiting without nausea → Increasing intracranial pressure", "  stretching of the dura and pressure on the brainstem vomiting center cause headache and vomiting that does not follow nausea.", "- Clear ear drainage that forms a yellow ring around blood → Basilar skull fracture with CSF leak", "  CSF separates from blood as it spreads on fabric, leaving a halo; it escapes through a torn dura at the skull base.", "- Bruising over the mastoid behind the right ear → Basilar skull fracture with CSF leak", "  Battle sign is blood tracking from a temporal bone fracture at the skull base; it often appears with a CSF leak from the ear.", "- Glucose 148 mg/dL → Neither", "  stress hormones after trauma raise glucose. It is monitored and controlled but does not signal rising pressure or a leak.", "- Blood alcohol 90 mg/dL → Neither", "  alcohol was in his system before the crash and will fall over time; it explains neither the leak nor the neurologic trend.", "", "Why: Two problems are developing at once. Declining consciousness, headache and vomiting point to rising intracranial pressure from the expanding bleed or swelling. The halo sign and Battle sign point to a basilar skull fracture with a CSF leak, which raises the risk of infection rather than pressure.", "Tip: Link each finding to the mechanism that produces it; when two problems coexist, sort the cues by cause before choosing a priority."], "st": "awaiting"}, {"id": "ngn:cs-tbi-3", "hash": "af4c6d5c41", "title": "Head injury after a motorcycle crash · item 3 · Drop-down · Prioritize hypotheses", "body": ["Compare the neuro checks and vital signs at 22:00, 00:00 and 02:00.", "", "Complete the sentences.", "", "Blank 1:", "✓ rising intracranial pressure with impending herniation", "  Yes: GCS 13 to 9, a dilating right pupil, left-sided weakness and changing vital signs show a right-sided lesion compressing the brain.", "- a postictal state after an unwitnessed generalized seizure", "  No: a postictal state improves over minutes to hours and does not produce a fixed one-sided pupil change with Cushing triad.", "- alcohol intoxication wearing off", "  No: as alcohol clears, alertness should improve, not decline; alcohol also does not cause one pupil to dilate.", "Blank 2:", "✓ Cushing triad, a late sign", "  Yes: the body raises systolic pressure to push blood into a compressed brain, then reflex bradycardia and brainstem breathing changes follow; herniation is near.", "- an expected effect of fentanyl", "  No: opioids can slow breathing but do not raise blood pressure or widen the pulse pressure.", "- an early sign of hypovolemic shock", "  No: hypovolemic shock causes tachycardia and a narrowing pulse pressure, the opposite of this pattern.", "Blank 3:", "- the left optic nerve", "  No: the change is on the right, the same side as the bleed; optic nerve injury affects vision, not this pattern.", "- the cervical spinal cord", "  No: the cervical spine CT was negative, and spinal cord injury does not dilate one pupil.", "✓ the right third cranial nerve from the expanding lesion", "  Yes: the oculomotor nerve is compressed on the same side as the lesion as the temporal lobe shifts; a dilated, sluggish pupil is an emergency.", "", "Why: A falling GCS is the earliest sign; pupil changes and Cushing triad are late. Hypertension with a widening pulse pressure, bradycardia and irregular respirations mean the brainstem is being compressed. The pupil on the side of the lesion dilates first, so this client needs emergency treatment now.", "Tip: On neuro trend items, order the cues from early to late: consciousness first, then pupils and motor, then Cushing triad."], "st": "awaiting"}, {"id": "ngn:cs-tbi-4", "hash": "7129bb5103", "title": "Head injury after a motorcycle crash · item 4 · Select all · Generate solutions", "body": ["Refer to the chart.", "", "Which interventions should the nurse include in the plan to prevent further increases in intracranial pressure? Select all that apply.", "", "- Insert a nasogastric tube to empty the stomach before intubation", "  No: with a basilar skull fracture, a nasal tube can pass through the fracture into the brain; gastric tubes are placed through the mouth.", "✓ Keep oxygenation adequate and carbon dioxide in the normal range after intubation", "  Yes: hypoxia worsens secondary brain injury, and high carbon dioxide dilates cerebral vessels and raises intracranial pressure.", "- Place the client in Trendelenburg position because of the low heart rate", "  No: head-down positioning blocks venous drainage from the brain and raises intracranial pressure. The bradycardia here comes from brain compression.", "✓ Space out nursing care and keep the room quiet with low light", "  Yes: repositioning, suctioning and noise each raise intracranial pressure briefly; spacing them out prevents stacked spikes.", "- Change the IV fluid to 5% dextrose in water", "  No: once the dextrose is used, free water moves into brain cells and worsens edema; isotonic or hypertonic fluids are used.", "- Hyperventilate to a PaCO₂ of 25 mm Hg for the rest of the night", "  No: prolonged deep hyperventilation constricts cerebral vessels so much that it causes ischemia; it is used only briefly as a bridge to definitive treatment.", "✓ Keep systolic BP at 110 mm Hg or higher and report any hypotension", "  Yes: cerebral perfusion pressure is mean arterial pressure minus intracranial pressure, so even one episode of hypotension starves the injured brain.", "✓ Keep the head of the bed at 30 degrees with the head and neck midline and the collar not pressing on the neck veins", "  Yes: elevation and a straight neck let venous blood drain from the brain; a tight collar or a turned head blocks the jugular veins and raises pressure.", "", "Why: Secondary brain injury comes from low pressure, low oxygen, high carbon dioxide, poor venous drainage and stimulation. The plan keeps the head up and midline, protects blood pressure and oxygenation, and minimizes stimulation. Nasal tubes are avoided with a basilar skull fracture.", "Tip: For intracranial pressure items, check each option against venous drainage, perfusion pressure, oxygen and carbon dioxide; anything that worsens one of them is a distractor."], "st": "awaiting"}, {"id": "ngn:cs-tbi-5", "hash": "23b161fa59", "title": "Head injury after a motorcycle crash · item 5 · Matrix · Take action", "body": ["Refer to the chart.", "", "For each nursing action, indicate whether it is appropriate or inappropriate at this time.", "", "- Give the mannitol through IV tubing with an in-line filter → Appropriate", "  mannitol 20% can form crystals, so it is given through a filter to keep crystals out of the bloodstream.", "- Insert the indwelling catheter and measure urine output every hour → Appropriate", "  mannitol causes a brisk osmotic diuresis; hourly output tracks its effect and warns of hypovolemia that could lower his blood pressure.", "- Suction the endotracheal tube every hour for 30 seconds → Inappropriate", "  suctioning raises intracranial pressure; suction only when needed, for no more than 10 seconds, after preoxygenating.", "- Pack the right ear canal with gauze to stop the drainage → Inappropriate", "  blocking the leak traps fluid and bacteria at the fracture and raises meningitis risk; a loose sterile pad over the ear is used instead.", "- Pad the side rails and keep oxygen and suction ready at the bedside → Appropriate", "  seizures are common after a contusion and sharply raise intracranial pressure; precautions limit injury and prepare for airway support.", "- Hold the levetiracetam dose until the CT is done → Inappropriate", "  seizures increase brain metabolism and pressure, so the anticonvulsant is given on schedule; a scan is not a reason to miss it.", "", "Why: Osmotic therapy pulls water out of the brain, so the nurse gives it safely and tracks urine output and osmolality. Care is organized to avoid pressure spikes from suctioning and seizures. The CSF leak is left to drain onto a loose sterile dressing, never packed.", "Tip: For each action, ask whether it lowers or raises intracranial pressure, or adds infection risk; reject any that raises either."], "st": "awaiting"}, {"id": "ngn:cs-tbi-6", "hash": "e144a33441", "title": "Head injury after a motorcycle crash · item 6 · Select all · Evaluate outcomes", "body": ["Refer to the chart.", "", "Which findings indicate that the interventions to lower intracranial pressure have been effective? Select all that apply.", "", "✓ Heart rate 78, up from 56", "  Yes: the reflex bradycardia of Cushing triad has resolved, showing less pressure on the brainstem.", "✓ Right pupil 4 mm and brisk, was 5 mm and sluggish", "  Yes: less compression of the third cranial nerve lets the pupil react again; this is a key sign herniation has been reversed.", "✓ Opens eyes to voice and squeezes hand on command during the sedation pause", "  Yes: following commands is the best motor score and shows the cortex is perfused, an improvement over localizing to pain.", "- Serum osmolality 308 mOsm/kg", "  No: this confirms the drug's osmotic effect and that a repeat dose is still allowed (under 320), but it is a safety check, not a treatment outcome.", "- Urine output 1,150 mL over 90 minutes", "  No: brisk diuresis shows mannitol is acting as an osmotic diuretic, not that intracranial pressure fell; it also raises the risk of hypovolemia and hypotension.", "✓ BP 138/76, with the pulse pressure narrowing from 106 to 62", "  Yes: the body no longer has to drive systolic pressure up to perfuse the brain, a sign intracranial pressure has fallen.", "- Temperature 38.5 °C (101.3 °F)", "  No: fever raises brain metabolism and intracranial pressure. It needs prompt treatment and a search for a cause, such as meningitis from the CSF leak.", "", "Why: Effectiveness is judged by the brain's response: a better GCS, a reactive pupil and resolution of Cushing triad. Diuresis and a higher osmolality show the drug is acting, not that the brain improved. The new fever must be treated quickly, because it raises intracranial pressure and may signal infection from the CSF leak.", "Tip: Separate signs that a drug is acting from signs that the client's problem is improving; only the second answers an evaluate item."], "st": "awaiting"}]}, "packs": [{"id": "drill-med-1", "title": "Drills: Med Pass, part 1 of 2", "sub": "What to check before a medication, then give, hold or call. A pharmacist is especially welcome.", "n": 25, "reviewed": 0, "changed": 0}, {"id": "drill-med-2", "title": "Drills: Med Pass, part 2 of 2", "sub": "What to check before a medication, then give, hold or call. A pharmacist is especially welcome.", "n": 25, "reviewed": 0, "changed": 0}, {"id": "drill-first-1", "title": "Drills: Who's First, part 1 of 2", "sub": "Four patients, one nurse: who do you see first, and why not the others.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "drill-first-2", "title": "Drills: Who's First, part 2 of 2", "sub": "Four patients, one nurse: who do you see first, and why not the others.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "drill-sbar", "title": "Drills: SBAR", "sub": "Building a call to the provider line by line, and the order that comes back.", "n": 20, "reviewed": 0, "changed": 0}, {"id": "drill-calm", "title": "Drills: De-escalation", "sub": "What to say to an agitated patient, turn by turn. Psych or ED experience fits best.", "n": 22, "reviewed": 0, "changed": 0}, {"id": "ngn-shift-1", "title": "NCLEX questions after each shift, part 1 of 3", "sub": "Five per shift, including the two harder NCLEX challenge items.", "n": 19, "reviewed": 0, "changed": 0}, {"id": "ngn-shift-2", "title": "NCLEX questions after each shift, part 2 of 3", "sub": "Five per shift, including the two harder NCLEX challenge items.", "n": 19, "reviewed": 0, "changed": 0}, {"id": "ngn-shift-3", "title": "NCLEX questions after each shift, part 3 of 3", "sub": "Five per shift, including the two harder NCLEX challenge items.", "n": 17, "reviewed": 0, "changed": 0}, {"id": "bank-ms-1", "title": "NCLEX question bank: Medical-surgical, part 1 of 3", "sub": "68 standalone practice questions.", "n": 23, "reviewed": 0, "changed": 0}, {"id": "bank-ms-2", "title": "NCLEX question bank: Medical-surgical, part 2 of 3", "sub": "68 standalone practice questions.", "n": 23, "reviewed": 0, "changed": 0}, {"id": "bank-ms-3", "title": "NCLEX question bank: Medical-surgical, part 3 of 3", "sub": "68 standalone practice questions.", "n": 22, "reviewed": 0, "changed": 0}, {"id": "bank-ed", "title": "NCLEX question bank: Emergency", "sub": "23 standalone practice questions.", "n": 23, "reviewed": 0, "changed": 0}, {"id": "bank-comm", "title": "NCLEX question bank: Community and fundamentals", "sub": "21 standalone practice questions.", "n": 21, "reviewed": 0, "changed": 0}, {"id": "bank-icu", "title": "NCLEX question bank: Critical care", "sub": "21 standalone practice questions.", "n": 21, "reviewed": 0, "changed": 0}, {"id": "bank-sd", "title": "NCLEX question bank: Cardiac and step-down", "sub": "19 standalone practice questions.", "n": 19, "reviewed": 0, "changed": 0}, {"id": "bank-peds", "title": "NCLEX question bank: Pediatrics", "sub": "17 standalone practice questions.", "n": 17, "reviewed": 0, "changed": 0}, {"id": "bank-ob", "title": "NCLEX question bank: Obstetrics and newborn", "sub": "15 standalone practice questions.", "n": 15, "reviewed": 0, "changed": 0}, {"id": "bank-psy", "title": "NCLEX question bank: Psychiatric", "sub": "11 standalone practice questions.", "n": 11, "reviewed": 0, "changed": 0}, {"id": "bank-periop", "title": "NCLEX question bank: Perioperative", "sub": "7 standalone practice questions.", "n": 7, "reviewed": 0, "changed": 0}, {"id": "cases-1", "title": "Case studies: Pneumonia that turns septic; Heart failure that tips over; New diabetes in DKA", "sub": "Unfolding case studies: one client, six questions in clinical judgment order.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "cases-2", "title": "Case studies: Hip replacement with a clot that travels; Variceal bleed in cirrhosis; Stroke alert in the ED", "sub": "Unfolding case studies: one client, six questions in clinical judgment order.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "cases-3", "title": "Case studies: Preeclampsia that turns severe; Infant with gastroenteritis and dehydration; House fire with inhalation injury", "sub": "Unfolding case studies: one client, six questions in clinical judgment order.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "cases-4", "title": "Case studies: Ankle fracture that turns into alcohol withdrawal; Stomach bug that ends in hyperkalemia; New antibiotic that triggers serotonin syndrome", "sub": "Unfolding case studies: one client, six questions in clinical judgment order.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "cases-5", "title": "Case studies: COPD flare with pneumonia; Bleeding after a hysterectomy; Head injury after a motorcycle crash", "sub": "Unfolding case studies: one client, six questions in clinical judgment order.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "cases-6", "titl
