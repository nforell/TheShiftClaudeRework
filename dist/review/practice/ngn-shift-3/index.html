<style>
:root{--bg:#E6EDF0;--surface:#FBFCFC;--surface-2:#EDF2F4;--ink:#152238;--ink-2:#4D5A6F;--line:#CAD5DB;--teal:#2449A8;--teal-ink:#fff;--red:#B3342B;--red-bg:#F8E1DE;--good:#2B7249;--good-bg:#E0F0E6;--amber:#A96C0E;--amber-bg:#FBEFD6;
  --serif:"Barlow Condensed","Arial Narrow",sans-serif;--sans:"Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161C;--surface:#1A1F27;--surface-2:#212833;--ink:#E7E4DB;--ink-2:#A0A5AE;--line:#343C48;--teal:#93B4E4;--teal-ink:#0F1B2C;--red:#F0766B;--red-bg:#3b1d1b;--good:#72c692;--good-bg:#16301f;--amber:#E9AE4E;--amber-bg:#35291a}}
:root[data-theme="dark"]{--bg:#12161C;--surface:#1A1F27;--surface-2:#212833;--ink:#E7E4DB;--ink-2:#A0A5AE;--line:#343C48;--teal:#93B4E4;--teal-ink:#0F1B2C;--red:#F0766B;--red-bg:#3b1d1b;--good:#72c692;--good-bg:#16301f;--amber:#E9AE4E;--amber-bg:#35291a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
main{max-width:52rem;margin:0 auto;padding:clamp(1.2rem,5vw,3rem) 16px calc(5rem + env(safe-area-inset-bottom))}
a{color:var(--teal)}
.home{font-family:var(--serif);font-weight:700;font-size:1.1rem;letter-spacing:.04em;text-transform:uppercase;background:var(--ink);color:var(--bg);padding:.28em .55em .22em;border-radius:2px;text-decoration:none}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.9rem,6vw,2.6rem);line-height:1.1;letter-spacing:0;margin:1.6rem 0 .3rem}
h2{font-size:1.15rem;margin:2.4rem 0 .6rem}
h3{font-size:1rem;margin:0}
p{margin:.5rem 0}
.muted{color:var(--ink-2)}
.meta{display:flex;flex-wrap:wrap;gap:.4rem .6rem;margin-top:.6rem}
.chip{display:inline-flex;align-items:center;padding:.15em .6em;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--surface-2);border:1px solid var(--line)}
.chip.awaiting{background:var(--amber-bg);border-color:transparent;color:var(--amber)}
.chip.reviewed{background:var(--good-bg);border-color:transparent;color:var(--good)}
.chip.changed{background:var(--red-bg);border-color:transparent;color:var(--red)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem 1.1rem;margin:.8rem 0}
.how ol{margin:.4rem 0 0;padding-left:1.2rem}.how li{margin:.2rem 0}
label{display:block;font-weight:600;font-size:.9rem;margin:.7rem 0 .25rem}
input[type=text],input[type=email],textarea,select{width:100%;min-height:44px;padding:.5em .7em;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:5rem;resize:vertical}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:0 1rem}
details.pt{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:.6rem 0}
details.pt>summary{cursor:pointer;padding:.85rem 1rem;font-weight:600;list-style-position:inside}
details.pt>div{padding:0 1rem 1rem}
table{width:100%;border-collapse:collapse;font-size:.88rem;margin:.4rem 0}
th,td{text-align:left;vertical-align:top;padding:.35rem .5rem .35rem 0;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--ink-2);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
.scroll{overflow-x:auto}
ul.plain{margin:.3rem 0;padding-left:1.1rem}
.dec{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:.85rem 1rem;margin:.6rem 0}
.dec.pos{border-left-color:var(--good)}.dec.neg{border-left-color:var(--red)}
.dec .top{display:flex;flex-wrap:wrap;gap:.3rem .5rem;align-items:center;font-size:.78rem;color:var(--ink-2);font-weight:600}
.pts{font-weight:700;padding:.05em .45em;border-radius:4px;background:var(--surface-2)}
.pos .pts{color:var(--good);background:var(--good-bg)}.neg .pts{color:var(--red);background:var(--red-bg)}
.dec b{display:block;margin:.35rem 0 .15rem;font-size:1rem}
.dec .why{font-family:var(--sans);color:var(--ink-2);margin:0}
.dec .src{font-size:.75rem;color:var(--ink-2);margin-top:.35rem}
.verdict{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.7rem}
.verdict button{min-height:40px;padding:.35em .9em;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer}
.verdict button[aria-pressed="true"][data-v="ok"]{background:var(--good);border-color:var(--good);color:var(--teal-ink)}
.verdict button[aria-pressed="true"][data-v="fix"]{background:var(--red);border-color:var(--red);color:var(--teal-ink)}
.verdict button[aria-pressed="true"][data-v="unsure"]{background:var(--amber);border-color:var(--amber);color:var(--teal-ink)}
.dec textarea{margin-top:.5rem;min-height:3.6rem}
.opt{padding:.4rem 0;border-bottom:1px solid var(--line);font-size:.92rem}.opt:last-child{border:0}
.opt i{font-style:normal;font-weight:700;font-size:.75rem;padding:.05em .4em;border-radius:4px;margin-right:.4rem;background:var(--surface-2)}
.bar{position:sticky;top:0;z-index:5;margin:0 -16px;padding:.6rem 16px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:.6rem;font-size:.9rem}
.bar .prog{display:block;flex:1;min-width:4rem;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;max-width:12rem}.bar .prog i{display:block;height:100%;background:var(--teal)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:.55em 1.2em;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn-primary{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.row{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1rem}
.check{display:flex;gap:.6rem;align-items:flex-start;font-weight:500;margin-top:1rem}
.check input{width:1.2rem;height:1.2rem;margin-top:.2rem;flex:none}
.msg{margin-top:.8rem;font-weight:600}.msg.err{color:var(--red)}.msg.ok{color:var(--good)}
pre{white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:.8rem;font-size:.8rem;max-height:18rem;overflow:auto}
.shifts a{display:block;text-decoration:none;color:inherit}
.shifts .card:hover{border-color:var(--ink-2)}
</style>
<style>.item .body p{margin:.15rem 0}.item .body .why{color:var(--ink-2);font-size:.92rem;margin:0 0 .35rem 1.1rem}.item .body .ok b{display:inline;margin:0;color:var(--good)}.item .body .no{color:var(--ink)}.item .body .sp{height:.5rem}.item>b{margin-bottom:.5rem}</style></head>

t sounds now muffled.", "  Yes: Fluid around the heart muffles the sounds.", "- Temperature 37.6.", "  No: A low-grade temperature is common after bypass.", "- Glucose 168 on an insulin infusion.", "  No: Within the usual post-op target.", "- Pacing wires capped and dry.", "  No: Normal.", "", "Why: Tamponade after heart surgery: falling chest tube output, rising CVP, hypotension with narrow pulse pressure, muffled heart sounds. It may need a return to the OR.", "Tip: A number that \"improves\" (less drainage) can be the warning sign. Ask why it changed."], "st": "awaiting"}, {"id": "ngn:icu-ch2", "hash": "900d7e42b8", "title": "icu-3w-1 · Vasopressor extravasation · NCLEX challenge · Take action", "body": ["Norepinephrine is running through a forearm peripheral IV. The site is cold, pale and hard.", "", "Complete the sentences.", "", "Blank 1:", "- slow the infusion", "  No: Any more norepinephrine in the tissue worsens the injury.", "- flush the IV with saline", "  No: Flushing pushes more drug into the tissue.", "✓ stop the infusion", "  Yes: Stop more drug going into the tissue.", "Blank 2:", "- protamine", "  No: Protamine reverses heparin.", "✓ phentolamine", "  Yes: Phentolamine reverses the vasoconstriction that kills tissue.", "- hyaluronidase", "  No: Hyaluronidase is for some other extravasations, not vasopressors.", "Blank 3:", "✓ subcutaneously around the site", "  Yes: It's infiltrated into the affected tissue.", "- by mouth", "  No: It has to reach the tissue directly.", "- IV through the same catheter", "  No: It's given into the tissue, not systemically through the IV.", "Blank 4:", "✓ a central line", "  Yes: Vasopressors belong in a central line, or a large, well-placed peripheral IV only briefly with close checks.", "- the same IV after flushing", "  No: The line has failed.", "- a new IV in the same arm", "  No: Same arm, same risk, and the arm is already injured.", "", "Why: Vasopressor extravasation: stop, aspirate, phentolamine around the site, mark and monitor the area, and move the drip to a central line.", "Tip: For drug-specific antidotes, match the antidote to how the drug causes harm (here, vasoconstriction)."], "st": "awaiting"}, {"id": "ngn:ld-mat", "hash": "e161be7b12", "title": "ld-2s-1 · Matrix · Analyze cues", "body": ["The nurse is reviewing fetal heart rate tracings for clients in labor on continuous electronic fetal monitoring.", "", "For each tracing, indicate its NICHD category.", "", "- Baseline 135, moderate variability, accelerations, early decelerations → Category I", "  Normal baseline, moderate variability, and only early decelerations (head compression) make a Category I, normal tracing.", "- Baseline 150, minimal variability, recurrent late decelerations → Category II", "  Recurrent lates with minimal (not absent) variability are Category II: indeterminate, needing intrauterine resuscitation and close watching.", "- Baseline 140, absent variability, recurrent late decelerations → Category III", "  Absent variability with recurrent late decelerations is Category III: abnormal, and delivery is expected if it doesn't resolve quickly.", "- A smooth, regular, wavelike sinusoidal pattern → Category III", "  A sinusoidal pattern suggests severe fetal anemia or hypoxia and is Category III on its own.", "- Baseline 170, moderate variability, no decelerations → Category II", "  Fetal tachycardia (over 160) is outside Category I even with good variability; think maternal fever or infection.", "- Baseline 125, moderate variability, intermittent variable decelerations → Category II", "  Category I allows no variable or late decelerations, so intermittent variables with moderate variability are Category II.", "", "Why: Category I needs everything normal: baseline 110 to 160, moderate variability, and no late or variable decelerations. Category III is absent variability with recurrent lates, recurrent variables or bradycardia, or a sinusoidal pattern. Everything in between is Category II. Moderate variability is the best single sign that the baby is not acidotic.", "Tip: Classify by the worst feature: start with variability, then the type and timing of decelerations, then the baseline."], "st": "awaiting"}, {"id": "ngn:ld-bow", "hash": "93ba0cd2da", "title": "ld-2s-1 · Bowtie · Prioritize hypotheses", "body": ["A 33-year-old client at 38 weeks is in a trial of labor after one prior low transverse cesarean. She suddenly reports severe, constant abdominal pain \"different from the contractions.\" The toco shows contractions have stopped, the fetal head is no longer felt at 0 station, the fetal heart rate has been 70 for 3 minutes, and there is new vaginal bleeding. Maternal HR 118, BP 98/60.", "", "Complete the diagram: the condition the client is most likely experiencing, two actions the nurse should take, and two parameters to monitor.", "", "Condition:", "- Epidural-related hypotension", "  No: Epidural hypotension can drop the fetal heart rate, but it doesn't cause severe constant pain, bleeding or loss of station, and she has no epidural.", "✓ Uterine rupture", "  Yes: A scarred uterus, sudden constant pain, contractions that stop, loss of station, fetal bradycardia and maternal tachycardia are the classic picture of rupture.", "- Normal transition in labor", "  No: Transition is intense, but contractions keep coming and the baby keeps descending. Stopped contractions with lost station are never normal.", "- Placental abruption", "  No: Abruption also causes pain and bleeding, but contractions continue or the uterus is rigid; the baby doesn't move back up out of the pelvis.", "Actions to take:", "✓ Call the obstetrician and the OR team for an emergency cesarean", "  Yes: Rupture is fixed by delivery and repair; every minute of fetal bradycardia matters, so the call is STAT for the OR.", "- Increase the oxytocin to strengthen the contractions", "  No: Oxytocin is contraindicated in a suspected rupture; it would worsen bleeding and the tear.", "✓ Start a second large-bore IV and send a type and crossmatch", "  Yes: She can bleed fast into her abdomen. Two large-bore IVs and blood in the room prepare for hemorrhage.", "- Reposition her and wait 10 minutes for the heart rate to recover", "  No: Waiting for recovery works for some decelerations, not for rupture. The bradycardia won't recover until the baby is delivered.", "- Give IV fentanyl for the breakthrough pain", "  No: Treating the pain as breakthrough pain is the classic trap; it delays the diagnosis while the baby is without oxygen.", "Parameters to monitor:", "✓ Fetal heart rate", "  Yes: The fetal heart rate shows how the baby is tolerating every minute until delivery.", "- Deep tendon reflexes", "  No: Reflexes are monitored with magnesium sulfate, not for uterine rupture.", "✓ Maternal heart rate and blood pressure", "  Yes: Rising heart rate and falling pressure track hidden blood loss into the abdomen.", "- Urine ketones", "  No: Ketones reflect hydration and energy use in labor, not a surgical emergency.", "- Cervical dilation", "  No: Cervical exams don't change management once rupture is suspected and can delay the move to the OR.", "", "Why: A prior cesarean, sudden constant pain, contractions that stop, loss of fetal station, fetal bradycardia and signs of maternal blood loss are uterine rupture. Delivery is the treatment and minutes matter, so the call is STAT for a cesarean, with access and blood ready. Watch the baby's heart rate and the mother's hemodynamics until she's in the OR.", "Tip: In TOLAC questions, sudden pain plus loss of station or stopped contractions points to rupture; choose the option that gets the baby delivered fastest."], "st": "awaiting"}, {"id": "ngn:ld-sata", "hash": "2da8c7585d", "title": "ld-2s-1 · Select all · Take action", "body": ["A 29-year-old client is being induced with oxytocin at 8 milliunits/min. The strip shows 6 contractions in 10 minutes averaged over 30 minutes and recurrent late decelerations with minimal variability. The order set says to increase oxytocin by 2 milliunits/min every 30 minutes until contractions are adequate.", "", "Which actions should the nurse take? Select all that apply.", "", "- Increase the oxytocin to 10 milliunits/min per the order set", "  No: An order to increase never applies while the tracing is abnormal; more oxytocin means more contractions and less recovery time.", "✓ Give an IV fluid bolus as ordered", "  Yes: A fluid bolus improves maternal circulating volume and uteroplacental perfusion.", "✓ Stop the oxytocin infusion", "  Yes: Stopping the oxytocin lets the uterus relax so the placenta can refill between contractions.", "- Apply oxygen by face mask as routine intrauterine resuscitation", "  No: Current ACOG guidance doesn't support routine maternal oxygen for intrauterine resuscitation; it's reserved for maternal hypoxia.", "✓ Turn her to a lateral position", "  Yes: Lateral positioning takes the uterus off the vena cava and improves blood flow to the placenta.", "✓ Notify the provider of the tachysystole and the tracing", "  Yes: The provider needs to know about tachysystole with an abnormal tracing; terbutaline may be ordered if it persists.", "- Place her supine with her legs elevated", "  No: Supine positioning compresses the vena cava and worsens placental perfusion; lateral is the position for resuscitation.", "", "Why: Tachysystole with late decelerations means the placenta can't refill between contractions. Stop the oxytocin, turn her to her side, give fluid, and tell the provider; terbutaline is next if it persists. An order to increase never applies while the tracing is abnormal.", "Tip: For oxytocin and an abnormal strip, remember the order: stop the drug, turn her, give fluid, tell the provider."], "st": "awaiting"}, {"id": "ngn:ld-ch1", "hash": "e6db1a3c0c", "title": "ld-2s-1 · Uterine rupture · NCLEX challenge · Recognize cues", "body": ["Labor note for a 33-year-old attempting vaginal birth after a previous cesarean. Epidural placed 3 hours ago with good relief.", "", "Highlight the findings that need immediate follow-up.", "", "✓ highlight Sudden sharp abdominal pain that continues between contractions, breaking through the epidural.", "  Yes: Pain through a working epidural is a red flag for rupture.", "✓ highlight Fetal heart rate in the 80s for the last 4 minutes.", "  Yes: Prolonged bradycardia is the most common sign of rupture.", "✓ highlight The fetal head, previously at +1 station, is now at -2.", "  Yes: Loss of station means the baby has moved back through the tear.", "✓ highlight Contractions have stopped.", "  Yes: A ruptured uterus can't contract normally.", "- Cervix 7 cm.", "  No: Expected labor progress.", "- GBS negative.", "  No: Not related.", "- Temperature 37.4.", "  No: Normal.", "", "Why: Uterine rupture during a trial of labor after cesarean: sudden pain (even through an epidural), fetal bradycardia, loss of station and stopped contractions. It's a surgical emergency for both.", "Tip: In obstetrics, sudden changes in the fetal heart rate plus new maternal pain point to an emergency. \"Contractions stopped\" is not good news in labor."], "st": "awaiting"}, {"id": "ngn:ld-ch2", "hash": "51d37a7d8e", "title": "ld-2s-1 · Intraamniotic infection · NCLEX challenge · Analyze cues", "body": ["A 26-year-old in labor has had ruptured membranes for 20 hours.", "", "Which findings support intraamniotic infection (chorioamnionitis)? Select all that apply.", "", "✓ Maternal temperature 39.1", "  Yes: Maternal fever is the main criterion.", "- Fetal heart rate baseline 135 with moderate variability", "  No: A reassuring tracing.", "✓ Fetal heart rate baseline 170", "  Yes: Fetal tachycardia often accompanies maternal infection.", "- Maternal heart rate 72", "  No: Normal. Maternal tachycardia would support infection.", "- Clear amniotic fluid", "  No: Clear fluid is normal.", "✓ Foul-smelling, cloudy amniotic fluid", "  Yes: Purulent or foul fluid supports infection.", "✓ Uterine tenderness between contractions", "  Yes: A tender uterus supports the diagnosis.", "", "Why: Intraamniotic infection: maternal fever with fetal tachycardia, foul or purulent fluid, or uterine tenderness. Long rupture of membranes raises the risk. Treat with antibiotics and plan for the newborn.", "Tip: Select-all items reward the full set. Each pick that's wrong cancels one that's right, so don't guess on the borderline ones."], "st": "awaiting"}, {"id": "ngn:ob-bow", "hash": "8e6cfe239d", "title": "ob-2n-1 · Bowtie · Prioritize hypotheses", "body": ["A client is 2.5 hours after a vaginal birth that followed a 20-hour oxytocin induction; the newborn weighed 4.3 kg. She has not voided since birth. The fundus is boggy, 2 cm above the umbilicus and deviated to the right. Her pad is saturated in 30 minutes. HR 104, BP 112/68. She has asthma.", "", "Complete the diagram: the condition the client is most likely experiencing, two actions the nurse should take first, and two parameters to monitor.", "", "Condition:", "✓ Postpartum hemorrhage from uterine atony", "  Yes: A boggy, high fundus with heavy bleeding and rising heart rate after a long oxytocin induction and a macrosomic baby points to atony, worsened by a full bladder.", "- Amniotic fluid embolism", "  No: Amniotic fluid embolism presents with sudden respiratory distress, hypotension, hypoxia and coagulopathy, usually during or right after birth, not a boggy fundus with steady bleeding.", "- Normal lochia rubra", "  No: Rubra lochia is expected, which is the trap, but saturating a pad in 30 minutes with a boggy fundus and tachycardia is excessive bleeding, not normal flow.", "- Retained placental fragments only", "  No: Retained fragments can cause hemorrhage, but a boggy uterus displaced by an unemptied bladder after classic atony risk factors fits atony; the word only makes it too narrow.", "Actions to take:", "- Apply an ice pack to the perineum", "  No: Perineal ice treats swelling and pain from perineal trauma; it does nothing for uterine bleeding.", "- Give carboprost 250 mcg IM", "  No: Carboprost is a second-line uterotonic, so it can look correct, but it causes bronchospasm and is contraindicated in asthma; also massage and bladder emptying come first.", "✓ Massage the fundus while supporting the lower uterine segment", "  Yes: Fundal massage stimulates the myometrium to contract and compress bleeding vessels; supporting the lower segment prevents uterine inversion.", "✓ Empty the bladder (catheterize if she cannot void)", "  Yes: A distended bladder pushes the uterus up and to the side and prevents contraction; emptying it often firms the fundus quickly.", "- Encourage her to rest flat and recheck in an hour", "  No: Rest and recheck delays care during active hemorrhage; her heart rate is already rising, a sign of compensation before blood pressure falls.", "Parameters to monitor:", "- Blood glucose", "  No: Blood glucose matters for the macrosomic newborn and diabetic mothers, but it does not track her hemorrhage.", "✓ Fundal tone and position", "  Yes: Trending firmness, height and midline position shows whether massage and bladder emptying are working or atony is recurring.", "✓ Quantitative blood loss (weighed pads)", "  Yes: Weighing pads and linens gives quantitative blood loss, which is more accurate than visual estimates and guides escalation.", "- Urine specific gravity", "  No: Specific gravity reflects hydration and is not a meaningful real-time measure of bleeding or uterine tone.", "- Deep tendon reflexes", "  No: Deep tendon reflexes are monitored for magnesium therapy, not postpartum hemorrhage.", "", "Why: A full bladder displaces the uterus and keeps it from contracting. Massage and emptying the bladder are first; uterotonics follow. Carboprost causes bronchospasm in asthma. Weighing pads (1 g = 1 mL) and trending the fundus show whether it's working.", "Tip: With a boggy, displaced fundus, the first actions are hands-on nursing measures (massage, empty the bladder) before medications, and always check a uterotonic against the client's history."], "st": "awaiting"}, {"id": "ngn:ob-mat", "hash": "ff647f91f0", "title": "ob-2n-1 · Matrix · Recognize cues", "body": ["A client with preeclampsia with severe features is receiving magnesium sulfate 2 g/h. The nurse reviews this morning's findings.", "", "For each finding, indicate whether it is expected on magnesium or requires immediate follow-up.", "", "- Feels warm and flushed → Expected", "  Vasodilation from magnesium.", "- Urine output 20 mL/h for 3 hours → Requires follow-up", "  Magnesium is cleared by the kidneys; oliguria lets it accumulate.", "- Patellar reflexes absent → Requires follow-up", "  Loss of reflexes is the first sign of toxicity: stop the infusion.", "- Drowsy but easy to rouse → Expected", "  Mild sedation is common.", "- Respiratory rate 10 → Requires follow-up", "  Respiratory depression: stop the infusion and give calcium gluconate.", "- Serum magnesium 6.0 mg/dL → Expected", "  Within the therapeutic range (about 4.8 to 8.4 mg/dL).", "", "Why: Hourly checks catch toxicity in order: reflexes fade first, then breathing slows, then the heart. Urine output tells you whether the level is about to climb.", "Tip: Sort magnesium findings into expected side effects (flushing, warmth, mild drowsiness) versus toxicity in order (lost reflexes, slowed breathing, then cardiac effects), and treat low urine output as a warning that the level will rise."], "st": "awaiting"}, {"id": "ngn:ob-cloze", "hash": "b65726fe19", "title": "ob-2n-1 · Drop-down · Generate solutions", "body": ["A 6-hour-old, 4.45 kg newborn of a mother with insulin-treated gestational diabetes has a heel-stick glucose of 38 mg/dL. He has no symptoms.", "", "Complete the sentences.", "", "Blank 1:", "- 0.5 mL", "  No: 0.5 mL is the per-kilogram dose, a trap for anyone who forgets to multiply by the weight; it would underdose this baby.", "- 4.5 mL", "  No: 4.5 mL comes from using the weight itself as the volume, giving about double the correct 0.5 mL/kg dose.", "✓ 2.2 mL", "  Yes: The gel dose is 0.5 mL/kg, and 0.5 mL times 4.45 kg is about 2.2 mL.", "Blank 2:", "- give IV fluids", "  No: IV dextrose is for symptomatic newborns or those who do not respond to gel and feeding; an asymptomatic baby starts with gel and a feed.", "✓ feed the baby", "  Yes: Gel raises glucose only briefly; feeding supplies sustained carbohydrate and is part of standard management for asymptomatic hypoglycemia.", "- keep him NPO", "  No: Keeping him NPO removes the main source of glucose and would let the level fall again once the gel wears off.", "Blank 3:", "- 10 minutes", "  No: Ten minutes is too soon for the gel and feeding to take full effect, so the result would not reflect the response.", "✓ 1 hour", "  Yes: Rechecking within about an hour of the gel and feed shows whether the intervention worked and decides whether to repeat it or escalate.", "- 4 hours", "  No: Four hours is too long to wait after treating a low glucose; a persistent low could cause neurologic injury in that time.", "Blank 4:", "- hungry", "  No: Hunger is a normal newborn cue to feed, not a sign of worsening hypoglycemia.", "- pink and alert", "  No: Pink and alert describes a well newborn, a reassuring finding, not a reason to call.", "✓ jittery or lethargic", "  Yes: Jitteriness, lethargy, poor feeding, apnea or seizures signal symptomatic hypoglycemia, which needs IV dextrose and immediate provider notification.", "", "Why: Gel is 0.5 mL/kg (200 mg/kg). It raises glucose briefly; feeding keeps it up. The 1-hour recheck decides the next step. Symptoms mean IV dextrose is needed.", "Tip: For weight-based newborn doses, multiply the per-kg dose by the weight in kg and watch for distractors that use the per-kg number or the weight itself as the answer."], "st": "awaiting"}, {"id": "ngn:ob-ch1", "hash": "5e3fc9f3a9", "title": "ob-2n-1 · Newborn hypoglycemia · NCLEX challenge · Take action", "body": ["A 4.4 kg infant of a mother with diabetes is 2 hours old and asymptomatic. Glucose 22 mg/dL. The mother wants to breastfeed only.", "", "Complete the sentences.", "", "Blank 1:", "- start IV dextrose", "  No: IV dextrose is for symptomatic infants or when gel and feeding fail.", "✓ give 40% dextrose gel to the inner cheek and help her breastfeed", "  Yes: For an asymptomatic infant, oral dextrose gel plus a feed raises glucose and supports breastfeeding.", "- give formula by bottle", "  No: It may be used later, but it isn't first-line for this mother's goals and an asymptomatic infant.", "Blank 2:", "- 12 hours", "  No: Far too long.", "✓ 30 to 60 minutes", "  Yes: Recheck soon after treatment to make sure it worked.", "- 4 hours", "  No: Too long for a low glucose.", "Blank 3:", "- pink and alert", "  No: That's reassuring.", "✓ jittery, limp, or has a seizure", "  Yes: Symptoms mean the brain is short on glucose; IV dextrose is needed.", "- hungry", "  No: Expected.", "", "Why: Infants of diabetic mothers make extra insulin and drop their glucose after birth. Asymptomatic lows are treated with dextrose gel and feeding; symptomatic lows need IV dextrose.", "Tip: Match the treatment to whether the infant has symptoms. Symptoms change the urgency."], "st": "awaiting"}, {"id": "ngn:ob-ch2", "hash": "f4949ee575", "title": "ob-2n-1 · Postpartum findings · NCLEX challenge · Analyze cues", "body": ["The nurse reviews findings for clients on postpartum day 2.", "", "For each finding, indicate whether it is expected or should be reported.", "", "- Fundus firm, 2 cm below the umbilicus → Expected", "  The uterus descends about 1 cm a day.", "- Lochia rubra, moderate → Expected", "  Red lochia is normal for the first 3 to 4 days.", "- Saturating a pad in an hour → Report", "  That's heavy bleeding.", "- BP 158/104 with a headache → Report", "  Possible postpartum preeclampsia with severe features.", "- Cramping during breastfeeding → Expected", "  Oxytocin from breastfeeding contracts the uterus.", "- One calf red, warm and swollen → Report", "  Possible DVT; postpartum clients are at high risk.", "", "Why: Know what's normal for each postpartum day, so the abnormal stands out: heavy bleeding, high blood pressure with symptoms, and signs of a clot.", "Tip: \"Report\" means outside the expected range for that day, not just uncomfortable."], "st": "awaiting"}, {"id": "ngn:pd-bow", "hash": "448e2d5788", "title": "peds-5s-1 · Bowtie · Prioritize hypotheses", "body": ["An 8-year-old with an asthma exacerbation was wheezing loudly an hour ago. Now her chest is quiet. RR 36, SpO₂ 89%, deep retractions, and she can say only two words at a time.", "", "Complete the diagram.", "", "Condition:", "- Upper airway foreign body", "  No: A foreign body can cause sudden distress, but this child has a known exacerbation that progressed from wheezing to a silent chest, which fits worsening asthma.", "- Improving asthma", "  No: Loss of wheezing looks like improvement, which is the trap, but with worsening work of breathing and saturation it means too little air is moving to make sound.", "✓ Impending respiratory failure", "  Yes: A silent chest with high respiratory rate, deep retractions, falling saturation and speaking only two words means air movement is failing, signaling impending respiratory failure.", "- Anxiety", "  No: Anxiety can raise respiratory rate, but it does not cause retractions, hypoxemia or a silent chest in a child with known asthma.", "Actions to take:", "✓ Give continuous albuterol and oxygen as ordered", "  Yes: Continuous bronchodilator and oxygen treat bronchospasm and hypoxemia directly while help arrives.", "- Give a large glass of water", "  No: Drinking risks aspiration in a child who can barely speak and does nothing for bronchospasm or hypoxemia.", "- Let her sleep now that the wheezing stopped", "  No: Sleep may seem like relief, but drowsiness here can signal fatigue and CO2 retention; the silent chest is a warning, not recovery.", "✓ Call a rapid response", "  Yes: She is unstable and may need escalation such as magnesium, ventilatory support or ICU care, so a rapid response brings that team now.", "- Recheck in an hour", "  No: Rechecking in an hour delays care in a deteriorating child; respiratory failure can progress to arrest in minutes.", "Parameters to monitor:", "- Daily weight", "  No: Daily weight has no role in tracking an acute respiratory emergency.", "✓ Oxygen saturation", "  Yes: Saturation trends show oxygenation; a continued fall despite oxygen means she needs higher-level support.", "- Blood glucose", "  No: Blood glucose may rise with steroids or albuterol but is not a priority parameter for respiratory failure.", "✓ Work of breathing and respiratory rate", "  Yes: Retractions, accessory muscle use, ability to speak and respiratory rate show whether she is responding or tiring.", "- Peak flow every 4 hours", "  No: Peak flow is part of routine asthma care, but a child who can say only two words cannot perform it reliably, and every 4 hours is far too infrequent.", "", "Why: A silent chest means too little air is moving to make a wheeze. With rising work of breathing and falling saturation, it's an emergency, not improvement.", "Tip: A change that looks like improvement (wheezing stops, child gets quiet or sleepy) is a red flag when work of breathing and saturation are worsening; trust the trend in the vital signs over the sound."], "st": "awaiting"}, {"id": "ngn:pd-mat", "hash": "686f6df348", "title": "peds-5s-1 · Matrix · Recognize cues", "body": ["You're reviewing vital signs on a pediatric unit.", "", "For each finding, indicate whether it is expected for the child or requires follow-up.", "", "- 4-month-old, HR 150, asleep → Expected", "  Normal for an infant.", "- 4-month-old with RSV, RR 68 with retractions and nasal flaring → Requires follow-up", "  Increased work of breathing.", "- 15-year-old in sickle cell crisis, new chest pain, RR 28, SpO₂ 91% → Requires follow-up", "  Acute chest syndrome until proven otherwise.", "- 8-year-old, HR 118 after albuterol → Expected", "  Expected tachycardia from albuterol.", "- 3-year-old, SBP 92 → Expected", "  Normal for age.", "", "Why: Normal ranges change with age. Work of breathing and new symptoms matter more than a single number.", "Tip: Compare each number to the normal range for that age, then ask whether the context explains it (sleep, albuterol) or adds danger (retractions, new chest pain, low saturation)."], "st": "awaiting"}, {"id": "ngn:pd-sata", "hash": "29eb307089", "title": "peds-5s-1 · Select all · Generate solutions", "body": ["A 3-year-old is ordered morphine 0.1 mg/kg IV. The chart weight is 31 kg, so the order reads 3.1 mg. The child looks small for 31 kg.", "", "Which actions should the nurse take? Select all that apply.", "", "✓ Hold the dose", "  Yes: The weight is implausible for a 3-year-old, so the dose is likely about double the safe amount; any doubt about a dose means holding it until it is verified.", "✓ Weigh the child in kilograms", "  Yes: An actual measured weight in kilograms is the only safe basis for a pediatric dose and resolves whether 31 was really pounds.", "✓ Ask the provider and pharmacy to correct the order", "  Yes: The order is based on a wrong weight, so the prescriber and pharmacy must correct it rather than the nurse adjusting it independently.", "- Give half the dose to be safe", "  No: Halving the dose may feel cautious, but it is still an unverified guess; changing a dose without an order is outside nursing scope.", "- Give it as ordered because pharmacy verified it", "  No: Pharmacy verification is a safety check, not a guarantee; pharmacists rely on the charted weight too, and the nurse is the last check before the patient.", "✓ Report the error through the safety reporting system", "  Yes: A pound-for-kilogram weight error is a system problem, and reporting it, even as a near miss, helps prevent the same error for other children.", "", "Why: 31 is about what a 3-year-old weighs in pounds. Every pediatric dose depends on a weight in kilograms that someone actually measured.", "Tip: When a weight looks wrong for the age, suspect a pounds-for-kilograms mix-up; the answers that hold, verify and report are correct, and any option that gives some form of the dose is a distractor."], "st": "awaiting"}, {"id": "ngn:pd-ch1", "hash": "c2093f7bb1", "title": "peds-5s-1 · Bruising and abuse · NCLEX challenge · Analyze cues", "body": ["The nurse assesses bruises on several children.", "", "For each finding, indicate whether it is concerning for abuse or consistent with normal activity.", "", "- Any bruise on a 4-month-old who can't roll yet → Concerning", "  Infants who don't cruise shouldn't bruise. \"Those who don't cruise rarely bruise.\"", "- Bruises on the shins of an active 3-year-old → Consistent with normal activity", "  Bony fronts of the legs bruise in normal play.", "- Bruising on the ears and neck of a 2-year-old → Concerning", "  Ears, neck and torso are protected areas; bruising there is a warning sign.", "- A bruise on the forehead of a 12-month-old learning to walk → Consistent with normal activity", "  Foreheads take falls when kids learn to walk.", "- A bruise in the shape of a hand on a child's back → Concerning", "  Patterned bruises suggest an object or a hand.", "- A history that doesn't match the child's development → Concerning", "  \"He rolled off the couch\" doesn't fit a 1-month-old.", "", "Why: Use TEN-4-FACESp: bruising on the torso, ears or neck, any bruise under 4 months, or patterned bruising is concerning. Check whether the story fits the child's development.", "Tip: With children, ask whether the injury fits the development and the story."], "st": "awaiting"}, {"id": "ngn:pd-ch2", "hash": "2b04d7d8b1", "title": "peds-5s-1 · Bronchiolitis with respiratory failure · NCLEX challenge · Prioritize hypotheses", "body": ["A 3-month-old with RSV is on high-flow oxygen. RR 74, head bobbing, grunting, deep retractions. SpO₂ 88% on 60% oxygen. Two apnea pauses of 20 seconds in the last hour.", "", "Complete the diagram: the condition the client is most likely experiencing, two actions the nurse should take, and two parameters to monitor.", "", "Condition:", "✓ Impending respiratory failure", "  Yes: Grunting, head bobbing, apneas and low saturation on high oxygen mean he's failing.", "- Expected RSV course", "  No: RSV is common, but these signs aren't the expected course.", "- Dehydration", "  No: Possible alongside, but it doesn't explain grunting and apnea.", "- Pneumothorax", "  No: Possible but less likely; get help either way.", "Actions to take:", "✓ Call a rapid response and escalate care now", "  Yes: He needs a higher level of care now.", "✓ Suction the nose before reassessing", "  Yes: Infants breathe through their noses; suctioning can quickly improve breathing.", "- Increase oral feeds to keep him hydrated", "  No: With this work of breathing he can aspirate. Feeds may need to stop.", "- Give albuterol every 2 hours", "  No: Routine albuterol isn't recommended in bronchiolitis.", "- Give a cough suppressant", "  No: Not used in infants.", "Parameters to monitor:", "✓ Work of breathing and apneas", "  Yes: The earliest signs of failure.", "✓ SpO₂ and oxygen requirement", "  Yes: A rising oxygen need tracks worsening.", "- Blood glucose", "  No: Not the main concern.", "- Temperature only", "  No: Doesn't track breathing.", "- Stool output", "  No: Not related.", "", "Why: In bronchiolitis, watch effort and apneas more than the saturation number. Escalate early in young infants.", "Tip: In infants, grunting, head bobbing and apnea are late signs. Act on them immediately."], "st": "awaiting"}]}, "packs": [{"id": "drill-med-1", "title": "Drills: Med Pass, part 1 of 2", "sub": "What to check before a medication, then give, hold or call. A pharmacist is especially welcome.", "n": 25, "reviewed": 0, "changed"
