<style>
:root{--bg:#E6EDF0;--surface:#FBFCFC;--surface-2:#EDF2F4;--ink:#152238;--ink-2:#4D5A6F;--line:#CAD5DB;--teal:#2449A8;--teal-ink:#fff;--red:#B3342B;--red-bg:#F8E1DE;--good:#2B7249;--good-bg:#E0F0E6;--amber:#A96C0E;--amber-bg:#FBEFD6;
  --serif:"Barlow Condensed","Arial Narrow",sans-serif;--sans:"Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161C;--surface:#1A1F27;--surface-2:#212833;--ink:#E7E4DB;--ink-2:#A0A5AE;--line:#343C48;--teal:#93B4E4;--teal-ink:#0F1B2C;--red:#F0766B;--red-bg:#3b1d1b;--good:#72c692;--good-bg:#16301f;--amber:#E9AE4E;--amber-bg:#35291a}}
:root[data-theme="dark"]{--bg:#12161C;--surface:#1A1F27;--surface-2:#212833;--ink:#E7E4DB;--ink-2:#A0A5AE;--line:#343C48;--teal:#93B4E4;--teal-ink:#0F1B2C;--red:#F0766B;--red-bg:#3b1d1b;--good:#72c692;--good-bg:#16301f;--amber:#E9AE4E;--amber-bg:#35291a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
main{max-width:52rem;margin:0 auto;padding:clamp(1.2rem,5vw,3rem) 16px calc(5rem + env(safe-area-inset-bottom))}
a{color:var(--teal)}
.home{font-family:var(--serif);font-weight:700;font-size:1.1rem;letter-spacing:.04em;text-transform:uppercase;background:var(--ink);color:var(--bg);padding:.28em .55em .22em;border-radius:2px;text-decoration:none}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.9rem,6vw,2.6rem);line-height:1.1;letter-spacing:0;margin:1.6rem 0 .3rem}
h2{font-size:1.15rem;margin:2.4rem 0 .6rem}
h3{font-size:1rem;margin:0}
p{margin:.5rem 0}
.muted{color:var(--ink-2)}
.meta{display:flex;flex-wrap:wrap;gap:.4rem .6rem;margin-top:.6rem}
.chip{display:inline-flex;align-items:center;padding:.15em .6em;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--surface-2);border:1px solid var(--line)}
.chip.awaiting{background:var(--amber-bg);border-color:transparent;color:var(--amber)}
.chip.reviewed{background:var(--good-bg);border-color:transparent;color:var(--good)}
.chip.changed{background:var(--red-bg);border-color:transparent;color:var(--red)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem 1.1rem;margin:.8rem 0}
.how ol{margin:.4rem 0 0;padding-left:1.2rem}.how li{margin:.2rem 0}
label{display:block;font-weight:600;font-size:.9rem;margin:.7rem 0 .25rem}
input[type=text],input[type=email],textarea,select{width:100%;min-height:44px;padding:.5em .7em;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:5rem;resize:vertical}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:0 1rem}
details.pt{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:.6rem 0}
details.pt>summary{cursor:pointer;padding:.85rem 1rem;font-weight:600;list-style-position:inside}
details.pt>div{padding:0 1rem 1rem}
table{width:100%;border-collapse:collapse;font-size:.88rem;margin:.4rem 0}
th,td{text-align:left;vertical-align:top;padding:.35rem .5rem .35rem 0;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--ink-2);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
.scroll{overflow-x:auto}
ul.plain{margin:.3rem 0;padding-left:1.1rem}
.dec{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:.85rem 1rem;margin:.6rem 0}
.dec.pos{border-left-color:var(--good)}.dec.neg{border-left-color:var(--red)}
.dec .top{display:flex;flex-wrap:wrap;gap:.3rem .5rem;align-items:center;font-size:.78rem;color:var(--ink-2);font-weight:600}
.pts{font-weight:700;padding:.05em .45em;border-radius:4px;background:var(--surface-2)}
.pos .pts{color:var(--good);background:var(--good-bg)}.neg .pts{color:var(--red);background:var(--red-bg)}
.dec b{display:block;margin:.35rem 0 .15rem;font-size:1rem}
.dec .why{font-family:var(--sans);color:var(--ink-2);margin:0}
.dec .src{font-size:.75rem;color:var(--ink-2);margin-top:.35rem}
.verdict{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.7rem}
.verdict button{min-height:40px;padding:.35em .9em;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer}
.verdict button[aria-pressed="true"][data-v="ok"]{background:var(--good);border-color:var(--good);color:var(--teal-ink)}
.verdict button[aria-pressed="true"][data-v="fix"]{background:var(--red);border-color:var(--red);color:var(--teal-ink)}
.verdict button[aria-pressed="true"][data-v="unsure"]{background:var(--amber);border-color:var(--amber);color:var(--teal-ink)}
.dec textarea{margin-top:.5rem;min-height:3.6rem}
.opt{padding:.4rem 0;border-bottom:1px solid var(--line);font-size:.92rem}.opt:last-child{border:0}
.opt i{font-style:normal;font-weight:700;font-size:.75rem;padding:.05em .4em;border-radius:4px;margin-right:.4rem;background:var(--surface-2)}
.bar{position:sticky;top:0;z-index:5;margin:0 -16px;padding:.6rem 16px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:.6rem;font-size:.9rem}
.bar .prog{display:block;flex:1;min-width:4rem;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;max-width:12rem}.bar .prog i{display:block;height:100%;background:var(--teal)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:.55em 1.2em;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn-primary{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.row{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1rem}
.check{display:flex;gap:.6rem;align-items:flex-start;font-weight:500;margin-top:1rem}
.check input{width:1.2rem;height:1.2rem;margin-top:.2rem;flex:none}
.msg{margin-top:.8rem;font-weight:600}.msg.err{color:var(--red)}.msg.ok{color:var(--good)}
pre{white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:.8rem;font-size:.8rem;max-height:18rem;overflow:auto}
.shifts a{display:block;text-decoration:none;color:inherit}
.shifts .card:hover{border-color:var(--ink-2)}
</style>
<style>.item .body p{margin:.15rem 0}.item .body .why{color:var(--ink-2);font-size:.92rem;margin:0 0 .35rem 1.1rem}.item .body .ok b{display:inline;margin:0;color:var(--good)}.item .body .no{color:var(--ink)}.item .body .sp{height:.5rem}.item>b{margin-bottom:.5rem}</style></head>

e change and the number.", "", "✓ B: Admitted yesterday for heart failure, EF 30%. One dose of IV furosemide yesterday. Weight up 2 kg.", "- ✗ 71, here for heart failure. History of hypertension, diabetes, CKD stage 3, gout and atrial fibrillation.", "  Why not: A history list buries what matters tonight: the EF, the one dose of furosemide, and the 2 kg gain.", "- ✗ Admitted yesterday for heart failure. His home meds include furosemide 40 mg by mouth daily.", "  Why not: Close, but it leaves out the EF and the 2 kg weight gain, the facts that frame the call.", "", "✓ A: Crackles halfway up, RR 26, can't lie flat. I think he's fluid overloaded and getting worse.", "- ✗ Crackles and a fever would fit pneumonia. I think he may be developing an infection.", "  Why not: He has no fever. Crackles halfway up, orthopnea and a 2 kg gain with an EF of 30% point to fluid.", "- ✗ He's breathing fast and seems anxious. I think the anxiety is making his breathing worse. He settles when I sit with him.", "  Why not: Anxiety can follow air hunger, but the crackles and weight gain say fluid. Name the likely cause.", "", "✓ R: I'd like another dose of IV furosemide, a chest X-ray, and for you to see him.", "- ✗ Could you put in some orders for his breathing?", "  Why not: Too vague. Ask for what you think he needs: a diuretic, an X-ray, and a look.", "- ✗ He's frightened and working hard. Can I give him the PRN morphine for his air hunger and see if he settles?", "  Why not: Morphine may ease the feeling but doesn't treat the fluid. Ask for the diuretic and an evaluation.", "", "✓ ✓: Read back: furosemide 80 mg IV now, portable chest X-ray, you're on your way. Correct?", "- ✗ Read back: furosemide 40 mg IV now, portable chest X-ray, you're on your way.", "  Why not: She said 80 mg. The read-back is how wrong numbers get caught.", "- ✗ Okay, furosemide and an X-ray. I'll get those going.", "  Why not: No numbers repeated, so a wrong dose or route can't be caught.", "  Provider: \"Furosemide 80 milligrams IV now, portable chest X-ray, and I'm coming up.\"", "", "Why: ", "Pearl: Situation in one sentence, the background that matters, your assessment, a clear ask, and a read-back."], "st": "awaiting"}, {"id": "drill:sb-sepsis", "hash": "a350a5ab52", "title": "Eleanor Whitfield, calling Dr. Patel, hospitalist", "body": ["UTI, admitted yesterday. Now she doesn't know where she is. T 38.7, HR 116, BP 88/52, RR 24.", "", "✓ S: This is the nurse for Eleanor Whitfield in 416. I'm worried she's septic: new confusion, BP 88/52, HR 116, temp 38.7.", "- ✗ This is the nurse for Eleanor Whitfield in 416. She's newly confused this morning and her temp is up to 38.7. Can you take a look?", "  Why not: Missing the low pressure and fast pulse that make this urgent, and the word sepsis.", "- ✗ This is the nurse for 416. Her vitals are off this morning: BP 88/52, HR 116, RR 24, temp 38.7, SpO₂ 95% on room air.", "  Why not: The numbers are there but not your worry. Say \"I think she's septic\" and the new confusion.", "", "✓ B: UTI, admitted yesterday. First dose of ceftriaxone was due at 08:00 but is still waiting on pharmacy.", "- ✗ 82, admitted yesterday for a UTI. History of hypertension and osteoarthritis. She lives alone with her cat.", "  Why not: Leaves out the delayed antibiotic, the fact that changes the plan.", "- ✗ UTI, admitted yesterday. She was a little confused on admission, so this may be her baseline.", "  Why not: She was oriented at 07:00. Calling it baseline delays sepsis care.", "", "✓ A: She was oriented at 07:00. With the fever, low pressure and fast pulse, I think this is sepsis.", "- ✗ Her mouth is dry and her urine is dark. I think she's dehydrated from not drinking since yesterday.", "  Why not: Dehydration doesn't explain a fever with a known infection. Name sepsis.", "- ✗ She's pulling at her lines and calling for her cat. I think she's delirious, maybe from the new environment.", "  Why not: She is delirious, but from a cause: infection with low pressure. The cause is the assessment.", "", "✓ R: I'd like blood cultures, a lactate, a fluid bolus, the antibiotic now, and you at the bedside.", "- ✗ Can I give acetaminophen for the fever, push oral fluids, and recheck her vitals in an hour?", "  Why not: Treats the number, not the sepsis. An hour's delay matters.", "- ✗ Could you see her when you're next on the unit? I'll keep a close eye on her vitals until then.", "  Why not: No time frame and no bundle. Ask for cultures, lactate, fluid, antibiotic, and a bedside look now.", "", "✓ ✓: Read back: two blood cultures, lactate, 30 mL/kg lactated Ringer's, then ceftriaxone. See you in five.", "- ✗ Read back: two blood cultures, lactate, 30 mL/kg normal saline, then ceftriaxone. See you in five.", "  Why not: She ordered lactated Ringer's, not normal saline.", "- ✗ Okay, cultures, lactate, fluid and the antibiotic. I'll get all of that started right away and see you in five.", "  Why not: No numbers repeated. The read-back exists to catch a wrong volume or drug.", "  Provider: \"Two sets of cultures, lactate, 30 mL per kilo of lactated Ringer's, then the ceftriaxone. I'll be there in five.\"", "", "Why: ", "Pearl: Lead with your worry. \"I think she's septic\" gets action faster than a list of numbers."], "st": "awaiting"}, {"id": "drill:sb-bleed", "hash": "508e80da3c", "title": "Margaret Doyle, calling Dr. Abara, orthopedics", "body": ["Hip replacement yesterday. Hemoglobin 7.1, down from 10.2. HR 112. BP 94/60. Dressing soaked through.", "", "✓ S: This is the nurse for Margaret Doyle, hip replacement yesterday. Her hemoglobin dropped from 10.2 to 7.1 and she's tachycardic at 112.", "- ✗ This is the nurse for Margaret Doyle, hip replacement yesterday. Her hemoglobin this morning came back at 7.1 and I wanted you to know.", "  Why not: Give the trend and the heart rate. 7.1 alone may not sound urgent; 10.2 to 7.1 with HR 112 does.", "- ✗ This is the nurse for Margaret Doyle, hip replacement yesterday. She's pale and a bit dizzy this morning when she sits up.", "  Why not: No numbers and no worry stated.", "", "✓ B: Right total hip yesterday. On enoxaparin for clot prevention. The dressing is soaked through.", "- ✗ Right total hip yesterday. History of osteoporosis and hypothyroidism. She takes levothyroxine at home.", "  Why not: Leaves out the enoxaparin and the soaked dressing.", "- ✗ Right total hip yesterday. Estimated blood loss in the OR was 400 mL and she got 2 liters of fluid.", "  Why not: Useful, but the anticoagulant and the soaked dressing matter more right now.", "", "✓ A: BP 94/60, she's pale and dizzy sitting up. I think she's bleeding.", "- ✗ Her urine output is fine. I think it's dilution from the IV fluids she got overnight.", "  Why not: Fluids can lower hemoglobin a little, not 3 points with a fast pulse and a soaked dressing.", "- ✗ BP 94/60. I think she's dehydrated and needs fluids.", "  Why not: Low pressure and a fast pulse, yes, but the falling hemoglobin says blood loss.", "", "✓ R: I'd like a type and crossmatch, to hold the enoxaparin, and for you to look at the wound.", "- ✗ Her pressure is soft. Can I give her a 500 mL fluid bolus and recheck her pressure when it's in?", "  Why not: May be part of the plan, but ask for blood, holding the enoxaparin, and a look at the wound.", "- ✗ Can I recheck the hemoglobin at noon and call you if it's dropped again?", "  Why not: Too slow for an active bleed.", "", "✓ ✓: Read back: hold enoxaparin, type and cross, transfuse one unit, recheck after. You're coming after your case.", "- ✗ Read back: hold enoxaparin, type and cross, transfuse two units, recheck after. You're coming after your case.", "  Why not: He said one unit.", "- ✗ Okay, hold the enoxaparin and get blood going. I'll let you know how she does. Thanks.", "  Why not: No details repeated, so the unit count and recheck can't be confirmed.", "  Provider: \"Hold the enoxaparin. Type and cross, transfuse one unit, recheck after. I'll be up after this case.\"", "", "Why: ", "Pearl: Give the trend, not just the number: \"10.2 to 7.1\" says more than \"7.1\"."], "st": "awaiting"}, {"id": "drill:sb-pca", "hash": "5c26ad8d52", "title": "Kevin Ramos, calling Rapid response nurse, then the surgeon", "body": ["Day 1 after bowel surgery on a morphine PCA. You can't wake him. RR 7, SpO₂ 84%. You stopped the PCA and gave naloxone per protocol. He's waking.", "", "✓ S: This is the nurse for Kevin Ramos. He had opioid oversedation on his PCA: RR 7 and SpO₂ 84%. I stopped it and gave naloxone; he's rousing.", "- ✗ This is the nurse for Kevin Ramos. He had a low respiratory rate on his PCA a few minutes ago, but he's awake and okay now.", "  Why not: Undersells it. Say oversedation, the numbers, and what you did.", "- ✗ This is the nurse for Kevin Ramos, bowel resection yesterday. I gave naloxone a few minutes ago and he's awake and talking to me now, so the worst is over.", "  Why not: Missing what happened and the numbers that made you act.", "", "✓ B: Bowel resection yesterday. Morphine PCA with a basal rate. History of sleep apnea, no CPAP here.", "- ✗ Bowel resection yesterday. Morphine PCA for pain, which was a 6 out of 10 overnight.", "  Why not: Leaves out the basal rate and the sleep apnea, the two risk factors.", "- ✗ Bowel resection yesterday. 44, on a morphine PCA, no significant medical history.", "  Why not: Not true: sleep apnea is the key history.", "", "✓ A: Now RR 12, SpO₂ 93% on 2 L, sedation improving. The naloxone may wear off before the morphine does.", "- ✗ RR 12, SpO₂ 93% on 2 L. He's awake and talking now, so I think he's out of danger.", "  Why not: Naloxone wears off before morphine does. He can go back under.", "- ✗ He says he only pressed the button twice all night. I think the PCA pump may have malfunctioned, and I've tagged it.", "  Why not: The basal rate and his sleep apnea explain it.", "", "✓ R: I'd like the basal rate stopped, continuous pulse oximetry, and a new pain plan. Can you see him?", "- ✗ His pain is back up to a 7. Should I restart the PCA with a lower basal rate?", "  Why not: Restarting the drug that caused this without new monitoring is the risk. Ask for the basal off and continuous monitoring.", "- ✗ Can we stop the PCA altogether and switch him to oral oxycodone instead?", "  Why not: A new pain plan comes, but first: stop the basal and monitor continuously.", "", "✓ ✓: Read back: basal off, continuous oximetry and capnography, repeat naloxone for RR under 10. You're coming in 20.", "- ✗ Read back: basal off, continuous oximetry, repeat naloxone for RR under 8. You're coming to see him in 20 minutes. Correct?", "  Why not: He said under 10, and capnography too.", "- ✗ Okay, I'll stop the basal and keep a close eye on him until you get here in 20.", "  Why not: Not a read-back: the monitoring and the naloxone threshold aren't repeated.", "  Provider: \"Stop the basal. Continuous oximetry and capnography. Repeat naloxone if RR under 10. I'll see him in 20 minutes.\"", "", "Why: ", "Pearl: Act first, then call: stop the opioid and give naloxone by protocol. Then say what you did and what you need."], "st": "awaiting"}, {"id": "drill:sb-lithium", "hash": "dc37aae3cd", "title": "Rosa Benitez, calling Dr. Lund, psychiatrist on call", "body": ["Bipolar disorder on lithium. Vomiting since lunch. Coarse tremor. Slow to answer. Stat level: 2.1.", "", "✓ S: This is the nurse for Rosa Benitez on 3 East. I'm worried about lithium toxicity: level 2.1, vomiting, coarse tremor and new slowing.", "- ✗ This is the nurse for Rosa Benitez on 3 East. She's been vomiting since lunch and can't keep anything down.", "  Why not: Lead with the danger: possible lithium toxicity and the level.", "- ✗ This is the nurse for Rosa Benitez on 3 East. Her stat lithium level just came back at 2.1.", "  Why not: Add the symptoms; the number with the coarse tremor and slowing is the story.", "", "✓ B: Lithium 600 mg twice a day. Started ibuprofen for a toothache three days ago. Last level was 0.9.", "- ✗ Bipolar I, on lithium 600 mg twice a day and quetiapine 200 mg at night. No drug allergies that I know of.", "  Why not: Missing the new ibuprofen and the last level.", "- ✗ She's been stable on lithium for years and her levels are usually fine.", "  Why not: Past stability is why the new ibuprofen and the vomiting matter now. Say them.", "", "✓ A: I think this is lithium toxicity, made worse by the ibuprofen and the vomiting. She needs a medical evaluation.", "- ✗ Two other patients on the unit were sick this week. I think she has a stomach virus.", "  Why not: Vomiting with a coarse tremor and slowing at 2.1 is toxicity.", "- ✗ Her mouth is dry and she's dizzy standing. I think she's dehydrated from the vomiting.", "  Why not: True but incomplete. Dehydration is driving lithium toxicity; name the toxicity.", "", "✓ R: I'd like to hold lithium and ibuprofen, get a chemistry panel, and transfer her to the ED for evaluation.", "- ✗ Should I give ondansetron for the vomiting, push fluids by mouth, and recheck the lithium level in the morning?", "  Why not: Treating the nausea masks the toxicity.", "- ✗ Can we lower her lithium dose tonight and recheck a level in a few days?", "  Why not: She needs it held and a medical evaluation, not a smaller dose.", "", "✓ ✓: Read back: hold lithium and ibuprofen, basic panel now, transfer to the ED, you'll call them.", "- ✗ Read back: hold lithium, basic panel now, transfer to the ED, you'll call them.", "  Why not: Missed holding the ibuprofen.", "- ✗ Okay, I'll hold her meds, get the labs and get her ready to go to the ED.", "  Why not: Which meds? Repeat them.", "  Provider: \"Hold the lithium and the ibuprofen. Basic panel now. Send her to the ED, I'll call them.\"", "", "Why: ", "Pearl: Name the danger in the first sentence. NSAIDs, dehydration and some blood pressure pills push lithium levels up."], "st": "awaiting"}, {"id": "drill:sb-hyperk", "hash": "2fb8053651", "title": "Arthur Hale, calling Dr. Okoye, hospitalist", "body": ["Kidney disease, on lisinopril and spironolactone. Morning K 6.6. Peaked T waves. Feels weak.", "", "✓ S: This is the nurse for Arthur Hale in 410. His potassium is 6.6 and he has peaked T waves on the monitor.", "- ✗ This is the nurse for Arthur Hale in 410. His potassium just came back from the lab at 6.6.", "  Why not: Add the peaked T waves. That's what makes it an emergency.", "- ✗ This is the nurse for Arthur Hale in 410. He feels weak this morning and his potassium is high. Can you take a look at his labs?", "  Why not: Give the number and the ECG change.", "", "✓ B: Chronic kidney disease, creatinine 2.8. On lisinopril and spironolactone. Yesterday's K was 5.4.", "- ✗ Chronic kidney disease, hypertension and gout. He isn't on dialysis and he's making urine.", "  Why not: Missing the lisinopril and spironolactone, which raise potassium.", "- ✗ His potassium was 5.4 yesterday and 6.6 today, so it's climbing fast.", "  Why not: A good trend, but add the meds and the kidney function.", "", "✓ A: BP 130/80, HR 64. I think this is dangerous hyperkalemia and could cause an arrhythmia.", "- ✗ He has no chest pain and says he feels okay. It may be a hemolyzed sample. Can we redraw it?", "  Why not: Possible, but peaked T waves on the monitor make it real until proven otherwise.", "- ✗ BP 130/80, HR 64. He's stable for now; his blood pressure and heart rate are fine.", "  Why not: A normal pressure doesn't protect his heart from a potassium of 6.6.", "", "✓ R: I'd like orders for calcium gluconate, insulin with dextrose, a 12-lead, and a repeat K. And hold his spironolactone.", "- ✗ Can you order a repeat potassium, and I'll call you back as soon as it results?", "  Why not: A repeat alone leaves his heart unprotected.", "- ✗ Should I give him a dose of IV furosemide and recheck the potassium this afternoon?", "  Why not: It may help later, but calcium protects the heart now.", "", "✓ ✓: Read back: calcium gluconate 1 g IV, regular insulin 10 units IV with 25 g dextrose, 12-lead, repeat K in 2 hours, hold spironolactone and lisinopril.", "- ✗ Read back: calcium gluconate 1 g IV, regular insulin 10 units IV, 12-lead on the monitor, repeat potassium in 2 hours. I'll call you as soon as it results.", "  Why not: Missed the dextrose, which prevents a low after IV insulin, and the meds to hold.", "- ✗ Okay, calcium, insulin with dextrose, a 12-lead, a repeat potassium, and I'll hold his spironolactone and lisinopril.", "  Why not: No doses repeated.", "  Provider: \"Calcium gluconate 1 gram IV, regular insulin 10 units IV with 25 grams of dextrose, 12-lead, repeat K in 2 hours, hold spironolactone and lisinopril.\"", "", "Why: ", "Pearl: Critical value + a body sign = say both in the first sentence. Calcium protects the heart; insulin moves potassium into cells."], "st": "awaiting"}, {"id": "drill:sb-stroke", "hash": "f9a280053a", "title": "Leon Feld, calling Stroke team, via the stroke alert", "body": ["Admitted for pneumonia. At 15:05 his right arm is weak and his speech is slurred. Last known well: 14:50, talking normally.", "", "✓ S: Stroke alert, 4 West room 420. Leon Feld, 74: right arm weakness and slurred speech. Last known well 14:50.", "- ✗ Room 420, Leon Feld, 74: new right arm weakness and slurred speech. Can someone come see him?", "  Why not: Say \"stroke alert\" and the last known well time.", "- ✗ Stroke alert, 4 West room 420. Leon Feld, 74: right arm weakness and slurred speech. Symptoms started at 15:05.", "  Why not: 15:05 is when you found him. Last known well is 14:50, and that's the time that matters.", "", "✓ B: Here for pneumonia. History of atrial fibrillation, on no anticoagulant. Glucose 112.", "- ✗ Here for pneumonia, day 2 of antibiotics. History of atrial fibrillation, hypertension and diabetes.", "  Why not: Missing whether he's anticoagulated and his glucose.", "- ✗ Here for pneumonia. On apixaban for atrial fibrillation. Glucose 112.", "  Why not: Not true here: he's on no anticoagulant. Getting this wrong changes the treatment.", "", "✓ A: New right-sided weakness and aphasia. I think he's having an acute stroke.", "- ✗ He started a new antibiotic today. This could be a reaction to his antibiotic.", "  Why not: Focal weakness with aphasia is a stroke until proven otherwise.", "- ✗ He didn't eat much lunch today. It could be low blood sugar.", "  Why not: Reasonable to check, and you did: 112.", "", "✓ R: He's NPO and I have an IV. I'd like the team at the bedside and a head CT now.", "- ✗ Should I give his 15:00 meds before he goes down to CT?", "  Why not: NPO until a swallow screen.", "- ✗ He may just be tired. Can we recheck him in 30 minutes and see if it clears up on its own?", "  Why not: Every minute counts in a stroke.", "", "✓ ✓: Read back: NPO, neuro checks every 15 minutes, CT ready now. I'll have him on the monitor.", "- ✗ Read back: NPO, neuro checks every hour, CT now. I'll have him on the monitor and ready to go.", "  Why not: She said every 15 minutes.", "- ✗ Okay, CT and neuro checks. I'll get him ready to go.", "  Why not: No frequency repeated.", "  Provider: \"We're on our way. Keep him NPO, neuro checks every 15 minutes, CT is clearing the scanner.\"", "", "Why: ", "Pearl: For stroke: the last known well time is the most important number you have. Say it first."], "st": "awaiting"}, {"id": "drill:sb-asthma", "hash": "4b61ae0fa6", "title": "Jayden Brooks, calling Dr. Ames, pediatric resident", "body": ["Asthma, 6 years old. He was wheezing; now you hear almost nothing. Sitting forward. SpO₂ 89%. Can't finish a sentence.", "", "✓ S: This is the nurse for Jayden Brooks in 512. He has a silent chest: SpO₂ 89%, sitting forward, can't finish sentences. I need you now.", "- ✗ This is the nurse for Jayden Brooks in 512. Good news: his wheezing is much quieter now than an hour ago.", "  Why not: A quiet chest with worse work of breathing is a danger sign, not improvement.", "- ✗ This is the nurse for Jayden Brooks in 512. His SpO₂ is 89% on his asthma treatment and he's sitting forward.", "  Why not: Add \"silent chest\" and \"can't finish sentences.\"", "", "✓ B: Admitted for asthma today. Albuterol at 18:30, steroid given at 16:00. Two ICU stays for asthma before.", "- ✗ 6 years old, admitted today for an asthma flare after a cold. Mom is at the bedside.", "  Why not: Missing the last albuterol, the steroid, and the ICU history.", "- ✗ He had albuterol at 18:30 and it seemed to help for a little while.", "  Why not: Add the steroid and his two ICU stays: they tell the resident how fast he can crash.", "", "✓ A: Quiet chest with worse work of breathing. He's moving very little air. I think he's about to tire out.", "- ✗ The wheezing is gone and his chest is quiet, so I think the albuterol is working.", "  Why not: Wheezing disappears when air stops moving.", "- ✗ He looks scared and won't talk to me. I think he's anxious, which is making him breathe faster and tire himself out.", "  Why not: Anxiety doesn't cause a silent chest.", "", "✓ R: I've started albuterol back-to-back. I'd like you at the bedside, and I'm calling the rapid response team.", "- ✗ Can I give another albuterol now and recheck him in an hour to see if it's helping?", "  Why not: Too slow. He needs continuous treatment and help now.", "- ✗ He's working himself up. Can I give him something to help him calm down and rest?", "  Why not: Sedating a tiring asthmatic can stop his breathing.", "", "✓ ✓: Read back: continuous albuterol, ipratropium, IV magnesium, rapid response called. See you now.", "- ✗ Read back: albuterol every hour, ipratropium, IV magnesium, rapid response called. See you in a minute.", "  Why not: She said continuous albuterol, not every hour.", "- ✗ Okay, albuterol and magnesium. I'll get those going right away.", "  Why not: Incomplete: no ipratropium, no rapid response, and \"okay\" isn't a read-back.", "  Provider: \"Continuous albuterol, ipratropium, IV magnesium, and get rapid response. I'm coming.\"", "", "Why: ", "Pearl: A quiet chest in a struggling asthmatic is not improvement. It means almost no air is moving."], "st": "awaiting"}, {"id": "drill:sb-transfusion", "hash": "14a3e4dfb0", "title": "Doris Moss, calling Dr. Iyer, oncology", "body": ["15 minutes into a unit of red cells: chills, back pain, T 38.6, HR 118, BP 96/58. You stopped the blood and hung saline through new tubing.", "", "✓ S: This is the nurse for Doris Moss. I think she's having a transfusion reaction: chills, back pain, fever 38.6, BP 96/58. I've stopped the blood.", "- ✗ This is the nurse for Doris Moss. She has a fever of 38.6 about fifteen minutes into her transfusion, so I've slowed the rate down.", "  Why not: Missing the back pain and low pressure, and that you've stopped the blood.", "- ✗ This is the nurse for Doris Moss, who's getting blood today. She has chills and back pain and says she feels awful all of a sudden.", "  Why not: Add the numbers and that the blood is off.", "", "✓ B: Leukemia, hemoglobin 6.9 this morning. This is her first unit today. Bedside check was done with two nurses.", "- ✗ Leukemia. She's had many transfusions before without problems, and she was premedicated with acetaminophen today.", "  Why not: Previous transfusions don't protect against this one; give the unit and the bedside check.", "- ✗ Leukemia, on chemotherapy, port in place. Her counts have been low all week.", "  Why not: Missing the hemoglobin, which unit this is, and that the bedside check was done.", "", "✓ A: Fever, back pain and a falling pressure this early make me worried about a hemolytic reaction.", "- ✗ She's had fevers with blood before. I think it's a febrile non-hemolytic reaction and she'll settle with acetaminophen.", "  Why not: Possible, but back pain and a falling pressure this early point to hemolysis. Assume the worst until ruled out.", "- ✗ She has a port and her counts are low. She might have a line infection.", "  Why not: Timing with the transfusion makes the blood the cause until proven otherwise.", "", "✓ R: I'd like you to see her now. I'll send the bag and tubing to the blood bank with blood and urine samples. Do you want a fluid bolus?", "- ✗ Her fever is coming down a little. Can I restart the transfusion at a slower rate and stay with her for the first 15 minutes?", "  Why not: The blood stays off until a reaction is ruled out.", "- ✗ Should I give acetaminophen and diphenhydramine, watch her for half an hour, and call you back if she isn't better?", "  Why not: Treats the fever, not the reaction. Send the workup and get her evaluated.", "", "✓ ✓: Read back: blood stays off, normal saline 500 mL bolus, transfusion reaction workup sent. You're on your way.", "- ✗ Read back: blood stays off, normal saline 250 mL bolus, transfusion reaction workup sent. You're on your way.", "  Why not: He said 500 mL.", "- ✗ Okay, saline and the workup. I'll get those going and see you when you get here.", "  Why not: No volume repeated.", "  Provider: \"Keep the blood off. Normal saline 500 mL bolus. Send the transfusion reaction workup. I'm coming up.\"", "", "Why: ", "Pearl: Act, then call: stop the transfusion, keep the vein open with saline through new tubing, then SBAR. Send the bag back; it's evidence."], "st": "awaiting"}, {"id": "drill:sb-nms", "hash": "8675352fee", "title": "Leon Carter, calling Dr. Abrams, psychiatrist on call", "body": ["Started haloperidol three days ago. T 39.4, HR 124, BP 168/98. Arms stiff as pipes. Confused and sweating.", "", "✓ S: This is the nurse for Leon Carter on 3 East. I'm worried about neuroleptic malignant syndrome: T 39.4, rigid, confused, BP 168/98.", "- ✗ This is the nurse for Leon Carter on 3 East. He has a fever of 39.4 this afternoon and I'd like an order for acetaminophen.", "  Why not: Add rigidity, confusion and the new antipsychotic: name NMS.", "- ✗ This is the nurse for Leon Carter on 3 East. He's stiff and confused today, more than yesterday, and he isn't making much sense.", "  Why not: Missing the vital signs.", "", "✓ B: First-episode psychosis. Haloperidol started three days ago and increased yesterday. He's barely drinking.", "- ✗ First-episode psychosis, admitted three days ago on a hold. No medical history and no drug allergies that we know of.", "  Why not: Missing the haloperidol start and dose increase.", "- ✗ First-episode psychosis. On haloperidol and lorazepam as needed. He's been cooperative with his medications.", "  Why not: Say when the haloperidol started and that it went up yesterday.", "", "✓ A: Fever, rigidity and confusion after a new antipsychotic. I think this is NMS and he needs medical care.", "- ✗ He's mute and holding odd postures for long stretches. This could be catatonia from his psychosis getting worse.", "  Why not: Catatonia can look similar, but fever and unstable vitals after a new antipsychotic are NMS until proven otherwise.", "- ✗ With a fever that high he may have an infection, maybe a pneumonia or a urinary infection.", "  Why not: Possible, but rigidity with fever after haloperidol is a medical emergency in its own right.", "", "✓ R: I'd like to hold the haloperidol, get a CK and labs, start cooling and fluids, and transfer him to medicine.", "- ✗ Should I give his PRN lorazepam for the rigidity and see whether he loosens up over the next hour?", "  Why not: Lorazepam may be part of NMS treatment, but the antipsychotic must stop and he needs medical care first.", "- ✗ Can we add a CK to his morning labs and recheck his temperature every four hours overnight?", "  Why not: He needs labs and cooling now.", "", "✓ ✓: Read back: hold all antipsychotics, CK and basic panel, IV fluids. You're calling medicine for transfer.", "- ✗ Read back: hold the haloperidol, CK and basic panel, IV fluids. You're calling medicine for transfer now.", "  Why not: She said hold all antipsychotics, not just haloperidol.", "- ✗ Okay, labs and fluids. I'll get those started while you call medicine.", "  Why not: No details repeated.", "  Provider: \"Hold all antipsychotics. CK, basic panel, IV fluids. I'm calling medicine for transfer now.\"", "", "Why: ", "Pearl: Psych units see medical emergencies too. Say the diagnosis you're worried about, by name, in the first sentence."], "st": "awaiting"}, {"id": "drill:sb-pph", "hash": "5733915b1f", "title": "Ana Reyes, calling Dr. Holt, OB", "body": ["2 hours after a vaginal birth. Fundus boggy above the umbilicus, soaked a pad in 15 minutes. HR 118, BP 92/58. You're massaging the fundus.", "", "✓ S: This is the nurse for Ana Reyes in 214. She's hemorrhaging: boggy uterus, a pad soaked in 15 minutes, HR 118, BP 92/58.", "- ✗ This is the nurse for Ana Reyes in 214. Her bleeding is heavier than expected and I'd like you to take a look when you can.", "  Why not: Say \"hemorrhage\" and give the numbers: a pad in 15 minutes, HR 118, BP 92/58.", "- ✗ This is the nurse for Ana Reyes in 214, two hours after delivery. Her fundus is boggy when I check it.", "  Why not: Add how fast she's bleeding and her vitals.", "", "✓ B: Vaginal birth at 09:00 after a 20-hour induction on oxytocin. Baby 4.2 kg. Asthma, so no carboprost.", "- ✗ Vaginal birth at 09:00. Second baby. Breastfeeding well, and her first delivery was uncomplicated.", "  Why not: Missing the long oxytocin induction, the big baby and the asthma.", "- ✗ Vaginal birth at 09:00 after a 20-hour induction on oxytocin. Baby 4.2 kg. No drug allergies.", "  Why not: Missing her asthma, which rules out carboprost.", "", "✓ A: Uterine atony with hemorrhage. Her bladder is empty. She's getting tachycardic.", "- ✗ The uterus was firm earlier. I think she may have a vaginal tear that was missed.", "  Why not: A boggy uterus points to atony. Tears bleed with a firm fundus.", "- ✗ I think she may have a full bladder that's keeping the uterus from clamping down.", "  Why not: Good thought, but her bladder is empty, and that's part of your assessment.", "", "✓ R: I'm massaging and I've called for help. I'd like uterotonics, a second IV, type and cross, and you at the bedside.", "- ✗ Can I keep massaging the fundus, weigh the pads, and recheck her bleeding and vitals in 15 minutes?", "  Why not: Keep massaging, yes, but she needs uterotonics and the provider now.", "- ✗ She says the cramping is bad. Can I give her ibuprofen for the cramping and a warm pack?", "  Why not: Pain isn't the problem. Hemorrhage is.", "", "✓ ✓: Read back: oxytocin 40 units in a liter wide open, methylergonovine 0.2 mg IM, TXA 1 g IV, type and cross 2 units.", "- ✗ Read back: oxytocin 40 units in a liter wide open, methylergonovine 0.2 mg IV, TXA 1 g IV, type and cross 2 units.", "  Why not: Methylergonovine is given IM, not IV: IV can cause severe hypertension and stroke.", "- ✗ Okay, oxytocin, methylergonovine and TXA, and I'll send the type and cross.", "  Why not: No doses or routes repeated.", "  Provider: \"Oxytocin 40 units in a liter, wide open. Methylergonovine 0.2 mg IM. TXA 1 gram IV. Type and cross 2 units. I'm on my way.\"", "", "Why: ", "Pearl: In hemorrhage, say the numbers that show it: how fast she's bleeding, heart rate, blood pressure. Mention allergies and conditions that rule out drugs."], "st": "awaiting"}, {"id": "drill:sb-compartment", "hash": "d331872c8d", "title": "Kenji Sato, calling Dr. Fisher, orthopedics", "body": ["Tibia fracture, casted yesterday. Pain 10 after morphine, worse when you stretch his toes. Toes pale and cool, he says they're tingling.", "", "✓ S: This is the nurse for Kenji Sato. I'm worried about compartment syndrome in his left leg: pain 10 despite morphine, worse on passive stretch.", "- ✗ This is the nurse for Kenji Sato. His pain is 10 out of 10 even after morphine, and I'd like to know if he can have another dose.", "  Why not: Say what you're worried about: compartment syndrome, and pain on passive stretch.", "- ✗ This is the nurse for Kenji Sato, tibia fracture in a cast. His toes are tingling under the cast and he can't get comfortable.", "  Why not: Add pain out of proportion and pain on stretch.", "", "✓ B: Closed tibia fracture from a motorcycle crash, casted at 16:00. Morphine 4 mg IV at 01:30 didn't touch it.", "- ✗ Closed tibia fracture, casted yesterday afternoon. He's 27, healthy, no medical history and no allergies.", "  Why not: Missing that the morphine didn't help.", "- ✗ Tibia fracture from a motorcycle crash. He had a lot of pain in the ED too, and needed several doses there.", "  Why not: Earlier pain doesn't explain pain that's worse now despite morphine.", "", "✓ A: Toes pale and cool, tingling, pulses still there. Pain out of proportion. I think pressure is building in the leg.", "- ✗ He's anxious and keeps watching the clock for his next dose, which makes the pain worse.", "  Why not: Pain out of proportion and on passive stretch is a physical sign, not a personality.", "- ✗ His toes are a little cool and tingling, but his pulses are present, so I think circulation to the foot is fine for now.", "  Why not: Pulses are a late sign. Pain on stretch is the early one.", "", "✓ R: I've kept the leg at heart level. I'd like you to see him now and decide about splitting the cast and pressure measurements.", "- ✗ Can I elevate his leg higher on two more pillows, put ice over the cast, and give another dose of morphine now?", "  Why not: Raising it above the heart lowers blood flow into the compartment.", "- ✗ He just had morphine. Can we give it time to work and reassess him in an hour?", "  Why not: Muscle can die within hours.", "", "✓ ✓: Read back: split the cast now, leg at heart level, NPO in case of surgery. You're coming in.", "- ✗ Read back: split the cast now, elevate the leg high on pillows, NPO in case of surgery. You're coming in.", "  Why not: He said heart level, not elevated.", "- ✗ Okay, I'll split the cast and call you when it's done.", "  Why not: Missing heart level and NPO.", "  Provider: \"I'm coming in. Bivalve the cast now, keep it at heart level, NPO in case we go to the OR.\"", "", "Why: ", "Pearl: Pulses are a late sign. Pain out of proportion and pain on passive stretch are the early ones. Say them first."], "st": "awaiting"}, {"id": "drill:sb-ich", "hash": "feb84d601a", "title": "Harriet Lowe, calling Dr. Mendez, hospitalist", "body": ["She slipped in the bathroom at 21:30 and hit her head. Now she has a headache and is vomiting. She's on warfarin.", "", "✓ S: This is the nurse for Harriet Lowe. She hit her head in a fall an hour ago and now has a headache and vomiting. She's on warfarin.", "- ✗ This is the nurse for Harriet Lowe. She fell in the bathroom an hour ago. She got herself up and didn't want me to call.", "  Why not: Add the head strike, symptoms, and warfarin.", "- ✗ This is the nurse for Harriet Lowe, admitted for pneumonia. She has a headache and is vomiting, and wants something for it.", "  Why not: Missing the fall and the warfarin.", "", "✓ B: Atrial fibrillation on warfarin, INR 2.8 this morning. Admitted for pneumonia. She was oriented this afternoon.", "- ✗ Admitted for pneumonia, day 3 of antibiotics. History of atrial fibrillation, hypertension and two falls at home.", "  Why not: Say she's on warfarin and her INR.", "- ✗ On warfarin for atrial fibrillation. She takes it at night and hasn't missed any doses.", "  Why not: Add the INR and that she was oriented this afternoon.", "", "✓ A: GCS 14, now slower to answer, pupils equal. I'm worried about a bleed in her head.", "- ✗ She has a bump on the back of her head, but she's talking to me and knows where she is.", "  Why not: Talking now doesn't rule out a growing bleed, especially on warfarin.", "- ✗ She's sleepy and slow to answer, but it's late and she's had a long day.", "  Why not: New sleepiness after a head strike is a warning sign.", "", "✓ R: I'd like a head CT now, neuro checks every 15 minutes, and to hold her warfarin. Will you come see her?", "- ✗ Can I give ondansetron for the vomiting and acetaminophen for the headache, and recheck her in an hour?", "  Why not: Treats a symptom of a possible bleed. CT first.", "- ✗ Can we do neuro checks every 4 hours overnight and get a CT in the morning if she's worse?", "  Why not: Too infrequent for a possible bleed on warfarin.", "", "✓ ✓: Read back: stat head CT, INR now, hold warfarin, neuro checks every 15 minutes. You're coming.", "- ✗ Read back: head CT in the morning, INR now, hold warfarin, neuro checks every 15 minutes.", "  Why not: He said stat CT.", "- ✗ Okay, CT and neuro checks. I'll call you with the result.", "  Why not: Missing stat, the INR, and the warfarin hold.", "  Provider: \"Stat head CT, INR now, hold warfarin, neuro checks every 15 minutes. If there's a bleed we reverse it. I'm coming.\"", "", "Why: ", "Pearl: Head strike plus an anticoagulant is high risk even if they look fine. Say both in the first sentence; it gets a CT ordered."], "st": "awaiting"}, {"id": "drill:sb-peds-dehyd", "hash": "9bb9cc2be7", "title": "Noah Bailey, calling Dr. Grant, pediatric resident", "body": ["Vomiting and diarrhea for two days. No wet diaper since 16:00. Sunken soft spot, no tears, hard to wake. HR 178, cap refill 4 seconds.", "", "✓ S: This is the nurse for Noah Bailey, 9 months. He's severely dehydrated and lethargic: HR 178, cap refill 4 seconds, no wet diaper in 12 hours.", "- ✗ This is the nurse for Noah Bailey, 9 months. He hasn't had a wet diaper in 12 hours and his mom is asking about it.", "  Why not: Add the heart rate, cap refill and lethargy that make it shock.", "- ✗ This is the nurse for Noah Bailey, 9 months, here for gastroenteritis. His heart rate is 178 and he's sleeping a lot.", "  Why not: Give the whole picture: lethargic, slow cap refill, no wet diapers.", "", "✓ B: Gastroenteritis, admitted yesterday for fluids. His IV came out at 18:00. Weight 8.5 kg.", "- ✗ Gastroenteritis, admitted yesterday for fluids. He's still having loose stools, about six today.", "  Why not: Missing that his IV came out and his weight.", "- ✗ His IV came out at 18:00 and he's been taking sips by mouth since then.", "  Why not: Add his weight so the resident can dose fluids.", "", "✓ A: Sunken fontanelle, dry mouth, hard to wake. I think he's in shock from fluid loss.", "- ✗ He's sleeping through his cares. I think he's tired from being sick for three days.", "  Why not: Hard to wake with a fast heart rate is shock, not tiredness.", "- ✗ Dry mouth and fewer wet diapers. I think he's mildly dehydrated.", "  Why not: Sunken fontanelle, no tears, slow refill and lethargy are severe.", "", "✓ R: He needs IV access now and a fluid bolus. I'd like a glucose check and you at the bedside.", "- ✗ He takes a bottle sometimes. Should we try oral rehydration by syringe first and see how he does?", "  Why not: He's too lethargic to drink safely.", "- ✗ He's a hard stick. Can we call the IV team in the morning when they're in?", "  Why not: He needs access now; an IO if needed.", "", "✓ ✓: Read back: normal saline 20 mL/kg, 170 mL over 15 minutes, glucose now, and an IO if two IV attempts fail.", "- ✗ Read back: normal saline 20 mL/kg, 170 mL over an hour, glucose now. You're coming.", "  Why not: She said over 15 minutes, and an IO after two failed IV attempts.", "- ✗ Okay, a bolus and a glucose. I'll get the IV started.", "  Why not: No volume or rate repeated.", "  Provider: \"Normal saline 20 mL per kilo, so 170 mL, over 15 minutes. Check a glucose. If no IV in two tries, call me for an IO. I'm coming.\"", "", "Why: ", "Pearl: Babies hide shock until late: a fast heart rate and slow cap refill are early signs. Low blood pressure is late. Weight-based fluids, read back the math."], "st": "awaiting"}, {"id": "drill:sb-suicide", "hash": "00ffb0504a", "title": "Tom Brennan, calling Dr. Vasquez, attending psychiatrist", "body": ["Voluntary admission for depression, on 15-minute checks. He tells you he plans to hang himself with his shoelaces tonight. He has them on.", "", "✓ S: This is the nurse for Tom Brennan. He just told me he plans to hang himself tonight with his shoelaces, and he had them on. I've removed them and I'm with him.", "- ✗ This is the nurse for Tom Brennan. He's talking about wanting to die again tonight, and I wanted to let you know before you leave.", "  Why not: Give the plan, the means and the time, and what you've already done.", "- ✗ This is the nurse for Tom Brennan, admitted after an overdose. I'm worried he's suicidal; something about him is different tonight.", "  Why not: Say what he told you: a plan, a method, tonight.", "", "✓ B: Admitted two days ago after an overdose. On 15-minute checks. His divorce was finalized today.", "- ✗ Admitted two days ago for depression. Started on sertraline. He's been attending groups.", "  Why not: Missing the overdose and today's divorce.", "- ✗ Admitted two days ago after an overdose of his own medications. He's been quiet but cooperative.", "  Why not: Add today's divorce and that he's on 15-minute checks.", "", "✓ A: He has a plan, a method and a time. He's at high risk of suicide right now.", "- ✗ He's upset about his divorce today, which is understandable. I think he needs to talk.", "  Why not: True, but the plan, method and timing are what make this high risk.", "- ✗ He's at moderate risk; he's talking about it, and people who talk about it are asking for help.", "  Why not: A specific plan with access and a time is high risk.", "", "✓ R: I'd like him on 1:1 observation, a room and belongings search, and you to evaluate him today.", "- ✗ Can we increase his checks to every 5 minutes and move him to the room by the station?", "  Why not: Even 5-minute checks leave gaps. With a plan and means, ask for 1:1.", "- ✗ Should I keep him on 15-minute checks now that the laces are gone, and have him promise to come to staff?", "  Why not: Removing the laces is right, but 15-minute checks aren't enough.", "", "✓ ✓: Read back: 1:1 now, room and belongings search, you'll see him within the hour.", "- ✗ Read back: 1:1 now, room and belongings search, you'll see him tomorrow morning.", "  Why not: She said within the hour, not tomorrow.", "- ✗ Okay, 1:1. I'll get someone to sit with him.", "  Why not: Missing the search and the time she'll see him.", "  Provider: \"Start 1:1 observation now. Search the room and his belongings. I'll see him within the hour.\"", "", "Why: ", "Pearl: Plan, means, timing: say all three. 15-minute checks are too far apart for a patient with a plan and access. Ask for 1:1."], "st": "awaiting"}, {"id": "drill:sb-stemi", "hash": "d8d38714c4", "title": "Earl Watts, calling Dr. Ng, hospitalist", "body": ["Day 2 after hip surgery. Crushing chest pain for 15 minutes, sweating. 12-lead shows ST elevation in II, III and aVF.", "", "✓ S: This is the nurse for Earl Watts. He has chest pain and the ECG shows ST elevation in II, III and aVF. I think he's having a STEMI.", "- ✗ This is the nurse for Earl Watts. He has crushing chest pain and he's sweating. It started about 15 minutes ago at rest.", "  Why not: Add the ECG: ST elevation in II, III and aVF.", "- ✗ This is the nurse for Earl Watts, hip replacement two days ago. His ECG looks abnormal to me and I'd like you to read it.", "  Why not: Say what's abnormal and that you think it's a STEMI.", "", "✓ B: Hip replacement two days ago, on enoxaparin. Diabetic, smoker. No cardiac history.", "- ✗ Hip replacement two days ago. He's been walking with therapy and his pain is controlled.", "  Why not: Missing the enoxaparin and his cardiac risk factors.", "- ✗ Diabetic and a smoker, no cardiac history. His father had a heart attack at 60.", "  Why not: Add the recent surgery and the enoxaparin; they affect the cath plan.", "", "✓ A: BP 110/64, HR 58, sweaty. Inferior changes. I'm holding nitroglycerin until we check the right side.", "- ✗ He's two days out from a hip replacement. I think it could be a PE given his surgery.", "  Why not: Possible after surgery, but ST elevation in a coronary pattern points to an MI.", "- ✗ BP 110/64, HR 58, sweaty. I think he's having an MI. Should I give nitro from the PRN order?", "  Why not: With inferior changes, ask about a right-sided ECG before nitrates.", "", "✓ R: I'd like the cath lab activated and you here now. Do you want aspirin and a right-sided ECG?", "- ✗ Should I repeat the ECG in 15 minutes and send a troponin to see if it's really his heart?", "  Why not: ST elevation already means activate the cath lab.", "- ✗ His pain is 8 out of 10. Can I give him nitroglycerin for the pain and recheck his pressure?", "  Why not: Possible right ventricular involvement: nitrates can drop his pressure.", "", "✓ ✓: Read back: cath lab activated, aspirin 324 mg chewed, right-sided ECG, no nitro for now. You're coming.", "- ✗ Read back: cath lab activated, aspirin 81 mg chewed, right-sided ECG, no nitro for now. You're on your way.", "  Why not: He said 324 mg, not 81.", "- ✗ Okay, aspirin and ECG. I'll have him ready.", "  Why not: No doses repeated.", "  Provider: \"Activating the cath lab. Aspirin 324 chewed. Right-sided ECG. No nitro for now. I'm on my way.\"", "", "Why: ", "Pearl: Read the ECG out loud: \"ST elevation in II, III, aVF\" gets a STEMI response. With an inferior MI, ask about a right-sided ECG before nitrates."], "st": "awaiting"}, {"id": "drill:sb-h-hit", "hash": "412659b346", "title": "Paul Grady, calling Dr. Reyes, cardiology · NCLEX level", "body": ["Day 7 on a heparin drip after a PE. Platelets 72,000, from 180,000 on admission. New swelling and pain in his right arm.", "", "✓ S: This is the nurse for Paul Grady. I'm worried about HIT: platelets fell from 180,000 to 72,000 on day 7 of heparin, and he has a new swollen right arm.", "- ✗ This is the nurse for Paul Grady, on a heparin drip for a PE. His platelets are 72,000 this morning and I wanted to make sure you'd seen the result.", "  Why not: The number alone doesn't say why it matters. The drop from 180,000, the timing and the new clot make it HIT.", "- ✗ This is the nurse for Paul Grady. His right arm is newly swollen and tender this morning. I think he may have a DVT, even on the heparin drip.", "  Why not: Half the story. A new clot with falling platelets on heparin is HIT until proven otherwise.", "", "✓ B: Admitted for a PE, on a heparin drip since day 1. Platelets were 180,000 on admission. No bleeding.", "- ✗ Admitted for a PE a week ago. History of hypertension and type 2 diabetes, on metformin and amlodipine at home.", "  Why not: Leaves out how long he's been on heparin and his baseline count, the two facts that point to HIT.", "- ✗ His anti-Xa levels have all been in range, so the drip has been therapeutic the whole time.", "  Why not: True, but it doesn't matter for HIT. It's an immune reaction, not a dose problem.", "", "✓ A: A more than 50% drop 5 to 10 days into heparin, with a new clot. I think this is HIT.", "- ✗ With platelets that low, I think the heparin is too much for him and he's at risk of bleeding.", "  Why not: HIT causes clots, not bleeding. The danger here is thrombosis.", "- ✗ He had a low-grade temp yesterday. He may be getting thrombocytopenia from an infection.", "  Why not: Possible, but the timing on heparin and the new clot make HIT the first thing to rule out.", "", "✓ R: I've stopped the heparin. I'd like a non-heparin anticoagulant, a HIT antibody test, and an ultrasound of the arm.", "- ✗ Can we lower the heparin rate by a couple of units and recheck his platelets with tomorrow morning's labs?", "  Why not: Lowering the rate doesn't stop HIT. All heparin stops.", "- ✗ Should I stop the heparin and hold all anticoagulation until the HIT antibody test comes back in a day or two?", "  Why not: Stopping heparin is right, but with HIT and a new clot, he needs a different anticoagulant now. Untreated, clots keep forming.", "", "✓ ✓: Read back: stop all heparin including flushes, start argatroban per protocol, HIT antibody, arm Doppler, heparin allergy flagged.", "- ✗ Read back: stop the heparin drip, start argatroban per protocol, HIT antibody, upper extremity Doppler this morning.", "  Why not: Missed \"including flushes\" and the allergy flag. Small heparin exposures keep HIT going.", "- ✗ Read back: stop all heparin including flushes, start enoxaparin, HIT antibody, arm Doppler, heparin allergy flagged.", "  Why not: Enoxaparin is a heparin. She said argatroban.", "  Provider: \"Stop all heparin, including flushes. Start argatroban per protocol. Send a HIT antibody. Upper extremity Doppler. Flag the allergy.\"", "", "Why: ", "Pearl: HIT: platelets drop by more than half 5 to 10 days into heparin, often with new clots. Stop all heparin (flushes too), start a non-heparin anticoagulant, and list heparin as an allergy."], "st": "awaiting"}, {"id": "drill:sb-h-preE", "hash": "0cea7b3f05", "title": "Tasha Green, calling Dr. Holt, OB · NCLEX level", "body": ["Day 2 after a cesarean, doing well this morning. Now BP 164/112 (rechecked 15 minutes apart), headache 7 of 10, seeing spots.", "", "✓ S: This is the nurse for Tasha Green, day 2 after a cesarean. Severe-range BP 164/112 twice, 15 minutes apart, with a headache and visual changes.", "- ✗ This is the nurse for Tasha Green, day 2 after a cesarean. Her blood pressure is high this afternoon and she has a headache.", "  Why not: No numbers. \"Severe range, twice, 15 minutes apart\" is what starts the treatment clock.", "- ✗ This is the nurse for Tasha Green, day 2 after a cesarean. She has a bad headache and the lights bother her. Can she have something stronger than acetaminophen?", "  Why not: Treating the headache misses that it's a sign of severe preeclampsia.", "", "✓ B: Cesarean two days ago. Blood pressures were normal in pregnancy and this morning. No magnesium given.", "- ✗ G2P2, cesarean two days ago for breech. Breastfeeding well, incision clean, and she's planning to go home tomorrow.", "  Why not: True but not what he needs. Preeclampsia can start after birth even with normal pressures in pregnancy.", "- ✗ She has a history of migraines with aura and says this one feels a lot like those.", "  Why not: Tempting, but a history of migraines doesn't explain a pressure of 164/112. Don't let it anchor the call.", "", "✓ A: I think this is postpartum preeclampsia with severe features. She's at risk of eclampsia and stroke.", "- ✗ She had a spinal for the cesarean. I think it's a post-spinal headache from her anesthesia.", "  Why not: A spinal headache is positional and doesn't cause severe hypertension or visual spots.", "- ✗ Her incision pain is 6 out of 10 and she's worried about the baby. I think it's pain and anxiety raising her pressure.", "  Why not: Pain can raise pressure, but not to 164/112 with visual changes. Assume preeclampsia.", "", "✓ R: I need an antihypertensive within the hour, magnesium for seizure prevention, and preeclampsia labs. Can you come now?", "- ✗ Can I give her pain medicine, let her rest in a dark room, recheck her pressure in an hour, and call if it's still high?", "  Why not: Severe-range pressures confirmed 15 minutes apart need treatment within 30 to 60 minutes, not another hour of watching.", "- ✗ Can we start oral labetalol tonight and recheck her pressure and her labs in the morning?", "  Why not: Treating the pressure is right, but she also needs magnesium and labs, and closer checks than the morning.", "", "✓ ✓: Read back: labetalol 20 mg IV now, BP in 10 minutes, magnesium 4 g load then 2 g/hr, CBC, liver enzymes, creatinine.", "- ✗ Read back: labetalol 20 mg IV now, BP in 10 minutes, magnesium 2 g load then 4 g/hr, CBC, liver enzymes, creatinine.", "  Why not: The magnesium numbers are reversed: 4 g load, then 2 g an hour. Reversed, she'd get a dangerous maintenance rate.", "- ✗ Read back: labetalol 200 mg IV now, BP in 10 minutes, magnesium 4 g load then 2 g/hr, CBC, liver enzymes, creatinine.", "  Why not: 20 mg, not 200. Read back every number.", "  Provider: \"Labetalol 20 mg IV now, repeat BP in 10 minutes. Magnesium 4 gram load, then 2 grams an hour. CBC, liver enzymes, creatinine. I'm coming.\"", "", "Why: ", "Pearl: Preeclampsia can start up to 6 weeks after birth. Severe range is 160 or more systolic, or 110 or more diastolic, confirmed in 15 minutes: treat within the hour and start magnesium."], "st": "awaiting"}, {"id": "drill:sb-h-na", "hash": "168bf25ccc", "title": "Ellen Moore, calling Dr. Patel, hospitalist · NCLEX level", "body": ["Admitted for pneumonia. Now confused and vomited once. Sodium 118, down from 129 yesterday. On a thiazide at home.", "", "✓ S: This is the nurse for Ellen Moore. Her sodium dropped from 129 to 118 in a day, and she's newly confused and vomiting.", "- ✗ This is the nurse for Ellen Moore. The lab just called with a critical sodium of 118 and I'm passing it on.", "  Why not: Add the speed of the drop and the symptoms. A fast drop with neuro signs is an emergency; a slow one without symptoms is not.", "- ✗ This is the nurse for Ellen Moore. She's confused this afternoon and pulling at her gown. I think she may be delirious from being in the hospital.", "  Why not: Delirium is a description, not a cause. The sodium is the cause.", "", "✓ B: Pneumonia. Takes hydrochlorothiazide at home, still ordered here. She's been drinking a lot of water.", "- ✗ Pneumonia, on ceftriaxone and azithromycin, improving on 2 liters. She was oriented yesterday.", "  Why not: Missing the thiazide and the water intake, the likely causes.", "- ✗ She has a history of mild dementia and her daughter says she gets muddled in new places.", "  Why not: Dementia doesn't explain an acute change. Don't let it anchor the call.", "", "✓ A: Symptomatic hyponatremia that fell fast. I'm worried about seizures and brain swelling.", "- ✗ She's vomited today and looks dry. I think she's dehydrated and just needs IV fluids.", "  Why not: Possible contributor, but a sodium of 118 with confusion is the emergency.", "- ✗ Her sodium is low, but she's awake and she's not having seizures, so I think it's stable for now.", "  Why not: Confusion and vomiting are already neuro symptoms. Seizures are what you're trying to prevent.", "", "✓ R: I've held the thiazide and put her on seizure precautions. Can you see her, and do you want hypertonic saline and frequent sodium checks?", "- ✗ She looks dry. Should I give a liter of normal saline quickly to bring the sodium up before the next lab draw?", "  Why not: Correction rate matters. Too fast can cause osmotic demyelination. Let the provider order the solution and the rate.", "- ✗ Should I put her on a one-liter fluid restriction, hold the thiazide, and recheck the sodium in the morning?", "  Why not: A restriction may be part of the plan, but symptomatic sodium of 118 needs active treatment and close checks now.", "", "✓ ✓: Read back: 3% saline 100 mL over 10 minutes, sodium every 2 hours, no more than 8 in 24 hours, thiazide held, seizure precautions.", "- ✗ Read back: 3% saline 100 mL over an hour, sodium every 4 hours, no more than 8 in 24 hours, thiazide held, seizure precautions.", "  Why not: Wrong rate and wrong check frequency: she said over 10 minutes, and sodium every 2 hours.", "- ✗ Read back: normal saline 100 mL over 10 minutes, sodium every 2 hours, no more than 8 in 24 hours, thiazide held.", "  Why not: She ordered 3% saline, not normal saline.", "  Provider: \"3% saline, 100 mL bolus over 10 minutes. Sodium every 2 hours. Don't correct more than 8 in 24 hours. Hold the thiazide. Seizure precautions.\"", "", "Why: ", "Pearl: Hyponatremia: how fast it fell and the symptoms matter more than the number. Correct slowly (usually no more than 6 to 8 mEq/L in 24 hours) to avoid osmotic demyelination."], "st": "awaiting"}, {"id": "drill:sb-h-gib", "hash": "acc7518333", "title": "Walter Kim, calling Dr. Shah, hospitalist · NCLEX level", "body": ["Admitted for a COPD flare. Just vomited 200 mL of coffee-ground material. HR 112, BP 104/66 (baseline 142/80). Takes aspirin and naproxen.", "", "✓ S:
