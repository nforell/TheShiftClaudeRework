<style>
:root{--bg:#E6EDF0;--surface:#FBFCFC;--surface-2:#EDF2F4;--ink:#152238;--ink-2:#4D5A6F;--line:#CAD5DB;--teal:#2449A8;--teal-ink:#fff;--red:#B3342B;--red-bg:#F8E1DE;--good:#2B7249;--good-bg:#E0F0E6;--amber:#A96C0E;--amber-bg:#FBEFD6;
  --serif:"Barlow Condensed","Arial Narrow",sans-serif;--sans:"Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161C;--surface:#1A1F27;--surface-2:#212833;--ink:#E7E4DB;--ink-2:#A0A5AE;--line:#343C48;--teal:#93B4E4;--teal-ink:#0F1B2C;--red:#F0766B;--red-bg:#3b1d1b;--good:#72c692;--good-bg:#16301f;--amber:#E9AE4E;--amber-bg:#35291a}}
:root[data-theme="dark"]{--bg:#12161C;--surface:#1A1F27;--surface-2:#212833;--ink:#E7E4DB;--ink-2:#A0A5AE;--line:#343C48;--teal:#93B4E4;--teal-ink:#0F1B2C;--red:#F0766B;--red-bg:#3b1d1b;--good:#72c692;--good-bg:#16301f;--amber:#E9AE4E;--amber-bg:#35291a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
main{max-width:52rem;margin:0 auto;padding:clamp(1.2rem,5vw,3rem) 16px calc(5rem + env(safe-area-inset-bottom))}
a{color:var(--teal)}
.home{font-family:var(--serif);font-weight:700;font-size:1.1rem;letter-spacing:.04em;text-transform:uppercase;background:var(--ink);color:var(--bg);padding:.28em .55em .22em;border-radius:2px;text-decoration:none}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.9rem,6vw,2.6rem);line-height:1.1;letter-spacing:0;margin:1.6rem 0 .3rem}
h2{font-size:1.15rem;margin:2.4rem 0 .6rem}
h3{font-size:1rem;margin:0}
p{margin:.5rem 0}
.muted{color:var(--ink-2)}
.meta{display:flex;flex-wrap:wrap;gap:.4rem .6rem;margin-top:.6rem}
.chip{display:inline-flex;align-items:center;padding:.15em .6em;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--surface-2);border:1px solid var(--line)}
.chip.awaiting{background:var(--amber-bg);border-color:transparent;color:var(--amber)}
.chip.reviewed{background:var(--good-bg);border-color:transparent;color:var(--good)}
.chip.changed{background:var(--red-bg);border-color:transparent;color:var(--red)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem 1.1rem;margin:.8rem 0}
.how ol{margin:.4rem 0 0;padding-left:1.2rem}.how li{margin:.2rem 0}
label{display:block;font-weight:600;font-size:.9rem;margin:.7rem 0 .25rem}
input[type=text],input[type=email],textarea,select{width:100%;min-height:44px;padding:.5em .7em;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:5rem;resize:vertical}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:0 1rem}
details.pt{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:.6rem 0}
details.pt>summary{cursor:pointer;padding:.85rem 1rem;font-weight:600;list-style-position:inside}
details.pt>div{padding:0 1rem 1rem}
table{width:100%;border-collapse:collapse;font-size:.88rem;margin:.4rem 0}
th,td{text-align:left;vertical-align:top;padding:.35rem .5rem .35rem 0;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--ink-2);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
.scroll{overflow-x:auto}
ul.plain{margin:.3rem 0;padding-left:1.1rem}
.dec{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:.85rem 1rem;margin:.6rem 0}
.dec.pos{border-left-color:var(--good)}.dec.neg{border-left-color:var(--red)}
.dec .top{display:flex;flex-wrap:wrap;gap:.3rem .5rem;align-items:center;font-size:.78rem;color:var(--ink-2);font-weight:600}
.pts{font-weight:700;padding:.05em .45em;border-radius:4px;background:var(--surface-2)}
.pos .pts{color:var(--good);background:var(--good-bg)}.neg .pts{color:var(--red);background:var(--red-bg)}
.dec b{display:block;margin:.35rem 0 .15rem;font-size:1rem}
.dec .why{font-family:var(--sans);color:var(--ink-2);margin:0}
.dec .src{font-size:.75rem;color:var(--ink-2);margin-top:.35rem}
.verdict{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.7rem}
.verdict button{min-height:40px;padding:.35em .9em;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer}
.verdict button[aria-pressed="true"][data-v="ok"]{background:var(--good);border-color:var(--good);color:var(--teal-ink)}
.verdict button[aria-pressed="true"][data-v="fix"]{background:var(--red);border-color:var(--red);color:var(--teal-ink)}
.verdict button[aria-pressed="true"][data-v="unsure"]{background:var(--amber);border-color:var(--amber);color:var(--teal-ink)}
.dec textarea{margin-top:.5rem;min-height:3.6rem}
.opt{padding:.4rem 0;border-bottom:1px solid var(--line);font-size:.92rem}.opt:last-child{border:0}
.opt i{font-style:normal;font-weight:700;font-size:.75rem;padding:.05em .4em;border-radius:4px;margin-right:.4rem;background:var(--surface-2)}
.bar{position:sticky;top:0;z-index:5;margin:0 -16px;padding:.6rem 16px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:.6rem;font-size:.9rem}
.bar .prog{display:block;flex:1;min-width:4rem;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;max-width:12rem}.bar .prog i{display:block;height:100%;background:var(--teal)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:.55em 1.2em;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn-primary{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.row{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1rem}
.check{display:flex;gap:.6rem;align-items:flex-start;font-weight:500;margin-top:1rem}
.check input{width:1.2rem;height:1.2rem;margin-top:.2rem;flex:none}
.msg{margin-top:.8rem;font-weight:600}.msg.err{color:var(--red)}.msg.ok{color:var(--good)}
pre{white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:.8rem;font-size:.8rem;max-height:18rem;overflow:auto}
.shifts a{display:block;text-decoration:none;color:inherit}
.shifts .card:hover{border-color:var(--ink-2)}
</style>
<style>.item .body p{margin:.15rem 0}.item .body .why{color:var(--ink-2);font-size:.92rem;margin:0 0 .35rem 1.1rem}.item .body .ok b{display:inline;margin:0;color:var(--good)}.item .body .no{color:var(--ink)}.item .body .sp{height:.5rem}.item>b{margin-bottom:.5rem}</style></head>

er.", "✓ Follow the POLST orders, notify the provider of the daughter's request, and stay with the daughter to offer support", "  Yes: a valid POLST is an actionable medical order reflecting the client's own wishes. The nurse honors it, involves the provider, and supports the distressed family member.", "- Ask the daughter to sign a form requesting full treatment", "  No: the daughter is not the health care agent, and her signature cannot revoke the client's POLST. Only the client or her legal decision-maker can change it.", "- Prepare for intubation because a family member at the bedside has requested it, and review the POLST with the family afterward", "  No: a family member who is not the decision-maker cannot override the client's documented wishes. Intubating against a valid POLST violates the client's autonomy.", "", "Why: A POLST, or similar state form such as a MOLST, translates a seriously ill client's wishes into portable medical orders. The nurse follows the orders, notifies the provider, and involves the legal decision-maker and, if needed, an ethics consult. Supporting the grieving daughter is part of the nurse's role, but her wishes do not override the client's. Names and details of these forms vary by state.", "Tip: Advance directives and POLST orders reflect the client's wishes, so honor them unless the client or the legal decision-maker changes them."], "st": "awaiting"}, {"id": "ngn:qb-mgmt-22", "hash": "23c0b67dea", "title": "Mass casualty triage · Prioritize hypotheses", "body": ["A bus crash brings many injured people to the scene outside a rural emergency department. The nurse is helping triage with the START system: anyone who can walk is tagged minor; then respirations, perfusion and mental status are checked.", "", "For each person, indicate the triage category the nurse should assign.", "", "- Walking, with a forearm laceration and controlled bleeding → Minor (green)", "  anyone who can walk to the collection point is tagged minor at first and reassessed later.", "- Cannot walk, RR 34, follows commands → Immediate (red)", "  a respiratory rate over 30 meets START criteria for immediate care because it signals respiratory compromise.", "- Cannot walk, RR 20, radial pulse absent, capillary refill 4 seconds → Immediate (red)", "  no radial pulse or capillary refill over 2 seconds shows poor perfusion and possible shock, which is immediate.", "- Cannot walk, RR 24, radial pulse present, does not follow simple commands → Immediate (red)", "  not following simple commands suggests a head injury or shock, so this person is tagged immediate.", "- Open lower leg fracture, cannot walk, RR 22, radial pulse present, follows commands → Delayed (yellow)", "  breathing, perfusion and mental status are adequate, so this serious but stable injury can wait. The trap is tagging the most dramatic injury red.", "- Walking, crying and anxious, with a swollen wrist → Minor (green)", "  emotional distress and a likely wrist fracture in a walking person are minor; this person can help others or wait.", "", "Why: In a mass casualty event the goal shifts to doing the greatest good for the greatest number. START sorts people quickly by ability to walk, then breathing rate, perfusion and ability to follow commands. Dramatic injuries with stable vital functions are delayed, while subtle signs of compromise are immediate.", "Tip: In disaster triage, use the criteria (RPM: respirations, perfusion, mental status), not how bad the injury looks."], "st": "awaiting"}, {"id": "ngn:qb-mgmt-26", "hash": "963eabc718", "title": "EHR downtime · Generate solutions", "body": ["At 14:00 the electronic health record goes down without warning in a busy emergency department. The charge nurse announces that downtime procedures are in effect.", "", "For each action, indicate whether it is appropriate or not appropriate during the downtime.", "", "- Use the paper downtime forms and the most recent downtime medication report to give scheduled medications → Appropriate", "  downtime reports and paper forms keep a reliable record of what is due and what was given.", "- Give medications based on what the nurse remembers was due → Not appropriate", "  memory is unreliable and risks missed or double doses. The nurse uses the printed downtime medication record.", "- Write telephone orders on the paper order form and read them back to the prescriber → Appropriate", "  orders still need to be written and verified with a read-back; only the method of recording changes.", "- Text photos of client information to the provider from a personal phone → Not appropriate", "  personal phones and texting are not secure and can breach client confidentiality. Use approved communication methods.", "- Hold all lab draws until the system is back up → Not appropriate", "  care cannot stop during downtime. Paper requisitions and downtime labels allow labs to continue.", "- Enter the paper documentation into the EHR after it is restored, per facility policy → Appropriate", "  back-entering paper records keeps the electronic record complete and accurate, with the actual times of care.", "", "Why: During EHR downtime, care continues using the facility's paper forms and printed downtime reports. Usual safety practices, such as read-back of orders and protecting confidentiality, still apply. When the system returns, staff enter the paper documentation according to policy.", "Tip: During downtime, keep every safety practice the same and change only the tool used to record care."], "st": "awaiting"}, {"id": "ngn:qb-safe-4", "hash": "5710b36d7d", "title": "Airborne precautions for TB · Generate solutions", "body": ["A 46-year-old comes to the emergency department with a productive cough for 4 weeks, night sweats, a 6 kg (13 lb) weight loss and blood-streaked sputum. He has been staying in a shelter. T 38.1 °C (100.6 °F), HR 98, RR 20, SpO₂ 95% on room air.", "", "Which isolation plan is most appropriate for this client?", "", "- Place the client in a private room with the door open and have staff wear surgical masks", "  No: this is droplet precautions. TB spreads by tiny airborne particles that stay suspended, so staff need N95 respirators and negative-pressure air handling.", "- Place the client on contact precautions and have staff wear a gown and gloves", "  No: TB is not spread by touch. The trap is choosing the most common isolation type instead of matching the route of transmission.", "✓ Place a surgical mask on the client, move him to an airborne infection isolation room, and have staff wear fit-tested N95 respirators", "  Yes: suspected pulmonary TB requires a negative-pressure room and N95 respirators for staff. A surgical mask on the client contains droplet nuclei until he is in the room.", "- Keep the client in the waiting room with a surgical mask until his sputum results return", "  No: waiting for results exposes everyone in the waiting room. Isolation starts on suspicion, not confirmation.", "", "Why: Cough lasting weeks with night sweats, weight loss and hemoptysis in a client from a congregate setting suggests pulmonary TB. Airborne precautions require an airborne infection isolation room with negative pressure, the door closed, and fit-tested N95 respirators for staff. The client wears a surgical mask whenever he is outside that room.", "Tip: Match the precaution to the route: measles, varicella and TB are the classic airborne diseases that need a negative-pressure room and an N95."], "st": "awaiting"}, {"id": "ngn:qb-safe-12", "hash": "9a41489b87", "title": "Needlestick exposure · Take action", "body": ["An emergency department nurse gives an IM injection to a 38-year-old with unknown HIV and hepatitis status. While activating the safety device, she sticks her finger with the used needle. The wound is bleeding slightly.", "", "Which action should the nurse take first?", "", "- Ask the provider to order HIV and hepatitis tests on the client", "  No: source testing is part of the follow-up, but first aid to the wound comes first, then reporting the exposure right away.", "- Soak the finger in bleach solution", "  No: caustic agents such as bleach are not recommended for skin; they injure tissue without lowering infection risk.", "✓ Wash the puncture site with soap and water", "  Yes: immediate washing with soap and water is the first step after a percutaneous exposure. It reduces the amount of blood and virus at the site.", "- Squeeze the finger to make the wound bleed more", "  No: squeezing has no proven benefit and may damage tissue. The trap is a common folk practice that is not recommended.", "", "Why: After a needlestick, the nurse washes the site with soap and water, then reports the exposure immediately to the supervisor and employee health. Source testing and evaluation for postexposure prophylaxis follow. HIV prophylaxis works best when started as soon as possible, ideally within hours.", "Tip: For exposure questions, first aid to the site comes first, then report, then testing and treatment."], "st": "awaiting"}, {"id": "ngn:qb-hp-8", "hash": "b2cf6e9c40", "title": "Stages of labor · Analyze cues", "body": ["A 24-year-old, G2P1, at 39 weeks arrives at the emergency department saying she needs to push. Contractions are every 2 minutes, lasting 60 seconds. Her membranes ruptured 1 hour ago with clear fluid. The provider's exam shows the cervix is 10 cm dilated and the fetal head is visible with pushing.", "", "Complete the sentences.", "", "Blank 1:", "✓ second stage", "  Yes: the second stage begins at full cervical dilation of 10 cm, which matches her exam and her urge to push.", "- first stage", "  No: the first stage is cervical dilation from onset of labor to 10 cm; she is already fully dilated.", "- third stage", "  No: the third stage begins after the newborn is born, and her baby has not been born yet.", "Blank 2:", "✓ the birth of the newborn", "  Yes: the second stage is the pushing and birth stage; it ends when the newborn is delivered.", "- delivery of the placenta", "  No: delivery of the placenta ends the third stage, which follows the birth.", "- full cervical dilation", "  No: full cervical dilation ends the first stage and is where the second stage begins.", "Blank 3:", "- third stage", "  No: the third stage ends when the placenta is delivered, so the recovery period that follows is not part of it.", "✓ fourth stage", "  Yes: the fourth stage is the immediate recovery period, when the risk of postpartum hemorrhage is highest and assessment is frequent.", "- latent phase", "  No: the latent phase is the early part of the first stage, with slow cervical change before active labor.", "", "Why: Labor has four stages. The first stage is cervical dilation to 10 cm, the second ends with birth, the third ends with delivery of the placenta, and the fourth is the first hours of recovery. This client is fully dilated and pushing, so birth may be imminent and the nurse prepares for delivery in the ED.", "Tip: Anchor each stage to the event that ends it: 10 cm, baby, placenta, then recovery."], "st": "awaiting"}, {"id": "ngn:qb-pharm-15", "hash": "af9e75c196", "title": "Lithium toxicity · Analyze cues", "body": ["A 34-year-old with bipolar disorder takes lithium 300 mg three times daily. After 3 days of vomiting and diarrhea she arrives at the ED with a coarse hand tremor, an unsteady gait, slurred speech and confusion. Her lithium level is 2.2 mEq/L.", "", "The nurse recognizes that these findings are most consistent with which condition?", "", "- Expected adverse effects at a therapeutic level", "  No: A fine hand tremor can occur at therapeutic levels, but a coarse tremor, ataxia and confusion cannot. The level is also clearly high.", "✓ Lithium toxicity", "  Yes: The level is well above the usual maintenance range of 0.6 to 1.2 mEq/L, and coarse tremor, ataxia, slurred speech and confusion are classic toxicity signs.", "- Serotonin syndrome", "  No: Serotonin syndrome follows serotonergic drugs and causes hyperthermia, clonus and agitation. Nothing in the stem suggests it.", "- An acute manic episode", "  No: Mania causes racing thoughts and high energy, not ataxia, slurred speech and a lithium level of 2.2 mEq/L.", "", "Why: Lithium has a narrow therapeutic range and is cleared by the kidneys along with sodium. Vomiting and diarrhea cause dehydration and sodium loss, so the kidneys hold onto lithium and the level rises. Hold lithium, notify the provider and expect IV fluids; severe cases may need dialysis.", "Tip: For lithium, connect any cause of fluid or sodium loss to a rising level."], "st": "awaiting"}, {"id": "ngn:qb-risk-5", "hash": "7a700ef6de", "title": "Contrast CT and metformin · Generate solutions", "body": ["A 64-year-old in the emergency department is scheduled for a CT of the abdomen with IV iodinated contrast. She takes metformin 1,000 mg twice daily; her last dose was at 08:00. Her creatinine today is 1.5 mg/dL, up from 0.9 mg/dL 3 days ago, and her eGFR is 38 mL/min/1.73 m².", "", "Complete the sentences.", "", "Blank 1:", "- cancel the scan because metformin is a contraindication to contrast", "  No: Metformin does not rule out the scan; it is held. The nurse does not cancel a provider's diagnostic order.", "✓ notify the provider about the metformin and the eGFR so further doses are held", "  Yes: With reduced and worsening kidney function, metformin is held at the time of the contrast study, and the provider must write the order and plan.", "- give the evening metformin dose a few hours early so it clears before the scan", "  No: Giving more metformin before contrast is the opposite of what is needed when kidney function is already reduced.", "Blank 2:", "- hypoglycemia", "  No: Metformin alone rarely causes hypoglycemia; the trap is linking every diabetes drug to low blood sugar.", "✓ lactic acidosis", "  Yes: Metformin is cleared by the kidneys; if contrast injures them, the drug accumulates and can cause lactic acidosis, a rare but often fatal complication.", "- hyperkalemia", "  No: Contrast can worsen kidney function, but the specific danger of combining it with metformin is lactic acidosis.", "Blank 3:", "- the same evening once she is eating and drinking normally again", "  No: Restarting before kidney function is rechecked could cause metformin buildup if the contrast caused injury.", "✓ 48 hours after the scan if repeat kidney function is stable", "  Yes: Kidney function is rechecked about 48 hours after contrast, and metformin resumes only if it is stable.", "- after 7 days regardless of lab results", "  No: The restart depends on kidney function, not a fixed waiting period.", "", "Why: Iodinated contrast can cause acute kidney injury, and metformin is cleared by the kidneys. In a client with an eGFR below 45 or acute kidney injury, metformin is held at the time of the study and restarted after kidney function is rechecked and stable, usually 48 hours later. The nurse also checks for contrast allergy and supports hydration as ordered.", "Tip: When a drug is cleared by the kidneys, look for any test or treatment that could injure the kidneys."], "st": "awaiting"}, {"id": "ngn:qb-risk-8", "hash": "cd2e6fe359", "title": "Thoracentesis complications · Evaluate outcomes", "body": ["A 68-year-old had 1,000 mL of fluid removed from the right pleural space by thoracentesis 30 minutes ago in the emergency department. Before the procedure: RR 26, SpO₂ 91% on 2 L nasal cannula.", "", "Which finding indicates a complication that requires immediate follow-up?", "", "✓ Sudden sharp right chest pain with absent breath sounds on the right", "  Yes: These are signs of pneumothorax from the needle entering the lung. It needs immediate provider notification and a chest X-ray.", "- Mild soreness at the puncture site rated 2/10", "  No: Mild local soreness is expected after a needle procedure and does not signal a complication.", "- A small amount of serous drainage on the dressing over the puncture site", "  No: Scant clear drainage at the puncture site is expected. Report bloody or increasing drainage.", "- RR 20 and SpO₂ 95% on 2 L", "  No: Breathing and oxygenation improved after fluid removal, which is the expected outcome of the procedure.", "", "Why: After thoracentesis, the nurse compares findings to the pre-procedure baseline. Improved breathing and oxygenation show the procedure worked. Sudden pain with absent breath sounds on the procedure side suggests pneumothorax, which is the key complication to watch for, along with bleeding and re-expansion pulmonary edema.", "Tip: When evaluating a procedure, separate the expected effects from the new, sudden finding that signals a complication."], "st": "awaiting"}, {"id": "ngn:qb-phys-1", "hash": "6086e7b7a9", "title": "Status epilepticus · Generate solutions", "body": ["A 34-year-old with a seizure disorder is brought to the emergency department having a generalized tonic-clonic seizure. The paramedics report it started 7 minutes ago and has not stopped. The client is on her side with oxygen by nonrebreather mask, and an IV is in place. Fingerstick glucose is 104 mg/dL.", "", "Which medication should the nurse prepare to give first?", "", "- Fosphenytoin IV", "  No: fosphenytoin is a second-line drug given after a benzodiazepine to prevent recurrence. The trap is choosing a seizure drug that is not the fastest to act.", "- Dextrose 50% IV", "  No: the glucose is 104 mg/dL, so hypoglycemia is not causing the seizure and dextrose will not stop it.", "✓ Lorazepam IV", "  Yes: a seizure lasting 5 minutes or longer is status epilepticus, and an IV benzodiazepine is first-line therapy to stop it.", "- Haloperidol IM", "  No: haloperidol is an antipsychotic that can lower the seizure threshold; it has no role in stopping a seizure.", "", "Why: A seizure that lasts 5 minutes or longer, or repeated seizures without recovery between them, is status epilepticus. Prolonged seizure activity causes hypoxia and brain injury, so it is treated as an emergency. An IV benzodiazepine such as lorazepam comes first, followed by a longer-acting antiseizure drug.", "Tip: For drug-sequence questions, ask which drug acts fastest on the immediate threat, then which one prevents it from coming back."], "st": "awaiting"}, {"id": "ngn:qb-phys-3", "hash": "d131821a67", "title": "Stable SVT · Take action", "body": ["A 27-year-old comes to the emergency department with a pounding heartbeat that started suddenly 30 minutes ago. The monitor shows a regular narrow-complex tachycardia at 192. BP 122/78, RR 18, SpO₂ 98% on room air. She is alert, oriented and denies chest pain or shortness of breath. An IV is in place.", "", "Which action should the nurse take first?", "", "- Prepare to defibrillate", "  No: defibrillation is only for pulseless VT or VF. Shocking an organized rhythm with a pulse without synchronization can cause VF.", "- Give adenosine 6 mg rapid IV push followed by a saline flush", "  No: adenosine is the next step if vagal maneuvers fail. It is correct therapy but not the first action for a stable client.", "✓ Coach her to perform a vagal maneuver, such as bearing down as if having a bowel movement", "  Yes: she is stable, so vagal maneuvers are tried first. Vagal stimulation slows AV node conduction and can end the rhythm without drugs.", "- Prepare for synchronized cardioversion", "  No: cardioversion is for SVT with instability such as hypotension, chest pain or altered mental status. Her BP and mental status are normal.", "", "Why: Treatment of SVT depends on stability. A stable client gets vagal maneuvers first, then adenosine 6 mg rapid IV push, then 12 mg if needed. An unstable client gets synchronized cardioversion. Her normal BP and mental status make her stable.", "Tip: With any tachycardia, decide stable or unstable first; the least invasive effective step goes first for a stable client."], "st": "awaiting"}, {"id": "ngn:qb-phys-5", "hash": "19089de17c", "title": "Diabetic ketoacidosis · Prioritize hypotheses", "body": ["A 22-year-old with type 1 diabetes comes to the emergency department after 2 days of vomiting. She ran out of insulin 3 days ago. Breathing is deep and rapid, and her breath smells fruity. HR 124, BP 98/60, RR 30. Labs: glucose 486 mg/dL, pH 7.16, bicarbonate 9 mEq/L, potassium 5.2 mEq/L, serum ketones positive.", "", "Complete the diagram: the condition the client is most likely experiencing, two actions the nurse should take, and two parameters to monitor.", "", "Condition:", "✓ Diabetic ketoacidosis", "  Yes: high glucose with acidosis, low bicarbonate, ketones and Kussmaul breathing in a client with type 1 diabetes who missed insulin is DKA.", "- Hyperosmolar hyperglycemic state", "  No: HHS usually occurs in type 2 diabetes with glucose often above 600 mg/dL and little or no ketosis or acidosis.", "- Hypoglycemia", "  No: her glucose is 486 mg/dL. Hypoglycemia causes shakiness and sweating, not ketones and acidosis.", "- Thyroid storm", "  No: thyroid storm causes fever, tachycardia and agitation, but not ketoacidosis with a glucose of 486 mg/dL.", "Actions to take:", "✓ Infuse 0.9% sodium chloride IV as ordered", "  Yes: DKA causes severe fluid loss from osmotic diuresis and vomiting, so isotonic fluid replacement comes first to restore perfusion.", "✓ Start a continuous IV regular insulin infusion as ordered once potassium is confirmed at 3.5 mEq/L or higher", "  Yes: IV regular insulin stops ketone production. Potassium is checked first because insulin drives potassium into cells and can cause dangerous hypokalemia.", "- Give sodium bicarbonate IV push", "  No: bicarbonate is not routine in DKA and is reserved for very severe acidosis, about pH below 7.0. Insulin and fluids correct the acidosis.", "- Give insulin glargine subcutaneously as the only insulin", "  No: long-acting subcutaneous insulin alone is absorbed too slowly and unpredictably to treat DKA in a client who is volume depleted.", "- Give 50 mL of 50% dextrose IV", "  No: her glucose is already very high. Dextrose is added to the IV fluid later, when glucose falls toward 250 mg/dL, not given as a bolus now.", "Parameters to monitor:", "✓ Serum potassium", "  Yes: potassium shifts into cells as insulin and fluids work, so a normal or high level can fall fast and cause dysrhythmias.", "✓ Blood glucose every hour", "  Yes: hourly glucose guides the insulin rate and tells the team when to add dextrose so the glucose does not drop too quickly.", "- Hemoglobin A1C", "  No: A1C shows control over the past 3 months; it does not change minute-to-minute management of DKA.", "- Serum lipase", "  No: lipase is used to evaluate pancreatitis and is not a marker of DKA treatment response.", "- Peak expiratory flow", "  No: peak flow measures airflow in asthma; her rapid breathing is a compensation for metabolic acidosis, not airway obstruction.", "", "Why: Missed insulin, hyperglycemia, ketones, low bicarbonate and Kussmaul respirations make this DKA. Treatment is IV isotonic fluid, then an IV regular insulin infusion once potassium is at least 3.5 mEq/L, with potassium replaced as it falls. Glucose and potassium are checked often because both change quickly with treatment.", "Tip: In DKA, remember that insulin lowers potassium; any answer about starting insulin must account for the potassium level."], "st": "awaiting"}, {"id": "ngn:qb-phys-15", "hash": "4df21b2428", "title": "Acute asthma exacerbation · Generate solutions", "body": ["An 8-year-old with asthma is brought to the emergency department with an exacerbation after a cold. She is sitting upright, speaking in short phrases, with intercostal retractions and expiratory wheezes. RR 36, HR 132, SpO₂ 90% on room air. She is frightened and crying.", "", "For each potential intervention, indicate whether it is indicated or not indicated for this client.", "", "- Inhaled albuterol by nebulizer → Indicated", "  a short-acting beta-2 agonist quickly relaxes airway smooth muscle and is first-line treatment for an acute exacerbation.", "- Systemic corticosteroid, such as oral prednisolone → Indicated", "  steroids reduce the airway inflammation that drives the attack; benefit starts within hours, so they are given early.", "- Supplemental oxygen to correct her SpO₂ → Indicated", "  her saturation is 90%, and hypoxemia worsens anxiety and work of breathing.", "- Lorazepam to reduce her anxiety → Not indicated", "  sedatives depress the respiratory drive; anxiety here comes from air hunger and improves as breathing improves.", "- Position her flat in bed to rest → Not indicated", "  lying flat limits chest expansion. She chose to sit upright because it eases breathing.", "- Ipratropium nebulized with the albuterol → Indicated", "  adding an anticholinergic to albuterol improves bronchodilation in moderate to severe exacerbations treated in the emergency department.", "", "Why: Treatment of an acute asthma exacerbation targets bronchospasm and inflammation: inhaled short-acting bronchodilators, ipratropium for moderate to severe attacks, systemic corticosteroids and oxygen. Sedatives are avoided because they suppress breathing. Upright positioning helps the client breathe.", "Tip: Rule out any intervention that suppresses breathing or limits chest expansion for a client in respiratory distress."], "st": "awaiting"}, {"id": "ngn:qb-psy-6", "hash": "2f954cde7f", "title": "Escalating agitation · Recognize cues", "body": ["A 35-year-old is in the emergency department waiting for a psychiatric evaluation. Nurse's note, 15:20.", "", "Highlight the findings that indicate the client's agitation is escalating.", "", "✓ highlight Pacing the hallway and refusing to sit down.", "  Yes: increased motor activity such as pacing is an early sign of rising tension that calls for de-escalation.", "✓ highlight Voice getting louder, swearing at staff.", "  Yes: a rising voice and verbal hostility show escalating agitation and can come before physical aggression.", "✓ highlight Fists clenched and jaw tight.", "  Yes: clenched fists and muscle tension are physical signs that the client may be preparing to act out.", "- Has been waiting for 3 hours.", "  No: a long wait may explain his frustration, but it is a context detail, not a sign of escalation.", "- Ate a sandwich at 12:00.", "  No: eating is a routine detail and does not describe his current behavior.", "- Oriented to person, place and time.", "  No: orientation is a normal finding and does not indicate rising agitation.", "", "Why: Escalation is usually visible before violence: pacing, a rising voice, swearing, clenched fists and a tense posture. Recognizing these cues early lets the nurse use verbal de-escalation, reduce stimulation and offer choices before restraint or medication is needed.", "Tip: Highlight what the client is doing now that shows tension rising; leave out background facts that only explain why."], "st": "awaiting"}, {"id": "ngn:qb-psy-9", "hash": "d5b73956bd", "title": "Opioid withdrawal · Prioritize hypotheses", "body": ["A 31-year-old comes to the emergency department asking for help to stop using fentanyl. He last used 14 hours ago. He is yawning, has a runny nose and watery eyes, and reports stomach cramps and diarrhea. Pupils are 6 mm. Goosebumps are visible on his arms. HR 104, BP 142/88, T 37.3 °C (99.1 °F).", "", "Complete the sentences.", "", "Blank 1:", "- stimulant intoxication", "  No: stimulants can dilate pupils and raise HR, but they do not cause yawning, tearing, goosebumps and diarrhea.", "✓ opioid withdrawal", "  Yes: yawning, runny nose, tearing, dilated pupils, goosebumps and GI cramping after stopping fentanyl are classic opioid withdrawal.", "- alcohol withdrawal", "  No: alcohol withdrawal causes tremor, sweating and agitation, and he reports fentanyl, not alcohol use.", "Blank 2:", "- not treatable until all symptoms have resolved", "  No: symptoms are treatable now; untreated withdrawal raises the chance he returns to use and overdoses.", "✓ very uncomfortable but rarely life threatening in a healthy adult", "  Yes: opioid withdrawal is distressing, but in an otherwise healthy adult it is rarely fatal unless dehydration becomes severe.", "- the withdrawal most likely to cause seizures and delirium tremens", "  No: seizures and delirium tremens are risks of alcohol or benzodiazepine withdrawal, not opioid withdrawal.", "Blank 3:", "✓ buprenorphine", "  Yes: buprenorphine relieves withdrawal and starts treatment for opioid use disorder. It is given per prescriber protocol once withdrawal is objectively moderate; after fentanyl, starting too early can precipitate withdrawal.", "- naloxone", "  No: naloxone reverses opioids and would make his withdrawal much worse. It is used for overdose, not withdrawal.", "- lorazepam", "  No: benzodiazepines are the treatment for alcohol withdrawal; they do not treat opioid withdrawal and add sedation risk.", "", "Why: Opioid withdrawal looks like a bad flu: yawning, runny nose, tearing, dilated pupils, goosebumps, cramps and diarrhea. It is miserable but rarely fatal, unlike alcohol withdrawal. Buprenorphine is started per prescriber protocol once withdrawal is objectively moderate (for example by a COWS score), because fentanyl lingers in tissue and an early dose can precipitate sudden, severe withdrawal. Buprenorphine also begins treatment for opioid use disorder and lowers overdose risk.", "Tip: Link withdrawal symptoms to the opposite of the drug's effects: opioids constrict pupils and slow the gut, so withdrawal does the reverse."], "st": "awaiting"}, {"id": "ngn:sa-psych-3", "hash": "f7370c9b65", "title": "Elder abuse cues · Recognize cues", "body": ["Emergency department triage note for an 82-year-old woman with moderate dementia, brought in by her adult grandson, who is her live-in caregiver.", "", "Highlight the findings that suggest possible elder abuse or neglect.", "", "✓ highlight Grandson answers every question for her and refuses to leave the room.", "  Yes: a controlling caregiver who will not let the client speak alone is a common warning sign. The nurse should find a way to interview her privately.", "✓ highlight Bruises in different stages of healing on both upper inner arms.", "  Yes: bruises of different ages on the inner arms suggest repeated grabbing. Accidental falls usually injure bony areas.", "✓ highlight She says she fell \"a few days ago\"; the grandson says she fell this morning.", "  Yes: a history that changes or does not match is a red flag for abuse. Document both accounts in their own words.", "✓ highlight Stage 3 pressure injury on the sacrum; clothing soiled with dried urine.", "  Yes: an advanced pressure injury and poor hygiene in a dependent adult suggest caregiver neglect.", "- History of osteoarthritis in both knees.", "  No: osteoarthritis is common at her age. It explains joint pain and fall risk but is not a sign of abuse.", "- Takes donepezil daily for dementia.", "  No: this is standard dementia treatment and not a warning sign by itself.", "- Uses a walker at home.", "  No: a walker is an expected mobility aid for an older adult with arthritis.", "", "Why: Elder abuse cues include a controlling caregiver, injuries in unusual places or different stages of healing, inconsistent histories and signs of neglect. Dependence from dementia raises her risk. Nurses must report suspected elder abuse according to state law; proof is not required.", "Tip: Look for mismatches: injuries that do not fit the story, and a caregiver who controls the conversation."], "st": "awaiting"}, {"id": "ngn:sa-psych-6", "hash": "5ed0496594", "title": "Naloxone and buprenorphine teaching · Evaluate outcomes", "body": ["A 31-year-old was treated in the emergency department for an opioid overdose and is ready for discharge with a naloxone nasal spray kit and a referral for buprenorphine treatment. The nurse evaluates the client's understanding of the teaching.", "", "Which statements by the client indicate understanding of the teaching? Select all that apply.", "", "✓ \"If I don't wake up in 2 to 3 minutes, a second spray can go in the other nostril.\"", "  Yes: repeat doses are given every 2 to 3 minutes, alternating nostrils, until breathing improves or help arrives. Strong opioids such as fentanyl may need more than one.", "✓ \"My tolerance is lower after a few days without using, so my usual amount could kill me.\"", "  Yes: tolerance falls quickly after a period without use. Overdose risk is very high when someone returns to a previous dose.", "✓ \"I should never use alone.\"", "  Yes: having another person present means someone can give naloxone and call for help. This is a key harm reduction step.", "✓ \"If I won't wake up, my roommate should spray the naloxone in my nose and call 911.\"", "  Yes: naloxone is given by the person nearby, and emergency help is always called. This shows correct understanding.", "- \"Buprenorphine just swaps one addiction for another, so I'll quit cold turkey instead.\"", "  No: medication for opioid use disorder lowers overdose death and relapse. Stopping without treatment carries high relapse and overdose risk.", "- \"Once I wake up after naloxone, I'm safe to stay home alone.\"", "  No: naloxone wears off before many opioids do, so breathing can slow again. Someone must stay with the client and get medical care.", "", "Why: Effective teaching after an overdose covers how bystanders give naloxone, repeat doses, calling 911 and staying with the person. It also covers the risk of lost tolerance and never using alone. Medication for opioid use disorder is evidence-based treatment, not a substitute addiction.", "Tip: In teaching evaluation items, choose the statements that would keep the client alive if acted on."], "st": "awaiting"}, {"id": "ngn:sa-phys-1", "hash": "1a8b6cb4a8", "title": "Hyperosmolar hyperglycemic state · Prioritize hypotheses", "body": ["An 81-year-old with type 2 diabetes is brought from a nursing home with 4 days of increasing thirst and new confusion. HR 118, BP 94/56, mucous membranes dry. Glucose 940 mg/dL, serum osmolality 352 mOsm/kg, pH 7.37, HCO₃ 23 mEq/L, urine ketones negative, K 4.2 mEq/L, BUN 52 mg/dL, creatinine 2.1 mg/dL.", "", "Complete the diagram: the condition the client is most likely experiencing, two actions the nurse should take, and two parameters to monitor.", "", "Condition:", "✓ Hyperosmolar hyperglycemic state", "  Yes: extreme glucose, high osmolality, a normal pH and no ketones in an older adult with type 2 diabetes is HHS.", "- Diabetic ketoacidosis", "  No: DKA causes a pH under 7.3, a low bicarbonate and ketones. This pH and bicarbonate are normal.", "- Diabetes insipidus", "  No: diabetes insipidus causes dilute urine and high sodium, but the glucose is normal.", "- Hypoglycemia", "  No: the glucose is 940 mg/dL. Confusion here comes from hyperosmolality, not a low glucose.", "Actions to take:", "✓ Begin IV 0.9% sodium chloride as prescribed", "  Yes: severe dehydration is the main problem in HHS. Isotonic fluid restores volume and lowers glucose by itself.", "✓ Start a continuous IV regular insulin infusion as prescribed after fluids are underway", "  Yes: an IV regular insulin infusion lowers glucose gradually once fluid replacement has started.", "- Give insulin glargine subcutaneously now", "  No: subcutaneous long-acting insulin absorbs poorly in a dehydrated client and cannot be titrated.", "- Give sodium bicarbonate IV", "  No: the pH is normal. Bicarbonate is not indicated.", "- Restrict fluids to prevent cerebral edema", "  No: this client is profoundly dehydrated. Fluid restriction would worsen shock and kidney injury.", "Parameters to monitor:", "✓ Blood glucose", "  Yes: glucose is checked hourly and lowered gradually to prevent rapid shifts in osmolality.", "✓ Serum potassium", "  Yes: insulin moves potassium into cells, so potassium can drop fast and cause dysrhythmias.", "- Hemoglobin A1c", "  No: A1c reflects long-term control and does not guide acute treatment.", "- Serum amylase", "  No: amylase reflects pancreatic injury and is not part of this picture.", "- Serum calcium", "  No: calcium is not a key monitoring value in HHS treatment.", "", "Why: HHS develops slowly in older adults with type 2 diabetes who still make enough insulin to prevent ketosis. The result is extreme hyperglycemia, hyperosmolality and severe dehydration. Treatment is aggressive isotonic fluid, then an insulin infusion, with close glucose, potassium and neurologic monitoring.", "Tip: To separate DKA from HHS, look at the pH and ketones; a normal pH with no ketones and a sky-high glucose is HHS."], "st": "awaiting"}, {"id": "ngn:sa-phys-3", "hash": "b5b9025009", "title": "Adrenal crisis cues · Recognize cues", "body": ["A 45-year-old with rheumatoid arthritis has taken prednisone 20 mg daily for a year. She comes to the emergency department with 2 days of vomiting, abdominal pain and weakness. The nurse reviews the triage note.", "", "Highlight the findings that require follow-up.", "", "✓ highlight Stopped prednisone 4 days ago when the prescription ran out.", "  Yes: stopping long-term steroids suddenly leaves the suppressed adrenal glands unable to respond to stress, causing adrenal crisis.", "✓ highlight BP 78/46, HR 124.", "  Yes: hypotension with tachycardia signals shock. Adrenal crisis causes vasodilation and volume loss.", "✓ highlight Fingerstick glucose 52 mg/dL.", "  Yes: cortisol supports glucose levels. Its absence causes hypoglycemia, which needs prompt treatment.", "✓ highlight Na 128 mEq/L, K 4.8 mEq/L.", "  Yes: Low sodium fits adrenal insufficiency and needs correction with IV saline and hydrocortisone. Potassium usually stays normal after steroid withdrawal because aldosterone is still made.", "- Morning stiffness in both hands.", "  No: morning stiffness is part of her known rheumatoid arthritis. It is not new.", "- Round face and thin skin on her forearms.", "  No: these are expected effects of long-term steroid use. They reflect past therapy, not the current emergency.", "- Temperature 37.2 °C (99 °F).", "  No: this temperature is within normal limits and does not need follow-up.", "", "Why: Long-term steroid use suppresses the adrenal glands. Stopping suddenly causes adrenal crisis: shock, hypoglycemia and hyponatremia. Hyperkalemia is typical of primary adrenal insufficiency (Addison disease), not steroid withdrawal. The nurse anticipates IV hydrocortisone, IV fluids and glucose.", "Tip: When a client on long-term steroids presents in shock, ask when the last dose was taken."], "st": "awaiting"}, {"id": "ngn:sa-phys-5", "hash": "b37e445fc7", "title": "Neurogenic shock · Generate solutions", "body": ["A 24-year-old is in the emergency department after a motorcycle crash with a complete spinal cord injury at T2. HR 46, BP 78/40. Skin is warm, dry and flushed below the level of injury. Hemoglobin 14.1 g/dL. A focused abdominal ultrasound shows no internal bleeding.", "", "Which interventions should the nurse anticipate? Select all that apply.", "", "✓ Maintaining spinal alignment and log-rolling for turns", "  Yes: the spine must stay stable to prevent further cord injury.", "✓ A vasopressor such as norepinephrine", "  Yes: fluids alone often cannot restore tone in neurogenic shock. A vasopressor constricts vessels and raises the blood pressure.", "✓ IV atropine for symptomatic bradycardia", "  Yes: unopposed vagal tone slows the heart. Atropine blocks vagal effects and raises the heart rate.", "✓ IV isotonic crystalloid fluids", "  Yes: loss of sympathetic tone dilates the vessels. Fluids help fill the expanded vascular space.", "- Activating the massive transfusion protocol", "  No: the hemoglobin is normal and the scan shows no bleeding. This is neurogenic, not hemorrhagic, shock.", "- Applying a cooling blanket because the skin is warm", "  No: the skin is warm from vasodilation, not fever. These clients lose heat easily and need protection from hypothermia.", "- Raising the head of the bed to high Fowler's", "  No: sitting up drops the blood pressure further in neurogenic shock and can disturb an unstable spine.", "", "Why: A cord injury at T6 or above can cut off sympathetic outflow. The result is neurogenic shock: hypotension, bradycardia, and warm, dry skin. Treatment is fluids, vasopressors and atropine, while protecting the spine and preventing heat loss.", "Tip: Shock with a slow heart rate and warm skin after a high spinal injury is neurogenic, not hypovolemic."], "st": "awaiting"}, {"id": "ngn:calc-7", "hash": "8f3fb86c4e", "title": "Reconstituted ceftriaxone IM · Take action", "body": ["A 24-year-old client needs ceftriaxone 500 mg IM once. The vial contains ceftriaxone 1 g powder. The label reads: for IM use, add 2.1 mL of 1% lidocaine to yield 350 mg/mL.", "", "After reconstitution, how many mL should the nurse give?", "", "Answer: 1.4 mL. Round to the nearest tenth.", "  Reconstituted concentration: 350 mg/mL (from the label).", "  Desired / have: 500 mg / 350 mg x 1 mL", "  = 1.43 mL", "  Answer: 1.4 mL", "", "Why: After reconstitution, use the final concentration printed on the label, not the powder amount divided by the diluent volume, because the powder adds volume. Confirm there is no lidocaine allergy, and label any remaining solution with the date, time, concentration, and your initials, or discard it per policy.", "Tip: In reconstitution problems, the label concentration after mixing is the only \"have\" that matters."], "st": "awaiting"}, {"id": "ngn:calc-28", "hash": "d4a5fe5da5", "title": "Parkland first 8 hours volume · Take action", "body": ["A 34-year-old client weighing 70 kg has partial-thickness and full-thickness burns over 40% of the total body surface area. The provider orders lactated Ringer's by the Parkland formula: 4 mL x kg x %TBSA over 24 hours, half in the first 8 hours from the time of the burn.", "", "How many mL should the client receive in the first 8 hours?", "", "Answer: 5600 mL. Round to the nearest whole number.", "  24-hour total: 4 mL x 70 kg x 40 = 11,200 mL.", "  First 8 hours: 11,200 / 2 = 5,600 mL.", "  Answer: 5,600 mL", "", "Why: Burn injury causes a massive capillary leak in the first hours, which is why half the 24-hour volume is given in the first 8 hours. The formula is a starting point; the nurse titrates to urine output of 0.5 mL/kg/h in an adult.", "Tip: Use %TBSA as a whole number (40, not 0.4) in the Parkland formula."], "st": "awaiting"}, {"id": "ngn:calc-29", "hash": "364b842e5f", "title": "Parkland rate after delayed start · Take action", "body": ["A 41-year-old client weighing 80 kg has partial-thickness and full-thickness burns over 30% of the total body surface area. The client arrives 2 hours after the burn and has received no IV fluid. The order reads lactated Ringer's by the Parkland formula (4 mL x kg x %TBSA over 24 hours, half in the first 8 hours from the time of the burn).", "", "At what rate should the nurse set the pump to complete the first half on schedule?", "", "Answer: 800 mL/h. Round to the nearest whole number.", "  24-hour total: 4 mL x 80 kg x 30 = 9,600 mL.", "  First half: 9,600 / 2 = 4,800 mL.", "  Time left in the first 8 hours: 8 - 2 = 6 h.", "  Rate: 4,800 mL / 6 h = 800 mL/h", "  Answer: 800 mL/h", "", "Why: The 8-hour clock starts at the time of the burn, not at arrival, so a delay means the same volume must run over less time. The nurse monitors urine output hourly with an indwelling catheter and watches for signs of over-resuscitation such as crackles and rising airway pressures.", "Tip: Subtract the time already elapsed since the injury before dividing; that is the trap in delayed-arrival burn items."], "st": "awaiting"}]}, "packs": [{"id": "drill-med-1", "title": "Drills: Med Pass, part 1 of 2", "sub": "What to check before a medication, then give, hold or call. A pharmacist is especially welcome.", "n": 25, "reviewed": 0, "changed": 0}, {"id": "drill-med-2", "t
