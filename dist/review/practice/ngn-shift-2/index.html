<style>
:root{--bg:#E6EDF0;--surface:#FBFCFC;--surface-2:#EDF2F4;--ink:#152238;--ink-2:#4D5A6F;--line:#CAD5DB;--teal:#2449A8;--teal-ink:#fff;--red:#B3342B;--red-bg:#F8E1DE;--good:#2B7249;--good-bg:#E0F0E6;--amber:#A96C0E;--amber-bg:#FBEFD6;
  --serif:"Barlow Condensed","Arial Narrow",sans-serif;--sans:"Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161C;--surface:#1A1F27;--surface-2:#212833;--ink:#E7E4DB;--ink-2:#A0A5AE;--line:#343C48;--teal:#93B4E4;--teal-ink:#0F1B2C;--red:#F0766B;--red-bg:#3b1d1b;--good:#72c692;--good-bg:#16301f;--amber:#E9AE4E;--amber-bg:#35291a}}
:root[data-theme="dark"]{--bg:#12161C;--surface:#1A1F27;--surface-2:#212833;--ink:#E7E4DB;--ink-2:#A0A5AE;--line:#343C48;--teal:#93B4E4;--teal-ink:#0F1B2C;--red:#F0766B;--red-bg:#3b1d1b;--good:#72c692;--good-bg:#16301f;--amber:#E9AE4E;--amber-bg:#35291a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
main{max-width:52rem;margin:0 auto;padding:clamp(1.2rem,5vw,3rem) 16px calc(5rem + env(safe-area-inset-bottom))}
a{color:var(--teal)}
.home{font-family:var(--serif);font-weight:700;font-size:1.1rem;letter-spacing:.04em;text-transform:uppercase;background:var(--ink);color:var(--bg);padding:.28em .55em .22em;border-radius:2px;text-decoration:none}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.9rem,6vw,2.6rem);line-height:1.1;letter-spacing:0;margin:1.6rem 0 .3rem}
h2{font-size:1.15rem;margin:2.4rem 0 .6rem}
h3{font-size:1rem;margin:0}
p{margin:.5rem 0}
.muted{color:var(--ink-2)}
.meta{display:flex;flex-wrap:wrap;gap:.4rem .6rem;margin-top:.6rem}
.chip{display:inline-flex;align-items:center;padding:.15em .6em;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--surface-2);border:1px solid var(--line)}
.chip.awaiting{background:var(--amber-bg);border-color:transparent;color:var(--amber)}
.chip.reviewed{background:var(--good-bg);border-color:transparent;color:var(--good)}
.chip.changed{background:var(--red-bg);border-color:transparent;color:var(--red)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem 1.1rem;margin:.8rem 0}
.how ol{margin:.4rem 0 0;padding-left:1.2rem}.how li{margin:.2rem 0}
label{display:block;font-weight:600;font-size:.9rem;margin:.7rem 0 .25rem}
input[type=text],input[type=email],textarea,select{width:100%;min-height:44px;padding:.5em .7em;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:5rem;resize:vertical}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:0 1rem}
details.pt{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:.6rem 0}
details.pt>summary{cursor:pointer;padding:.85rem 1rem;font-weight:600;list-style-position:inside}
details.pt>div{padding:0 1rem 1rem}
table{width:100%;border-collapse:collapse;font-size:.88rem;margin:.4rem 0}
th,td{text-align:left;vertical-align:top;padding:.35rem .5rem .35rem 0;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--ink-2);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
.scroll{overflow-x:auto}
ul.plain{margin:.3rem 0;padding-left:1.1rem}
.dec{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:.85rem 1rem;margin:.6rem 0}
.dec.pos{border-left-color:var(--good)}.dec.neg{border-left-color:var(--red)}
.dec .top{display:flex;flex-wrap:wrap;gap:.3rem .5rem;align-items:center;font-size:.78rem;color:var(--ink-2);font-weight:600}
.pts{font-weight:700;padding:.05em .45em;border-radius:4px;background:var(--surface-2)}
.pos .pts{color:var(--good);background:var(--good-bg)}.neg .pts{color:var(--red);background:var(--red-bg)}
.dec b{display:block;margin:.35rem 0 .15rem;font-size:1rem}
.dec .why{font-family:var(--sans);color:var(--ink-2);margin:0}
.dec .src{font-size:.75rem;color:var(--ink-2);margin-top:.35rem}
.verdict{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.7rem}
.verdict button{min-height:40px;padding:.35em .9em;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer}
.verdict button[aria-pressed="true"][data-v="ok"]{background:var(--good);border-color:var(--good);color:var(--teal-ink)}
.verdict button[aria-pressed="true"][data-v="fix"]{background:var(--red);border-color:var(--red);color:var(--teal-ink)}
.verdict button[aria-pressed="true"][data-v="unsure"]{background:var(--amber);border-color:var(--amber);color:var(--teal-ink)}
.dec textarea{margin-top:.5rem;min-height:3.6rem}
.opt{padding:.4rem 0;border-bottom:1px solid var(--line);font-size:.92rem}.opt:last-child{border:0}
.opt i{font-style:normal;font-weight:700;font-size:.75rem;padding:.05em .4em;border-radius:4px;margin-right:.4rem;background:var(--surface-2)}
.bar{position:sticky;top:0;z-index:5;margin:0 -16px;padding:.6rem 16px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:.6rem;font-size:.9rem}
.bar .prog{display:block;flex:1;min-width:4rem;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;max-width:12rem}.bar .prog i{display:block;height:100%;background:var(--teal)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:.55em 1.2em;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn-primary{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.row{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1rem}
.check{display:flex;gap:.6rem;align-items:flex-start;font-weight:500;margin-top:1rem}
.check input{width:1.2rem;height:1.2rem;margin-top:.2rem;flex:none}
.msg{margin-top:.8rem;font-weight:600}.msg.err{color:var(--red)}.msg.ok{color:var(--good)}
pre{white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:.8rem;font-size:.8rem;max-height:18rem;overflow:auto}
.shifts a{display:block;text-decoration:none;color:inherit}
.shifts .card:hover{border-color:var(--ink-2)}
</style>
<style>.item .body p{margin:.15rem 0}.item .body .why{color:var(--ink-2);font-size:.92rem;margin:0 0 .35rem 1.1rem}.item .body .ok b{display:inline;margin:0;color:var(--good)}.item .body .no{color:var(--ink)}.item .body .sp{height:.5rem}.item>b{margin-bottom:.5rem}</style></head>

 low.", "✓ Ibuprofen 600 mg PO for a headache", "  Yes: NSAIDs cause sodium and water retention and worsen heart failure.", "✓ Diltiazem 15 mg IV push", "  Yes: Non-dihydropyridine calcium channel blockers depress contraction and can worsen heart failure with a reduced EF.", "", "Why: With a low EF, avoid drugs that weaken the heart's pumping (diltiazem, verapamil) or retain fluid (NSAIDs). An order can be active and still be wrong for this patient.", "Tip: \"Question the order\" items test whether you know who a drug is unsafe for, not just what it does."], "st": "awaiting"}, {"id": "ngn:p3-bow", "hash": "f1e80aaa42", "title": "psych-3e-1 · Bowtie · Prioritize hypotheses", "body": ["A 58-year-old on lithium has a coarse hand tremor, diarrhea since yesterday and new confusion. His lithium level is 2.1. His outpatient doctor recently added hydrochlorothiazide, and he takes ibuprofen for his back.", "", "Complete the diagram.", "", "Condition:", "✓ Lithium toxicity", "  Yes: A level of 2.1 with coarse tremor, GI losses and new confusion is moderate lithium toxicity, and a thiazide plus an NSAID both reduce renal lithium clearance.", "- Viral gastroenteritis", "  No: Diarrhea alone could suggest a stomach bug, but gastroenteritis does not explain the confusion or a level of 2.1. Diarrhea is a symptom of toxicity and also worsens it through dehydration.", "- Neuroleptic malignant syndrome", "  No: NMS follows antipsychotics and presents with lead-pipe rigidity, high fever and autonomic instability. A coarse tremor with a high lithium level and recent interacting drugs points elsewhere.", "- Serotonin syndrome", "  No: Serotonin syndrome also causes tremor and diarrhea, which is the trap, but it follows serotonergic drugs and brings clonus, hyperthermia and agitation; nothing here is serotonergic and the lithium level explains everything.", "Actions to take:", "- Restrict his salt intake", "  No: Restricting salt sounds heart-healthy, but low sodium makes the kidneys retain lithium and drives the level higher. Patients on lithium need steady sodium and fluid intake.", "- Give the 08:00 lithium with food", "  No: Giving the scheduled dose with food treats lithium as routine, which is the trap. Food reduces GI upset but does nothing about a toxic level and adds more drug.", "- Give loperamide and recheck tomorrow", "  No: Treating the diarrhea symptomatically misses that it is a sign of toxicity, and waiting until tomorrow lets neurologic damage progress.", "✓ Arrange medical evaluation for IV fluids", "  Yes: Moderate toxicity with confusion needs medical care for IV isotonic fluids, labs and possible dialysis; a psych unit cannot safely manage it alone.", "✓ Hold the lithium and notify the provider", "  Yes: Every further dose raises a level that is already toxic. Holding is within nursing judgment, and the provider must know now to address the thiazide, the NSAID and the level.", "Parameters to monitor:", "- Lipid panel", "  No: Lipids are monitored for second-generation antipsychotics, not lithium, and they say nothing about acute toxicity.", "- AIMS score", "  No: The AIMS screens for tardive dyskinesia from antipsychotics; it is a long-term movement screen, not a measure of lithium toxicity.", "- Weight", "  No: Weight gain matters for long-term lithium therapy, so it is a familiar choice, but it does not track an acute toxic episode.", "✓ Mental status and neuro checks", "  Yes: Confusion is the sign of neurotoxicity; worsening mental status, ataxia or seizures would signal severe toxicity needing escalation such as dialysis.", "✓ Serum lithium level", "  Yes: Serial levels show whether fluids, held doses and stopping the interacting drugs are bringing lithium back toward the therapeutic range.", "", "Why: Thiazides and NSAIDs both raise lithium levels. Diarrhea, coarse tremor and confusion at 2.1 are moderate toxicity: hold, call, get him medical care. Low salt raises the level further.", "Tip: When a stem lists new medications next to a narrow-therapeutic-index drug, look for the interaction; here thiazides and NSAIDs raise lithium, and the distractors are syndromes that share one or two symptoms."], "st": "awaiting"}, {"id": "ngn:p3-hl", "hash": "73dae8af29", "title": "psych-3e-1 · Highlight · Recognize cues", "body": ["Nurse's note for a 34-year-old admitted after an overdose, on day 4.", "", "Highlight the findings that require follow-up.", "", "✓ highlight Bright and calm today, for the first time this week.", "  Yes: A sudden brightening after a severe depression can mean the patient has made a decision to die and now has the energy to act on it.", "✓ highlight Gave his watch to a peer.", "  Yes: Giving away possessions is a classic behavioral warning sign of suicide planning and warrants a direct suicide assessment.", "✓ highlight Says, \"I've figured everything out.\"", "  Yes: A statement of sudden resolve can signal a settled plan. Ask directly whether he is thinking of killing himself rather than assuming it means recovery.", "- Ate all of breakfast.", "  No: Eating well is a reassuring sign of improving self-care and does not by itself suggest increased risk.", "✓ highlight Asking to be discharged today.", "  Yes: Pushing for discharge right after a sudden mood lift may reflect a wish to leave supervision to carry out a plan; the team needs a full risk reassessment first.", "- Attended morning group.", "  No: Attending group shows engagement in treatment and is an expected, positive behavior on day 4.", "", "Why: A sudden lift in mood after a severe depression can mean a decision has been made. Giving things away and a new sense of resolve are warning signs. Ask directly about suicide, and tell the team.", "Tip: In suicide-risk items, ask which findings are sudden changes from the patient's pattern; healthy routine behaviors are the distractors, and a rapid improvement is a cue, not a relief."], "st": "awaiting"}, {"id": "ngn:p3-mat", "hash": "b6bf2a06ad", "title": "psych-3e-1 · Matrix · Generate solutions", "body": ["A 26-year-old in a manic episode is loud, intrusive and pacing, and hasn't slept in two nights. She hasn't threatened or hurt anyone.", "", "For each intervention, indicate whether it is appropriate right now.", "", "- Offer a quiet room with less stimulation → Appropriate", "  Lowers stimulation, least restrictive.", "- Offer her PRN by mouth as a choice → Appropriate", "  Respects autonomy and often works.", "- Seclusion because she is disruptive → Not appropriate", "  Seclusion is for imminent danger, not noise.", "- Short, simple, calm statements → Appropriate", "  Easier to follow when thoughts are racing.", "- Invite her to a competitive group game → Not appropriate", "  Competition escalates mania.", "- Finger foods she can eat while moving → Appropriate", "  Keeps her nourished when she can't sit for a meal.", "", "Why: Use the least restrictive intervention that keeps everyone safe. Lower the stimulation and give her choices before anything more.", "Tip: For agitation items, rank each intervention from least to most restrictive and check whether there is imminent danger; without a threat or harm, only the least restrictive options are appropriate."], "st": "awaiting"}, {"id": "ngn:p3-ch1", "hash": "05941b2ec8", "title": "psych-3e-1 · Psychogenic polydipsia · NCLEX challenge · Prioritize hypotheses", "body": ["A 38-year-old with schizophrenia on clozapine has been drinking from every fountain on the unit. Weight up 3 kg since morning. Now confused and vomiting. Sodium 121.", "", "Complete the diagram: the condition the client is most likely experiencing, two actions the nurse should take, and two parameters to monitor.", "", "Condition:", "✓ Water intoxication (hyponatremia)", "  Yes: Compulsive drinking, rapid weight gain, confusion, vomiting and a low sodium are water intoxication.", "- Neuroleptic malignant syndrome", "  No: NMS causes fever and rigidity, not low sodium with weight gain.", "- Clozapine-induced agranulocytosis", "  No: Agranulocytosis causes infection, not low sodium.", "- Acute lithium toxicity", "  No: He isn't on lithium.", "Actions to take:", "✓ Restrict fluids and track daily weight", "  Yes: Restricting water and tracking weight are the core of treatment.", "✓ Notify provider and start seizure precautions", "  Yes: Sodium at 121 with confusion risks seizures; the provider needs to know now.", "- Encourage sports drinks for electrolytes", "  No: More fluid worsens it, sports drinks included.", "- Give PRN haloperidol for the confusion", "  No: Sedating confusion hides the cause.", "- Permanently discontinue clozapine now", "  No: Clozapine may help polydipsia in some clients; stopping it isn't the nurse's call.", "Parameters to monitor:", "✓ Serum sodium correction rate", "  Yes: Tracks correction (slowly, 6 to 8 mEq/L or less in 24 h, to avoid osmotic demyelination).", "✓ Daily weight and neuro status", "  Yes: Weight tracks water intake; neuro status tracks danger.", "- Absolute neutrophil count trend", "  No: Important on clozapine, but not the issue here.", "- Trough serum lithium level", "  No: Not on lithium.", "- Serum creatine kinase level", "  No: For NMS.", "", "Why: Psychogenic polydipsia can cause life-threatening hyponatremia. Restrict and track fluids, monitor sodium and neuro status, and correct slowly.", "Tip: When a psych client is confused, look for a medical cause before a psychiatric one."], "st": "awaiting"}, {"id": "ngn:p3-ch2", "hash": "310fd8236b", "title": "psych-3e-1 · Least restrictive intervention · NCLEX challenge · Generate solutions", "body": ["A client with mania is loud and intrusive in the day room, interrupting groups. No threats, no weapons, responds briefly to staff.", "", "For each intervention, indicate whether it is appropriate now or not justified yet.", "", "- Calm verbal redirection with clear limits → Appropriate now", "  The first step on the least-restrictive ladder.", "- Offer an oral PRN → Appropriate now", "  Voluntary medication is less restrictive than anything forced.", "- Offer a quiet room by choice → Appropriate now", "  Lowering stimulation helps mania, and it's voluntary.", "- Seclusion → Not justified yet", "  Only for imminent danger to self or others when less restrictive steps fail.", "- Emergency IM medication → Not justified yet", "  Requires an emergency: imminent danger. Being loud isn't that.", "- Four-point restraints → Not justified yet", "  The most restrictive measure; never for disruption alone.", "", "Why: Use the least restrictive intervention that keeps everyone safe. Being loud and intrusive calls for limits, choices and lower stimulation, not seclusion, restraint or forced medication.", "Tip: Restraint and seclusion are justified by imminent danger, not by inconvenience or disruption."], "st": "awaiting"}, {"id": "ngn:p4-bow", "hash": "a705360ce0", "title": "psych-4n-1 · Bowtie · Prioritize hypotheses", "body": ["An hour after his first-ever dose of IM haloperidol, a 14-year-old's neck is twisted to one side, his eyes are rolled upward and his jaw is clenched. Staff say he is \"acting out for attention.\"", "", "Complete the diagram.", "", "Condition:", "- Tardive dyskinesia", "  No: Tardive dyskinesia is also a movement disorder, but it develops after months to years of exposure and causes repetitive movements, not acute sustained spasms.", "- Neuroleptic malignant syndrome", "  No: NMS involves generalized rigidity, high fever, altered consciousness and unstable vitals, and usually develops over days, not focal spasms an hour after a dose.", "✓ Acute dystonic reaction", "  Yes: Torticollis, oculogyric crisis and trismus within hours of a first dose of a high-potency antipsychotic in a young male is the textbook acute dystonic reaction.", "- Behavioral acting out", "  No: Staff framing it as attention-seeking is the trap. Sustained involuntary muscle spasms after haloperidol are a medication emergency, and labeling them behavioral delays treatment.", "Actions to take:", "- Give another dose of haloperidol", "  No: More haloperidol is the cause of the reaction, so another dose would worsen it; this is the trap if the movements are misread as agitation.", "✓ Check his airway for stridor", "  Yes: Laryngeal dystonia can close the airway, so stridor, drooling or trouble swallowing take priority under the ABCs.", "✓ Give diphenhydramine or benztropine as ordered", "  Yes: An anticholinergic such as diphenhydramine or benztropine restores the dopamine and acetylcholine balance and usually relieves the spasm within minutes.", "- Place him in seclusion", "  No: Seclusion treats an involuntary drug reaction as dangerous behavior, violates the least restrictive principle, and removes him from observation while his airway is at risk.", "- Tell him to relax his neck", "  No: He cannot voluntarily relax a dystonic muscle; the instruction blames him and delays the medication that actually works.", "Parameters to monitor:", "- Weight", "  No: Weight gain is a long-term antipsychotic concern, not a parameter for an acute movement reaction.", "✓ Return of muscle spasms as the dose wears off", "  Yes: The anticholinergic can wear off before the haloperidol does, so spasms may return and a scheduled dose may be needed.", "- Lithium level", "  No: Lithium levels matter for patients on lithium; he received haloperidol, so this is an unrelated lab.", "✓ Airway and swallowing", "  Yes: Throat and tongue involvement can compromise breathing and swallowing, so airway status is the priority assessment until the spasm resolves.", "- Blood glucose", "  No: Blood glucose is monitored with second-generation antipsychotics over time and is not relevant to an acute dystonic reaction.", "", "Why: Young males after a first dose of a high-potency antipsychotic are at the highest risk. An anticholinergic reverses it within minutes; dystonia of the throat can threaten the airway. It can come back, so it needs a scheduled dose.", "Tip: Match the timing to the syndrome: hours after a first dose is acute dystonia, days to weeks is akathisia or parkinsonism, months to years is tardive dyskinesia; and an airway option is almost always one of the actions."], "st": "awaiting"}, {"id": "ngn:p4-cloze", "hash": "a0d40cbc62", "title": "psych-4n-1 · Drop-down · Generate solutions", "body": ["A 15-year-old with anorexia nervosa is on day 4 of refeeding. Her 16:00 phosphorus is 2.1 (the order says call for under 3.0).", "", "Complete the sentences.", "", "Blank 1:", "✓ call the provider for electrolyte replacement", "  Yes: Hypophosphatemia below the ordered threshold needs prompt replacement because low phosphorus can cause cardiac arrhythmias, heart failure, respiratory muscle weakness and seizures.", "- hold her meals until the phosphorus rises", "  No: Holding meals seems logical because feeding drives phosphorus into cells, but stopping nutrition reinforces the eating disorder. The standard is to replace electrolytes and keep feeding.", "- give a laxative", "  No: A laxative does nothing for phosphorus and is a common misuse behavior in anorexia; it could also worsen electrolyte losses.", "Blank 2:", "- day", "  No: Risk does not end after the first day; shifts continue over the first several days, so monitoring only on day one would miss most cases.", "- month", "  No: By a month the acute shift risk has largely passed; waiting that long describes neither the peak nor the monitoring period.", "✓ week", "  Yes: Electrolyte shifts are greatest in roughly the first week as insulin rises and phosphorus, potassium and magnesium move into cells, so labs are checked frequently then.", "Blank 3:", "- only dinner", "  No: Compensatory behaviors can follow any meal or snack, so supervising only dinner leaves most meals unprotected.", "- the next morning's weight", "  No: Daily weights are part of care, but they do not prevent purging or exercise right after a meal, which is what supervision targets.", "✓ the hour after", "  Yes: The hour after meals is when purging, hidden exercise or other compensatory behaviors are most likely, so supervision continues through it.", "", "Why: Replace and keep feeding; stopping food is what the illness wants. Risk peaks in the first week. The hour after meals is when exercise and purging happen.", "Tip: In refeeding items, any option that stops or delays nutrition is a distractor; the safe answer corrects the lab and continues feeding."], "st": "awaiting"}, {"id": "ngn:p4-sata", "hash": "c10423b952", "title": "psych-4n-1 · Select all · Take action", "body": ["A 16-year-old tells you her mother's partner has been sexually abusing her, and that he is on tonight's visitor list.", "", "Which nurse actions are appropriate? Select all that apply.", "", "✓ Make the mandated report yourself", "  Yes: Mandated reporters have a personal duty to report suspected child abuse directly; telling a supervisor or relying on someone else does not satisfy it.", "✓ Tell her you believe her and it isn't her fault", "  Yes: Believing her and affirming it is not her fault is therapeutic, reduces shame and makes further disclosure and safety planning possible.", "✓ Change the visitor list with the team before visiting hours", "  Yes: The person she named is on tonight's list, so protecting her from contact before visiting hours is an immediate safety need.", "- Ask detailed questions so the report is complete", "  No: Thorough questions seem helpful, but detailed or leading questioning can contaminate a forensic interview; the nurse gathers only enough to report.", "- Promise to keep it a secret so she keeps talking", "  No: Promising secrecy may seem to build trust, but the nurse must report, so the promise would be broken and damage trust later.", "✓ Document her words exactly as she said them", "  Yes: Quoting her exact words, without interpretation, creates an accurate record for the report and any investigation and avoids putting words in her mouth.", "- Ask her mother at visiting whether it's true", "  No: Confronting family may seem like clarifying, but it can alert the abuser, pressure the teen to recant and put her at risk; investigation belongs to child protective services and police.", "", "Why: Believe, report, protect, document. Forensic questioning belongs to specialists, and questioning family can tip off the person she named.", "Tip: For abuse disclosures, follow believe, report, protect, document; options that promise confidentiality, investigate or confront family are the usual distractors."], "st": "awaiting"}, {"id": "ngn:p4-ch1", "hash": "a4a487fbb3", "title": "psych-4n-1 · Mandated reporting · NCLEX challenge · Take action", "body": ["A 15-year-old tells the nurse that her stepfather hits her and she's scared to go home.", "", "Complete the sentences.", "", "Blank 1:", "- ask the parents for their side first", "  No: That could put her in danger.", "✓ report to child protective services the same day", "  Yes: Mandated reporters report reasonable suspicion promptly; confirming isn't required.", "- wait until the psychiatrist confirms the story", "  No: The duty to report is the nurse's own and doesn't wait for anyone.", "Blank 2:", "- nothing about the report", "  No: She deserves to know what happens next.", "- that it will stay between them", "  No: A promise you can't keep breaks trust.", "✓ that the nurse has to share this to keep her safe", "  Yes: Honesty about limits keeps trust.", "Blank 3:", "- \"abuse alleged\" as a summary", "  No: A summary loses what she actually said.", "- nothing until it's investigated", "  No: Documentation is required now.", "✓ her exact words in quotes", "  Yes: Her own words are the most accurate record.", "", "Why: Mandated reporting requires a report on reasonable suspicion, not proof. Be honest with the young person about why you're telling, and record what they said in their own words.", "Tip: Answers that wait for someone else to confirm are almost always wrong for mandated reporting."], "st": "awaiting"}, {"id": "ngn:p4-ch2", "hash": "b7f04ad51f", "title": "psych-4n-1 · Serotonin syndrome · NCLEX challenge · Recognize cues", "body": ["A 17-year-old taking fluoxetine 40 mg daily took over-the-counter dextromethorphan cough medicine repeatedly at home before arriving on the unit. Three hours later she is agitated and sweating.", "", "Which findings support serotonin syndrome? Select all that apply.", "", "- Absent deep tendon reflexes", "  No: Reflexes are brisk and exaggerated (hyperreflexia), not absent.", "✓ Diaphoresis and tachycardia (HR 128)", "  Yes: Autonomic instability (sweating, tachycardia, fever, hypertension) is part of the classic triad.", "✓ Acute agitation and confusion", "  Yes: Mental status change is the third part of the serotonin syndrome triad.", "✓ Hyperreflexia and inducible ankle clonus", "  Yes: Neuromuscular hyperactivity (clonus, hyperreflexia, tremor) is the hallmark that distinguishes serotonin syndrome from NMS.", "✓ Diarrhea and hyperactive bowel sounds", "  Yes: Excess serotonin stimulates gut motility, causing hyperactive bowel sounds and diarrhea.", "- Lead-pipe rigidity that built slowly over 5 days", "  No: Slow-onset lead-pipe rigidity with hyporeflexia fits neuroleptic malignant syndrome (NMS), not rapid-onset serotonin syndrome.", "- Bradycardia (HR 48) and cool dry skin", "  No: Serotonin syndrome produces a hyperadrenergic state (tachycardia, diaphoresis), not bradycardia.", "", "Why: Combining an SSRI with dextromethorphan, tramadol, St. John's wort, triptans, or MAOIs can trigger serotonin syndrome within hours. Watch for the triad: mental status changes, autonomic instability, and neuromuscular hyperactivity (especially clonus and hyperreflexia). Stop serotonergic drugs and escalate immediately.", "Tip: Compare serotonin syndrome (fast onset, clonus, hyperreflexia) against NMS (slower onset, lead-pipe rigidity, bradyreflexia)."], "st": "awaiting"}, {"id": "ngn:ed-bow", "hash": "c63f1b534a", "title": "ed-podb-1 · Bowtie · Prioritize hypotheses", "body": ["A 64-year-old with type 2 diabetes came in with \"indigestion\" and fatigue. Her first ECG was nonspecific. Thirty minutes later she is diaphoretic with pressure radiating to her jaw. Repeat ECG: ST elevation in II, III and aVF. HR 58, BP 104/64. V4R shows ST elevation.", "", "Complete the diagram.", "", "Condition:", "- Gastroesophageal reflux", "  No: The early complaint of indigestion is the trap; women and people with diabetes often have atypical MI symptoms, and the ECG now shows a STEMI.", "- Pulmonary embolism", "  No: PE can cause tachycardia, hypoxia and right heart strain, but not localized ST elevation in the inferior leads with V4R elevation.", "✓ Inferior STEMI with right ventricular involvement", "  Yes: ST elevation in II, III and aVF localizes an inferior STEMI, and ST elevation in V4R confirms right ventricular involvement, which fits the soft BP and slow rate.", "- Anterior STEMI with heart failure", "  No: Anterior STEMI shows elevation in the precordial leads such as V1 to V4, not II, III and aVF, and nothing here suggests heart failure.", "Actions to take:", "✓ Give aspirin 324 mg chewed if not already given", "  Yes: Chewed aspirin is absorbed quickly and inhibits platelet aggregation, limiting clot growth; it is given early in suspected acute coronary syndrome unless contraindicated.", "- Give furosemide 40 mg IV", "  No: Furosemide treats fluid overload; the preload-dependent right ventricle needs volume, and diuresis could crash the BP.", "✓ Notify the provider to activate the cardiac catheterization lab", "  Yes: Time to reperfusion drives outcome in STEMI; the ECG alone is enough to activate the cath lab without waiting for labs.", "- Give nitroglycerin 0.4 mg SL for the pain", "  No: Nitroglycerin is routine chest pain care, which makes it tempting, but in RV infarction it reduces preload and can cause severe hypotension.", "- Wait for the second troponin before acting", "  No: Troponin rises hours after injury; ST elevation already makes the diagnosis, and waiting delays reperfusion while heart muscle dies.", "Parameters to monitor:", "- Blood glucose every hour", "  No: She has diabetes, so glucose matters, but hourly checks are not a priority parameter for an inferior STEMI with RV involvement.", "- Urine specific gravity", "  No: Specific gravity reflects urine concentration and does not track cardiac perfusion or rhythm in an acute MI.", "✓ Cardiac rhythm", "  Yes: The right coronary artery often supplies the SA and AV nodes, so inferior MIs commonly cause bradycardia and heart block, already hinted at by HR 58.", "- Peak flow", "  No: Peak flow measures airway obstruction in asthma and has no role in monitoring an MI.", "✓ Blood pressure", "  Yes: RV infarction makes the BP preload dependent and fragile; trending it guides fluid therapy and warns of cardiogenic shock.", "", "Why: ST elevation is the diagnosis; troponin comes later. Inferior MIs often involve the right ventricle, which depends on preload, so nitrates and diuretics can crash the pressure. Watch the pressure and rhythm: inferior MIs cause bradycardia and heart block.", "Tip: Let the ECG leads drive the answer: inferior leads plus V4R mean right ventricular involvement, so eliminate any option that lowers preload, such as nitrates or diuretics."], "st": "awaiting"}, {"id": "ngn:ed-hl", "hash": "ff46ab0817", "title": "ed-podb-1 · Highlight · Recognize cues", "body": ["Stroke alert triage note (arrived 14:52): 72-year-old man, right arm and leg weakness and difficulty speaking.", "", "Highlight the findings that change whether he can receive a thrombolytic.", "", "- Wife found him on the couch at 14:30.", "  No: The time he was found is tempting, but the thrombolytic window is measured from last known well, not from discovery, so 14:30 does not set the clock.", "✓ highlight Wife last saw him normal at 10:00.", "  Yes: Last known well at 10:00 starts the clock; the standard 4.5-hour IV thrombolytic window closed at 14:30, before he arrived.", "✓ highlight BP 198/108.", "  Yes: BP above 185/110 must be lowered and kept below that level before a thrombolytic can be given, because higher pressure raises the risk of intracranial hemorrhage.", "- Glucose 142.", "  No: Glucose is checked to rule out a stroke mimic and extreme values; 142 is acceptable and does not change eligibility.", "- CT head: no hemorrhage.", "  No: A CT without hemorrhage is a required finding before a thrombolytic; it permits treatment rather than excluding it.", "- Takes lisinopril and atorvastatin.", "  No: Lisinopril and atorvastatin do not raise bleeding risk; anticoagulants would matter, but these routine medicines do not change eligibility.", "- Temperature 36.9 °C.", "  No: A normal temperature of 36.9 °C does not affect thrombolytic eligibility.", "", "Why: The window starts at last known well (10:00), not when he was found, so it closed at 14:30, before he arrived at 14:52. A pressure over 185/110 must be lowered before any reperfusion. A normal glucose, a clean CT, a normal temperature and his usual medicines don't exclude him.", "Tip: For thrombolytic eligibility, anchor on last known well rather than time found or time of arrival, and check BP against 185/110; normal findings like a clean CT support treatment."], "st": "awaiting"}, {"id": "ngn:ed-sata", "hash": "5f2da29a2b", "title": "ed-podb-1 · Select all · Take action", "body": ["A 19-year-old who ate peanut sauce has hives, lip swelling, a hoarse voice and wheezing. BP 84/50, HR 128. EMS gave diphenhydramine 50 mg IV.", "", "Which actions should the nurse take now? Select all that apply.", "", "- Give epinephrine 0.5 mg (1 mg/mL) IV push", "  No: The dose looks right but the route and concentration are dangerous; undiluted 1 mg/mL epinephrine by IV push can cause arrhythmias, severe hypertension and MI.", "✓ Start a 1 L normal saline bolus", "  Yes: Anaphylaxis causes widespread vasodilation and capillary leak; a crystalloid bolus restores circulating volume for a BP of 84/50.", "✓ Give epinephrine 0.5 mg (1 mg/mL) IM in the anterolateral thigh", "  Yes: IM epinephrine in the anterolateral thigh is first-line for anaphylaxis; it reverses airway swelling, bronchospasm and vasodilation, and 0.5 mg is the adult single dose.", "✓ Place him supine with legs elevated and give high-flow oxygen", "  Yes: Supine with legs elevated improves venous return in shock, and high-flow oxygen supports oxygenation; a client in severe respiratory distress may sit up, but must not stand.", "✓ Repeat the IM epinephrine in 5 to 15 minutes if symptoms persist", "  Yes: Symptoms can persist or recur, so IM epinephrine is repeated every 5 to 15 minutes as needed while monitoring for a biphasic reaction.", "- Wait 30 minutes for the diphenhydramine to work", "  No: Antihistamines relieve itching and hives but do not reverse airway swelling or shock; waiting delays epinephrine, the only drug that treats the emergency.", "", "Why: Epinephrine IM is first-line; antihistamines don't treat airway swelling or shock. Undiluted IV push epinephrine causes arrhythmias and MI. Supine with legs up, oxygen and fluids support circulation while it works.", "Tip: In anaphylaxis, IM epinephrine comes first; watch for distractors that use the right drug by the wrong route or concentration, or that rely on antihistamines."], "st": "awaiting"}, {"id": "ngn:ed-ch1", "hash": "32dcb09d2d", "title": "ed-podb-1 · Right ventricular infarction · NCLEX challenge · Generate solutions", "body": ["A 62-year-old has an inferior STEMI. A right-sided ECG shows ST elevation in V4R. BP 92/60, HR 58, lungs clear.", "", "For each intervention, indicate whether it is indicated or should be avoided.", "", "- IV normal saline bolus → Indicated", "  The right ventricle depends on preload; fluids support the pressure.", "- Sublingual nitroglycerin → Avoid", "  Nitrates drop preload and can cause profound hypotension in RV infarction.", "- Aspirin 324 mg chewed → Indicated", "  Every STEMI gets aspirin unless allergic.", "- IV furosemide → Avoid", "  Diuretics remove the preload the right ventricle needs.", "- Activate the cath lab → Indicated", "  Reperfusion is the treatment.", "- IV morphine for pain → Avoid", "  Morphine lowers preload and blood pressure; use with great caution, if at all.", "", "Why: RV infarction is preload-dependent. Avoid anything that lowers preload (nitrates, diuretics, morphine) and support it with fluids while reperfusion is arranged.", "Tip: When a scenario names a special case (right-sided changes), expect the usual drugs to be the traps."], "st": "awaiting"}, {"id": "ngn:ed-ch2", "hash": "1cd17648ca", "title": "ed-podb-1 · Subdural hematoma on anticoagulation · NCLEX challenge · Prioritize hypotheses", "body": ["An 81-year-old on warfarin fell two days ago and was fine. Today her daughter says she's sleepy and \"not herself.\" GCS 13, left pupil 5 mm and sluggish (right 3 mm), headache, vomited once. INR 3.4.", "", "Complete the diagram: the condition the client is most likely experiencing, two actions the nurse should take, and two parameters to monitor.", "", "Condition:", "✓ Subdural hematoma", "  Yes: A fall on warfarin, then slowly falling consciousness and a dilating pupil days later, is a classic subdural.", "- Ischemic stroke", "  No: Possible, but the fall, the anticoagulant and a unilateral dilated pupil point to a bleed.", "- Migraine headache", "  No: Migraine doesn't cause a falling GCS and a fixed or sluggish pupil.", "- Acute hypoglycemia", "  No: Check a glucose, but it doesn't explain a unilateral pupil change.", "Actions to take:", "✓ Obtain a stat noncontrast head CT", "  Yes: Imaging confirms the bleed fast.", "✓ Prepare warfarin reversal (PCC + vitamin K)", "  Yes: Reversing warfarin limits growth of the bleed.", "- Administer chewed aspirin 324 mg now", "  No: An antiplatelet worsens bleeding.", "- Give IV ondansetron and observe closely", "  No: Treating the vomiting misses a bleed.", "- Position the client for lumbar puncture", "  No: A lumbar puncture with raised pressure in the skull can cause herniation.", "Parameters to monitor:", "✓ GCS and pupil reactivity", "  Yes: A falling GCS or enlarging pupil means the bleed is growing.", "✓ Repeat INR after reversal", "  Yes: Tracks reversal.", "- Serial cardiac troponin", "  No: No sign of cardiac ischemia.", "- Arterial serum lactate", "  No: Not related.", "- Serum lipase and amylase", "  No: Not related.", "", "Why: Older adults on anticoagulants can bleed slowly after minor falls. A unilateral dilated pupil and falling consciousness mean pressure is rising: CT and reversal now.", "Tip: Days between injury and symptoms don't rule a bleed out; slow bleeds are the ones that fool people."], "st": "awaiting"}, {"id": "ngn:icu-bow", "hash": "e559ac9968", "title": "icu-3w-1 · Bowtie · Prioritize hypotheses", "body": ["A 70-year-old client is 18 hours after coronary artery bypass grafting. Mediastinal chest tube output was 90 to 110 mL/h overnight and has been 5 mL in the last hour. HR 124 (92 two hours ago), BP 86/72 (118/64 two hours ago), CVP 18 mm Hg (8 two hours ago). Heart sounds are muffled and the neck veins are distended.", "", "Complete the diagram: the condition the client is most likely experiencing, two actions the nurse should take, and two parameters to monitor.", "", "Condition:", "✓ Cardiac tamponade", "  Yes: Chest tube output that stops abruptly while HR and CVP climb, the pressure falls and narrows, the heart sounds muffle and the neck veins distend is Beck's triad and tamponade.", "- Postoperative atrial fibrillation", "  No: Atrial fibrillation is common after bypass and can drop the pressure, but it doesn't explain a rising CVP, muffled heart sounds and chest tubes that suddenly stopped draining.", "- Acute left ventricular failure", "  No: Left heart failure raises pressure in the lungs and causes crackles; it doesn't explain clotted chest tubes, a narrowing pulse pressure and muffled heart sounds.", "- Hypovolemia from bleeding that has stopped", "  No: The tempting read is that the bleeding stopped. But stopped bleeding brings the heart rate down and the pressure up; here every sign is moving the wrong way, and the CVP is rising, not falling.", "Actions to take:", "- Give furosemide for the high CVP", "  No: The high CVP comes from compression, not fluid overload. A diuretic would drop preload the heart depends on and worsen the shock.", "✓ Notify the cardiac surgeon immediately", "  Yes: Tamponade after cardiac surgery is a surgical emergency. The surgeon needs to know now, by phone, not in a note.", "- Increase the IV fluid rate and reassess in 1 hour", "  No: Fluid can briefly support filling, but it doesn't relieve compression, and waiting an hour lets the pressure keep falling toward arrest.", "✓ Prepare for emergency re-exploration at the bedside", "  Yes: The definitive treatment is evacuating the clot, often by reopening the chest in the ICU. Preparing the sterile setup saves minutes.", "- Document that the chest tube bleeding has resolved", "  No: Documenting the bleeding as resolved is the classic trap; the drainage stopped because the tubes clotted while blood kept collecting around the heart.", "Parameters to monitor:", "✓ Heart rate, blood pressure and pulse pressure", "  Yes: A rising heart rate and a falling, narrowing pressure show how hard the heart is being squeezed and whether the intervention worked.", "- Blood glucose", "  No: Glucose control matters after heart surgery for wound healing, but it isn't a measure of tamponade.", "- Serum potassium", "  No: Potassium matters after bypass for arrhythmias, but it doesn't track tamponade or the response to evacuating it.", "✓ CVP and neck vein distention", "  Yes: CVP and neck veins rise as blood backs up behind a compressed heart; they fall once the tamponade is relieved.", "- Urine specific gravity", "  No: Specific gravity reflects urine concentration, not cardiac filling or output in an emergency.", "", "Why: Chest tubes that suddenly stop draining after heart surgery, with a rising heart rate and CVP, a falling and narrowing pressure, muffled heart sounds and distended neck veins, is tamponade from clotted tubes until proven otherwise. The fix is surgical: the surgeon at the bedside and a chest ready to open. Trend the hemodynamics that show the heart is being squeezed.", "Tip: When a drain suddenly stops after surgery, ask why before you celebrate: compare the drain with the vital sign trends, and believe the trends."], "st": "awaiting"}, {"id": "ngn:icu-mat", "hash": "35235fcbd8", "title": "icu-3w-1 · Matrix · Analyze cues", "body": ["The nurse is caring for clients on volume-control mechanical ventilation and reviews possible causes of ventilator alarms.", "", "For each cause, indicate whether it would trigger a high-pressure alarm or a low-pressure alarm.", "", "- Thick secretions in the endotracheal tube → High-pressure alarm", "  Secretions narrow the airway, so the ventilator needs more pressure to deliver the set volume.", "- The client biting down on the endotracheal tube → High-pressure alarm", "  A bitten, kinked tube obstructs flow and raises peak pressure.", "- The circuit disconnected from the endotracheal tube → Low-pressure alarm", "  With the circuit open, pressure can't build: the ventilator loses its seal and alarms low.", "- Air leaking around a deflated endotracheal tube cuff → Low-pressure alarm", "  A cuff leak lets volume escape, so the system can't reach its expected pressure.", "- Coughing or fighting the ventilator → High-pressure alarm", "  Coughing against a delivered breath spikes airway pressure; it may also signal pain, secretions or anxiety.", "- A tension pneumothorax → High-pressure alarm", "  Rising pressure in the chest makes the lung stiff to inflate, raising peak and plateau pressures, with falling SpO₂ and blood pressure.",
