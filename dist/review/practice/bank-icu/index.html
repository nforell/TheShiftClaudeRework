<style>
:root{--bg:#E6EDF0;--surface:#FBFCFC;--surface-2:#EDF2F4;--ink:#152238;--ink-2:#4D5A6F;--line:#CAD5DB;--teal:#2449A8;--teal-ink:#fff;--red:#B3342B;--red-bg:#F8E1DE;--good:#2B7249;--good-bg:#E0F0E6;--amber:#A96C0E;--amber-bg:#FBEFD6;
  --serif:"Barlow Condensed","Arial Narrow",sans-serif;--sans:"Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161C;--surface:#1A1F27;--surface-2:#212833;--ink:#E7E4DB;--ink-2:#A0A5AE;--line:#343C48;--teal:#93B4E4;--teal-ink:#0F1B2C;--red:#F0766B;--red-bg:#3b1d1b;--good:#72c692;--good-bg:#16301f;--amber:#E9AE4E;--amber-bg:#35291a}}
:root[data-theme="dark"]{--bg:#12161C;--surface:#1A1F27;--surface-2:#212833;--ink:#E7E4DB;--ink-2:#A0A5AE;--line:#343C48;--teal:#93B4E4;--teal-ink:#0F1B2C;--red:#F0766B;--red-bg:#3b1d1b;--good:#72c692;--good-bg:#16301f;--amber:#E9AE4E;--amber-bg:#35291a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
main{max-width:52rem;margin:0 auto;padding:clamp(1.2rem,5vw,3rem) 16px calc(5rem + env(safe-area-inset-bottom))}
a{color:var(--teal)}
.home{font-family:var(--serif);font-weight:700;font-size:1.1rem;letter-spacing:.04em;text-transform:uppercase;background:var(--ink);color:var(--bg);padding:.28em .55em .22em;border-radius:2px;text-decoration:none}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.9rem,6vw,2.6rem);line-height:1.1;letter-spacing:0;margin:1.6rem 0 .3rem}
h2{font-size:1.15rem;margin:2.4rem 0 .6rem}
h3{font-size:1rem;margin:0}
p{margin:.5rem 0}
.muted{color:var(--ink-2)}
.meta{display:flex;flex-wrap:wrap;gap:.4rem .6rem;margin-top:.6rem}
.chip{display:inline-flex;align-items:center;padding:.15em .6em;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--surface-2);border:1px solid var(--line)}
.chip.awaiting{background:var(--amber-bg);border-color:transparent;color:var(--amber)}
.chip.reviewed{background:var(--good-bg);border-color:transparent;color:var(--good)}
.chip.changed{background:var(--red-bg);border-color:transparent;color:var(--red)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem 1.1rem;margin:.8rem 0}
.how ol{margin:.4rem 0 0;padding-left:1.2rem}.how li{margin:.2rem 0}
label{display:block;font-weight:600;font-size:.9rem;margin:.7rem 0 .25rem}
input[type=text],input[type=email],textarea,select{width:100%;min-height:44px;padding:.5em .7em;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:5rem;resize:vertical}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:0 1rem}
details.pt{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:.6rem 0}
details.pt>summary{cursor:pointer;padding:.85rem 1rem;font-weight:600;list-style-position:inside}
details.pt>div{padding:0 1rem 1rem}
table{width:100%;border-collapse:collapse;font-size:.88rem;margin:.4rem 0}
th,td{text-align:left;vertical-align:top;padding:.35rem .5rem .35rem 0;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--ink-2);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
.scroll{overflow-x:auto}
ul.plain{margin:.3rem 0;padding-left:1.1rem}
.dec{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:.85rem 1rem;margin:.6rem 0}
.dec.pos{border-left-color:var(--good)}.dec.neg{border-left-color:var(--red)}
.dec .top{display:flex;flex-wrap:wrap;gap:.3rem .5rem;align-items:center;font-size:.78rem;color:var(--ink-2);font-weight:600}
.pts{font-weight:700;padding:.05em .45em;border-radius:4px;background:var(--surface-2)}
.pos .pts{color:var(--good);background:var(--good-bg)}.neg .pts{color:var(--red);background:var(--red-bg)}
.dec b{display:block;margin:.35rem 0 .15rem;font-size:1rem}
.dec .why{font-family:var(--sans);color:var(--ink-2);margin:0}
.dec .src{font-size:.75rem;color:var(--ink-2);margin-top:.35rem}
.verdict{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.7rem}
.verdict button{min-height:40px;padding:.35em .9em;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer}
.verdict button[aria-pressed="true"][data-v="ok"]{background:var(--good);border-color:var(--good);color:var(--teal-ink)}
.verdict button[aria-pressed="true"][data-v="fix"]{background:var(--red);border-color:var(--red);color:var(--teal-ink)}
.verdict button[aria-pressed="true"][data-v="unsure"]{background:var(--amber);border-color:var(--amber);color:var(--teal-ink)}
.dec textarea{margin-top:.5rem;min-height:3.6rem}
.opt{padding:.4rem 0;border-bottom:1px solid var(--line);font-size:.92rem}.opt:last-child{border:0}
.opt i{font-style:normal;font-weight:700;font-size:.75rem;padding:.05em .4em;border-radius:4px;margin-right:.4rem;background:var(--surface-2)}
.bar{position:sticky;top:0;z-index:5;margin:0 -16px;padding:.6rem 16px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:.6rem;font-size:.9rem}
.bar .prog{display:block;flex:1;min-width:4rem;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;max-width:12rem}.bar .prog i{display:block;height:100%;background:var(--teal)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:.55em 1.2em;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn-primary{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.row{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1rem}
.check{display:flex;gap:.6rem;align-items:flex-start;font-weight:500;margin-top:1rem}
.check input{width:1.2rem;height:1.2rem;margin-top:.2rem;flex:none}
.msg{margin-top:.8rem;font-weight:600}.msg.err{color:var(--red)}.msg.ok{color:var(--good)}
pre{white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:.8rem;font-size:.8rem;max-height:18rem;overflow:auto}
.shifts a{display:block;text-decoration:none;color:inherit}
.shifts .card:hover{border-color:var(--ink-2)}
</style>
<style>.item .body p{margin:.15rem 0}.item .body .why{color:var(--ink-2);font-size:.92rem;margin:0 0 .35rem 1.1rem}.item .body .ok b{display:inline;margin:0;color:var(--good)}.item .body .no{color:var(--ink)}.item .body .sp{height:.5rem}.item>b{margin-bottom:.5rem}</style></head>

 knows he can say no protects his right to self-determination.", "- Calls the provider to get better pain control for a client grimacing after chest tube placement → Beneficence", "  beneficence is acting to do good for the client; advocating for pain relief is a direct example.", "- Stays with a frightened client and holds her hand during a painful dressing change → Beneficence", "  comforting a frightened client during a painful procedure is an act of doing good and promoting well-being.", "- Assigns the last ICU bed by acuity rather than by insurance status → Justice", "  justice is the fair distribution of care and resources based on need, not on ability to pay.", "- Gives an uninsured client the same post-op monitoring as every other client → Justice", "  treating clients equally regardless of social or financial status reflects justice.", "", "Why: Autonomy is respect for the client's right to decide. Beneficence is acting in the client's best interest. Justice is fairness in how care and resources are distributed. Naming the principle helps nurses explain their reasoning when values conflict.", "Tip: Ask who the action serves: the client's choice (autonomy), the client's welfare (beneficence), or fairness between clients (justice)."], "st": "awaiting"}, {"id": "ngn:qb-mgmt-17", "hash": "5e33074d1b", "title": "Impaired colleague · Take action", "body": ["At 19:00 shift change, a new graduate nurse in the ICU notices that a coworker arriving for the night shift smells of alcohol, has slurred speech, and stumbles against the medication cart. The coworker is about to take report on two critically ill clients.", "", "What is the nurse's best action?", "", "- Call the state board of nursing before telling anyone on the unit", "  No: the board may need to be notified later depending on state law, but the immediate danger is handled through the supervisor now.", "- Talk privately with the coworker after the shift about what you noticed and encourage them to get help on their own", "  No: waiting until after the shift lets an impaired nurse care for critically ill clients for 12 hours. Client safety cannot wait.", "✓ Report the observations immediately to the charge nurse so the coworker can be removed from client care", "  Yes: the priority is protecting clients from an impaired nurse. The charge nurse or supervisor can remove the coworker and start the facility's fitness-for-duty process.", "- Confront the coworker at the nursing station in front of the team", "  No: public confrontation is unprofessional, may escalate, and does not reliably remove the coworker from care. Use the chain of command.", "", "Why: A nurse who suspects a colleague is impaired must act to protect clients by reporting through the chain of command right away. The facility then handles fitness-for-duty testing and referral. Many states offer peer assistance or alternative-to-discipline programs, and reporting requirements to the board vary by state.", "Tip: When a coworker's impairment puts clients at risk, choose the option that removes them from client care now through the supervisor."], "st": "awaiting"}, {"id": "ngn:qb-mgmt-24", "hash": "53c2a51af3", "title": "Unsafe float assignment · Generate solutions", "body": ["A nurse with 4 months of experience on a medical-surgical unit is floated to the ICU. The charge nurse assigns her two clients on ventilators who are receiving vasopressor infusions. She has had no ICU orientation and has never titrated a vasopressor.", "", "Which actions are appropriate for the nurse? Select all that apply.", "", "- Titrate the vasopressors after quickly reading the drip protocol online", "  No: reading a protocol does not create competence with a high-alert infusion. Practicing beyond her competence puts clients at risk and the nurse at legal risk.", "✓ If the assignment stands, complete an assignment despite objection form per facility policy", "  Yes: this form notifies management of the safety concern in writing. Policies and the name of the form vary by facility and state.", "✓ Ask an ICU nurse for help before performing any unfamiliar skill", "  Yes: asking for help with unfamiliar skills is safe practice, especially for a new graduate in an unfamiliar setting.", "✓ Tell the charge nurse right away that she is not competent to care for these clients", "  Yes: nurses must accept only assignments they are competent to perform. Speaking up before taking report gives the charge nurse time to adjust.", "- Write her objection to the assignment in each client's medical record", "  No: staffing disputes do not belong in the client's chart. The objection goes on the facility form to management.", "✓ Suggest an alternative, such as taking the most stable clients or working as a helper to an ICU nurse", "  Yes: offering what she can safely do helps solve the staffing problem while keeping clients safe.", "- Leave the hospital after receiving report because the assignment is unsafe", "  No: once a nurse accepts report, leaving without handing off care can be client abandonment. The concern is handled through the chain of command.", "", "Why: A nurse may object to an assignment beyond her competence and should do so before accepting report, proposing safe alternatives. If the assignment stands, she documents the objection on the facility's form, practices only within her competence, and asks for help. Walking away after accepting report risks abandonment, and objections are not charted in the medical record.", "Tip: For unsafe assignments, the pattern is: speak up early, offer alternatives, document on the facility form, and never abandon clients."], "st": "awaiting"}, {"id": "ngn:qb-safe-2", "hash": "6121abb556", "title": "PPE doffing sequence · Take action", "body": ["A nurse in the ICU is finishing care for a 61-year-old with influenza and a MRSA-infected wound. The client is on droplet and contact precautions. The nurse is wearing gloves, a gown, a surgical mask and goggles.", "", "Place the steps for removing PPE in the correct order, following the CDC sequence.", "", "Correct order:", "1. Remove the gloves", "  Yes: gloves are the most contaminated item, so they come off first to keep dirty hands from touching the face or clean areas.", "2. Remove the goggles by handling the ear pieces or headband", "  Yes: the outside of the goggles is contaminated, so they are removed next by the parts that sat behind the head and ears.", "3. Unfasten the gown and pull it away from the body, rolling it inside out", "  Yes: the front and sleeves of the gown are contaminated; rolling it inside out contains the organisms as it comes off.", "4. Remove the mask by the ties or ear loops without touching the front", "  Yes: the mask comes off last because it protects the nose and mouth until all other contaminated items are removed.", "5. Perform hand hygiene", "  Yes: hands may have been contaminated during removal, so hand hygiene immediately after removing all PPE completes the process.", "", "Why: The CDC removal sequence goes from most contaminated to least: gloves, goggles or face shield, gown, then mask or respirator, followed by hand hygiene. The face protection stays on until the end so the nurse's mucous membranes are protected. If a respirator is worn, it is removed after leaving the room and closing the door.", "Tip: For doffing, think dirtiest first and face last; for donning, think the reverse, with gloves going on last."], "st": "awaiting"}, {"id": "ngn:qb-safe-10", "hash": "cedd75bc90", "title": "Restraint safety · Evaluate outcomes", "body": ["A 70-year-old in the ICU is intubated and on a ventilator. He pulled at his endotracheal tube twice despite family presence, frequent reorientation and mitts. Soft wrist restraints were ordered and applied 4 hours ago. The nurse checks the restraints and reviews the record.", "", "Which findings indicate the restraints are being used safely? Select all that apply.", "", "✓ The straps are tied to the bed frame with a quick-release knot", "  Yes: the bed frame moves with the client, and a quick-release knot allows fast removal in an emergency.", "- The straps are tied to the side rails", "  No: lowering a side rail can pull the wrist or cause injury. Restraints are secured to the bed frame, never to the rails.", "✓ Fingers are warm and pink with brisk capillary refill", "  Yes: these findings show circulation distal to the restraints is intact, which is checked at each assessment.", "- The order reads soft wrist restraints as needed for agitation", "  No: restraint orders cannot be written as PRN. Each order must be time-limited and renewed according to policy and regulation.", "✓ The flowsheet shows the restraints were released, the skin checked and range of motion done every 2 hours", "  Yes: regular release, skin checks and range of motion prevent skin injury, contractures and circulation problems while restraints are in place.", "✓ Two fingers fit between each restraint and the client's wrist", "  Yes: this confirms the restraint is snug enough to work but loose enough to protect circulation and skin.", "", "Why: Restraints are a last resort after less restrictive alternatives fail, as they did here. Safe use means a time-limited order, attachment to the bed frame with a quick-release knot, a two-finger fit, circulation checks, and regular release with skin care and range of motion. The need for restraints is reassessed continually so they are removed as soon as possible.", "Tip: For restraint questions, rule out any answer with side rails, PRN orders or tight fits, then confirm frequent monitoring."], "st": "awaiting"}, {"id": "ngn:qb-pharm-3", "hash": "ff6efa645e", "title": "Norepinephrine mcg/kg/min · Take action", "body": ["A 64-year-old in septic shock weighs 80 kg. After 30 mL/kg of crystalloid, MAP is 58 mm Hg. The provider orders norepinephrine 0.05 mcg/kg/min through the central line. The premixed bag contains norepinephrine 4 mg in 250 mL D5W.", "", "At what rate should the nurse set the pump?", "", "Answer: 15 mL/h (± 0.1). Round to the nearest tenth.", "  Concentration: 4 mg = 4,000 mcg; 4,000 mcg ÷ 250 mL = 16 mcg/mL", "  Dose: 0.05 mcg/kg/min × 80 kg = 4 mcg/min; 4 mcg/min × 60 min = 240 mcg/h", "  Rate: 240 mcg/h ÷ 16 mcg/mL = 15 mL/h", "", "Why: Convert the drug to mcg per mL, find the hourly dose for this client's weight, then divide by the concentration. Norepinephrine is a high-alert vasopressor, so the pump uses the drug library and a second nurse checks the setting.", "Tip: Write the units on every line; mg must become mcg and minutes must become hours before the units cancel to mL/h."], "st": "awaiting"}, {"id": "ngn:qb-pharm-8", "hash": "bc69f2e1b1", "title": "Insulin infusion rate · Take action", "body": ["A 24-year-old with type 1 diabetes is admitted in diabetic ketoacidosis and weighs 72 kg. Glucose is 486 mg/dL and potassium is 4.2 mEq/L. The order is regular insulin infusion at 0.1 units/kg/h. The bag contains regular insulin 100 units in 100 mL 0.9% sodium chloride.", "", "At what rate should the nurse set the pump?", "", "Answer: 7.2 mL/h. Round to the nearest tenth.", "  Concentration: 100 units ÷ 100 mL = 1 unit/mL", "  Dose: 0.1 units/kg/h × 72 kg = 7.2 units/h", "  Rate: 7.2 units/h ÷ 1 unit/mL = 7.2 mL/h", "", "Why: Multiply the weight by the ordered units per kg, then divide by the concentration. Potassium must be at least 3.5 mEq/L before insulin starts, because insulin drives potassium into the cells. Insulin is high alert, so a second nurse verifies the rate.", "Tip: With a 1 unit/mL bag, units/h and mL/h are the same number, which makes a quick check easy."], "st": "awaiting"}, {"id": "ngn:qb-pharm-23", "hash": "c372dad2d5", "title": "IV site complications · Analyze cues", "body": ["The nurse assesses the peripheral IV sites of several clients in the ICU at the start of the shift.", "", "For each finding, indicate whether it is most consistent with infiltration, phlebitis or extravasation.", "", "- Forearm site with 0.9% sodium chloride: skin cool, pale and swollen; the infusion has slowed → Infiltration", "  a nonvesicant fluid leaking into the tissue causes cool, pale swelling and a slowing flow.", "- Red streak running up the vein from the site, warm and tender, with a firm cord → Phlebitis", "  inflammation of the vein wall causes redness, warmth and tenderness along its path.", "- Hand site with norepinephrine: skin blanched and cold, client reports burning → Extravasation", "  norepinephrine is a vesicant; leaking into tissue causes vasoconstriction and can lead to tissue necrosis.", "- Antecubital site with lactated Ringer's: puffy, tight skin, no pain, blood return absent → Infiltration", "  a nonirritating fluid in the tissue causes swelling without much pain. The trap is calling all leaking fluid extravasation.", "- Site used for IV vancomycin for 3 days: redness and tenderness along the vein → Phlebitis", "  vancomycin irritates the vein wall, and the signs follow the vein rather than spreading into the tissue.", "- Blisters and darkening skin near a site where dopamine was infusing → Extravasation", "  dopamine is a vesicant, and blistering and dark skin show tissue damage from extravasation.", "", "Why: Infiltration is leakage of a nonvesicant fluid into the tissue. Extravasation is leakage of a vesicant, such as vasopressors or some chemotherapy, and can destroy tissue. Phlebitis is inflammation of the vein itself. For any of them, stop the infusion; for extravasation, follow the antidote protocol, such as phentolamine for norepinephrine.", "Tip: Ask what is leaking: a vesicant makes it extravasation, a plain fluid makes it infiltration, and no leak with a red vein is phlebitis."], "st": "awaiting"}, {"id": "ngn:qb-risk-2", "hash": "73a36fab01", "title": "ABG stepwise interpretation · Analyze cues", "body": ["A 58-year-old in the ICU after abdominal surgery received IV hydromorphone 1 hour ago. He is drowsy with RR 8 and shallow. ABG: pH 7.30, PaCO₂ 54 mm Hg, HCO₃ 25 mEq/L, PaO₂ 70 mm Hg.", "", "Place the steps for interpreting this ABG in the correct order.", "", "Correct order:", "1. Check the pH: 7.30 is below 7.35, so the client is acidotic", "  Yes: The pH comes first because it tells you whether the problem is acidosis or alkalosis; every later step is read against it.", "2. Check the PaCO₂ and HCO₃: PaCO₂ 54 mm Hg is above 45 (acid direction); HCO₃ 25 mEq/L is within 22 to 26 (normal)", "  Yes: Both values are read next: the PaCO₂ shows the lungs' part, since retained carbon dioxide acts as an acid, and the HCO₃ shows the metabolic part, which is normal here.", "3. Name the primary disorder from the value that explains the pH: a PaCO₂ of 54 mm Hg is acidic and matches the low pH, so this is respiratory acidosis", "  Yes: Only after both values are known can you name the primary disorder: the one that matches the pH is the cause.", "4. Check for compensation: the HCO₃ has not risen and the pH is still abnormal, so the acidosis is uncompensated", "  Yes: Compensation is judged last, by looking at the opposite system. Kidney compensation takes days, so an acute problem like this is uncompensated.", "", "Why: A consistent order prevents errors: pH, then PaCO₂ and HCO₃, then match the cause to the pH, then judge compensation. This client has uncompensated respiratory acidosis from opioid-induced hypoventilation. The priority is to stimulate breathing, support ventilation and anticipate naloxone.", "Tip: Always read the pH first; it is the anchor that tells you which abnormal value is the cause."], "st": "awaiting"}, {"id": "ngn:qb-risk-9", "hash": "63b4f8eae7", "title": "Increased intracranial pressure · Recognize cues", "body": ["A 34-year-old is in the neuro ICU after a traumatic brain injury from a motorcycle crash. Nurse's note at 03:00.", "", "Highlight the findings that require immediate follow-up.", "", "✓ highlight Opens eyes only to pain; was opening eyes to voice at 01:00.", "  Yes: A decline in level of consciousness is the earliest and most sensitive sign of rising intracranial pressure.", "✓ highlight Right pupil 6 mm and sluggish; left pupil 3 mm and brisk.", "  Yes: A new unequal, sluggish pupil signals pressure on the third cranial nerve and possible herniation.", "✓ highlight BP 178/62, up from 136/78.", "  Yes: Rising systolic pressure with a widening pulse pressure is part of Cushing triad, a late sign of increased ICP.", "✓ highlight HR 52, down from 88.", "  Yes: New bradycardia alongside rising blood pressure completes the picture of Cushing response and needs urgent action.", "- Head of bed at 30 degrees, head midline.", "  No: This positioning is correct; it promotes venous drainage from the brain and helps lower intracranial pressure.", "- Temperature 37.2 °C (99.0 °F).", "  No: This is normal. Fever would need treatment because it raises brain metabolism, but it is not present.", "- Urinary catheter draining clear yellow urine at 60 mL/h.", "  No: Urine output is adequate and normal in appearance, so it needs no follow-up.", "", "Why: Decreasing level of consciousness is the earliest sign of increased ICP. A new dilated, sluggish pupil, rising systolic pressure with a widening pulse pressure, and bradycardia point to brain herniation, a neurologic emergency. The provider is notified immediately while the nurse maintains measures that lower ICP.", "Tip: In neuro items, a change in level of consciousness is the first cue to flag, and vital sign changes are late."], "st": "awaiting"}, {"id": "ngn:qb-basic-3", "hash": "8e26368037", "title": "Aspiration during tube feeding · Prioritize hypotheses", "body": ["The ICU nurse receives report on four clients receiving continuous enteral feedings.", "", "Which client should the nurse assess first?", "", "- A client with two loose stools in the last 8 hours", "  No: Diarrhea is a common feeding problem that needs follow-up, but it is not as urgent as a threatened airway.", "- A client with the head of the bed at 35 degrees who is resting comfortably", "  No: Head of bed at 30 degrees or higher is correct aspiration prevention, and the client is stable.", "- A client with a gastric residual volume of 150 mL, within the unit's policy", "  No: A residual within policy does not require holding the feeding; it can be reassessed on schedule.", "✓ A client receiving feeding at 60 mL/h who is now coughing, with new gurgling breath sounds and SpO₂ 89% (was 96%)", "  Yes: New coughing, gurgling and falling oxygen saturation during a feeding suggest aspiration, an airway and breathing problem that needs action now.", "", "Why: Aspiration is the most dangerous complication of enteral feeding. A client with new coughing, gurgling and dropping oxygen saturation during a feeding needs immediate assessment: stop the feeding, suction as needed and notify the provider. The other clients are stable or have expected findings.", "Tip: When prioritizing, the client with a new airway or breathing change comes before clients with stable or chronic problems."], "st": "awaiting"}, {"id": "ngn:qb-phys-4", "hash": "0ca4f197da", "title": "Ventilator alarms · Analyze cues", "body": ["A 60-year-old in the ICU is intubated and on mechanical ventilation for pneumonia. The nurse is reviewing possible causes of ventilator alarms with a new graduate.", "", "For each cause, indicate whether it would trigger a high-pressure alarm or a low-pressure alarm.", "", "- Thick secretions in the airway that need suctioning → High-pressure alarm", "  secretions narrow the airway, so the ventilator needs more pressure to deliver each breath.", "- Client biting down on the endotracheal tube → High-pressure alarm", "  biting partly blocks the tube, which raises resistance and airway pressure. A bite block may be needed.", "- Client coughing or fighting the ventilator → High-pressure alarm", "  coughing against a delivered breath raises airway pressure. The nurse looks for causes such as pain, anxiety or hypoxemia.", "- Ventilator tubing disconnected from the endotracheal tube → Low-pressure alarm", "  air escapes into the room instead of the lungs, so pressure falls. This is the first thing to check at the bedside.", "- Leak around a deflated endotracheal tube cuff → Low-pressure alarm", "  air escapes around the tube, so the circuit cannot hold pressure. The client may be able to make sounds around the tube.", "- Water collected in a kinked section of tubing → High-pressure alarm", "  a kink or pooled water obstructs flow and raises pressure; the trap is assuming any tubing problem causes a low-pressure alarm.", "", "Why: High-pressure alarms mean something is blocking or resisting airflow: secretions, biting, coughing, kinks or bronchospasm. Low-pressure alarms mean air is escaping: a disconnection or a cuff leak. If the cause cannot be found quickly, the nurse removes the client from the ventilator and bags with 100% oxygen.", "Tip: Think high pressure means blocked and low pressure means leaking, then sort each cause by which one it produces."], "st": "awaiting"}, {"id": "ngn:qb-phys-6", "hash": "1ec608eac2", "title": "SIADH versus diabetes insipidus · Analyze cues", "body": ["The ICU nurse is caring for two clients after neurosurgery. Each develops a disorder of antidiuretic hormone (ADH): one has too much ADH and one has too little.", "", "For each finding, indicate whether it is more consistent with SIADH or with diabetes insipidus.", "", "- Serum sodium 124 mEq/L → SIADH", "  excess ADH makes the kidneys hold water, which dilutes the sodium in the blood.", "- Urine specific gravity 1.032 with low urine output → SIADH", "  the kidneys keep reabsorbing water, so the small amount of urine made is very concentrated.", "- Urine output 400 mL/h of pale, dilute urine → Diabetes insipidus", "  without ADH the kidneys cannot concentrate urine, so large volumes of dilute urine are lost.", "- Serum sodium 152 mEq/L with intense thirst → Diabetes insipidus", "  losing free water concentrates the blood, raising sodium and triggering thirst.", "- Treated with fluid restriction → SIADH", "  limiting water intake lets sodium rise back toward normal when the body is holding too much water.", "- Treated with desmopressin → Diabetes insipidus", "  desmopressin replaces the missing ADH. The trap is giving it in SIADH, which would worsen water retention.", "", "Why: SIADH and diabetes insipidus are mirror images. Too much ADH holds water, so urine is scant and concentrated and sodium falls. Too little ADH loses water, so urine is large and dilute and sodium rises. Fluid restriction treats SIADH; desmopressin and fluid replacement treat DI.", "Tip: Picture what ADH does to water, then decide whether each finding shows water held or water lost."], "st": "awaiting"}, {"id": "ngn:qb-phys-7", "hash": "31717faa99", "title": "Increased intracranial pressure · Recognize cues", "body": ["A 45-year-old is in the ICU after a traumatic brain injury from a fall. The nurse reviews the trends over the past 4 hours.", "", "Which set of findings requires the nurse to notify the provider immediately?", "", "- ICP 13 mm Hg with cerebral perfusion pressure 74 mm Hg", "  No: an ICP under 15 mm Hg and a CPP of 60 mm Hg or higher are within target ranges.", "✓ BP 184/62, HR 50, irregular respirations", "  Yes: a widening pulse pressure, bradycardia and irregular breathing are Cushing's triad, a late sign that the brainstem is being compressed.", "- Temperature 37.6 °C (99.7 °F) and GCS 14, unchanged", "  No: a stable GCS and a minimally raised temperature need monitoring but do not signal acute deterioration.", "- BP 128/76, HR 84, RR 16 and regular", "  No: these are normal vital signs with a normal pulse pressure and no sign of brainstem compression.", "", "Why: Cushing's triad is rising systolic pressure with a widening pulse pressure, bradycardia and an irregular breathing pattern. It is a late sign of increased intracranial pressure and can mean impending herniation. The earliest sign is usually a change in level of consciousness.", "Tip: When one option shows a combination of abnormal findings that make a named syndrome, that option usually carries the urgent cue."], "st": "awaiting"}, {"id": "ngn:sa-mgmt-4", "hash": "13329b2e2c", "title": "Honoring an advance directive · Take action", "body": ["An 81-year-old in the ICU with end-stage COPD has a signed advance directive declining intubation and a DNR order. She is alert, oriented and has decision-making capacity. Her son, who is her health care power of attorney, arrives and demands that \"everything be done,\" including a breathing tube.", "", "For each action, indicate whether it is appropriate or inappropriate.", "", "- Continue to follow the DNR order unless the client herself changes it → Appropriate", "  A competent adult's own decision guides care. Her advance directive and DNR order stand until she changes them.", "- Ask the client privately whether her wishes have changed → Appropriate", "  Asking her directly, away from family pressure, confirms her current wishes and respects her autonomy.", "- Change her code status to full code because the son is her power of attorney → Inappropriate", "  A health care power of attorney only decides when the client lacks capacity. She can speak for herself, so the son cannot override her.", "- Request a family meeting with the provider and offer an ethics consult → Appropriate", "  Conflict between family and a client's documented wishes is a classic reason for a family meeting and ethics support.", "- Stop her nebulizer treatments and oxygen because she is DNR → Inappropriate", "  DNR means no CPR if her heart stops; it does not mean no treatment. She still receives every other ordered therapy and comfort care.", "", "Why: A competent client's own choice outranks any surrogate. A power of attorney becomes active only when the client loses capacity. DNR limits resuscitation, not ordinary care, and conflict with family calls for communication and ethics support, not a change in orders.", "Tip: When family and client disagree, check capacity first; if the client has it, the client decides."], "st": "awaiting"}, {"id": "ngn:sa-basic-3", "hash": "992fdf9d56", "title": "Stage 3 pressure injury · Analyze cues", "body": ["A 68-year-old on day 9 of mechanical ventilation has a sacral wound. It is 4 cm by 3 cm with full-thickness skin loss. Subcutaneous fat is visible in the base. No bone, tendon or muscle is visible. The base is red with a small amount of yellow slough that does not hide the depth. Braden score is 11.", "", "Complete the sentences.", "", "Blank 1:", "✓ stage 3 pressure injury", "  Yes: full-thickness loss with visible fat but no exposed bone, tendon or muscle is stage 3. Slough that does not hide the base does not change the stage.", "- deep tissue pressure injury", "  No: deep tissue injury is intact or non-intact skin with persistent deep red, maroon or purple discoloration, not an open wound with visible fat.", "- stage 2 pressure injury", "  No: stage 2 is partial-thickness loss with exposed dermis; fat is never visible. Visible fat moves the wound past stage 2.", "Blank 2:", "- the surrounding skin had blanchable redness", "  No: blanchable redness around a wound is common and does not obscure the base. Nonblanchable redness on intact skin is stage 1.", "✓ slough or eschar covered the base so the depth could not be seen", "  Yes: unstageable means the depth is hidden by slough or eschar, so the true stage cannot be confirmed until the base is seen.", "- it produced moderate serous drainage", "  No: drainage amount is documented but does not change the stage. Staging is based on tissue depth.", "Blank 3:", "- massaging reddened areas over bony prominences to improve the circulation", "  No: massage over reddened bony areas damages fragile capillaries and deeper tissue. It is a classic trap.", "✓ repositioning at least every 2 hours with offloading of bony prominences", "  Yes: a Braden score of 11 means high risk. Regular turning and offloading relieve the pressure that causes tissue ischemia.", "- placing a ring-shaped cushion under the sacrum", "  No: ring or donut cushions concentrate pressure on the surrounding tissue and reduce blood flow. They are not recommended.", "", "Why: Pressure injuries are staged by the deepest tissue visible. Visible fat without bone, tendon or muscle is stage 3. If slough or eschar hides the base, the wound is unstageable. Prevention rests on pressure relief, moisture control and nutrition.", "Tip: Stage by the deepest layer you can see; if you cannot see the base, it is unstageable."], "st": "awaiting"}, {"id": "ngn:sa-pharm-6", "hash": "2227427c1a", "title": "Venous air embolism · Take action", "body": ["The nurse is changing the IV tubing on a 58-year-old's right internal jugular central venous catheter. The client suddenly sits up and coughs while the catheter hub is open. Within seconds he is short of breath and reports chest pain. HR 128, BP 86/50, RR 32, SpO₂ 84%. He is anxious and confused.", "", "Complete the diagram: the condition the client is most likely experiencing, two actions the nurse should take first, and two parameters to monitor.", "", "Condition:", "✓ Air embolism", "  Yes: an open central line during a cough or deep breath can draw air into the vein. Sudden dyspnea, chest pain, hypotension and hypoxia follow within seconds.", "- Catheter-related bloodstream infection", "  No: line infection develops over days with fever and chills, not within seconds of opening the hub.", "- Fluid volume overload", "  No: overload builds gradually with crackles and edema. Nothing here was infused rapidly.", "- Catheter occlusion", "  No: occlusion stops the line from flushing or infusing. It does not cause sudden cardiopulmonary collapse.", "Actions to take:", "✓ Clamp the catheter immediately", "  Yes: clamping stops more air from entering. It is the first action.", "✓ Place the client on the left side with the head lower than the feet", "  Yes: left side lying with the head down is the standard teaching to trap air in the right atrium and away from the pulmonary artery.", "- Flush the catheter with 10 mL normal saline", "  No: flushing the line could push more air into the circulation. The line should be clamped.", "- Raise the head of the bed to high Fowler's", "  No: sitting upright lets air travel to the brain and lungs more easily. It is the opposite of the needed position.", "- Remove the catheter and hold pressure", "  No: removing the catheter can let more air in through the open tract. It is not a first action.", "Parameters to monitor:", "✓ Oxygen saturation and respiratory effort", "  Yes: air blocking pulmonary blood flow causes hypoxemia, so oxygenation and work of breathing show whether the client is stabilizing.", "✓ Blood pressure and heart rate", "  Yes: air lock in the heart drops cardiac output. Blood pressure and heart rate reflect perfusion.", "- Temperature", "  No: temperature reflects infection, which is not the issue in the first minutes.", "- Blood glucose", "  No: glucose is unrelated to this emergency.", "- Serum magnesium", "  No: magnesium is not affected by air embolism and does not guide treatment.", "", "Why: Air can enter a central vein whenever the system is open and intrathoracic pressure drops, as with a cough or deep breath. Clamp the line, position the client on the left side with the head down, and give oxygen. Prevention is clamping and having the client hold the breath or perform a Valsalva maneuver during tubing changes.", "Tip: For sudden collapse during central line care, think air first, then stop the entry and position to trap the air."], "st": "awaiting"}, {"id": "ngn:sa-risk-4", "hash": "36ddd2918e", "title": "Chest tube disconnection · Take action", "body": ["A 47-year-old has a right chest tube connected to a water-seal drainage system for a pneumothorax. While the client is being turned, the chest tube separates from the drainage tubing at the connector. The client is awake. RR 24, SpO₂ 93% on 2 L nasal cannula.", "", "Which actions should the nurse take? Select all that apply.", "", "- Strip the chest tube to clear any clots.", "  No: stripping creates very high negative pressure and can damage lung tissue. It does nothing for a disconnection.", "✓ Place the end of the chest tube 2.5 cm (1 inch) below the surface of a bottle of sterile water.", "  Yes: submerging the end creates a temporary water seal, letting air escape from the chest while preventing air from being drawn in.", "✓ Notify the provider of the disconnection.", "  Yes: the provider needs to know and may order a chest x-ray to check lung reexpansion.", "- Clamp the chest tube until the provider arrives.", "  No: prolonged clamping traps air in the chest and can cause a tension pneumothorax. Clamping is only brief and only per order.", "✓ Assess respiratory rate, effort, breath sounds and SpO₂.", "  Yes: air entering the pleural space can enlarge the pneumothorax. Assessment shows whether the client is getting worse.", "- Remove the chest tube and cover the site with a gauze dressing.", "  No: the tube is still needed to drain air. Removal is done by the provider, not as a response to disconnection.", "✓ Set up a new sterile drainage system and connect it as soon as possible.", "  Yes: the disconnected tubing end is contaminated, so a new sterile system restores drainage and the seal.", "", "Why: A disconnected chest tube lets air enter the pleural space. Submerging the tube end in sterile water restores a one-way seal right away. The nurse then assesses breathing, notifies the provider and reconnects to a new sterile system.", "Tip: For chest tube emergencies, pick the action that restores a water seal; avoid prolonged clamping."], "st": "awaiting"}, {"id": "ngn:calc-19", "hash": "a906f4d1d2", "title": "Dopamine mcg/kg/min to mL/h · Take action", "body": ["A 67-year-old client in cardiogenic shock weighs 80 kg. The order reads dopamine 5 mcg/kg/min IV. The pharmacy sends dopamine 400 mg in 250 mL 5% dextrose.", "", "At what rate should the nurse set the pump in mL/h?", "", "Answer: 15 mL/h. Round to the nearest tenth.", "  Concentration: 400 mg / 250 mL = 1.6 mg/mL = 1,600 mcg/mL.", "  Dose per hour: 5 mcg/kg/min x 80 kg x 60 min = 24,000 mcg/h.", "  Rate: 24,000 mcg/h / 1,600 mcg/mL = 15 mL/h.", "  Answer: 15 mL/h", "", "Why: Vasoactive drips are high-alert medications titrated to blood pressure and perfusion, so an error in rate quickly changes hemodynamics. Run them on a dedicated line through a pump, preferably a central line, and check the site often for extravasation.", "Tip: For mcg/kg/min: multiply dose x kg x 60 to get mcg/h, then divide by the concentration in mcg/mL."], "st": "awaiting"}, {"id": "ngn:calc-21", "hash": "73693fc779", "title": "Amiodarone mg/min to mL/h · Take action", "body": ["A 63-year-old client with recurrent ventricular tachycardia finished an amiodarone loading infusion. The order now reads amiodarone 1 mg/min IV for 6 hours. The premixed bag is amiodarone 360 mg in 200 mL.", "", "At what rate should the nurse set the pump in mL/h?", "", "Answer: 33.3 mL/h. Round to the nearest tenth.", "  Concentration: 360 mg / 200 mL = 1.8 mg/mL.", "  Dose per hour: 1 mg/min x 60 min = 60 mg/h.", "  Rate: 60 mg/h / 1.8 mg/mL = 33.33 mL/h.", "  Answer: 33.3 mL/h", "", "Why: Amiodarone can cause hypotension and bradycardia during infusion, so continuous cardiac monitoring and frequent blood pressure checks are needed. It is irritating to veins, which is why concentrated infusions are given through a central line when possible.", "Tip: For mg/min drips: mg/min x 60 = mg/h, then divide by mg/mL."], "st": "awaiting"}, {"id": "ngn:calc-22", "hash": "da330c56fd", "title": "Lidocaine mg/min to mL/h · Take action", "body": ["A 70-year-old client on telemetry has an order for lidocaine 2 mg/min IV continuous infusion. The premixed bag is lidocai
