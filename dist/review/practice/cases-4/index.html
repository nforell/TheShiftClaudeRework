<style>
:root{--bg:#E6EDF0;--surface:#FBFCFC;--surface-2:#EDF2F4;--ink:#152238;--ink-2:#4D5A6F;--line:#CAD5DB;--teal:#2449A8;--teal-ink:#fff;--red:#B3342B;--red-bg:#F8E1DE;--good:#2B7249;--good-bg:#E0F0E6;--amber:#A96C0E;--amber-bg:#FBEFD6;
  --serif:"Barlow Condensed","Arial Narrow",sans-serif;--sans:"Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161C;--surface:#1A1F27;--surface-2:#212833;--ink:#E7E4DB;--ink-2:#A0A5AE;--line:#343C48;--teal:#93B4E4;--teal-ink:#0F1B2C;--red:#F0766B;--red-bg:#3b1d1b;--good:#72c692;--good-bg:#16301f;--amber:#E9AE4E;--amber-bg:#35291a}}
:root[data-theme="dark"]{--bg:#12161C;--surface:#1A1F27;--surface-2:#212833;--ink:#E7E4DB;--ink-2:#A0A5AE;--line:#343C48;--teal:#93B4E4;--teal-ink:#0F1B2C;--red:#F0766B;--red-bg:#3b1d1b;--good:#72c692;--good-bg:#16301f;--amber:#E9AE4E;--amber-bg:#35291a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
main{max-width:52rem;margin:0 auto;padding:clamp(1.2rem,5vw,3rem) 16px calc(5rem + env(safe-area-inset-bottom))}
a{color:var(--teal)}
.home{font-family:var(--serif);font-weight:700;font-size:1.1rem;letter-spacing:.04em;text-transform:uppercase;background:var(--ink);color:var(--bg);padding:.28em .55em .22em;border-radius:2px;text-decoration:none}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.9rem,6vw,2.6rem);line-height:1.1;letter-spacing:0;margin:1.6rem 0 .3rem}
h2{font-size:1.15rem;margin:2.4rem 0 .6rem}
h3{font-size:1rem;margin:0}
p{margin:.5rem 0}
.muted{color:var(--ink-2)}
.meta{display:flex;flex-wrap:wrap;gap:.4rem .6rem;margin-top:.6rem}
.chip{display:inline-flex;align-items:center;padding:.15em .6em;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--surface-2);border:1px solid var(--line)}
.chip.awaiting{background:var(--amber-bg);border-color:transparent;color:var(--amber)}
.chip.reviewed{background:var(--good-bg);border-color:transparent;color:var(--good)}
.chip.changed{background:var(--red-bg);border-color:transparent;color:var(--red)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem 1.1rem;margin:.8rem 0}
.how ol{margin:.4rem 0 0;padding-left:1.2rem}.how li{margin:.2rem 0}
label{display:block;font-weight:600;font-size:.9rem;margin:.7rem 0 .25rem}
input[type=text],input[type=email],textarea,select{width:100%;min-height:44px;padding:.5em .7em;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:5rem;resize:vertical}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:0 1rem}
details.pt{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:.6rem 0}
details.pt>summary{cursor:pointer;padding:.85rem 1rem;font-weight:600;list-style-position:inside}
details.pt>div{padding:0 1rem 1rem}
table{width:100%;border-collapse:collapse;font-size:.88rem;margin:.4rem 0}
th,td{text-align:left;vertical-align:top;padding:.35rem .5rem .35rem 0;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--ink-2);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
.scroll{overflow-x:auto}
ul.plain{margin:.3rem 0;padding-left:1.1rem}
.dec{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:.85rem 1rem;margin:.6rem 0}
.dec.pos{border-left-color:var(--good)}.dec.neg{border-left-color:var(--red)}
.dec .top{display:flex;flex-wrap:wrap;gap:.3rem .5rem;align-items:center;font-size:.78rem;color:var(--ink-2);font-weight:600}
.pts{font-weight:700;padding:.05em .45em;border-radius:4px;background:var(--surface-2)}
.pos .pts{color:var(--good);background:var(--good-bg)}.neg .pts{color:var(--red);background:var(--red-bg)}
.dec b{display:block;margin:.35rem 0 .15rem;font-size:1rem}
.dec .why{font-family:var(--sans);color:var(--ink-2);margin:0}
.dec .src{font-size:.75rem;color:var(--ink-2);margin-top:.35rem}
.verdict{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.7rem}
.verdict button{min-height:40px;padding:.35em .9em;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer}
.verdict button[aria-pressed="true"][data-v="ok"]{background:var(--good);border-color:var(--good);color:var(--teal-ink)}
.verdict button[aria-pressed="true"][data-v="fix"]{background:var(--red);border-color:var(--red);color:var(--teal-ink)}
.verdict button[aria-pressed="true"][data-v="unsure"]{background:var(--amber);border-color:var(--amber);color:var(--teal-ink)}
.dec textarea{margin-top:.5rem;min-height:3.6rem}
.opt{padding:.4rem 0;border-bottom:1px solid var(--line);font-size:.92rem}.opt:last-child{border:0}
.opt i{font-style:normal;font-weight:700;font-size:.75rem;padding:.05em .4em;border-radius:4px;margin-right:.4rem;background:var(--surface-2)}
.bar{position:sticky;top:0;z-index:5;margin:0 -16px;padding:.6rem 16px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:.6rem;font-size:.9rem}
.bar .prog{display:block;flex:1;min-width:4rem;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;max-width:12rem}.bar .prog i{display:block;height:100%;background:var(--teal)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:.55em 1.2em;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn-primary{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.row{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1rem}
.check{display:flex;gap:.6rem;align-items:flex-start;font-weight:500;margin-top:1rem}
.check input{width:1.2rem;height:1.2rem;margin-top:.2rem;flex:none}
.msg{margin-top:.8rem;font-weight:600}.msg.err{color:var(--red)}.msg.ok{color:var(--good)}
pre{white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:.8rem;font-size:.8rem;max-height:18rem;overflow:auto}
.shifts a{display:block;text-decoration:none;color:inherit}
.shifts .card:hover{border-color:var(--ink-2)}
</style>

rted as Tuesday about 16:00. Weight 82 kg (181 lb).", "Vital Signs Tuesday 21:00: Temperature 36.9 °C (98.4 °F); Heart rate 84; Blood pressure 134/82; Respiratory rate 16; SpO₂ 97% on room air", "Nurses' Notes Thursday 08:00: Awake since 04:00, says he cannot sleep. Coarse tremor of both hands when arms are extended. Skin moist and forehead beaded with sweat. Right ankle pain 5/10, splint intact, toes warm with brisk capillary refill. Reports nausea and has asked for an emesis basin twice. Anxious and keeps asking if he can leave. Wife, visiting, states he drinks a 12-pack of beer and a pint of vodka every day and had a seizure when he stopped drinking 2 years ago. Voided 400 mL clear yellow urine.", "Vital Signs Thursday 08:00: Temperature 37.9 °C (100.2 °F); Heart rate 116; Blood pressure 162/98; Respiratory rate 22; SpO₂ 96% on room air", "Laboratory Results Thursday 09:10 (shown from item 2): Magnesium 1.3 mg/dL (low); Potassium 3.1 mEq/L (low); Sodium 136 mEq/L; Glucose 74 mg/dL; AST 112 units/L (high); ALT 48 units/L (high); MCV 104 fL (high); Platelets 112,000/mm³ (low)", "Nurses' Notes Thursday 09:15 (shown from item 2): CIWA-Ar score 14. Tremor and sweating unchanged. Oriented to person, place, time and situation.", "Nurses' Notes Thursday 10:30 (shown from item 3): Picking at the blanket. States, \"There are spiders crawling on the wall.\" Knows he is in the hospital and states the correct date. Pulled at the splint strap twice; reoriented. CIWA-Ar score 17. Provider notified.", "Orders Thursday 10:45 (shown from item 4): CIWA-Ar every 1 hour until below 10 on 2 checks in a row, then every 4 hours. Lorazepam IV per CIWA-Ar: score 10 to 15, 1 mg; score 16 to 20, 2 mg; above 20, 2 mg and notify provider. Hold lorazepam for RR below 12 or if client does not rouse to voice. Thiamine 100 mg IV now, then daily. After thiamine is given, start D5 0.45% NaCl with 20 mEq KCl/L at 100 mL/h. Magnesium sulfate 2 g IV over 2 hours. Folic acid 1 mg PO daily. Multivitamin PO daily. Seizure precautions. Fall precautions with bed alarm.", "Medication Administration Record Thursday 10:55 (shown from item 5): Thiamine 100 mg IV given at 10:55. Magnesium sulfate and D5 0.45% NaCl with KCl not yet started.", "Nurses' Notes Thursday 11:00 (shown from item 5): CIWA-Ar score 19; no lorazepam given yet. Sees spiders on the ceiling, still oriented. Diaphoretic, tremor visible at rest. BP 168/100, HR 124, RR 20, SpO₂ 96% on room air. Asks to walk to the bathroom.", "Nurses' Notes Friday 08:00 (shown from item 6): CIWA-Ar checked per protocol overnight, including 15 at 00:00, 11 at 03:00, 8 at 06:00 and 6 at 07:00. Lorazepam given 1 mg at 00:00 and 1 mg at 03:00; none since. No hallucinations since 03:00. Oriented to person, place, time and situation. Slight hand tremor only. Sleeping between checks and rouses easily to voice. States, \"Once this cast is on I will just cut back to a few beers a night.\"", "Vital Signs Friday 08:00 (shown from item 6): Temperature 37.1 °C (98.8 °F); Heart rate 88; Blood pressure 138/84; Respiratory rate 16; SpO₂ 97% on room air", "Laboratory Results Friday 06:00 (shown from item 6): Magnesium 1.9 mg/dL; Potassium 4.0 mEq/L; Glucose 96 mg/dL", "", "Refer to the chart. It is Thursday 08:00, about 40 hours after the client's reported last drink.", "", "Highlight the findings in the nurse's note that require follow-up.", "", "✓ highlight Coarse tremor of both hands when arms are extended.", "  Yes: tremor is one of the earliest signs of alcohol withdrawal, caused by rebound nervous system excitation once alcohol is removed.", "✓ highlight Skin moist and forehead beaded with sweat.", "  Yes: diaphoresis reflects autonomic hyperactivity in withdrawal and is scored on the CIWA-Ar.", "- Right ankle pain 5/10, splint intact, toes warm with brisk capillary refill.", "  No: moderate pain with good circulation distal to the splint is expected after a fracture and shows no compartment or perfusion problem.", "✓ highlight Reports nausea and has asked for an emesis basin twice.", "  Yes: nausea and vomiting are part of the withdrawal picture and also raise the risk of fluid and electrolyte loss.", "✓ highlight Anxious and keeps asking if he can leave.", "  Yes: anxiety and restlessness are scored withdrawal signs, and a wish to leave raises safety and fall concerns for a client who cannot bear weight.", "✓ highlight Wife states he drinks a 12-pack of beer and a pint of vodka every day and had a seizure when he stopped drinking 2 years ago.", "  Yes: heavy daily use and a prior withdrawal seizure are the strongest predictors of severe withdrawal, seizures and delirium tremens.", "- Voided 400 mL clear yellow urine.", "  No: adequate clear urine output shows he is not yet significantly dehydrated; this finding is reassuring.", "", "Why: Tremor, sweating, nausea and anxiety starting 1 to 2 days after the last drink point to alcohol withdrawal. The wife's report reveals the real intake and a prior withdrawal seizure, which predicts a severe course. The ankle findings are expected for a splinted fracture.", "Tip: When new symptoms appear a day or two into a hospital stay, ask what substance the client may have stopped when admitted."], "st": "awaiting"}, {"id": "ngn:cs-alcohol-withdrawal-2", "hash": "c1a548e861", "title": "Ankle fracture that turns into alcohol withdrawal · item 2 · Matrix · Analyze cues", "body": ["Refer to the chart. Morning labs have returned and the CIWA-Ar score is 14.", "", "For each finding, indicate whether it is most consistent with acute alcohol withdrawal, chronic heavy alcohol use, or the ankle fracture.", "", "- Coarse tremor and sweating 40 hours after the last drink → Acute alcohol withdrawal", "  these start 6 to 24 hours after the last drink as the brain, adapted to alcohol, becomes overexcited.", "- HR 116 and BP 162/98, up from 84 and 134/82 on admission → Acute alcohol withdrawal", "  the rise came with tremor and sweating while pain stayed moderate, pointing to withdrawal autonomic hyperactivity rather than the fracture.", "- MCV 104 fL and platelets 112,000/mm³ → Chronic heavy alcohol use", "  large red cells and low platelets come from alcohol's toxic effect on the marrow and poor folate intake over months.", "- AST 112 units/L with ALT 48 units/L → Chronic heavy alcohol use", "  an AST more than twice the ALT is the classic pattern of alcohol-related liver injury.", "- Magnesium 1.3 mg/dL → Chronic heavy alcohol use", "  alcohol causes poor intake and kidney wasting of magnesium; low magnesium also lowers the seizure threshold during withdrawal.", "- Right ankle pain 5/10 with swelling under the splint → Ankle fracture", "  pain and swelling are expected local effects of the fracture and do not explain the systemic signs.", "", "Why: Separating acute withdrawal from the marks of long-term drinking clarifies the problem. Tremor, sweating and rising vital signs are acute withdrawal. Macrocytosis, low platelets, the AST to ALT pattern and low magnesium show months of heavy use. The fracture explains only the local ankle findings.", "Tip: Ask whether a finding developed over hours or over months; acute signs belong to withdrawal, slow changes belong to chronic use."], "st": "awaiting"}, {"id": "ngn:cs-alcohol-withdrawal-3", "hash": "9ba2ca09b6", "title": "Ankle fracture that turns into alcohol withdrawal · item 3 · Drop-down · Prioritize hypotheses", "body": ["Refer to the chart.", "", "Complete the sentences.", "", "Blank 1:", "- a new dementia", "  No: dementia develops over months and does not appear suddenly with tremor, sweating and tachycardia.", "- delirium tremens with autonomic instability", "  No: delirium tremens adds disorientation and a fluctuating level of consciousness; this client still knows where he is and the date.", "✓ alcohol withdrawal with hallucinations", "  Yes: withdrawal hallucinations usually appear within 12 to 48 hours of the last drink while the client stays oriented.", "Blank 2:", "✓ seizures and progression to delirium tremens", "  Yes: seizures and delirium tremens are the life-threatening complications of withdrawal, and his history and labs put him at high risk.", "- dehydration from sweating", "  No: fluid loss matters, but urine output is adequate and dehydration is not the immediate threat to life.", "- compartment syndrome developing in the right ankle", "  No: the toes are warm with brisk refill and pain is stable, so there are no cues for compartment syndrome.", "Blank 3:", "- 6 to 12 hours", "  No: 6 to 12 hours is when early tremor and anxiety begin, not delirium tremens.", "- 7 to 10 days", "  No: by 7 to 10 days most acute withdrawal has resolved; this is too late for typical delirium tremens.", "✓ 48 to 96 hours", "  Yes: delirium tremens usually starts 2 to 4 days after the last drink, so this client is entering the high-risk window now.", "", "Why: This client has worsening withdrawal with hallucinations but an intact sensorium, so this is not yet delirium tremens. He is entering the 48 to 96 hour window, and his prior seizure and low magnesium make seizures and delirium tremens the priority threats.", "Tip: Orientation is the dividing line: hallucinations with intact orientation are withdrawal hallucinosis, while confusion and fluctuating awareness signal delirium tremens."], "st": "awaiting"}, {"id": "ngn:cs-alcohol-withdrawal-4", "hash": "09d881d0a3", "title": "Ankle fracture that turns into alcohol withdrawal · item 4 · Select all · Generate solutions", "body": ["Refer to the chart. The provider has written new orders.", "", "Which interventions should the nurse include in the plan of care? Select all that apply.", "", "✓ Reassess the CIWA-Ar every hour and give lorazepam based on the score", "  Yes: symptom-triggered dosing matches the benzodiazepine to the severity of withdrawal and limits oversedation.", "✓ Keep the bed in the lowest position with the bed alarm on", "  Yes: he is non-weight-bearing, hallucinating and wants to leave, so a low bed and alarm reduce the risk of a fall.", "✓ Keep oxygen and suction set up at the bedside", "  Yes: seizure precautions include equipment to clear and protect the airway if a withdrawal seizure occurs.", "✓ Give thiamine before starting the dextrose-containing IV fluid", "  Yes: glucose given to a thiamine-deficient client can trigger or worsen Wernicke encephalopathy, so thiamine goes first.", "- Apply wrist restraints to keep him from pulling at the splint", "  No: restraints increase agitation and injury risk; they are a last resort after less restrictive measures and adequate sedation.", "- Turn off the lights and close the door so he can rest", "  No: a dark room deepens misperceptions and prevents close observation of a high-risk client.", "- Hold lorazepam until the hallucinations stop", "  No: benzodiazepines are the treatment for withdrawal; withholding them allows progression to seizures and delirium tremens.", "✓ Keep the room quiet and well lit and reorient him often", "  Yes: low stimulation calms the overexcited nervous system, and good lighting reduces misreading of shadows into hallucinations.", "", "Why: Care in alcohol withdrawal rests on symptom-triggered benzodiazepines, nutrient and electrolyte replacement and safety. Thiamine comes before dextrose to prevent Wernicke encephalopathy. Seizure and fall precautions protect a client who is agitated and cannot bear weight.", "Tip: For withdrawal, group the plan into three buckets: treat the withdrawal, replace what alcohol depleted, and keep the client safe."], "st": "awaiting"}, {"id": "ngn:cs-alcohol-withdrawal-5", "hash": "fad52a7c98", "title": "Ankle fracture that turns into alcohol withdrawal · item 5 · Matrix · Take action", "body": ["Refer to the chart.", "", "For each action, indicate whether it is indicated or not indicated at this time.", "", "- Give lorazepam 2 mg IV per the CIWA-Ar protocol → Indicated", "  a score of 19 falls in the 16 to 20 range, which calls for 2 mg; he rouses easily and RR is 20.", "- Start D5 0.45% NaCl with 20 mEq KCl/L at 100 mL/h → Indicated", "  thiamine was given at 10:55, so dextrose can now run safely, and the added potassium treats his level of 3.1 mEq/L.", "- Start magnesium sulfate 2 g IV over 2 hours → Indicated", "  replacing magnesium raises the seizure threshold and helps potassium correct, since low magnesium keeps potassium low.", "- Recheck the CIWA-Ar and vital signs in 1 hour → Indicated", "  the protocol calls for hourly scoring while the score is 10 or higher to judge the response to each dose.", "- Give haloperidol for the hallucinations → Not indicated", "  it is not ordered and antipsychotics lower the seizure threshold; benzodiazepines are the treatment for withdrawal hallucinations.", "- Help him walk to the bathroom with a gait belt → Not indicated", "  he is non-weight-bearing on a fractured ankle and is tremulous and hallucinating; offer a urinal at the bedside instead.", "", "Why: Withdrawal is worsening, so the next lorazepam dose follows the protocol range. Thiamine is in, so the dextrose fluid with potassium can start along with magnesium. Hourly scoring guides the next dose. CIWA-Ar dose ranges vary by facility protocol, so follow the one ordered. Antipsychotics and walking on the fracture both add risk.", "Tip: Before giving a protocol drug, match the current score to the dose range and check the hold parameters."], "st": "awaiting"}, {"id": "ngn:cs-alcohol-withdrawal-6", "hash": "c06cd57141", "title": "Ankle fracture that turns into alcohol withdrawal · item 6 · Matrix · Evaluate outcomes", "body": ["Refer to the chart.", "", "For each finding, indicate whether it shows the plan is effective or needs follow-up.", "", "- CIWA-Ar scores fell from 15 at midnight to 6 at 07:00 → Effective", "  a steady fall to below 10 shows the symptom-triggered lorazepam is controlling the withdrawal.", "- HR 88 and BP 138/84 → Effective", "  the autonomic hyperactivity has settled from HR 124 and BP 168/100 the day before.", "- Oriented, with no hallucinations since 03:00 → Effective", "  clearing hallucinations with intact orientation show he has not progressed to delirium tremens.", "- Sleeping between checks and rouses easily to voice, RR 16 → Effective", "  he is resting without being oversedated; the lorazepam hold criteria are not met.", "- Magnesium 1.9 mg/dL and potassium 4.0 mEq/L → Effective", "  both are now in the normal range after replacement, lowering seizure and dysrhythmia risk.", "- States he will \"just cut back to a few beers a night\" after surgery → Needs follow-up", "  this shows he does not see the need for abstinence after a withdrawal seizure history; plan teaching and a referral for alcohol use treatment.", "", "Why: Falling CIWA-Ar scores, normal vital signs, clearing hallucinations and normal electrolytes show the treatment is working. He is still inside the 48 to 96 hour window, so scoring continues. His plan to keep drinking needs a brief intervention and referral before discharge.", "Tip: Evaluate against the same measures that triggered treatment, then look for what the plan has not yet addressed."], "st": "awaiting"}, {"id": "ngn:cs-aki-hyperkalemia-1", "hash": "283db08e1f", "title": "Stomach bug that ends in hyperkalemia · item 1 · Select all · Recognize cues", "body": ["Client: 70-year-old woman admitted to the step-down unit from the ED with dehydration and acute kidney injury", "History and Physical 08:30: Four days of vomiting and watery diarrhea after a family gathering where others were ill. Eating and drinking very little. Kept taking all home medications: lisinopril 20 mg daily, spironolactone 25 mg daily for hypertension, and ibuprofen 400 mg three times daily for knee osteoarthritis, started 2 weeks ago. Baseline creatinine 0.9 mg/dL 6 months ago. Received 1 L 0.9% NaCl in the ED. Weight 68 kg (150 lb).", "Laboratory Results 07:45: Potassium 6.5 mEq/L (high); Sodium 132 mEq/L (low); Bicarbonate 17 mEq/L (low); BUN 62 mg/dL (high); Creatinine 2.6 mg/dL (high); Glucose 104 mg/dL", "Vital Signs 09:00: Temperature 37.3 °C (99.1 °F); Heart rate 96; Blood pressure 94/52 lying; 80/48 standing; Respiratory rate 18; SpO₂ 97% on room air", "Nurses' Notes 09:00: Arrived from ED. Telemetry applied: sinus rhythm 96 with tall, peaked T waves. Mucous membranes dry. Dizzy on standing. States, \"My legs feel heavy and weak.\" Voided 60 mL dark amber urine; 60 mL total since 05:00. Knee pain 3/10.", "Laboratory Results 09:40 (shown from item 2): Urine specific gravity 1.030 (high); Urine sodium 12 mEq/L (low)", "Nurses' Notes 10:00 (shown from item 3): Telemetry: sinus rhythm 92, T waves remain tall and peaked, PR 0.22 seconds, QRS 0.10 seconds. Client resting in bed, call light in reach.", "Medication Administration Record 10:15 (shown from item 4): Admission orders continued from home medication list: lisinopril 20 mg PO daily at 10:00; spironolactone 25 mg PO daily at 10:00; ibuprofen 400 mg PO every 8 hours as needed for knee pain. New: acetaminophen 650 mg PO every 6 hours as needed for pain; ondansetron 4 mg IV every 6 hours as needed for nausea; 0.9% NaCl IV at 125 mL/h.", "Orders 10:30 (shown from item 5): Continuous cardiac monitoring. Calcium gluconate 10%, 1 g (10 mL) IV over 10 minutes now. Dextrose 50%, 25 g (50 mL) IV with regular insulin 10 units IV now. Sodium zirconium cyclosilicate 10 g PO now. Discontinue lisinopril, spironolactone and ibuprofen. Strict intake and output. Capillary glucose every hour for 4 hours after insulin. Repeat potassium and 12-lead ECG 2 hours after insulin.", "Nurses' Notes 14:00 (shown from item 6): Potassium 5.3 mEq/L. T waves now normal height on telemetry. Urine output 150 mL over the last 3 hours. BP 116/68 lying, no dizziness when standing. Capillary glucose 62 mg/dL. Fine crackles in both lung bases. Asked her daughter to bring her ibuprofen from home.", "Intake and Output 14:00 (shown from item 6): IV intake since 10:00 500 mL; Oral intake since 10:00 240 mL; Urine output 11:00 to 14:00 150 mL", "", "Refer to the chart. The client has just arrived on the step-down unit.", "", "Which findings require immediate follow-up? Select all that apply.", "", "✓ \"My legs feel heavy and weak.\"", "  Yes: high potassium impairs muscle cell firing, causing weakness that starts in the legs and can progress.", "- Glucose 104 mg/dL", "  No: this is a normal value; it becomes important only as a baseline before insulin is given.", "- Temperature 37.3 °C (99.1 °F)", "  No: this is within normal limits and does not suggest infection or a new problem.", "- Knee pain 3/10", "  No: mild chronic knee pain is her baseline osteoarthritis and is not an urgent finding.", "✓ Tall, peaked T waves on telemetry", "  Yes: peaked T waves show high potassium is already affecting cardiac conduction; this is the earliest ECG sign.", "✓ Urine output 60 mL since 05:00", "  Yes: about 15 mL/h is well below 0.5 mL/kg/h (34 mL/h for 68 kg), so she is oliguric.", "✓ Creatinine 2.6 mg/dL, baseline 0.9 mg/dL", "  Yes: nearly tripling the baseline creatinine meets criteria for acute kidney injury, which explains why potassium is building up.", "✓ Potassium 6.5 mEq/L", "  Yes: potassium above 6 mEq/L can cause lethal dysrhythmias and is a medical emergency, especially with ECG changes.", "", "Why: The urgent cues cluster around two linked problems: kidneys that have suddenly stopped clearing waste, and potassium high enough to affect the heart and muscles. Peaked T waves with a potassium of 6.5 make this an emergency. Normal temperature, glucose and mild knee pain are not priorities.", "Tip: Look for cues that connect: a lab abnormality plus an organ showing its effect, like high potassium plus ECG changes, deserves the fastest response."], "st": "awaiting"}, {"id": "ngn:cs-aki-hyperkalemia-2", "hash": "dea9a04b44", "title": "Stomach bug that ends in hyperkalemia · item 2 · Drop-down · Analyze cues", "body": ["Refer to the chart. Urine studies have returned.", "", "Complete the sentences.", "", "Blank 1:", "✓ prerenal", "  Yes: the kidneys are holding on to sodium and water because blood flow to them is low, which concentrates the urine and raises BUN out of proportion.", "- postrenal", "  No: postrenal injury comes from obstruction of urine flow, such as an enlarged prostate or stones, with no cues here.", "- intrarenal", "  No: damage to the tubules, as in acute tubular necrosis, impairs sodium reabsorption, so urine sodium would be high and urine dilute.", "Blank 2:", "- dilating the efferent arteriole", "  No: dilating the efferent arteriole is how ACE inhibitors act, not NSAIDs.", "- directly obstructing the ureters and raising pressure in the kidney", "  No: NSAIDs do not obstruct the ureters; this would be a postrenal cause.", "✓ blocking prostaglandins that dilate the afferent arteriole", "  Yes: when volume is low, prostaglandins keep the vessel into the glomerulus open; NSAIDs remove that protection and blood flow into the glomerulus falls.", "Blank 3:", "- raising blood volume", "  No: ACE inhibitors lower blood pressure and do not raise blood volume.", "- causing direct tubular toxicity", "  No: ACE inhibitors change blood flow in the glomerulus; they are not tubular toxins like aminoglycosides.", "✓ dilating the efferent arteriole, which lowers filtration pressure", "  Yes: angiotensin II normally tightens the vessel leaving the glomerulus to keep pressure up; blocking it drops filtration when the client is dry.", "", "Why: Vomiting and diarrhea reduced blood volume. The diuretic removed more fluid, the NSAID narrowed the vessel into the glomerulus, and the ACE inhibitor widened the vessel out of it. This combination, called the triple whammy, collapses filtration pressure. ACE inhibitors and spironolactone also hold potassium in.", "Tip: For kidney injury, sort the cause by location first: before the kidney, in the kidney, or after it, then ask which drugs affect each spot."], "st": "awaiting"}, {"id": "ngn:cs-aki-hyperkalemia-3", "hash": "6b0363b1fb", "title": "Stomach bug that ends in hyperkalemia · item 3 · Matrix · Prioritize hypotheses", "body": ["Refer to the chart. It is 10:00.", "", "For each client problem, indicate whether it is the top priority now, a concern to address after the priority, or not supported by the data.", "", "- Risk for a lethal dysrhythmia from hyperkalemia → Top priority now", "  potassium of 6.5 with peaked T waves and a lengthening PR interval can progress to ventricular fibrillation or asystole within minutes.", "- Fluid volume deficit from vomiting and diarrhea → Address after the priority", "  it caused the kidney injury and needs IV fluid replacement, but it threatens life less quickly than the heart rhythm.", "- Risk for falls from orthostatic hypotension and leg weakness → Address after the priority", "  she is dizzy on standing with weak legs, so fall precautions are needed, but this follows the cardiac threat.", "- Fluid volume overload → Not supported by the data", "  she is dry, with dry membranes and orthostatic hypotension; there are no crackles or edema at this point.", "- Hypoglycemia → Not supported by the data", "  glucose is 104 mg/dL; this becomes a risk only after insulin is given.", "- Metabolic alkalosis → Not supported by the data", "  bicarbonate is 17 mEq/L, which shows metabolic acidosis from kidney injury, not alkalosis.", "", "Why: Several problems are real, but only one can stop the heart within minutes. Hyperkalemia with ECG changes comes first. Volume depletion and fall risk are important and are addressed next. Overload, hypoglycemia and alkalosis are not supported by the current data.", "Tip: When ranking problems, choose the one that threatens life soonest; a lab plus ECG change beats a slower process."], "st": "awaiting"}, {"id": "ngn:cs-aki-hyperkalemia-4", "hash": "5baa588b23", "title": "Stomach bug that ends in hyperkalemia · item 4 · Matrix · Generate solutions", "body": ["Refer to the chart. It is 10:15, and the 10:00 medications are due.", "", "For each medication order on the MAR, indicate whether the nurse should give it as ordered or hold it and clarify with the provider.", "", "- Lisinopril 20 mg PO daily → Hold and clarify", "  ACE inhibitors raise potassium and reduce filtration pressure, and her BP is already 94/52; giving it worsens all three problems.", "- Spironolactone 25 mg PO daily → Hold and clarify", "  this potassium-sparing diuretic blocks potassium excretion and removes more fluid from a dry client.", "- Ibuprofen 400 mg PO every 8 hours as needed → Hold and clarify", "  NSAIDs reduce kidney blood flow and are nephrotoxic in AKI; this was one cause of her injury.", "- Acetaminophen 650 mg PO every 6 hours as needed → Give as ordered", "  acetaminophen is the safer analgesic for her knee because it does not affect kidney blood flow or potassium.", "- 0.9% NaCl IV at 125 mL/h → Give as ordered", "  restoring volume improves kidney perfusion, the main fix for prerenal injury; the nurse watches lung sounds as fluid goes in.", "- Ondansetron 4 mg IV every 6 hours as needed → Give as ordered", "  controlling nausea helps her take oral fluids and has no effect on kidney function or potassium.", "", "Why: Home medications are often continued automatically at admission. Three of them caused this injury: the ACE inhibitor, the potassium-sparing diuretic and the NSAID. The nurse holds them and calls the provider. Fluids, acetaminophen and an antiemetic support recovery.", "Tip: Before giving any medication in kidney injury, ask whether it lowers kidney blood flow, is cleared by the kidney, or raises potassium."], "st": "awaiting"}, {"id": "ngn:cs-aki-hyperkalemia-5", "hash": "e40d0edfdc", "title": "Stomach bug that ends in hyperkalemia · item 5 · Ordered response · Take action", "body": ["Refer to the chart.", "", "Place the nurse's actions in the order they should be performed.", "", "Correct order:", "1. Confirm continuous cardiac monitoring is running with the emergency cart nearby", "  Yes: the heart must be watched continuously before and during treatment, since dysrhythmias can occur at any moment and calcium itself is given with monitoring.", "2. Give calcium gluconate 1 g IV over 10 minutes", "  Yes: calcium works within minutes to stabilize the heart muscle membrane; it does not lower potassium but buys time and comes first when the ECG is changing.", "3. Give dextrose 50% 25 g IV with regular insulin 10 units IV", "  Yes: insulin drives potassium into cells within 15 to 30 minutes, and dextrose prevents hypoglycemia; this lowers the blood level quickly but temporarily.", "4. Give sodium zirconium cyclosilicate 10 g orally", "  Yes: the binder removes potassium from the body through the gut, but it takes hours to work, so it follows the faster measures.", "5. Check capillary glucose 1 hour after the insulin", "  Yes: insulin can cause hypoglycemia for several hours, especially when kidney injury slows insulin clearance, so glucose is checked after the treatment is given.", "", "Why: Hyperkalemia treatment follows protect, shift, remove. Calcium protects the heart first. Insulin with dextrose shifts potassium into cells. A binder removes it from the body. Glucose checks catch the most common harm from treatment.", "Tip: Remember the sequence protect, shift, remove, then monitor for the side effect of the shifting drug."], "st": "awaiting"}, {"id": "ngn:cs-aki-hyperkalemia-6", "hash": "2961efe323", "title": "Stomach bug that ends in hyperkalemia · item 6 · Highlight · Evaluate outcomes", "body": ["Refer to the chart.", "", "Highlight the findings that show the client's condition is improving.", "", "✓ highlight Potassium 5.3 mEq/L.", "  Yes: potassium has fallen from 6.5 toward normal; because insulin only shifts it, the nurse still expects repeat levels.", "✓ highlight T waves now normal height on telemetry.", "  Yes: resolution of peaked T waves shows the cardiac effect of hyperkalemia has eased.", "✓ highlight Urine output 150 mL over the last 3 hours.", "  Yes: 50 mL/h is above 0.5 mL/kg/h for 68 kg, showing kidney perfusion is improving with fluids.", "✓ highlight BP 116/68 lying, no dizziness when standing.", "  Yes: blood pressure is up from 94/52 and orthostatic symptoms are gone, showing volume is being restored.", "- Capillary glucose 62 mg/dL.", "  No: this is hypoglycemia from the insulin and needs treatment per protocol and a recheck; it is a complication, not improvement.", "- Fine crackles in both lung bases.", "  No: new crackles in an older adult receiving IV fluid suggest early fluid overload; report and reassess the fluid rate.", "- Asked her daughter to bring her ibuprofen from home.", "  No: NSAIDs helped cause this kidney injury; she needs teaching to avoid them and use acetaminophen instead.", "", "Why: Lower potassium, normal T waves, better urine output and a higher blood pressure show treatment is working. Hypoglycemia after insulin, new crackles during fluid replacement and her plan to keep taking ibuprofen each need action. Potassium can rebound as insulin wears off, so monitoring continues.", "Tip: In evaluation items, a finding that is new since treatment began is often a side effect of the treatment rather than progress."], "st": "awaiting"}, {"id": "ngn:cs-serotonin-1", "hash": "5ffba050c6", "title": "New antibiotic that triggers serotonin syndrome · item 1 · Highlight · Recognize cues", "body": ["Client: 41-year-old man on an adult inpatient psychiatric unit for major depression, day 6 of admission", "History and Physical Day 1 14:00: Admitted for major depressive disorder with suicidal thoughts, no plan. Sertraline 150 mg daily for 5 months. No antipsychotic use in the past year. Day 3: started tramadol 50 mg PO every 6 hours for a low back strain. Day 5 at 20:00: medical consult started linezolid 600 mg PO every 12 hours for an MRSA abscess of the left forearm after incision and drainage. Weight 80 kg (176 lb).", "Medication Administration Record Day 6 07:00: Sertraline 150 mg PO daily: last given Day 5 at 09:00. Tramadol 50 mg PO every 6 hours: given Day 5 at 18:00 and Day 6 at 00:00 and 06:00. Linezolid 600 mg PO every 12 hours: given Day 5 at 20:00; next due 08:00. PRN: haloperidol 5 mg IM every 6 hours as needed for severe agitation, not given this admission. PRN: acetaminophen 650 mg PO every 6 hours as needed for pain or fever.", "Vital Signs Day 5 16:00: Temperature 36.8 °C (98.2 °F); Heart rate 78; Blood pressure 124/78; Respiratory rate 16", "Nurses' Notes Day 6 07:30: Pacing the hallway and cannot sit for more than a minute. Skin flushed and damp with sweat; gown changed twice since 05:00. Three loose stools since 04:00. Tremor of both hands; ankle jerks brisk with sustained clonus in both ankles, more than in the arms. Pupils 6 mm and reactive. Forearm dressing dry and intact. Denies thoughts of suicide today. Reports back pain 3/10, improved from 6/10 yesterday.", "Vital Signs Day 6 07:30: Temperature 38.6 °C (101.5 °F); Heart rate 122; Blood pressure 158/96; Respiratory rate 22; SpO₂ 97% on room air", "Nurses' Notes Day 6 08:15 (shown from item 2): Skin warm and moist. Bowel sounds hyperactive. No rigidity of the arms or neck. Oriented, but restless and says, \"I feel like my whole body is revving.\" Voiding without difficulty. 08:00 linezolid held and provider paged with these findings.", "Laboratory Results Day 6 08:30 (shown from item 2): CK 480 units/L (high); WBC 11,200/mm³ (high); Sodium 139 mEq/L; Creatinine 1.0 mg/dL; Glucose 98 mg/dL", "Orders Day 6 09:00 (shown from item 4): Hold sertraline, tramadol and linezolid. Medical consult to select a non-serotonergic antibiotic. Lorazepam 1 mg PO or IM every 1 hour as needed for agitation or tremor; hold for RR below 12 or sedation. External cooling measures. Vital signs every 30 minutes. Encourage oral fluids.", "Nurses' Notes Day 6 10:15 (shown from item 5): Lorazepam 1 mg PO given at 09:10. Temperature 39.6 °C (103.3 °F), HR 136, BP 174/102, RR 26. Leg muscles now stiff with sustained clonus. Disoriented to time. Provider at bedside.", "Orders Day 6 10:20 (shown from item 5): Cyproheptadine 12 mg PO now, then 2 mg every 2 hours if symptoms continue. Insert IV and start 0.9% NaCl at 150 mL/h. Transfer to medical ICU.", "Nurses' Notes Day 6 18:00 (shown from item 6): Medical ICU note: Temperature 37.6 °C (99.7 °F). HR 96, BP 136/82. Ankle clonus now 2 beats, not sustained. No loose stools since 13:00. Calm and oriented to person, place, time and situation. CK 2,150 units/L. Asks when he can restart tramadol for his back.", "", "Refer to the chart. It is Day 6 at 07:30.", "", "Highlight the findings in the nurse's note that require follow-up.", "", "✓ highlight Pacing the hallway and cannot sit for more than a minute.", "  Yes: new restlessness and agitation are early signs of excess serotonin activity, not simply worsening depression.", "✓ highlight Skin flushed and damp with sweat; gown changed twice since 05:00.", "  Yes: heavy sweating reflects autonomic overactivity; with a fever of 38.6 °C (101.5 °F), it signals a drug reaction.", "✓ highlight Three loose stools since 04:00.", "  Yes: diarrhea and hyperactive bowel are caused by serotonin stimulating the gut.", "✓ highlight Tremor of both hands; ankle jerks brisk with sustained clonus in both ankles, more than in the arms.", "  Yes: inducible clonus and hyperreflexia, greater in the legs, are the hallmark neuromuscular signs of serotonin toxicity.", "✓ highlight Pupils 6 mm and reactive.", "  Yes: dilated pupils are a sign of serotonergic and sympathetic excess.", "- Forearm dressing dry and intact.", "  No: a dry, intact dressing shows the abscess site is stable and is not the source of these new symptoms.", "- Denies thoughts of suicide today.", "  No: this is a reassuring finding that is still monitored, but it does not require urgent follow-up right now.", "- Reports back pain 3/10, improved from 6/10 yesterday.", "  No: improving back pain shows the analgesic is working and is not a new problem.", "", "Why: Agitation, sweating, diarrhea, dilated pupils and clonus that is worse in the legs, all starting overnight, form a pattern. A new fever and tachycardia make it urgent. The stable dressing, improved pain and absence of suicidal thoughts are not the problem.", "Tip: When several body systems change at once soon after a medication change, look for a drug reaction that ties them together."], "st": "awaiting"}, {"id": "ngn:cs-serotonin-2", "hash": "bc6a788e74", "title": "New antibiotic that triggers serotonin syndrome · item 2 · Matrix · Analyze cues", "body": ["Refer to the chart. The nurse compares the client's findings with three drug-related syndromes.", "", "For each finding, indicate the syndrome it is most characteristic of.", "", "- Onset within 24 hours of adding a serotonergic drug → Serotonin syndrome", "  serotonin syndrome develops within hours of a new drug or dose increase; this client's symptoms began about 8 hours after linezolid.", "- Hyperreflexia with inducible clonus, worse in the legs → Serotonin syndrome", "  neuromuscular hyperactivity with clonus is the key feature that separates serotonin syndrome from the other two.", "- Profuse sweating and diarrhea → Serotonin syndrome", "  serotonin increases sweating and gut motility; the client has both.", "- Lead-pipe rigidity with slow or reduced reflexes → Neuroleptic malignant syndrome", "  NMS causes severe, uniform rigidity and slow reflexes; this client has brisk reflexes and no arm or neck rigidity.", "- Develops over days after starting or increasing an antipsychotic → Neuroleptic malignant syndrome", "  NMS evolves over days from dopamine blockade; this client has had no antipsychotic in the past year.", "- Hot, dry, flushed skin with urinary retention → Anticholinergic toxicity", "  anticholinergic drugs block sweating and bladder emptying; this client is sweating and voiding normally.", "", "Why: All three syndromes can cause fever, tachycardia and agitation, so the nurse looks at the differences. Rapid onset, clonus and sweating point to serotonin syndrome. NMS is slow with rigidity and slow reflexes after an antipsychotic. Anticholinergic toxicity dries the skin.", "Tip: To separate these syndromes, compare three things: how fast it started, what the reflexes and muscles do, and whether the skin is wet or dry."], "st": "awaiting"}, {"id": "ngn:cs-serotonin-3", "hash": "5dcf8109c6", "title": "New antibiotic that triggers serotonin syndrome · item 3 · Drop-down · Prioritize hypotheses", "body": ["Refer to the chart. It is Day 6 at 08:45.", "", "Complete the sentences.", "", "Blank 1:", "- anticholinergic toxicity", "  No: his skin is wet and he is voiding normally; anticholinergic toxicity causes dry skin and urinary retention.", "- neuroleptic malignant syndrome", "  No: he has no antipsychotic exposure, no lead-pipe rigidity, and brisk rather than slow reflexes.", "✓ serotonin syndrome", "  Yes: rapid onset with clonus, hyperreflexia, sweating and diarrhea after combining serotonergic drugs fits serotonin syndrome.", "Blank 2:", "- sertraline alone at a stable dose", "  No: he took sertraline for 5 months without symptoms; the reaction followed the new drugs.", "✓ adding linezolid to sertraline and tramadol", "  Yes: linezolid inhibits monoamine oxidase, so adding it to an SSRI and tramadol sharply raises serotonin levels within hours.", "- the forearm abscess", "  No: an infection can cause fever, but it does not cause clonus, hyperreflexia and dilated pupils, and the wound is stable.", "Blank 3:", "- dehydration from diarrhea", "  No: fluid loss matters, but it is a secondary effect and not the main threat to life.", "- a return of suicidal thoughts", "  No: safety monitoring continues, but he denies suicidal thoughts and the physical emergency comes first.", "✓ rising temperature from muscle overactivity, which can lead to rhabdomyolysis and seizures", "  Yes: hyperthermia from muscle activity drives the serious complications, and an elevated CK shows muscle breakdown has begun.", "", "Why: This is serotonin syndrome from linezolid, a monoamine oxidase inhibitor, added to sertraline and tramadol. The danger is heat from overactive muscles, which can cause rhabdomyolysis, seizures and organ failure. A rising temperature signals a worsening course.", "Tip: When naming a cause, pick the most recent change that fits the timing; a drug taken safely for months is rarely the trigger alone."], "st": "awaiting"}, {"id": "ngn:cs-serotonin-4", "hash": "8af7db3856", "title": "New antibiotic that triggers serotonin syndrome · item 4 · Matrix · Generate solutions", "body": ["Refer to the chart. The provider has written new orders.", "", "For each intervention, indicate whether it is indicated or not indicated for this client.", "", "- Hold sertraline, tramadol and linezolid, including the 08:00 linezolid dose → Indicated", "  stopping every serotonergic drug is the first and most important treatment, and the antibiotic will be replaced with a safer one.", "- Remove extra blankets, cool the room and apply ice packs to the groin and armpits → Indicated", "  external cooling lowers the body temperature while the excess muscle activity is controlled.", "- Give lorazepam per order for agitation and tremor → Indicated", "  benzodiazepines calm agitation and reduce muscle activity, which lowers heat production.", "- Give the PRN haloperidol IM for agitation → Not indicated", "  antipsychotics can impair heat loss and confuse the picture with NMS; benzodiazepines are the drug of choice.", "- Apply four-point restraints to stop the pacing → Not indicated", "  fighting restraints causes intense muscle contraction, which raises temperature and worsens muscle breakdown and acidosis.", "- Rely on PRN acetaminophen as the main way to lower the fever → Not indicated", "  the heat comes from muscle activity, not a reset in the brain's set point, so antipyretics do not work well.", "", "Why: Treatment of serotonin syndrome is stop the drugs, cool the body, calm the muscles. Benzodiazepines are first-line sedation. Antipsychotics, physical restraints and reliance on antipyretics are traps: each either fails to reduce heat or adds to it.", "Tip: Ask where the heat comes from: when it comes from the muscles, the treatment is to relax the muscles and cool the skin, not to give an antipyretic."], "st": "awaiting"}, {"id": "ngn:cs-serotonin-5", "hash": "9fab676a4f", "title": "New antibiotic that triggers serotonin syndrome · item 5 · Select all · Take action", "body": ["Refer to the chart.", "", "Which actions should the nurse take now? Select all that apply.", "", "✓ Prepare a handoff report for the medical ICU, including all medication times", "  Yes: the ICU team needs the timeline of serotonergic drugs, doses given and response to treatment for safe care.", "✓ Stay with the client and continue external cooling", "  Yes: continuous observation keeps him safe while disoriented, and cooling continues until he reaches the ICU.", "- Place the client in seclusion until the agitation settles", "  No: this is a medical emergency, and seclusion prevents close monitoring of a client at risk for seizures and hyperthermia.", "✓ Insert an IV and start 0.9% NaCl at 150 mL/h", "  Yes: fluids replace losses from sweating and diarrhea and protect the kidneys from muscle breakdown products.", "✓ Call the rapid response team to help stabilize and transfer the client", "  Yes: a temperature of 39.6 °C (103.3 °F) with rising rigidity and new disorientation is a medical emergency beyond what the psychiatric unit can manage.", "- Give the 08:00 linezolid dose now since it is late", "  No: linezolid is part of the cause and was held; giving it would add more serotonin activity.", "- Give acetaminophen and recheck the temperature in 1 hour before calling for help", "  No: acetaminophen does not lower heat from muscle activity, and waiting delays rescue for a rapidly worsening client.", "✓ Give cyproheptadine 12 mg orally as ordered", "  Yes: cyproheptadine blocks serotonin receptors and is the antidote used when supportive care is not enough; it is only available orally.", "", "Why: Worsening fever, rigidity and confusion mean the serotonin syndrome is becoming severe. The nurse calls for help, gives the antidote, starts fluids, keeps cooling and stays with the client. Late serotonergic doses, seclusion and waiting on an antipyretic all add risk.", "Tip: When a client deteriorates despite first-line care, choose actions that bring more help and more treatment, not ones that wait."], "st": "awaiting"}, {"id": "ngn:cs-serotonin-6", "hash": "bc306a68fe", "title": "New antibiotic that triggers serotonin syndrome · item 6 · Highlight · Evaluate outcomes", "body": ["Refer to the chart.", "", "Highlight the findings that show the client's condition is improving.", "", "✓ highlight Temperature 37.6 °C (99.7 °F).", "  Yes: temperature is down from 39.6 °C (103.3 °F), showing muscle activity and heat production are under control.", "✓ highlight HR 96, BP 136/82.", "  Yes: the autonomic overactivity has settled from HR 136 and BP 174/102.", "✓ highlight Ankle clonus now 2 beats, not sustained.", "  Yes: clonus that is no longer sustained shows the neuromuscular toxicity is resolving after the drugs were stopped.", "✓ highlight No loose stools since 13:00.", "  Yes: the gut effects of excess serotonin are easing.", "✓ highlight Calm and oriented to person, place, time and situation.", "  Yes: agitation and confusion have cleared, showing mental status is returning to baseline.", "- CK 2,150 units/L.", "  No: CK has risen from 480, showing ongoing muscle breakdown; the nurse monitors urine output, color and kidney function.", "- Asks when he can restart tramadol for his back.", "  No: tramadol is serotonergic and helped cause this reaction; he needs teaching and a non-serotonergic pain plan.", "", "W
