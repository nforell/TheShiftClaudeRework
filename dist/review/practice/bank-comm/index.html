<style>
:root{--bg:#E6EDF0;--surface:#FBFCFC;--surface-2:#EDF2F4;--ink:#152238;--ink-2:#4D5A6F;--line:#CAD5DB;--teal:#2449A8;--teal-ink:#fff;--red:#B3342B;--red-bg:#F8E1DE;--good:#2B7249;--good-bg:#E0F0E6;--amber:#A96C0E;--amber-bg:#FBEFD6;
  --serif:"Barlow Condensed","Arial Narrow",sans-serif;--sans:"Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161C;--surface:#1A1F27;--surface-2:#212833;--ink:#E7E4DB;--ink-2:#A0A5AE;--line:#343C48;--teal:#93B4E4;--teal-ink:#0F1B2C;--red:#F0766B;--red-bg:#3b1d1b;--good:#72c692;--good-bg:#16301f;--amber:#E9AE4E;--amber-bg:#35291a}}
:root[data-theme="dark"]{--bg:#12161C;--surface:#1A1F27;--surface-2:#212833;--ink:#E7E4DB;--ink-2:#A0A5AE;--line:#343C48;--teal:#93B4E4;--teal-ink:#0F1B2C;--red:#F0766B;--red-bg:#3b1d1b;--good:#72c692;--good-bg:#16301f;--amber:#E9AE4E;--amber-bg:#35291a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
main{max-width:52rem;margin:0 auto;padding:clamp(1.2rem,5vw,3rem) 16px calc(5rem + env(safe-area-inset-bottom))}
a{color:var(--teal)}
.home{font-family:var(--serif);font-weight:700;font-size:1.1rem;letter-spacing:.04em;text-transform:uppercase;background:var(--ink);color:var(--bg);padding:.28em .55em .22em;border-radius:2px;text-decoration:none}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.9rem,6vw,2.6rem);line-height:1.1;letter-spacing:0;margin:1.6rem 0 .3rem}
h2{font-size:1.15rem;margin:2.4rem 0 .6rem}
h3{font-size:1rem;margin:0}
p{margin:.5rem 0}
.muted{color:var(--ink-2)}
.meta{display:flex;flex-wrap:wrap;gap:.4rem .6rem;margin-top:.6rem}
.chip{display:inline-flex;align-items:center;padding:.15em .6em;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--surface-2);border:1px solid var(--line)}
.chip.awaiting{background:var(--amber-bg);border-color:transparent;color:var(--amber)}
.chip.reviewed{background:var(--good-bg);border-color:transparent;color:var(--good)}
.chip.changed{background:var(--red-bg);border-color:transparent;color:var(--red)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem 1.1rem;margin:.8rem 0}
.how ol{margin:.4rem 0 0;padding-left:1.2rem}.how li{margin:.2rem 0}
label{display:block;font-weight:600;font-size:.9rem;margin:.7rem 0 .25rem}
input[type=text],input[type=email],textarea,select{width:100%;min-height:44px;padding:.5em .7em;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:5rem;resize:vertical}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:0 1rem}
details.pt{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:.6rem 0}
details.pt>summary{cursor:pointer;padding:.85rem 1rem;font-weight:600;list-style-position:inside}
details.pt>div{padding:0 1rem 1rem}
table{width:100%;border-collapse:collapse;font-size:.88rem;margin:.4rem 0}
th,td{text-align:left;vertical-align:top;padding:.35rem .5rem .35rem 0;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--ink-2);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
.scroll{overflow-x:auto}
ul.plain{margin:.3rem 0;padding-left:1.1rem}
.dec{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:.85rem 1rem;margin:.6rem 0}
.dec.pos{border-left-color:var(--good)}.dec.neg{border-left-color:var(--red)}
.dec .top{display:flex;flex-wrap:wrap;gap:.3rem .5rem;align-items:center;font-size:.78rem;color:var(--ink-2);font-weight:600}
.pts{font-weight:700;padding:.05em .45em;border-radius:4px;background:var(--surface-2)}
.pos .pts{color:var(--good);background:var(--good-bg)}.neg .pts{color:var(--red);background:var(--red-bg)}
.dec b{display:block;margin:.35rem 0 .15rem;font-size:1rem}
.dec .why{font-family:var(--sans);color:var(--ink-2);margin:0}
.dec .src{font-size:.75rem;color:var(--ink-2);margin-top:.35rem}
.verdict{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.7rem}
.verdict button{min-height:40px;padding:.35em .9em;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer}
.verdict button[aria-pressed="true"][data-v="ok"]{background:var(--good);border-color:var(--good);color:var(--teal-ink)}
.verdict button[aria-pressed="true"][data-v="fix"]{background:var(--red);border-color:var(--red);color:var(--teal-ink)}
.verdict button[aria-pressed="true"][data-v="unsure"]{background:var(--amber);border-color:var(--amber);color:var(--teal-ink)}
.dec textarea{margin-top:.5rem;min-height:3.6rem}
.opt{padding:.4rem 0;border-bottom:1px solid var(--line);font-size:.92rem}.opt:last-child{border:0}
.opt i{font-style:normal;font-weight:700;font-size:.75rem;padding:.05em .4em;border-radius:4px;margin-right:.4rem;background:var(--surface-2)}
.bar{position:sticky;top:0;z-index:5;margin:0 -16px;padding:.6rem 16px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:.6rem;font-size:.9rem}
.bar .prog{display:block;flex:1;min-width:4rem;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;max-width:12rem}.bar .prog i{display:block;height:100%;background:var(--teal)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:.55em 1.2em;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn-primary{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.row{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1rem}
.check{display:flex;gap:.6rem;align-items:flex-start;font-weight:500;margin-top:1rem}
.check input{width:1.2rem;height:1.2rem;margin-top:.2rem;flex:none}
.msg{margin-top:.8rem;font-weight:600}.msg.err{color:var(--red)}.msg.ok{color:var(--good)}
pre{white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:.8rem;font-size:.8rem;max-height:18rem;overflow:auto}
.shifts a{display:block;text-decoration:none;color:inherit}
.shifts .card:hover{border-color:var(--ink-2)}
</style>
<style>.item .body p{margin:.15rem 0}.item .body .why{color:var(--ink-2);font-size:.92rem;margin:0 0 .35rem 1.1rem}.item .body .ok b{display:inline;margin:0;color:var(--good)}.item .body .no{color:var(--ink)}.item .body .sp{height:.5rem}.item>b{margin-bottom:.5rem}</style></head>

to provide language access.", "- Have the provider speak slowly in simple English, pause often, and ask the client to nod each time if she understands", "  No: nodding does not show understanding, especially across a language barrier. This approach invites the client to agree without comprehending.", "- Let the grandson interpret because the client trusts him", "  No: a minor family member may omit, soften or misunderstand serious news and should not carry that burden. Family interpreting risks errors and breaches the client's privacy.", "- Give the client written results in English and have the grandson read them to her at home", "  No: this withholds a timely, accurate explanation from the client. It still relies on a child to translate a possible cancer diagnosis.", "", "Why: Advocacy means making sure the client can understand and take part in her own care. Clients with limited English proficiency have the right to a qualified interpreter at no cost. Family members, and especially minors, should not interpret medical discussions except in an emergency when no other option exists.", "Tip: When a stem offers a family member as an interpreter, look for the option that uses a qualified medical interpreter instead."], "st": "awaiting"}, {"id": "ngn:qb-mgmt-20", "hash": "12670d8ce1", "title": "Referrals and case management · Generate solutions", "body": ["A home health nurse visits an 82-year-old client with heart failure who lives alone. He uses a new walker and has throw rugs in every room. He says, \"I take my water pill every other day so it lasts until my check comes,\" and \"I mostly eat crackers and canned soup since I can't stand at the stove very long.\" He wants to stay in his home.", "", "Which referrals should the nurse request? Select all that apply.", "", "- Hospice for end-of-life care", "  No: nothing suggests he has a terminal prognosis or wants comfort-focused care. His problems are practical and can be addressed.", "- Nursing home placement arranged by the nurse today", "  No: he has decision-making capacity and wants to stay home. Arranging placement against his wishes violates his autonomy when supports have not been tried.", "- Inpatient psychiatric evaluation", "  No: nothing in the stem suggests a psychiatric emergency. His choices reflect cost and physical limits, not mental illness.", "✓ Social worker or case manager to explore medication cost assistance", "  Yes: skipping diuretic doses because of cost risks readmission for fluid overload. A social worker can connect him with assistance programs and benefits.", "✓ Physical or occupational therapy for a home safety evaluation", "  Yes: throw rugs and a new walker are a high fall risk. Therapy can assess the home, train him with the walker and suggest changes.", "✓ Home-delivered meals program", "  Yes: he cannot cook safely, and canned soup is very high in sodium, which worsens heart failure. Delivered meals improve nutrition and can be low in sodium.", "✓ Pharmacist review for lower-cost alternatives and a full medication list", "  Yes: a pharmacist can identify cheaper equivalents and reconcile medications, which supports adherence on a fixed income.", "", "Why: Case management connects the client with the services that address the root causes of poor outcomes. This client's risks are medication cost, falls and high-sodium nutrition, each of which has a matching referral. Respecting his wish to stay at home guides the plan.", "Tip: Match each specific problem in the stem to the discipline or service that fixes it, and avoid options that override the client's wishes."], "st": "awaiting"}, {"id": "ngn:qb-safe-9", "hash": "d1600baa0f", "title": "Fall risk at home · Recognize cues", "body": ["A home health nurse visits an 84-year-old who lives alone after a hospital stay for pneumonia. Nurse's note from the first home visit.", "", "Highlight the findings that increase the client's risk of falling.", "", "✓ highlight Takes lorazepam 1 mg at bedtime for sleep.", "  Yes: benzodiazepines cause sedation, slowed reactions and unsteady gait in older adults and are a leading medication cause of falls.", "✓ highlight Gets up twice each night to urinate.", "  Yes: nocturia means walking in the dark while drowsy, often in a hurry, which sharply raises the risk of falling.", "✓ highlight Throw rugs line the hallway between the bedroom and bathroom.", "  Yes: loose rugs are a common trip hazard, and this one sits on the exact path she walks at night.", "✓ highlight Hallway night-light burned out last month and has not been replaced.", "  Yes: poor lighting on a nighttime route to the bathroom makes it hard to see rugs and thresholds.", "- Grab bars were installed in the shower last year.", "  No: grab bars are a protective measure that lowers fall risk in the bathroom. They are a strength, not a risk factor.", "- Drinks one cup of coffee each morning.", "  No: a single morning cup of coffee has little effect on fall risk and does not explain nighttime trips to the bathroom.", "- Smoke detector was tested last week and works.", "  No: a working smoke detector is good fire safety. It is unrelated to falls; the trap is selecting any safety finding.", "", "Why: Falls in older adults usually come from several risks combined: sedating medications, nocturia, poor lighting and trip hazards. This client has all four on the same nighttime route. The nurse should plan to remove rugs, replace the night-light and review the lorazepam with the provider.", "Tip: Picture the client's actual path through the home, especially at night, and highlight anything that makes that path more dangerous."], "st": "awaiting"}, {"id": "ngn:qb-safe-14", "hash": "ba333d7e84", "title": "Safe chemotherapy handling · Generate solutions", "body": ["A nurse in an outpatient infusion center is preparing to give an IV chemotherapy drug to a 57-year-old with breast cancer. The drug was prepared by pharmacy in a biological safety cabinet.", "", "Which actions should the nurse plan to take to protect staff and others from hazardous drug exposure? Select all that apply.", "", "- Prime the IV tubing with the chemotherapy drug at the chair before connecting it", "  No: priming with the drug at the bedside risks spraying or dripping it. Tubing is primed with a compatible fluid without drug or in the safety cabinet.", "✓ Discard gloves, gown and tubing in a designated hazardous drug waste container", "  Yes: contaminated items go into labeled hazardous drug waste so housekeeping and others are not exposed.", "✓ Wear two pairs of chemotherapy-tested gloves", "  Yes: double gloving with gloves tested for use with chemotherapy reduces skin absorption if the outer glove is contaminated or torn.", "- Wipe a small drip of the drug with paper towels and discard them in the regular trash", "  No: any spill is cleaned with a spill kit while wearing PPE, and the waste goes in hazardous drug waste, never the regular trash.", "✓ Wear a disposable, impermeable gown that closes in the back", "  Yes: a back-closing, low-permeability gown keeps hazardous drug off the nurse's clothing and skin during administration.", "- Reuse the gown for the next client if it is not visibly soiled", "  No: hazardous drug residue can be invisible. Gowns are single-use and discarded after each client or after contamination.", "✓ Wear gloves when handling the client's urine or emesis for at least 48 hours after the infusion", "  Yes: many chemotherapy drugs are excreted in body fluids for about 48 hours, so contact with them is an exposure risk.", "", "Why: Chemotherapy drugs are hazardous to the people who handle them, with risks that include skin injury, reproductive harm and cancer. Protection includes double chemotherapy gloves, an impermeable gown, safe priming, a spill kit and hazardous waste disposal. Body fluids are treated as contaminated for about 48 hours after the dose.", "Tip: For hazardous drug questions, choose every option that keeps the drug contained, and reject anything that reuses PPE or sends waste to regular trash."], "st": "awaiting"}, {"id": "ngn:qb-hp-2", "hash": "333693ddfe", "title": "Vaccine contraindications · Take action", "body": ["A nurse in a community health clinic reviews the charts of clients due for vaccines today. The clinic follows the CDC immunization schedule.", "", "For each client, indicate whether the nurse should give the vaccine as scheduled or hold it and consult the provider.", "", "- 12-month-old due for MMR; an older sibling at home is receiving chemotherapy → Give as scheduled", "  the MMR vaccine viruses are not spread to household contacts, and vaccinating family members helps protect the immunocompromised sibling.", "- 4-year-old due for varicella vaccine who has taken prednisone 2 mg/kg/day for the past 3 weeks → Hold and consult the provider", "  high-dose steroids for 14 days or longer suppress the immune system, so a live vaccine is delayed until at least 1 month after the steroid course ends.", "- 4-month-old with a runny nose and temperature of 37.8 °C (100 °F) due for routine vaccines → Give as scheduled", "  a mild illness with or without low-grade fever is not a reason to delay vaccines; delaying leaves the infant unprotected.", "- 28-year-old who is 10 weeks pregnant, not immune to rubella, and asks for the MMR vaccine → Hold and consult the provider", "  live vaccines are contraindicated in pregnancy because of a theoretical risk to the fetus; MMR is given after birth.", "- 15-month-old due for MMR who had anaphylaxis to neomycin → Hold and consult the provider", "  MMR contains trace neomycin, and a severe allergic reaction to a vaccine component is a contraindication.", "- 6-year-old with an egg allergy that causes hives, due for the inactivated influenza vaccine → Give as scheduled", "  current CDC guidance says egg allergy of any severity needs no extra precautions for influenza vaccine beyond those for any vaccine.", "", "Why: Live vaccines such as MMR and varicella are held in pregnancy and in clients whose immune system is suppressed, including by high-dose steroids. Anaphylaxis to a vaccine component is a contraindication. Mild illness, egg allergy for flu vaccine, and an immunocompromised household member are not reasons to hold vaccines.", "Tip: Identify which vaccines are live first, then hold them only for pregnancy, immunosuppression or a true severe allergy to a component."], "st": "awaiting"}, {"id": "ngn:qb-hp-11", "hash": "0637615ed6", "title": "Breastfeeding teaching · Generate solutions", "body": ["A home health nurse visits a 27-year-old first-time parent 3 days after an uncomplicated vaginal birth. She is breastfeeding and says, \"I'm not sure the baby is getting enough, and my nipples are getting sore.\"", "", "Which instructions should the nurse include in the teaching? Select all that apply.", "", "✓ Feed the baby 8 to 12 times in 24 hours, whenever she shows hunger cues", "  Yes: frequent feeding on cue builds milk supply and meets a newborn's small stomach capacity.", "- Pain that lasts through the whole feeding is normal for the first month", "  No: brief tenderness at latch-on can occur, but pain throughout a feeding signals a poor latch that needs correction.", "- Give the baby water between feedings if the weather is hot", "  No: breast milk meets all fluid needs, and water fills the stomach, reduces feeding and can cause low sodium in infants.", "✓ Bring the baby to the breast when her mouth is open wide so she takes in much of the areola", "  Yes: a deep latch compresses the milk ducts behind the nipple and prevents the friction that causes sore nipples.", "- Limit each feeding to 5 minutes per breast to prevent soreness", "  No: limiting time reduces milk intake and supply. Soreness comes from a poor latch, not from feeding length.", "✓ Expect at least 6 wet diapers a day once your milk is in, around day 5", "  Yes: wet diaper count is a practical sign that the baby is getting enough milk; fewer should be reported.", "✓ Slide a clean finger into the corner of the baby's mouth to break the suction before removing her", "  Yes: breaking suction first prevents nipple trauma when the baby comes off the breast or needs to be repositioned.", "", "Why: Breastfeeding teaching focuses on frequent feeding on cue, a deep latch and simple signs of adequate intake such as wet diapers and weight gain. Persistent nipple pain points to a latch problem rather than something to endure. Healthy breastfed infants do not need water.", "Tip: For breastfeeding questions, favor answers that support frequent, unrestricted feeding with a good latch, and reject anything that adds water or limits feeding."], "st": "awaiting"}, {"id": "ngn:qb-pharm-10", "hash": "696a730540", "title": "Warfarin and high INR · Generate solutions", "body": ["A 72-year-old with atrial fibrillation takes warfarin 5 mg daily, with an INR goal of 2 to 3. At the anticoagulation clinic today, the INR is 5.4. She has no bleeding, bruising or dark stools. She recently finished a course of an antibiotic.", "", "Which order should the nurse anticipate?", "", "- Give protamine sulfate IV now", "  No: Protamine reverses heparin, not warfarin. The trap is mixing up the two antidotes.", "✓ Hold warfarin and recheck the INR in 1 to 2 days", "  Yes: For an INR between 4.5 and 10 without bleeding, the usual plan is to hold warfarin and recheck, then resume at an adjusted dose.", "- Take the usual dose and recheck the INR in 4 weeks", "  No: An INR of 5.4 is well above goal and raises the risk of bleeding; continuing the same dose is unsafe.", "- Give vitamin K 10 mg IV now", "  No: High-dose IV vitamin K is reserved for major bleeding. Giving it here can overcorrect the INR and expose her to a stroke from atrial fibrillation.", "", "Why: An elevated INR without bleeding is managed by holding warfarin and rechecking closely. Vitamin K is added for higher INRs or bleeding, and IV vitamin K with clotting factors is for major bleeding. Many antibiotics raise the INR, so the nurse also reviews new medications.", "Tip: Match the antidote to the drug: vitamin K for warfarin, protamine for heparin."], "st": "awaiting"}, {"id": "ngn:qb-pharm-13", "hash": "aac25ecb79", "title": "ACE inhibitor angioedema · Prioritize hypotheses", "body": ["A 61-year-old started lisinopril 10 mg daily 3 weeks ago. At a clinic visit he reports a dry, tickling cough, feeling lightheaded when he stands quickly, and that his lips and tongue felt puffy this morning. His voice sounds hoarse. BP is 128/78.", "", "Which finding is the priority for the nurse to act on?", "", "- Dry, tickling cough", "  No: A dry cough is a common ACE inhibitor effect from bradykinin. It is reported and may lead to a drug change, but it does not threaten the airway.", "- BP 128/78", "  No: This blood pressure is at goal and shows the drug is working, so it needs no action.", "✓ Lip and tongue swelling with a hoarse voice", "  Yes: This is angioedema, a life-threatening ACE inhibitor reaction. Hoarseness suggests the larynx is involved, so the airway is at risk right now.", "- Lightheaded when standing quickly", "  No: Orthostatic dizziness is expected early in therapy; teach him to rise slowly. It is not the most urgent problem.", "", "Why: Angioedema can occur at any point during ACE inhibitor therapy, even after weeks. Swelling of the lips, tongue or throat is an airway emergency: stop the drug, activate emergency response and monitor the airway. The client should not take any ACE inhibitor again.", "Tip: When several findings are listed, an airway threat outranks bothersome but stable adverse effects."], "st": "awaiting"}, {"id": "ngn:qb-pharm-19", "hash": "6704599f48", "title": "DOAC teaching · Evaluate outcomes", "body": ["A 69-year-old with atrial fibrillation is starting apixaban 5 mg twice daily. The home health nurse reviews the medication teaching at the next visit.", "", "Which statements indicate the client understands the teaching? Select all that apply.", "", "✓ If my stool turns black or my urine looks pink, I will call right away.", "  Yes: These are signs of internal bleeding, the most serious adverse effect of a DOAC.", "- I will need monthly INR blood tests to adjust my dose.", "  No: Apixaban does not require INR monitoring. The trap is applying warfarin teaching to a DOAC.", "✓ I will ask the pharmacist before taking an over-the-counter pain reliever.", "  Yes: NSAIDs such as ibuprofen and naproxen add to bleeding risk with anticoagulants.", "✓ I will tell my dentist and any other provider that I take a blood thinner.", "  Yes: Procedures may need planning around apixaban because of bleeding risk, so every provider should know.", "- I should avoid spinach and other green leafy vegetables.", "  No: Vitamin K foods matter with warfarin, not apixaban. Consistent vitamin K intake is warfarin teaching.", "✓ I will not stop taking this medicine unless my provider tells me to.", "  Yes: Stopping a DOAC suddenly raises the risk of stroke in atrial fibrillation.", "- If I miss a dose, I will take two at the next dose time.", "  No: A missed dose is taken as soon as remembered the same day; doubling the dose increases bleeding risk.", "", "Why: DOACs such as apixaban do not need routine INR checks and have no vitamin K diet restriction, which sets them apart from warfarin. Teaching focuses on taking every dose, never doubling, recognizing bleeding, avoiding NSAIDs and telling every provider.", "Tip: When you see a DOAC, cross off any option that belongs to warfarin, such as INR checks or vitamin K diet."], "st": "awaiting"}, {"id": "ngn:qb-pharm-25", "hash": "7ef02da56c", "title": "TPN safety · Generate solutions", "body": ["A 55-year-old with short bowel syndrome receives home total parenteral nutrition (TPN) through a tunneled central venous catheter. The home health nurse reviews the plan of care with the client and his spouse.", "", "For each action, indicate whether it is appropriate or not appropriate for this client.", "", "- Check fingerstick glucose on the schedule ordered by the provider → Appropriate", "  the high dextrose load can cause hyperglycemia, so glucose is monitored, especially when the formula or rate changes.", "- Use a dedicated lumen for TPN and give no other medications through it → Appropriate", "  a dedicated lumen lowers the risk of central line infection and drug incompatibility.", "- Run the infusion faster to catch up after it was paused for 2 hours → Not appropriate", "  speeding up the rate can cause hyperglycemia and fluid overload; the infusion continues at the prescribed rate.", "- Stop the infusion suddenly when the bag runs out and no new bag is available → Not appropriate", "  abrupt stopping can cause rebound hypoglycemia; 10% dextrose is hung at the same rate until the next bag arrives.", "- Hang 10% dextrose at the same rate if the next TPN bag is delayed → Appropriate", "  this maintains a steady glucose supply and prevents rebound hypoglycemia.", "- Weigh at the same time each day and record the result → Appropriate", "  daily weights track nutritional progress and detect fluid overload.", "", "Why: TPN is a concentrated dextrose solution, so the main pharmacologic risks are hyperglycemia during the infusion and rebound hypoglycemia if it stops suddenly. It runs at a constant rate through a dedicated lumen with strict aseptic technique, and glucose and weight are monitored.", "Tip: For TPN, never catch up and never stop suddenly; both errors cause a glucose problem."], "st": "awaiting"}, {"id": "ngn:qb-risk-4", "hash": "9c535cbe5e", "title": "Laboratory value follow-up · Recognize cues", "body": ["A 66-year-old man at a primary care clinic takes warfarin for atrial fibrillation and metformin for type 2 diabetes. His target INR is 2 to 3. The nurse reviews today's results before he leaves.", "", "For each result, indicate whether it is within the expected range or requires follow-up.", "", "- Potassium 4.3 mEq/L → Within expected range", "  the usual adult range is 3.5 to 5.0 mEq/L, so no action is needed.", "- Sodium 139 mEq/L → Within expected range", "  the usual adult range is 135 to 145 mEq/L.", "- Hemoglobin 14.6 g/dL → Within expected range", "  this is normal for an adult male and argues against hidden bleeding from the warfarin.", "- INR 4.6 → Requires follow-up", "  this is well above his target of 2 to 3 and raises the risk of bleeding; the provider needs to adjust the dose and he needs bleeding teaching.", "- Platelets 88,000/mm³ → Requires follow-up", "  the usual range is 150,000 to 400,000/mm³. Low platelets plus a high INR compound his bleeding risk.", "- Fasting glucose 172 mg/dL → Requires follow-up", "  this is above the normal fasting range of 70 to 99 mg/dL and above the usual diabetes target, so his plan needs review.", "", "Why: Compare each result to the usual adult range and to the client's own target. His electrolytes and hemoglobin are normal, but an INR far above target with thrombocytopenia places him at high risk for bleeding, and his fasting glucose shows poor control. All three need the provider's attention before he leaves.", "Tip: For anticoagulated clients, read the INR against the client's target range, not the range for someone who is not on warfarin."], "st": "awaiting"}, {"id": "ngn:qb-risk-13", "hash": "f86de11534", "title": "MRI safety screening · Recognize cues", "body": ["A 57-year-old arrives at an outpatient imaging center for a brain MRI without contrast to evaluate headaches. The nurse completes the safety screening questionnaire with her.", "", "Which finding must the nurse report before the scan can proceed?", "", "- Takes levothyroxine every morning", "  No: Oral medications have no interaction with the magnetic field and do not need to be held.", "- A porcelain crown on a back tooth, placed last year", "  No: Porcelain is not magnetic and dental crowns do not create a safety risk in the scanner.", "- Ate breakfast 2 hours ago", "  No: A non-contrast MRI without sedation does not require fasting.", "✓ A cardiac pacemaker placed 4 years ago", "  Yes: The magnetic field can affect a pacemaker and its leads. The device type must be confirmed and a special protocol arranged, or the scan cannot be done.", "", "Why: MRI screening looks for anything that the strong magnet could move, heat or disrupt: implanted electronic devices, ferromagnetic clips, metal fragments and some implants. A pacemaker must be identified and cleared by the radiology team before the scan. Also remove all metal objects and ask about claustrophobia.", "Tip: For MRI items, scan the options for anything metal or electronic inside the body."], "st": "awaiting"}, {"id": "ngn:qb-basic-1", "hash": "708bf44d9b", "title": "Pressure injury staging · Analyze cues", "body": ["A home health nurse assesses the skin of an 82-year-old who spends most of the day in a wheelchair.", "", "Complete the sentences.", "", "Blank 1:", "- stage 2 pressure injury", "  No: Stage 2 requires an open, partial-thickness wound or a blister; this skin is intact.", "- deep tissue pressure injury", "  No: A deep tissue injury is a deep red, maroon or purple area or a blood-filled blister, not simple nonblanchable redness.", "✓ stage 1 pressure injury", "  Yes: Intact skin with nonblanchable redness over a bony prominence is the definition of a stage 1 pressure injury.", "Blank 2:", "✓ stage 2 pressure injury", "  Yes: Partial-thickness loss with a pink or red moist bed and no slough is stage 2.", "- unstageable pressure injury", "  No: Unstageable means the base is hidden by slough or eschar, and this base is fully visible.", "- stage 3 pressure injury", "  No: Stage 3 is full-thickness loss with visible fat; this wound is shallow with exposed dermis.", "Blank 3:", "- a stage 3 pressure injury", "  No: The depth cannot be seen, so the nurse cannot assign stage 3.", "- a stage 4 pressure injury", "  No: Stage 4 requires visible bone, tendon or muscle; the trap is assuming black tissue means the deepest stage.", "✓ an unstageable pressure injury", "  Yes: When eschar or slough hides the wound base, the depth is unknown and the injury is called unstageable.", "", "Why: Staging depends on what the nurse can see: intact skin with nonblanchable redness is stage 1, partial-thickness loss with exposed dermis is stage 2, and a base hidden by eschar or slough is unstageable. Stable, dry eschar on the heel is usually left in place because it acts as a natural cover.", "Tip: Stage only what you can see; if the wound base is hidden, the answer is unstageable."], "st": "awaiting"}, {"id": "ngn:qb-basic-4", "hash": "d735d9c58e", "title": "Bolus gastrostomy feeding · Take action", "body": ["A home health nurse is teaching the spouse of a 70-year-old how to give an intermittent bolus feeding through a gastrostomy tube that was placed 3 months ago.", "", "Place the steps in the order the spouse should perform them.", "", "Correct order:", "1. Sit the client upright at 30 to 45 degrees or higher, then check that the external mark on the tube is at its usual position at the skin", "  Yes: Positioning protects the airway during every later step, and placement is confirmed before anything enters the tube; a mark that has moved means the tube may have migrated.", "2. Flush the tube with 30 mL of water", "  Yes: A water flush checks that the tube is open before formula is given.", "3. Give the feeding slowly by gravity, raising or lowering the syringe to control the flow", "  Yes: Slow gravity flow lowers the risk of cramping, nausea and reflux that can lead to aspiration.", "4. Flush the tube with water and keep the client upright for 30 to 60 minutes", "  Yes: The final flush clears formula from the tube to prevent clogs, and staying upright lets the stomach empty, lowering aspiration risk.", "", "Why: Safe bolus feeding follows a fixed sequence: position upright, confirm placement, flush, feed slowly, then flush and keep the client upright. Each step either protects the airway or keeps the tube working. If the agency's policy calls for residual checks, they happen after placement is confirmed.", "Tip: For tube feeding sequences, positioning and placement checks always come before anything goes into the tube."], "st": "awaiting"}, {"id": "ngn:qb-basic-10", "hash": "85d514800a", "title": "End-of-life comfort care · Take action", "body": ["A home hospice nurse visits an 84-year-old with end-stage heart failure who is actively dying. He is unresponsive, with noisy, gurgling respirations, a dry mouth and cool, mottled knees. His daughter asks what she can do to keep him comfortable.", "", "Which actions should the nurse take or teach? Select all that apply.", "", "✓ Provide mouth care with moist swabs and apply lip balm", "  Yes: Mouth breathing dries the mouth and lips; frequent moist care relieves discomfort without the risk of giving fluids.", "- Have his daughter give him sips of water to prevent dehydration", "  No: An unresponsive client cannot swallow safely, and fluids can cause choking. Mouth care treats the dry mouth instead.", "- Suction deep in his throat every hour to clear the gurgling", "  No: Deep suctioning is distressing and stimulates more secretions. Positioning and ordered medications are preferred, with gentle oral suction only if needed.", "✓ Encourage his daughter to talk to him and hold his hand", "  Yes: Hearing may remain near the end of life, and presence and touch comfort both the client and family.", "✓ Turn him onto his side with the head slightly raised", "  Yes: Side-lying lets secretions drain from the throat and quiets noisy breathing.", "- Place heated blankets on his knees to reverse the mottling", "  No: Mottling is an expected sign as circulation slows. Heat can burn fragile skin; a light blanket is enough.", "✓ Continue the scheduled comfort medications as ordered", "  Yes: Medications for breathlessness and pain remain important when the client cannot report symptoms, and they are not stopped because death is near.", "", "Why: At the end of life, care shifts fully to comfort. Mouth care, positioning, continued comfort medications and family presence ease symptoms. Noisy respirations and mottling are expected signs of dying; the nurse explains them to the family and avoids interventions such as deep suctioning or oral fluids that add distress.", "Tip: For end-of-life items, choose actions that ease symptoms and support the family, not ones aimed at reversing the dying process."], "st": "awaiting"}, {"id": "ngn:qb-basic-11", "hash": "9a0cd97bc4", "title": "Cane teaching · Evaluate outcomes", "body": ["A 71-year-old with osteoarthritis of the left knee is learning to walk with a single-point cane at a clinic visit.", "", "Which statement by the client indicates correct understanding of the teaching?", "", "- \"I will hold the cane in my left hand so it supports my sore knee.\"", "  No: Holding the cane on the weak side makes the client lean toward the painful leg. This is the most common cane teaching trap.", "✓ \"I will hold the cane in my right hand and move it forward with my left leg.\"", "  Yes: The cane goes on the stronger side and moves with the weak leg, so it shares the load and gives a wider base of support.", "- \"I will step forward with my right leg first, then bring the cane and my left leg.\"", "  No: The cane and the weak leg move forward together first, then the strong leg steps through.", "- \"The cane should be tall enough that my elbow is straight when I hold it.\"", "  No: The handle should be at the hip or wrist crease so the elbow bends about 15 to 30 degrees.", "", "Why: A cane is held on the stronger side, opposite the affected leg. The cane and weak leg advance together, then the strong leg follows. The correct height leaves the elbow slightly bent, which lets the arm push down and bear weight.", "Tip: For cane questions, remember the cane goes on the strong side and moves with the weak leg."], "st": "awaiting"}, {"id": "ngn:qb-basic-12", "hash": "25fc6b9e54", "title": "Bowel program after SCI · Generate solutions", "body": ["A 32-year-old with a T10 spinal cord injury is home with home health support and is setting up a bowel program to prevent constipation and accidents. He eats breakfast every day at 07:30.", "", "When should the nurse recommend he do his daily bowel program?", "", "- At a different time each day depending on his schedule", "  No: Consistency is the core of a bowel program; changing times makes it harder to train the bowel and prevent accidents.", "✓ About 30 minutes after breakfast each day", "  Yes: Eating triggers the gastrocolic reflex, which moves stool toward the rectum, and doing it at the same time daily trains the bowel.", "- Before breakfast, on an empty stomach", "  No: Without a meal there is no gastrocolic reflex to help move stool, so the program works less well.", "- Whenever he feels the urge to have a bowel movement", "  No: Spinal cord injury often reduces sensation, so he may not feel the urge. A program depends on a planned time.", "", "Why: A bowel program uses the same time every day, usually after a meal to take advantage of the gastrocolic reflex. It also includes adequate fiber and fluid, activity, and techniques such as digital stimulation or a suppository as ordered. Consistency prevents both constipation and accidents.", "Tip: For bowel training items, look for the answer that builds a consistent routine around a natural reflex."], "st": "awaiting"}, {"id": "ngn:qb-psy-12", "hash": "a79948fbea", "title": "Elder neglect · Take action", "body": ["A home health nurse visits an 82-year-old with mild cognitive impairment who lives with her adult daughter. The client has lost 5 kg (11 lb) in a month, has a new stage 2 pressure injury on her sacrum and is lying on soiled sheets. The daughter controls her money and says she leaves her alone most of the day. The client says, \"I don't want to be a bother.\"", "", "Which action should the nurse take?", "", "- Teach the daughter how to reposition her mother and check again next week", "  No: teaching may help, but it does not address the pattern of neglect and delays protection for a vulnerable adult.", "- Respect the client's wish not to be a bother and take no further action", "  No: her statement reflects dependence and fear, not a choice to be neglected. The nurse still has a duty to report.", "✓ Report suspected neglect to Adult Protective Services and document the objective findings", "  Yes: weight loss, a new pressure injury and poor hygiene in a dependent adult are signs of neglect; nurses report suspected elder abuse as required by state law.", "- Tell the daughter that she is neglecting her mother and must do better", "  No: confronting the caregiver can increase risk to the client and may lead to the nurse being denied access.", "", "Why: Neglect is the most common form of elder mistreatment. Unexplained weight loss, pressure injuries, poor hygiene and a caregiver who controls finances and leaves the client alone are red flags. The nurse documents objective findings and reports to Adult Protective Services per state law; investigation is the agency's job.", "Tip: When a dependent client shows physical signs of neglect, choose reporting over teaching or confronting the caregiver."], "st": "awaiting"}, {"id": "ngn:sa-health-1", "hash": "902270b5e3", "title": "Growth at 12 months · Recognize cues", "body": ["A 12-month-old girl is seen for a well-child visit. Birth weight 3.4 kg (7 lb 8 oz). Weight at 6 months: 6.8 kg (15 lb). Weight today: 7.4 kg (16 lb 5 oz). The parent says she pulls to stand and cruises along furniture, picks up cereal with her thumb and finger, and is not walking alone yet. The parent also says she does not turn when her name is called and does not babble.", "", "For each finding, indicate whether it is expected for her age or requires follow-up.", "", "- Weight at 6 months compared with birth weight → Expected", "  Birth weight usually doubles by about 5 to 6 months. Going from 3.4 kg to 6.8 kg is right on track.", "- Weight today compared with birth weight → Requires follow-up", "  Birth weight should roughly triple by 12 months, to about 10 kg here. Gaining only 0.6 kg in 6 months is a sharp slowdown that needs evaluation.", "- Not walking alone yet → Expected", "  Most children walk alone between 12 and 15 months. Pulling to stand and cruising are the expected steps before that.", "- Uses a pincer grasp to pick up cereal → Expected", "  A neat pincer grasp develops by about 9 to 12 months. This is a normal fine motor milestone.", "- Does not respond to her name and does not babble → Requires follow-up", "  Babbling by 6 months and responding to her name by about 9 months are expected. Their absence suggests hearing loss or a developmental disorder and needs screening.", "", "Why: Compare each finding with the milestone timeline. Her weight doubled on time, then nearly stalled, which raises concern for poor growth. Motor skills are on track, but missing language and social milestones at 12 months need hearing and developmental evaluation.", "Tip: For growth trend items, compare each time point with the rule: double birth weight by 6 months, triple by 12 months."], "st": "awaiting"}, {"id": "ngn:sa-health-5", "hash": "7c5df82902", "title": "Adult cancer screening schedule · Take action", "body": ["A 46-year-old woman at average risk for cancer has never had colorectal cancer screening. Her last cervical cancer screening, 2 years ago, was a negative primary HPV test. She asks the clinic nurse what screening she is due for.", "", "Complete the sentences.", "", "Blank 1:", "- 55", "  No: starting at 55 would miss years of screening. No current guideline uses this age.", "✓ 45", "  Yes: average-risk adults begin colorectal screening at 45. At 46, she is already due.", "- 50", "  No: 50 was the older starting age. Current USPSTF and ACS guidance lowered it because of rising colorectal cancer in younger adults.", "Blank 2:", "- 5 years", "  No: 5 years applies to CT colonography or flexible sigmoidoscopy, not a normal colonoscopy. This is a common mix-up.", "- 3 years", "  No: a 3-year interval is used for some stool DNA tests, not a normal colonoscopy.", "✓ 10 years", "  Yes: a normal colonoscopy in an average-risk adult is repeated every 10 years.", "Blank 3:", "- 1 year", "  No: annual cervical screening is no longer recommended for average-risk adults. It leads to unnecessary procedures.", "✓ 3 years", "  Yes: primary HPV testing for ages 30 to 65 is repeated every 5 years. Her last test was 2 years ago, so she is due in 3 years.", "- 8 years", "  No: waiting 8 years would exceed the 5-year interval for primary HPV testing.", "", "Why: Average-risk colorectal screening starts at 45, and a normal colonoscopy is repeated every 10 years. For ages 30 to 65, cervical screening is primary HPV testing every 5 years, HPV with cytology every 5 years, or cytology alone every 3 years.", "Tip: Learn the anchor numbers: colorectal screening starts at 45, colonoscopy every 10 years, HPV testing every 5 years."], "st": "awaiting"}, {"id": "ngn:sa-basic-2", "hash": "1caf8575cd", "title": "Non-weight-bearing crutch gait · Evaluate outcomes", "body": ["A 16-year-old with a fractured left ankle is ordered non-weight-bearing on the left leg with axillary crutches. After teaching, the nurse watches her demonstrate crutch walking in the clinic hallway and on the practice stairs.", "", "For each observation, indicate whether it shows correct technique or a need for more teaching.", "", "- Leans on the axillary pads with her armpits to rest while standing. → Needs more teaching", "  Weight on the axillary pads compresses the brachial plexus and can cause crutch palsy. Weight belongs on the hands, with the pads 2 to 3 finger widths below the axilla.", "- Elbows flexed about 30 degrees with her hands on the grips. → Correct technique", "
