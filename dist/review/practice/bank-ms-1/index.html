<style>
:root{--bg:#E6EDF0;--surface:#FBFCFC;--surface-2:#EDF2F4;--ink:#152238;--ink-2:#4D5A6F;--line:#CAD5DB;--teal:#2449A8;--teal-ink:#fff;--red:#B3342B;--red-bg:#F8E1DE;--good:#2B7249;--good-bg:#E0F0E6;--amber:#A96C0E;--amber-bg:#FBEFD6;
  --serif:"Barlow Condensed","Arial Narrow",sans-serif;--sans:"Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161C;--surface:#1A1F27;--surface-2:#212833;--ink:#E7E4DB;--ink-2:#A0A5AE;--line:#343C48;--teal:#93B4E4;--teal-ink:#0F1B2C;--red:#F0766B;--red-bg:#3b1d1b;--good:#72c692;--good-bg:#16301f;--amber:#E9AE4E;--amber-bg:#35291a}}
:root[data-theme="dark"]{--bg:#12161C;--surface:#1A1F27;--surface-2:#212833;--ink:#E7E4DB;--ink-2:#A0A5AE;--line:#343C48;--teal:#93B4E4;--teal-ink:#0F1B2C;--red:#F0766B;--red-bg:#3b1d1b;--good:#72c692;--good-bg:#16301f;--amber:#E9AE4E;--amber-bg:#35291a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
main{max-width:52rem;margin:0 auto;padding:clamp(1.2rem,5vw,3rem) 16px calc(5rem + env(safe-area-inset-bottom))}
a{color:var(--teal)}
.home{font-family:var(--serif);font-weight:700;font-size:1.1rem;letter-spacing:.04em;text-transform:uppercase;background:var(--ink);color:var(--bg);padding:.28em .55em .22em;border-radius:2px;text-decoration:none}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.9rem,6vw,2.6rem);line-height:1.1;letter-spacing:0;margin:1.6rem 0 .3rem}
h2{font-size:1.15rem;margin:2.4rem 0 .6rem}
h3{font-size:1rem;margin:0}
p{margin:.5rem 0}
.muted{color:var(--ink-2)}
.meta{display:flex;flex-wrap:wrap;gap:.4rem .6rem;margin-top:.6rem}
.chip{display:inline-flex;align-items:center;padding:.15em .6em;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--surface-2);border:1px solid var(--line)}
.chip.awaiting{background:var(--amber-bg);border-color:transparent;color:var(--amber)}
.chip.reviewed{background:var(--good-bg);border-color:transparent;color:var(--good)}
.chip.changed{background:var(--red-bg);border-color:transparent;color:var(--red)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem 1.1rem;margin:.8rem 0}
.how ol{margin:.4rem 0 0;padding-left:1.2rem}.how li{margin:.2rem 0}
label{display:block;font-weight:600;font-size:.9rem;margin:.7rem 0 .25rem}
input[type=text],input[type=email],textarea,select{width:100%;min-height:44px;padding:.5em .7em;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:5rem;resize:vertical}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:0 1rem}
details.pt{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:.6rem 0}
details.pt>summary{cursor:pointer;padding:.85rem 1rem;font-weight:600;list-style-position:inside}
details.pt>div{padding:0 1rem 1rem}
table{width:100%;border-collapse:collapse;font-size:.88rem;margin:.4rem 0}
th,td{text-align:left;vertical-align:top;padding:.35rem .5rem .35rem 0;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--ink-2);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
.scroll{overflow-x:auto}
ul.plain{margin:.3rem 0;padding-left:1.1rem}
.dec{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:.85rem 1rem;margin:.6rem 0}
.dec.pos{border-left-color:var(--good)}.dec.neg{border-left-color:var(--red)}
.dec .top{display:flex;flex-wrap:wrap;gap:.3rem .5rem;align-items:center;font-size:.78rem;color:var(--ink-2);font-weight:600}
.pts{font-weight:700;padding:.05em .45em;border-radius:4px;background:var(--surface-2)}
.pos .pts{color:var(--good);background:var(--good-bg)}.neg .pts{color:var(--red);background:var(--red-bg)}
.dec b{display:block;margin:.35rem 0 .15rem;font-size:1rem}
.dec .why{font-family:var(--sans);color:var(--ink-2);margin:0}
.dec .src{font-size:.75rem;color:var(--ink-2);margin-top:.35rem}
.verdict{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.7rem}
.verdict button{min-height:40px;padding:.35em .9em;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer}
.verdict button[aria-pressed="true"][data-v="ok"]{background:var(--good);border-color:var(--good);color:var(--teal-ink)}
.verdict button[aria-pressed="true"][data-v="fix"]{background:var(--red);border-color:var(--red);color:var(--teal-ink)}
.verdict button[aria-pressed="true"][data-v="unsure"]{background:var(--amber);border-color:var(--amber);color:var(--teal-ink)}
.dec textarea{margin-top:.5rem;min-height:3.6rem}
.opt{padding:.4rem 0;border-bottom:1px solid var(--line);font-size:.92rem}.opt:last-child{border:0}
.opt i{font-style:normal;font-weight:700;font-size:.75rem;padding:.05em .4em;border-radius:4px;margin-right:.4rem;background:var(--surface-2)}
.bar{position:sticky;top:0;z-index:5;margin:0 -16px;padding:.6rem 16px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:.6rem;font-size:.9rem}
.bar .prog{display:block;flex:1;min-width:4rem;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;max-width:12rem}.bar .prog i{display:block;height:100%;background:var(--teal)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:.55em 1.2em;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn-primary{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.row{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1rem}
.check{display:flex;gap:.6rem;align-items:flex-start;font-weight:500;margin-top:1rem}
.check input{width:1.2rem;height:1.2rem;margin-top:.2rem;flex:none}
.msg{margin-top:.8rem;font-weight:600}.msg.err{color:var(--red)}.msg.ok{color:var(--good)}
pre{white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:.8rem;font-size:.8rem;max-height:18rem;overflow:auto}
.shifts a{display:block;text-decoration:none;color:inherit}
.shifts .card:hover{border-color:var(--ink-2)}
</style>
<style>.item .body p{margin:.15rem 0}.item .body .why{color:var(--ink-2);font-size:.92rem;margin:0 0 .35rem 1.1rem}.item .body .ok b{display:inline;margin:0;color:var(--good)}.item .body .no{color:var(--ink)}.item .body .sp{height:.5rem}.item>b{margin-bottom:.5rem}</style></head>

: new confusion with a rising respiratory rate and falling SpO₂ signals worsening hypoxemia. This is an acute change in airway and breathing, which comes before every other need on the list.", "- Client C, with a glucose of 248 mg/dL", "  No: hyperglycemia before breakfast needs coverage per orders, but 248 mg/dL in an alert client is not immediately life-threatening and can wait a few minutes.", "- Client A, with post-op pain of 6/10", "  No: pain is real and the dose is due soon, but it is an expected post-op finding. The trap is choosing the most uncomfortable client over the most unstable one.", "- Client D, who is waiting for discharge teaching", "  No: discharge is a stable, predictable task. Seeing this client first to clear a bed is a common new-graduate trap that delays care of the unstable client.", "", "Why: Prioritize by airway, breathing and circulation, then by acute change versus expected findings. Client B has an unexpected change in mental status and oxygenation that points to hypoxemia and possible sepsis. The others have expected or stable problems that can safely wait a few minutes.", "Tip: Look for the client whose condition has changed from the last assessment, especially new confusion or a falling SpO₂."], "st": "awaiting"}, {"id": "ngn:qb-mgmt-2", "hash": "0be13f26a3", "title": "Delegation to UAP · Generate solutions", "body": ["A nurse is working with an unlicensed assistive personnel (UAP) on a busy medical-surgical unit. Several tasks need to be done in the next hour.", "", "Which task is appropriate for the nurse to delegate to the UAP?", "", "- Teach a client how to use an incentive spirometer", "  No: initial teaching requires nursing judgment and is never delegated to UAP. The UAP can remind a client to use the device after the nurse has taught it.", "- Feed lunch to a client who coughed and choked on thin liquids at breakfast", "  No: this client has a new, unpredictable aspiration risk. The nurse needs to assess swallowing and get a swallow evaluation before anyone feeds the client.", "✓ Walk a client in the hallway who is 3 days post knee replacement and has walked twice today with physical therapy", "  Yes: ambulating a stable client with a predictable response is a routine task within UAP training. The nurse still tells the UAP what to report, such as dizziness or pain.", "- Take the first set of vital signs and check the groin site and pedal pulses of a client just back from cardiac catheterization", "  No: the client is in the immediate post-procedure period and could bleed or lose a pulse. Checking the site is assessment, which the RN cannot delegate.", "", "Why: Under the NCSBN and ANA delegation guidelines, the RN delegates tasks that are routine, have predictable outcomes and do not require assessment, teaching or judgment. Clients who are unstable or newly changed stay with the RN. The RN remains accountable and must give clear instructions and follow up.", "Tip: Delegate tasks for stable clients with predictable outcomes, and keep assessment, teaching, evaluation and unstable clients for the RN."], "st": "awaiting"}, {"id": "ngn:qb-mgmt-5", "hash": "01e5a7bffe", "title": "Supervising delegated care · Take action", "body": ["A 71-year-old was admitted 3 hours ago with an acute ischemic stroke and left-sided weakness. The orders say NPO until a bedside swallow screen is completed. The nurse walks into the room and sees the UAP raising the head of the bed and setting up a breakfast tray to feed the client.", "", "What is the nurse's best action?", "", "- Let the UAP continue, then complete the swallow screen after breakfast", "  No: the screen must come before any food, fluid or oral medication. Doing it afterward defeats its purpose of preventing aspiration.", "- Leave the room and report the UAP to the nurse manager", "  No: the client's safety comes first, and the nurse must intervene now. Coaching the UAP afterward, privately, is more useful than an immediate report.", "- Let the UAP feed small bites of soft food slowly while the nurse stays in the room and watches closely for coughing", "  No: watching for coughing does not replace a swallow screen, and silent aspiration is common after stroke. This also violates the NPO order.", "✓ Stop the UAP now, remove the tray, and explain that the client stays NPO until the swallow screen is done", "  Yes: the client is at high risk of aspiration, so the unsafe task must be stopped immediately. Clear, specific direction to the UAP is part of supervising delegated care.", "", "Why: The RN who delegates remains accountable for supervising the task and stepping in when care is unsafe. Feeding a client with a new stroke before a swallow screen risks aspiration pneumonia. After stopping the task, the nurse should check that the UAP knows which clients are NPO and why.", "Tip: When a delegated task is putting a client in danger, the first action is to stop it; teaching and reporting come after."], "st": "awaiting"}, {"id": "ngn:qb-mgmt-9", "hash": "bfab9f5779", "title": "Elements of negligence · Analyze cues", "body": ["A new graduate nurse is caring for a 79-year-old with a high fall risk score and an order for a bed alarm at all times. After helping the client back from the bathroom at 02:00, the nurse does not turn the bed alarm back on. At 02:40 the client gets up alone, falls, and fractures her hip.", "", "Complete the sentences.", "", "Blank 1:", "✓ accepted the client assignment", "  Yes: duty arises from the nurse-client relationship, which begins when the nurse accepts responsibility for the client's care.", "- completed the incident report", "  No: the incident report is written after the event and has nothing to do with when the duty of care began.", "- read the fall risk policy", "  No: knowing a policy defines the standard of care, but the duty to this client comes from the assignment.", "Blank 2:", "✓ a breach of the standard of care", "  Yes: a reasonably prudent nurse would have followed the order to keep the alarm on, so failing to do so falls below the standard.", "- battery", "  No: battery is touching a client without consent. Nothing in this scenario involves unconsented contact.", "- an intentional tort", "  No: negligence is unintentional. The nurse forgot the alarm; there is no evidence of intent to cause harm.", "Blank 3:", "- duty", "  No: duty is the relationship established by the assignment, not the injury that followed.", "- causation", "  No: causation is the link showing the breach led to the injury. The fracture itself is the harm, which is the element of damages.", "✓ damages", "  Yes: negligence requires actual harm. The fracture is the injury, and it must also be shown to have been caused by the breach.", "", "Why: Negligence, called malpractice when a professional is involved, requires four elements: duty, breach of duty, causation, and damages. The nurse had a duty from the assignment, breached it by not following the bed alarm order, and the client was harmed. Accurate documentation and following fall precautions are the nurse's best protection.", "Tip: Remember the four elements of negligence in order: duty, breach, causation, damages."], "st": "awaiting"}, {"id": "ngn:qb-mgmt-14", "hash": "4dff3c9022", "title": "Medication error reporting · Evaluate outcomes", "body": ["A nurse in her third month of practice realizes at 10:15 that she gave a client metoprolol tartrate 50 mg by mouth at 09:00 instead of the ordered 25 mg. She tells her preceptor what she plans to do next.", "", "Which statements by the nurse indicate an appropriate plan? Select all that apply.", "", "✓ \"The report helps find what made the error possible; it is not a punishment.\"", "  Yes: in a just culture, reporting supports learning and system fixes. Understanding this encourages reporting of errors and near misses.", "✓ \"I'll fill out a safety report describing the facts of what happened.\"", "  Yes: an incident or safety report is required for medication errors so the organization can find and fix system causes.", "- \"I'll write 'incident report filed' in my note so the next shift knows.\"", "  No: mentioning the incident report in the medical record is inappropriate. The facts of the event and the client's response are what get charted.", "✓ \"I'll check his heart rate and blood pressure now and notify the provider.\"", "  Yes: client safety comes first. A double dose of a beta blocker can cause bradycardia and hypotension, so the nurse assesses and tells the provider.", "- \"His vital signs are fine, so I don't need to tell anyone.\"", "  No: all medication errors are reported, even without harm. Effects of a beta blocker can appear later, and hiding an error is unethical.", "- \"The safety report goes in his medical record.\"", "  No: incident reports are internal quality documents kept separate from the medical record.", "✓ \"I'll chart the dose I actually gave and his response, without mentioning the safety report.\"", "  Yes: the medical record must accurately show what was given and how the client responded. The report itself is not referenced in the chart.", "", "Why: After a medication error, the nurse first assesses the client and notifies the provider, then documents the facts in the record and completes an incident report. The report is kept out of the chart and is never referenced there. Reporting supports a just culture focused on fixing systems rather than blaming individuals.", "Tip: Order your thinking: protect the client, tell the provider, document the facts, and report the event outside the chart."], "st": "awaiting"}, {"id": "ngn:qb-mgmt-21", "hash": "1f9004f780", "title": "Performance improvement · Evaluate outcomes", "body": ["A medical-surgical unit had a fall rate of 4.1 falls per 1,000 patient days last year. The unit practice council started a plan-do-study-act cycle that added hourly rounding focused on pain, toileting and position. The council is reviewing data 3 months later.", "", "Which finding best shows that the change was effective?", "", "- The number of fall incident reports increased", "  No: more reports could mean more falls or better reporting, so this alone cannot show improvement.", "- Staff say in a survey that they like hourly rounding", "  No: staff satisfaction does not show that clients fell less. The trap is confusing acceptance of a change with its effect on outcomes.", "✓ The fall rate decreased to 2.3 per 1,000 patient days, and audits show rounding was done 92% of the time", "  Yes: an outcome measure improved while a process measure shows the intervention was actually carried out, linking the change to the result.", "- The unit bought 10 more bed alarms", "  No: buying equipment is an input, not an outcome, and bed alarms were not the intervention being tested.", "", "Why: Performance improvement measures whether a change led to a better outcome. The strongest evidence pairs an outcome measure, such as the fall rate per 1,000 patient days, with a process measure showing the intervention was done. In a PDSA cycle, this study step decides whether to adopt, adapt or abandon the change.", "Tip: For evaluation questions in quality improvement, pick the option with a measurable client outcome compared with the baseline."], "st": "awaiting"}, {"id": "ngn:qb-mgmt-25", "hash": "7e8eb0cf08", "title": "Barcode scanning alerts · Take action", "body": ["A nurse scans a client's wristband and then a vial of hydromorphone 2 mg for a scheduled pain dose. The barcode system displays: \"Medication does not match an active order.\" A coworker says, \"Just override it. The scanner glitches all the time.\"", "", "What is the nurse's best action?", "", "- Override the alert because the client is in pain and the dose is due", "  No: overriding without finding the cause defeats the safety system. Overrides are a known source of serious medication errors with high-alert drugs.", "- Ask the coworker to scan the vial on a different device", "  No: rescanning on another device is a workaround that ignores what the alert means and may not catch a true mismatch.", "- Give the dose because it is due, and document the scanner problem in the client's chart and in a work order", "  No: giving the dose first exposes the client to the error the alert may be warning about. Equipment problems are reported to IT, not charted.", "✓ Hold the dose and compare the vial with the active order, then clarify with pharmacy or the prescriber", "  Yes: the alert may be catching a wrong drug, wrong dose or discontinued order. The nurse investigates the cause before giving a high-alert opioid.", "", "Why: Barcode medication administration alerts are designed to stop errors at the bedside. When an alert fires, the nurse stops and finds the reason, such as a changed order, a different concentration or the wrong drug, before giving anything. New nurses often learn workarounds from coworkers; the safe choice is to resolve the alert and report true system problems.", "Tip: Treat every barcode alert as a real error until you prove otherwise; options that override or bypass the system are traps."], "st": "awaiting"}, {"id": "ngn:qb-safe-1", "hash": "9ca8da84f2", "title": "C. difficile precautions · Evaluate outcomes", "body": ["A 74-year-old on the medical unit has had six loose, foul-smelling stools since 06:00. A stool test is positive for Clostridioides difficile, and the client is on contact precautions. The nurse observes a UAP caring for the client.", "", "Which action by the UAP requires the nurse to intervene?", "", "- Wipes the bedside table and call light with the bleach-based disinfectant wipes from the isolation cart", "  No: a sporicidal agent such as a bleach-based product is needed to kill C. difficile spores on surfaces. This is correct.", "- Uses the stethoscope and blood pressure cuff kept in the client's room", "  No: dedicated equipment stays in the room so spores are not carried to other clients. This is correct practice.", "- Puts on a gown and gloves before entering the room", "  No: gown and gloves on entry are required for contact precautions because spores contaminate the client, linens and surfaces.", "✓ Cleans her hands with alcohol-based hand rub after removing her gloves and leaving the room", "  Yes: alcohol does not kill C. difficile spores. Hands must be washed with soap and running water so friction physically removes the spores.", "", "Why: C. difficile forms spores that survive on surfaces and resist alcohol. Contact precautions, dedicated equipment and sporicidal cleaning are all correct. Hand hygiene must be soap and water, because alcohol rub does not remove or kill spores.", "Tip: When a question asks what requires intervention, look for the one action that is unsafe for this specific organism, not for infection control in general."], "st": "awaiting"}, {"id": "ngn:qb-safe-6", "hash": "76e6198555", "title": "Transmission-based precautions · Analyze cues", "body": ["The charge nurse on a medical unit is assigning rooms for six new admissions. Each client has a confirmed or suspected infection, and all clients receive standard precautions.", "", "For each condition, indicate the transmission-based precaution the client needs.", "", "- Measles (rubeola) → Airborne", "  the measles virus stays suspended in air for up to 2 hours, so it needs a negative-pressure room and N95 respirators.", "- Suspected pulmonary tuberculosis → Airborne", "  TB spreads by droplet nuclei that hang in the air; isolation starts on suspicion, before results confirm the diagnosis.", "- Pertussis → Droplet", "  pertussis spreads in large droplets from coughing, so a surgical mask on entering the room and a private room are enough.", "- Influenza → Droplet", "  influenza spreads mainly by large respiratory droplets; staff wear a surgical mask when entering the room.", "- MRSA in a draining wound → Contact", "  MRSA spreads by direct contact with the wound and contaminated surfaces, so gown and gloves are required.", "- Clostridioides difficile diarrhea → Contact", "  spores spread by touch and survive on surfaces; this needs contact precautions with soap and water hand washing.", "", "Why: Transmission-based precautions are added to standard precautions according to how the organism spreads. Airborne diseases such as measles, varicella and TB need a negative-pressure room and an N95. Droplet diseases need a surgical mask. Organisms spread by touch, such as MRSA and C. difficile, need gown and gloves.", "Tip: Use a memory list for airborne (measles, varicella, TB) and sort everything else by whether it spreads by coughing or by touching."], "st": "awaiting"}, {"id": "ngn:qb-safe-11", "hash": "e4d7d2957f", "title": "Medication error response · Take action", "body": ["At 09:00 a nurse on the medical-surgical unit gives metoprolol tartrate 50 mg PO to a client in room 412. Five minutes later she realizes the medication was ordered for a client with a similar name in room 414. She had checked only the client's name and room number. The client who received it is 81 years old and was admitted for a urinary tract infection.", "", "Which action should the nurse take first?", "", "- Complete an incident report", "  No: the report is required, but it comes after the client is assessed and treated. Paperwork never comes before client safety.", "- Check the second client's armband using his name and date of birth, then give him the dose", "  No: the other client still needs his dose, but the immediate risk is to the client who received a beta blocker he was not prescribed.", "- Notify the provider of the error", "  No: the provider must be told promptly, but the nurse should first assess so she can report the client's current heart rate and blood pressure.", "✓ Assess the client's heart rate, blood pressure and level of consciousness", "  Yes: the client's safety comes first. Metoprolol can cause bradycardia and hypotension, so the nurse needs current data before calling the provider.", "", "Why: After a medication error, the first action is to assess the client for harm, then notify the provider, then follow facility policy for reporting. The incident report is not mentioned in the medical record. This error happened because a room number was used as an identifier; the Joint Commission requires two identifiers such as full name and date of birth, checked against the armband.", "Tip: When an error has already happened, choose the assessment of the client before notifying, documenting or reporting."], "st": "awaiting"}, {"id": "ngn:qb-safe-15", "hash": "9236d5c295", "title": "Radiation implant safety · Prioritize hypotheses", "body": ["A 49-year-old on the gynecologic oncology unit has a sealed radioactive implant in place for cervical cancer. She is on bed rest in a private room with a lead shield at the bedside and a lead container with long-handled forceps in the room.", "", "Which finding requires the nurse's immediate action?", "", "- Her adult son is sitting 2 meters (6 feet) from the bed and plans to stay for 20 minutes", "  No: this visit respects distance and time limits. Visitors who are not pregnant may stay briefly at a distance per facility policy.", "✓ A small metal source is seen lying in the bed linens", "  Yes: a dislodged source exposes everyone nearby. The nurse uses long-handled forceps to place it in the lead container and notifies radiation safety at once.", "- The client reports mild lower abdominal cramping", "  No: mild cramping is expected with a cervical implant and can be managed with ordered analgesics. It is not the most urgent finding.", "- She is lying flat with an indwelling urinary catheter draining clear urine", "  No: bed rest and a catheter are expected; they keep the implant from moving and avoid trips to the bathroom.", "", "Why: Radiation protection rests on time, distance and shielding. A dislodged source is a radiation hazard that the nurse handles only with long-handled forceps, never with hands, placing it in the lead container and calling the radiation safety officer. Expected findings such as cramping, bed rest and a catheter are not urgent.", "Tip: When one option describes a hazard to everyone in the room and the others are expected findings, the hazard comes first."], "st": "awaiting"}, {"id": "ngn:qb-safe-16", "hash": "a2deeee29c", "title": "Safe patient handling · Generate solutions", "body": ["A 68-year-old on the medical-surgical unit had a stroke 3 days ago. She weighs 98 kg (216 lb), cannot bear weight on either leg, and follows commands only some of the time. The nurse is planning her transfer from bed to chair and her repositioning in bed.", "", "Complete the sentences.", "", "Blank 1:", "✓ a full-body mechanical lift", "  Yes: a client who cannot bear weight or reliably cooperate needs a mechanical lift. Manual lifting of her weight exceeds safe limits for staff.", "- a gait belt and a one-person pivot transfer", "  No: a pivot transfer requires the client to bear weight on at least one leg, which she cannot do.", "- a two-person manual lift", "  No: manual lifting of most adult clients exceeds the safe lifting limit for caregivers and is a leading cause of nurse back injuries.", "Blank 2:", "- the highest position", "  No: working too high makes the nurse reach and lift with the arms and shoulders, increasing strain and injury risk.", "✓ about the caregiver's waist height", "  Yes: working at waist height keeps the load close to the body and the back straight, which lowers strain on the spine.", "- the lowest position", "  No: the low position is for safety when the client is resting; working at that height forces the nurse to bend at the waist.", "Blank 3:", "✓ a friction-reducing device with enough staff", "  Yes: friction-reducing sheets let staff slide rather than lift the client, protecting both her skin and their backs.", "- the client's arms to pull her up", "  No: pulling under or on the arms can dislocate a weak shoulder, a known risk after stroke.", "- one nurse pushing from the foot of the bed", "  No: one person cannot safely move a dependent adult of this size, and pushing from the foot gives poor control.", "", "Why: Safe patient handling programs replace manual lifting with equipment whenever a client cannot bear weight or cooperate. Working at waist height, keeping the load close and using friction-reducing devices protect the nurse's back. Pulling on the arms of a client after stroke can injure a weak shoulder.", "Tip: If a client cannot bear weight, choose the mechanical lift; NCLEX treats manual lifting of dependent adults as unsafe for staff."], "st": "awaiting"}, {"id": "ngn:qb-hp-12", "hash": "b2b85549ed", "title": "Normal aging changes · Recognize cues", "body": ["A 79-year-old is recovering from pneumonia on the medical unit and is now alert and oriented. Her daughter asks which of her mother's recent changes are a normal part of aging.", "", "Which change reported by the daughter is not expected with normal aging and requires follow-up?", "", "- She needs brighter light and reading glasses to read", "  No: presbyopia and the need for more light are expected as the lens stiffens and the pupil gets smaller with age.", "- She wakes earlier in the morning and naps in the afternoon", "  No: older adults often have lighter, shorter nighttime sleep and earlier waking. This is expected with aging.", "✓ Over the past 6 months, she has gotten lost twice driving to the grocery store she has used for 20 years", "  Yes: getting lost on a familiar route reflects a decline in memory and spatial function that interferes with daily life. It suggests dementia and needs a cognitive evaluation.", "- She takes longer to recall names but remembers them later", "  No: slower retrieval of names with later recall is a normal age-related change and does not affect independence.", "", "Why: Normal aging brings slower recall, presbyopia and lighter sleep, none of which stop a person from living independently. Getting lost on a familiar route over months is a functional decline that points to a neurocognitive disorder. The nurse should share this with the provider for cognitive screening and address driving safety.", "Tip: Ask whether the change interferes with daily function; slowing is normal aging, but loss of everyday abilities needs follow-up."], "st": "awaiting"}, {"id": "ngn:qb-pharm-2", "hash": "5b5dfe90eb", "title": "IV infusion rate · Take action", "body": ["A 58-year-old with an infected diabetic foot ulcer has an order for vancomycin 1,000 mg in 250 mL 0.9% sodium chloride IV to infuse over 120 minutes. The infusion will run on an electronic pump.", "", "At what rate should the nurse set the pump?", "", "Answer: 125 mL/h. Round to the nearest whole number.", "  120 minutes = 2 hours", "  250 mL ÷ 2 h = 125 mL/h", "", "Why: Divide the total volume by the infusion time in hours. Vancomycin runs over at least 60 minutes and no faster than 10 mg/min, so 1,000 mg needs at least 100 minutes; a fast rate causes the flushing and itching of a vancomycin infusion reaction.", "Tip: Convert minutes to hours before dividing whenever the answer must be in mL/h."], "st": "awaiting"}, {"id": "ngn:qb-pharm-5", "hash": "fdfcacfc2c", "title": "Drops per minute · Generate solutions", "body": ["A 46-year-old admitted with dehydration has an order for lactated Ringer's 1,000 mL IV over 8 hours. No pump is available, so the infusion will run by gravity. The administration set delivers 15 gtt/mL.", "", "How many drops per minute should the nurse regulate the infusion to?", "", "Answer: 31 gtt/min. Round to the nearest whole number.", "  mL/h: 1,000 mL ÷ 8 h = 125 mL/h", "  gtt/min: 125 mL/h × 15 gtt/mL ÷ 60 min = 31.25 gtt/min", "  Round to the nearest whole drop: 31 gtt/min", "", "Why: Drops per minute equals volume times drop factor divided by time in minutes. You cannot count part of a drop, so round to a whole number. Gravity infusions drift, so recheck the rate often.", "Tip: Remember the shortcut: with a 15 gtt/mL set, divide the mL/h rate by 4."], "st": "awaiting"}, {"id": "ngn:qb-pharm-9", "hash": "e8b5159b52", "title": "Potassium chloride safety · Recognize cues", "body": ["A 67-year-old with heart failure has a potassium level of 3.1 mEq/L. The nurse reviews the new orders entered during the night on the medication administration record.", "", "Which order should the nurse clarify with the provider before giving any dose?", "", "- Metoprolol succinate 25 mg PO daily; hold for apical pulse below 60 or systolic BP below 100", "  No: A low starting dose of a heart failure beta blocker with clear hold parameters is a complete, safe order that needs no clarification.", "- Potassium chloride 10 mEq in 100 mL IV over 1 hour through the peripheral line", "  No: 10 mEq/h through a peripheral line on a pump is a standard, safe rate for replacement, with cardiac monitoring per policy.", "✓ Potassium chloride 20 mEq IV push now", "  Yes: Concentrated potassium is never given IV push; a bolus can cause fatal dysrhythmias and cardiac arrest. It must be diluted and given on a pump.", "- Enoxaparin 40 mg subcut daily", "  No: This is a standard prophylactic dose for venous thromboembolism. Nothing in the order is unsafe for this client.", "", "Why: ISMP lists IV potassium chloride as a high-alert medication. It is never given IV push or IV bolus; it is diluted and infused on a pump, usually no faster than 10 mEq/h on a peripheral line. Any order for IV push potassium must be clarified.", "Tip: Memorize the short list of drugs that are never pushed IV, and potassium chloride is the first one on it."], "st": "awaiting"}, {"id": "ngn:qb-pharm-12", "hash": "adb642aec2", "title": "Hypoglycemia rule of 15 · Take action", "body": ["A 58-year-old with type 2 diabetes receives insulin glargine at bedtime and insulin lispro with meals. At 11:00 she is shaky and sweaty. Capillary glucose is 58 mg/dL. She is alert, follows commands and swallows normally. Lunch arrives in 1 hour.", "", "Which action should the nurse take first?", "", "- Give 50% dextrose IV push", "  No: IV dextrose is for a client who cannot safely swallow. She can take oral carbohydrate, which is faster to give and safer.", "- Give cheese and crackers with a glass of whole milk", "  No: Fat and protein slow glucose absorption. A snack with protein is useful after the glucose recovers, not as the first treatment.", "- Give glucagon 1 mg IM", "  No: Glucagon is for a client who is unconscious or cannot swallow and has no IV access. It is not first line here.", "✓ Give 4 oz (120 mL) of fruit juice and recheck glucose in 15 minutes", "  Yes: An alert client who can swallow gets 15 g of fast-acting carbohydrate, then a recheck in 15 minutes. Repeat if glucose is still below 70 mg/dL.", "", "Why: The rule of 15 treats mild to moderate hypoglycemia: 15 g of fast-acting carbohydrate, recheck in 15 minutes, and repeat until glucose is at least 70 mg/dL. Then give a snack or meal to prevent a repeat drop, and report the episode.", "Tip: Pick the least invasive treatment that matches the client's ability to swallow."], "st": "awaiting"}, {"id": "ngn:qb-pharm-17", "hash": "d4e3279b94", "title": "Vancomycin infusion reaction · Analyze cues", "body": ["A 45-year-old with cellulitis is 20 minutes into the first dose of IV vancomycin. He reports itching, and his face, neck and upper chest are flushed red. BP is 118/74 (baseline 122/78), HR 92, SpO₂ 97% on room air. Lungs are clear and he denies throat tightness.", "", "The nurse recognizes these findings are most consistent with which problem?", "", "✓ Vancomycin infusion reaction", "  Yes: Flushing and itching of the face, neck and upper body during a vancomycin infusion is a histamine release reaction linked to a fast rate. It is not a true allergy.", "- Stevens-Johnson syndrome", "  No: This severe skin reaction develops days into therapy with blistering and mucosal sores, not flushing minutes into an infusion.", "- Clostridioides difficile infection", "  No: C. difficile causes watery diarrhea after antibiotic exposure, not flushing during an infusion.", "- Anaphylaxis", "  No: Anaphylaxis involves the airway or circulation, such as wheezing, throat tightness or hypotension. His vital signs and breathing are stable.", "", "Why: Vancomycin infusion reaction, formerly called red man syndrome, is caused by histamine release when the drug runs too fast. Stop the infusion, notify the provider, give an antihistamine as ordered and restart at a slower rate. Watch for signs that would point instead to anaphylaxis.", "Tip: Separate a rate-related reaction from anaphylaxis by checking the airway, breathing and blood pressure."], "st": "awaiting"}, {"id": "ngn:qb-pharm-21", "hash": "6b09744055", "title": "Aminoglycosides and C. difficile · Recognize cues", "body": ["A 70-year-old weighing 60 kg is on day 6 of IV gentamicin and ceftriaxone for sepsis from pyelonephritis. Today: T 37.0 °C (98.6 °F), down from 38.9 °C (102 °F) on admission; BP 124/76; WBC 9,800/mm³, down from 16,000. Creatinine is 1.8 mg/dL (admission 1.0). Urine output has been 20 mL/h for 3 hours. She says her ears are ringing and she has had 4 watery stools with cramping since yesterday.", "", "Which findings require follow-up? Select all that apply.", "", "✓ Urine output 20 mL/h for 3 hours", "  Yes: Output below 0.5 mL/kg/h (30 mL/h for 60 kg) supports acute kidney injury and needs prompt reporting.", "✓ Creatinine 1.8 mg/dL, up from 1.0", "  Yes: A rising creatinine signals kidney injury, a classic aminoglycoside toxicity; the dose or drug may need to change.", "✓ Ringing in her ears", "  Yes: Tinnitus signals ototoxicity, which can become permanent hearing loss if the drug continues.", "- BP 124/76", "  No: Blood pressure is stable and within normal limits, so it needs no follow-up.", "✓ Four watery stools with cramping since yesterday", "  Yes: New diarrhea during antibiotic therapy raises concern for C. difficile; she needs testing and contact precautions.", "- WBC 9,800/mm³", "  No: The white count is now normal and falling from 16,000, an expected response to treatment.", "- Temperature 37.0 °C (98.6 °F)", "  No: The fever has resolved, which shows the infection is responding to treatment.", "", "Why: Aminoglycosides such as gentamicin can damage the kidneys and the inner ear, so creatinine, urine output, trough levels, hearing and balance are monitored. Any broad antibiotic course also raises the risk of C. difficile. Improving fever and white count show the infection is responding.", "Tip: For aminoglycosides, think kidneys and ears; for any antibiotic, think C. difficile when diarrhea appears."], "st": "awaiting"}, {"id": "ngn:qb-pharm-26", "hash": "55ab5038bd", "title": "Insulin types and timing · Prioritize hypotheses", "body": ["A 63-year-old with type 2 diabetes receives insulin lispro 6 units subcut at 07:45 when his breakfast tray arrives, and insulin glargine 20 units subcut at 21:00.", "", "Complete the sentences.", "", "Blank 1:", "✓ 15 minutes", "  Yes: Rapid-acting insulin starts within about 15 minutes, which is why it is given with the meal.", "- 4 hours", "  No: An onset of several hours fits long-acting insulin, not lispro.", "- 1 hour", "  No: An onset near 30 to 60 minutes fits regular insulin, not a rapid-acting analog.", "Blank 2:", "- 6 to 8 hours after the injection", "  No: A peak several hours after injection fits NPH, an intermediate-acting insulin.", "- 16 to 20 hours after the injection", "  No: Lispro is gone long before this point; its total duration is about 3 to 5 hours.", "✓ 1 to 2 hours after the injection", "  Yes: Lispro peaks about 1 to 2 hours after injection, so watch for hypoglycemia mid-morning.", "Blank 3:", "- peaks about 2 hours after injection", "  No: A 2-hour peak describes rapid-acting insulin. The trap is assuming every insulin has a peak.", "✓ has no pronounced peak and is not mixed with other insulins", "  Yes: Glargine provides steady basal coverage for about 24 hours and must never be mixed in a syringe with another insulin.", "- can be given IV to treat high glucose", "  No: Glargine is for subcut use only; IV insulin infusions use regular insulin.", "", "Why: Hypoglycemia risk is greatest when an insulin peaks. Rapid-acting lispro starts in about 15 minutes and peaks in 1 to 2 hours, so it is given with meals. Long-acting glargine has no real peak and is never mixed, and IV infusions use regular insulin.", "Tip: Learn onset, peak and duration for each insulin class, then time your hypoglycemia checks to the peak."], "st": "awaiting"}, {"id": "ngn:qb-pharm-28", "hash": "04ed8cfd05", "title": "Transfusion reaction · Prioritize hypotheses", "body": ["A 54-year-old is 10 minutes into a unit of packed red blood cells. She reports chills and low back pain. T 38.6 °C (101.5 °F), up from 36.9 °C (98.4 °F); BP 88/50, down from 124/76; HR 122. The urine in her catheter bag has turned dark red.", "", "Complete the diagram: the condition the client is most likely experiencing, two actions the nurse should take, and two parameters to monitor.", "", "Condition:", "✓ Acute hemolytic transfusion reaction", "  Yes: Fever, chills, back pain, hypotension and dark urine early in a transfusion signal destruction of incompatible red cells.", "- Febrile nonhemolytic reaction", "  No: A febrile reaction causes fever and chills but not hypotension, back pain or blood in the urine.", "- Transfusion-associated circulatory overload", "  No: Circulatory overload causes hypertension, dyspnea and crackles, not hypotension with dark urine.", "- Mild allergic reaction", "  No: An allergic reaction causes hives and itching with stable blood pressure.", "Actions to take:", "✓ Stop the transfusion and keep the IV open with 0.9% sodium chloride through new tubing", "  Yes: Stopping at once limits how much incompatible blood she receives; new tubing keeps IV access without giving more blood.", "✓ Notify the provider and blood bank and send the bag and tubing to the blood bank", "  Yes: The provider must treat shock and kidney risk, and the blood bank investigates the unit and repeats compatibility testing.", "- Slow the transfusion and give acetaminophen", "  No: Any continued infusion delivers more incompatible blood. The trap is treating this like a simple fever.", "- Give diphenhydramine and resume the unit when symptoms fade", "  No: An antihistamine treats mild allergy, and a unit is never restarted after a hemolytic reaction.", "- Flush the existing blood tubing with saline to keep the vein open", "  No: Flushing the old tubing pushes the remaining incompatible blood into the client.", "Parameters to monitor:", "✓ Urine output and color", "  Yes: Free hemoglobin can injure the kidneys, so hourly output and urine color show kidney perfusion and ongoing hemolysis.", "✓ Blood pressure and heart rate", "  Yes: Hypotension and tachycardia show shock; trends guide fluids and vasopressor support.", "- Capillary blood glucose", "  No: Blood glucose is not affected by hemolysis and does not guide treatment.", "- Deep tendon reflexes", "  No: Reflexes are tracked for magnesium therapy, not transfusion reactions.", "- Peak expiratory flow", "  No: Peak flow tracks asthma control and does not reflect hemolysis or shock.", "", "Why: An acute hemolytic reaction is usually caused by ABO incompatibility and starts within minutes. Stop the transfusion, keep the vein open with saline through new tubing, support blood pressure and protect the kidneys. The provider and blood bank are notified and the unit is returned for testing.", "Tip: For any suspected transfusion reaction, the first action is always to stop the transfusion."], "st": "awaiting"}, {"id": "ngn:qb-risk-3", "hash": "2a6e9163ad", "title": "Hyponatremia safety · Take action", "body": ["A 70-year-old admitted with pneumonia has new confusion. Serum sodium is 122 mEq/L (136 mEq/L two days ago). The provider diagnosed le, so the client voids just before the procedure.", "- Insert an indwelling urinary catheter to keep the bladder empty", "  No: Voiding before the procedure is enough. A catheter adds infection risk without benefit.", "- Keep him lying flat for 6 hours afterward", "  No: Lying flat after a procedure is linked to lumbar puncture teaching. The trap is mixing up procedures; he may sit up as tolerated.", "- Place him in Trendelenburg position during the procedure", "  No: Head-down positioning pushes ascites against the diaphragm and worsens his breathing; it also moves fluid away from the needle site.", "✓ Position him sitting upright at the edge of the bed or in high Fowler's", "  Yes: Upright positioning pools fluid in the lower abdomen for easier removal and eases his breathing.", "✓ Measure his weight and abdominal girth before and after", "  Yes: Before and after measurements show how much fluid was removed and give a baseline for tracking reaccumulation.", "", "Why: Paracentesis preparation centers on preventing bladder puncture, positioning for fluid drainage and breathing, and recording baseline weight and girth. After a large-volume removal, fluid shifts can cause hypotension, so vital signs are monitored closely. Albumin may be ordered after large volumes.", "Tip: For procedure items, think through before, during and after, and match each option to the procedure in the stem."], "st": "awaiting"}]}, "packs": [{"id": "drill-med-1", "title": "Drills: Med Pass, part 1 of 2", "sub": "What to check before a medication, then give, hold or call. A pharmacist is especially welcome.", "n": 25, "reviewed": 0, "changed": 0}, {"id": "drill-med-2", "title": "Drills: Med Pass, part 2 of 2", "sub": "What to check before a medication, then give, hold or call. A pharmacist is especially welcome.", "n": 25, "reviewed": 0, "changed": 0}, {"id": "drill-first-1", "title": "Drills: Who's First, part 1 of 2", "sub": "Four patients, one nurse: who do you see first, and why not the o
