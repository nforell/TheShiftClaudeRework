<style>
:root{--bg:#E6EDF0;--surface:#FBFCFC;--surface-2:#EDF2F4;--ink:#152238;--ink-2:#4D5A6F;--line:#CAD5DB;--teal:#2449A8;--teal-ink:#fff;--red:#B3342B;--red-bg:#F8E1DE;--good:#2B7249;--good-bg:#E0F0E6;--amber:#A96C0E;--amber-bg:#FBEFD6;
  --serif:"Barlow Condensed","Arial Narrow",sans-serif;--sans:"Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161C;--surface:#1A1F27;--surface-2:#212833;--ink:#E7E4DB;--ink-2:#A0A5AE;--line:#343C48;--teal:#93B4E4;--teal-ink:#0F1B2C;--red:#F0766B;--red-bg:#3b1d1b;--good:#72c692;--good-bg:#16301f;--amber:#E9AE4E;--amber-bg:#35291a}}
:root[data-theme="dark"]{--bg:#12161C;--surface:#1A1F27;--surface-2:#212833;--ink:#E7E4DB;--ink-2:#A0A5AE;--line:#343C48;--teal:#93B4E4;--teal-ink:#0F1B2C;--red:#F0766B;--red-bg:#3b1d1b;--good:#72c692;--good-bg:#16301f;--amber:#E9AE4E;--amber-bg:#35291a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
main{max-width:52rem;margin:0 auto;padding:clamp(1.2rem,5vw,3rem) 16px calc(5rem + env(safe-area-inset-bottom))}
a{color:var(--teal)}
.home{font-family:var(--serif);font-weight:700;font-size:1.1rem;letter-spacing:.04em;text-transform:uppercase;background:var(--ink);color:var(--bg);padding:.28em .55em .22em;border-radius:2px;text-decoration:none}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.9rem,6vw,2.6rem);line-height:1.1;letter-spacing:0;margin:1.6rem 0 .3rem}
h2{font-size:1.15rem;margin:2.4rem 0 .6rem}
h3{font-size:1rem;margin:0}
p{margin:.5rem 0}
.muted{color:var(--ink-2)}
.meta{display:flex;flex-wrap:wrap;gap:.4rem .6rem;margin-top:.6rem}
.chip{display:inline-flex;align-items:center;padding:.15em .6em;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--surface-2);border:1px solid var(--line)}
.chip.awaiting{background:var(--amber-bg);border-color:transparent;color:var(--amber)}
.chip.reviewed{background:var(--good-bg);border-color:transparent;color:var(--good)}
.chip.changed{background:var(--red-bg);border-color:transparent;color:var(--red)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem 1.1rem;margin:.8rem 0}
.how ol{margin:.4rem 0 0;padding-left:1.2rem}.how li{margin:.2rem 0}
label{display:block;font-weight:600;font-size:.9rem;margin:.7rem 0 .25rem}
input[type=text],input[type=email],textarea,select{width:100%;min-height:44px;padding:.5em .7em;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:5rem;resize:vertical}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:0 1rem}
details.pt{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:.6rem 0}
details.pt>summary{cursor:pointer;padding:.85rem 1rem;font-weight:600;list-style-position:inside}
details.pt>div{padding:0 1rem 1rem}
table{width:100%;border-collapse:collapse;font-size:.88rem;margin:.4rem 0}
th,td{text-align:left;vertical-align:top;padding:.35rem .5rem .35rem 0;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--ink-2);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
.scroll{overflow-x:auto}
ul.plain{margin:.3rem 0;padding-left:1.1rem}
.dec{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:.85rem 1rem;margin:.6rem 0}
.dec.pos{border-left-color:var(--good)}.dec.neg{border-left-color:var(--red)}
.dec .top{display:flex;flex-wrap:wrap;gap:.3rem .5rem;align-items:center;font-size:.78rem;color:var(--ink-2);font-weight:600}
.pts{font-weight:700;padding:.05em .45em;border-radius:4px;background:var(--surface-2)}
.pos .pts{color:var(--good);background:var(--good-bg)}.neg .pts{color:var(--red);background:var(--red-bg)}
.dec b{display:block;margin:.35rem 0 .15rem;font-size:1rem}
.dec .why{font-family:var(--sans);color:var(--ink-2);margin:0}
.dec .src{font-size:.75rem;color:var(--ink-2);margin-top:.35rem}
.verdict{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.7rem}
.verdict button{min-height:40px;padding:.35em .9em;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer}
.verdict button[aria-pressed="true"][data-v="ok"]{background:var(--good);border-color:var(--good);color:var(--teal-ink)}
.verdict button[aria-pressed="true"][data-v="fix"]{background:var(--red);border-color:var(--red);color:var(--teal-ink)}
.verdict button[aria-pressed="true"][data-v="unsure"]{background:var(--amber);border-color:var(--amber);color:var(--teal-ink)}
.dec textarea{margin-top:.5rem;min-height:3.6rem}
.opt{padding:.4rem 0;border-bottom:1px solid var(--line);font-size:.92rem}.opt:last-child{border:0}
.opt i{font-style:normal;font-weight:700;font-size:.75rem;padding:.05em .4em;border-radius:4px;margin-right:.4rem;background:var(--surface-2)}
.bar{position:sticky;top:0;z-index:5;margin:0 -16px;padding:.6rem 16px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:.6rem;font-size:.9rem}
.bar .prog{display:block;flex:1;min-width:4rem;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;max-width:12rem}.bar .prog i{display:block;height:100%;background:var(--teal)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:.55em 1.2em;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn-primary{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.row{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1rem}
.check{display:flex;gap:.6rem;align-items:flex-start;font-weight:500;margin-top:1rem}
.check input{width:1.2rem;height:1.2rem;margin-top:.2rem;flex:none}
.msg{margin-top:.8rem;font-weight:600}.msg.err{color:var(--red)}.msg.ok{color:var(--good)}
pre{white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:.8rem;font-size:.8rem;max-height:18rem;overflow:auto}
.shifts a{display:block;text-decoration:none;color:inherit}
.shifts .card:hover{border-color:var(--ink-2)}
</style>
<style>.item .body p{margin:.15rem 0}.item .body .why{color:var(--ink-2);font-size:.92rem;margin:0 0 .35rem 1.1rem}.item .body .ok b{display:inline;margin:0;color:var(--good)}.item .body .no{color:var(--ink)}.item .body .sp{height:.5rem}.item>b{margin-bottom:.5rem}</style></head>

objection requires an emergency or a legal process.", "- Documenting the refusal and the client's stated reason in the record, then notifying the provider", "  No: this is correct. The provider needs to know about the refusal and the side effect so the plan can be reviewed.", "- Asking the client what the medication makes him feel like", "  No: exploring the reason for refusal is appropriate. Side effects can often be managed, which may change the client's decision.", "- Offering to bring the medication back later if the client changes his mind", "  No: this respects the client's choice and keeps the door open. It is an appropriate, nonthreatening response.", "", "Why: Clients admitted involuntarily keep most of their rights, including the right to refuse treatment. Medication may be given over objection only in an emergency where the client is an imminent danger, or after a legal process such as a court order; the exact process varies by state. Threatening a client to gain compliance can be considered coercion.", "Tip: Involuntary admission is not the same as incompetence; the client keeps the right to refuse unless an emergency or court order applies."], "st": "awaiting"}, {"id": "ngn:qb-mgmt-15", "hash": "08ee8b0a44", "title": "Conflict resolution · Generate solutions", "body": ["A nurse in her first year of practice is acting as relief charge nurse on an adult psychiatric unit. Two experienced nurses begin arguing loudly at the nursing station about who should take a new admission. Several clients in the day room are watching.", "", "What is the charge nurse's best action?", "", "- Assign the admission to the nurse who spoke first without discussion", "  No: deciding without hearing the concerns may ignore a real workload problem and breed resentment. It also leaves the argument unaddressed.", "- Call the nurse manager at home to report both nurses", "  No: escalation is premature for a conflict the charge nurse can address now. Going up the chain of command comes after a first attempt to resolve it.", "✓ Ask both nurses to step into the office and have each explain their concerns before working out the assignment together", "  Yes: moving the discussion out of client view protects the milieu, and hearing both sides supports a collaborative solution both nurses can accept.", "- Tell them to settle it between themselves and walk away", "  No: avoidance leaves the conflict unresolved in front of clients and the new admission without a nurse. The charge nurse has authority to act.", "", "Why: Conflict in front of clients is especially harmful on a psychiatric unit, where a calm milieu is part of treatment. The charge nurse should first move the conversation to a private place, then use collaboration: hear each person, identify the real issue, and agree on a solution. Escalation is used if the conflict cannot be resolved at the unit level.", "Tip: For conflict questions, choose the option that addresses the problem privately and directly with the people involved before escalating."], "st": "awaiting"}, {"id": "ngn:qb-safe-3", "hash": "6a8c68ea15", "title": "Fire response RACE · Take action", "body": ["On the adult psych unit at 21:30, a nurse smells smoke and finds a small fire burning in a wastebasket in a client's room. The 34-year-old client is standing next to the wastebasket holding a lighter he hid after a family visit.", "", "Place the nurse's actions in the correct order.", "", "Correct order:", "1. Move the client out of the room and away from the fire", "  Yes: R is rescue. The first priority is removing anyone in immediate danger, and this client is standing beside the fire.", "2. Activate the fire alarm and call the facility emergency number", "  Yes: A is alarm. Pulling the alarm brings help and alerts the rest of the unit so others can protect clients.", "3. Close the door to the room", "  Yes: C is contain. Closing the door limits smoke and oxygen and slows the spread of fire to the hallway.", "4. Extinguish the fire with an extinguisher if it is small and safe to do so, using the PASS technique", "  Yes: E is extinguish or evacuate. Use PASS: pull the pin, aim at the base, squeeze the handle and sweep side to side.", "", "Why: The RACE sequence guides fire response: rescue, alarm, contain, then extinguish or evacuate. Clients come before property, so rescue is first. A small fire may be extinguished only after help is called and the area is contained; otherwise the unit evacuates, starting with clients closest to the fire.", "Tip: Learn RACE and PASS as fixed sequences; in fire questions, client safety always comes before fighting the fire."], "st": "awaiting"}, {"id": "ngn:qb-hp-3", "hash": "9707754330", "title": "Lung cancer screening · Generate solutions", "body": ["A 58-year-old with schizophrenia is preparing for discharge from the adult psych unit. He has smoked one pack of cigarettes a day for 35 years and still smokes. He says, \"My uncle died of lung cancer. Is there any way to check my lungs before I get sick?\"", "", "Which response by the nurse is most appropriate?", "", "✓ \"Based on your age and smoking history, you meet the criteria for a yearly low-dose CT scan of the chest. Let's also talk about support to help you quit.\"", "  Yes: USPSTF recommends yearly low-dose CT for adults 50 to 80 with at least a 20 pack-year history who smoke now or quit within 15 years. Pairing it with cessation support addresses the main risk.", "- \"If you quit smoking now, you will not need any screening.\"", "  No: quitting lowers risk over time, but a long smoking history still qualifies him for screening for years after quitting.", "- \"Screening is only needed if you start to have a cough or lose weight.\"", "  No: screening is for people without symptoms. A new cough or weight loss calls for a diagnostic workup, not screening.", "- \"A yearly chest x-ray is the recommended screening test for people who smoke.\"", "  No: chest x-rays have not been shown to reduce deaths from lung cancer. Low-dose CT is the recommended screening test.", "", "Why: This client qualifies for lung cancer screening: he is 58, has 35 pack-years and still smokes. Low-dose CT is the recommended test. People with serious mental illness smoke at much higher rates than the general population, so discharge is a good time to offer both screening and cessation support.", "Tip: For screening questions, separate screening (no symptoms, eligible by risk) from diagnosis (symptoms present), and favor answers that also address the risk behavior."], "st": "awaiting"}, {"id": "ngn:qb-pharm-16", "hash": "e755cc530b", "title": "MAOI and tyramine · Evaluate outcomes", "body": ["A 48-year-old with treatment-resistant depression is starting phenelzine. After diet teaching, the nurse asks him to choose a lunch from the hospital menu.", "", "Which choice indicates the client understands the teaching?", "", "- A salami sandwich with aged cheddar cheese", "  No: Cured meats and aged cheese are high in tyramine and can trigger a hypertensive crisis with an MAOI.", "- Stir-fried tofu with soy sauce and a small bowl of miso soup", "  No: Soy sauce and miso are fermented soy products high in tyramine. The trap is thinking only of cheese and wine.", "- Smoked herring with sauerkraut", "  No: Smoked or pickled fish and fermented cabbage are high in tyramine and are avoided while taking an MAOI.", "✓ Fresh grilled chicken, a baked potato and steamed carrots", "  Yes: Fresh meat and fresh vegetables are low in tyramine and safe with an MAOI.", "", "Why: MAOIs block the breakdown of tyramine, so tyramine-rich foods can cause a sudden, severe rise in blood pressure with an occipital headache. Avoid aged, cured, fermented, smoked or spoiled foods and tap beer. The restriction continues for 2 weeks after stopping the drug.", "Tip: For MAOI diet items, look for words such as aged, cured, smoked, pickled or fermented; fresh is safe."], "st": "awaiting"}, {"id": "ngn:qb-pharm-22", "hash": "099cff00ce", "title": "Neuroleptic malignant syndrome · Recognize cues", "body": ["A 42-year-old with schizophrenia started haloperidol 3 days ago. This morning: T 39.4 °C (102.9 °F), BP 168/98 and 30 minutes later 104/62, HR 124, heavy sweating. His arms resist movement evenly through the full range. He is newly confused about where he is. He also has a dry mouth and slept 9 hours last night.", "", "Which findings require immediate follow-up? Select all that apply.", "", "✓ Lead-pipe rigidity of the arms", "  Yes: Severe, even muscle rigidity is a defining feature of neuroleptic malignant syndrome and drives a rising CK and kidney injury.", "- Slept 9 hours last night", "  No: Sedation and longer sleep are common with antipsychotics and are not a sign of an emergency.", "- Dry mouth", "  No: Dry mouth is a common, mild anticholinergic effect treated with sips of water and sugar-free gum.", "✓ New confusion about where he is", "  Yes: An altered level of consciousness is a core sign and shows the syndrome is affecting the brain.", "✓ Temperature 39.4 °C (102.9 °F)", "  Yes: High fever with an antipsychotic is a cardinal sign of neuroleptic malignant syndrome, a medical emergency.", "✓ Blood pressure swinging from 168/98 to 104/62 with heavy sweating", "  Yes: Autonomic instability, with labile blood pressure, tachycardia and diaphoresis, is part of the syndrome.", "", "Why: Neuroleptic malignant syndrome presents with fever, rigidity, autonomic instability and altered mental status, usually early in therapy or after a dose increase. Stop the antipsychotic, notify the provider, cool the client and expect labs such as CK. Mild anticholinergic effects and sedation are expected.", "Tip: For any antipsychotic client with fever, check for rigidity and confusion before calling it an infection."], "st": "awaiting"}, {"id": "ngn:qb-psy-1", "hash": "755dcdfcf5", "title": "Suicide risk communication · Recognize cues", "body": ["A 16-year-old admitted to the adolescent unit for depression has stayed in his room most of the day. When the nurse sits with him, he looks down and says, \"Nobody would even notice if I was gone.\"", "", "Which response by the nurse is best?", "", "- \"Why would you say something like that?\"", "  No: why questions sound judgmental and make clients defensive. They do not assess suicide risk.", "✓ \"Are you thinking about killing yourself?\"", "  Yes: asking directly and clearly about suicide is the standard of care. It does not plant the idea and opens the door to a risk assessment.", "- \"Of course people would notice. Your parents visit you every day.\"", "  No: this argues with his feelings and gives false reassurance, which can shut down the conversation.", "- \"Let's talk about something more positive, like your plans for after discharge.\"", "  No: changing the subject dismisses a possible warning sign and misses the chance to assess his safety.", "", "Why: A statement like \"nobody would notice if I was gone\" is an indirect suicide cue. The nurse should ask directly whether the client is thinking of suicide, then assess plan, intent and means. Direct questions do not increase risk and show the nurse can handle the answer.", "Tip: When a client hints at suicide, the best answer asks about it directly using the word suicide or killing yourself."], "st": "awaiting"}, {"id": "ngn:qb-psy-2", "hash": "ee2018eaec", "title": "Suicide precautions · Take action", "body": ["A 42-year-old is admitted to the adult psych unit after telling her therapist she plans to hang herself. She says she still has thoughts of dying. The provider orders suicide precautions with continuous observation.", "", "Which actions should the nurse take? Select all that apply.", "", "✓ Check meal trays and count utensils when they are returned", "  Yes: utensils and other tray items can be used for self-harm, so they are accounted for after every meal.", "- Have her sign a no-suicide contract", "  No: no-suicide contracts do not prevent suicide and can create false reassurance. A collaborative safety plan is used instead.", "✓ Search her belongings and remove belts, shoelaces, cords and plastic bags", "  Yes: these are ligature and suffocation risks, which matter most because her stated plan is hanging.", "- Assign her a private room at the end of the hall so she can rest", "  No: a room near the nurses' station is safer. Isolation away from staff increases the risk of a suicide attempt.", "✓ Ask her about suicidal thoughts at least every shift", "  Yes: risk changes over time, and regular direct assessment guides the level of observation.", "✓ Assign a staff member to keep her in sight at all times, including in the bathroom", "  Yes: continuous one-to-one observation is the order and means she is never out of view of the assigned staff member.", "", "Why: Suicide precautions combine close observation, a safe environment and ongoing assessment. A client with a plan for hanging needs ligature risks removed and continuous observation. No-suicide contracts are not evidence based and are not a substitute for observation and safety planning.", "Tip: For suicide safety questions, choose actions that increase observation and remove means; reject anything that relies on a promise."], "st": "awaiting"}, {"id": "ngn:qb-psy-7", "hash": "22b11d3170", "title": "Safety plan teaching · Evaluate outcomes", "body": ["A 15-year-old is being discharged from the adolescent unit after an admission for suicidal thoughts. The nurse reviewed her written safety plan with her and her mother.", "", "Which statements indicate the teaching was effective? Select all that apply.", "", "- Teen: \"I promised I won't hurt myself, so I don't really need the plan.\"", "  No: a promise is not a safety strategy. This statement shows she may not use the plan when she needs it.", "✓ Teen: \"If I can't stay safe, I'll call or text 988 or go to the emergency room.\"", "  Yes: she knows how to reach crisis help, including the 988 Suicide and Crisis Lifeline, when her coping steps are not enough.", "✓ Teen: \"My warning sign is when I stop answering texts and stay in my room all day.\"", "  Yes: recognizing her own warning signs is the first step of a safety plan, so she knows when to use it.", "- Teen: \"I should keep these thoughts to myself so my parents don't worry.\"", "  No: the plan depends on reaching out. Hiding suicidal thoughts increases risk and shows a need for more teaching.", "✓ Mother: \"I locked up all the medications, and the gun is now stored out of the house.\"", "  Yes: limiting access to lethal means, especially firearms, is one of the most effective ways to prevent suicide.", "✓ Teen: \"When my coping list isn't enough, I'll call my aunt.\"", "  Yes: naming a specific trusted person to contact shows she understands the plan's support steps.", "", "Why: A safety plan lists personal warning signs, coping strategies, people to contact, crisis lines such as 988 and steps to limit access to lethal means. Effective teaching shows up as the teen and family describing each part and planning to use it. Statements that rely on promises or secrecy need more teaching.", "Tip: For evaluation of teaching, choose statements that show the person will take a safe action, and reject those that avoid help."], "st": "awaiting"}, {"id": "ngn:qb-psy-11", "hash": "0e4d507bb6", "title": "Command hallucinations · Prioritize hypotheses", "body": ["The nurse on the adult psych unit receives report on four clients at 07:00.", "", "Which client should the nurse see first?", "", "- A 50-year-old with major depression who is asking for her PRN sleep medication", "  No: a request for a sleep aid is a comfort need. It can wait briefly while the nurse addresses a safety threat.", "- A 33-year-old with bipolar mania who is talking rapidly in the day room and ate half of breakfast", "  No: these findings are expected in mania and need monitoring, but there is no immediate danger described.", "- A 41-year-old with generalized anxiety who wants to know her discharge date", "  No: this is an information request and is the least urgent of the four.", "✓ A 28-year-old with schizophrenia who says the voices are telling him to hurt his roommate", "  Yes: command hallucinations to harm someone are an immediate safety risk to others and need assessment and intervention now.", "", "Why: Safety comes first on a psych unit. Command hallucinations directing harm to self or others are a psychiatric emergency because the client may act on them. The nurse assesses the content of the voices and the client's intent, ensures the safety of the roommate and others, and notifies the provider.", "Tip: In psych priority questions, look for any risk of harm to self or others; that client comes before comfort or information needs."], "st": "awaiting"}, {"id": "ngn:sa-psych-1", "hash": "479de9f201", "title": "Responding to adolescent self-harm · Take action", "body": ["A 16-year-old on the adolescent psych unit, admitted after cutting her forearms, tells the nurse, \"Nobody gets it. My parents think I'm doing this for attention.\"", "", "For each nurse response, indicate whether it is therapeutic or nontherapeutic.", "", "- \"It sounds like you feel your parents don't understand what you're going through.\" → Therapeutic", "  Reflecting her feelings shows the nurse is listening and invites her to say more.", "- \"Why do you cut yourself?\" → Nontherapeutic", "  Why questions demand a justification and make clients defensive. An open-ended question about the experience works better.", "- \"Tell me what usually happens right before you cut.\" → Therapeutic", "  This broad opening explores triggers and feelings without judgment, which guides safety planning.", "- \"I'm sure your parents love you and want what's best for you.\" → Nontherapeutic", "  False reassurance dismisses her feelings and takes the parents' side. It shuts down the conversation.", "- \"When I was your age, I felt the same way about my parents.\" → Nontherapeutic", "  This shifts the focus to the nurse. Self-disclosure that moves attention away from the client is nontherapeutic.", "- \"I'd like to sit with you for a while.\" → Therapeutic", "  Offering self conveys acceptance and presence, which builds trust with a client who feels unheard.", "", "Why: Therapeutic responses keep the focus on the client's feelings: reflecting, open-ended exploring and offering presence. Why questions, false reassurance and self-focused stories block communication. With self-harm, understanding triggers is also part of the safety assessment.", "Tip: Pick the response that keeps the focus on the client's feelings and invites more talk; avoid why, reassurance and advice."], "st": "awaiting"}]}, "packs": [{"id": "drill-med-1", "title": "Drills: Med Pass, part 1 of 2", "sub": "What to check before a medication, then give, hold or call. A pharmacist is especially welcome.", "n": 25, "reviewed": 0, "changed": 0}, {"id": "drill-med-2", "title": "Drills: Med Pass, part 2 of 2", "sub": "What to check before a medication, then give, hold or call. A pharmacist is especially welcome.", "n": 25, "reviewed": 0, "changed": 0}, {"id": "drill-first-1", "title": "Drills: Who's First, part 1 of 2", "sub": "Four patients, one nurse: who do you see first, and why not the others.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "drill-first-2", "title": "Drills: Who's First, part 2 of 2", "sub": "Four patients, one nurse: who do you see first, and why not the others.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "drill-sbar", "title": "Drills: SBAR", "sub": "Building a call to the provider line by line, and the order that comes back.", "n": 20, "reviewed": 0, "changed": 0}, {"id": "drill-calm", "title": "Drills: De-escalation", "sub": "What to say to an agitated patient, turn by turn. Psych or ED experience fits best.", "n": 22, "reviewed": 0, "changed": 0}, {"id": "ngn-shift-1", "title": "NCLEX questions after each shift, part 1 of 3", "sub":
