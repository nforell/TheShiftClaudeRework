<style>
:root{--bg:#E6EDF0;--surface:#FBFCFC;--surface-2:#EDF2F4;--ink:#152238;--ink-2:#4D5A6F;--line:#CAD5DB;--teal:#2449A8;--teal-ink:#fff;--red:#B3342B;--red-bg:#F8E1DE;--good:#2B7249;--good-bg:#E0F0E6;--amber:#A96C0E;--amber-bg:#FBEFD6;
  --serif:"Barlow Condensed","Arial Narrow",sans-serif;--sans:"Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161C;--surface:#1A1F27;--surface-2:#212833;--ink:#E7E4DB;--ink-2:#A0A5AE;--line:#343C48;--teal:#93B4E4;--teal-ink:#0F1B2C;--red:#F0766B;--red-bg:#3b1d1b;--good:#72c692;--good-bg:#16301f;--amber:#E9AE4E;--amber-bg:#35291a}}
:root[data-theme="dark"]{--bg:#12161C;--surface:#1A1F27;--surface-2:#212833;--ink:#E7E4DB;--ink-2:#A0A5AE;--line:#343C48;--teal:#93B4E4;--teal-ink:#0F1B2C;--red:#F0766B;--red-bg:#3b1d1b;--good:#72c692;--good-bg:#16301f;--amber:#E9AE4E;--amber-bg:#35291a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
main{max-width:52rem;margin:0 auto;padding:clamp(1.2rem,5vw,3rem) 16px calc(5rem + env(safe-area-inset-bottom))}
a{color:var(--teal)}
.home{font-family:var(--serif);font-weight:700;font-size:1.1rem;letter-spacing:.04em;text-transform:uppercase;background:var(--ink);color:var(--bg);padding:.28em .55em .22em;border-radius:2px;text-decoration:none}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.9rem,6vw,2.6rem);line-height:1.1;letter-spacing:0;margin:1.6rem 0 .3rem}
h2{font-size:1.15rem;margin:2.4rem 0 .6rem}
h3{font-size:1rem;margin:0}
p{margin:.5rem 0}
.muted{color:var(--ink-2)}
.meta{display:flex;flex-wrap:wrap;gap:.4rem .6rem;margin-top:.6rem}
.chip{display:inline-flex;align-items:center;padding:.15em .6em;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--surface-2);border:1px solid var(--line)}
.chip.awaiting{background:var(--amber-bg);border-color:transparent;color:var(--amber)}
.chip.reviewed{background:var(--good-bg);border-color:transparent;color:var(--good)}
.chip.changed{background:var(--red-bg);border-color:transparent;color:var(--red)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem 1.1rem;margin:.8rem 0}
.how ol{margin:.4rem 0 0;padding-left:1.2rem}.how li{margin:.2rem 0}
label{display:block;font-weight:600;font-size:.9rem;margin:.7rem 0 .25rem}
input[type=text],input[type=email],textarea,select{width:100%;min-height:44px;padding:.5em .7em;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:5rem;resize:vertical}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:0 1rem}
details.pt{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:.6rem 0}
details.pt>summary{cursor:pointer;padding:.85rem 1rem;font-weight:600;list-style-position:inside}
details.pt>div{padding:0 1rem 1rem}
table{width:100%;border-collapse:collapse;font-size:.88rem;margin:.4rem 0}
th,td{text-align:left;vertical-align:top;padding:.35rem .5rem .35rem 0;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--ink-2);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
.scroll{overflow-x:auto}
ul.plain{margin:.3rem 0;padding-left:1.1rem}
.dec{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:.85rem 1rem;margin:.6rem 0}
.dec.pos{border-left-color:var(--good)}.dec.neg{border-left-color:var(--red)}
.dec .top{display:flex;flex-wrap:wrap;gap:.3rem .5rem;align-items:center;font-size:.78rem;color:var(--ink-2);font-weight:600}
.pts{font-weight:700;padding:.05em .45em;border-radius:4px;background:var(--surface-2)}
.pos .pts{color:var(--good);background:var(--good-bg)}.neg .pts{color:var(--red);background:var(--red-bg)}
.dec b{display:block;margin:.35rem 0 .15rem;font-size:1rem}
.dec .why{font-family:var(--sans);color:var(--ink-2);margin:0}
.dec .src{font-size:.75rem;color:var(--ink-2);margin-top:.35rem}
.verdict{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.7rem}
.verdict button{min-height:40px;padding:.35em .9em;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer}
.verdict button[aria-pressed="true"][data-v="ok"]{background:var(--good);border-color:var(--good);color:var(--teal-ink)}
.verdict button[aria-pressed="true"][data-v="fix"]{background:var(--red);border-color:var(--red);color:var(--teal-ink)}
.verdict button[aria-pressed="true"][data-v="unsure"]{background:var(--amber);border-color:var(--amber);color:var(--teal-ink)}
.dec textarea{margin-top:.5rem;min-height:3.6rem}
.opt{padding:.4rem 0;border-bottom:1px solid var(--line);font-size:.92rem}.opt:last-child{border:0}
.opt i{font-style:normal;font-weight:700;font-size:.75rem;padding:.05em .4em;border-radius:4px;margin-right:.4rem;background:var(--surface-2)}
.bar{position:sticky;top:0;z-index:5;margin:0 -16px;padding:.6rem 16px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:.6rem;font-size:.9rem}
.bar .prog{display:block;flex:1;min-width:4rem;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;max-width:12rem}.bar .prog i{display:block;height:100%;background:var(--teal)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:.55em 1.2em;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn-primary{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.row{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1rem}
.check{display:flex;gap:.6rem;align-items:flex-start;font-weight:500;margin-top:1rem}
.check input{width:1.2rem;height:1.2rem;margin-top:.2rem;flex:none}
.msg{margin-top:.8rem;font-weight:600}.msg.err{color:var(--red)}.msg.ok{color:var(--good)}
pre{white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:.8rem;font-size:.8rem;max-height:18rem;overflow:auto}
.shifts a{display:block;text-decoration:none;color:inherit}
.shifts .card:hover{border-color:var(--ink-2)}
</style>
<style>.item .body p{margin:.15rem 0}.item .body .why{color:var(--ink-2);font-size:.92rem;margin:0 0 .35rem 1.1rem}.item .body .ok b{display:inline;margin:0;color:var(--good)}.item .body .no{color:var(--ink)}.item .body .sp{height:.5rem}.item>b{margin-bottom:.5rem}</style></head>

ng is right, but choosing a new time yourself is a new order. The provider needs to know he's bradycardic and hypotensive.", "", "Why: A pulse of 52 and a systolic of 94 are under the usual hold lines. Another dose slows him further.", "Pearl: Beta blocker: pulse and pressure first. Under 60 or a systolic under 100, hold and report."], "st": "awaiting"}, {"id": "drill:mp-digoxin", "hash": "221bdf1b39", "title": "Digoxin 0.125 mg PO: Ruth Abernathy, 84", "body": ["For: Atrial fibrillation", "She skipped breakfast. \"My stomach is off, and the lights look fuzzy.\"", "", "✓ Check first: Apical pulse for a full minute → Apical 54, irregular.", "- ✗ Sitting blood pressure (BP 128/76.)", "- ✗ Morning potassium level (K 3.9.)", "", "✓ Then: Hold it and report possible toxicity", "- ✗ Hold it, recount in an hour, and give it if the pulse is over 60", "  Why not: Nausea and vision changes point to toxicity whatever the next pulse is. She needs a level and the provider, not a delayed dose.", "- ✗ Give it and ask for a digoxin level with the morning labs", "  Why not: If she's toxic, this dose adds to it. The level comes before the next dose, not after.", "", "Why: Slow pulse, nausea and blurry or halo vision together point to digoxin toxicity, which is common in frail older adults.", "Pearl: Digoxin: count the apical pulse for a full minute. Under 60, or nausea and vision changes, hold and ask for a level and a potassium."], "st": "awaiting"}, {"id": "drill:mp-furosemide-k", "hash": "e1dfbcbe68", "title": "Furosemide 40 mg IV: Gloria Vance, 66", "body": ["For: Fluid overload", "Her ankles are still swollen. Morning labs just posted.", "", "✓ Check first: Potassium → K 3.1. Low.", "- ✗ Daily weight (Down 0.6 kg since yesterday.)", "- ✗ Heart rate (HR 84, regular.)", "", "✓ Then: Call the provider about the potassium before the dose", "- ✗ Give it and recheck her potassium in the morning", "  Why not: The furosemide will push 3.1 lower tonight. Waiting for morning labs leaves her open to an arrhythmia overnight.", "- ✗ Hold it and recheck the potassium in 4 hours", "  Why not: Holding without telling anyone leaves her overloaded and her potassium untreated. The provider has to adjust both.", "", "Why: Furosemide pulls potassium out with the water. At 3.1 another dose can tip her into an arrhythmia. The provider may replace potassium and still diurese.", "Pearl: Loop diuretics waste potassium. A low K gets reported before the dose, not after the run of PVCs."], "st": "awaiting"}, {"id": "drill:mp-lispro-low", "hash": "f11f3da474", "title": "Insulin lispro 6 units SubQ: Grace Okafor, 46", "body": ["For: Mealtime insulin", "Her tray is here. She says she feels shaky and a bit sweaty.", "", "✓ Check first: Fingerstick glucose → Glucose 64.", "- ✗ Last A1c (A1c 9.8% last month.)", "- ✗ Her carbohydrate count for breakfast (About 60 g on the tray.)", "", "✓ Then: Hold it, give 15 g of fast sugar, recheck in 15 minutes", "- ✗ Give 15 g of fast sugar, then give the insulin once she starts eating", "  Why not: Treat the low, then recheck in 15 minutes. Mealtime insulin waits until she's back in range, and the provider should know she went low.", "- ✗ Hold the insulin and have her eat her breakfast tray", "  Why not: Holding is right, but a meal tray is slow sugar. With symptoms at 64 she needs 15 g of fast sugar now and a recheck in 15 minutes.", "", "Why: She is already low and has symptoms. Rapid-acting insulin on top of 64 drives her lower before the food absorbs.", "Pearl: Rule of 15: 15 grams of fast sugar, recheck in 15 minutes. No mealtime insulin into a low. Tell the provider."], "st": "awaiting"}, {"id": "drill:mp-warfarin", "hash": "b0c51309a5", "title": "Warfarin 5 mg PO: Henry Ballard, 77", "body": ["For: Atrial fibrillation", "He mentions his gums bled when he brushed this morning.", "", "✓ Check first: INR → INR 4.6.", "- ✗ Platelets (Platelets 210,000.)", "- ✗ Hemoglobin (12.8, stable.)", "", "✓ Then: Hold it and tell the provider", "- ✗ Give half the dose and recheck the INR tomorrow", "  Why not: Changing a warfarin dose is the prescriber's call. At 4.6 with new bleeding, hold and report.", "- ✗ Hold it and recheck the INR tomorrow", "  Why not: Holding is right, but a high INR with new bleeding needs the provider today. They may want vitamin K or a bleeding workup.", "", "Why: For atrial fibrillation the target INR is 2 to 3. At 4.6 with new bleeding, another dose raises his risk of a serious bleed.", "Pearl: Warfarin: check the INR every time. Above range, hold and report. Vitamin K is the provider's call, not a nursing add-on."], "st": "awaiting"}, {"id": "drill:mp-enox-hit", "hash": "5fcf8d7639", "title": "Enoxaparin 40 mg SubQ: Darnell Price, 59", "body": ["For: Clot prevention", "Day 6. He was on a heparin drip before surgery. His left calf is new and sore.", "", "✓ Check first: Platelets, compared with admission → 82,000. It was 230,000 on admission.", "- ✗ Creatinine and kidney function (Creatinine 0.9. Normal.)", "- ✗ Calf circumference, both legs (Left calf 2 cm bigger than the right.)", "", "✓ Then: Hold it, stop all heparin, call now", "- ✗ Hold the enoxaparin but keep the heparin flushes in his IV", "  Why not: Even small heparin flushes keep HIT going. All heparin stops, flushes included.", "- ✗ Hold it and ask for a leg ultrasound before deciding", "  Why not: The ultrasound is reasonable, but a halved platelet count after heparin is HIT until proven otherwise. He needs a non-heparin anticoagulant now; waiting leaves the clot untreated.", "", "Why: A platelet drop of more than half, 5 to 10 days after heparin, with a new clot, is heparin-induced thrombocytopenia until proven otherwise.", "Pearl: HIT: platelets fall and clots form. Stop all heparin, including flushes and enoxaparin, and call. He needs a non-heparin anticoagulant."], "st": "awaiting"}, {"id": "drill:mp-ace-angio", "hash": "7e99c5a10e", "title": "Lisinopril 10 mg PO: Leticia Moore, 54", "body": ["For: Blood pressure", "She started it yesterday. She sounds a little thick when she says good morning.", "", "✓ Check first: Look at her face and mouth → Her lips and tongue are swollen.", "- ✗ Blood pressure before the dose (BP 144/88.)", "- ✗ When she last took it (Yesterday at 09:00, her first dose.)", "", "✓ Then: Hold it, stay with her, call rapid response", "- ✗ Hold it, give the PRN diphenhydramine, and recheck in 30 minutes", "  Why not: ACE-inhibitor angioedema comes from bradykinin, not histamine, so antihistamines don't reliably help. A swelling tongue needs the team now.", "- ✗ Hold it and ask the prescriber to switch her to an ARB", "  Why not: Switching drugs is a later question. Right now her airway is the problem.", "", "Why: Lip and tongue swelling on an ACE inhibitor is angioedema. It can close the airway, and antihistamines don't reliably stop it.", "Pearl: ACE inhibitor plus facial or tongue swelling: never the next dose. Airway first, get help, and list it as an allergy."], "st": "awaiting"}, {"id": "drill:mp-morphine-sed", "hash": "fe7e8401bf", "title": "Morphine 4 mg IV, as needed: Marcus Bell, 58", "body": ["For: Severe pain", "His wife says he asked for pain medicine. He has sleep apnea.", "", "✓ Check first: Sedation and breathing → Drifts off mid-sentence. RR 9. SpO₂ 89%.", "- ✗ Pain score (He mumbles \"eight\" and closes his eyes.)", "- ✗ Time of his last opioid dose (Oxycodone 10 mg at 04:30.)", "", "✓ Then: Hold it, rouse him, CPAP on, tell the provider", "- ✗ Give half the dose and recheck his sedation in 30 minutes", "  Why not: He's already falling asleep mid-sentence. Any opioid now deepens it.", "- ✗ Hold it and give naloxone right away", "  Why not: He rouses to voice. Wake him, get his CPAP on and call; naloxone is for a patient you can't rouse or whose breathing stays slow, and it takes away all his pain control.", "", "Why: Drifting off mid-sentence is sedation level 3. Sedation comes before the breathing stops, and sleep apnea makes it worse.", "Pearl: Sedation comes before respiratory depression. A sleepy patient on opioids gets assessed, not dosed."], "st": "awaiting"}, {"id": "drill:mp-kcl", "hash": "b21f4c8662", "title": "Potassium chloride 10 mEq IV: Imani Shaw, 38", "body": ["For: K 3.2", "A small premixed bag. Pharmacy sent it up. She's been vomiting for two days.", "", "✓ Check first: Urine output → 240 mL over the last 6 hours.", "- ✗ Glucose (96.)", "- ✗ Magnesium level (Mg 2.0.)", "", "✓ Then: Run it on a pump, no faster than 10 mEq an hour", "- ✗ Run it over 30 minutes so it's in before her next lab draw", "  Why not: That's 20 mEq an hour, double the usual limit through a peripheral IV on a regular floor. Faster potassium risks arrhythmia and burns the vein.", "- ✗ Hold it until her vomiting stops", "  Why not: Vomiting is why she's losing potassium. With urine flowing, replace it now.", "", "Why: Her kidneys are making urine, so it's safe to replace. IV potassium is never pushed: a bolus can stop the heart.", "Pearl: Never push potassium. Check that urine is flowing, then pump it, usually 10 mEq an hour or slower on a regular floor."], "st": "awaiting"}, {"id": "drill:mp-lithium", "hash": "39712d2183", "title": "Lithium carbonate 300 mg PO: Daniel Kim, 33", "body": ["For: Bipolar disorder", "He calls it a stomach bug: two days of diarrhea. His hand shakes holding the cup.", "", "✓ Check first: Lithium level and how he looks → Level 1.8. Coarse tremor. Slow to answer.", "- ✗ Blood pressure, sitting (BP 118/74.)", "- ✗ Morning sodium level (Na 134.)", "", "✓ Then: Hold it and call for a medical evaluation", "- ✗ Hold this dose, push fluids, and give it tonight", "  Why not: Fluids alone won't fix a level of 1.8 with neuro signs. He needs a medical evaluation, and the next dose waits for the prescriber.", "- ✗ Give it and recheck the level in the morning", "  Why not: At 1.8 with a coarse tremor and slowed thinking, another dose can push him toward seizures.", "", "Why: Fluid loss raises lithium levels. 1.8 with a coarse tremor and slowed thinking is toxicity, and it can progress to seizures.", "Pearl: Lithium works in a narrow range, about 0.6 to 1.2. Vomiting, diarrhea, coarse tremor or confusion: hold and get a level."], "st": "awaiting"}, {"id": "drill:mp-clozapine", "hash": "2f4812229b", "title": "Clozapine 100 mg PO: Theo Grant, 41", "body": ["For: Schizophrenia", "He says his throat has been sore since yesterday.", "", "✓ Check first: Absolute neutrophil count → ANC 800.", "- ✗ Heart rate, counted for a minute (HR 98.)", "- ✗ When he last had a bowel movement (Yesterday.)", "", "✓ Then: Hold it and call now", "- ✗ Hold it and recheck the ANC tomorrow", "  Why not: Holding is right, but a sore throat with an ANC of 800 could be the start of a serious infection. The prescriber needs to know today.", "- ✗ Give it and ask for a throat swab", "  Why not: With an ANC under 1,000, clozapine is interrupted. The swab is reasonable; the dose isn't.", "", "Why: An ANC under 1,000 is moderate neutropenia; clozapine is interrupted. A sore throat could be the first sign of a serious infection.", "Pearl: Clozapine: check the ANC before the dose. Fever, sore throat or flu-like symptoms are urgent until proven otherwise."], "st": "awaiting"}, {"id": "drill:mp-levo", "hash": "33816037fb", "title": "Levothyroxine 75 mcg PO: Priya Raman, 62", "body": ["For: Hypothyroidism", "06:00. She takes calcium and iron with breakfast at home.", "", "✓ Check first: When she last ate → Nothing since 21:00. Breakfast comes at 07:30.", "- ✗ Her last TSH result (Last month: in range.)", "- ✗ Resting heart rate (HR 76.)", "", "✓ Then: Give it now with a full glass of water", "- ✗ Give it with breakfast at 07:30 so it won't upset her stomach", "  Why not: Food cuts absorption. It goes on an empty stomach, 30 to 60 minutes before breakfast.", "- ✗ Give it now along with her morning calcium", "  Why not: Calcium binds levothyroxine. Separate them by at least 4 hours.", "", "Why: Levothyroxine absorbs best on an empty stomach, 30 to 60 minutes before food, and at least 4 hours apart from calcium or iron.", "Pearl: Not every check ends in a hold. When it's safe and timed right, give it on time."], "st": "awaiting"}, {"id": "drill:mp-apap-max", "hash": "4c900707f9", "title": "Acetaminophen 1,000 mg PO, scheduled: Frank Delgado, 68", "body": ["For: Post-op pain", "Due at 12:00. He also has hydrocodone-acetaminophen ordered for breakthrough pain.", "", "✓ Check first: Every acetaminophen since midnight → 1 g at 00:00 and 06:00, plus 2 hydrocodone-acetaminophen tablets (325 mg each) at 04:00 and 10:00. Total 3.3 g.", "- ✗ Pain score, at rest and moving (Pain 4 of 10.)", "- ✗ Yesterday's liver enzymes (Normal yesterday.)", "", "✓ Then: Hold it and ask for the orders to be adjusted", "- ✗ Give it and tell the next nurse to skip his 16:00 hydrocodone", "  Why not: This dose alone puts him at 4.3 g today. The fix is new orders, not a handoff note.", "- ✗ Give 650 mg instead of 1,000", "  Why not: That's still 3.95 g today, right at the adult limit and above many hospitals' limit for older adults. Changing a dose is the prescriber's decision.", "", "Why: Another gram makes 4.3 g today. Adults shouldn't exceed 4 g a day, and many hospitals cap older adults lower.", "Pearl: Count every acetaminophen, including combination pills. Adults: no more than 4 g a day, often less in older adults and liver disease."], "st": "awaiting"}, {"id": "drill:mp-pcn", "hash": "b29286e86e", "title": "Amoxicillin 500 mg PO: Olivia Hart, 29", "body": ["For: Ear infection", "A new order. She says she's allergic \"to something, a penicillin maybe.\"", "", "✓ Check first: Her allergy band and chart → Penicillin: hives and throat tightness.", "- ✗ Her temperature right now (38.1.)", "- ✗ When her ear pain started (Three days ago, worse at night.)", "", "✓ Then: Hold it and call for a different antibiotic", "- ✗ Give it. Amoxicillin isn't a true penicillin", "  Why not: Amoxicillin is a penicillin (an aminopenicillin), so her reaction applies.", "- ✗ Give it after premedicating with diphenhydramine", "  Why not: Premedicating doesn't prevent anaphylaxis. With throat tightness last time, it isn't given at all.", "", "Why: Amoxicillin is a penicillin. Throat tightness last time means this could be anaphylaxis.", "Pearl: Match the allergy to the drug class, not just the name. Ask what happened last time."], "st": "awaiting"}, {"id": "drill:mp-two-ids", "hash": "1416ad2cfa", "title": "Oxycodone 5 mg PO: Kenneth Lee, 66", "body": ["For: Pain", "Room 302, bed B. You say \"Mr. Lee?\" and he says \"Yep, that's me.\"", "", "✓ Check first: His name and birth date, from him, against the band and MAR → He says \"Kevin Lee, March 4, 1961.\" Your MAR is Kenneth Lee, 1958.", "- ✗ The room and bed number on the door, against the MAR (Room 302, bed B.)", "- ✗ How he rates his pain right now (Pain 6.)", "", "✓ Then: Don't give it. Sort out the mix-up first", "- ✗ Recheck the room and bed against the MAR, then give it", "  Why not: Room and bed are locations, not identifiers. Two identifiers he stated already disagree with the MAR.", "- ✗ Give it, then report the band mix-up", "  Why not: Wrong patient: Kevin has never had opioids. Sort out who he is before anything is given.", "", "Why: Two Mr. Lees on the unit. A room number and a yes are not identifiers. The patient states them; you match them.", "Pearl: Two identifiers, said by the patient, matched to the band and the MAR. Every time."], "st": "awaiting"}, {"id": "drill:mp-spiro", "hash": "3db0c84cdf", "title": "Spironolactone 25 mg PO: Mae Collins, 73", "body": ["For: Heart failure", "She's also on lisinopril. She says her legs feel heavy.", "", "✓ Check first: Potassium → K 5.9.", "- ✗ Blood pressure (BP 122/70.)", "- ✗ Creatinine (1.6, up from 1.3.)", "", "✓ Then: Hold it and call. Ask for an ECG", "- ✗ Hold the spironolactone but give the lisinopril", "  Why not: Lisinopril raises potassium too. At 5.9 both wait for the provider.", "- ✗ Hold it and recheck the potassium in the morning", "  Why not: A potassium of 5.9 with weakness needs an ECG and treatment now, not tomorrow.", "", "Why: Spironolactone keeps potassium, and so does lisinopril. At 5.9 with weakness, she needs an ECG and treatment, not more.", "Pearl: Potassium-sparing diuretics, ACE inhibitors and ARBs raise K. Above about 5.0, hold and report; high K plus weakness gets an ECG."], "st": "awaiting"}, {"id": "drill:mp-nitro-pde5", "hash": "6d4984df6f", "title": "Nitroglycerin 0.4 mg SL: Walter Ames, 63", "body": ["For: Chest pain", "Chest pressure, 5 of 10. The ECG is done and the team is on the way.", "", "✓ Check first: Ask about erectile dysfunction medicines → He took sildenafil at 22:00 last night.", "- ✗ Blood pressure in both arms, sitting up (BP 132/80.)", "- ✗ Heart rate and rhythm on the monitor (HR 88.)", "", "✓ Then: Hold the nitro and tell the provider", "- ✗ Give it, since his systolic is over 100", "  Why not: Blood pressure is only half the check. Sildenafil in the last 24 hours makes nitrates dangerous at any starting pressure.", "- ✗ Give it and have IV fluids ready in case his pressure drops", "  Why not: Preparing for the drop you expect isn't a reason to cause it.", "", "Why: Sildenafil within 24 hours (tadalafil within 48) plus nitrates can drop the pressure dangerously low.", "Pearl: Before nitro: blood pressure, and ask about sildenafil, vardenafil or tadalafil. Men often don't list them."], "st": "awaiting"}, {"id": "drill:mp-glargine", "hash": "3abf2b35d8", "title": "Insulin glargine 20 units SubQ: Rafael Soto, 50", "body": ["For: Type 2 diabetes, bedtime basal", "21:00. He ate most of his dinner.", "", "✓ Check first: Fingerstick glucose → Glucose 182.", "- ✗ Evening potassium level (K 4.1.)", "- ✗ Blood pressure (BP 130/78.)", "", "✓ Then: Give the full dose", "- ✗ Give half the dose, since he'll be fasting overnight", "  Why not: Basal insulin covers the body's overnight needs. At 182 the full dose is right, and changing it is the prescriber's call.", "- ✗ Give it, plus correction lispro for the 182", "  Why not: Correction insulin at bedtime raises the risk of overnight lows, and it wasn't ordered for bedtime. Give what's ordered.", "", "Why: Basal insulin covers the body's background needs through the night. 182 is safe; holding it sets him up for a high morning.", "Pearl: Don't hold basal insulin because a meal was small. Hold for a low, and call."], "st": "awaiting"}, {"id": "drill:mp-lasix-give", "hash": "0468548608", "title": "Furosemide 40 mg PO: Beatrice Lowell, 79", "body": ["For: Heart failure", "Crackles at both bases. Up 1.5 kg since yesterday. She asks if she can skip it so she isn't up all night.", "", "✓ Check first: Potassium and blood pressure → K 4.2. BP 128/74.", "- ✗ Temperature, since she has crackles (36.9.)", "- ✗ Fingerstick glucose (104.)", "", "✓ Then: Give it now, and explain why the timing helps", "- ✗ Respect her wish: hold it and chart her refusal", "  Why not: She hasn't refused; she asked a question. Explain the timing first, then let her decide.", "- ✗ Move it to 14:00 so she's less bothered this morning", "  Why not: Changing the time is a new order, and she's gaining fluid now.", "", "Why: The numbers are safe and she is gaining fluid. Giving it in the morning means she's done urinating by evening.", "Pearl: When the numbers are safe, give it on time. Explain before you accept a refusal; she may just need the reason."], "st": "awaiting"}, {"id": "drill:mp-peds-apap", "hash": "5e8eb957d8", "title": "Acetaminophen 15 mg/kg PO (160 mg/5 mL): Leo Ferris, 20 mos", "body": ["For: Fever", "A 20-month-old. The syringe on the counter reads 15 mL.", "", "✓ Check first: Weight in kilograms → 10 kg. 15 mg/kg is 150 mg, which is 4.7 mL.", "- ✗ Temperature, rechecked now (38.9.)", "- ✗ Last dose time (None today.)", "", "✓ Then: Discard it and draw up 4.7 mL", "- ✗ Give the 15 mL; pharmacy verified it", "  Why not: Pharmacy can make errors too. The final check is yours, at the bedside.", "- ✗ Give 5 mL, the usual dose for a toddler", "  Why not: 5 mL is 160 mg, a little over his 150 mg, and there's no \"usual\" toddler dose. Always calculate by weight.", "", "Why: 15 mL is 480 mg, three times his dose. Someone wrote the mg/kg number as millilitres.", "Pearl: Kids: dose by weight in kilograms, every time. Then check that the volume makes sense for the size of the child."], "st": "awaiting"}, {"id": "drill:mp-heparin-xa", "hash": "16c5bb64f9", "title": "Heparin infusion, continue current rate: Helen Brandt, 69", "body": ["For: Pulmonary embolism", "The 6-hour level just posted. She mentions her gums bled when she brushed.", "", "✓ Check first: Anti-Xa level against the protocol goal → Anti-Xa 0.95. The goal is 0.3 to 0.7.", "- ✗ Blood pressure and heart rate now (BP 128/74.)", "- ✗ Oxygen saturation on room air (SpO₂ 95% on room air.)", "", "✓ Then: Pause and lower the rate per the protocol, check for bleeding, report", "- ✗ Keep the rate and recheck the level in 6 hours", "  Why not: Above goal with bleeding needs the protocol's pause and rate change now, not another level at the same rate.", "- ✗ Stop the infusion and ask for protamine", "  Why not: Protamine is for major bleeding. Gum bleeding with a high level is handled by the protocol.", "", "Why: Her level is above the goal and she is bleeding from her gums. The heparin protocol tells you how long to pause and how much to lower the rate.", "Pearl: Heparin drips run on the protocol. Above goal: pause and lower as written, look for bleeding, recheck on time. A bolus is only for a level under goal."], "st": "awaiting"}, {"id": "drill:mp-lispro-npo", "hash": "18978832d3", "title": "Insulin lispro 8 units SubQ, with breakfast: Arturo Medina, 61", "body": ["For: Type 2 diabetes", "He's going to the OR at 10:00 for a hernia repair.", "", "✓ Check first: His diet order today → Nothing by mouth since midnight. No tray is coming.", "- ✗ His A1c from this admission (A1c 8.1%.)", "- ✗ His morning potassium (K 4.2.)", "", "✓ Then: Hold the mealtime dose, check his glucose, ask about his basal dose", "- ✗ Give it and ask for a dextrose infusion to cover it", "  Why not: That treats a problem you created. No meal, no mealtime insulin.", "- ✗ Give half to cover stress hyperglycemia before surgery", "  Why not: High glucose from stress is covered by correction insulin, if ordered, not by mealtime insulin.", "", "Why: Mealtime insulin covers a meal. With no meal, it only drops his glucose, and he will be under anesthesia where nobody can see the symptoms.", "Pearl: Mealtime insulin follows the meal. NPO? Hold it, check glucose often, and ask what to do with the long-acting dose."], "st": "awaiting"}, {"id": "drill:mp-dilt-push", "hash": "e98fb46d25", "title": "Diltiazem 10 mg IV push: Carol Pierce, 74", "body": ["For: Atrial fibrillation, rate 138", "Ordered for her fast rate. She says she feels lightheaded.", "", "✓ Check first: Blood pressure → BP 84/52.", "- ✗ Potassium (K 4.1.)", "- ✗ Last bowel movement (This morning.)", "", "✓ Then: Hold it and call. She is already hypotensive", "- ✗ Give it slowly over 5 minutes to soften the drop", "  Why not: A slower push doesn't change the fact she's already hypotensive.", "- ✗ Give a fluid bolus, then the diltiazem", "  Why not: A bolus may well be part of the plan, but that's the provider's decision. A fast rate with a low pressure needs them now.", "", "Why: Diltiazem lowers blood pressure as well as heart rate. With a systolic of 84 and dizziness, it could drop her pressure much further.", "Pearl: Calcium channel blockers and beta blockers for rate control: check the blood pressure first. Hypotension plus a fast rate needs a provider now, not a push."], "st": "awaiting"}, {"id": "drill:mp-oxy-er", "hash": "bc07ff86a4", "title": "Oxycodone ER 10 mg PO: Walter Grimes, 80", "body": ["For: Chronic back pain", "After his stroke he can't swallow whole pills. You were about to crush it into applesauce.", "", "✓ Check first: Whether this tablet can be crushed → Extended release. The label says do not crush.", "- ✗ His pain score at rest and moving (Pain 5.)", "- ✗ His blood pressure (BP 142/80.)", "", "✓ Then: Don't crush it. Ask for a form he can take safely", "- ✗ Cut it in half and give both halves in applesauce", "  Why not: Cutting breaks the extended-release design just like crushing does.", "- ✗ Give it whole in applesauce", "  Why not: He can't safely swallow whole pills after his stroke. That's an aspiration risk.", "", "Why: Crushing an extended-release opioid releases the whole 12-hour dose at once. That can stop his breathing.", "Pearl: ER, XR, SR, LA, CR: never crush, cut or chew unless the label says you can. Ask pharmacy for another form."], "st": "awaiting"}, {"id": "drill:mp-tramadol-ss", "hash": "2e97ce8775", "title": "Tramadol 50 mg PO, as needed: Diane Kowalski, 52", "body": ["For: Pain after surgery", "She takes sertraline at home. She's sweating, restless, and her legs keep jerking.", "", "✓ Check first: Temperature, heart rate and a neuro check → T 38.6, HR 122. Twitching that keeps going when you tap her ankle (clonus).", "- ✗ Pain score and where it hurts most (Pain 6.)", "- ✗ Her morning potassium level (K 3.9.)", "", "✓ Then: Hold it. Report possible serotonin syndrome", "- ✗ Give it, then recheck her temperature in an hour", "  Why not: Tramadol adds to the serotonin load that's causing the fever and clonus.", "- ✗ Hold the tramadol and give acetaminophen for the fever", "  Why not: Holding is right, but this is a possible drug toxicity and needs the provider now, not just a fever treatment.", "", "Why: Tramadol raises serotonin, and so does sertraline. Fever, a fast pulse, sweating and clonus point to serotonin syndrome. More tramadol makes it worse.", "Pearl: Serotonin syndrome: agitation, sweating, fever, fast heart, clonus. Common culprits with SSRIs: tramadol, linezolid, triptans, ondansetron in high doses. Stop the drug and call."], "st": "awaiting"}]}, "packs": [{"id": "drill-med-1", "title": "Drills: Med Pass, part 1 of 2", "sub": "What to check before a medication, then give, hold or call. A pharmacist is especially welcome.", "n": 25, "reviewed": 0, "changed": 0}, {"id": "drill-med-2", "title": "Drills: Med Pass, part 2 of 2", "sub": "What to check before a medication, then give, hold or call. A pharmacist is especially welcome.", "n": 25, "reviewed": 0, "changed": 0}, {"id": "drill-first-1", "title": "Drills: Who's First, part 1 of 2", "sub": "Four patients, one nurse: who do you see first, and why not the others.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "drill-first-2", "title": "Drills: Who's First, part 2 of 2", "sub": "Four patients, one nurse: who do you see first, and why not the others.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "drill-sbar", "title": "Drills: SBAR", "sub": "Building a call to the provider line by line, and the order that comes back.", "n": 20, "reviewed": 0, "changed": 0}, {"id": "drill-calm", "title": "Drills: De-escalation", "sub": "What to say to an agitated patient, turn by turn. Psych or ED experience fits best.", "n": 22, "reviewed": 0, "changed": 0}, {"id": "ngn-shift-1", "title": "NCLEX questions after each shift, part 1 of 3", "sub": "Five per shift, including the two harder NCLEX challenge items.", "n": 19, "reviewed": 0, "changed": 0}, {"id": "ngn-shift-2", "title": "NCLEX questions after each shift, part 2 of 3", "sub": "Five per shift, including the two harder NCLEX challenge items.", "n": 19, "reviewed": 0, "changed": 0}, {"id": "ngn-shift-3", "title": "NCLEX questions after each shift, part 3 of 3", "sub": "Five per shift, including the two harder NCLEX challenge items.", "n": 17, "reviewed": 0, "changed": 0}, {"id": "bank-ms-1", "title": "NCLEX question bank: Medical-surgical, part 1 of 3", "sub": "68 standalone practice questions.", "n": 23, "reviewed": 0, "changed": 0}, {"id": "bank-ms-2",
