<style>
:root{--bg:#E6EDF0;--surface:#FBFCFC;--surface-2:#EDF2F4;--ink:#152238;--ink-2:#4D5A6F;--line:#CAD5DB;--teal:#2449A8;--teal-ink:#fff;--red:#B3342B;--red-bg:#F8E1DE;--good:#2B7249;--good-bg:#E0F0E6;--amber:#A96C0E;--amber-bg:#FBEFD6;
  --serif:"Barlow Condensed","Arial Narrow",sans-serif;--sans:"Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161C;--surface:#1A1F27;--surface-2:#212833;--ink:#E7E4DB;--ink-2:#A0A5AE;--line:#343C48;--teal:#93B4E4;--teal-ink:#0F1B2C;--red:#F0766B;--red-bg:#3b1d1b;--good:#72c692;--good-bg:#16301f;--amber:#E9AE4E;--amber-bg:#35291a}}
:root[data-theme="dark"]{--bg:#12161C;--surface:#1A1F27;--surface-2:#212833;--ink:#E7E4DB;--ink-2:#A0A5AE;--line:#343C48;--teal:#93B4E4;--teal-ink:#0F1B2C;--red:#F0766B;--red-bg:#3b1d1b;--good:#72c692;--good-bg:#16301f;--amber:#E9AE4E;--amber-bg:#35291a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
main{max-width:52rem;margin:0 auto;padding:clamp(1.2rem,5vw,3rem) 16px calc(5rem + env(safe-area-inset-bottom))}
a{color:var(--teal)}
.home{font-family:var(--serif);font-weight:700;font-size:1.1rem;letter-spacing:.04em;text-transform:uppercase;background:var(--ink);color:var(--bg);padding:.28em .55em .22em;border-radius:2px;text-decoration:none}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.9rem,6vw,2.6rem);line-height:1.1;letter-spacing:0;margin:1.6rem 0 .3rem}
h2{font-size:1.15rem;margin:2.4rem 0 .6rem}
h3{font-size:1rem;margin:0}
p{margin:.5rem 0}
.muted{color:var(--ink-2)}
.meta{display:flex;flex-wrap:wrap;gap:.4rem .6rem;margin-top:.6rem}
.chip{display:inline-flex;align-items:center;padding:.15em .6em;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--surface-2);border:1px solid var(--line)}
.chip.awaiting{background:var(--amber-bg);border-color:transparent;color:var(--amber)}
.chip.reviewed{background:var(--good-bg);border-color:transparent;color:var(--good)}
.chip.changed{background:var(--red-bg);border-color:transparent;color:var(--red)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem 1.1rem;margin:.8rem 0}
.how ol{margin:.4rem 0 0;padding-left:1.2rem}.how li{margin:.2rem 0}
label{display:block;font-weight:600;font-size:.9rem;margin:.7rem 0 .25rem}
input[type=text],input[type=email],textarea,select{width:100%;min-height:44px;padding:.5em .7em;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:5rem;resize:vertical}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:0 1rem}
details.pt{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:.6rem 0}
details.pt>summary{cursor:pointer;padding:.85rem 1rem;font-weight:600;list-style-position:inside}
details.pt>div{padding:0 1rem 1rem}
table{width:100%;border-collapse:collapse;font-size:.88rem;margin:.4rem 0}
th,td{text-align:left;vertical-align:top;padding:.35rem .5rem .35rem 0;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--ink-2);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
.scroll{overflow-x:auto}
ul.plain{margin:.3rem 0;padding-left:1.1rem}
.dec{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:.85rem 1rem;margin:.6rem 0}
.dec.pos{border-left-color:var(--good)}.dec.neg{border-left-color:var(--red)}
.dec .top{display:flex;flex-wrap:wrap;gap:.3rem .5rem;align-items:center;font-size:.78rem;color:var(--ink-2);font-weight:600}
.pts{font-weight:700;padding:.05em .45em;border-radius:4px;background:var(--surface-2)}
.pos .pts{color:var(--good);background:var(--good-bg)}.neg .pts{color:var(--red);background:var(--red-bg)}
.dec b{display:block;margin:.35rem 0 .15rem;font-size:1rem}
.dec .why{font-family:var(--sans);color:var(--ink-2);margin:0}
.dec .src{font-size:.75rem;color:var(--ink-2);margin-top:.35rem}
.verdict{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.7rem}
.verdict button{min-height:40px;padding:.35em .9em;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer}
.verdict button[aria-pressed="true"][data-v="ok"]{background:var(--good);border-color:var(--good);color:var(--teal-ink)}
.verdict button[aria-pressed="true"][data-v="fix"]{background:var(--red);border-color:var(--red);color:var(--teal-ink)}
.verdict button[aria-pressed="true"][data-v="unsure"]{background:var(--amber);border-color:var(--amber);color:var(--teal-ink)}
.dec textarea{margin-top:.5rem;min-height:3.6rem}
.opt{padding:.4rem 0;border-bottom:1px solid var(--line);font-size:.92rem}.opt:last-child{border:0}
.opt i{font-style:normal;font-weight:700;font-size:.75rem;padding:.05em .4em;border-radius:4px;margin-right:.4rem;background:var(--surface-2)}
.bar{position:sticky;top:0;z-index:5;margin:0 -16px;padding:.6rem 16px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:.6rem;font-size:.9rem}
.bar .prog{display:block;flex:1;min-width:4rem;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;max-width:12rem}.bar .prog i{display:block;height:100%;background:var(--teal)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:.55em 1.2em;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn-primary{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.row{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1rem}
.check{display:flex;gap:.6rem;align-items:flex-start;font-weight:500;margin-top:1rem}
.check input{width:1.2rem;height:1.2rem;margin-top:.2rem;flex:none}
.msg{margin-top:.8rem;font-weight:600}.msg.err{color:var(--red)}.msg.ok{color:var(--good)}
pre{white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:.8rem;font-size:.8rem;max-height:18rem;overflow:auto}
.shifts a{display:block;text-decoration:none;color:inherit}
.shifts .card:hover{border-color:var(--ink-2)}
</style>

 eating or bathing. Stopped his outpatient antipsychotic 4 months ago. No other medical history. No known allergies. Urine drug screen negative. Weight 76 kg (168 lb). Admission labs normal, including CK 140 units/L (30 to 200) and creatinine 0.9 mg/dL (0.6 to 1.2).", "Medication Administration Record 07:00: Haloperidol 5 mg PO twice daily on days 1 to 3, increased to 10 mg PO twice daily on day 4; last dose 21:00 last night. Haloperidol 5 mg IM PRN severe agitation: given day 4 at 18:30 and day 5 at 22:40, each with lorazepam 2 mg IM. Benztropine 1 mg PO twice daily since day 4. Next haloperidol 10 mg PO due 09:00.", "Flowsheet 07:00: Intake day 5: about 600 mL of fluid, ate 25% of meals. Day 6: about 400 mL of fluid, ate less than 25% of meals. No recorded void since 22:00.", "Vital Signs 07:35: Day 4, 08:00: T 36.9 °C (98.4 °F), HR 82, RR 16, BP 124/78. Day 6, 20:00: T 37.7 °C (99.9 °F), HR 104, RR 18, BP 148/92. Day 7, 07:15: T 39.4 °C (102.9 °F), HR 126, RR 26, BP 168/102, SpO₂ 94% on room air. Day 7, 07:35 recheck: HR 118, BP 112/64.", "Nurses' Notes 07:15: Lying stiffly in bed, staring at the ceiling. Responds to his name only with a groan; does not follow commands. Heavily diaphoretic, skin hot. Both arms resist passive movement steadily through the whole range, like bending a lead pipe. Drooling; coughed on sips of water. Incontinent of a small amount of dark, tea-colored urine. Pupils 4 mm and reactive. No clonus at either ankle. Bowel sounds hypoactive. A peer says he has not gotten out of bed since yesterday afternoon.", "Laboratory Results 08:00 (shown from item 2): CK 9,800 units/L (30 to 200). WBC 15,400/mm³ (5,000 to 10,000). Sodium 149 mEq/L (135 to 145). Potassium 5.2 mEq/L (3.5 to 5). BUN 36 mg/dL (7 to 20). Creatinine 1.9 mg/dL (0.6 to 1.2). AST 156 units/L (10 to 40). Urinalysis: dipstick large blood; microscopy 0 to 2 RBCs/hpf.", "Vital Signs 08:00 (shown from item 4): T 39.8 °C (103.6 °F), HR 130, RR 28, BP 98/58, SpO₂ 93% on room air.", "Nurses' Notes 08:05 (shown from item 4): Rapid response team called to the unit. Psychiatrist and rapid response provider at the bedside; working diagnosis suspected neuroleptic malignant syndrome. Medical intensive care unit consulted for transfer.", "Orders 08:30 (shown from item 5): Hold all antipsychotics. NPO. Second IV. 0.9% sodium chloride 1,000 mL IV bolus, then 200 mL/h. Cooling blanket and ice packs to groin and axillae; target core temperature below 38 °C (100.4 °F). Continuous core temperature and cardiac monitoring. Lorazepam 1 mg IV now and every 4 hours PRN agitation. Indwelling urinary catheter with hourly urine output. Repeat CK and basic metabolic panel in 6 hours. Transfer to the medical intensive care unit; bed ready at 09:30.", "Nurses' Notes 08:35 (shown from item 5): Intermittently thrashing against the side rails and grabbing at the new IV. T 39.9 °C (103.8 °F), HR 132, BP 154/96, then 96/56 five minutes later. Haloperidol 10 mg PO due at 09:00 still active on the MAR.", "Laboratory Results 06:00 (shown from item 6): Day 10. CK: day 7 08:00, 9,800; day 7 14:00, 18,600; day 8 06:00, 12,400; day 10 06:00, 1,900 units/L (30 to 200). Creatinine: day 7 08:00, 1.9; day 7 14:00, 2.1; day 8, 1.6; day 10, 1 mg/dL (0.6 to 1.2).", "Vital Signs 08:00 (shown from item 6): Day 8, 08:00: T 38.1 °C (100.6 °F), HR 108, RR 20, BP 138/84. Day 10, 08:00: T 37 °C (98.6 °F), HR 84, RR 16, BP 126/78, SpO₂ 98% on room air.", "Nurses' Notes 09:00 (shown from item 6): Day 10, medical intensive care transfer note. Dantrolene given for 48 hours, stopped day 9. Rigidity resolved. Alert, oriented to person and place, follows commands. Passed bedside swallow screen. Urine output 60 to 90 mL/h, clear yellow. Still voices paranoid thoughts about staff. Plan: return to psychiatry when medically cleared; no antipsychotic ordered yet.", "", "Refer to the chart.", "", "Highlight the findings in the 07:15 nurses' note that require immediate follow-up.", "", "✓ highlight Responds to his name only with a groan; does not follow commands.", "  Yes: a sharp drop in level of consciousness is altered mental status, a core feature of neuroleptic malignant syndrome. The trap is calling it negative symptoms of schizophrenia.", "✓ highlight Heavily diaphoretic, skin hot.", "  Yes: with a temperature of 39.4 °C (102.9 °F), this is hyperthermia with autonomic instability, not a minor fever to treat later.", "✓ highlight Both arms resist passive movement steadily through the whole range, like bending a lead pipe.", "  Yes: uniform lead-pipe rigidity is the hallmark muscle finding of neuroleptic malignant syndrome and drives heat production and muscle breakdown.", "✓ highlight Drooling; coughed on sips of water.", "  Yes: he cannot swallow safely and is at high risk for aspiration. Nothing more by mouth until he is assessed.", "✓ highlight Incontinent of a small amount of dark, tea-colored urine.", "  Yes: tea-colored urine suggests myoglobin from muscle breakdown, and a small amount after poor intake signals risk for acute kidney injury.", "- Pupils 4 mm and reactive.", "  No: normal pupils are reassuring. They also help, because dilated pupils would point more toward serotonin syndrome.", "- Bowel sounds hypoactive.", "  No: slowed bowels are common with antipsychotics and anticholinergics. Serotonin syndrome would cause hyperactive bowel sounds and diarrhea instead.", "", "Why: Fever, rigidity, unstable blood pressure and pulse, and altered mental status days after a dose increase of a high-potency antipsychotic is the pattern of neuroleptic malignant syndrome. Dysphagia threatens his airway and dark urine points to muscle breakdown. Normal pupils and quiet bowel sounds are useful details but do not need action.", "Tip: Highlight findings that are new and that threaten the airway, temperature control, circulation or the kidneys."], "st": "awaiting"}, {"id": "ngn:cs-nms-2", "hash": "e2eadaed25", "title": "35-year-old on an antipsychotic with new fever and stiffness · item 2 · Matrix · Analyze cues", "body": ["Refer to the chart.", "", "For each finding, indicate whether it is more consistent with neuroleptic malignant syndrome, serotonin syndrome, or catatonia.", "", "- Lead-pipe rigidity with a CK of 9,800 units/L after a haloperidol dose increase → Neuroleptic malignant syndrome", "  severe generalized rigidity with a very high CK, days after a dopamine blocker is increased, is the classic picture of neuroleptic malignant syndrome.", "- Gradual onset over 1 to 3 days, with normal or slowed reflexes → Neuroleptic malignant syndrome", "  neuroleptic malignant syndrome evolves over days. Its muscles are rigid and slow rather than jerky and hyperreflexic.", "- Hyperreflexia with ankle clonus, worse in the legs → Serotonin syndrome", "  clonus and hyperreflexia are the hallmark neuromuscular signs of serotonin toxicity. The trap is calling any abnormal muscle tone rigidity.", "- Dilated pupils, diarrhea and hyperactive bowel sounds within hours of adding a serotonergic drug → Serotonin syndrome", "  serotonin syndrome comes on fast after a new or higher serotonergic dose and overstimulates the gut and pupils.", "- Mutism, posturing and waxy flexibility with normal temperature and vital signs → Catatonia", "  catatonia can look like neuroleptic malignant syndrome, but without fever, autonomic instability or a very high CK it is not the medical emergency.", "- Holds a fixed posture for hours, then loosens after a lorazepam challenge dose → Catatonia", "  rapid improvement with a benzodiazepine challenge supports catatonia. It is also why catatonia must be identified before more antipsychotic is given.", "", "Why: Neuroleptic malignant syndrome, serotonin syndrome and catatonia can all cause altered mental status and abnormal muscle tone, so the details matter. Neuroleptic malignant syndrome evolves over days after a dopamine blocker and causes lead-pipe rigidity, hyperthermia and a very high CK. Serotonin syndrome comes on within hours with clonus, dilated pupils and diarrhea; catatonia causes mutism and posturing without fever or autonomic instability.", "Tip: Anchor each syndrome to its trigger drug, its speed of onset and its signature muscle finding: rigidity, clonus or posturing."], "st": "awaiting"}, {"id": "ngn:cs-nms-3", "hash": "6367fb9019", "title": "35-year-old on an antipsychotic with new fever and stiffness · item 3 · Drop-down · Prioritize hypotheses", "body": ["Refer to the chart.", "", "Complete the sentences.", "", "Blank 1:", "- serotonin syndrome", "  No: he takes no serotonergic drug, and he has rigidity with no clonus, normal pupils and slow bowels. The trap is treating every drug-related fever the same.", "- worsening psychosis", "  No: psychosis does not cause a fever of 39.4 °C (102.9 °F), rigidity or a high CK. The trap is reading a medical emergency as psychiatric.", "✓ neuroleptic malignant syndrome", "  Yes: hyperthermia, lead-pipe rigidity, autonomic instability, altered mental status and a CK of 9,800 units/L after a haloperidol increase meet the classic picture.", "Blank 2:", "- anticholinergic toxicity from the added benztropine", "  No: anticholinergic toxicity causes hot, dry skin and dilated pupils. He is drenched in sweat with normal pupils.", "✓ dopamine blockade from the higher haloperidol dose", "  Yes: sudden, strong dopamine blockade disrupts temperature control in the hypothalamus and muscle tone in the basal ganglia. Dose increases and IM doses raise the risk.", "- excess serotonin activity", "  No: excess serotonin causes clonus, agitation and diarrhea, none of which he has.", "Blank 3:", "- tardive dyskinesia", "  No: tardive dyskinesia develops over months to years of treatment and is not an acute threat.", "✓ acute kidney injury from myoglobin and dehydration", "  Yes: muscle breakdown releases myoglobin that injures the kidneys, and his poor intake makes it worse. His creatinine has already doubled.", "- weight gain", "  No: weight gain is a long-term metabolic effect of antipsychotics, not a concern during this emergency.", "", "Why: The pattern fits neuroleptic malignant syndrome, a rare but potentially fatal reaction to dopamine blockade. Recent dose increases, IM doses, dehydration and agitation all raise the risk. Rhabdomyolysis with acute kidney injury, aspiration and hyperthermia are the threats that kill.", "Tip: Name the condition, link it to the drug that caused it, then pick the complication already showing in the labs."], "st": "awaiting"}, {"id": "ngn:cs-nms-4", "hash": "ffc3eb58b7", "title": "35-year-old on an antipsychotic with new fever and stiffness · item 4 · Select all · Generate solutions", "body": ["Refer to the chart.", "", "The nurse plans care while the client waits for transfer to the medical intensive care unit. Which interventions should the nurse anticipate? Select all that apply.", "", "✓ Prepare for dantrolene or bromocriptine if the provider orders them", "  Yes: in severe cases, providers may add dantrolene to relax muscle or bromocriptine to restore dopamine activity, usually in an intensive care setting.", "- Give cyproheptadine", "  No: cyproheptadine is a serotonin antagonist used for serotonin syndrome. The trap is confusing the two conditions.", "✓ Begin active cooling with a cooling blanket and ice packs to the groin and axillae", "  Yes: the fever comes from rigid muscles and a disrupted hypothalamus, so external cooling works better than relying on an antipyretic.", "✓ Hold all scheduled and PRN antipsychotics", "  Yes: the antipsychotic is the cause. Stopping every dopamine blocker, including PRN doses, is the first and most important treatment.", "✓ Give IV 0.9% sodium chloride", "  Yes: fluids correct his dehydration and keep urine flowing to flush myoglobin and protect the kidneys.", "- Switch to a different antipsychotic now to control his psychosis", "  No: any antipsychotic can worsen the syndrome. Antipsychotics are restarted only after full recovery, cautiously and at a low dose.", "✓ Keep the client NPO", "  Yes: drooling and coughing on sips mean an unsafe swallow, so fluids and medications go IV until his swallow is assessed.", "- Increase the benztropine to relieve the rigidity", "  No: anticholinergics do not treat this rigidity and reduce sweating, which can worsen hyperthermia. The trap is treating it like acute dystonia.", "", "Why: Treatment is to remove the cause and support the body: stop all antipsychotics, cool, give IV fluids, protect the airway, and move to a higher level of care. Dantrolene and bromocriptine are added for severe cases. Benzodiazepines may help agitation and rigidity, but anticholinergics, serotonin antagonists and other antipsychotics do not belong here.", "Tip: Pick interventions that remove the trigger and support temperature, airway, fluids and kidneys; reject treatments borrowed from look-alike conditions."], "st": "awaiting"}, {"id": "ngn:cs-nms-5", "hash": "9c032e1d4a", "title": "35-year-old on an antipsychotic with new fever and stiffness · item 5 · Matrix · Take action", "body": ["Refer to the chart.", "", "For each action, indicate whether the nurse should do it now or avoid it.", "", "- Mark the 09:00 haloperidol as held and confirm the order is discontinued → Do now", "  the drug that caused the reaction has to stop, and a scheduled dose still showing on the MAR is an error waiting to happen during a busy transfer.", "- Give haloperidol 5 mg IM PRN for the thrashing → Avoid", "  more dopamine blockade will worsen the syndrome. His agitation is part of the medical emergency, and the ordered lorazepam is the safer choice.", "- Apply four-point restraints so he cannot pull out his IV → Avoid", "  struggling against restraints increases heat production and muscle breakdown. Secure the IV, stay with him and use the ordered benzodiazepine.", "- Give oral acetaminophen with a sip of water for the fever → Avoid", "  he cannot swallow safely, and antipyretics do little for this centrally driven fever. Physical cooling is the priority.", "- Start the saline bolus and the cooling blanket → Do now", "  fluids protect the kidneys from myoglobin and correct dehydration, and active cooling limits brain and organ injury from hyperthermia.", "- Give the intensive care nurse a handoff that includes the haloperidol timeline, CK, creatinine and intake → Do now", "  a structured handoff with the drug history and labs lets the receiving team trend the CK and kidney function and avoid repeating the trigger.", "", "Why: The nurse's actions remove the trigger, treat hyperthermia and dehydration, and keep him safe without adding heat or more dopamine blockade. Restraints, PRN antipsychotics and oral medications all add harm in this situation. A clear handoff carries the medication timeline to the team that will continue care.", "Tip: Before any action, ask whether it adds heat, adds dopamine blockade or risks aspiration; if it does, avoid it."], "st": "awaiting"}, {"id": "ngn:cs-nms-6", "hash": "cc31b019ff", "title": "35-year-old on an antipsychotic with new fever and stiffness · item 6 · Drop-down · Evaluate outcomes", "body": ["Refer to the chart.", "", "Complete the sentences.", "", "Blank 1:", "✓ improving", "  Yes: his temperature, heart rate, rigidity, mental status, CK and creatinine are all moving back toward normal.", "- unchanged", "  No: nearly every measure is different from day 7, and all of them have moved in the right direction.", "- worsening", "  No: only the first hours of day 7 showed rising values; every measure since then has improved.", "Blank 2:", "- the CK rise between 08:00 and 14:00 on hospital day 7", "  No: CK often keeps rising for a day as muscle breakdown peaks. The trap is judging a trend from its first two points.", "- his ongoing paranoid thoughts", "  No: his psychosis is untreated and expected to persist. It does not measure recovery from the syndrome.", "✓ a falling CK and creatinine with a normal temperature", "  Yes: CK and creatinine trend down and fever is gone, which shows muscle breakdown has stopped and the kidneys are recovering.", "Blank 3:", "- no time at all, because the psychosis needs treatment right now to keep him safe", "  No: restarting now risks a second episode. The trap is letting the psychiatric symptoms override medical safety.", "✓ at least 2 weeks after symptoms resolve, then start at a low dose", "  Yes: standard teaching is to wait at least 2 weeks after recovery, then restart cautiously, often with a lower-potency drug at a low dose and close monitoring.", "- until his temperature has been normal for 24 hours", "  No: a normal temperature for one day is too soon. Early rechallenge carries a high risk of recurrence.", "", "Why: Trending each measure over several days shows recovery: fever, rigidity, mental status, CK and creatinine have all improved. An early CK rise is common and does not mean treatment failed. Ongoing psychosis is expected, and antipsychotics are restarted only after a waiting period, at a low dose, with close watching for recurrence.", "Tip: Judge a trend by its direction across all time points, not by a single early value."], "st": "awaiting"}]}, "packs": [{"id": "drill-med-1", "title": "Drills: Med Pass, part 1 of 3", "sub": "What to check before a medication, then give, hold or call. A pharmacist is especially welcome.", "n": 21, "reviewed": 0, "changed": 0}, {"id": "drill-med-2", "title": "Drills: Med Pass, part 2 of 3", "sub": "What to check before a medication, then give, hold or call. A pharmacist is especially welcome.", "n": 21, "reviewed": 0, "changed": 0}, {"id": "drill-med-3", "title": "Drills: Med Pass, part 3 of 3", "sub": "What to check before a medication, then give, hold or call. A pharmacist is especially welcome.", "n": 21, "reviewed": 0, "changed": 0}, {"id": "drill-first-1", "title": "Drills: Who's First, part 1 of 2", "sub": "Four patients, one nurse: who do you see first, and why not the others.", "n": 18, "r  41-year-old on an SSRI started on a new antibiotic", "sub": "Unfolding case studies: one client, six questions in clinical judgment order.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "cases-5", "title": "Case studies: 69-year-old with COPD and increased sputum; 48-year-old four hours after abdominal hysterectomy; 29-year-old in the ICU after a motorcycle crash", "sub": "Unfolding case studies: one client, six questions in clinical judgment order.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "cases-6", "title": "Case studies: 34-year-old at 34 weeks with painful vaginal bleeding; 26-year-old at 31 weeks with low back ache and cramping; 4-year-old brought to triage with high fever and irritability", "sub": "Unfolding case studies: one client, six questions in clinical judgment order.", "n": 18, "reviewed": 0, "changed": 0}, {"id": "cases-7", "title": "Case studies: 35-year-old on an antipsychotic with new fever and stiffness", "sub": "Unfolding case studies: one client, six questions in clinical judgment order.", "n": 6, "reviewed": 0, "changed": 0}]};</script><script>(()=>{const v=window.Shift||{},d=v.tel,h=window.RI||{packs:[]},p=document.getElementById("app"),i=e=>String(e??"").replace(/[&<>"']/g,a=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[a]),k={awaiting:"Awaiting clinical review",reviewed:"Clinically reviewed",changed:"Changed since its review"},f=e=>(e.reviewed===e.n?'<span class="chip reviewed">Clinically reviewed</span>':`<span class="chip awaiting">${e.reviewed} of ${e.n} reviewed</span>`)+(e.changed?` <span class="chip changed">${e.changed} changed since review</span>`:"");if(!h.pack){const e=[["Drills",a=>a.id.startsWith("drill-")],["NCLEX questions after each shift",a=>a.id.startsWith("ngn-shift")],["NCLEX question bank",a=>a.id.startsWith("bank-")],["Unfolding case studies",a=>a.id.startsWith("cases-")]];p.innerHTML=`<a class="home" href="/">The Shift</a><h1>Clinical review: practice content</h1>
